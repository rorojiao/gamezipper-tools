    clear: '清空',
    scoreBtn: '计算',
    sFlesch: 'Flesch 易读度',
    sFKGL: 'Flesch-Kincaid 年级',
    sGunning: 'Gunning Fog',
    sSMOG: 'SMOG 指数',
    sColeman: 'Coleman-Liau 指数',
    sARI: 'ARI 自动可读性',
    easy: '非常易读', medium: '标准', hard: '较难',
    words: '词', sents: '句', syll: '音节', chars: '字符',
    complexWords: '复杂词',
    verdict: '综合评价',
    verdictEasy: '你的文本通俗易懂。',
    verdictMed: '你的文本处于标准阅读难度。',
    verdictHard: '你的文本难度较高。建议缩短句子、简化词汇。',
    step1: '将文章、论文、博客或任意文本粘贴到输入框',
    step2: '点击「计算」或边输入边实时更新',
    step3: '对比 Flesch 易读度（越高越易读）和年级评分',

});

const { $, t } = GZ;

function analyze(text) {
  const trimmed = text.trim();
  if (!trimmed) return null;
  const words = trimmed.match(/\S+/g) || [];
  const sentences = (trimmed.match(/[^.!?]+[.!?]+/g) || []).length || (words.length ? 1 : 0);
  const chars = trimmed.replace(/\s/g, '').length;
  let totalSyll = 0, complexWords = 0;
  for (const w of words) {
    const s = countSyll(w);
    totalSyll += s;
    if (s >= 3) complexWords++;
  }
  const W = words.length, S = sentences, C = chars;
  const flesch = W && S ? Math.max(0, Math.min(100, 206.835 - 1.015 * (W / S) - 84.6 * (totalSyll / W))) : 0;
  const fkgl = W && S ? 0.39 * (W / S) + 11.8 * (totalSyll / W) - 15.59 : 0;
  const gunning = W && S ? 0.4 * ((W / S) + 100 * (complexWords / W)) : 0;
  // SMOG: 1.0430 * sqrt(complex * (30 / sentences)) + 3.1291
  const smog = S >= 1 ? 1.0430 * Math.sqrt(complexWords * (30 / S)) + 3.1291 : 0;
  // Coleman-Liau uses characters (not syllables): 0.0588*L - 0.296*S - 15.8 (where L=chars/100w, S=sents/100w)
  const L = W ? (C / W) * 100 : 0;
  const S100 = W ? (S / W) * 100 : 0;
  const coleman = 0.0588 * L - 0.296 * S100 - 15.8;
  // ARI: 4.71*(chars/words) + 0.5*(words/sentences) - 21.43
  const ari = 4.71 * (C / W) + 0.5 * (W / S) - 21.43;
  return { W, S, C, totalSyll, complexWords, flesch, fkgl, gunning, smog, coleman, ari };
}

function countSyll(word) {
  word = word.toLowerCase().replace(/[^a-z]/g, '');
  if (!word) return 0;
  if (word.length <= 3) return 1;
  const cleaned = word.replace(/(?:[^laeiouy]|ed|[^laeiouy]e)$/, '').replace(/^y/, '');
  const m = cleaned.match(/[aeiouy]{1,2}/g);
  return m ? m.length : 1;
}

function fleschInterp(v) {
  if (v >= 90) return 'Very easy (5th grade)';
  if (v >= 80) return 'Easy (6th grade)';
  if (v >= 70) return 'Fairly easy (7th)';
  if (v >= 60) return 'Plain English (8-9th)';
  if (v >= 50) return 'Fairly difficult (10-12th)';
  if (v >= 30) return 'Difficult (College)';
  return 'Very difficult (Graduate)';
}

function gradeInterp(g) {
  if (g <= 5) return 'Elementary';
  if (g <= 8) return 'Middle school';
  if (g <= 12) return 'High school';
  if (g <= 16) return 'College';
  return 'Graduate / specialist';
}

function render(text) {
  const a = analyze(text);
  const out = $('#summary');
  const scoresEl = $('#scores');
  const verdictEl = $('#verdict');
  if (!a) {
    out.textContent = '—';
    scoresEl.innerHTML = '';
    verdictEl.innerHTML = '';
    return;
  }
  out.textContent = `${a.W} ${t('words')} · ${a.S} ${t('sents')} · ${a.totalSyll} ${t('syll')} · ${a.complexWords} ${t('complexWords')} · ${a.C} ${t('chars')}`;
  const fleschPct = a.flesch;
  scoresEl.innerHTML = `
    <div class="score">
      <h4>${t('sFlesch')}</h4>
      <div class="val">${a.flesch.toFixed(1)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${fleschPct}%"></div></div>
      <span class="interp">${fleschInterp(a.flesch)}</span>
    </div>
    <div class="score">
      <h4>${t('sFKGL')}</h4>
      <div class="val">${a.fkgl.toFixed(1)}</div>
      <span class="interp">${gradeInterp(a.fkgl)}</span>
    </div>
    <div class="score">
      <h4>${t('sGunning')}</h4>
      <div class="val">${a.gunning.toFixed(1)}</div>
      <span class="interp">${gradeInterp(a.gunning - 1)}</span>
    </div>
    <div class="score">
      <h4>${t('sSMOG')}</h4>
      <div class="val">${a.smog.toFixed(1)}</div>
      <span class="interp">${gradeInterp(a.smog - 1)}</span>
    </div>
    <div class="score">
      <h4>${t('sColeman')}</h4>
      <div class="val">${a.coleman.toFixed(1)}</div>
      <span class="interp">${gradeInterp(a.coleman)}</span>
    </div>
    <div class="score">
      <h4>${t('sARI')}</h4>
      <div class="val">${a.ari.toFixed(1)}</div>
      <span class="interp">${gradeInterp(a.ari)}</span>
    </div>
  `;
  // Verdict based on average grade
  const avgGrade = (a.fkgl + a.gunning + a.smog + a.coleman + a.ari) / 5;
  let verdictText;
  if (avgGrade <= 8) verdictText = `${t('verdict')}: <strong>${avgGrade.toFixed(1)}</strong> — ${t('verdictEasy')}`;
  else if (avgGrade <= 12) verdictText = `${t('verdict')}: <strong>${avgGrade.toFixed(1)}</strong> — ${t('verdictMed')}`;
  else verdictText = `${t('verdict')}: <strong>${avgGrade.toFixed(1)}</strong> — ${t('verdictHard')}`;
  verdictEl.innerHTML = verdictText + ` · <span style="opacity:.7;font-size:0.85em">Avg of 5 grade-level scores</span>`;
}

function loadExample() {
  $('#input').value = `The quick brown fox jumps over the lazy dog. This sentence contains every letter in the English alphabet, which is why typesetters have used it for centuries to test fonts and printing presses.

Readability is more than a number. It is a way of measuring whether your reader will keep reading. Most people skim on screens. They decide within seconds whether your article is worth their time. If your sentences are too long, or your words too obscure, they leave. Even brilliant ideas die in unreadable prose.

Plain language is not dumbing down. It is respecting your reader. You can explain quantum mechanics in language a fifth-grader understands, if you choose the right metaphors. Hemmingway wrote adult novels in short sentences. Carl Sagan explained black holes on television. They proved, again and again, that clarity is a kind of genius.

To write more clearly, first cut every word you do not need. Then cut the next one. Then read your draft aloud. If you run out of breath, your sentence is too long. If you stumble over a phrase, your reader will too. Readability is felt before it is measured.`;
  render($('#input').value);
}

function doClear() { $('#input').value = ''; render(''); }
async function doPaste() {
  try { const text = await navigator.clipboard.readText(); $('#input').value = text; render(text); } catch (e) { $('#input').focus(); }
}

$('#input').addEventListener('input', e => render(e.target.value));
$('#toolbar').innerHTML = `
  <button class="gz-btn" onclick="doPaste()">${t('paste')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="loadExample()">${t('example')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="doClear()">${t('clear')}</button>`;
$('#lbl-in').textContent = t('lblIn');
$('#lbl-out').textContent = t('lblOut');

</script>
