<script>
GZI18n.register({
  en: {
    toolTitle: 'YouTube Hook Generator',
    toolDesc: 'Stop the scroll in 5 seconds. Generate scroll-stopping YouTube video hooks in 8 proven styles — shock, curiosity, story, challenge, list, contrarian, POV and stat. Boost retention and CTR instantly.',

    },

    step3: 'Click Generate Hooks and read each out loud — the best one will feel natural to say',
    step4: 'Click any hook to copy and paste it into your script or teleprompter',
  },
  zh: {
    toolTitle: 'YouTube 视频钩子生成器',
    toolDesc: '5 秒抓住观众注意力。生成 8 种风格的爆款 YouTube 开场钩子——震惊、好奇、故事、挑战、清单、逆向、POV、数据。立即提升留存率。',
    placeholder: '输入视频主题（例如：「AI 工具」「健身减脂」）...',
    generate: '生成钩子',
    styleLabel: '风格',
    copy: '复制',
    copied: '已复制！',
    resultsHint: '点击任一钩子即可复制。建议朗读 2-3 个，挑最顺口的那个。',
    sec: '秒估算',
    styles: {
      all: '全部风格 (24)',
      shock: '⚡ 震惊型',
      curiosity: '🤔 好奇型',
      story: '📖 故事型',
      challenge: '🔥 挑战型',
      list: '📋 清单型',
      contrarian: '🚫 逆向型',
      pov: '👀 第一视角',
      stat: '📊 数据型',
    },
    step1: '输入视频主题（如「健身早餐」「iPhone 评测」）',
    step2: '选择钩子风格，或选「全部风格」一次性获得 24 个变体',
    step3: '点击生成钩子并大声朗读——最顺口的就是最适合你的',
    step4: '点击任一钩子复制，粘贴到脚本或提词器里',
  }
});

const { $, copyText, t } = GZ;
const styleSelect = $('#style');

// 8 styles × 3 hooks each = 24 unique hooks
const HOOK_TEMPLATES = {
  shock: [
    '{Topic} just changed everything. Here\'s why.',
    'You\'ve been doing {Topic} wrong your entire life.',
    'This {Topic} trick will break your brain.',
    'I can\'t believe this {Topic} hack actually works.',
  ],
  curiosity: [
    'There\'s one {Topic} secret nobody talks about.',
    'What if I told you {Topic} could be 10x easier?',
    'The {Topic} question that stumped experts for years.',
    'Wait until you see what happens when you try this {Topic}.',
  ],
  story: [
    'Three months ago, I knew nothing about {Topic}. Now look.',
    'I failed at {Topic} 47 times before this happened.',
    'My dad taught me this {Topic} lesson the hard way.',
    'The day I almost quit {Topic} forever.',
  ],
  challenge: [
    'I\'m going to master {Topic} in just 7 days. Follow along.',
    'Can I learn {Topic} in under 60 minutes? Let\'s find out.',
    'I gave myself 24 hours to figure out {Topic}. Here\'s how it went.',
    'The {Topic} challenge that broke the internet.',
  ],
  list: [
    '5 {Topic} mistakes you\'re making right now.',
    '3 {Topic} tips that took me years to learn.',
    'Here are 7 {Topic} secrets in 60 seconds.',
    'The top 4 {Topic} hacks you need this week.',
  ],
  contrarian: [
    'Stop doing {Topic}. Seriously.',
    'Why everything you know about {Topic} is wrong.',
    'I quit {Topic} for 30 days. Here\'s what happened.',
    '{Topic} is a scam. Here\'s why.',
  ],
  pov: [
    'POV: You just discovered the ultimate {Topic} hack.',
    'POV: It\'s 2 AM and you finally get {Topic}.',
    'POV: You\'re about to become the {Topic} expert in your friend group.',
    'POV: A random Tuesday where you accidentally mastered {Topic}.',
  ],
  stat: [
    '93% of people get {Topic} wrong. Are you one of them?',
    'In the last 30 seconds, 1,000 people failed at {Topic}.',
    '{Topic} users save an average of $2,400 a year. Here\'s how.',
    '1 in 4 {Topic} beginners quit by day 7. Don\'t be that person.',
  ],
};

function estimateSeconds(text) {
  // Average speaking rate: ~150 words/min = 2.5 words/sec
  const words = text.split(/\s+/).length;
  return Math.max(2, Math.round((words / 2.5) * 10) / 10);
}

function capitalize(s) {
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function generateHooks() {
  let topic = $('#topic').value.trim();
  if (!topic) {
    $('#results').innerHTML = `<p style="color:var(--gz-accent);padding:12px">${t('placeholder')}</p>`;
    return;
  }
  topic = capitalize(topic);
  const style = styleSelect.value;

  let hooks = [];
  if (style === 'all') {
    for (const key of Object.keys(HOOK_TEMPLATES)) {
      for (const tpl of HOOK_TEMPLATES[key]) {
        hooks.push({ style: key, text: tpl.replace(/\{Topic\}/g, topic) });
      }
    }
  } else {
    hooks = (HOOK_TEMPLATES[style] || HOOK_TEMPLATES.curiosity).map(tpl => ({
      style,
      text: tpl.replace(/\{Topic\}/g, topic),
    }));
  }

  renderResults(hooks);
  $('#counter').textContent = `${hooks.length} ${t('generate').toLowerCase().replace(/s$/,'')}s · ${t('resultsHint')}`;
}

function renderResults(hooks) {
  const html = hooks.map((h, i) => {
    const sec = estimateSeconds(h.text);
    return `<div class="yh-card">
      <span class="yh-num">${i+1}</span>
      <div class="yh-body" onclick="window.__yhCopy('${h.text.replace(/'/g, "\\'")}', this)">
        <div>${h.text}</div>
        <div class="yh-meta">
          <span class="yh-tag">${HOOK_TEMPLATES[h.style] ? t('styles.' + h.style) : h.style}</span>
          <span>~${sec} ${t('sec')}</span>
          <span>${h.text.split(/\s+/).length} words</span>
        </div>
      </div>
      <button class="yh-copy" onclick="window.__yhCopy('${h.text.replace(/'/g, "\\'")}', this)">${t('copy')}</button>
    </div>`;
  }).join('');
  $('#results').innerHTML = html;
}

window.__yhCopy = function(text, el) {
  copyText(text);
  const orig = el.textContent;
  el.textContent = '✓ ' + t('copied');
  setTimeout(() => { el.textContent = orig; }, 1200);
};

$('#genBtn').addEventListener('click', generateHooks);
$('#topic').addEventListener('keydown', e => { if (e.key === 'Enter') generateHooks(); });
styleSelect.addEventListener('change', () => { if ($('#topic').value.trim()) generateHooks(); });

// Populate style dropdown
Object.entries(t('styles')).forEach(([k, v]) => {
  const opt = document.createElement('option');
  opt.value = k;
  opt.textContent = v;
  styleSelect.appendChild(opt);
});

GZ.renderToolPage({
  category: 'text',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],

    {icon:'✍️', href:'/text/essay-hook-generator.html', name:'Essay Hooks'},
  ]
});
</script>
