<script>
// ============ R445: Alphabetizer — multi-mode sort + group-by-letter ============
const { $, t } = GZ;

function getOptions() {
  return {
    order: $('#sort-order').value,
    mode: $('#sort-mode').value,
    caseInsensitive: $('#opt-case').checked,
    dedup: $('#opt-dedup').checked,
    trim: $('#opt-trim').checked,
    skipBlank: $('#opt-skip-blank').checked,
    stripNumbers: $('#opt-strip-numbers').checked,
  };
}

function getLines(opts) {
  let raw = $('#input').value.split('\n');
  if (opts.trim) raw = raw.map(s => s.trim());
  if (opts.skipBlank) raw = raw.filter(Boolean);
  if (opts.stripNumbers) raw = raw.map(s => s.replace(/^\s*\d+[.)]\s*/, ''));
  return raw;
}

function prepareForSort(arr, opts) {
  if (opts.dedup) {
    const seen = new Set();
    const out = [];
    for (const s of arr) {
      const key = opts.caseInsensitive ? s.toLocaleLowerCase() : s;
      if (!seen.has(key)) { seen.add(key); out.push(s); }
    }
    arr = out;
  }
  return arr;
}

function sortLines(lines, opts) {
  let sorted;
  if (opts.mode === 'numeric') {
    const naturalCmp = (a, b) => a.localeCompare(b, undefined, {numeric: true, sensitivity: opts.caseInsensitive ? 'base' : 'variant'});
    sorted = [...lines].sort(naturalCmp);
  } else if (opts.mode === 'length') {
    sorted = [...lines].sort((a, b) => a.length - b.length || a.localeCompare(b));
  } else if (opts.mode === 'unicode') {
    sorted = [...lines].sort((a, b) => {
      const aa = opts.caseInsensitive ? a.toLowerCase() : a;
      const bb = opts.caseInsensitive ? b.toLowerCase() : b;
      for (let i = 0; i < Math.min(aa.length, bb.length); i++) {
        if (aa.charCodeAt(i) !== bb.charCodeAt(i)) return aa.charCodeAt(i) - bb.charCodeAt(i);
      }
      return aa.length - bb.length;
    });
  } else { // locale
    sorted = [...lines].sort((a, b) => a.localeCompare(b, 'en-US', {sensitivity: opts.caseInsensitive ? 'base' : 'variant'}));
  }
  if (opts.order === 'desc') sorted.reverse();
  return sorted;
}

function groupByLetter(items) {
  const groups = {};
  for (const it of items) {
    const first = it.trim()[0] || '?';
    const letter = first.toUpperCase().match(/[A-Z]/)?.[0] || '#';
    (groups[letter] = groups[letter] || []).push(it);
  }
  // sort each group internally
  for (const k of Object.keys(groups)) groups[k].sort((a,b)=>a.localeCompare(b));
  return groups;
}

function showToast(msg) {
  const tt = document.createElement('div');
  tt.className = 'toast';
  tt.textContent = msg;
  document.body.appendChild(tt);
  setTimeout(()=>tt.remove(), 1200);
}

function render() {
  const opts = getOptions();
  const rawLines = getLines(opts);
  const sorted = sortLines(prepareForSort(rawLines, opts), opts);
  const dedupRemoved = rawLines.length - sorted.length;
  $('#output').value = sorted.join('\n');

  // stats
  $('#stat-input').textContent = rawLines.length.toLocaleString();
  $('#stat-output').textContent = sorted.length.toLocaleString();
  $('#stat-dedup').textContent = dedupRemoved.toLocaleString();
  const groups = groupByLetter(sorted);
  $('#stat-letters').textContent = Object.keys(groups).length.toLocaleString();
  $('#stat-longest').textContent = sorted.reduce((m, s) => Math.max(m, s.length), 0).toLocaleString();

  // render grouped alpha view
  const letters = Object.keys(groups).sort();
  const av = $('#alpha-view');
  if (sorted.length > 0 && sorted.length <= 5000) {
    av.style.display = 'block';
    av.innerHTML = letters.map(letter => `
      <div class="alpha-section">
        <div class="letter" onclick="this.parentElement.classList.toggle('collapsed');this.querySelector('.toggle').textContent=this.parentElement.classList.contains('collapsed')?'▶':'▼'">
          <span>${letter}</span>
          <span style="display:flex;gap:8px;align-items:center"><span class="count">${groups[letter].length} item${groups[letter].length!==1?'s':''}</span><span class="toggle">▼</span></span>
        </div>
        <div class="items">${groups[letter].map(s=>`<span data-word="${s.replace(/"/g,'&quot;')}">${s.replace(/</g,'&lt;')}</span>`).join('')}</div>
      </div>
    `).join('');
    av.querySelectorAll('.items span').forEach(s => {
      s.addEventListener('click', () => {
        navigator.clipboard?.writeText(s.dataset.word);
        showToast('✓ Copied: ' + s.dataset.word);
      });
    });
  } else {
    av.style.display = 'none';
  }
}

function shuffle() {
  const lines = $('#input').value.split('\n').filter(Boolean);
  for (let i = lines.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [lines[i], lines[j]] = [lines[j], lines[i]];
  }
  $('#input').value = lines.join('\n');
  render();
}

function reverseInput() {
  const lines = $('#input').value.split('\n');
  $('#input').value = lines.reverse().join('\n');
  render();
}

function swap() {
  const a = $('#input').value;
  $('#input').value = $('#output').value;
  $('#output').value = a;
  render();
}

function loadSample() {
  $('#input').value = `Banana
apple
Cherry
Apple
date
3. Eggplant
fig
Grape
1. kiwi
lemon
mango
nectarine
orange
pear
Quince
raspberry
strawberry
tangerine
Watermelon
zucchini`;
  render();
}

function clearAll() {
  $('#input').value = '';
  $('#output').value = '';
  render();
}

document.getElementById('btn-sort').addEventListener('click', render);
document.getElementById('btn-copy').addEventListener('click', () => {
  navigator.clipboard?.writeText($('#output').value);
  showToast('✓ Copied ' + $('#output').value.split('\n').length + ' lines');
});
document.getElementById('btn-swap').addEventListener('click', swap);
document.getElementById('btn-shuffle').addEventListener('click', shuffle);
document.getElementById('btn-reverse').addEventListener('click', reverseInput);
document.getElementById('btn-sample').addEventListener('click', loadSample);
document.getElementById('btn-clear').addEventListener('click', clearAll);

// Live re-sort on any option change
['sort-order','sort-mode','opt-case','opt-dedup','opt-trim','opt-skip-blank','opt-strip-numbers'].forEach(id => {
  document.getElementById(id).addEventListener('change', render);
});
// Live re-sort on input with debounce
let debounceT = null;
document.getElementById('input').addEventListener('input', () => {
  clearTimeout(debounceT);
  debounceT = setTimeout(render, 220);
});

// Initial sample so the page demonstrates
loadSample();

GZI18n.register({

    lblInput: 'Input — paste your list (one per line)',

  },
  zh: {

    toolDesc: '为任意单词、姓名、项目或短句按字母 A 到 Z 或 Z 到 A 排序。支持去重、数字排序、按长度排序、按首字母分组。快速、免费、100% 浏览器本地运行。',
    step1: '将列表粘贴或输入左侧框中，每行一项',
    step2: '选择排序选项（忽略大小写、去重、本地化排序…）',
    step3: '点击立即排序或看着输出实时更新',
    step4: '复制结果，或浏览下方的按首字母分组视图',
    lblInput: '输入 — 粘贴你的列表（每行一项）',
    lblOutput: '排序输出'
  }
});
$('#lbl-input').textContent = t('lblInput');
$('#lbl-output').textContent = t('lblOutput');

GZ.renderToolPage({

  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'↕️', href:'/text/sort-lines.html', name:'Sort Lines'},
    {icon:'🔢', href:'/text/number-sorter.html', name:'Number Sorter'},
    {icon:'🔀', href:'/text/text-shuffler.html', name:'Text Shuffler'},
    {icon:'🧹', href:'/text/remove-duplicates.html', name:'Remove Duplicates'},
    {icon:'📊', href:'/text/word-frequency.html', name:'Word Frequency'},
    {icon:'🔁', href:'/text/reverse-lines.html', name:'Reverse Lines'}
  ]
});
</script>
