<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "What is an AGENTS.md file?", "acceptedAnswer": {"@type": "Answer", "text": "AGENTS.md is an open, plain-Markdown format that tells AI coding agents how to work in your repository — often described as a README for agents. It documents setup commands, build and test steps, coding conventions and workflow rules, so tools like OpenAI Codex, Jules, Cursor, Factory and other agents read the same instructions instead of guessing. It lives at the root of the repo and is committed like any other file."}}, {"@type": "Question", "name": "Which AI coding tools read AGENTS.md?", "acceptedAnswer": {"@type": "Answer", "text": "OpenAI Codex reads AGENTS.md automatically. Amp, Cursor, Jules, Gemini CLI, Factory, Zed and most agentic tools support it either natively or via a small config. Claude Code uses CLAUDE.md, but a one-line bridge file containing @AGENTS.md makes Claude load the same content — this generator can produce that bridge for you."}}, {"@type": "Question", "name": "Should I use AGENTS.md or CLAUDE.md or .cursorrules?", "acceptedAnswer": {"@type": "Answer", "text": "Write shared instructions once in AGENTS.md, then bridge the tool-specific files to it: CLAUDE.md with the line @AGENTS.md, and Cursor project rules pointing at the same conventions. That way one file stays the source of truth and never drifts. .cursorrules is the legacy Cursor format — new projects should use .cursor/rules/*.mdc instead."}}, {"@type": "Question", "name": "Is my project information uploaded to a server?", "acceptedAnswer": {"@type": "Answer", "text": "No. The file is assembled entirely in your browser with plain JavaScript. Nothing you type is sent, logged or stored anywhere — copy or download the Markdown and commit it yourself."}}]}</script>

<script>
GZI18n.register({
  en: {
    toolTitle: 'AGENTS.md Generator',
    toolDesc: 'Generate an AGENTS.md that tells Codex, Claude Code, Cursor and other AI coding agents exactly how to build, test and work in your project. Pick a preset, fill your commands, copy or download — nothing is uploaded.',
    pNode: 'Node / TypeScript', pPython: 'Python', pGo: 'Go', pMono: 'Monorepo', pBlank: 'Blank',
    presets: 'Preset:',
    lName: 'Project name', lDesc: 'One-line description', lOverview: 'Project overview (what it does, architecture, key directories)',
    lSetup: 'Setup / install command', lDev: 'Dev / run command', lBuild: 'Build command', lTest: 'Test command(s)',
    lLint: 'Lint / format command(s)', lStyle: 'Code style & conventions (one per line)', lRules: 'Workflow rules for the agent (one per line)',
    lClaude: 'Also generate a CLAUDE.md bridge file (contains @AGENTS.md)',
    copy: 'Copy Markdown', dlAgents: 'Download AGENTS.md', dlClaude: 'Download CLAUDE.md', clear: 'Reset',
    output: 'Preview — AGENTS.md',
    step1: 'Pick a stack preset (Node/TypeScript, Python, Go, Monorepo) — the commands and conventions fields pre-fill with sensible defaults you can edit.',
    step2: 'Fill in the real commands your repo uses: setup, dev, build, test, lint. Agents follow these literally, so paste exactly what works on a fresh clone.',
    step3: 'List coding conventions and workflow rules one per line — naming style, framework patterns, "never commit generated files", "run tests before finishing".',
    step4: 'Copy the Markdown or download AGENTS.md, commit it to the repo root, and optionally download the CLAUDE.md bridge so Claude Code reads the same instructions.',
  },
  zh: {
    toolTitle: 'AGENTS.md 生成器',
    toolDesc: '生成 AGENTS.md，让 Codex、Claude Code、Cursor 等 AI 编程代理准确知道如何构建、测试和改动你的项目。选择预设、填写命令、复制或下载 — 数据不上传。',
    pNode: 'Node / TypeScript', pPython: 'Python', pGo: 'Go', pMono: 'Monorepo', pBlank: '空白',
    presets: '预设：',
    lName: '项目名称', lDesc: '一句话描述', lOverview: '项目概述（功能、架构、关键目录）',
    lSetup: '安装 / 初始化命令', lDev: '开发 / 运行命令', lBuild: '构建命令', lTest: '测试命令',
    lLint: 'Lint / 格式化命令', lStyle: '代码风格与约定（每行一条）', lRules: '给代理的工作流规则（每行一条）',
    lClaude: '同时生成 CLAUDE.md 桥接文件（内容为 @AGENTS.md）',
    copy: '复制 Markdown', dlAgents: '下载 AGENTS.md', dlClaude: '下载 CLAUDE.md', clear: '重置',
    output: '预览 — AGENTS.md',
    step1: '选择技术栈预设（Node/TypeScript、Python、Go、Monorepo），命令与约定栏会自动填入可编辑的合理默认值。',
    step2: '填写仓库真实使用的命令：安装、开发、构建、测试、Lint。代理会严格照做，请直接粘贴全新克隆后可运行的命令。',
    step3: '每行一条列出代码约定和工作流规则 — 命名风格、框架模式、「禁止提交生成文件」「完成前必须跑测试」等。',
    step4: '复制 Markdown 或下载 AGENTS.md 提交到仓库根目录；可同时下载 CLAUDE.md 桥接文件，让 Claude Code 读取同一份说明。',
  }
});

const { $, copyText, t } = GZ;

const PRESETS = {
  node: {setup:'npm install', dev:'npm run dev', build:'npm run build', test:'npm test', lint:'npm run lint && npm run format',
    style:'TypeScript strict mode; no `any` without a comment.\nUse the existing UI components in src/components before adding new ones.\nPrefer named exports; one component per file.',
    rules:'Run `npm test` before declaring a task done.\nNever edit files under src/generated.\nNever add a dependency without checking package.json first.'},
  python: {setup:'pip install -r requirements-dev.txt', dev:'python -m app', build:'python -m build', test:'pytest', lint:'ruff check . && black .',
    style:'Type hints on all public functions.\nGoogle-style docstrings.\nBlack line length 88.',
    rules:'Run `pytest` before declaring a task done.\nNever commit __pycache__ or .venv.\nAdd a regression test for every bug fix.'},
  go: {setup:'go mod download', dev:'go run ./cmd/server', build:'go build ./...', test:'go test ./...', lint:'go vet ./... && gofmt -l .',
    style:'gofmt-formatted code only.\nTable-driven tests.\nErrors wrapped with %w.',
    rules:'Run `go test ./...` before declaring a task done.\nKeep packages small; no circular imports.\nNever edit *_test golden files by hand.'},
  mono: {setup:'pnpm install', dev:'pnpm dev', build:'pnpm build', test:'pnpm -r test', lint:'pnpm lint',
    style:'Shared code lives in packages/shared only.\nImport between apps only via package names, never relative paths across packages.',
    rules:'Run affected package tests only (`pnpm --filter <pkg> test`).\nUpdate the workspace lockfile with pnpm, never npm.\nNever edit dist/ or node_modules/.'},
  blank: {setup:'', dev:'', build:'', test:'', lint:'', style:'', rules:''},
};
let preset = 'node';
const F = ['name','desc','overview','setup','dev','build','test','lint','style','rules'];

function renderPresets(){
  $('#presets').innerHTML = Object.keys(PRESETS).map(k =>
    `<button class="gz-btn${k===preset?'':' gz-btn-secondary off'}" onclick="setPreset('${k}')">${t('p'+k.charAt(0).toUpperCase()+k.slice(1))}</button>`).join('');
}
function setPreset(k){
  preset = k;
  const p = PRESETS[k];
  ['setup','dev','build','test','lint','style','rules'].forEach(f => $('#f-'+f).value = p[f]);
  renderPresets(); gen();
}
function val(id){ return $('#f-'+id).value.trim(); }
function lines(s){ return s.split('\n').map(x=>x.trim()).filter(Boolean); }

function gen(){
  const name = val('name') || 'my-project';
  let md = '# ' + (val('desc') ? name + ' — ' + val('desc') : name) + '\n\n';
  md += '## Project Overview\n' + (val('overview') || '(describe what the project does, its architecture and key directories)') + '\n\n';
  md += '## Commands\n';
  const cmds = [['Setup', val('setup')], ['Run dev server', val('dev')], ['Build', val('build')], ['Test', val('test')], ['Lint / format', val('lint')]];
  md += cmds.filter(c=>c[1]).map(c=>`- **${c[0]}:** \`${c[1]}\``).join('\n') + '\n\n';
  if (val('style')) md += '## Code Style\n' + lines(val('style')).map(l=>'- '+l).join('\n') + '\n\n';
  if (val('rules')) md += '## Agent Workflow Rules\n' + lines(val('rules')).map(l=>'- '+l).join('\n') + '\n\n';
  md += '## General Notes\n- Prefer small, focused changes.\n- Ask before adding new dependencies.\n- Do not commit secrets or .env files.\n';
  $('#out-area').textContent = md;
}
function mdText(){ return $('#out-area').textContent; }
function claudeText(){ return '@AGENTS.md\n\n<!-- Shared instructions live in AGENTS.md — keep Claude-specific overrides below this line. -->\n'; }
function dl(text, fname){
  const blob = new Blob([text], {type:'text/markdown'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname; a.click();
}

F.forEach(f => { const el=$('#f-'+f); if(el) el.addEventListener('input', gen); });
$('#f-claude').addEventListener('change', renderToolbar);
function renderToolbar(){
  const showClaude = $('#f-claude').checked;
  $('#tb').innerHTML =
    `<button class="gz-btn" onclick="copyText(mdText())">${t('copy')}</button>` +
    `<button class="gz-btn gz-btn-secondary" onclick="dl(mdText(),'AGENTS.md')">${t('dlAgents')}</button>` +
    (showClaude ? `<button class="gz-btn gz-btn-secondary" onclick="dl(claudeText(),'CLAUDE.md')">${t('dlClaude')}</button>` : '') +
    `<button class="gz-btn gz-btn-secondary" onclick="resetAll()">${t('clear')}</button>`;
}
function resetAll(){ setPreset('node'); }

['name','desc','overview','setup','dev','build','test','lint','style','rules','claude'].forEach(k => {
  const el = document.getElementById('l-'+k); if (el) el.textContent = t('l'+k.charAt(0).toUpperCase()+k.slice(1));
});
renderPresets(); renderToolbar(); setPreset('node');

GZ.renderToolPage({
  category: 'dev',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'🔌', href:'/dev/mcp-config-generator.html', name:'MCP Config Generator'},
    {icon:'📝', href:'/text/markdown-editor.html', name:'Markdown Editor'},
    {icon:'🐳', href:'/dev/docker-compose-generator.html', name:'Docker Compose Generator'},
    {icon:'⚙️', href:'/dev/env-generator.html', name:'.env Generator'},
  ]
});
</script>
