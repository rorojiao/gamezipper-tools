<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is FLUX and how is its prompt style different?","acceptedAnswer":{"@type":"Answer","text":"FLUX.1 is an open-source image model from Black Forest Labs that uses a T5-XXL text encoder. Unlike Stable Diffusion or Midjourney, FLUX reads natural-language paragraphs — full sentences with grammar — far better than comma-separated keyword tags. Prompts like 'A red fox resting on a moss-covered log, lit by golden hour light' outperform tag-style lists."}},{"@type":"Question","name":"Does this tool generate images?","acceptedAnswer":{"@type":"Answer","text":"No. It only assembles the natural-language prompt text. Paste the result into ComfyUI, Replicate, fal.ai, SeaArt, Tensor.Art or the official FLUX playground to render. Nothing is uploaded to any server."}},{"@type":"Question","name":"Which FLUX variants are supported?","acceptedAnswer":{"@type":"Answer","text":"FLUX.1 [dev] (open-source, fine-tunable), FLUX.1 [schnell] (fast 1-4 step distilled) and FLUX.1 [pro] (highest quality commercial). All three read the same natural-language prompt style; the variant selector mainly affects UI defaults and copy labels."}},{"@type":"Question","name":"Should I use comma tags or full sentences?","acceptedAnswer":{"@type":"Answer","text":"Full sentences. FLUX's T5 encoder parses grammar, so prompt order matters: subject → framing → scene → lighting → lens → mood → style anchor. This tool stitches your selected chips into that order as a paragraph."}},{"@type":"Question","name":"Is the FLUX prompt generator free?","acceptedAnswer":{"@type":"Answer","text":"Yes — completely free, no signup, runs entirely in your browser. No prompt, image or usage data is ever sent to a server."}}]}</script>

<script>
GZI18n.register({
  en: {
    toolTitle: 'FLUX Prompt Generator',
    toolDesc: 'Build natural-language paragraph prompts for FLUX.1 dev, schnell and pro. Pick a subject, scene, framing, lighting, lens and style — get a flowing sentence the T5 encoder reads best. Free, browser-only, no AI signup.',
    lblVariant: 'FLUX variant',
    lblSubject: 'Subject',
    lblScene: 'Scene / environment',
    lblFraming: 'Framing & camera angle',
    lblLight: 'Lighting',
    lblLens: 'Lens & focal length',
    lblStyle: 'Style anchor',
    lblMood: 'Mood / atmosphere',
    lblDetail: 'Fine details (optional)',
    lblWeight: 'Emphasis strength (multiplier)',
    lblAr: 'Aspect ratio',
    lblExtra: 'Extra tokens (e.g. film stock)',
    lblIn: 'Composition', lblOut: 'Generated prompt',
    copy: 'Copy', dl: 'Download .txt',
    example: 'Load example',
    clear: 'Clear',
    step1: 'Pick a FLUX variant (dev, schnell or pro)',
    step2: 'Type the subject — a concrete noun phrase, not abstract feelings',
    step3: 'Describe the scene and toggle chips for framing, lighting, lens, style and mood',
    step4: 'Copy the natural-language paragraph into ComfyUI, Replicate, fal.ai or SeaArt',
  },
  zh: {
    toolTitle: 'FLUX 提示词生成器',
    toolDesc: '为 FLUX.1 dev、schnell 和 pro 构建自然语言段落提示词。选择主体、场景、构图、光线、镜头和风格 — 生成 T5 编码器最容易读的连贯段落。免费、浏览器本地运行、无需 AI 注册。',
    lblVariant: 'FLUX 版本',
    lblSubject: '主体',
    lblScene: '场景 / 环境',
    lblFraming: '构图与镜头角度',
    lblLight: '光线',
    lblLens: '镜头与焦段',
    lblStyle: '风格锚点',
    lblMood: '情绪 / 氛围',
    lblDetail: '细节（可选）',
    lblWeight: '强调强度（倍数）',
    lblAr: '宽高比',
    lblExtra: '额外标签（如胶片型号）',
    lblIn: '画面构成', lblOut: '生成的提示词',
    copy: '复制', dl: '下载 .txt',
    example: '载入示例',
    clear: '清空',
    step1: '选择 FLUX 版本（dev、schnell 或 pro）',
    step2: '输入主体 — 用具体名词短语，不要写抽象感受',
    step3: '描述场景，并切换构图、光线、镜头、风格和情绪的标签',
    step4: '将自然语言段落复制到 ComfyUI、Replicate、fal.ai 或 SeaArt',
  }
});

const { $, copyText, t } = GZ;

const FRAMING = ['close-up','medium shot','three-quarter shot','wide shot','full body','extreme close-up','over-the-shoulder','from above','low angle','portrait orientation','landscape orientation'];
const LIGHT   = ['golden hour light','soft studio lighting','dramatic chiaroscuro','volumetric god rays','overcast diffused light','neon night light','rim light','natural daylight','candlelight','moonlit','backlit silhouette','rim-lit by warm light'];
const LENS    = ['shot on 35mm film','shot on 50mm prime','shot on 85mm portrait lens','shot on 24mm wide-angle','macro lens detail','telephoto compression','cinematic anamorphic','iPhone-style natural','medium format film','35mm analog grain'];
const STYLE   = ['photorealistic','cinematic still','editorial fashion photography','documentary photojournalism','fine art photography','analog film photograph','commercial product photography','concept art','digital painting','hyperrealistic render'];
const MOOD    = ['calm and serene','moody and atmospheric','energetic and dynamic','dreamlike and ethereal','melancholic','joyful and warm','mysterious','intimate and quiet','epic and grand','nostalgic'];

const picked = { framing:[], light:[], lens:[], style:[], mood:[] };

function buildSet(container, arr, key) {
  arr.forEach(label => {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => {
      const a = picked[key], i = a.indexOf(label);
      if (i >= 0) { a.splice(i, 1); b.classList.remove('on'); }
      else { a.push(label); b.classList.add('on'); }
      render();
    };
    container.appendChild(b);
  });
}
buildSet($('#framing-chips'), FRAMING, 'framing');
buildSet($('#light-chips'),   LIGHT,   'light');
buildSet($('#lens-chips'),    LENS,    'lens');
buildSet($('#style-chips'),   STYLE,   'style');
buildSet($('#mood-chips'),    MOOD,    'mood');

const $weight = $('#weight');
const $weightV = $('#weight-v');
$weight.addEventListener('input', () => {
  $weightV.textContent = ($weight.value / 10).toFixed(1);
  render();
});

function joinList(arr, lead) {
  if (!arr.length) return '';
  if (arr.length === 1) return lead ? lead + ' ' + arr[0] : arr[0];
  const last = arr.pop();
  const out = arr.join(', ') + ' and ' + last;
  arr.push(last);
  return lead ? lead + ' ' + out : out;
}

function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

function render() {
  const subj = $('#subject').value.trim();
  if (!subj) {
    $('#output').textContent = t('empty') || 'Describe a subject on the left — your FLUX prompt will appear here.';
    $('#meta').innerHTML = '';
    $('#copyBtn').style.display = $('#dlBtn').style.display = 'none';
    return;
  }
  const scene = $('#scene').value.trim();
  const detail = $('#detail').value.trim();
  const extra = $('#extra').value.trim();
  const ar = $('#ar').value;
  const variant = $('#variant').value;

  const parts = [];
  parts.push(cap(subj));
  if (picked.framing.length) parts.push(joinList(picked.framing.slice(), 'shown as a'));
  if (scene) parts.push(scene.startsWith(',') ? scene : 'in ' + scene);
  if (picked.light.length) parts.push('lit by ' + joinList(picked.light.slice(), ''));
  if (picked.lens.length) parts.push(joinList(picked.lens.slice(), 'captured'));
  if (detail) parts.push(detail);
  if (picked.style.length) parts.push(joinList(picked.style.slice(), 'rendered as'));
  if (picked.mood.length) parts.push('with a ' + joinList(picked.mood.slice(), '') + ' mood');
  if (extra) parts.push(extra);

  let prompt = parts.join(', ');
  prompt = prompt.replace(/, ,/g, ',').replace(/\s+/g, ' ').trim();

  const variantTag = variant === 'schnell' ? '[FLUX.1 schnell]' : variant === 'pro' ? '[FLUX.1 pro]' : '[FLUX.1 dev]';
  const arNote = `\n\n--aspect-ratio ${ar} (set in your UI, not as inline text)`;
  $('#output').textContent = prompt + arNote;

  // meta
  const wc = prompt.split(/\s+/).length;
  const cc = prompt.length;
  $('#meta').innerHTML =
    `<span>Variant: <b>${variantTag}</b></span>` +
    `<span>Words: <b>${wc}</b></span>` +
    `<span>Chars: <b>${cc}</b></span>` +
    `<span>Selected chips: <b>${picked.framing.length + picked.light.length + picked.lens.length + picked.style.length + picked.mood.length}</b></span>` +
    `<span>Aspect: <b>${ar}</b></span>`;
  $('#copyBtn').style.display = $('#dlBtn').style.display = '';
}

$('#subject').addEventListener('input', render);
$('#scene').addEventListener('input', render);
$('#detail').addEventListener('input', render);
$('#extra').addEventListener('input', render);
$('#variant').addEventListener('change', render);
$('#ar').addEventListener('change', render);

function loadExample() {
  $('#variant').value = 'dev';
  $('#subject').value = 'a copper-haired woman in a cream linen blazer';
  $('#scene').value = 'on a Lisbon balcony overlooking terracotta rooftops at sunset';
  $('#detail').value = 'hair moved by a warm breeze, sunlit freckles, soft skin texture';
  $('#extra').value = 'Kodak Portra 400 color palette';
  $('#ar').value = '3:2';
  picked.framing = ['medium shot','three-quarter shot'];
  picked.light = ['golden hour light','rim-lit by warm light'];
  picked.lens = ['shot on 85mm portrait lens'];
  picked.style = ['editorial fashion photography'];
  picked.mood = ['intimate and quiet','nostalgic'];
  document.querySelectorAll('.chips button').forEach(b => b.classList.remove('on'));
  [['framing',picked.framing],['light',picked.light],['lens',picked.lens],['style',picked.style],['mood',picked.mood]].forEach(([k,arr]) => {
    [...$('#'+k+'-chips').children].forEach(b => b.classList.toggle('on', arr.includes(b.textContent)));
  });
  $weight.value = 10; $weightV.textContent = '1.0';
  render();
}

function doClear() {
  $('#subject').value = ''; $('#scene').value = ''; $('#detail').value = ''; $('#extra').value = '';
  Object.keys(picked).forEach(k => picked[k] = []);
  document.querySelectorAll('.chips button').forEach(b => b.classList.remove('on'));
  render();
}

function doCopy() { copyText($('#output').textContent); }
function doDownload() {
  const text = $('#output').textContent;
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `flux-prompt-${Date.now()}.txt`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

$('#copyBtn').onclick = doCopy;
$('#dlBtn').onclick = doDownload;

$('#toolbar').innerHTML = `
  <button class="gz-btn" onclick="render()">${t('generate')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="loadExample()">${t('example')}</button>
  <button class="gz-btn" onclick="doCopy()">${t('copy')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="doClear()">${t('clear')}</button>`;

render();

GZ.renderToolPage({
  category: 'text',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'🎨', href:'/text/midjourney-prompt-builder.html', name:'Midjourney Prompt Builder'},
    {icon:'🖼️', href:'/text/sd-prompt-builder.html', name:'SD Prompt Builder'},
    {icon:'🤖', href:'/text/ai-image-prompt-generator.html', name:'AI Image Prompts'},
    {icon:'🧠', href:'/dev/system-prompt-builder.html', name:'System Prompt Builder'},
  ]
});
</script>
