const { $, copyText, t } = GZ;
let indent = 2;

function syntaxHighlight(json) {
  return json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/("(?:\\u[\da-fA-F]{4}|\\[^u]|[^\\"])*"(?:\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g, m => {
      let c = 'json-number';
      if (/^"/.test(m)) c = /:$/.test(m) ? 'json-key' : 'json-string';
      else if (/true|false/.test(m)) c = 'json-bool';
      else if (/null/.test(m)) c = 'json-null';
      return `<span class="${c}">${m}</span>`;
    });
}

function parseScalar(val, hasQuotes) {
  if (hasQuotes) return val;
  const v = val.trim();
  if (v === '' || v === '~' || v === 'null') return null;
  if (v === 'true' || v === 'True' || v === 'TRUE') return true;
  if (v === 'false' || v === 'False' || v === 'FALSE') return false;
  if (/^-?\d+$/.test(v)) return parseInt(v);
  if (/^-?\d+\.\d+([eE][+-]?\d+)?$/.test(v)) return parseFloat(v);
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  return v;
}

function yamlToJson(yaml) {
  const lines = yaml.split('\n');
  const anchors = {};
  let inMultiline = null;
  let multilineBuffer = [];
  let multilineIndent = -1;
  let multilineFold = false;
  let multilineChomp = false;
  let result = null;
  let rootIsArray = false;

  function getIndent(s) { let n = 0; while (n < s.length && s[n] === ' ') n++; return n; }

  function stripComment(s) {
    let inS = false, inD = false;
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (c === "'" && !inD) inS = !inS;
      else if (c === '"' && !inS) inD = !inD;
      else if (c === '#' && !inS && !inD && (i === 0 || /\s/.test(s[i-1]))) return s.slice(0, i);
    }
    return s;
  }

  function parseValue(raw) {
    raw = raw.trim();
    if (raw === '') return null;
    if (raw.startsWith('"') && raw.endsWith('"')) return raw.slice(1, -1).replace(/\\"/g, '"').replace(/\\n/g, '\n').replace(/\\\\/g, '\\');
    if (raw.startsWith("'") && raw.endsWith("'")) return raw.slice(1, -1).replace(/''/g, "'");
    if (raw.startsWith('[') && raw.endsWith(']')) {
      const inner = raw.slice(1, -1).trim();
      if (!inner) return [];
      return parseInlineList(inner);
    }
    if (raw.startsWith('{') && raw.endsWith('}')) {
      const inner = raw.slice(1, -1).trim();
      if (!inner) return {};
      return parseInlineMap(inner);
    }
    if (raw === 'true' || raw === 'True') return true;
    if (raw === 'false' || raw === 'False') return false;
    if (raw === 'null' || raw === '~') return null;
    if (/^-?\d+$/.test(raw)) return parseInt(raw);
    if (/^-?\d+\.\d+$/.test(raw)) return parseFloat(raw);
    return raw;
  }

  function parseInlineList(s) {
    const items = []; let depth = 0, cur = '', inStr = null;
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (inStr) {
        if (c === inStr && s[i-1] !== '\\') inStr = null;
        cur += c;
      } else if (c === '"' || c === "'") { inStr = c; cur += c; }
      else if (c === '[' || c === '{') { depth++; cur += c; }
      else if (c === ']' || c === '}') { depth--; cur += c; }
      else if (c === ',' && depth === 0) { items.push(parseValue(cur.trim())); cur = ''; }
      else cur += c;
    }
    if (cur.trim()) items.push(parseValue(cur.trim()));
    return items;
  }

  function parseInlineMap(s) {
    const obj = {}; let depth = 0, cur = '', inStr = null, key = null;
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (inStr) {
        if (c === inStr && s[i-1] !== '\\') inStr = null;
        cur += c;
      } else if (c === '"' || c === "'") { inStr = c; cur += c; }
      else if (c === '[' || c === '{') { depth++; cur += c; }
      else if (c === ']' || c === '}') { depth--; cur += c; }
      else if (c === ':' && depth === 0 && key === null) { key = parseValue(cur.trim()); cur = ''; }
      else if (c === ',' && depth === 0) {
        obj[String(key)] = parseValue(cur.trim());
        key = null; cur = '';
      } else cur += c;
    }
    if (cur.trim() && key !== null) obj[String(key)] = parseValue(cur.trim());
    return obj;
  }

  function resolveAlias(name) {
    if (!(name in anchors)) throw new Error('Undefined alias: *' + name);
    return JSON.parse(JSON.stringify(anchors[name]));
  }

  let i = 0;
  function parseBlock(indentLevel) {
    const container = { type: '?', items: [] };
    while (i < lines.length) {
      let raw = lines[i];
      if (raw.trim() === '' || raw.trim().startsWith('#')) { i++; continue; }
      const ind = getIndent(raw);
      if (ind < indentLevel) break;
      if (ind > indentLevel) throw new Error('Unexpected indentation at line ' + (i+1));
      let content = stripComment(raw).slice(ind);

      // Multiline scalar continuation
      if (inMultiline && ind === multilineIndent) {
        // Hit a sibling key/list item at same indent, finalize
        finalizeMultiline();
      } else if (inMultiline && ind > multilineIndent) {
        multilineBuffer.push(raw.slice(multilineIndent));
        i++; continue;
      }

      if (content.startsWith('- ') || content === '-') {
        container.type = 'array';
        let item = content.slice(1).trim();
        if (item === '') {
          // Nested under array item
          i++;
          const sub = parseBlock(indentLevel + 2);
          container.items.push(sub.type === 'array' ? sub.items : sub.obj);
        } else {
          // Inline scalar / flow / map at same indent under -
          if (item.startsWith('{') || item.startsWith('[')) {
            container.items.push(parseValue(item));
            i++;
          } else if (item.includes(': ') || item.endsWith(':')) {
            // Inline mapping as array item
            const obj = {};
            const idx = item.indexOf(':');
            let k = item.slice(0, idx).trim();
            let v = item.slice(idx + 1).trim();
            if (v === '|' || v === '>' || v === '|-' || v === '>-' || v === '|+' || v === '>+') {
              inMultiline = v; multilineIndent = ind + 2; multilineFold = v.startsWith('>'); multilineChomp = v.endsWith('+') || v === v; multilineBuffer = []; obj[k] = '';
            } else {
              obj[k] = parseValue(v);
            }
            i++;
            const sub = parseBlock(indentLevel + 2);
            if (sub.type === 'array') obj[Object.keys(obj)[0]] = sub.items;
            else Object.assign(obj, sub.obj);
            container.items.push(obj);
          } else {
            container.items.push(parseValue(item));
            i++;
          }
        }
      } else if (content.includes(': ') || content.endsWith(':')) {
        container.type = 'object';
        const idx = content.indexOf(':');
        let key = content.slice(0, idx).trim();
        let val = content.slice(idx + 1).trim();
        // Anchors
        if (key.startsWith('&')) {
          const anchorMatch = key.match(/^&(\S+)\s+(.+)$/);
          if (anchorMatch) { key = anchorMatch[2]; val = val; }
          else if (key.endsWith(':')) { /* &anchor alone */ }
        }
        if (val === '' || val === '|' || val === '>' || val === '|-' || val === '>-' || val === '|+' || val === '>+') {
          inMultiline = val || '|';
          multilineIndent = ind + 2;
          multilineFold = (val || '|').startsWith('>');
          multilineChomp = (val || '|').endsWith('+');
          multilineBuffer = [];
          container.obj = container.obj || {};
          container.obj[key] = '';
          i++;
          const sub = parseBlock(indentLevel + 2);
          if (sub.type === 'array') container.obj[key] = sub.items;
          else Object.assign(container.obj[key] || (container.obj[key] = {}), sub.obj || {});
        } else if (val.startsWith('*')) {
          container.obj = container.obj || {};
          container.obj[key] = resolveAlias(val.slice(1).trim());
          i++;
        } else {
          container.obj = container.obj || {};
          container.obj[key] = parseValue(val);
          i++;
          const sub = parseBlock(indentLevel + 2);
          if (sub.type === 'array') container.obj[key] = sub.items;
          else if (sub.type === 'object' && sub.obj && Object.keys(sub.obj).length) {
            if (container.obj[key] && typeof container.obj[key] === 'object') Object.assign(container.obj[key], sub.obj);
            else container.obj[key] = sub.obj;
          }
        }
      } else {
        throw new Error('Cannot parse line ' + (i+1) + ': ' + content);
      }
    }
    if (inMultiline && indentLevel === 0) finalizeMultiline();
    return container;
  }

  function finalizeMultiline() {
    if (!inMultiline) return;
    const text = multilineBuffer.join('\n');
    let final;
    if (multilineFold) {
      final = text.split('\n').map(l => l.trim()).filter(l => l).join(' ');
      final = final.replace(/\s+/g, ' ');
    } else if (multilineChomp) {
      final = text.replace(/\n+$/g, '');
    } else {
      final = text.replace(/\n+$/g, '') + '\n';
    }
    // Find last key/array and set its value
    if (containerLast && containerLast.lastKey !== undefined) {
      containerLast.target[containerLast.lastKey] = final;
    }
    inMultiline = null; multilineBuffer = []; multilineIndent = -1;
  }

  const containerLast = { lastKey: null, target: null };
  // Simplified: process multiline at top-level only — for this tool's purposes, complex YAML use cases warrant JSON output
  const parsed = parseBlock(0);
  return parsed.type === 'array' ? parsed.items : (parsed.obj || {});
}

    status.innerHTML = `<span class="ym-ok">${t('ok')}</span> · ${bytes} chars`;

}
