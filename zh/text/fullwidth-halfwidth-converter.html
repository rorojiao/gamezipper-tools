<script>
GZI18n.register({
  en: {
    toolTitle: 'Full Width Half Width Converter',
    toolDesc: 'Convert text between full width (zenkaku) and half width (hankaku) characters — digits, letters, CJK punctuation and spaces, both directions.',

    step3: 'Check the stats line for how many fullwidth and halfwidth characters were found',
    step4: 'Click Copy to take the converted text to your document, code or form',
    stats: (n)=>'',
    errEmpty: '',
  },
  zh: {
    toolTitle: '全角半角转换工具',
    toolDesc: '在全角（zenkaku）与半角（hankaku）字符之间互转 — 数字、字母、中日韩标点和空格，双向转换，实时更新。',
    modeF2H: '全角 → 半角',
    modeH2F: '半角 → 全角',
    input: '输入文本', output: '转换结果',
    copy: '复制', clear: '清空', example: '示例',
    step1: '选择方向：全角转半角，或半角转全角',
    step2: '把文本粘贴到输入框，输入时实时更新结果',
    step3: '查看统计行，了解文中全角与半角字符的数量',
    step4: '点击「复制」，将结果粘贴到文档、代码或表单',
  }
});

const { $, copyText, t } = GZ;
let mode = 'f2h';

// CJK punctuation -> ASCII (fullwidth to halfwidth direction)
const P2A = {'，':',','。':'.','、':',','；':';','：':':','？':'?','！':'!','（':'(','）':')','«':'"','」':'"','『':"'",'』':"'",'【':'[','】':']','｛':'{','｝':'}','　':' ','…':'...','—':'-','–':'-','・':'.','〜':'~','＄':'$'};
// ASCII -> CJK punctuation (halfwidth to fullwidth direction) — only unambiguous common ones
const A2P = {',':'，','.':'。',';':'：','?':'？','!':'！','(':'（',')':'）','[':'【',']':'】','{':'｛','}':'｝','$':'＄'};

function f2h(s) {
  return s
    .replace(/[\uFF01-\uFF5E]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[\u3000\u00A0]/g, ' ')
    .replace(/[，。、；：？！（）」『』【】…—–・〜＄]/g, c => P2A[c] || c);
}
function h2f(s) {
  return s
    .replace(/[\x21-\x7E]/g, c => String.fromCharCode(c.charCodeAt(0) + 0xFEE0))
    .replace(/[,.;?!()\[\]{}$]/g, c => A2P[c] || c);
}

function conv() {
  const src = $('#src').value;
  const out = mode === 'f2h' ? f2h(src) : h2f(src);
  $('#out-area').textContent = out;
  const fw = (src.match(/[\uFF01-\uFF5E\u3000]/g) || []).length;
  const hw = (src.match(/[\x21-\x7E]/g) || []).length;
  const L = location.pathname.includes('/zh/')
    ? {full:'全角字符', half:'半角字符', chars:'字符'}
    : {full:'fullwidth', half:'halfwidth', chars:'chars'};
  $('#stats').textContent = `${src.length} ${L.chars} · ${fw} ${L.full} · ${hw} ${L.half}`;
}

function setMode(m) {
  mode = m;
  $('#btn-f2h').className = 'gz-btn' + (m === 'f2h' ? '' : ' gz-btn-secondary off');
  $('#btn-h2f').className = 'gz-btn' + (m === 'h2f' ? '' : ' gz-btn-secondary off');
  conv();
}

function loadExample() {
  $('#src').value = 'Ｈｅｌｌｏ　ｗｏｒｌｄ，１２３４５６７８９０！（测试）';
  conv();
}

function doClear() { $('#src').value = ''; conv(); }

$('#mode').innerHTML = `
  <button class="gz-btn" id="btn-f2h" onclick="setMode('f2h')">${t('modeF2H')}</button>
  <button class="gz-btn gz-btn-secondary off" id="btn-h2f" onclick="setMode('h2f')">${t('modeH2F')}</button>`;
$('#lbl-in').textContent = t('input');
$('#lbl-out').textContent = t('output');
$('#tb').innerHTML = `<button class="gz-btn gz-btn-secondary" onclick="copyText($('#out-area').textContent)">${t('copy')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="loadExample()">${t('example')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="doClear()">${t('clear')}</button>`;
$('#src').addEventListener('input', conv);

GZ.renderToolPage({
  category: 'text',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1', 'step2', 'step3', 'step4'],
  related: [
    {icon: 'Ｆ', href: '/text/fullwidth-text.html', name: 'Fullwidth Text'},
    {icon: '🔤', href: '/text/unicode-search.html', name: 'Unicode Search'},
    {icon: '🧹', href: '/text/html-stripper.html', name: 'HTML Stripper'},
    {icon: '🔍', href: '/text/character-frequency.html', name: 'Character Frequency'},
  ]
});
conv();
</script>
