  scifi: ['but the system is failing', 'and the airlock has just sealed', 'but Earth has stopped answering', 'and the clock is on a different planet now', 'but the AI has started lying', 'and nobody can remember the password', 'but gravity just quit', 'and the supplies run out in 6 days'],
  horror: ['and the lights will not turn back on', 'and the rules of the house have changed', 'but the door will not open from inside', 'and the house has started listening', 'but the voice on the phone is hers', 'and the mirror has remembered her', 'but the room is one doorway smaller than it was', 'and the night will not end'],
  mystery: ['but every witness has the same alibi', 'and the alibi does not add up', 'but the killer is also the client', 'and the diary is missing the last page', 'but the only suspect has a twin', 'and the timeline no longer works', 'but the safe is empty', 'and the key was never lost'],
  romance: ['but neither of them is ready to admit it', 'and the wedding is still on', 'but they have to work together', 'but one of them is moving away', 'and the secret is bigger than the feeling', 'but the timing could not be worse', 'but the ex is back in town', 'and they only have one week'],
  thriller: ['and the agency is already compromised', 'but the package is a person', 'and the clock is wrong on purpose', 'but the exit is also the trap', 'and the message was not meant for them', 'but the safe word has been changed', 'and the witness just disappeared', 'and the deadline has already passed'],
  comedy: ['and the cat is at the door again', 'but the invitation has the wrong address', 'but the cake has three layers of fondant', 'and the band is also the officiant', 'but the GPS has taken them to the wrong wedding', 'and the speech is missing', 'but the photographer only shoots black and white', 'and the ring is in the dog\'s stomach'],
  drama: ['and the truth has been waiting twenty years', 'but one of them is lying', 'and the cost is the house', 'but the diagnosis is not what they said', 'and the family has to choose a side', 'but the apology has come too late', 'and the will is missing a page', 'but the child already knows'],
  kids: ['and the puppy has run away', 'but the kite is stuck in the clouds', 'and the cookies are missing', 'but the magic only works at midnight', 'and the rain has ruined the picnic', 'but the new kid is sad', 'and the show starts in 10 minutes', 'but the door to the treehouse is locked'],
  historical: ['but the letter has been intercepted', 'and the queen has already been told', 'but the messenger has been replaced', 'and the carriage has the wrong crest', 'but the seal has been broken', 'and the war is closer than they said', 'but the spy is also a friend', 'and the clock in the tower has stopped'],
};

const GENRES = ['fantasy', 'scifi', 'horror', 'mystery', 'romance', 'thriller', 'comedy', 'drama', 'kids', 'historical'];
const STORAGE_FAVS = 'gz_ss_favs';
const STORAGE_SPINS = 'gz_ss_spins';

let activeTag = 'fantasy';
let current = null;
let spins = 0;
let favs = [];
try { favs = JSON.parse(localStorage.getItem(STORAGE_FAVS) || '[]'); } catch(e) { favs = []; }
try { spins = parseInt(localStorage.getItem(STORAGE_SPINS) || '0', 10); } catch(e) { spins = 0; }

const { $, copyText, t } = GZ;

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function tagLabel(tag) {
  return t('tag' + tag.charAt(0).toUpperCase() + tag.slice(1));
}

function renderTags() {
  const wrap = $('#tagBtns');
  wrap.innerHTML = GENRES.map(tag => `<button class="ss-tag${tag === activeTag ? ' active' : ''}" data-tag="${tag}">${tagLabel(tag)}</button>`).join('');
  wrap.querySelectorAll('.ss-tag').forEach(b => {
    b.addEventListener('click', () => {
      activeTag = b.dataset.tag;
      renderTags();
      updateStats();
    });
  });
}

function spin() {
  const opening = pick(OPENINGS[activeTag] || OPENINGS.fantasy);
  const character = pick(CHARACTERS[activeTag] || CHARACTERS.fantasy);
  const setting = pick(SETTINGS[activeTag] || SETTINGS.fantasy);
  const conflict = pick(CONFLICTS[activeTag] || CONFLICTS.fantasy);
  current = { opening, character, setting, conflict, tag: activeTag };
  $('#ssOpening').textContent = opening;
  $('#ssCharacter').textContent = character;
  $('#ssSetting').textContent = setting;
  $('#ssConflict').textContent = conflict;
  spins++;
  try { localStorage.setItem(STORAGE_SPINS, String(spins)); } catch(e) {}
  updateStats();
  updateFavBtn();
}

function updateStats() {
  const statsFn = t('stats');
  if (typeof statsFn === 'function') {
    $('#ssStats').innerHTML = statsFn(spins, tagLabel(activeTag));
  } else {
    $('#ssStats').innerHTML = `Spins: <strong>${spins}</strong> · Genre: <strong>${tagLabel(activeTag)}</strong>`;
  }
}

function isFav() {
  if (!current) return false;
  return favs.some(f => f.opening === current.opening);
}

function toggleFav() {
  if (!current) return;
  if (isFav()) {
    favs = favs.filter(f => f.opening !== current.opening);
  } else {
    favs.unshift({ ...current, ts: Date.now() });
  }
  try { localStorage.setItem(STORAGE_FAVS, JSON.stringify(favs.slice(0, 30))); } catch(e) {}
  updateFavBtn();
  renderFavs();
}

function updateFavBtn() {
  $('#favBtn').textContent = isFav() ? t('saved') : t('save');
}

function renderFavs() {
  const wrap = $('#ssFavs');
  if (!favs.length) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = `
    <h2>${t('favsTitle')}</h2>
    ${favs.map((f, i) => `
      <div class="ss-fav-item">
        <div class="text">
          <div class="meta">${tagLabel(f.tag)}</div>
          "${escapeHtml(f.opening)}" — featuring ${escapeHtml(f.character)}, set in ${escapeHtml(f.setting)}, ${escapeHtml(f.conflict)}.
        </div>
        <button data-i="${i}" title="${t('remove')}">${t('remove')}</button>
      </div>
    `).join('')}
    <div style="text-align:center;margin-top:10px"><button class="ss-tag" id="clearAllBtn">${t('removeAll')}</button></div>
  `;
  wrap.querySelectorAll('.ss-fav-item button').forEach(b => {
    b.addEventListener('click', () => {
      favs.splice(+b.dataset.i, 1);
      try { localStorage.setItem(STORAGE_FAVS, JSON.stringify(favs)); } catch(e) {}
      renderFavs();
      updateFavBtn();
    });
  });
  const clearBtn = $('#clearAllBtn');
  if (clearBtn) clearBtn.addEventListener('click', () => {
    favs = [];
    try { localStorage.setItem(STORAGE_FAVS, '[]'); } catch(e) {}
    renderFavs();
    updateFavBtn();
  });
}

function copyCurrent() {
  if (!current) return;
  const text = `"${current.opening}" — featuring ${current.character}, set in ${current.setting}, ${current.conflict}.`;
  copyText(text);
}

renderTags();
updateStats();
renderFavs();

$('#spinBtn').addEventListener('click', spin);
$('#copyBtn').addEventListener('click', copyCurrent);
$('#favBtn').addEventListener('click', toggleFav);

});
