const { $, copyText, t } = GZ;

function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function applyReplacements(text, replacements, probability, rng) {
  const rand = rng || Math.random;
  let out = text;
  for (const [from, to] of replacements) {
    if (rand() > probability) continue;
    const re = new RegExp('\\b' + escapeRegex(from) + '\\b', 'gi');
    out = out.replace(re, (m) => {
      // Preserve capitalization
      let replacement = to;
      if (!replacement) return '';
      if (m[0] === m[0].toUpperCase() && replacement.length > 0) {
        replacement = replacement.charAt(0).toUpperCase() + replacement.slice(1);
      }
      // Insert space if needed (empty replacement with word boundary)
      return replacement;
    });
  }
  // Collapse double spaces from deletions
  out = out.replace(/\s{2,}/g, ' ').replace(/\s+([.,;:!?])/g, '$1');
  return out;
}

function shortenOnce(text, level, seed) {
  let out = text.trim();
  if (!out) return '';
  // Use a seeded RNG so different attempts give different results
  let rngState = (seed || 1) * 2654435761 >>> 0;
  const rand = () => { rngState = (rngState * 1664525 + 1013904223) >>> 0; return rngState / 0x100000000; };
  // Vary probability per attempt so each call produces a different output
  let prob;
  if (level === 1) {
    // Slight: 0.30 - 0.55
    prob = 0.30 + rand() * 0.25;
  } else if (level === 2) {
    // Moderate: 0.55 - 0.85
    prob = 0.55 + rand() * 0.30;
  } else {
    // Aggressive: 0.85 - 1.0
    prob = 0.85 + rand() * 0.15;
  }
  out = applyReplacements(out, REPLACEMENTS, prob, rand);
  if (level >= 3) {
    // Aggressive: drop a few weak modifiers
    out = out.replace(/\b(very|really|quite|rather|somewhat|basically|essentially|literally|actually|simply|just|merely|obviously|clearly)\s+/gi, (m) => rand() < 0.5 ? '' : m);
    // Drop "I think that / I believe that"
    out = out.replace(/\bI (think|believe|feel) that\s+/gi, '');
    out = out.replace(/\bIt (is|seems) (that|like)\s+/gi, '');
    out = out.replace(/\b(in my opinion|in my view|to my mind),?\s*/gi, '');
  }
  // Cleanup
  out = out.replace(/\s{2,}/g, ' ').trim();
  // Ensure starts with capital
  if (out[0]) out = out[0].toUpperCase() + out.slice(1);
  // Ensure ends with punctuation
  if (!/[.!?]$/.test(out)) out += '.';
  return out;
}

function generateShortenings(sentence, count, level) {
  const seen = new Set([sentence.trim().toLowerCase()]);
  const results = [];
  let attempts = 0;
  // For higher level, use more deterministic seed-like randomization
  while (results.length < count && attempts < count * 20) {
    attempts++;
    // Use attempt-driven entropy: each attempt applies a different random subset
    const r = shortenOnce(sentence, level, attempts);
    const key = r.toLowerCase().replace(/[^a-z0-9]/g, '');
    if (r && !seen.has(key) && r.trim() !== sentence.trim() && r.length < sentence.length + 5) {
      seen.add(key);
      results.push(r);
    }
  }
  // If still not enough, try the same text multiple times with slight variations
  while (results.length < count && attempts < count * 30) {
    attempts++;
    const r = shortenOnce(sentence, level, attempts + 17);
    const key = r.toLowerCase().replace(/[^a-z0-9]/g, '');
    if (r && !seen.has(key)) {
      seen.add(key);
      results.push(r);
    }
  }
  return results;
}

const LEVEL_LABEL = { 1: 'Slight', 2: 'Moderate', 3: 'Aggressive' };
const LEVEL_ZH = { 1: '轻度', 2: '中度', 3: '大幅' };
function getLevelLabel(level) {
  const lang = GZI18n.getLang();
  return lang === 'zh' ? LEVEL_ZH[level] : LEVEL_LABEL[level];
}

function countWords(s) {
  return (s.trim().match(/\b[\w']+\b/g) || []).length;
}

function render(results, level, originalText) {
  const wrap = $('#ssOutput');
  if (!results.length) {
    wrap.innerHTML = `<div class="ss-empty">${t('empty')}</div>`;
    return;
  }
  wrap.innerHTML = results.map((r, i) => `
    <div class="ss-card">
      <div class="text">${escapeHtml(r)}</div>
      <button class="copy" data-i="${i}" title="${t('copied')}">📋</button>
    </div>
  `).join('');
  wrap.querySelectorAll('.copy').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = +btn.dataset.i;
      copyText(results[idx]);
      btn.textContent = '✅';
      setTimeout(() => { btn.textContent = '📋'; }, 1200);
    });
  });
  const summaryFn = t('summary');
  const lvl = getLevelLabel(level);
  const origW = countWords(originalText);
  const newW = Math.min(...results.map(r => countWords(r)));
  if (typeof summaryFn === 'function') {
    $('#ssSummary').innerHTML = summaryFn(results.length, lvl, origW, newW);
  } else {
    $('#ssSummary').innerHTML = `Generated <strong>${results.length}</strong> shortened versions.`;
  }
}

function doShorten() {
  const sentence = $('#input').value.trim();
  const count = parseInt($('#countSel').value, 10);
  const level = parseInt($('#levelSel').value, 10);
  if (!sentence) {
    $('#ssOutput').innerHTML = `<div class="ss-empty">${t('empty')}</div>`;
    $('#ssSummary').innerHTML = '';
    return;
  }
  const results = generateShortenings(sentence, count, level);
  render(results, level, sentence);
}

  $('#input').value = 'In the event that you find yourself in a situation where you need to get in touch with me prior to the start of the meeting, please do not hesitate to contact me by means of the contact information that I have provided to you.';
  doShorten();
}

function doClear() {
  $('#input').value = '';
  $('#ssOutput').innerHTML = '';
  $('#ssSummary').innerHTML = '';
