<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is the 5-1-1 rule?","acceptedAnswer":{"@type":"Answer","text":"The 5-1-1 rule is a common guideline for when to go to the hospital: contractions about 5 minutes apart (frequency), lasting about 1 minute each (duration), sustained for at least 1 hour. This timer shows your progress toward all three conditions. Always follow your provider's specific advice."}},{"@type":"Question","name":"How do I time a contraction correctly?","acceptedAnswer":{"@type":"Answer","text":"Tap Start at the beginning of a contraction, when the tightening starts, and tap End when it fully releases. Frequency is measured from the start of one contraction to the start of the next, which this timer calculates automatically from your start timestamps."}},{"@type":"Question","name":"Does this contraction timer work on a phone?","acceptedAnswer":{"@type":"Answer","text":"Yes. It runs in any mobile browser with one large button sized for touch. It also keeps working while the tab is in the background and your history is saved locally, so a closed tab or dead battery mid-labor does not lose your log."}},{"@type":"Question","name":"Is my contraction data private?","acceptedAnswer":{"@type":"Answer","text":"Yes. All timings are stored only in your browser's local storage on your device. Nothing is uploaded to a server, and you can clear the log at any time."}},{"@type":"Question","name":"When should I contact my doctor or midwife?","acceptedAnswer":{"@type":"Answer","text":"Contact your provider when contractions follow the 5-1-1 pattern, or sooner if you notice reduced fetal movement, your water breaks, there is bleeding, or contractions come less than 2 minutes apart. This tool is a tracking aid, not medical advice."}}]}</script>

<script>
GZI18n.register({
  en: {
    toolTitle: 'Contraction Timer',
    toolDesc: 'Tap Start when a contraction begins and End when it stops — track duration, frequency and the 5-1-1 rule in your phone browser.',
    btnStart: '▶ Start contraction', btnEnd: '■ End contraction',
    statCount: 'Contractions', statAvgDur: 'Avg duration', statAvgFreq: 'Avg frequency', statLastDur: 'Last duration',
    ruleWait: 'Keep timing — contractions are not regular yet.',
    ruleProgress: 'Progress: {a} min apart · {b}s long · {c} min steady',
    ruleOk: '✓ 5-1-1 met: contractions ~5 min apart, ~1 min long, for over an hour. Time to contact your provider.',
    logHead: 'History',
    copy: 'Copy log', clear: 'Clear log',
    cleared: 'Log cleared.',
    step1: 'Tap Start the moment a contraction tightening begins',
    step2: 'Tap End when the contraction fully releases',
    step3: 'Watch duration, frequency and 5-1-1 progress update automatically',
    step4: 'Copy the log to share with your doctor or midwife',
  },
  zh: {
    toolTitle: '宫缩计时器',
    toolDesc: '宫缩开始时点「开始」，结束时点「结束」— 在手机浏览器中记录持续时间、频率和 5-1-1 规则进度。',
    btnStart: '▶ 开始宫缩', btnEnd: '■ 结束宫缩',
    statCount: '宫缩次数', statAvgDur: '平均持续', statAvgFreq: '平均间隔', statLastDur: '最近持续',
    ruleWait: '继续计时 — 宫缩尚未规律。',
    ruleProgress: '进度：间隔 {a} 分钟 · 持续 {b} 秒 · 已规律 {c} 分钟',
    ruleOk: '✓ 已满足 5-1-1：宫缩约 5 分钟一次、每次约 1 分钟、持续超过 1 小时。建议联系医生或助产士。',
    logHead: '记录',
    copy: '复制记录', clear: '清空记录',
    cleared: '记录已清空。',
    step1: '宫缩开始收紧时立即点击「开始」',
    step2: '宫缩完全放松时点击「结束」',
    step3: '持续时间、间隔频率和 5-1-1 进度自动更新',
    step4: '复制记录分享给医生或助产士',
  }
});

const { $, copyText, showToast, t } = GZ;
const KEY = 'gz-contractio';
let rec = JSON.parse(localStorage.getItem(KEY) || '[]');
let active = null; // {start: ts}
let timer = null;

function fmt(ms) {
  const s = Math.floor(ms / 1000);
  return `${String(Math.floor(s / 60)).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`;
}
function fmtMin(ms) { return (ms / 60000).toFixed(1); }

function save() { localStorage.setItem(KEY, JSON.stringify(rec)); }

function toggle() {
  if (!active) {
    active = { start: Date.now() };
    $('#btn').textContent = t('btnEnd');
    $('#btn').className = 'ct-big ct-end';
  } else {
    rec.push({ start: active.start, end: Date.now() });
    active = null;
    save();
    $('#btn').textContent = t('btnStart');
    $('#btn').className = 'ct-big ct-start';
    $('#live').textContent = '00:00';
  }
  render();
}

function tick() {
  if (active) $('#live').textContent = fmt(Date.now() - active.start);
}

function render() {
  const n = rec.length;
  const durs = rec.map(r => r.end - r.start);
  const freqs = [];
  for (let i = 1; i < n; i++) freqs.push(rec[i].start - rec[i-1].start);
  const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
  $('#stats').innerHTML = `
    <div class="ct-stat"><b>${n}</b><span>${t('statCount')}</span></div>
    <div class="ct-stat"><b>${durs.length ? fmt(avg(durs)) : '--:--'}</b><span>${t('statAvgDur')}</span></div>
    <div class="ct-stat"><b>${freqs.length ? fmtMin(avg(freqs)) + ' min' : '--'}</b><span>${t('statAvgFreq')}</span></div>
    <div class="ct-stat"><b>${n ? fmt(durs[n-1]) : '--:--'}</b><span>${t('statLastDur')}</span></div>`;

  // 5-1-1: last freqs avg <= 5min, avg dur >= 60s, sustained >= 60min
  const rule = $('#rule');
  const recentF = freqs.slice(-3);
  const recentD = durs.slice(-3);
  if (n >= 3) {
    const f = avg(recentF), d = avg(recentD);
    const span = rec[n-1].start - rec[Math.max(0, n-4)].start;
    const ok = f <= 5.5*60000 && d >= 50000 && span >= 60*60000;
    rule.className = 'ct-rule' + (ok ? ' ok' : '');
    rule.textContent = ok ? t('ruleOk')
      : t('ruleProgress').replace('{a}', fmtMin(f)).replace('{b}', Math.round(d/1000)).replace('{c}', Math.round(span/60000));
  } else {
    rule.className = 'ct-rule';
    rule.textContent = t('ruleWait');
  }

  $('#log').innerHTML = rec.slice().reverse().map((r, i) => {
    const idx = n - i;
    const gap = idx > 1 ? fmtMin(r.start - rec[idx-2].start) + ' min' : '—';
    return `<li><span>#${idx} <code>${new Date(r.start).toLocaleTimeString()}</code></span><span><code>${fmt(r.end - r.start)}</code> · ${gap}</span></li>`;
  }).join('');
}

function copyLog() {
  const lines = rec.map((r, i) => {
    const gap = i > 0 ? ((r.start - rec[i-1].start)/60000).toFixed(1) + ' min' : '-';
    return `#${i+1}  start ${new Date(r.start).toLocaleTimeString()}  duration ${fmt(r.end-r.start)}  gap ${gap}`;
  });
  copyText(lines.join('\n') || '');
}
function clearLog() {
  rec = []; active = null; save();
  $('#live').textContent = '00:00';
  $('#btn').textContent = t('btnStart');
  $('#btn').className = 'ct-big ct-start';
  render();
  showToast(t('cleared'));
}

$('#btn').textContent = t('btnStart');
$('#toolbar').innerHTML = `<button class="gz-btn gz-btn-secondary" onclick="copyLog()">${t('copy')}</button>
  <button class="gz-btn gz-btn-danger" onclick="clearLog()">${t('clear')}</button>`;
timer = setInterval(tick, 500);
window.addEventListener('pagehide', () => clearInterval(timer));
render();

GZ.renderToolPage({
  category: 'calc',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'🤰', href:'/calc/pregnancy-due-date-calculator.html', name:'Due Date Calculator'},
    {icon:'📅', href:'/calc/age-difference.html', name:'Date Difference'},
    {icon:'⏱️', href:'/calc/stopwatch.html', name:'Stopwatch'},
    {icon:'👶', href:'/calc/baby-growth-chart.html', name:'Baby Growth Chart'},
  ]
});
</script>
<script src="/tools-result-rec.js?v=R449-flat" defer></script>
</body>
