  Horror: ['the protagonist walks out of the house and never looks back, but the sound follows', 'the town is left behind but the protagonist can\'t stop hearing it', 'the monster is revealed to be human, and that\'s worse', 'the protagonist saves the next person, but not themselves', 'the curse is contained, never cured'],
  Thriller: ['the protagonist delivers the package and walks away from the organization forever', 'the public event is saved, but only because the protagonist takes the fall', 'the protagonist gets the story, but the source vanishes', 'the negotiation succeeds, but the antagonist escapes through a back door the protagonist left open', 'the protagonist finds out who they really are, and it changes everything'],
  Drama: ['the family gathers, but only after the funeral, and it changes them all', 'the parent dies, but the last conversation goes exactly as needed', 'the protagonist finally says the thing they\'ve been holding for years', 'the marriage ends, and both people are better for it', 'the play goes on, even if the actor can\'t remember their lines'],
  Comedy: ['the wedding happens, but not for the people who planned it', 'the scheme works, just not for the protagonist', 'the embarrassing secret is revealed and turns out to be everyone\'s favorite story', 'the protagonist gets what they wanted but realizes they wanted the wrong thing', 'the family embraces the disaster and throws a bigger party'],
  Historical: ['the dynasty falls, but a smaller, kinder order rises from it', 'the secret dies with its keeper, and history remembers it differently', 'the spy defects, but only after both sides have been changed', 'the forbidden romance ends in exile, but the lovers write to each other for decades', 'the relic is destroyed, and the miracle stops, and that turns out to be the point'],
  Adventure: ['the protagonist reaches the place and decides not to take anything from it', 'the discovery is reported, but the credit goes to someone else, and that\'s fine', 'the journey home is harder than the journey there, and the protagonist is grateful', 'the team disbands, but they keep in touch for the rest of their lives', 'the protagonist turns down a second expedition and goes back to ordinary life']
};

const GENRE_LABELS_EN = ['Fantasy', 'Sci-Fi', 'Mystery', 'Romance', 'Horror', 'Thriller', 'Drama', 'Comedy', 'Historical', 'Adventure'];
const GENRE_LABELS_ZH = ['奇幻', '科幻', '悬疑', '浪漫', '恐怖', '惊悚', '剧情', '喜剧', '历史', '冒险'];

const { $, copyText, t } = GZ;

function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

let selectedGenres = new Set(['Fantasy']);

function renderGenreTags() {
  const lang = GZI18n.getLang();
  const labels = lang === 'zh' ? GENRE_LABELS_ZH : GENRE_LABELS_EN;
  const wrap = $('#genreTags');
  wrap.innerHTML = labels.map((label, i) => {
    const id = GENRE_LABELS_EN[i];
    const active = selectedGenres.has(id) ? 'active' : '';
    return `<div class="pg-tag ${active}" data-id="${id}">${label}</div>`;
  }).join('');
  wrap.querySelectorAll('.pg-tag').forEach(tag => {
    tag.addEventListener('click', () => {
      const id = tag.dataset.id;
      if (selectedGenres.has(id)) selectedGenres.delete(id);
      else selectedGenres.add(id);
      tag.classList.toggle('active');
    });
  });
}

function generatePlot(genres) {
  // Pick genre (if multiple, blend with weighted random)
  const genre = pick([...genres]);
  const protagonist = pick(PROTAGONISTS[genre]);
  const conflict = pick(CONFLICTS[genre]);
  const setting = pick(SETTINGS[genre]);
  const twist = pick(TWISTS[genre]);
  const resolution = pick(RESOLUTIONS[genre]);
  return {
    genre, protagonist, conflict, setting, twist, resolution
  };
}

function buildArc(plot, arcType) {
  if (arcType === '3') {
    return [
      { label: t('setup'), text: `Set in ${plot.setting}, the story follows ${plot.protagonist}.` },
      { label: t('rising'), text: `They become entangled in ${plot.conflict}.` },
      { label: t('climax'), text: `The truth becomes clear: ${plot.twist}.` },
      { label: t('resolution'), text: `Ultimately, ${plot.resolution}.` }
    ];
  } else if (arcType === 'hero') {
    return [
      { label: 'Ordinary World', text: `In ${plot.setting}, ${plot.protagonist} lives a constrained life.` },
      { label: 'Call to Adventure', text: `${plot.conflict.charAt(0).toUpperCase() + plot.conflict.slice(1)} disrupts everything.` },
      { label: 'Crossing the Threshold', text: `The protagonist leaves behind what they knew and steps into unfamiliar territory.` },
      { label: 'Tests & Allies', text: `Along the way, alliances form and loyalties are tested.` },
      { label: 'Ordeal', text: `At the lowest point, ${plot.twist}.` },
      { label: 'Reward', text: `A piece of the truth is recovered, but at personal cost.` },
      { label: 'Return', text: `${plot.resolution.charAt(0).toUpperCase() + plot.resolution.slice(1)}` }
    ];
  } else {
    // 4-act default
    return [
      { label: t('setup'), text: `Set in ${plot.setting}, the story follows ${plot.protagonist}.` },
      { label: t('rising'), text: `They become entangled in ${plot.conflict}, which forces them to leave the life they knew.` },
      { label: t('climax'), text: `Midway through, ${plot.twist}, reframing everything the protagonist believed.` },
      { label: t('resolution'), text: `In the end, ${plot.resolution}.` }
    ];
  }
}

function plotTitle(plot) {
  const caps = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  // Use first 3-5 words from protagonist as a hook
  const hookWords = plot.protagonist.split(' ').slice(0, 4).join(' ');
  return `${caps(hookWords)}…`;
}

function formatGenres(genres) {
  const lang = GZI18n.getLang();
  return genres.map(g => {
    if (lang === 'zh') {
      const idx = GENRE_LABELS_EN.indexOf(g);
      return idx >= 0 ? GENRE_LABELS_ZH[idx] : g;
    }
    return g;
  }).join(', ');
}

function renderPlot(plot, arc, idx) {
  const title = plotTitle(plot);
  const genreLabel = (GZI18n.getLang() === 'zh') ? (GENRE_LABELS_ZH[GENRE_LABELS_EN.indexOf(plot.genre)] || plot.genre) : plot.genre;
  const arcHtml = arc.map(step => `
    <div class="pg-arc-step"><strong>${escapeHtml(step.label)}:</strong><span>${escapeHtml(step.text)}</span></div>
  `).join('');
  return `
    <div class="pg-card" data-idx="${idx}">
      <div class="pg-card-head">
        <h3 class="pg-card-title">${escapeHtml(title)}</h3>
        <span class="pg-genre">${escapeHtml(genreLabel)}</span>
      </div>
      <div class="pg-arc">${arcHtml}</div>
      <div class="pg-card-actions">
        <button class="copy-btn" data-idx="${idx}">${t('copy')}</button>
        <button class="save-btn" data-idx="${idx}">${t('save')}</button>
      </div>
    </div>
  `;
}

function plotToText(plot, arc) {
  let out = `${plotTitle(plot)} [${plot.genre}]\n\n`;
  arc.forEach(step => {
    out += `${step.label}: ${step.text}\n\n`;
  });
  return out.trim();
}

let currentPlots = [];
let currentArcs = [];
let favorites = [];
try {
  const stored = localStorage.getItem('pg-favs');
  if (stored) favorites = JSON.parse(stored);
} catch(e) { favorites = []; }

function updateFavCount() {
  $('#favCount').textContent = favorites.length;
}

function saveFavorite(idx) {
  if (!currentPlots[idx]) return;
  const txt = plotToText(currentPlots[idx], currentArcs[idx]);
  if (!favorites.includes(txt)) {
    favorites.unshift(txt);
    if (favorites.length > 50) favorites = favorites.slice(0, 50);
    try { localStorage.setItem('pg-favs', JSON.stringify(favorites)); } catch(e) {}
    updateFavCount();
    renderFavs();
  }
  const btn = document.querySelector(`.pg-card[data-idx="${idx}"] .save-btn`);
  if (btn) {
    btn.textContent = t('saved');
    setTimeout(() => { btn.textContent = t('save'); }, 1500);
  }
}

function renderFavs() {
  const box = $('#favsBox');
  const list = $('#favList');
  if (!favorites.length) {
    box.style.display = 'none';
    return;
  }
  box.style.display = 'block';
  list.innerHTML = favorites.map((f, i) => {
    const title = f.split('\n')[0];
    return `<li data-fav="${i}">${escapeHtml(title)}</li>`;
  }).join('');
  list.querySelectorAll('li').forEach(li => {
    li.addEventListener('click', () => {
      const idx = +li.dataset.fav;
      copyText(favorites[idx]);
      li.style.color = 'var(--accent)';
      setTimeout(() => { li.style.color = ''; }, 800);
    });
  });
}

function doGenerate() {
  if (!selectedGenres.size) {
    $('#pgOutput').innerHTML = `<div class="pg-empty">${t('empty')}</div>`;
    $('#pgSummary').innerHTML = '';
    return;
  }
  const count = parseInt($('#countSel').value, 10);
  const arcType = $('#arcSel').value;
  const genres = [...selectedGenres];
  currentPlots = [];
  currentArcs = [];
  const seen = new Set();
  let attempts = 0;
  while (currentPlots.length < count && attempts < count * 8) {
    attempts++;
    const plot = generatePlot(genres);
    const arc = buildArc(plot, arcType);
    const key = plot.protagonist + '|' + plot.conflict.slice(0, 40);
    if (!seen.has(key)) {
      seen.add(key);
      currentPlots.push(plot);
      currentArcs.push(arc);
    }
  }
  $('#pgOutput').innerHTML = currentPlots.map((p, i) => renderPlot(p, currentArcs[i], i)).join('');
  $('#pgOutput').querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = +btn.dataset.idx;
      copyText(plotToText(currentPlots[idx], currentArcs[idx]));
      btn.textContent = '✅ ' + t('copy').replace('📋 ', '');
      setTimeout(() => { btn.textContent = t('copy'); }, 1200);
    });
  });
  $('#pgOutput').querySelectorAll('.save-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = +btn.dataset.idx;
      saveFavorite(idx);
    });
  });
  const summaryFn = t('summary');
  const genreLabel = formatGenres(genres);
  if (typeof summaryFn === 'function') {
    $('#pgSummary').innerHTML = summaryFn(currentPlots.length, genreLabel);
  } else {
    $('#pgSummary').innerHTML = `Generated <strong>${currentPlots.length}</strong> plots.`;
  }
}

$('#genBtn').addEventListener('click', doGenerate);
$('#favBtn').addEventListener('click', () => {
  const box = $('#favsBox');
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
});

renderGenreTags();
renderFavs();
updateFavCount();
