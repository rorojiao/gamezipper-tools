const { $, t } = GZ;
let selectedFile = null;
let extracted = '';

const dz = $('#dropZone');
dz.addEventListener('click', () => $('#fileInput').click());
$('#fileInput').addEventListener('change', e => {
  if (e.target.files[0]) selectFile(e.target.files[0]);
  e.target.value = '';
});
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
dz.addEventListener('drop', e => {
  e.preventDefault();
  dz.classList.remove('dragover');
  if (e.dataTransfer.files[0]) selectFile(e.dataTransfer.files[0]);
});
$('#dropText').textContent = t('dropText');

function fmtSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1048576).toFixed(2) + ' MB';
}

function selectFile(f) {
  if (!f.name.toLowerCase().endsWith('.epub') && f.type !== 'application/epub+zip') {
    GZ.showToast(t('invalidEpub'));
    return;
  }
  selectedFile = f;
  $('#fileInfo').innerHTML = `<div class="eb-file"><span class="ic">📖</span><span class="nm">${f.name}</span><span class="sz">${fmtSize(f.size)}</span></div>`;
}

function extractText(body) {
  let out = '';
  const BLOCKS = new Set(['p','div','h1','h2','h3','h4','h5','h6','li','ul','ol','blockquote','br','tr','table','section','article','figure','pre','header','footer','aside','nav','dl','dt','dd','hr','body']);
  (function walk(n) {
    if (n.nodeType === 3) { out += n.nodeValue.replace(/\s+/g, ' '); return; }
    if (n.nodeType !== 1) return;
    const tag = n.tagName.toLowerCase();
    const block = BLOCKS.has(tag);
    if (block) out += '\n';
    if (tag === 'img') { const alt = n.getAttribute('alt'); if (alt) out += alt + ' '; }
    for (const c of n.childNodes) walk(c);
    if (block && tag !== 'br' && tag !== 'img') out += '\n';
  })(body);
  return out;
}

function normalizePath(opfDir, href) {
  const parts = (opfDir + href).split('/');
  const stack = [];
  for (const p of parts) {
    if (p === '.' || p === '') continue;
    if (p === '..') stack.pop(); else stack.push(p);
  }
  return stack.join('/');
}

async function convertEpubToText() {
  if (!selectedFile) { GZ.showToast(t('noFile')); return; }
  $('#status').textContent = t('loading');

  try {
    const buf = await selectedFile.arrayBuffer();
    const zip = await JSZip.loadAsync(buf);

    const containerXml = await zip.file('META-INF/container.xml')?.async('string');
    if (!containerXml) throw new Error(t('invalidEpub'));
    const opfPath = (containerXml.match(/full-path="([^"]+)"/) || [])[1];
    if (!opfPath) throw new Error(t('invalidEpub'));

    const opfXml = await zip.file(opfPath)?.async('string');
    if (!opfXml) throw new Error(t('invalidEpub'));
    const opfDir = opfPath.includes('/') ? opfPath.replace(/[^/]+$/, '') : '';

    const manifest = {};
    const itemRe = /<item\b[^>]*\/>/g;
    let m;
    while ((m = itemRe.exec(opfXml)) !== null) {
      const tag = m[0];
      const id = (tag.match(/id="([^"]+)"/) || [])[1];
      const href = (tag.match(/href="([^"]+)"/) || [])[1];
      const mt = (tag.match(/media-type="([^"]+)"/) || [])[1];
      if (id && href) manifest[id] = { href: decodeURIComponent(href), mediaType: mt || '' };
    }
    const spineIds = [];
    const spineRe = /<itemref\b[^>]*idref="([^"]+)"[^>]*\/?>/g;
    while ((m = spineRe.exec(opfXml)) !== null) spineIds.push(m[1]);
    if (!spineIds.length) Object.keys(manifest).forEach(k => { if (/xhtml|\/html/.test(manifest[k].mediaType)) spineIds.push(k); });

    $('#status').textContent = t('extracting');
    const chapters = [];
    for (const id of spineIds) {
      const item = manifest[id];
      if (!item || !/xhtml|\/html|htm$/.test(item.mediaType + item.href)) continue;
      const path = normalizePath(opfDir, item.href);
      const f = zip.file(path) || zip.file(decodeURIComponent(item.href));
      if (!f) continue;
      const htmlStr = await f.async('string');
      const doc = new DOMParser().parseFromString(htmlStr, 'text/html');
      doc.querySelectorAll('script,style,svg,noscript,head,[role="doc-pagebreak"]').forEach(e => e.remove());
      const txt = extractText(doc.body)
        .replace(/[ \t]+/g, ' ')
        .replace(/ *\n */g, '\n')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
      if (txt) chapters.push(txt);
    }
    if (!chapters.length) throw new Error(t('noText'));

    extracted = chapters.join('\n\n\n');
    const words = (extracted.match(/\S+/g) || []).length;
    $('#stats').style.display = 'flex';
    $('#stats').innerHTML =
      `<div class="stat"><div class="v">${chapters.length}</div><div class="k">${t('statChapters')}</div></div>` +
      `<div class="stat"><div class="v">${words.toLocaleString()}</div><div class="k">${t('statWords')}</div></div>` +
      `<div class="stat"><div class="v">${extracted.length.toLocaleString()}</div><div class="k">${t('statChars')}</div></div>`;
    const pv = $('#preview');
    pv.value = extracted;
    pv.classList.add('show');
    $('#status').innerHTML = `<span style="color:var(--gz-success)">${t('done')}</span>`;
  } catch (e) {
    $('#status').innerHTML = `<span style="color:var(--gz-accent)">${t('error')}${e.message}</span>`;
  }
}

function copyText() {
  if (!extracted) return;
  GZ.copyText ? GZ.copyText(extracted) : navigator.clipboard.writeText(extracted);
}

function downloadTxt() {
  if (!extracted) return;
  const blob = new Blob([extracted], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = selectedFile.name.replace(/\.epub$/i, '') + '.txt';
  a.click();
  URL.revokeObjectURL(url);
}

function clearAll() {
  selectedFile = null;
  extracted = '';
  $('#fileInfo').innerHTML = '';
  $('#status').textContent = '';
  $('#stats').style.display = 'none';
  const pv = $('#preview');
  pv.value = '';
  pv.classList.remove('show');
}

$('#toolbar').innerHTML = `<button class="gz-btn" onclick="convertEpubToText()">${t('convert')}</button><button class="gz-btn" onclick="downloadTxt()">${t('download')}</button><button class="gz-btn gz-btn-secondary" onclick="copyText()">${t('copy')}</button><button class="gz-btn gz-btn-secondary" onclick="clearAll()">${t('clear')}</button>`;

</script>
