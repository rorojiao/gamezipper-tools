<script>
GZI18n.register({
  en: {
    toolTitle: 'Number Tracing Worksheet Generator',
    toolDesc: 'Create printable dotted-line tracing practice sheets for numbers 1-10 up to 1-100. Perfect for preschool and kindergarten pencil practice — print or save as PDF.',
    ntwFrom: 'From', ntwTo: 'To', ntwSize: 'Cell size', ntwGuide: 'Show guide number', ntwDot: 'Show start dot',
    sizeS: 'Small', sizeM: 'Medium', sizeL: 'Large',
    ntwPrint: '🖨️ Print Worksheet',
    sheetTitle: 'Number Tracing Practice',
    sheetSub: 'Trace each dotted number. Name: __________   Date: __________',
    step1: 'Pick a number range (1-10, 1-20, 1-100 or any custom range up to 1000)',
    step2: 'Choose the cell size — Large for preschoolers, Small for more numbers per page',
    step3: 'Toggle the faint guide number and the red start dot as needed',
    step4: 'Click Print Worksheet and choose Save as PDF (A4) to print at home or school',
  },
  zh: {
    toolTitle: '数字描红练习纸生成器',
    toolDesc: '生成可打印的虚线数字描红练习纸，支持 1-10 到 1-100 任意范围。幼儿和一年级铅笔书写练习利器 — 一键打印或存为 PDF。',
    ntwFrom: '起始', ntwTo: '结束', ntwSize: '格子大小', ntwGuide: '显示示范数字', ntwDot: '显示起笔点',
    sizeS: '小', sizeM: '中', sizeL: '大',
    ntwPrint: '🖨️ 打印练习纸',
    sheetTitle: '数字描红练习',
    sheetSub: '沿虚线描数字。姓名：__________   日期：__________',
    step1: '选择数字范围（1-10、1-20、1-100 或最大到 1000 的自定义范围）',
    step2: '选择格子大小 — 幼儿用大格，一页更多数字用小格',
    step3: '按需开关浅色示范数字和红色起笔点',
    step4: '点击「打印练习纸」，在打印对话框选择另存为 PDF（A4）',
  }
});

const { $, t } = GZ;
let from = 1, to = 20, cellPx = 110, showGuide = true, showDot = true;

function cellSVG(n){
  const fs = String(n).length >= 3 ? 46 : (String(n).length === 2 ? 62 : 78);
  const dot = showDot ? `<circle class="ntw-start" cx="26" cy="22" r="4"/>` : '';
  const guide = showGuide ? `<text class="ntw-guide" x="50" y="72" font-size="${fs}" text-anchor="middle" font-family="'Comic Sans MS','Segoe UI',sans-serif">${n}</text>` : '';
  return `<svg viewBox="0 0 100 115" aria-label="trace ${n}">${guide}<text class="ntw-trace" x="50" y="72" font-size="${fs}" text-anchor="middle" font-family="'Comic Sans MS','Segoe UI',sans-serif">${n}</text>${dot}</svg>`;
}

function render(){
  const n = Math.max(0, to - from + 1);
  const cols = Math.max(2, Math.min(10, Math.floor(760 / cellPx)));
  $('#grid').style.gridTemplateColumns = `repeat(${cols}, minmax(0,1fr))`;
  $('#grid').innerHTML = Array.from({length: n}, (_, i) =>
    `<div class="ntw-cell">${cellSVG(from + i)}</div>`).join('');
  $('#sheet-title').textContent = t('sheetTitle') + ` (${from}–${to})`;
  $('#sheet-sub').textContent = t('sheetSub');
}

function clampSet(v, def){ v = parseInt(v, 10); if (isNaN(v)) v = def; return Math.max(0, Math.min(1000, v)); }

$('#controls').innerHTML = `
  <label>${t('ntwFrom')} <input class="gz-input" type="number" id="f" min="0" max="1000" value="1" style="width:70px"></label>
  <label>${t('ntwTo')} <input class="gz-input" type="number" id="e" min="0" max="1000" value="20" style="width:70px"></label>
  <select class="gz-select" id="sz"><option value="150">${t('sizeL')}</option><option value="110" selected>${t('sizeM')}</option><option value="80">${t('sizeS')}</option></select>
  <label><input type="checkbox" id="g" checked> ${t('ntwGuide')}</label>
  <label><input type="checkbox" id="d" checked> ${t('ntwDot')}</label>
  <button class="gz-btn" id="p">${t('ntwPrint')}</button>`;

$('#f').addEventListener('change', () => { from = clampSet($('#f').value, 1); if (from > to) { to = from; $('#e').value = to; } render(); });
$('#e').addEventListener('change', () => { to = clampSet($('#e').value, 20); if (to < from) { from = to; $('#f').value = from; } render(); });
$('#sz').addEventListener('change', () => { cellPx = +$('#sz').value; render(); });
$('#g').addEventListener('change', () => { showGuide = $('#g').checked; render(); });
$('#d').addEventListener('change', () => { showDot = $('#d').checked; render(); });
$('#p').addEventListener('click', () => window.print());

GZ.renderToolPage({
  category: 'calc',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'📏', href:'/calc/number-line-generator.html', name:'Number Line Generator'},
    {icon:'🧮', href:'/calc/math-worksheet-printable.html', name:'Math Worksheet'},
    {icon:'✖️', href:'/calc/multiplication-table.html', name:'Multiplication Table'},
    {icon:'📅', href:'/calc/printable-calendar.html', name:'Printable Calendar'},
  ]
});
render();
</script>
