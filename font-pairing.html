function loadFont(name) {
  if (document.querySelector(`link[data-gz-font="${name}"]`)) return;
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(name).replace(/%20/g, '+')}:wght@400;700&display=swap`;
  link.setAttribute('data-gz-font', name);
  document.head.appendChild(link);
}

function populateSelects() {
  const h = $('#hFont'), b = $('#bFont');
  FONTS.forEach(f => {
    const oh = document.createElement('option'); oh.value = f.n; oh.textContent = `${f.n} (${f.cat})`; h.appendChild(oh);
    const ob = document.createElement('option'); ob.value = f.n; ob.textContent = `${f.n} (${f.cat})`; b.appendChild(ob);
  });
  const mood = $('#mood');
  ['all','editorial','modern','playful','tech','luxury','classic','minimal'].forEach(m => {
    const o = document.createElement('option'); o.value = m; o.textContent = t('moods.' + m); mood.appendChild(o);
  });
}

  const body = rest.length ? rest.join(' — ') : t('sampleB');

  const css = `font-family: '${h}', serif; font-weight: 700;`;
  const bcss = `font-family: '${b}', sans-serif; font-weight: 400;`;
  const embed = `<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=${encodeURIComponent(h).replace(/%20/g, '+')}:wght@400;700&family=${encodeURIComponent(b).replace(/%20/g, '+')}:wght@400;700&display=swap" rel="stylesheet">`;
  const importCss = `@import url('https://fonts.googleapis.com/css2?family=${encodeURIComponent(h).replace(/%20/g, '+')}:wght@400;700&family=${encodeURIComponent(b).replace(/%20/g, '+')}:wght@400;700&display=swap');`;
  const cssBlock = `h1, h2, h3 {\n  ${css}\n}\nbody, p {\n  ${bcss}\n}`;
  $('#previewArea').innerHTML = `
    <div class="preview">
      <div class="label">${t('lblH')}: <b>${h}</b></div>
      <h2 style="${css}">${head}</h2>
      <div class="label">${t('lblB')}: <b>${b}</b></div>
      <h3 style="${css}">${t('sampleH')}</h3>
      <p style="${bcss}">${body}</p>
    </div>
    <h3 style="font-size:1.05em;margin:14px 0 8px">${t('lblEmbed')}</h3>
    <div class="tool-actions"><span class="label" style="font-size:.85em;align-self:center">${t('importLbl')}</span>
      <button class="gz-btn" onclick="copyEmbed('${escapeAttr(importCss)}','import')">${t('copy')}</button></div>
    <div class="code-block">${escapeHtml(importCss)}</div>
    <div class="tool-actions"><span class="label" style="font-size:.85em;align-self:center">${t('linkLbl')}</span>
      <button class="gz-btn" onclick="copyEmbed('${escapeAttr(embed)}','link')">${t('copy')}</button></div>
    <div class="code-block">${escapeHtml(embed)}</div>
    <div class="tool-actions"><span class="label" style="font-size:.85em;align-self:center">${t('cssLbl')}</span>
      <button class="gz-btn" onclick="copyEmbed('${escapeAttr(cssBlock)}','css')">${t('copy')}</button></div>
    <div class="code-block">${escapeHtml(cssBlock)}</div>`;
}

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s) { return s.replace(/'/g, "\\'").replace(/\n/g, "\\n"); }
window.copyEmbed = (s, k) => { copyText(s); GZ.showToast(t('copied')); };

function renderPairs() {
  const mood = $('#mood').value;
  const filtered = mood === 'all' ? PAIRS : PAIRS.filter(p => p.mood === mood);
  $('#pairCount').textContent = `${filtered.length} ${t('pairCount')}`;
  const grid = $('#pairGrid');
  grid.innerHTML = filtered.map(p => `
    <div class="pair-card" onclick="window.applyPair('${p.h}','${p.b}')">
      <div class="mood">${t('moods.' + p.mood)}</div>
      <div class="h" style="font-family:'${p.h}',serif;font-weight:700">${t('sampleH')}</div>
      <div class="b" style="font-family:'${p.b}',sans-serif">${t('sampleB').slice(0, 90)}…</div>
      <div class="meta"><span>${p.h} + ${p.b}</span></div>
    </div>`).join('');
  filtered.forEach(p => { loadFont(p.h); loadFont(p.b); });
}

window.applyPair = (h, b) => {
  $('#hFont').value = h; $('#bFont').value = b;
  renderPreview();
  document.querySelector('.preview').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
};

populateSelects();
$('#hFont').value = 'Playfair Display';
$('#bFont').value = 'Inter';
$('#previewText').value = `${t('sampleH')} — ${t('sampleB')}`;
$('#note').textContent = t('note');
$('#curatedHdr').textContent = t('curatedHdr');

['hFont','bFont','mood','previewText'].forEach(id => {
  $('#' + id).addEventListener('input', () => { renderPreview(); if (id === 'mood') renderPairs(); });
});
$('#mood').addEventListener('change', renderPairs);

GZ.renderToolPage({
  category: 'text',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'🔤', href:'/text/font-identifier.html', name:'What Font Is This'},
    {icon:'🎨', href:'/color/picker.html', name:'Color Picker'},
    {icon:'🔗', href:'/text/slug-generator.html', name:'Slug Generator'},
    {icon:'✍️', href:'/text/handwriting.html', name:'Text to Handwriting'}
  ]
});
renderPreview();
renderPairs();
</script>
<script src="/tools-result-rec.js?v=R449-flat" defer></script>
