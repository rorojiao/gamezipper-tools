  apparel:  {prefix:['Luxe','Velvet','Stitch','Sage','Loom','Thread','Drift','Atlas','Nova','Coast','Ember','Slate','Em','Aura'], root:['wear','craft','atelier','line','collective','co','couture','fashion','society','label'], suffix:[' co',' & co',' atelier',' apparel',' label',' clothier']},

  travel:   {prefix:['Wander','Atlas','Drift','Vista','Nomad','Voyage','Trail','Coast','Roam','Compass','Horizon'], root:['travel','tours','journey','trails','trips','co','explorer','escape','paths','voyage'], suffix:[' travel',' tours',' co',' escapes',' journeys',' atlas']},

  pet:      {prefix:['Paw','Furry','Bark','Whisker','Tails','Snout','Wag','Fluff','Cozy','Biscuit','Mochi'], root:['paws','co','shop','care','club','haus','lane','den','barn','buddy'], suffix:[' co',' shop',' care',' club',' haus',' lane']},

  finance:  {prefix:['Mint','Vault','Wealth','Bond','Equity','Ledger','Capital','Peak','Pulse','Arc'], root:['finance','capital','capital','assets','fund','advisors','co','works','group','partners'], suffix:[' capital',' finance',' group',' advisors',' fund',' partners']},
  design:   {prefix:['Studio','Form','Drift','Verse','Lume','Fold','Mesh','Loop','Arc','Knot'], root:['studio','design','atelier','works','collective','lab','co','haus','guild','core'], suffix:[' studio',' design',' atelier',' co',' works',' lab']},
  photo:    {prefix:['Frame','Lens','Aperture','Focus','Shutter','Golden','Snapped','Still','Wonder','Lumen'], root:['studio','pics','photo','shots','gallery','co','works','snap','haus','verse'], suffix:[' studio',' photo',' co',' shots',' gallery',' works']},
  music:    {prefix:['Beat','Echo','Vinyl','Sonic','Tone','Aria','Chord','Reverb','Groove','Lily'], root:['sound','records','studio','wave','co','haus','crew','loop','tunes','lab'], suffix:[' records',' sound',' studio',' co',' wave',' haus']},
  consulting:{prefix:['Edge','Pivot','North','Maple','Vector','Lume','Cobalt','Bright','Summit','Branch'], root:['advisors','group','consulting','co','partners','works','solutions','labs','collective','guild'], suffix:[' advisors',' group',' consulting',' partners',' solutions',' co']},
  realestate:{prefix:['Hearth','Key','Lodge','Anchor','Oak','Cedar','Bay','North','Summit','Maple','Park','Stone'], root:['properties','realty','homes','estates','group','co','works','partners','haus','lane'], suffix:[' realty',' properties',' homes',' group',' estates',' partners']},
  health:   {prefix:['Vital','Pulse','Care','Heal','Sage','Nimbus','Root','Calm','Bright','Echo'], root:['health','clinic','care','co','wellness','lab','partners','works','haus','guild'], suffix:[' care',' health',' clinic',' wellness',' lab',' co']},

const STYLE = {
  modern:   {pre:['V','Z','X','Q','Y','N'], mid:['ex','io','ly','ix','um','ent','ify','ora','umi','tra','o'], suf:['','ify','ly','io','hq','verse','base','plan','flow','mind','core']},
  classic:  {pre:['','The','Old','New','Grand','Royal','United','First','Blue','Red'], mid:['brook','ford','shire','cross','haven','hill','field','bridge','town','wood','dale','stone'], suf:['',' & sons',' co',' brothers',' and co',' ltd',' limited']},
  compound: {pre:['Blue','Iron','Silver','Bright','Night','Wild','Sweet','Quick','Top','High','Star','Pure'], mid:['leaf','stone','wave','peak','root','forge','wing','core','nest','craft','line','pulse','bowl'], suf:['',' labs',' forge',' works',' collective',' co',' group']},
  luxury:   {pre:['Ma','La','Vi','Do','Au','Bel','Sa','Ele','Lu','Re','Ve','Pi'], mid:['ven','ro','ren','cel','tis','mond','vier','ron','net','lla','san','ta','val'], suf:['a','o','é',' & co',' maison',' couture',' atelier',' club']},
  playful:  {pre:['Funky','Quirky','Zippy','Wobbly','Bubbly','Snappy','Bouncy','Whimsy','Jolly','Rascal','Zany','Daft'], mid:['bean','puff','sprite','muffin','panda','kitten','otter','spark','flip','zoom','hop','bop'], suf:[' co',' lab',' shop',' store',' factory',' cafe',' studio',' works']},
  minimal:  {pre:['A','B','D','E','F','K','L','M','N','O','P','R','S','T','V'], mid:['a','i','u','e','o','yo','va','ra','ne','lo','mo','si','ti','ry','ko'], suf:['','.','io','.co','hq','app']},
};

let favorites = JSON.parse(localStorage.getItem(FAV_KEY) || '[]');

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function genName(industry, style, targetLen) {
  const i = I[industry], st = STYLE[style];
  // Build pieces
  const usePre = Math.random() < 0.85;
  const useSuf = Math.random() < 0.7;
  const useStyle = Math.random() < 0.45;
  let parts = [];
  if (usePre) parts.push(cap(pick(i.prefix)));
  else if (useStyle) parts.push(cap(pick(st.pre)));
  parts.push(cap(pick(i.root)));
  if (useStyle && Math.random() < 0.6) parts.push(pick(st.mid));
  if (useSuf) {
    let s = pick(i.suffix);
    parts.push(s.startsWith(' ') ? s.trim() : s);
  } else if (useStyle) parts.push(pick(st.suf));
  let name = parts.join('').replace(/\s+/g,' ').trim();
  // Length control
  let tries = 0;
  while (Math.abs(name.replace(/\s/g,'').length - targetLen) > 3 && tries < 5) {
    tries++;
    parts = [];
    if (usePre) parts.push(cap(pick(i.prefix)));
    else if (useStyle) parts.push(cap(pick(st.pre)));
    parts.push(cap(pick(i.root)));
    if (useSuf) {
      let s = pick(i.suffix);
      parts.push(s.startsWith(' ') ? s.trim() : s);
    } else if (useStyle) parts.push(pick(st.suf));
    name = parts.join('').replace(/\s+/g,' ').trim();
  }
  return name.replace(/\s+/g,' ').replace(/^\./, '');
}

function estimateAvailability(name) {
  // Cheap heuristic: invented (V/Z/Q/X present or ends with .io/.ly/.ify) more likely available than classic words
  const invented = /[VXZQ]|^Zy|^Flux|^Nim|^Q|ify$|\.io$|ly$/.test(name);
  const compound = name.split(' ').length >= 2 && !name.endsWith('co');
  const shortish = name.replace(/\s/g,'').length <= 7;
  const lucky = !/[aeiou]{3,}[bcdfghjklmnpqrstvwxyz]{3,}/i.test(name.toLowerCase()) && !/^The\s/i.test(name);
  if (invented && (shortish||compound) && lucky) return 'likely';
  if (invented || compound) return 'possible';
  return 'unlikely';
}

function tagForAvail(av) {
  return av === 'likely' ? {label:'✓ likely .com', cls:'ok'} : av === 'possible' ? {label:'~ maybe .com', cls:'mid'} : {label:'? check .com', cls:'risk'};
}

function renderCards() {
  const industry = $('#industry').value;
  const style = $('#style').value;
  const len = parseInt($('#length').value, 10);
  const qty = parseInt($('#qty').value, 10);
  const seen = new Set();
  const names = [];
  let attempts = 0;
  while (names.length < qty && attempts < qty * 6) {
    const n = genName(industry, style, len);
    attempts++;
    if (!seen.has(n.toLowerCase()) && n.length > 1 && /[a-z]/i.test(n)) {
      seen.add(n.toLowerCase());
      names.push(n);
    }
  }
  const out = names.map(n => {
    const av = estimateAvailability(n);
    const tg = tagForAvail(av);
    const isFav = favorites.includes(n);
    return `<div class="name-card" data-name="${n.replace(/"/g,'&quot;')}">
      <button class="star ${isFav?'on':''}" title="Favorite">★</button>
      <div class="nm">${n}</div>
      <div class="meta"><span class="badge ${tg.cls}">${tg.label}</span><span style="opacity:.5">${industry}</span></div>
      <button class="copybtn">${t('copied')}</button>
    </div>`;
  }).join('');
  $('#cards').innerHTML = out;
  renderFav();
  wireCards();
}

function renderFav() {
  const box = $('#fav-panel');
  if (favorites.length === 0) { box.style.display = 'none'; return; }
  box.style.display = '';
  $('#fav-list').innerHTML = favorites.map(n => `<span class="fav-chip">${n.replace(/</g,'&lt;')}<button data-name="${n.replace(/"/g,'&quot;')}">✕</button></span>`).join('');
  $('#fav-list').querySelectorAll('button[data-name]').forEach(b => b.onclick = () => {
    favorites = favorites.filter(x => x !== b.dataset.name);
    saveFav(); renderCards();
  });
  $('#copyAllFav').textContent = t('copyAll');
  $('#clearFav').textContent = t('clearAll');
}

function saveFav() { localStorage.setItem(FAV_KEY, JSON.stringify(favorites)); }

function wireCards() {
  $$('#cards .name-card').forEach(card => {
    const name = card.dataset.name;
    const btn = card.querySelector('.copybtn');
    const star = card.querySelector('.star');
    card.querySelector('.nm').onclick = () => {
      copyText(name).then(() => {
        btn.textContent = t('copied');
        setTimeout(() => { btn.textContent = t('copied'); }, 1400);
      });
      window.open(`https://www.google.com/search?q=%22${encodeURIComponent(name)}%22+register+domain`, '_blank', 'noopener');
    };
    btn.onclick = (e) => { e.stopPropagation(); copyText(name).then(() => { btn.textContent = t('copied'); setTimeout(() => { btn.textContent = t('copied'); }, 1400); }); };
    star.onclick = (e) => {
      e.stopPropagation();
      if (favorites.includes(name)) favorites = favorites.filter(x => x !== name);
      else { favorites.push(name); btn.textContent = t('addedFav'); setTimeout(() => { btn.textContent = t('copied'); }, 1400); }
      saveFav();
      star.classList.toggle('on');
      renderFav();
    };
  });
}

const $$ = s => Array.from(document.querySelectorAll(s));

function renderTags() {
  const bar = $('#industry-tagbar');
  const inds = Object.keys(I);
  bar.innerHTML = `<span style="font-size:.82em;opacity:.7;margin-right:6px">${t('quickPicks')}</span>` + inds.slice(0,10).map(k => {
    const labels = {tech:'💻 Tech',coffee:'☕ Coffee',apparel:'👕 Apparel',marketing:'📣 Marketing',fitness:'💪 Fitness',food:'🍴 Food',travel:'✈️ Travel',gaming:'🎮 Gaming',pet:'🐾 Pet',beauty:'💄 Beauty'};
    return `<span class="tag" data-ind="${k}">${labels[k]||k}</span>`;
  }).join('');
  bar.querySelectorAll('.tag').forEach(b => b.onclick = () => {
    $('#industry').value = b.dataset.ind;
    renderCards();
  });
}

$('#toolbar').innerHTML = `
  <button class="gz-btn" id="btnGen">${t('generate')}</button>
  <button class="gz-btn gz-btn-secondary" id="btnRefresh">${t('refresh')}</button>`;
$('#btnGen').onclick = renderCards;
$('#btnRefresh').onclick = renderCards;
$('#industry').onchange = renderCards;
$('#style').onchange = renderCards;
$('#copyAllFav').onclick = () => copyText(favorites.join('\n'));
$('#clearFav').onclick = () => { favorites = []; saveFav(); renderCards(); };

GZ.renderToolPage({
  category: 'text',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'🧙', href:'/text/name-generator.html', name:'Name Generator'},
    {icon:'🏷️', href:'/text/limerick-generator.html', name:'Limerick Generator'},
    {icon:'🎯', href:'/text/slug-generator.html', name:'Slug Generator'},
    {icon:'⭐', href:'/text/testimonial-generator.html', name:'Testimonial Generator'},
  ]
});
renderTags();
renderCards();
</script>
