const {$,t,copyText}=GZ;
let scale='4.0';
const SCALES=[{id:'4.0',label:'4.0',max:4.0},{id:'4.3',label:'4.3',max:4.3},{id:'5.0',label:'5.0',max:5.0},{id:'10.0',label:'10.0',max:10.0},{id:'100',label:'100%',max:100}];
const lettersArr=()=>t('letters')||[];
function buildTabs(){
  const el=$('#scaleTabs');el.innerHTML='';
  SCALES.forEach(s=>{const b=document.createElement('button');b.type='button';b.className='gsc-scale-tab'+(s.id===scale?' active':'');b.textContent=s.label;b.dataset.scale=s.id;b.onclick=()=>{scale=s.id;buildTabs();render();updateInputLimit();};el.appendChild(b);});
}
function updateInputLimit(){
  const s=SCALES.find(x=>x.id===scale);
  const inp=$('#inputVal');inp.max=s.max;inp.value=Math.min(parseFloat(inp.value)||0,s.max);
}
function findLetter(gpa40){
  const arr=lettersArr();
  if(!arr||!arr.length)return null;
  if(gpa40>=4.0)return arr[0];
  if(gpa40<=0)return arr[arr.length-1];
  for(let i=0;i<arr.length-1;i++){if(gpa40>=arr[i+1].d40)return arr[i];}
  return arr[arr.length-1];
}
function gpaTo4(value){
  const v=parseFloat(value);
  if(isNaN(v))return null;
  switch(scale){
    case '4.0':return v;
    case '4.3':return v*4.0/4.3;
    case '5.0':return v*4.0/5.0;
    case '10.0':return v*4.0/10.0;
    case '100':return v*4.0/100.0;
    default:return v;
  }
}
function gpaFrom4(g40){
  switch(scale){
    case '4.0':return g40;
    case '4.3':return g40*4.3/4.0;
    case '5.0':return g40*5.0/4.0;
    case '10.0':return g40*10.0/4.0;
    case '100':return g40*100.0/4.0;
    default:return g40;
  }
}
function fmt(n,dp){if(n===null||isNaN(n))return '—';return Number(n.toFixed(dp)).toString();}
function render(){
  const raw=$('#inputVal').value;
  const v=parseFloat(raw);
  const out=$('#results');out.innerHTML='';
  if(isNaN(v)){$('#letterBig').textContent='—';$('#letterDesc').textContent=t('invalid');return;}
  const g40=gpaTo4(v);
  if(g40===null)return;
  const g43=gpaFrom4(g40)*4.3/4.0;
  const g50=gpaFrom4(g40)*5.0/4.0;
  const g10=gpaFrom4(g40)*10.0/4.0;
  const gpct=gpaFrom4(g40)*100.0/4.0;
  const rows=[
    {l:'4.0 Scale',v:fmt(g40,2),big:true},
    {l:'4.3 Scale',v:fmt(g43,2)},
    {l:'5.0 Scale (weighted)',v:fmt(g50,2)},
    {l:'10.0 Scale (India)',v:fmt(g10,2)},
    {l:'Percentage (0–100)',v:fmt(gpct,1)+'%'}
  ];
  rows.forEach(r=>{const div=document.createElement('div');div.className='gsc-row'+(r.big?' big':'');div.innerHTML=`<span class="lbl">${r.l}</span><span class="val">${r.v}</span>`;out.appendChild(div);});
  const lt=findLetter(g40);
  if(lt){$('#letterBig').textContent=lt.l;$('#letterDesc').textContent=lt.pct+' · '+lt.d40.toFixed(1)+' on 4.0 scale';}
  else{$('#letterBig').textContent='—';$('#letterDesc').textContent='';}
}
function renderTable(){
  const arr=lettersArr();
  const tb=$('#convTable');tb.innerHTML='';
  if(!arr||!arr.length)return;
  arr.forEach(lt=>{const tr=document.createElement('tr');tr.innerHTML=`<td><b>${lt.l}</b></td><td>${lt.d40.toFixed(1)}</td><td>${lt.d43.toFixed(1)}</td><td>${lt.d50.toFixed(1)}</td><td>${lt.d10.toFixed(1)}</td><td>${lt.pct}</td>`;tb.appendChild(tr);});
}
function doReset(){$('#inputVal').value='3.5';$('#direction').selectedIndex=0;$('#region').selectedIndex=0;scale='4.0';buildTabs();updateInputLimit();render();}
function doExample(){$('#inputVal').value='8.2';scale='10.0';buildTabs();updateInputLimit();render();}
function doCopy(){
  const text=$('#results').innerText;
  if(text)copyText(text);
}
$('#inputVal').addEventListener('input',render);
$('#direction').addEventListener('change',render);
$('#region').addEventListener('change',render);
$('#toolbar').innerHTML=`
<button class="gz-btn" onclick="render()">${t('calc')}</button>
<button class="gz-btn gz-btn-secondary" onclick="doExample()">${t('example')}</button>
<button class="gz-btn gz-btn-secondary" onclick="doReset()">${t('reset')}</button>
<button class="gz-btn gz-btn-secondary" onclick="doCopy()">${t('copy')}</button>`;
buildTabs();updateInputLimit();renderTable();render();
