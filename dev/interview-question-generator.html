// ==== Mix selection ====
function pickMix(role, level, stage, mix) {
  const set = BANK[role];
  if (!set) return [];
  const out = [];
  const isExec = stage === 'exec';
  const isTech = stage === 'panel' && (role === 'eng' || role === 'data');
  // Default mix counts
  let behavioral = 3, technical = 2, situational = 2, culture = 1, reverse = 4;
  if (mix === 'behavioral') { behavioral = 4; technical = 1; situational = 2; culture = 1; reverse = 4; }
  if (mix === 'technical') { behavioral = 2; technical = 4; situational = 1; culture = 1; reverse = 4; }
  if (mix === 'exec') { behavioral = 3; technical = 1; situational = 3; culture = 2; reverse = 5; }
  // Seniority weighting
  if (level === 'staff') { technical += 1; situational += 1; behavioral -= 1; }
  if (level === 'junior') { behavioral += 1; technical -= 1; }
  // Stage weighting
  if (isExec) { behavioral = Math.max(behavioral, 3); situational += 1; reverse += 1; }
  if (isTech) { technical = Math.max(technical, 3); }
  // Pick deterministically by rotation (use simple seeded shuffle so reloads vary but stay reproducible per render call)
  const seed = (role + level + stage + mix).split('').reduce((a, c) => a + c.charCodeAt(0), 0);
  function pickN(arr, n) {
    if (!arr || !arr.length) return [];
    const copy = arr.slice();
    // deterministic Fisher-Yates with seed
    let s = seed;
    for (let i = copy.length - 1; i > 0; i--) {
      s = (s * 9301 + 49297) % 233280;
      const j = Math.floor((s / 233280) * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy.slice(0, Math.min(n, copy.length));
  }
  out.push(...pickN(set.behavioral || [], behavioral).map(x => ({cat:'behavioral', ...x})));
  out.push(...pickN(set.technical || [], technical).map(x => ({cat:'technical', ...x})));
  out.push(...pickN(set.situational || [], situational).map(x => ({cat:'situational', ...x})));
  out.push(...pickN(set.culture || [], culture).map(x => ({cat:'culture', ...x})));
  // Reverse section last
  const reverseQs = pickN(set.reverse || [], reverse);
  return { questions: out, reverse: reverseQs };
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
}

function render() {
  const role = $('#iq-role').value;
  const level = $('#iq-level').value;
  const stage = $('#iq-stage').value;
  const mix = $('#iq-mix').value;
  const pack = pickMix(role, level, stage, mix);
  if (!pack.questions || !pack.questions.length) {
    $('#iq-output').innerHTML = `<div class="iq-empty">${t('empty')}</div>`;
    return '';
  }
  let html = '';
  pack.questions.forEach((q, i) => {
    const catLabel = t('catLabels.' + q.cat);
    html += `<div class="iq-q"><h4><span>${i+1}. ${escapeHTML(q.q)}</span><span class="iq-tag ${q.cat}">${escapeHTML(catLabel)}</span></h4>`;
    if (q.why) html += `<div class="iq-why"><strong>${escapeHTML(t('whyAsk'))}:</strong> ${escapeHTML(q.why)}</div>`;
    if (q.star) html += `<div class="iq-star"><strong>${escapeHTML(t('starScaffold'))}:</strong> ${escapeHTML(q.star)}</div>`;
    if (q.probe) html += `<div class="iq-probe"><strong>${escapeHTML(t('probe'))}:</strong> ${escapeHTML(q.probe)}</div>`;
    html += `</div>`;
  });
  if (pack.reverse && pack.reverse.length) {
    html += `<div class="iq-q"><h4><span>${escapeHTML(t('reverseHeader'))}</span></h4><ol style="padding-left:20px;margin:6px 0">`;
    pack.reverse.forEach(r => { html += `<li style="margin:4px 0;line-height:1.5">${escapeHTML(r)}</li>`; });
    html += `</ol></div>`;
  }
  $('#iq-output').innerHTML = html;
  // Plain text for copy
  let text = '';
  pack.questions.forEach((q, i) => {
    text += `${i+1}. [${t('catLabels.' + q.cat)}] ${q.q}\n`;
    if (q.why) text += `   ${t('whyAsk')}: ${q.why}\n`;
    if (q.star) text += `   ${t('starScaffold')}: ${q.star}\n`;
    if (q.probe) text += `   ${t('probe')}: ${q.probe}\n`;
    text += '\n';
  });
  if (pack.reverse && pack.reverse.length) {
    text += `\n${t('reverseHeader')}:\n`;
    pack.reverse.forEach((r, i) => { text += `  ${i+1}. ${r}\n`; });
  }
  return text;
}

// ==== Init selects ====
function fillSelect(el, dict) {
  el.innerHTML = '';
  Object.keys(dict).forEach(k => {
    const opt = document.createElement('option');
    opt.value = k;
    opt.textContent = dict[k];
    el.appendChild(opt);
  });
}

fillSelect($('#iq-mix'), t('mixes'));

let lastOutput = '';

  lastOutput = '';
});
$('#iq-copy').addEventListener('click', () => {

  if (!lastOutput) return;
  copyText(lastOutput);

  $('#iq-copy').textContent = t('copied');
  setTimeout(() => { $('#iq-copy').textContent = orig; }, 1200);
});
