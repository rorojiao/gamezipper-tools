<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "What does an online mouse jiggler do?", "acceptedAnswer": {"@type": "Answer", "text": "A mouse jiggler prevents your computer from going idle. This web version keeps your display awake with the browser Wake Lock API and generates simulated cursor activity on the page, so idle timers in web applications do not trigger while the tab is open."}}, {"@type": "Question", "name": "Can it stop my screen from turning off?", "acceptedAnswer": {"@type": "Answer", "text": "Yes, while the tab is open and visible: the Wake Lock API asks the operating system to keep the display awake. If your company enforces a system-wide lock policy, the OS lock screen may still appear — jiggling inside a browser tab cannot override IT-enforced policies."}}, {"@type": "Question", "name": "Will it keep my Teams, Slack or Zoom status green?", "acceptedAnswer": {"@type": "Answer", "text": "Browsers cannot inject real input events into other desktop applications, so the jiggle only affects the web page itself and screen sleep. For web versions of Teams or Slack opened in another tab, idle timers often still detect general system activity; for a guaranteed system-wide effect use a native jiggle app or a USB hardware jiggle device."}}, {"@type": "Question", "name": "Do I need to install an app or extension?", "acceptedAnswer": {"@type": "Answer", "text": "No. The jiggler runs entirely in your browser with no download, no extension and no account. Just open this page, press Start and keep the tab visible. It works on Chrome, Edge, Safari and other modern browsers that support the Wake Lock API."}}]}</script>

<script>
GZI18n.register({
  en: {
    toolTitle: 'Online Mouse Jiggler',
    toolDesc: 'Free mouse jiggler that keeps your screen awake and simulates cursor activity — adjustable speed, live timer, no install needed.',
    idle: 'Idle', active: 'Jiggling',
    start: '▶ Start Jiggler', stop: '⏹ Stop',

    wakeOk: 'Screen wake lock is active — your display stays awake while this tab is visible.',
    wakeNo: 'Your browser does not support the Wake Lock API — the cursor jiggle still runs, but your OS may still sleep the display.',
    wakeLost: 'Wake lock was released because the tab went to the background. Bring it back to the foreground and it re-locks automatically.',
    step1: 'Pick a jiggle speed: Intense (2s), Normal (10s) or Gentle (30s)',
    step2: 'Press Start Jiggler — the page requests a screen wake lock',
    step3: 'Keep this tab visible on screen while it runs',
    step4: 'Watch the timer and jiggle counter — press Stop when you are done',
  },
  zh: {
    toolTitle: '在线鼠标抖动器',
    toolDesc: '免费在线鼠标抖动器，防止屏幕休眠并模拟光标活动 — 可调抖动频率、实时计时，无需安装。',
    idle: '待机', active: '抖动中',
    start: '▶ 开始抖动', stop: '⏹ 停止',
    jiggleLabel: '次抖动已发送',
    lblSpeed: '抖动频率', lblSound: '抖动提示音',
    spFast: '强 — 每 2 秒', spNormal: '标准 — 每 10 秒', spGentle: '弱 — 每 30 秒',
    snOff: '关闭', snOn: '开启',
    wakeOk: '屏幕唤醒锁已激活 — 此标签页可见时显示器不会休眠。',
    wakeNo: '您的浏览器不支持 Wake Lock API — 光标抖动仍运行，但系统可能仍会关闭显示器。',
    wakeLost: '标签页切到后台，唤醒锁已释放；切回前台后将自动重新获取。',
    step1: '选择抖动频率：强（2 秒）、标准（10 秒）或弱（30 秒）',
    step2: '点击「开始抖动」— 页面同时申请屏幕唤醒锁',
    step3: '运行期间保持此标签页在屏幕上可见',
    step4: '查看计时器和抖动计数 — 完成后点击「停止」',
  }
});

const { $, t } = GZ;
let running = false, intervalMs = 10000, jiggles = 0, timerId = null, tickId = null, startTs = 0;
let wakeLock = null, audioCtx = null;

function fmt(s){const m=Math.floor(s/60),ss=s%60;return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');}

function setStatus(on){
  const st=$('#status');
  st.classList.toggle('mj-on',on);
  $('#statusText').textContent = on ? t('active') : t('idle');
  const btn=$('#startBtn');
  btn.textContent = on ? t('stop') : t('start');
  btn.classList.toggle('stop',on);
}

async function acquireWakeLock(){
  if(!('wakeLock' in navigator)){ $('#wakeNote').textContent = t('wakeNo'); $('#wakeNote').classList.add('mj-warn'); return; }
  try{
    wakeLock = await navigator.wakeLock.request('screen');
    $('#wakeNote').textContent = t('wakeOk'); $('#wakeNote').classList.remove('mj-warn');
    wakeLock.addEventListener('release', ()=>{});
  }catch(e){ $('#wakeNote').textContent = t('wakeNo'); $('#wakeNote').classList.add('mj-warn'); }
}
document.addEventListener('visibilitychange', ()=>{
  if(running && document.visibilityState==='visible' && (!wakeLock || wakeLock.status==='released')){
    $('#wakeNote').textContent = t('wakeLost'); $('#wakeNote').classList.add('mj-warn');
    acquireWakeLock();
  }
});

function beep(){
  if($('#soundToggle').value!=='on') return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.frequency.value=880; g.gain.setValueAtTime(.05,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.08);
    o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+.09);
  }catch(e){}
}

function jiggle(){
  const scr=$('#screen'), cur=$('#cursor');
  const w=scr.clientWidth, h=scr.clientHeight;
  const x=20+Math.random()*(w-60), y=20+Math.random()*(h-60);
  cur.style.left=x+'px'; cur.style.top=y+'px';
  const r=document.createElement('div'); r.className='mj-ripple';
  r.style.left=(x+11)+'px'; r.style.top=(y+11)+'px';
  scr.appendChild(r); setTimeout(()=>r.remove(),1000);
  jiggles++; $('#jiggleCount').textContent=jiggles;
  beep();
}

function start(){
  running=true; jiggles=0; $('#jiggleCount').textContent='0';
  startTs=Date.now();
  clearInterval(tickId);
  tickId=setInterval(()=>{ $('#timer').textContent=fmt(Math.floor((Date.now()-startTs)/1000)); },1000);
  clearInterval(timerId);
  jiggle();
  timerId=setInterval(jiggle, intervalMs);
  acquireWakeLock();
  setStatus(true);
}
function stop(){
  running=false;
  clearInterval(timerId); clearInterval(tickId);
  if(wakeLock){ try{wakeLock.release();}catch(e){} wakeLock=null; }
  setStatus(false);
}

$('#startBtn').addEventListener('click', ()=> running ? stop() : start());
$('#speedSelect').addEventListener('change', e=>{ intervalMs=+e.target.value; if(running){ clearInterval(timerId); timerId=setInterval(jiggle,intervalMs); } });
document.querySelectorAll('#speedSelect option, #soundToggle option').forEach(opt=>{ if(opt.dataset.i18n) opt.textContent=t(opt.dataset.i18n); });
$('#lblSpeed').textContent=t('lblSpeed');
$('#lblSound').textContent=t('lblSound');
$('#jiggleLabel').textContent=t('jiggleLabel');
$('#statusText').textContent=t('idle');
$('#startBtn').textContent=t('start');

  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],

});
