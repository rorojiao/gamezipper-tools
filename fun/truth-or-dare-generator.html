const { $, t, showToast } = GZ;

const PROMPTS = {

    ],
    spicy: [
      "What is your biggest turn-on?",
      "What is the wildest thing on your bucket list?",
      "What is the most embarrassing thing in your search history?",
      "What is the boldest thing you have done for love?",
      "Have you ever had a crush on a friend's partner?",
      "What is the riskiest text you have ever sent?",
      "What is your most forbidden fantasy?",
      "What is the longest you have gone without sleep and why?",
      "What is the most reckless thing you have done?",
      "What is the pettiest reason you have ever ended a friendship?",
      "What is the biggest lie you have ever told?",
      "What is the most embarrassing thing you have done while drunk?",
    ],
  },
  dare: {
    family: [
      "Do your best impression of a famous character for 30 seconds.",
      "Sing the chorus of your favorite song.",
      "Do 10 jumping jacks.",
      "Speak in an accent for the next three rounds.",
      "Do a silly dance for 15 seconds.",
      "Make a funny face and hold it for 30 seconds.",
      "Talk only in questions for the next two minutes.",

      "Walk across the room like a crab.",

      "Sing a love song to the player next to you.",

      "Share the most romantic thing your partner has ever said.",

    ],
    spicy: [
      "Demonstrate your best kiss.",
      "Give a sensual shoulder massage for 30 seconds.",
      "Send a flirty selfie to your partner.",
      "Whisper your favorite fantasy into the next player's ear.",
      "Give your partner a hickey (consensually!).",
      "Do a slow-motion runway walk in your best outfit.",
      "Reenact your most romantic memory.",
      "Slow dance with your partner in a way the group chooses.",
      "Write down the most daring thing you have done and read it aloud.",
      "Share the boldest text you have ever sent.",
      "Kiss your partner in the spot the group picks.",
      "Give your partner a 60-second massage, anywhere they pick.",
    ],
  },
};

const SPICES = ['family','funny','romantic','spicy'];
const MODES = ['truth','dare'];
let currentMode = 'truth';
let currentSpice = 'funny';
let currentText = '';
let favs = [];
let spinCount = 0;
try { favs = JSON.parse(localStorage.getItem('gz_td_favs') || '[]'); spinCount = parseInt(localStorage.getItem('gz_td_spins') || '0', 10); } catch(e){ favs = []; spinCount = 0; }

function pool() {
  const set = PROMPTS[currentMode] && PROMPTS[currentMode][currentSpice];
  if (!set) return [];
  return set;
}

function colorFor() {
  if (currentMode === 'truth') return ['#4ecdc4', '#44a08d'];
  return ['#e94560', '#9b5de5'];
}

function renderCard() {
  const card = $('#tdCard');
  const [c1, c2] = colorFor();
  card.style.setProperty('--card-c1', c1);
  card.style.setProperty('--card-c2', c2);
  card.style.background = `linear-gradient(135deg, ${c1}, ${c2})`;
  $('#tdLabel').textContent = currentMode === 'truth' ? t('mode_truth').replace(/💭\s*/, '') : t('mode_dare').replace(/🔥\s*/, '');
}

function spinPrompt() {
  const p = pool();
  if (!p.length) { $('#tdText').textContent = t('empty'); return; }
  let next;
  let guard = 0;
  do { next = p[Math.floor(Math.random() * p.length)]; guard++; }
  while (next === currentText && p.length > 1 && guard < 10);
  currentText = next;
  $('#tdText').textContent = currentText;
  spinCount++;
  try { localStorage.setItem('gz_td_spins', String(spinCount)); } catch(e){}
  updateStats();
  updateFavBtn();
}

function setMode(m) {
  currentMode = m;
  currentText = '';
  $('#btnTruth').classList.toggle('active-truth', m === 'truth');
  $('#btnDare').classList.toggle('active-dare', m === 'dare');
  renderCard();
  $('#tdText').textContent = t('empty');
  updateFavBtn();
}

function setSpice(s) {
  currentSpice = s;
  currentText = '';
  document.querySelectorAll('#spiceBtns button').forEach(b => b.classList.toggle('active', b.dataset.spice === s));
  $('#tdText').textContent = t('empty');
  updateFavBtn();
}

function copyCurrent() {
  if (!currentText) return;
  GZ.copyText(currentText);
  showToast(t('btnCopy') + ' ✓');
}

function isFav() { return favs.includes(currentText); }
function updateFavBtn() { $('#btnFav').innerHTML = isFav() ? '❤️' : '🤍'; }

function toggleFav() {
  if (!currentText) return;
  if (isFav()) { favs = favs.filter(f => f !== currentText); }
  else { favs.unshift({ mode: currentMode, spice: currentSpice, text: currentText }); }
  try { localStorage.setItem('gz_td_favs', JSON.stringify(favs)); } catch(e){}
  updateFavBtn();
  renderFavs();
}

function renderFavs() {
  const box = $('#favList');
  if (!favs.length) { box.innerHTML = ''; return; }
  box.innerHTML = `<h3 style="text-align:center;margin:8px 0">${t('favTitle')}</h3>` + favs.map((f, i) =>
    `<div class="td-fav-item"><span class="txt">[${f.mode === 'truth' ? '💭' : '🔥'}] ${f.text}</span><button onclick="removeFav(${i})" title="${t('remove')}">${t('remove')}</button></div>`
  ).join('');
}

function removeFav(i) {
  favs.splice(i, 1);
  try { localStorage.setItem('gz_td_favs', JSON.stringify(favs)); } catch(e){}
  updateFavBtn();
  renderFavs();
}

function updateStats() {
  $('#tdStats').innerHTML = `<strong>${t('stats_label')}:</strong> ${spinCount}`;
}

const spiceBox = $('#spiceBtns');
SPICES.forEach(s => {
  const btn = document.createElement('button');
  btn.textContent = t('spice_' + s);
  btn.dataset.spice = s;
  if (s === currentSpice) btn.classList.add('active');
  btn.onclick = () => setSpice(s);
  spiceBox.appendChild(btn);
});

$('#btnCopy').textContent = t('btnCopy');
$('#btnFav').textContent = t('btnFav');
$('#btnTruth').textContent = t('mode_truth');
$('#btnDare').textContent = t('mode_dare');
setMode('truth');
renderFavs();
updateStats();

GZ.renderToolPage({
  category: 'fun',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'🎯', href:'/fun/spin-the-bottle.html', name:'Spin the Bottle'},
    {icon:'🎡', href:'/fun/spinning-wheel.html', name:'Spinning Wheel'},

    {icon:'🎲', href:'/fun/dice-roller.html', name:'Dice Roller'},
  ]
});
