<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"如何打开 HAR 文件？","acceptedAnswer":{"@type":"Answer","text":"在 Chrome、Edge 或 Firefox 中打开 DevTools，切换到 Network 面板，勾选 Preserve log，复现要抓取的页面或 API 流程，然后右键请求列表选择 Save all as HAR with content。把生成的 .har 文件拖到本工具，或使用文件选择器即可。全部在浏览器本地解析。In Chrome, Edge or Firefox open DevTools, switch to the Network tab, tick Preserve log, reproduce the page or API flow you want to capture, then right-click the request list and choose Save all as HAR with content. Drop the resulting .har file onto this tool, or use the file picker. Everything is parsed locally in your browser."}},{"@type":"Question","name":"把 HAR 文件上传到在线查看器安全吗？","acceptedAnswer":{"@type":"Answer","text":"通常不安全。HAR 是浏览会话的完整记录，包含你发出的每个请求头，Authorization bearer token、会话 cookie 和 API key 都以明文存在其中。本查看器不上传任何内容 — 文件由 File API 读取并在浏览器内解析 — 并且还能生成一份清空凭据的脱敏副本。Usually not. A HAR is a complete record of a browsing session and includes every request header you sent, so Authorization bearer tokens, session cookies and API keys sit inside it in plain text. This viewer never uploads anything - the file is read with the File API and parsed in your browser - and it can also produce a redacted copy with credentials stripped."}},{"@type":"Question","name":"瀑布图耗时分解代表什么？","acceptedAnswer":{"@type":"Answer","text":"每根柱状条展示单个请求的 HAR 各阶段：blocked 与 DNS 是排队和解析时间，connect 与 SSL 是 TCP 和 TLS 握手，send 是上传，wait 是服务端处理时间，receive 是下载。wait 过长通常说明服务端慢，receive 过长说明载荷大或网络慢。Each bar shows the HAR phases for one request: blocked and DNS are queue and lookup time, connect and SSL are the TCP and TLS handshakes, send is upload, wait is server think time, and receive is download. A long wait usually means slow server processing, while a long receive means a large payload or a slow connection."}},{"@type":"Question","name":"如何把请求复制为 cURL？","acceptedAnswer":{"@type":"Answer","text":"在请求列表中点击任意一行打开详情面板，切换到 Raw 标签并点 Copy cURL。该命令由抓取到的方法、URL、响应头和正文重建，可在终端、Postman 或 curl.exe 中重放这次调用。Click any row in the request list to open its detail panel, switch to the Raw tab, and press Copy cURL. The command is rebuilt from the captured method, URL, headers and body so you can replay the exact call in a terminal, Postman or curl.exe."}},{"@type":"Question","name":"分享前如何脱敏 HAR？","acceptedAnswer":{"@type":"Answer","text":"点 Redact and download，得到一份 Authorization 与 Cookie 响应头被清空、请求与响应正文被移除、敏感查询参数在 queryString 数组和 URL 中都被遮蔽的合法 HAR。结果仍能在任何 HAR 查看器中打开，可以安全附到 bug 报告或支持工单里。Press Redact and download to get a valid HAR with Authorization and Cookie headers emptied, request and response bodies removed, and sensitive query parameters masked in both the queryString array and the URL. The result still opens in any HAR viewer, so it is safe to attach to a bug report or a support ticket."}}]}</script>

var $ = function (s) { return document.querySelector(s); };

var sel = -1;
var tab = 'overview';

var asc = true;

/* ---------------- helpers ---------------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function fmtBytes(n) {
  n = Number(n) || 0;
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(2) + ' MB';
}
function fmtMs(n) {
  n = Number(n) || 0;
  if (n < 1) return n.toFixed(2) + ' ms';
  if (n < 1000) return n.toFixed(0) + ' ms';
  return (n / 1000).toFixed(2) + ' s';
}
function hostOf(url) {
  var m = String(url || '').match(/^[a-z][a-z0-9+.-]*:\/\/([^/?#]+)/i);
  return m ? m[1] : '(relative)';
}
function headerLines(list) {
  if (!Array.isArray(list)) return '';
  return list.map(function (h) { return (h.name || '') + ': ' + (h.value || ''); }).join('\n');
}
function queryLines(list) {
  if (!Array.isArray(list)) return '';
  return list.map(function (q) { return (q.name || '') + '=' + (q.value || ''); }).join('\n');
}
function copyText(txt) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt);
  } else {
    var ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }
  try { if (window.gzAnalytics) gzAnalytics.track('copy_click', { tool: 'har-viewer' }); } catch (e) {}
}

  try { doc = JSON.parse(raw); }
  catch (e) { errors = [t('errParse')]; return false; }
  if (!doc || !doc.log || !Array.isArray(doc.log.entries)) {
    errors = [t('errParse')];
    return false;
  }
  var entries = doc.log.entries;
  ENTRIES = entries.map(function (e, i) {
    var tm = e.timings || {};
    var ph = {};
    var any = false;
    PHASES.forEach(function (p) {
      var v = Number(tm[p]);
      if (!isFinite(v) || v < 0) v = 0;
      ph[p] = v; if (v > 0) any = true;
    });
    if (!any) ph.wait = Number(e.time) || 0;
    var content = e.response && e.response.content ? e.response.content : {};
    return {
      i: i,
      method: (e.request && e.request.method) || 'GET',
      url: (e.request && e.request.url) || '',
      status: e.response && e.response.status != null ? e.response.status : 0,
      statusText: (e.response && e.response.statusText) || '',
      mime: content.mimeType || '',
      size: Math.max(Number(content.size) || 0, 0),
      transfer: Number(content.size) || 0,
      bodySize: Number(content.size) || 0,
      time: Number(e.time) || 0,
      started: e.startedDateTime || '',
      host: hostOf((e.request && e.request.url) || ''),
      type: guessType(content.mimeType),
      ph: ph,
      reqHeaders: (e.request && e.request.headers) || [],
      reqQuery: (e.request && e.request.queryString) || [],
      reqCookies: (e.request && e.request.cookies) || [],
      reqBody: (e.request && e.request.postData && (e.request.postData.text || '')) || '',
      reqMime: (e.request && e.request.postData && e.request.postData.mimeType) || '',
      resHeaders: (e.response && e.response.headers) || [],
      resCookies: (e.response && e.response.cookies) || [],
      resBody: typeof content.text === 'string' ? content.text : '',
      resEnc: content.encoding || '',
      httpVersion: e.response ? e.response.httpVersion : '',
      raw: e
    };
  });
  errors = [];
  REDACTED = buildRedacted(doc);
  if (label) $('#dropSub').textContent = label;
  populateFilters();
  render();
  return true;
}

function guessType(mime) {
  var m = String(mime || '').toLowerCase();
  if (!m) return 'other';
  if (m.indexOf('html') >= 0) return 'document';
  if (m.indexOf('css') >= 0) return 'stylesheet';
  if (m.indexOf('javascript') >= 0 || m.indexOf('ecmascript') >= 0) return 'script';
  if (m.indexOf('json') >= 0) return 'xhr/fetch';
  if (m.indexOf('image/') >= 0) return 'image';
  if (m.indexOf('font') >= 0 || m.indexOf('woff') >= 0) return 'font';
  if (m.indexOf('video') >= 0 || m.indexOf('audio') >= 0) return 'media';
  return 'other';
}

function buildRedacted(doc) {
  var clone = JSON.parse(JSON.stringify(doc));
  var SENSITIVE = /^(authorization|cookie|set-cookie|proxy-authorization|x-api-key|x-auth-token|x-csrf-token|x-xsrf-token)$/i;
  var QKEY = /(token|key|secret|password|passwd|pwd|session|sid|auth|signature|credential)/i;
  var maskQ = function (val) {
    if (typeof val !== 'string') return 'REDACTED';
    return val.replace(/([?&#][^=&#]+)=([^&#]*)/g, function (mm, k) {
      return QKEY.test(decodeURIComponent(k.replace(/^[?&#]+/, ''))) ? k + '=REDACTED' : mm;
    });
  };
  (clone.log.entries || []).forEach(function (e) {
    if (e.request) {
      if (Array.isArray(e.request.headers)) {
        e.request.headers = e.request.headers.map(function (h) {
          return SENSITIVE.test(h.name || '') ? { name: h.name, value: 'REDACTED' } : h;
        });
      }
      if (Array.isArray(e.request.cookies)) e.request.cookies = [];
      if (Array.isArray(e.request.queryString)) {
        e.request.queryString = e.request.queryString.map(function (q) {
          return QKEY.test(q.name || '') ? { name: q.name, value: 'REDACTED' } : q;
        });
      }
      if (e.request.url) e.request.url = maskQ(e.request.url);
      if (e.request.postData) delete e.request.postData.text;
    }
    if (e.response) {
      if (Array.isArray(e.response.headers)) {
        e.response.headers = e.response.headers.map(function (h) {
          return SENSITIVE.test(h.name || '') ? { name: h.name, value: 'REDACTED' } : h;
        });
      }
      if (Array.isArray(e.response.cookies)) e.response.cookies = [];
      if (e.response.content) delete e.response.content.text;
    }
  });
  return clone;
}

/* ---------------- filters ---------------- */
function populateFilters() {
  var methods = {}, statuses = {};
  ENTRIES.forEach(function (e) {
    methods[e.method] = (methods[e.method] || 0) + 1;
    if (e.status) statuses[e.status] = (statuses[e.status] || 0) + 1;
  });
  var mSel = $('#fMethod');
  mSel.options[0].textContent = t('allMethods');
  Object.keys(methods).sort().forEach(function (m) {
    var o = document.createElement('option');
    o.value = m; o.textContent = m + ' (' + methods[m] + ')';
    mSel.appendChild(o);
  });
  var sSel = $('#fStatus');
  sSel.options[0].textContent = t('allStatus');
  Object.keys(statuses).sort(function (a, b) { return a - b; }).forEach(function (s) {
    var o = document.createElement('option');
    o.value = s; o.textContent = s + ' (' + statuses[s] + ')';
    sSel.appendChild(o);
  });
}

function filtered() {
  var q = $('#q').value.trim().toLowerCase();
  var m = $('#fMethod').value;
  var s = $('#fStatus').value;
  var out = ENTRIES.filter(function (e) {
    if (m && e.method !== m) return false;
    if (s && String(e.status) !== s) return false;
    if (q && (e.url + ' ' + e.statusText + ' ' + e.mime + ' ' + e.method).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  var k = sortKey;
  out.sort(function (a, b) {
    var r;
    if (k === 'time') r = a.time - b.time;
    else if (k === 'size') r = a.transfer - b.transfer;
    else if (k === 'status') r = a.status - b.status;
    else if (k === 'method') return a.method < b.method ? -1 : a.method > b.method ? 1 : 0;
    else r = a.i - b.i;
    return asc ? r : -r;
  });
  return out;
}

/* ---------------- render ---------------- */
function statusClass(code) {
  if (!code) return 's0';
  var s = String(code);
  if (s[0] === '2') return 's2';
  if (s[0] === '3') return 's3';
  if (s[0] === '4') return 's4';
  return 's5';
}

function renderStats() {
  if (!ENTRIES.length) { $('#stats').innerHTML = ''; return; }
  var hosts = {}, bytes = 0, total = 0, failed = 0;
  ENTRIES.forEach(function (e) {
    hosts[e.host] = 1;
    bytes += e.transfer;
    total += e.time;
    if (!e.status || e.status >= 400) failed++;
  });
  var st = [
    { k: 'stReq', v: ENTRIES.length },
    { k: 'stHosts', v: Object.keys(hosts).length },
    { k: 'stBytes', v: fmtBytes(bytes) },
    { k: 'stTime', v: fmtMs(total) },
    { k: 'stFailed', v: failed }
  ];
  $('#stats').innerHTML = st.map(function (s) {
    return '<div class="hv-stat">' + t(s.k) + '<b>' + esc(s.v) + '</b></div>';
  }).join('');
}

function renderLegend() {
  var names = ['phBlocked', 'phDns', 'phConnect', 'phSsl', 'phSend', 'phWait', 'phReceive'];
  $('#legend').innerHTML = names.map(function (n, i) {
    return '<span><b style="background:' + PHASE_COLOR[i] + '"></b>' + esc(t(n)) + '</span>';
  }).join('');
}

function waterfall(e) {
  var total = 0;
  PHASES.forEach(function (p) { total += e.ph[p]; });
  if (total <= 0) total = e.time || 1;
  return '<span class="hv-wf" title="' + esc(fmtMs(total)) + '">' +
    PHASES.map(function (p, i) {
      if (!e.ph[p]) return '';
      var w = (e.ph[p] / total) * 100;
      return '<i style="width:' + w.toFixed(2) + '%;background:' + PHASE_COLOR[i] + '"></i>';
    }).join('') + '</span>';
}

function renderRows() {
  var list = filtered();
  var tb = $('#rows');
  if (!list.length) {
    tb.innerHTML = '<tr><td colspan="8"><div class="hv-none">' + esc(ENTRIES.length ? t('noRows') : t('errEmpty')) + '</div></td></tr>';

      '<td><span class="hv-s ' + statusClass(e.status) + '">' + (e.status || '—') + '</span></td>' +
      '<td>' + esc(e.type) + '</td>' +
      '<td>' + esc(fmtBytes(e.transfer)) + '</td>' +
      '<td>' + esc(fmtMs(e.time)) + '</td>' +
      '<td>' + waterfall(e) + '</td>' +
    '</tr>';
  }).join('');
}

function renderFindings() {
  var items = [];
  var n4 = 0, n5 = 0, noresp = 0, plain = 0, slow = [], big = 0, uncomp = 0;
  var seen = {};
  ENTRIES.forEach(function (e) {
    if (e.status >= 400 && e.status < 500) n4++;
    if (e.status >= 500) n5++;
    if (!e.status) noresp++;
    if (/^http:\/\//i.test(e.url)) plain++;
    if (e.time > 1000) slow.push(e);
    if (e.transfer > 512000) big++;
    var enc = String(e.raw && e.response && e.response.content && e.response.content.compression
      ? e.response.content.compression : '').toLowerCase();
    if (/text|json|javascript|css|xml/.test(e.mime) && !/gzip|deflate|br|brotli/.test(enc)) uncomp++;
    if (e.method === 'GET') {
      var k = e.url;
      seen[k] = (seen[k] || 0) + 1;
    }
  });
  var dups = Object.keys(seen).filter(function (k) { return seen[k] > 1; }).length;
  if (n4) items.push(['warn', '⚠️ ' + n4 + '× ' + t('f4xx')]);
  if (n5) items.push(['warn', '🔴 ' + n5 + '× ' + t('f5xx')]);
  if (noresp) items.push(['warn', '⛔ ' + noresp + '× ' + t('fnoresp')]);
  if (plain) items.push(['warn', '🔓 ' + plain + '× ' + t('fhttp')]);
  if (slow.length) items.push(['warn', '🐌 ' + slow.length + '× ' + t('fslow') + ' (' + esc(slow.slice(0, 3).map(function (e) { return fmtMs(e.time); }).join(', ')) + ')']);
  if (big) items.push(['warn', '🐘 ' + big + '× ' + t('fbig')]);
  if (uncomp) items.push(['warn', '🗜️ ' + uncomp + '× ' + t('funcomp')]);
  if (dups) items.push(['warn', '🔁 ' + dups + '× ' + t('fdup')]);
  var hasCred = ENTRIES.some(function (e) {
    return e.reqHeaders.concat(e.resHeaders).some(function (h) {
      return /^(authorization|cookie|set-cookie)$/i.test(h.name || '') && h.value && !/REDACTED/i.test(h.value);
    });
  });
  if (hasCred) items.push(['warn', '🔑 ' + t('fcred')]);
  if (!items.length) items.push(['ok', '✅ ' + t('fallGood')]);

  $('#hFind').textContent = '🔎 ' + t('findings');
  $('#find').innerHTML = items.map(function (i) {
    return '<li class="' + i[0] + '">' + i[1] + '</li>';
  }).join('') + '<li>' + esc(t('redactedNote')) + '</li>';
  $('#findBox').hidden = false;

  /* transfer by type + host */
  var byType = {}, byHost = {};
  ENTRIES.forEach(function (e) {
    byType[e.type] = byType[e.type] || { n: 0, b: 0 };
    byType[e.type].n++; byType[e.type].b += e.transfer;
    byHost[e.host] = byHost[e.host] || { n: 0, b: 0 };
    byHost[e.host].n++; byHost[e.host].b += e.transfer;
  });
  var topHost = Object.keys(byHost).sort(function (a, b) { return byHost[b].b - byHost[a].b; }).slice(0, 6);
  $('#hGroups').textContent = '📊 ' + t('transferBy');
  $('#groups').innerHTML =
    '<table><thead><tr><th>' + esc(t('colType')) + '</th><th>' + esc(t('colCount')) + '</th><th>' + esc(t('colTransfer')) + '</th></tr></thead><tbody>' +
    Object.keys(byType).sort(function (a, b) { return byType[b].b - byType[a].b; }).map(function (k) {
      return '<tr><td>' + esc(k) + '</td><td>' + byType[k].n + '</td><td>' + esc(fmtBytes(byType[k].b)) + '</td></tr>';
    }).join('') + '</tbody></table>' +
    '<table><thead><tr><th>' + esc(t('colHost')) + '</th><th>' + esc(t('colCount')) + '</th><th>' + esc(t('colTransfer')) + '</th></tr></thead><tbody>' +
    topHost.map(function (k) {
      return '<tr><td>' + esc(k) + '</td><td>' + byHost[k].n + '</td><td>' + esc(fmtBytes(byHost[k].b)) + '</td></tr>';
    }).join('') + '</tbody></table>';
  $('#groupsBox').hidden = false;
}

function render() {
  renderStats();
  renderRows();
  renderDetail();
  if (ENTRIES.length) renderFindings();

}

/* ---------------- detail ---------------- */
function toCurl(e) {
  var parts = ['curl -X ' + e.method + " '" + e.url + "'"];
  e.reqHeaders.forEach(function (h) {
    if (/^(host|content-length|:|:authority)$/i.test(h.name || '')) return;
    if (h.value === '') return;
    parts.push("-H '" + String(h.name).replace(/'/g, "'\\''") + ": " + String(h.value).replace(/'/g, "'\\''") + "'");
  });
  if (e.reqBody) parts.push("--data-raw '" + String(e.reqBody).replace(/'/g, "'\\''") + "'");
  return parts.join(' \\\n  ');
}

function detailText(e) {
  if (tab === 'curl') return toCurl(e);
  if (tab === 'overview') {
    var lines = [
      'URL        : ' + e.url,
      'Method     : ' + e.method,
      'Status     : ' + (e.status || '—') + (e.statusText ? ' ' + e.statusText : ''),
      'HTTP ver.  : ' + (e.httpVersion || '—'),
      'Host       : ' + e.host,
      'Type       : ' + e.type + ' (' + (e.mime || 'unknown') + ')',
      'Started    : ' + (e.started || '—'),
      'Total time : ' + fmtMs(e.time),
      'Body size  : ' + fmtBytes(e.transfer),
      ''
    ];
    if (e.reqQuery.length) lines.push('Query string:', queryLines(e.reqQuery), '');
    if (e.reqCookies.length) {
      lines.push('Request cookies:');
      e.reqCookies.forEach(function (c) { lines.push('  ' + c.name + ' = ' + c.value); });
      lines.push('');
    }
    if (e.resCookies.length) {
      lines.push('Response cookies:');
      e.resCookies.forEach(function (c) { lines.push('  ' + c.name + ' = ' + c.value); });
      lines.push('');
    }
    return lines.join('\n');
  }
  if (tab === 'request') {
    return ['— Request headers —', headerLines(e.reqHeaders) || '(none)', ''].concat(
      e.reqBody ? ['— Request body (' + (e.reqMime || 'unknown') + ') —', e.reqBody] : []
    ).join('\n');
  }
  if (tab === 'response') {
    return ['— Response headers —', headerLines(e.resHeaders) || '(none)', ''].concat(
      e.resBody ? ['— Response body (' + (e.resEnc ? e.resEnc + ', ' : '') + fmtBytes(e.resBody.length) + ') —', e.resBody] : ['(no response body captured)']
    ).join('\n');
  }
  if (tab === 'timing') {
    var total = 0;
    PHASES.forEach(function (p) { total += e.ph[p]; });
    if (total <= 0) total = e.time;
    var lines = ['Total: ' + fmtMs(e.time) + '  (sum of phases: ' + fmtMs(total) + ')', ''];
    PHASES.forEach(function (p, i) {
      if (!e.ph[p]) return;
      var pct = total ? ((e.ph[p] / total) * 100).toFixed(1) : '0.0';
      lines.push(t(['phBlocked', 'phDns', 'phConnect', 'phSsl', 'phSend', 'phWait', 'phReceive'][i]) +
        '  ' + fmtMs(e.ph[p]) + '  (' + pct + '%)  ' + PHASE_COLOR[i]);
    });
    return lines.join('\n');
  }
  return JSON.stringify(e.raw, null, 2);
}

function renderDetail() {
  var box = $('#detail');
  if (sel < 0 || !ENTRIES[sel]) { box.hidden = true; return; }
  box.hidden = false;
  var tabs = ['overview', 'request', 'response', 'timing', 'raw', 'curl'];
  $('#tabs').innerHTML = tabs.map(function (k) {
    return '<button data-tab="' + k + '"' + (k === tab ? ' class="on"' : '') + '>' + esc(t('tab' + k.charAt(0).toUpperCase() + k.slice(1))) + '</button>';
  }).join('') +
  '<button id="btnCurl">' + esc(t('copyCurl')) + '</button>' +
  '<button id="btnBody">' + esc(t('copyBody')) + '</button>';
  $('#pane').textContent = detailText(ENTRIES[sel]);

  $('#btnCurl').addEventListener('click', function () { copyText(toCurl(ENTRIES[sel])); });
  $('#btnBody').addEventListener('click', function () {
    var e = ENTRIES[sel];
    copyText(e.reqBody || e.resBody || '');
  });
}

function download(name, text) {
  var blob = new Blob([text], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
}

/* ---------------- wiring ---------------- */
function initToolbar() {
  $('#dropTitle').textContent = t('dropTitle');
  $('#dropSub').textContent = t('dropSub');
  $('#q').placeholder = t('filterPh');
  $('#thMethod').textContent = t('thMethod');
  $('#thStatus').textContent = t('thStatus');
  $('#thType').textContent = t('thType');
  $('#thSize').textContent = t('thSize');
  $('#thTime').textContent = t('thTime');
  $('#thWf').textContent = t('thWf');

  var sortOpts = { seq: 'sortSeq', time: 'sortTime', status: 'sortStatus', size: 'sortSize' };
  $('#sort').options[0].textContent = t('sortSeq');
  $('#sort').options[1].textContent = t('sortTime');
  $('#sort').options[2].textContent = t('sortStatus');
  $('#sort').options[3].textContent = t('sortSize');
  void sortOpts;

  var bar = $('#toolbar');
  var html = '';
  html += '<button id="btnSample">' + t('sample') + '</button>';
  html += '<button id="btnDl">' + t('download') + '</button>';
  html += '<button id="btnRedact">' + t('redact') + '</button>';
  html += '<button id="btnClear">' + t('clear') + '</button>';
  bar.innerHTML = html;

  $('#btnSample').addEventListener('click', function () {
    sel = -1;
    parseHar(JSON.stringify(SAMPLE), 'sample.har (' + SAMPLE.log.entries.length + ' entries)');
  });
  $('#btnDl').addEventListener('click', function () {
    if (!ENTRIES.length) return;
    download('capture.har', JSON.stringify({ log: { version: '1.2', creator: { name: 'GameZipper HAR Viewer', version: '1.0' }, entries: ENTRIES.map(function (e) { return e.raw; }) } }, null, 2));
  });
  $('#btnRedact').addEventListener('click', function () {
    if (!REDACTED) return;
    download('capture-redacted.har', JSON.stringify(REDACTED, null, 2));
  });
  $('#btnClear').addEventListener('click', function () {
    ENTRIES = []; REDACTED = null; sel = -1; errors = [];
    $('#stats').innerHTML = '';
    $('#rows').innerHTML = '';
    $('#detail').hidden = true;
    $('#findBox').hidden = true;
    $('#groupsBox').hidden = true;
    $('#q').value = '';
    populateFilters();
    $('#dropSub').textContent = t('dropSub');
  });

  var drop = $('#drop');
  drop.addEventListener('click', function () { $('#file').click(); });
  drop.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#file').click(); } });
  ['dragenter', 'dragover'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', function (e) {
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) readFile(f);
  });
  $('#file').addEventListener('change', function () {
    if (this.files && this.files[0]) readFile(this.files[0]);
    this.value = '';
  });

  $('#q').addEventListener('input', function () { renderRows(); });
  $('#fMethod').addEventListener('change', renderRows);
  $('#fStatus').addEventListener('change', renderRows);
  $('#sort').addEventListener('change', function () {
    sortKey = this.value;
    asc = !(sortKey === 'time' || sortKey === 'size');
    renderRows();
  });

  document.querySelectorAll('.hv-tbl th[data-k]').forEach(function (th) {
    th.addEventListener('click', function () {
      var k = th.getAttribute('data-k');
      if (k === 'wf' || k === 'url') return;
      if (sortKey === k) asc = !asc;
      else { sortKey = k; asc = (k === 'seq' || k === 'method' || k === 'status'); }
      renderRows();
    });
  });

  $('#rows').addEventListener('click', function (e) {
    var tr = e.target.closest('tr[data-i]');
    if (!tr) return;
    var i = parseInt(tr.getAttribute('data-i'), 10);
    sel = (sel === i) ? -1 : i;
    tab = 'overview';
    renderRows();
    renderDetail();
  });

  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]');
    if (!b) return;
    tab = b.getAttribute('data-tab');
    renderDetail();
  });
}

function readFile(file) {
  var fr = new FileReader();
  fr.onload = function () {
    sel = -1;
    parseHar(String(fr.result), file.name + ' (' + fmtBytes(file.size) + ')');
  };
  fr.onerror = function () { errors = [t('errParse')]; };
  fr.readAsText(file);
}

initToolbar();
renderLegend();

  ]
});
