const { $, copyText, t, on } = GZ;
let currentTab = 'config';

const PALETTES = {
  primary: [
    {name:'primary', shade:'500', hex:'#6366f1'},
    {name:'primary', shade:'600', hex:'#4f46e5'},
    {name:'primary', shade:'700', hex:'#4338ca'},
  ],
  brand: [
    {name:'brand', shade:'pink', hex:'#ec4899'},
    {name:'brand', shade:'purple', hex:'#a855f7'},
    {name:'brand', shade:'cyan', hex:'#06b6d4'},
    {name:'brand', shade:'amber', hex:'#f59e0b'},
  ],
  pastel: [
    {name:'pastel', shade:'rose', hex:'#fda4af'},
    {name:'pastel', shade:'mint', hex:'#a7f3d0'},
    {name:'pastel', shade:'sky', hex:'#bae6fd'},
    {name:'pastel', shade:'lemon', hex:'#fef08a'},
  ],
  slate: [
    {name:'slate', shade:'50', hex:'#f8fafc'},
    {name:'slate', shade:'500', hex:'#64748b'},
    {name:'slate', shade:'900', hex:'#0f172a'},
  ],
};

function defaults() {
  return {
    contentPaths: './src/**/*.{html,js,jsx,ts,tsx,vue,svelte}\n./public/index.html\n./index.html',
    darkMode: 'class',
    darkSelector: '[data-theme="dark"]',
    colors: [
      {name:'primary', shade:'50', hex:'#eef2ff'},
      {name:'primary', shade:'500', hex:'#6366f1'},
      {name:'primary', shade:'600', hex:'#4f46e5'},
      {name:'primary', shade:'700', hex:'#4338ca'},
      {name:'primary', shade:'900', hex:'#312e81'},
      {name:'accent', shade:'500', hex:'#ec4899'},
    ],
    fontSans: 'Inter, ui-sans-serif, system-ui, sans-serif',
    fontSerif: 'Georgia, Cambria, serif',
    fontMono: 'Menlo, Monaco, Consolas, monospace',
    fontDisplay: 'Space Grotesk, Inter, sans-serif',
    breakpoints: [
      {name:'sm', value:'640px'},
      {name:'md', value:'768px'},
      {name:'lg', value:'1024px'},
      {name:'xl', value:'1280px'},
      {name:'2xl', value:'1536px'},
    ],
    customSpacing: '18, 72, 88, 128',
    extContainer: false,
    plugForms: true, plugTypo: false, plugAspect: false, plugLineClamp: false, plugContainer: false,
    customPlugins: '',
    lang: 'js', indentSize: '2',
    corePlugins: false, corePluginsList: '',
  };
}

let state = loadState() || defaults();

function loadState() {
  try { const raw = localStorage.getItem('tw-config-generator-state'); return raw ? JSON.parse(raw) : null; } catch(e) { return null; }
}
function saveState() {
  try { localStorage.setItem('tw-config-generator-state', JSON.stringify(state)); } catch(e) {}
}

function renderColorList() {
  $('#colorList').innerHTML = state.colors.map((c,i) => `
    <div class="row3" style="align-items:center;margin-bottom:4px">
      <input value="${escapeAttr(c.name)}" placeholder="name" oninput="state.colors[${i}].name=this.value;render();">
      <input value="${escapeAttr(c.shade)}" placeholder="shade" oninput="state.colors[${i}].shade=this.value;render();">
      <div style="display:flex;gap:4px;align-items:center"><input type="color" value="${c.hex}" oninput="state.colors[${i}].hex=this.value;render();" style="flex:0 0 38px;height:30px"><input value="${c.hex}" oninput="state.colors[${i}].hex=this.value;render();" style="flex:1;font-family:monospace"><button onclick="state.colors.splice(${i},1);render();" style="background:none;border:none;color:#888;cursor:pointer;font-size:1.1em" title="Remove">×</button></div>
    </div>
  `).join('');
}

function renderBreakpointList() {
  $('#breakpointList').innerHTML = state.breakpoints.map((b,i) => `
    <div class="row3" style="align-items:center;margin-bottom:4px">
      <input value="${escapeAttr(b.name)}" placeholder="name (e.g. md)" oninput="state.breakpoints[${i}].name=this.value;render();">
      <input value="${escapeAttr(b.value)}" placeholder="640px" oninput="state.breakpoints[${i}].value=this.value;render();">
      <button onclick="state.breakpoints.splice(${i},1);render();" style="background:none;border:none;color:#888;cursor:pointer;font-size:1.1em" title="Remove">×</button>
    </div>
  `).join('');
}

function addColorRow() { state.colors.push({name:'custom', shade:'500', hex:'#3b82f6'}); render(); }
function addBreakpointRow() { state.breakpoints.push({name:'xxl', value:'1920px'}); render(); }

function loadPalette(p) {
  state.colors = PALETTES[p].map(c=>({...c}));
  render();
}

function escapeAttr(s){return String(s).replace(/"/g,'&quot;');}

function loadDefault() { state = defaults(); render(); showStatus(t('reset'), 'success'); }

function setTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  if (el) el.classList.add('active');
  render();
}

function buildColorsBlock(indent) {
  const i = indent;
  if (!state.colors.length) return '';
  // Merge by name (so multiple shades under same color name go into one block)
  const groups = {};
  state.colors.forEach(c => { if (!groups[c.name]) groups[c.name] = {}; groups[c.name][c.shade] = c.hex; });
  const entries = Object.keys(groups).map(name => {
    const shades = groups[name];
    const shadeEntries = Object.keys(shades).map(sh => `${i.repeat(3)}${JSON.stringify(sh)}: '${shades[sh]}'`).join(',\n');
    return `${i.repeat(2)}${JSON.stringify(name)}: {\n${shadeEntries}\n${i.repeat(2)}}`;
  }).join(',\n');
  return `${i}colors: {\n${entries}\n${i}}`;
}

function buildFontsBlock(indent) {
  const i = indent;
  const blocks = [];
  if (state.fontSans) blocks.push(`${i.repeat(2)}sans: [${state.fontSans.split(',').map(s=>`${JSON.stringify(s.trim())}`).join(', ')}]`);
  if (state.fontSerif) blocks.push(`${i.repeat(2)}serif: [${state.fontSerif.split(',').map(s=>`${JSON.stringify(s.trim())}`).join(', ')}]`);
  if (state.fontMono) blocks.push(`${i.repeat(2)}mono: [${state.fontMono.split(',').map(s=>`${JSON.stringify(s.trim())}`).join(', ')}]`);
  if (state.fontDisplay) blocks.push(`${i.repeat(2)}display: [${state.fontDisplay.split(',').map(s=>`${JSON.stringify(s.trim())}`).join(', ')}]`);
  if (!blocks.length) return '';
  return `${i}fontFamily: {\n${blocks.join(',\n')}\n${i}}`;
}

function buildBreakpointsBlock(indent) {
  const i = indent;
  if (!state.breakpoints.length) return '';
  const entries = state.breakpoints.map(b => `${i.repeat(2)}${JSON.stringify(b.name)}: '${b.value}'`).join(',\n');
  return `${i}screens: {\n${entries}\n${i}}`;
}

function buildSpacingBlock(indent) {
  const i = indent;
  const parts = [];
  const values = state.customSpacing.split(',').map(s=>s.trim()).filter(Boolean);
  if (values.length) {
    const obj = values.map((v,idx) => `${i.repeat(2)}${JSON.stringify(v)}: '${parseFloat(v)}px'`).join(',\n');
    parts.push(`${i}spacing: {\n${obj}\n${i}}`);
  }
  if (state.extContainer) {
    parts.push(`${i}container: {\n${i.repeat(2)}center: true,\n${i.repeat(2)}padding: '2rem',\n${i.repeat(2)}screens: { sm: '640px', md: '768px', lg: '1024px', xl: '1280px', '2xl': '1536px' }\n${i}}`);
  }
  return parts.join(',\n');
}

function buildPluginsBlock(indent) {
  const i = indent;
  const list = [];
  if (state.plugForms) list.push('forms');
  if (state.plugTypo) list.push('typography');
  if (state.plugAspect) list.push('aspectRatio');
  if (state.plugLineClamp) list.push('lineClamp');
  if (state.plugContainer) list.push('containerQueries');
  const customLines = state.customPlugins.split('\n').map(s=>s.trim()).filter(Boolean);
  if (!list.length && !customLines.length) return '';
  const requires = list.map(p => `${i.repeat(2)}require('@tailwindcss/${p}')`).concat(customLines.map(p=>`${i.repeat(2)}${p}`));
  return `${i}plugins: [\n${requires.join(',\n')}\n${i}]`;
}

function buildConfig(indent) {
  const i = indent;
  const ii = i.repeat(2);
  const lines = [];
  const contentArr = state.contentPaths.split('\n').map(s=>s.trim()).filter(Boolean).map(p=>`'${p}'`).join(',\n' + ii);
  lines.push(`${i}content: [\n${ii}${contentArr}\n${i}],`);
  lines.push(`${i}darkMode: ${state.darkMode === 'selector' ? JSON.stringify(state.darkSelector) : `'${state.darkMode}'`},`);

  const themeBlocks = [];
  const colorsBlock = buildColorsBlock(ii);
  if (colorsBlock) themeBlocks.push(colorsBlock);
  const fontsBlock = buildFontsBlock(ii);
  if (fontsBlock) themeBlocks.push(fontsBlock);
  const bpBlock = buildBreakpointsBlock(ii);
  if (bpBlock) themeBlocks.push(bpBlock);
  const spacingBlock = buildSpacingBlock(ii);
  if (spacingBlock) themeBlocks.push(spacingBlock);

  if (themeBlocks.length) {
    lines.push(`${i}theme: {\n${i.repeat(2)}extend: {\n${themeBlocks.join(',\n')}\n${i.repeat(2)}}\n${i}},`);
  }

  const pluginsBlock = buildPluginsBlock(ii);
  if (pluginsBlock) lines.push(pluginsBlock + ',');

  if (state.corePlugins && state.corePluginsList.trim()) {
    const arr = state.corePluginsList.split(',').map(s=>s.trim()).filter(Boolean).map(x=>`'${x}'`).join(', ');
    lines.push(`${i}corePlugins: {`);
    lines.push(`${ii}disable: [${arr}]`);
    lines.push(`${i}}`);
  }

  return lines.join('\n');
}

function indent() {
  if (state.indentSize === 'tab') return '\t';
  return ' '.repeat(parseInt(state.indentSize, 10));
}

function generateConfig() {
  const ind = indent();
  if (state.lang === 'ts') {
    return `import type { Config } from 'tailwindcss'\n\nexport default {\n${buildConfig(ind)}} satisfies Config\n`;
  }
  return `/** @type {import('tailwindcss').Config} */\nmodule.exports = {\n${buildConfig(ind)}}\n`;
}

function generateCSS() {
  const plugins = [];
  if (state.plugForms) plugins.push('@tailwindcss/forms');
  if (state.plugTypo) plugins.push('@tailwindcss/typography');
  if (state.plugAspect) plugins.push('@tailwindcss/aspect-ratio');
  if (state.plugLineClamp) plugins.push('@tailwindcss/line-clamp');
  if (state.plugContainer) plugins.push('@tailwindcss/container-queries');
  const customLines = state.customPlugins.split('\n').map(s=>s.trim()).filter(Boolean).map(p=>`@plugin ${p.replace(/^require\(['"](.+?)['"]\)$/, '$1')};`);
  return `@tailwind base;\n@tailwind components;\n@tailwind utilities;\n${plugins.map(p=>`@plugin '${p}';`).join('\n')}\n${customLines.join('\n')}`;
}

function generateHelp() { return t('helpHTML'); }

function updateOutput() {
  let out = '';
  if (currentTab === 'config') out = generateConfig();
  else if (currentTab === 'css') out = generateCSS();
  else out = generateHelp();
  $('#output').innerHTML = out.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  $('#stats').innerHTML = `<span>${out.length} chars</span><span>${out.split('\n').length} lines</span><span>${state.colors.length} colors</span><span>${state.breakpoints.length} breakpoints</span>`;
  saveState();
}

function render() {
  $('#contentPaths').value = state.contentPaths;
  $('#darkMode').value = state.darkMode;
  $('#darkSelector').value = state.darkSelector;
  $('#darkSelectorWrap').style.display = state.darkMode === 'selector' ? '' : 'none';
  $('#fontSans').value = state.fontSans;
  $('#fontSerif').value = state.fontSerif;
  $('#fontMono').value = state.fontMono;
  $('#fontDisplay').value = state.fontDisplay;
  $('#customSpacing').value = state.customSpacing;
  $('#extContainer').checked = state.extContainer;
  $('#plugForms').checked = state.plugForms;
  $('#plugTypo').checked = state.plugTypo;
  $('#plugAspect').checked = state.plugAspect;
  $('#plugLineClamp').checked = state.plugLineClamp;
  $('#plugContainer').checked = state.plugContainer;
  $('#customPlugins').value = state.customPlugins;
  $('#lang').value = state.lang;
  $('#indentSize').value = state.indentSize;
  $('#corePlugins').checked = state.corePlugins;
  $('#corePluginsList').value = state.corePluginsList;
  $('#corePluginsWrap').style.display = state.corePlugins ? '' : 'none';
  renderColorList();
  renderBreakpointList();
  updateOutput();
}

function copyOutput() {
  let out = '';
  if (currentTab === 'config') out = generateConfig();
  else if (currentTab === 'css') out = generateCSS();
  else { showStatus('Open the config tab to copy', 'error'); return; }
  copyText(out);
  showStatus(t('copied'), 'success');
}

function downloadOutput() {
  let out = '', name = 'tailwind.config';
  if (currentTab === 'config') { out = generateConfig(); name += '.' + state.lang; }
  else if (currentTab === 'css') { out = generateCSS(); name = 'tailwind.css'; }
  else { showStatus('Switch to config or css tab to download', 'error'); return; }
  const blob = new Blob([out], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showStatus(t('downloaded'), 'success');
}

async function shareConfig() {
  const compressed = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
  const url = new URL(window.location.href);
  url.searchParams.set('s', compressed);
  try { await navigator.clipboard.writeText(url.toString()); showStatus(t('shared'), 'success'); }
  catch(e) { prompt('Share this URL:', url.toString()); }
}

function showStatus(msg, type) {
  const el = $('#status');
  el.innerHTML = `<span style="color:${type==='success'?'var(--gz-success)':'var(--gz-error)'};font-weight:600">${msg}</span>`;
  setTimeout(()=>{ el.innerHTML=''; }, 3500);
}

function loadFromURL() {
  const sp = new URLSearchParams(window.location.search);
  const s = sp.get('s');
  if (s) {
    try {
      const parsed = JSON.parse(decodeURIComponent(escape(atob(s))));
      state = Object.assign(defaults(), parsed);
      render();
      return true;
    } catch(e) {}
  }
  return false;
}

// Wire up reactive inputs
function bindInputs() {
  ['contentPaths','darkMode','darkSelector','fontSans','fontSerif','fontMono','fontDisplay','customSpacing','customPlugins','lang','indentSize','corePluginsList'].forEach(id=>{
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('input', ()=>{ state[id] = el.value; updateOutput(); });
    el.addEventListener('change', ()=>{ state[id] = el.value; updateOutput(); });
  });
  ['extContainer','plugForms','plugTypo','plugAspect','plugLineClamp','plugContainer','corePlugins'].forEach(id=>{
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('change', ()=>{ state[id] = el.checked; render(); });
  });
  document.getElementById('darkMode').addEventListener('change', e=>{ state.darkMode = e.target.value; render(); });
}

// Presets
function loadPreset(name) {
  if (name === 'blank') { loadDefault(); return; }
  if (name === 'primary') loadPalette('primary');
  if (name === 'brand') loadPalette('brand');
  if (name === 'pastel') loadPalette('pastel');
  if (name === 'slate') loadPalette('slate');
}

function renderPresets() {
  const presets = [
    {id:'blank', key:'reset'},
    {id:'primary', key:'presetPrimary'},
    {id:'brand', key:'presetBrand'},
    {id:'pastel', key:'presetPastel'},
    {id:'slate', key:'presetSlate'},
  ];
  $('#presets').innerHTML = presets.map(p => `<span class="preset" onclick="loadPreset('${p.id}')">${p.key.startsWith('preset')?t(p.key):t(p.key)}</span>`).join('');
}

  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],

    {icon:'🎨', href:'/dev/css-to-tailwind.html', name:'CSS to Tailwind'},
    {icon:'🖼️', href:'/dev/tailwind-to-css.html', name:'Tailwind to CSS'},
    {icon:'📝', href:'/dev/editorconfig-generator.html', name:'EditorConfig Generator'},
    {icon:'🎯', href:'/css-tools/clamp-generator.html', name:'CSS Clamp Generator'},
    {icon:'📐', href:'/css-tools/box-shadow.html', name:'Box Shadow Generator'},
  ]
});
document.addEventListener('DOMContentLoaded', () => {
  if (!loadFromURL()) render();
  bindInputs();
  renderPresets();
});
