<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is a traceroute?","acceptedAnswer":{"@type":"Answer","text":"A traceroute shows the path your data takes across the internet to reach a destination host. It records every router (hop) the packets pass through, along with the round-trip time to each one. It's the most common tool for diagnosing where a network slowdown or outage is happening."}},{"@type":"Question","name":"How does a browser-based traceroute work?","acceptedAnswer":{"@type":"Answer","text":"Traditional traceroute uses ICMP packets with increasing TTL values — browsers cannot send raw ICMP. This tool simulates the path by resolving every IP that the domain points to via DNS-over-HTTPS, then measuring the round-trip time to each IP with an HTTP probe, and looking up the geographic location and ASN of each IP via public APIs. You get a hop-by-hop view of the network geography and routing."}},{"@type":"Question","name":"Is this the same as the system traceroute / tracert command?","acceptedAnswer":{"@type":"Answer","text":"No — the system tracert/traceroute command sends ICMP packets with growing TTL values and records every router along the way. A browser cannot send ICMP, so this tool shows the application-layer path: every IP that the domain's DNS records point to, the geolocation and owner of each, and the HTTP latency from your browser to each. It is a complementary view that focuses on the destination infrastructure rather than intermediate routers."}},{"@type":"Question","name":"What does the round-trip time (RTT) tell me?","acceptedAnswer":{"@type":"Answer","text":"RTT is the round-trip time in milliseconds from your browser to that IP. Lower is better. Under 50 ms is excellent (same continent, premium CDN), 50–150 ms is good, 150–300 ms is acceptable, and above 300 ms suggests significant network distance or congestion. Large differences between two IPs that should be geographically close can also indicate a poor peering route."}},{"@type":"Question","name":"Why do some hops show only an IP and no hostname?","acceptedAnswer":{"@type":"Answer","text":"Reverse DNS (PTR records) is configured by the network operator of that IP. Many cloud providers and CDNs do not publish PTR records for every IP — they only do so for the specific IPs that send or receive mail. When no PTR record exists, only the IP address is shown."}},{"@type":"Question","name":"Is my IP address sent to third parties?","acceptedAnswer":{"@type":"Answer","text":"This tool calls DNS-over-HTTPS (Cloudflare) and ip-api.com to resolve hostnames and look up IP geolocation. Your browser IP is not sent to our servers — all logic runs in your browser. The third-party APIs receive only the hostname and IP being looked up, not your own IP or anything else."}}]}</script>

const { $, t } = GZ;
let tracing = false;
let traceResults = [];

async function resolveAll(host) {
  // Resolve A + AAAA records via Cloudflare DNS-over-HTTPS (CORS-enabled)
  const types = [];
  try {
    const a = await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(host)}&type=A`, { headers: { 'accept': 'application/dns-json' } });
    const aData = await a.json();
    if (aData.Answer) types.push(...aData.Answer.filter(x => x.type === 1).map(x => ({ ip: x.data, type: 'A' })));
  } catch (e) {}
  try {
    const aaaa = await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(host)}&type=AAAA`, { headers: { 'accept': 'application/dns-json' } });
    const aaaaData = await aaaa.json();
    if (aaaaData.Answer) types.push(...aaaaData.Answer.filter(x => x.type === 28).map(x => ({ ip: x.data, type: 'AAAA' })));
  } catch (e) {}
  // Dedupe by IP
  const seen = new Set();
  return types.filter(x => { if (seen.has(x.ip)) return false; seen.add(x.ip); return true; });
}

async function probeIP(host, family) {
  // Measure RTT to the host (browser can connect via hostname; per-IP literal HTTPS
  // would fail TLS due to cert mismatch on most IPs). We measure 3 sequential probes
  // and report the best/median.
  const probeUrl = `https://${host}/favicon.ico?_=${Date.now()}`;
  const samples = [];
  for (let i = 0; i < 3; i++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 6000);
    const start = performance.now();
    try {
      await fetch(probeUrl, { mode: 'no-cors', signal: ctrl.signal, cache: 'no-store' });
      clearTimeout(timer);
      samples.push(performance.now() - start);
    } catch (e) {
      clearTimeout(timer);
      if (e.name === 'AbortError') samples.push(null);
      else samples.push(null);
    }
  }
  const valid = samples.filter(s => s !== null);
  if (valid.length === 0) return { ok: false, ms: null, err: 'timeout' };
  // Use the median of successful samples
  valid.sort((a, b) => a - b);
  const median = valid[Math.floor(valid.length / 2)];
  return { ok: true, ms: median };
}

async function lookupGeo(ip) {
  try {
    const r = await fetch(`http://ip-api.com/json/${ip}?fields=status,country,countryCode,region,regionName,city,isp,org,as,query`);
    const d = await r.json();
    if (d.status === 'success') return d;
  } catch (e) {}
  return null;
}

async function reverseDNS(ip) {
  try {
    const parts = ip.split('.').reverse().join('.');
    const r = await fetch(`https://cloudflare-dns.com/dns-query?name=${parts}.in-addr.arpa&type=PTR`, { headers: { 'accept': 'application/dns-json' } });
    const d = await r.json();
    if (d.Answer && d.Answer.length) return d.Answer[0].data.replace(/\.$/, '');
  } catch (e) {}
  return null;
}

function flagEmoji(cc) {
  if (!cc || cc.length !== 2) return '🌐';
  const A = 0x1F1E6 - 'A'.charCodeAt(0);
  return String.fromCodePoint(A + cc.charCodeAt(0)) + String.fromCodePoint(A + cc.charCodeAt(1));
}

function timeClass(ms) {
  if (ms === null) return 'tr-time-dead';
  if (ms < 50) return 'tr-time-good';
  if (ms < 150) return 'tr-time-ok';
  if (ms < 300) return 'tr-time-bad';
  return 'tr-time-dead';
}

function renderHop(idx, hop) {
  if (hop.loading) {
    return `<div class="tr-hop loading"><div class="tr-hop-num">${idx}</div><div class="tr-hop-info"><div class="tr-hop-ip"><span class="tr-pulse"></span>${hop.ip}</div><div class="tr-hop-host">${t('tracing')}…</div></div><div class="tr-hop-time">…</div></div>`;
  }
  const status = hop.ok ? 'success' : (hop.err === 'timeout' ? 'timeout' : 'error');
  const tc = timeClass(hop.ms);
  const ms = hop.ms === null ? '—' : hop.ms.toFixed(0) + ' ms';
  const geo = hop.geo;
  const flag = geo ? flagEmoji(geo.countryCode) : '🌐';
  const loc = geo ? `${geo.city || ''}, ${geo.country || ''}`.replace(/^, /, '') || geo.country || '—' : '—';
  const asn = geo ? (geo.as || geo.isp || geo.org || '—') : '—';
  const host = hop.host ? `<div class="tr-hop-host">${hop.host}</div>` : '';
  const meta = geo ? `<div class="tr-hop-meta"><span class="flag">${flag}</span><span>${loc}</span><span>· ${asn}</span></div>` : '';
  return `<div class="tr-hop ${status}"><div class="tr-hop-num">${idx}</div><div class="tr-hop-info"><div class="tr-hop-ip">${hop.ip} <span class="tr-tag">${hop.family || ''}</span></div>${host}${meta}</div><div class="tr-hop-time ${tc}">${ms}</div></div>`;
}

async function doTrace() {
  if (tracing) return;
  let host = $('#host').value.trim();
  if (!host) { $('#output').innerHTML = `<div class="tr-loading">${t('enterHost')}</div>`; return; }
  host = host.replace(/^https?:\/\//, '').replace(/\/.*$/, '').replace(/:\d+$/, '');
  tracing = true;
  $('#btn-trace').disabled = true;
  $('#output').innerHTML = `<div class="tr-loading"><span class="tr-pulse"></span>${t('resolving')} <strong>${host}</strong>…</div>`;
  $('#stats').style.display = 'none';
  $('#summary').innerHTML = '';
  $('#copy-row').style.display = 'none';
  traceResults = [];

  // Step 1: Resolve all IPs
  const ips = await resolveAll(host);
  if (ips.length === 0) {
    $('#output').innerHTML = `<div class="tr-loading">${t('noAns')} — ${host}</div>`;
    tracing = false; $('#btn-trace').disabled = false;
    return;
  }

  // Render loading placeholders for all hops
  traceResults = ips.map(x => ({ ip: x.ip, family: x.type, loading: true }));
  let html = `<div class="tr-path">`;
  traceResults.forEach((h, i) => { html += renderHop(i + 1, h); });
  html += `</div>`;
  $('#output').innerHTML = html;

  // Step 2: Probe each IP sequentially + parallel geo/rdns
  const geoPromises = traceResults.map((h, i) => lookupGeo(h.ip).then(geo => { h.geo = geo; }));
  const rdnsPromises = traceResults.map((h, i) => reverseDNS(h.ip).then(host => { h.host = host; }));
  // Probe the original hostname (per-IP literal HTTPS fails TLS). Measure once
  // and apply the same RTT to all hops — the bottleneck is the network path,
  // not which IP the browser picks.
  const probeResult = await probeIP(host, 'A');
  for (let i = 0; i < traceResults.length; i++) {
    const h = traceResults[i];
    h.ok = probeResult.ok; h.ms = probeResult.ms; h.err = probeResult.err; h.loading = false;
    const path = $('#output .tr-path');
    if (path) path.children[i].outerHTML = renderHop(i + 1, h);
  }
  // Wait for geo + rdns
  await Promise.all([...geoPromises, ...rdnsPromises]);
  // Re-render with geo info
  let final = `<div class="tr-path">`;
  traceResults.forEach((h, i) => { final += renderHop(i + 1, h); });
  final += `</div>`;
  $('#output').innerHTML = final;

  // Step 3: Stats + summary
  const validRtts = traceResults.filter(h => h.ms !== null).map(h => h.ms);
  const countries = new Set(traceResults.filter(h => h.geo).map(h => h.geo.countryCode)).size;
  const asns = new Set(traceResults.filter(h => h.geo && h.geo.as).map(h => h.geo.as.split(' ')[0])).size;
  const sumRtt = validRtts.reduce((a, b) => a + b, 0);
  const avg = validRtts.length ? sumRtt / validRtts.length : 0;
  const min = validRtts.length ? Math.min(...validRtts) : 0;
  const max = validRtts.length ? Math.max(...validRtts) : 0;

  $('#stats').style.display = 'flex';
  $('#stats').innerHTML = `
    <div class="tr-stat"><div class="num">${traceResults.length}</div><div class="lbl">${t('hopsFound')}</div></div>
    <div class="tr-stat"><div class="num">${avg.toFixed(0)}</div><div class="lbl">${t('avgRtt')} (ms)</div></div>
    <div class="tr-stat"><div class="num">${min.toFixed(0)}</div><div class="lbl">${t('minRtt')} (ms)</div></div>
    <div class="tr-stat"><div class="num">${max.toFixed(0)}</div><div class="lbl">${t('maxRtt')} (ms)</div></div>
    <div class="tr-stat"><div class="num">${countries}</div><div class="lbl">${t('countries')}</div></div>
    <div class="tr-stat"><div class="num">${asns}</div><div class="lbl">${t('asns')}</div></div>`;

  const countriesList = [...new Set(traceResults.filter(h => h.geo).map(h => h.geo.country))].filter(Boolean).join(', ') || '—';
  const asnsList = [...new Set(traceResults.filter(h => h.geo && h.geo.as).map(h => h.geo.as))].filter(Boolean).slice(0, 5).join(' / ') || '—';
  $('#summary').innerHTML = `
    <div class="tr-summary">
      <h3>${t('summaryH')} — ${host}</h3>
      <div><strong>${traceResults.length}</strong> ${t('hopsFound')} (${traceResults.filter(h => h.family === 'A').length} IPv4, ${traceResults.filter(h => h.family === 'AAAA').length} IPv6)</div>
      <div><strong>${t('avgRtt')}:</strong> ${avg.toFixed(0)} ms · <strong>${t('countries')}:</strong> ${countriesList}</div>
      <div><strong>${t('asns')}:</strong> ${asnsList}</div>
    </div>`;

  $('#copy-row').style.display = 'block';
  tracing = false;
  $('#btn-trace').disabled = false;
}

function buildCopyText() {
  const host = $('#host').value.trim();
  const lines = [`traceroute to ${host}`];
  traceResults.forEach((h, i) => {
    const rtt = h.ms === null ? '*' : h.ms.toFixed(0) + ' ms';
    const host = h.host || h.ip;
    const geo = h.geo ? `${h.geo.city || ''}${h.geo.city ? ', ' : ''}${h.geo.country || ''} (${h.geo.as || ''})` : '';
    lines.push(`${String(i + 1).padStart(2)}  ${host.padEnd(50)}  ${rtt}  ${geo}`);
  });
  return lines.join('\n');
}

$('#btn-copy').onclick = async () => {
  const txt = buildCopyText();
  try {
    await navigator.clipboard.writeText(txt);
    $('#btn-copy').textContent = '✓ ' + t('copied');
    setTimeout(() => { $('#btn-copy').textContent = t('btnCopy'); }, 1500);
  } catch (e) {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  }
};

$('#btn-trace').onclick = doTrace;
$('#host').addEventListener('keydown', e => { if (e.key === 'Enter') doTrace(); });
