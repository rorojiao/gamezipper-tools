const { $, copyText, t } = GZ;

function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function stripPunct(s) { return s.replace(/[.,!?;:]+$/, '').trim(); }
function endPunct(s) { const m = s.match(/[.!?]+$/); return m ? m[0] : '.'; }
function startsVowel(w) { return /^[aeiou]/i.test(w); }
function startsConsonant(w) { return /^[bcdfghjklmnpqrstvwxyz]/i.test(w); }

function articleSwap(sentence) {
  // "a apple" -> "an apple", "an university" -> "a university"
  return sentence.replace(/\b(a|an)\s+([a-z]+)/gi, (m, art, next) => {
    if (art.toLowerCase() === 'a' && startsVowel(next)) return 'an ' + next;
    if (art.toLowerCase() === 'an' && startsConsonant(next)) return 'a ' + next;
    return m;
  });
}

function build(a, b, conj) {
  a = stripPunct(a); b = stripPunct(b);
  const conjLower = conj.toLowerCase();
  const aLast = a.split(/\s+/).pop();
  const subjectMatch = aLower(b).startsWith(aLower(aLast + ' ')) || b.toLowerCase().startsWith('he ') || b.toLowerCase().startsWith('she ') || b.toLowerCase().startsWith('they ') || b.toLowerCase().startsWith('it ');
  if (conjLower === 'and') return cap(a) + ' and ' + b.toLowerCase() + endPunct(b);
  if (conjLower === 'but') return cap(a) + ', but ' + b.toLowerCase() + endPunct(b);
  if (conjLower === 'or')  return cap(a) + ', or ' + b.toLowerCase() + endPunct(b);
  if (conjLower === 'so')  return cap(a) + ', so ' + b.toLowerCase() + endPunct(b);
  if (conjLower === 'yet') return cap(a) + ', yet ' + b.toLowerCase() + endPunct(b);
  if (conjLower === 'for') return cap(a) + ', for ' + b.toLowerCase() + endPunct(b);
  if (conjLower === 'nor') return cap(a) + ', nor ' + b.toLowerCase() + endPunct(b);
  if (conjLower === 'because') return cap(a) + ' because ' + b.toLowerCase() + endPunct(b);
  if (conjLower === 'although') return 'Although ' + a.toLowerCase() + ', ' + b.toLowerCase() + endPunct(b);
  if (conjLower === 'while') return 'While ' + a.toLowerCase() + ', ' + b.toLowerCase() + endPunct(b);
  if (conjLower === 'when') return cap(a) + ' when ' + b.toLowerCase() + endPunct(b);
  if (conjLower === 'since') return cap(a) + ' since ' + b.toLowerCase() + endPunct(b);
  if (conjLower === 'after') return cap(a) + ' after ' + b.toLowerCase() + endPunct(b);
  if (conjLower === 'before') return cap(a) + ' before ' + b.toLowerCase() + endPunct(b);
  if (conjLower === 'if') return cap(a) + ' if ' + b.toLowerCase() + endPunct(b);
  if (conjLower === 'unless') return cap(a) + ' unless ' + b.toLowerCase() + endPunct(b);
  if (conjLower === 'until') return cap(a) + ' until ' + b.toLowerCase() + endPunct(b);
  if (conjLower === 'because of' || conjLower === 'despite') return cap(a) + ', ' + conj + ' ' + b.toLowerCase() + endPunct(b);
  return cap(a) + ' ' + conj + ' ' + b.toLowerCase() + endPunct(b);
}

function aLower(s) { return s.toLowerCase(); }

function combine() {
  const a = $('#s1').value.trim();
  const b = $('#s2').value.trim();
  const c = $('#s3').value.trim();
  if (!a || !b) { $('#suggestions').innerHTML = `<p style="opacity:.6">${t('empty')}</p>`; return; }

  const conjs = ['and', 'but', 'or', 'so', 'yet', 'for', 'nor'];
  const subords = ['because', 'although', 'while', 'when', 'since', 'after', 'before', 'if', 'unless'];
  const all = [...conjs, ...subords];

  const out = [];
  // Coordinating variants
  out.push({ label: 'Coordinating', value: articleSwap(build(a, b, 'and')) });
  out.push({ label: 'Coordinating', value: articleSwap(build(a, b, 'but')) });
  out.push({ label: 'Coordinating', value: articleSwap(build(a, b, 'so')) });
  out.push({ label: 'Coordinating', value: articleSwap(build(a, b, 'yet')) });
  // Subordinating variants
  out.push({ label: 'Subordinating', value: articleSwap(build(a, b, 'because')) });
  out.push({ label: 'Subordinating', value: articleSwap(build(a, b, 'although')) });
  out.push({ label: 'Subordinating', value: articleSwap(build(a, b, 'while')) });
  out.push({ label: 'Subordinating', value: articleSwap(build(a, b, 'when')) });

  // 3-sentence combination
  if (c) {
    out.push({ label: '3-Sentence', value: articleSwap(build(build(a, b, 'and'), c, 'because')) });
    out.push({ label: '3-Sentence', value: articleSwap(build(build(a, b, 'but'), c, 'so')) });
  }

  // Dedupe
  const seen = new Set();
  const uniq = out.filter(s => {
    const k = s.value.toLowerCase();
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  }).slice(0, 9);

  $('#suggestions').innerHTML = uniq.map((s, i) =>
    `<div class="suggestion" data-i="${i}"><div class="label">${s.label}</div>${escapeHtml(s.value)}</div>`
  ).join('');
  $('#suggestions').dataset.list = JSON.stringify(uniq);
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

$('#suggestions').addEventListener('click', e => {
  const el = e.target.closest('.suggestion');
  if (!el) return;
  const i = +el.dataset.i;
  const list = JSON.parse($('#suggestions').dataset.list || '[]');
  if (list[i]) copyText(list[i].value);
});

function loadExample() {
  $('#s1').value = 'The sun was setting.';
  $('#s2').value = 'The streetlights came on.';
  $('#s3').value = 'Children ran home for dinner.';
  combine();
}

function doClear() {
  $('#s1').value = ''; $('#s2').value = ''; $('#s3').value = '';
  $('#suggestions').innerHTML = '';
}

$('#toolbar').innerHTML = `
  <button class="gz-btn" onclick="combine()">${t('combine')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="loadExample()">${t('example')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="doClear()">${t('clear')}</button>`;
