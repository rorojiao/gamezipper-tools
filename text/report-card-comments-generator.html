<script>
GZI18n.register({
  en: {

    step1: 'Choose the subject and the student\u2019s performance level',
    step2: 'Pick a tone (formal, warm or brief) and the correct pronouns',
    step3: 'Click Generate \u2014 three comments appear, each with a strength, a growth area and a next step',
    step4: 'Copy a comment (or all three) into your report card system and add one personal detail',
    faqNote: 'Comments are a first draft: add one specific example per student to make each one feel personal.'
  },
  zh: {
    toolTitle: '学生评语生成器',
    toolDesc: '选择学科、表现等级、语气和人称，一键生成 3 条可直接粘贴的专业期末评语。全程在浏览器本地运行，学生姓名不会上传。',
    lblName: '学生名字（可选）',
    lblPron: '人称代词',
    lblSubj: '学科',
    lblLevel: '表现等级',
    lblTone: '语气',
    generate: '生成评语',
    more: '换一批',
    copy: '复制',
    copyAll: '复制全部',
    subjects: {math:'数学',science:'科学',ela:'语文/英语',history:'历史/社会',art:'美术',music:'音乐',pe:'体育',general:'综合/班主任'},
    levels: {excellent:'优秀',proficient:'良好',progressing:'进步中',support:'需要帮助'},
    tones: {formal:'正式',warm:'亲切',brief:'简洁'},
    step1: '选择学科和学生当前的表现等级',
    step2: '选择语气（正式、亲切或简洁）与人称',
    step3: '点击生成——每次输出 3 条含亮点、成长点和下一步的评语',
    step4: '复制单条或全部到成绩系统，再补充一个个性化细节',
    faqNote: '生成评语是初稿：为每名学生补充一个具体事例，评语会更真实。'
  }
});

const { $, copyText, t } = GZ;

// Comment bank. Tokens: {S}=name/this student {s}=subjective {p}=object {P}=possessive {is}=is/are
const SUBJ = {
  math:{s:{excellent:'solves multi-step problems with unusual fluency and checks {s} reasoning without being asked',proficient:'applies grade-level procedures correctly and explains {P} thinking clearly',progressing:'is building accuracy with {is} fact fluency and multi-step problems',support:'needs guided support with core number concepts and place value'},g:{excellent:'can stretch into open-ended problem solving and mathematical modelling',proficient:'can grow by tackling unfamiliar, multi-step problems and checking {P} own work',progressing:'needs steadier practice with word problems and self-checking',support:'benefits from short daily practice with number facts and manipulatives'},n:{excellent:'extend learning with richer problem-solving tasks at home',proficient:'practise explaining how a problem was solved, step by step',progressing:'review key strategies for word problems and check answers before finishing',support:'practise number facts in short daily sessions and use real-life counting'}}
  ,science:{s:{excellent:'designs careful investigations and reasons like a real scientist',proficient:'carries out investigations methodically and records clear evidence',progressing:'is learning to plan fair tests and record observations consistently',support:'needs support following investigation steps and recording what {s} observes'},g:{excellent:'can deepen {P} questions and connect findings to new contexts',proficient:'can grow by writing clearer explanations of cause and effect',progressing:'needs practice linking observations to scientific ideas',support:'benefits from hands-on exploration with adult guidance'},n:{excellent:'try explaining a science topic you love to a younger child',proficient:'ask {S} to explain a recent experiment at the dinner table',progressing:'talk through everyday science — cooking, weather, plants',support:'explore simple hands-on experiments together at home'}}
  ,ela:{s:{excellent:'writes with vivid detail and reads well beyond grade level',proficient:'writes organised paragraphs and discusses texts thoughtfully',progressing:'is growing as a reader and is adding more detail to {P} writing',support:'needs daily reading practice and support building sentences'},g:{excellent:'can experiment with voice, structure and more complex texts',proficient:'can grow with richer vocabulary and tighter editing',progressing:'needs practice with reading comprehension and paragraph structure',support:'benefits from reading aloud together and practising simple sentences'},n:{excellent:'keep a journal or write letters for an authentic audience',proficient:'discuss what {S} reads and revise one piece of writing together',progressing:'read together most nights and retell the story afterwards',support:'read aloud daily and take turns reading familiar sentences'}}
  ,history:{s:{excellent:'connects causes and consequences and argues from evidence',proficient:'understands key events and uses sources to support {P} ideas',progressing:'is learning to place events in sequence and use source material',support:'needs support with timelines, vocabulary and map skills'},g:{excellent:'can weigh multiple perspectives in historical debates',proficient:'can grow by citing specific evidence for {P} claims',progressing:'needs practice with chronology and key vocabulary',support:'benefits from visual timelines and repeated key terms'},n:{excellent:'watch a documentary together and discuss the different viewpoints',proficient:'ask {S} to explain one historical event in their own words',progressing:'use a simple timeline for key events at home',support:'reinforce key vocabulary with flashcards and maps'}}
  ,art:{s:{excellent:'takes creative risks and develops {P} ideas with real intent',proficient:'uses materials skilfully and completes projects with care',progressing:'is gaining confidence with techniques and finishing {P} projects',support:'needs encouragement and structure to plan and finish work'},g:{excellent:'can push {P} work further with feedback and self-assessment',proficient:'can grow by reflecting on {P} own choices',progressing:'needs practice with fine motor control and planning',support:'benefits from step-by-step project guidance'},n:{excellent:'visit a gallery or browse art books together',proficient:'ask {S} to describe what {s} made and why',progressing:'practise cutting, tracing and drawing for 10 minutes a day',support:'make art together — drawing, collage, anything hands-on'}}
  ,music:{s:{excellent:'performs with expression and supports {P} ensemble mates',proficient:'reads music accurately and contributes reliably in ensemble',progressing:'is building rhythm and pitch accuracy in group performance',support:'needs practice keeping steady rhythm and matching pitch'},g:{excellent:'can take leadership in rehearsals and try more difficult pieces',proficient:'can grow with independent practice of tricky passages',progressing:'needs short, regular practice on rhythm and note reading',support:'benefits from listening and clapping rhythms at home'},n:{excellent:'encourage {S} to teach you a piece of music',proficient:'listen to the repertoire and clap along',progressing:'clap rhythms from songs {S} knows',support:'listen to music together and clap the beat'}}
  ,pe:{s:{excellent:'shows strong skill, sportsmanship and leadership in games',proficient:'moves with control and plays fairly and cooperatively',progressing:'is building coordination and confidence in team games',support:'needs encouragement to join activities and practise basic skills'},g:{excellent:'can coach peers and lead warm-up routines',proficient:'can grow in tactical understanding of games',progressing:'needs practice with catching, kicking and spatial awareness',support:'benefits from active play that builds basic movement'},n:{excellent:'lead a family warm-up or skill challenge',proficient:'play an active game together most weekends',progressing:'practise ball skills in the yard for 15 minutes',support:'walk, bike or play actively together most days'}}
  ,general:{s:{excellent:'is organised, self-motivated and a positive influence on {P} class',proficient:'manages {P} time well and cooperates with others',progressing:'is building routines for organisation and focus',support:'needs consistent routines and adult prompts to stay on task'},g:{excellent:'can take on leadership and mentoring roles',proficient:'can grow by setting {P} own learning goals',progressing:'needs practice packing {P} bag and starting tasks promptly',support:'benefits from visual schedules and check-in routines'},n:{excellent:'give {S} a leadership task at home, like planning an outing',proficient:'set one weekly goal together and review it',progressing:'use a simple checklist for mornings and homework',support:'keep a consistent homework routine with short check-ins'}}
};
const OPEN = {
  excellent:['{S} {is} a confident and capable learner this term.','{S} {is} producing work of a very high standard.'],
  proficient:['{S} {is} a consistent and capable learner.','{S} {is} working well at grade level this term.'],
  progressing:['{S} {is} making steady progress this term.','{S} {is} building {P} skills step by step.'],
  support:['{S} {is} working towards grade-level expectations with support.','{S} {is} building foundational skills with targeted help.']
};
const CLOSE = {
  formal:['With continued practice, {S} {is} well placed to make strong progress next term.'],
  warm:['It is a pleasure to have {P} in class, and I look forward to {P} growth next term.'],
  brief:[]
};
const WARM = ['{S} brings positive energy to our classroom.','{S} is kind, curious and willing to try.'];

function pronSet(k){ return k==='he'?{S:'He',s:'he',p:'him',P:'his',is:'is'}:k==='they'?{S:'They',s:'they',p:'them',P:'their',is:'are'}:{S:'She',s:'she',p:'her',P:'her',is:'is'}; }
function applyPron(txt,pr,name){
  if(name){ txt = txt.replace(/\{S\} (?=(is|was))/g, name+' ').replace(/\{S\}/g,name); }
  return txt.replace(/\{S\}/g,pr.S).replace(/\{s\}/g,pr.s).replace(/\{p\}/g,pr.p).replace(/\{P\}/g,pr.P).replace(/\{is\}/g,pr.is);
}
function hash(s){ let h=0; for(const c of s){ h=(h*31+c.charCodeAt(0))>>>0; } return h; }
function pick(arr,seed,off){ return arr[(seed+off)%arr.length]; }

let rcN = 0;
function genComments(){
  const subj = $('#rcSubj').value, lvl = $('#rcLevel').value, tone = $('#rcTone').value;
  const name = $('#rcName').value.trim();
  const pr = pronSet($('#rcPron').value);
  const B = SUBJ[subj];
  const seed = hash(subj+lvl+tone+name+$('#rcPron').value) + rcN*7;
  const out = [];
  for(let i=0;i<3;i++){
    let parts = [];
    if(tone!=='brief'){ parts.push(pick(OPEN[lvl],seed,i)); }
    parts.push('In '+t('subjects')[subj]+', '+name+' '+pick(B.s[lvl],seed,i+1)+'.');
    parts.push(pick(B.g[lvl],seed,i+2).replace(/^\w/,c=>c.toUpperCase())+'.');
    if(tone==='warm'){ parts.push(pick(WARM,seed,i)+' '); parts[parts.length-1]=parts[parts.length-1].trim(); }
    parts.push('Next step: '+pick(B.n[lvl],seed,i+3)+'.');
    if(tone==='formal' && i===0){ parts.push(CLOSE.formal[0]); }
    if(tone==='warm' && i===2){ parts.push(CLOSE.warm[0]); }
    out.push(applyPron(parts.join(' '),pr,name));
  }
  const box = $('#rcOut');
  box.innerHTML = out.map((c,i)=>'<div class="rc-card"><p>'+c+'</p><div class="rc-actions"><button class="gz-btn gz-btn-secondary" data-c="'+i+'">'+t('copy')+'</button></div></div>').join('')
    +'<div class="rc-actions"><button class="gz-btn gz-btn-primary" id="rcCopyAll">'+t('copyAll')+'</button><button class="gz-btn gz-btn-secondary" id="rcMore">'+t('more')+'</button></div>';
  box.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>copyText(out[+b.dataset.c]));
  $('#rcCopyAll').onclick=()=>copyText(out.join('\n\n'));
  $('#rcMore').onclick=()=>{ rcN++; genComments(); };
}

function fillSelect(el,key,order){ el.innerHTML = order.map(k=>'<option value="'+k+'">'+t(key)[k]+'</option>').join(''); }
const ORD=['math','science','ela','history','art','music','pe','general'];
fillSelect($('#rcSubj'),'subjects',ORD);
fillSelect($('#rcLevel'),'levels',['excellent','proficient','progressing','support']);
fillSelect($('#rcTone'),'tones',['formal','warm','brief']);
$('#lbl-name').textContent=t('lblName'); $('#lbl-pron').textContent=t('lblPron');
$('#lbl-subj').textContent=t('lblSubj'); $('#lbl-level').textContent=t('lblLevel'); $('#lbl-tone').textContent=t('lblTone');
$('#toolbar').innerHTML='<button class="gz-btn gz-btn-primary" id="rcGen">'+t('generate')+'</button>';
$('#rcGen').onclick=()=>{ rcN=0; genComments(); };
['rcSubj','rcLevel','rcTone','rcPron'].forEach(id=>$('#'+id).addEventListener('change',()=>{rcN=0;genComments();}));
$('#rcName').addEventListener('input',()=>{rcN=0;genComments();});

GZ.renderToolPage({
  category:'text',
  titleKey:'toolTitle',
  descKey:'toolDesc',
  howToSteps:['step1','step2','step3','step4'],
  related:[
    {icon:'📝',href:'/text/email-writer.html',name:'Email Writer'},
    {icon:'🔤',href:'/text/word-counter.html',name:'Word Counter'},
    {icon:'🔄',href:'/text/passive-to-active.html',name:'Passive to Active Converter'},
    {icon:'🎓',href:'/fun/flashcard-maker.html',name:'Flashcard Maker'},
  ]
});
genComments();
</script>
