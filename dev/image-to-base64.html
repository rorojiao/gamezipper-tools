const { t: tr, $ } = GZ;
const MAX_BYTES = 10 * 1024 * 1024;
let currentImage = null;

function setStatus(msg, kind){
  const meta = $('#meta');
  meta.textContent = msg;
  meta.style.color = kind === 'error' ? 'var(--gz-accent)' : 'var(--text2)';
}

function fmtBytes(n){
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/1024/1024).toFixed(2) + ' MB';
}

function fmtRatio(w, h){
  if (!w || !h) return '—';
  const g = (a, b) => { while (b) { [a, b] = [b, a % b]; } return a; };
  const d = g(w, h);
  return `${w}×${h} (${w/d}:${h/d})`;
}

function pickFormat(){
  const r = document.querySelector('input[name="outfmt"]:checked');
  return r ? r.value : 'uri';
}

function currentMime(name){
  const m = (name || '').toLowerCase().match(/\.([a-z0-9]+)$/);
  if (!m) return 'image/png';
  const ext = m[1];
  if (ext === 'jpg' || ext === 'jpeg') return 'image/jpeg';
  if (ext === 'svg') return 'image/svg+xml';
  if (ext === 'ico') return 'image/x-icon';
  return 'image/' + ext;
}

function buildOutput(mime, b64){
  const dataUri = `data:${mime};base64,${b64}`;
  switch (pickFormat()){
    case 'css':
      return `background-image: url(${dataUri});`;
    case 'img':
      return `<img src="${dataUri}" alt="" width="..." height="...">`;
    case 'raw':
      return b64;
    default:
      return dataUri;
  }
}

function renderImage(file){
  if (!file) return;
  if (file.size > MAX_BYTES) { setStatus(tr('tooLarge'), 'error'); return; }
  setStatus(tr('reading'));
  const reader = new FileReader();
  reader.onload = function(){
    const result = reader.result;
    if (typeof result !== 'string' || !result.startsWith('data:')) {
      setStatus(tr('readError'), 'error'); return;
    }
    const comma = result.indexOf(',');
    if (comma < 0) { setStatus(tr('readError'), 'error'); return; }
    const mime = (result.slice(5, result.indexOf(';')) || currentMime(file.name));
    const b64 = result.slice(comma + 1);
    currentImage = { name: file.name || 'image', mime, b64, size: file.size };
    const preview = $('#preview');
    preview.classList.remove('empty');
    preview.innerHTML = `<img alt="" src="${result}">`;
    const img = new Image();
    img.onload = function(){
      currentImage.w = img.naturalWidth;
      currentImage.h = img.naturalHeight;
      updateOutput();
    };
    img.onerror = function(){ updateOutput(); };
    img.src = result;
    $('#output').value = buildOutput(mime, b64);
    $('#copy').disabled = false;
    $('#download').disabled = false;
    updateOutput();
  };
  reader.onerror = function(){ setStatus(tr('readError'), 'error'); };
  reader.readAsDataURL(file);
}

function updateOutput(){
  if (!currentImage) return;
  const mime = currentImage.mime;
  const b64 = currentImage.b64;
  $('#output').value = buildOutput(mime, b64);
  const w = currentImage.w || 0;
  const h = currentImage.h || 0;
  const meta = $('#meta');
  meta.style.color = 'var(--text2)';
  meta.innerHTML =
    `<span><b>${tr('metaSize')}:</b> ${fmtBytes(currentImage.size)}</span>` +
    `<span><b>${tr('metaType')}:</b> ${mime}</span>` +
    `<span><b>${tr('metaRatio')}:</b> ${fmtRatio(w, h)}</span>` +
    `<span><b>${tr('metaB64Len')}:</b> ${b64.length.toLocaleString()} chars</span>`;
}

function clearAll(){
  currentImage = null;
  $('#file-input').value = '';
  $('#output').value = '';
  $('#preview').classList.add('empty');
  $('#preview').textContent = tr('noImagePreview');
  $('#copy').disabled = true;
  $('#download').disabled = true;
  setStatus(tr('noImage'));
}

function downloadTxt(){
  if (!currentImage) return;
  const blob = new Blob([$('#output').value], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (currentImage.name.replace(/\.[a-z0-9]+$/i, '') || 'image') + '.base64.txt';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 0);
}

document.addEventListener('DOMContentLoaded', function(){
  $('#drop-hint').textContent = tr('dropHint');
  $('#drop-label').textContent = tr('dropLabel');
  $('#format-label').textContent = tr('formatLabel');
  $('#preview-label').textContent = tr('previewLabel');
  $('#output-label').textContent = tr('outputLabel');
  $('#copy').textContent = tr('copy');
  $('#download').textContent = tr('download');
  $('#clear').textContent = tr('clear');
  $('#preview').textContent = tr('noImagePreview');
  setStatus(tr('pasteHint'));

  $('#file-input').addEventListener('change', function(e){
    const f = e.target.files && e.target.files[0];
    if (f) renderImage(f);
  });

  const dz = $('#drop-zone');
  ['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, function(e){
    e.preventDefault(); e.stopPropagation();
    dz.classList.add('drag');
  }));
  ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, function(e){
    e.preventDefault(); e.stopPropagation();
    dz.classList.remove('drag');
  }));
  dz.addEventListener('drop', function(e){
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) { $('#file-input').files = e.dataTransfer.files; renderImage(f); }
  });

  document.querySelectorAll('input[name="outfmt"]').forEach(r => {
    r.addEventListener('change', updateOutput);
  });

  $('#copy').addEventListener('click', function(){
    if (!currentImage) return;
    GZ.copyText($('#output').value);
    setStatus(tr('copied'));
  });
  $('#download').addEventListener('click', downloadTxt);
  $('#clear').addEventListener('click', clearAll);

  window.addEventListener('paste', function(e){
    if (!e.clipboardData) return;
    const items = e.clipboardData.items || [];
    for (const it of items){
      if (it.kind === 'file' && it.type && it.type.startsWith('image/')){
        const file = it.getAsFile();
        if (file) { renderImage(file); e.preventDefault(); break; }
      }
    }
  });
});

</script>
