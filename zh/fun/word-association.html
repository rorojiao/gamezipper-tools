<script>
GZI18n.register({
  en: {
    toolTitle: 'Word Association Game',
    toolDesc: 'Free online Word Association game for ESL, creative writing, therapy and icebreakers. Get a random word and add the first related word that comes to mind. Build a chain and explore how your mind connects ideas.',
    cat_easy: '🌱 Easy',
    cat_abstract: '🌌 Abstract',
    cat_emotion: '💗 Emotions',
    cat_academic: '📚 Academic',
    cat_random: '🎲 Random Mix',
    btnSpin: '🎲 Spin Word',
    btnCopy: '📋 Copy',
    btnAdd: '➕ Add to Chain',
    promptLabel: 'Say the first word that comes to mind:',
    emptyWord: 'Spin',
    stats_plays: 'Words',
    stats_chain: 'Chain Length',
    step1: 'Pick a category or use the Random Mix',
    step2: 'Click Spin Word to reveal a prompt',
    step3: 'Type your association and press Enter or Add to Chain',
    step4: 'Build a chain of related words to see where your mind goes',
  },
  zh: {
    toolTitle: '词语联想游戏',
    toolDesc: '免费在线词语联想游戏,适合英语学习、创意写作、心理治疗和破冰活动。随机抽取提示词,输入你脑中浮现的第一个联想词,记录联想链,探索你的思维方式。',
    cat_easy: '🌱 简单',
    cat_abstract: '🌌 抽象',
    cat_emotion: '💗 情感',
    cat_academic: '📚 学术',
    cat_random: '🎲 随机混合',
    btnSpin: '🎲 抽取词语',
    btnCopy: '📋 复制',
    btnAdd: '➕ 加入联想链',
    promptLabel: '说出脑中浮现的第一个词:',
    emptyWord: '点击抽取',
    stats_plays: '已抽词数',
    stats_chain: '联想链长度',
    step1: '选择分类或使用随机混合',
    step2: '点击抽取词语按钮查看提示词',
    step3: '输入你的联想词并按回车或点击加入',
    step4: '建立联想词链,观察思维走向',
  }
});

const { $, t, showToast } = GZ;

const WORDS = {
  easy: [
    "Beach","Mountain","Cookie","Library","Garden","Bicycle","Piano","Sunset","Coffee","Blanket",
    "Mirror","Garden","Backpack","Candle","Lemon","Wallet","Pillow","Thunder","Snowflake","Compass",
    "Puzzle","Bubble","Anchor","Bridge","Cloud","Window","Map","Photo","Letter","Mango",
    "Chair","Umbrella","River","Galaxy","Star","Forest","Whisper","Rainbow","Ocean","Bicycle",
  ],
  abstract: [
    "Time","Change","Memory","Infinity","Silence","Chaos","Trust","Dream","Logic","Courage",
    "Justice","Faith","Love","Power","Wisdom","Beauty","Truth","Freedom","Fear","Hope",
    "Balance","Harmony","Conflict","Destiny","Pattern","Energy","Void","Wholeness","Boundary","Purpose",
    "Flow","Stillness","Transition","Reflection","Identity","Belonging","Loss","Growth","Renewal","Clarity",
  ],
  emotion: [
    "Joy","Anxiety","Pride","Shame","Gratitude","Loneliness","Excitement","Calm","Curiosity","Boredom",
    "Love","Regret","Hope","Envy","Contentment","Fear","Anger","Surprise","Compassion","Embarrassment",
    "Grief","Euphoria","Longing","Serenity","Frustration","Affection","Worry","Wonder","Resentment","Delight",
    "Vulnerability","Confidence","Disappointment","Tenderness","Spite","Tenderness","Passion","Apathy","Nostalgia","Pride",
  ],
  academic: [
    "Algorithm","Democracy","Photosynthesis","Mitosis","Inflation","Renaissance","Gravity","Encryption","Oxygen","Metaphor",
    "Evolution","Molecule","Hypothesis","Capitalism","Inertia","Bacteria","Syntax","Theorem","Cognition","Ecosystem",
    "Quantum","Catalyst","Polymer","Velocity","Tectonics","Enzymes","Neuron","Entropy","Symbiosis","Data",
    "Atmosphere","Chromosome","Magnetism","Carbon","Plate","Literacy","Frequency","Catalyst","Mineral","Spectrum",
  ],
};

const CATS = ['easy','abstract','emotion','academic','random'];
let currentCat = 'easy';
let currentWord = '';
let spins = 0;
let chain = [];
try { chain = JSON.parse(localStorage.getItem('gz_wa_chain') || '[]'); spins = parseInt(localStorage.getItem('gz_wa_spins') || '0', 10); } catch(e){ chain = []; spins = 0; }

function pool() {
  if (currentCat === 'random') {
    return [].concat(...Object.values(WORDS));
  }
  return WORDS[currentCat] || [];
}

function spinWord() {
  const p = pool();
  if (!p.length) return;
  let next;
  let guard = 0;
  do { next = p[Math.floor(Math.random() * p.length)]; guard++; }
  while (next === currentWord && p.length > 1 && guard < 10);
  currentWord = next;
  $('#waPrompt').textContent = t('promptLabel');
  $('#waWord').textContent = currentWord;
  spins++;
  try { localStorage.setItem('gz_wa_spins', String(spins)); } catch(e){}
  updateStats();
}

function copyWord() {
  if (!currentWord) return;
  GZ.copyText(currentWord);
  showToast(t('btnCopy') + ' ✓');
}

function addToChain() {
  const inp = $('#userInput');
  const v = inp.value.trim();
  if (!v) return;
  chain.unshift({ word: v, time: new Date().toISOString() });
  if (chain.length > 30) chain = chain.slice(0, 30);
  try { localStorage.setItem('gz_wa_chain', JSON.stringify(chain)); } catch(e){}
  inp.value = '';
  renderChain();
  updateStats();
}

function clearChain() {
  if (!confirm('Clear your entire chain?')) return;
  chain = [];
  try { localStorage.setItem('gz_wa_chain', JSON.stringify(chain)); } catch(e){}
  renderChain();
  updateStats();
}

function renderChain() {
  const wrap = $('#waChain');
  const list = $('#chainList');
  if (!chain.length) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  list.innerHTML = chain.map((c, i) => {
    const parts = [];
    parts.push(`<span>${c.word}</span>`);
    if (i < chain.length - 1) parts.push('<span class="arrow">→</span>');
    return parts.join('');
  }).join('') + '<span class="arrow" style="cursor:pointer" onclick="clearChain()" title="Clear">🗑️</span>';
}

function updateStats() {
  $('#waStats').innerHTML = `<strong>${t('stats_plays')}:</strong> ${spins} &nbsp;·&nbsp; <strong>${t('stats_chain')}:</strong> ${chain.length}`;
}

const catBox = $('#catBtns');
CATS.forEach(c => {
  const btn = document.createElement('button');
  btn.textContent = t('cat_' + c);
  if (c === currentCat) btn.classList.add('active');
  btn.onclick = () => {
    currentCat = c;
    catBox.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  };
  catBox.appendChild(btn);
});

$('#btnCopy').textContent = t('btnCopy');
$('#btnAdd').textContent = t('btnAdd');
$('#waPrompt').textContent = t('promptLabel');
renderChain();
updateStats();

GZ.renderToolPage({
  category: 'fun',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'📝', href:'/text/word-unscrambler.html', name:'Word Unscrambler'},
    {icon:'🔤', href:'/text/rhyme-finder.html', name:'Rhyme Finder'},
    {icon:'🎲', href:'/fun/spin-the-bottle.html', name:'Spin the Bottle'},
    {icon:'✨', href:'/fun/affirmation-generator.html', name:'Affirmation Generator'},
  ]
});
</script>
