<script>
GZI18n.register({
  en: {
    toolTitle: 'Mocking SpongeBob Text Generator',
    toolDesc: 'Type any sentence and get the classic sPoNgEbOb alternating-case meme text. Three styles, instant conversion, one-click copy — free and private.',
    lblIn: 'Your text',
    lblOut: 'Mocking output',
    modeStrict: 'Classic aLtErNaTiNg',
    modeRandom: 'RaNdOm mOcKiNg',
    modeVowel: 'EmPhAsIs (voWeLs)',
    stats: 'characters · words',
    step1: 'Type or paste any sentence into the input box',
    step2: 'Pick a style: classic alternation, random mocking, or vowel emphasis',
    step3: 'Press Copy and paste the mocked text anywhere',
    step4: 'Optional: load the example to see how it works',
  },
  zh: {
    toolTitle: '海绵宝宝嘲讽文字生成器',
    toolDesc: '输入任意句子，立即生成经典的 sPoNgEbOb 大小写交替嘲讽梗文字。三种风格、实时转换、一键复制 — 免费且私密。',
    lblIn: '输入文本',
    lblOut: '嘲讽输出',
    modeStrict: '经典交替 aLtErNaTe',
    modeRandom: '随机嘲讽 RaNdOm',
    modeVowel: '元音强调 EmPhAsIs',
    stats: '字符 · 词',
    step1: '在输入框中输入或粘贴任意句子',
    step2: '选择风格：经典交替、随机嘲讽或元音强调',
    step3: '点击复制，把嘲讽文字粘贴到任意地方',
    step4: '可选：加载示例查看效果',
  }
});

const { $, copyText, t } = GZ;
let mode = 'strict';
$('#lbl-in').textContent = t('lblIn');
$('#lbl-out').textContent = t('lblOut');
$('#btn-copy').textContent = t('copy');
$('#btn-example').textContent = t('example');
$('#btn-clear').textContent = t('clear');

$('#modes').innerHTML = ['strict','random','vowel'].map(m =>
  `<button class="sb-mode${m===mode?' on':''}" data-m="${m}" type="button">${t('mode'+m.charAt(0).toUpperCase()+m.slice(1))}</button>`).join('');
$('#modes').addEventListener('click', e => {
  const b = e.target.closest('.sb-mode'); if (!b) return;
  mode = b.dataset.m;
  document.querySelectorAll('.sb-mode').forEach(x => x.classList.toggle('on', x === b));
  render();
});

function mockChar(ch, i, letterCount) {
  if (mode === 'strict') return letterCount % 2 === 0 ? ch.toUpperCase() : ch.toLowerCase();
  if (mode === 'random') return Math.random() < 0.5 ? ch.toUpperCase() : ch.toLowerCase();
  return /[aeiou]/i.test(ch) ? ch.toUpperCase() : ch.toLowerCase();
}

function render() {
  const inp = $('#input').value;
  let out = '', lc = 0;
  for (const ch of inp) {
    if (/[a-zA-Z]/.test(ch)) { out += mockChar(ch, lc, lc); lc++; }
    else out += ch;
  }
  $('#output').textContent = out || '\u00a0';
  const words = (inp.trim().match(/\S+/g) || []).length;
  $('#stats').textContent = inp.length + ' ' + t('stats') + ' · ' + words;
}

$('#input').addEventListener('input', render);
$('#btn-copy').onclick = () => copyText($('#output').textContent);
$('#btn-example').onclick = () => { $('#input').value = "I find your lack of faith disturbing, and I am deeply disappointed in all of you."; render(); };
$('#btn-clear').onclick = () => { $('#input').value = ''; render(); };

render();
GZ.renderToolPage({
  category: 'fun',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],

    {icon:'🫠', href:'/text/zalgo-text.html', name:'Zalgo Text'},
  ]
});
</script>
