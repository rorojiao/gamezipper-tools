const { $, copyText, t } = GZ;
const TARGETS = [5, 7, 5];

function countSyllables(line) {
  if (!line || !line.trim()) return 0;
  const cleaned = line.toLowerCase().replace(/[^a-z\u00e0-\u024f\s'\u2019-]/g, ' ').trim();
  if (!cleaned) return 0;
  const words = cleaned.split(/\s+/).filter(Boolean);
  let total = 0;
  for (const w of words) {
    total += syllablesInWord(w);
  }
  return Math.max(1, total);
}

function syllablesInWord(word) {
  if (!word) return 0;
  let w = word.replace(/^[-\u2019']+|[-\u2019']+$/g, '');
  if (!w) return 0;
  // Common irregular single-syllable words
  const lowers = w.toLowerCase();
  const list = (s) => lowers === s;
  if (list('the') || list('a') || list('an') || list('i') || list('of') || list('to') ||
      list('is') || list('in') || list('on') || list('at') || list('by') || list('my') ||
      list('be') || list('as') || list('or') || list('so')) return 1;
  // Silent ending patterns
  let s = w;
  if (s.length > 2 && s.endsWith('e') && !/[aeiou]e$/.test(s.slice(-3)) &&
      !s.endsWith('le') && !s.endsWith('ie')) {
    s = s.slice(0, -1);
  }
  // Split on vowel groups
  const groups = s.match(/[aeiouy]+/g);
  let n = groups ? groups.length : 1;
  // Heuristic adjustments
  if (/\b\w*([bcdfghjklmnpqrstvwxz])\1\w*\b/.test(w) && n > 1) n -= 0; // placeholder no-op
  // Diphthongs stay 1
  // Silent 'ed' often adds no extra syllable except after t/d
  if (/[^aeiou]ed$/.test(w) && n > 1) n -= 1;
  return Math.max(1, n);
}

function getLineState(i) {
  const v = $('#line' + (i + 1)).value;
  return { text: v.trim(), count: countSyllables(v) };
}

function paint() {
  let allFilled = true, perfect = true, partial = true;
  for (let i = 0; i < 3; i++) {
    const { text, count } = getLineState(i);
    const $s = $('#s' + (i + 1)), $t = $('#t' + (i + 1));
    $s.textContent = count;
    $s.classList.remove('ok', 'bad');
    $t.classList.remove('ok', 'bad');
    if (!text) { allFilled = false; perfect = false; partial = false; continue; }
    if (count === TARGETS[i]) {
      $s.classList.add('ok'); $t.classList.add('ok');
    } else {
      $s.classList.add('bad'); $t.classList.add('bad');
      perfect = false;
    }
  }
  const status = $('#status');
  if (!allFilled) {
    const anyText = $('#line1').value.trim() || $('#line2').value.trim() || $('#line3').value.trim();
    status.className = 'hk-status bad';
    status.textContent = anyText ? t('statusMissing') : t('statusErr');
  } else if (perfect) {
    status.className = 'hk-status ok';
    status.textContent = t('statusPerfect');
  } else {
    status.className = 'hk-status partial';
    status.textContent = t('statusPartial');
  }
}

function doClear() {
  ['line1','line2','line3'].forEach(id => { $('#' + id).value = ''; });
  paint();
  $('#line1').focus();
}

function doCopy() {
  const lines = [1,2,3].map(i => $('#line' + i).value.trim()).filter(Boolean);
  if (!lines.length) return;
  copyText(lines.join('\n'));
}

function loadExample(idx) {
  const examples = [
    { lines: ['An old silent pond', 'A frog jumps into the pond', 'Splash! Silence again.'], author: 'Matsuo Bashō (translated)' },
    { lines: ['Over the wintry', 'forest, winds howl in rage', 'with no leaves to blow.'], author: 'Natsume Sōseki (translated)' },
    { lines: ['Light of a candle', 'drifts outward through the snow', 'one quiet breath more.'], author: 'Original example' },
    { lines: ['A summer river being crossed', 'how pleasing, with sandals in hand', 'slim shade of the willow trees.'], author: 'Yosa Buson (translated)' }
  ];
  const e = examples[idx != null ? idx : 0];
  $('#line1').value = e.lines[0];
  $('#line2').value = e.lines[1];
  $('#line3').value = e.lines[2];
  paint();
}

function renderExamples() {
  const data = [
    { lines: ['An old silent pond', 'A frog jumps into the pond', 'Splash! Silence again.'], author: 'Bashō' },
    { lines: ['Over the wintry', 'forest winds howl in rage', 'with no leaves to blow.'], author: 'Sōseki' },
    { lines: ['A summer river being crossed', 'how pleasing with sandals in hand', 'the slim shade of willows.'], author: 'Buson' },
    { lines: ['In the cicada\u2019s cry', 'no sign can foretell', 'how soon it must die.'], author: 'Kobayashi' }
  ];
  const wrap = $('#examples');
  data.forEach((d, i) => {
    const counts = d.lines.map(countSyllables);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.innerHTML = `<b>${d.author}</b>${d.lines.map((l, j) => `<div>${escapeHtml(l)} <small>(${counts[j]}/${TARGETS[j]})</small></div>`).join('')}<em style="display:block;margin-top:6px">${t('exampleBtn')}</em>`;
    btn.addEventListener('click', () => loadExample(i));
    wrap.appendChild(btn);
  });
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

['line1','line2','line3'].forEach(id => {
  $('#' + id).addEventListener('input', paint);
});
$('#check').addEventListener('click', paint);
$('#clear').addEventListener('click', doClear);
$('#copy').addEventListener('click', doCopy);
$('#example').addEventListener('click', () => loadExample(0));

GZ.renderToolPage({

  titleKey: 'toolTitle',

    {icon:'🎯', href:'/text/sentence-counter.html', name:'Sentence Counter'}
  ]
});

// Render tips and examples after the i18n load
renderExamples();

</script>
