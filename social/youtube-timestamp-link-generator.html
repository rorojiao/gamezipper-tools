<script>
GZI18n.register({
  en: {
    toolTitle: 'YouTube Timestamp Link Generator',
    toolDesc: 'Paste a YouTube URL, pick the exact minute and second, and copy a link that starts the video at that moment. Share links, embed links and a live preview — free and private.',
    lblUrl: 'YouTube video URL',
    h: 'h', m: 'min', s: 'sec',
    btnNow: 'Load example video',
    outShare: 'Share link (opens at the chosen time)',
    outShort: 'Short link (youtu.be)',
    outEmbed: 'Embed link (start= for websites)',
    outTag: 'Embed code (<iframe>)',
    previewBtn: 'Preview at this time',
    errBadUrl: 'Could not find a YouTube video ID in that URL',
    step1: 'Paste any YouTube watch, youtu.be or Shorts URL',
    step2: 'Enter the hour, minute and second where the video should start',
    step3: 'Copy the share link, short link or embed code you need',
    step4: 'Optional: press Preview to watch the moment before sharing',
  },
  zh: {
    toolTitle: 'YouTube 时间戳链接生成器',
    toolDesc: '粘贴 YouTube 视频链接，设定精确到秒的起始时间，一键复制从该时刻开始的分享链接、嵌入链接，并可实时预览 — 免费且私密。',
    lblUrl: 'YouTube 视频链接',
    h: '时', m: '分', s: '秒',
    btnNow: '加载示例视频',
    outShare: '分享链接（从指定时间开始播放）',
    outShort: '短链接（youtu.be）',
    outEmbed: '嵌入链接（网站用 start= 参数）',
    outTag: '嵌入代码（<iframe>）',
    previewBtn: '预览该时刻',
    errBadUrl: '无法识别链接中的 YouTube 视频 ID',
    step1: '粘贴任意 YouTube watch、youtu.be 或 Shorts 链接',
    step2: '输入视频应开始的时、分、秒',
    step3: '复制所需的分享链接、短链接或嵌入代码',
    step4: '可选：点击预览，分享前先查看该时刻',
  }
});

const { $, copyText, t } = GZ;
let vid = '';
$('#lbl-url').textContent = t('lblUrl');
$('#lbl-h').textContent = t('h');
$('#lbl-m').textContent = t('m');
$('#lbl-s').textContent = t('s');
$('#btn-now').textContent = t('btnNow');

function parseVideoId(u) {
  u = u.trim(); if (!u) return '';
  try {
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    const url = new URL(u);
    const host = url.hostname.replace(/^www\./, '');
    if (host === 'youtu.be') return url.pathname.slice(1).split('/')[0];
    if (host.endsWith('youtube.com') || host === 'youtube-nocookie.com') {
      if (url.pathname === '/watch') return url.searchParams.get('v') || '';
      const m = url.pathname.match(/^\/(embed|shorts|live|v)\/([\w-]{11})/);
      if (m) return m[2];
    }
  } catch (e) {}
  return '';
}

function totalSeconds() {
  const h = Math.max(0, parseInt($('#hh').value) || 0);
  const m = Math.min(59, Math.max(0, parseInt($('#mm').value) || 0));
  const s = Math.min(59, Math.max(0, parseInt($('#ss').value) || 0));
  return h * 3600 + m * 60 + s;
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function render() {
  vid = parseVideoId($('#url').value);
  const err = $('#err');
  if ($('#url').value.trim() && !vid) { err.textContent = '✗ ' + t('errBadUrl'); $('#results').innerHTML = ''; $('#preview').hidden = true; return; }
  err.textContent = '';
  if (!vid) { $('#results').innerHTML = ''; $('#preview').hidden = true; return; }
  const sec = totalSeconds();
  const share = `https://www.youtube.com/watch?v=${vid}&t=${sec}s`;
  const short = `https://youtu.be/${vid}?t=${sec}s`;
  const embed = `https://www.youtube.com/embed/${vid}?start=${sec}`;
  const tag = `<iframe width="560" height="315" src="https://www.youtube.com/embed/${vid}?start=${sec}" frameborder="0" allowfullscreen></iframe>`;
  const block = (label, val, raw) => `<div class="yt-out"><b>${esc(label)}</b><span id="v-${label.replace(/\W/g,'')}">${raw ? esc(val) : esc(val)}</span> <button class="gz-btn gz-btn-secondary" style="margin-top:6px" onclick="copyText(${JSON.stringify(val)})">${t('copy')}</button></div>`;
  $('#results').innerHTML = block(t('outShare'), share) + block(t('outShort'), short) + block(t('outEmbed'), embed) + block(t('outTag'), tag) +
    `<button class="gz-btn" id="btn-preview" style="margin-top:6px">${t('previewBtn')}</button>`;
  $('#btn-preview').onclick = () => {
    $('#frame').src = `https://www.youtube.com/embed/${vid}?start=${sec}&autoplay=1`;
    $('#preview').hidden = false;
  };
}

['url','hh','mm','ss'].forEach(id => $('#' + id).addEventListener('input', render));
$('#btn-now').onclick = () => { $('#url').value = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'; $('#mm').value = 1; $('#ss').value = 23; render(); };

GZ.renderToolPage({
  category: 'social',

    {icon:'🔗', href:'/dev/url-encode.html', name:'URL Encode'},
  ]
});
</script>
