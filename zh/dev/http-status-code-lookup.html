<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "What are HTTP status codes?", "acceptedAnswer": {"@type": "Answer", "text": "HTTP status codes are 3-digit numbers returned by web servers to indicate the result of an HTTP request. They are grouped into 5 classes: 1xx informational, 2xx success, 3xx redirection, 4xx client errors, and 5xx server errors."}}, {"@type": "Question", "name": "What is the difference between 401 and 403?", "acceptedAnswer": {"@type": "Answer", "text": "401 Unauthorized means the request lacks valid authentication credentials. 403 Forbidden means the server understood the request but refuses to authorize it — the user is authenticated but does not have permission for the resource."}}, {"@type": "Question", "name": "When should I use 404 vs 410?", "acceptedAnswer": {"@type": "Answer", "text": "404 Not Found is the generic response when a resource is missing. 410 Gone is more specific — it signals the resource has been intentionally removed and will not return. Use 410 for permanently deleted pages to help search engines de-index them faster."}}, {"@type": "Question", "name": "What does a 503 Service Unavailable mean?", "acceptedAnswer": {"@type": "Answer", "text": "503 indicates the server is temporarily unable to handle the request, usually due to maintenance or overload. Unlike 500 (which is an unexpected server error), 503 is an expected condition and the request should be retried after a Retry-After delay."}}]}</script>

<script>
const CODES = [
{code:100,cls:'1xx',name:'Continue',desc:'Server has received the request headers, client should proceed to send the body.',example:'Used in large uploads — client sends Expect: 100-continue header first.'},
{code:101,cls:'1xx',name:'Switching Protocols',desc:'Server is switching protocols as requested by the client Upgrade header.',example:'Upgrade: websocket triggers 101 response.'},
{code:102,cls:'1xx',name:'Processing',desc:'Server has received and is processing the request but no response is available yet (WebDAV).',example:'Long-running WebDAV operations.'},
{code:103,cls:'1xx',name:'Early Hints',desc:'Used to return preliminary response headers before the final response.',example:'Link: </style.css>; rel=preload sent with 103.'},
{code:200,cls:'2xx',name:'OK',desc:'Standard success response. Request succeeded.',example:'GET /index.html → 200 OK with HTML body.'},
{code:201,cls:'2xx',name:'Created',desc:'Request succeeded and a new resource was created.',example:'POST /users with body → 201 with Location: /users/123.'},
{code:202,cls:'2xx',name:'Accepted',desc:'Request accepted for processing but not yet completed.',example:'Background job queue submission.'},
{code:204,cls:'2xx',name:'No Content',desc:'Request succeeded but there is no content to return.',example:'DELETE /users/123 → 204 with empty body.'},
{code:206,cls:'2xx',name:'Partial Content',desc:'Server delivered only part of the resource (range request).',example:'Video stream chunk with Content-Range header.'},
{code:301,cls:'3xx',name:'Moved Permanently',desc:'Resource has been permanently moved to a new URL. Future requests should use the new URL.',example:'Site migration — preserves SEO link equity when used correctly.'},
{code:302,cls:'3xx',name:'Found',desc:'Resource temporarily resides at a different URL. Original URL should continue to be used.',example:'Post-login redirect — though 303 or 307 is more semantically correct.'},
{code:303,cls:'3xx',name:'See Other',desc:'Response to the request can be found under another URI using GET method.',example:'POST /form → 303 See Other → GET /thanks.'},
{code:304,cls:'3xx',name:'Not Modified',desc:'Resource has not been modified since last request. Use cached version.',example:'Browser sends If-Modified-Since → 304 → use cache.'},
{code:307,cls:'3xx',name:'Temporary Redirect',desc:'Request should be repeated at the new URI but with the same method. Unlike 302, the method is preserved.',example:'Maintenance page redirect preserving POST data.'},
{code:308,cls:'3xx',name:'Permanent Redirect',desc:'Resource is permanently moved. Method and body must not change.',example:'API version migration preserving POST.'},
{code:400,cls:'4xx',name:'Bad Request',desc:'Server cannot process the request due to client error (malformed syntax, invalid framing, or deceptive routing).',example:'Missing required parameter or invalid JSON.'},
{code:401,cls:'4xx',name:'Unauthorized',desc:'Request lacks valid authentication credentials for the target resource.',example:'Missing or expired JWT token in Authorization header.'},
{code:403,cls:'4xx',name:'Forbidden',desc:'Server understood the request but refuses to authorize it. User is authenticated but lacks permission.',example:'Authenticated user trying to access admin-only endpoint.'},
{code:404,cls:'4xx',name:'Not Found',desc:'Server cannot find the requested resource. The URL may be wrong or the resource has been deleted.',example:'GET /missing-page.html → 404.'},
{code:405,cls:'4xx',name:'Method Not Allowed',desc:'Request method is not supported for the given resource. Allow header lists supported methods.',example:'GET on a POST-only endpoint.'},
{code:406,cls:'4xx',name:'Not Acceptable',desc:'Server cannot produce a response matching the list of acceptable values in Accept headers.',example:'Client Accept: application/xml but server only returns JSON.'},
{code:408,cls:'4xx',name:'Request Timeout',desc:'Server timed out waiting for the request.',example:'Slow client upload exceeded server timeout.'},
{code:409,cls:'4xx',name:'Conflict',desc:'Request conflicts with the current state of the target resource.',example:'PUT with version number that is stale → 409 Conflict.'},
{code:410,cls:'4xx',name:'Gone',desc:'Resource is intentionally removed and will not return. Search engines should de-index.',example:'Product deleted permanently — stronger signal than 404.'},
{code:413,cls:'4xx',name:'Payload Too Large',desc:'Request body exceeds server-imposed limit.',example:'File upload exceeds max-size limit.'},
{code:414,cls:'4xx',name:'URI Too Long',desc:'URI provided was too long for the server to process.',example:'URL with thousands of encoded query parameters.'},
{code:415,cls:'4xx',name:'Unsupported Media Type',desc:'Request entity has a media type the server does not support.',example:'POSTing XML to JSON-only endpoint.'},
{code:418,cls:'4xx',name:"I'm a teapot",desc:'April Fools joke from RFC 2324. Hyper Text Coffee Pot Control Protocol.',example:'Defined in 1998 as an HTCPCP response. Some APIs use it humorously.'},
{code:422,cls:'4xx',name:'Unprocessable Entity',desc:'Server understands the content but cannot process the contained instructions.',example:'Form validation failure with detailed error fields.'},
{code:429,cls:'4xx',name:'Too Many Requests',desc:'User has sent too many requests in a given amount of time (rate limiting).',example:'API quota exceeded — Retry-After header tells client when to retry.'},
{code:500,cls:'5xx',name:'Internal Server Error',desc:'Generic error when server encounters an unexpected condition.',example:'Uncaught exception in application code.'},
{code:501,cls:'5xx',name:'Not Implemented',desc:'Server does not support the functionality required to fulfill the request.',example:'HTTP method not yet supported.'},
{code:502,cls:'5xx',name:'Bad Gateway',desc:'Server acting as gateway received an invalid response from upstream.',example:'Reverse proxy cannot reach origin server.'},
{code:503,cls:'5xx',name:'Service Unavailable',desc:'Server is temporarily unable to handle the request due to maintenance or overload.',example:'Deployment in progress — Retry-After: 3600.'},
{code:504,cls:'5xx',name:'Gateway Timeout',desc:'Server acting as gateway did not receive a timely response from upstream.',example:'Origin database query exceeded gateway timeout.'},
{code:505,cls:'5xx',name:'HTTP Version Not Supported',desc:'Server does not support the HTTP protocol version used in the request.',example:'HTTP/2 request to server that only supports HTTP/1.1.'},
{code:507,cls:'5xx',name:'Insufficient Storage',desc:'Server cannot store the representation needed to complete the request (WebDAV).',example:'Disk quota exceeded on server.'},
{code:511,cls:'5xx',name:'Network Authentication Required',desc:'Client needs to authenticate to gain network access (captive portals).',example:'Public Wi-Fi redirect to login page.'}
];

    toolTitle: 'HTTP 状态码查询',
    toolDesc: '浏览和搜索所有标准 HTTP 状态码,含描述、常见原因和示例响应。分类:1xx 信息、2xx 成功、3xx 重定向、4xx 客户端错误、5xx 服务器错误。',
    step1: '按状态码(如 404)或名称(如 Not Found)搜索',
    step2: '使用网格上方的标签按类别筛选',
    step3: '点击任意卡片查看完整描述和示例用例',

});

const { $, t, copyText } = GZ;
let activeTab = 'all';

function renderTabs() {
  const tabs = [['all','All','全部'],['1xx','1xx Informational','1xx 信息'],['2xx','2xx Success','2xx 成功'],['3xx','3xx Redirection','3xx 重定向'],['4xx','4xx Client Error','4xx 客户端错误'],['5xx','5xx Server Error','5xx 服务器错误']];
  $('#tabs').innerHTML = tabs.map(([c,en,zh]) => `<div class="hscl-tab ${activeTab===c?'active':''}" data-tab="${c}">${GZ.lang==='zh'?zh:en}</div>`).join('');
  $$('.hscl-tab').forEach(el => el.onclick = () => { activeTab = el.dataset.tab; renderTabs(); renderGrid(); });
}

function renderGrid() {
  const q = $('#search').value.toLowerCase();
  const filtered = CODES.filter(c => {
    const matchTab = activeTab === 'all' || c.cls === activeTab;
    const matchSearch = !q || String(c.code).includes(q) || c.name.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q);
    return matchTab && matchSearch;
  });
  $('#grid').innerHTML = filtered.map(c => `<div class="hscl-card hscl-${c.cls}" data-code="${c.code}"><div class="hscl-code">${c.code}</div><div class="hscl-name">${c.name}</div><div class="hscl-tag">${c.cls}</div></div>`).join('');
  $$('.hscl-card').forEach(el => el.onclick = () => showDetail(parseInt(el.dataset.code)));
}

function showDetail(code) {
  const c = CODES.find(x => x.code === code);
  if (!c) return;
  $('#detail').classList.add('show');
  $('#detail').innerHTML = `
    <button class="gz-btn gz-btn-secondary" onclick="$('#detail').classList.remove('show');$('#detail').innerHTML=''">${t('back')}</button>
    <h3><span class="hscl-code hscl-${c.cls}">${c.code}</span> ${c.name}</h3>
    <div class="hscl-section"><h4>${t('causes')}</h4><p>${c.desc}</p></div>
    <div class="hscl-section"><h4>${t('example')}</h4><div class="hscl-example">${c.example}</div></div>
    <button class="gz-btn" onclick="copyText('HTTP ${c.code} ${c.name}\\n\\n${c.desc.replace(/'/g,"\\'")}')">${t('copyCode')}</button>
  `;
  $('#detail').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function $$(sel) { return Array.from(document.querySelectorAll(sel)); }

$('#toolbar').innerHTML = `<button class="gz-btn gz-btn-secondary" onclick="$('#search').value='';renderGrid()">${t('clear')}</button>`;
$('#search').oninput = renderGrid;

renderTabs();
renderGrid();

});
</script>
