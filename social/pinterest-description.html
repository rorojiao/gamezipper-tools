<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is the Pinterest description character limit?","acceptedAnswer":{"@type":"Answer","text":"Pinterest allows up to 500 characters in a pin description, with the first 50-60 characters showing in the feed preview before truncation. The live counter below the output shows both your full length and the preview-safe limit."}},{"@type":"Question","name":"How do I write a good Pinterest description for SEO?","acceptedAnswer":{"@type":"Answer","text":"Lead with a clear keyword in the first sentence (Pinterest weights the first 50-60 characters highest), describe the pin in 2-3 short natural sentences, add 3-5 relevant hashtags, and close with a soft call to action like Save this pin, Click for more, or Visit the link."}},{"@type":"Question","name":"Should I use hashtags on Pinterest?","acceptedAnswer":{"@type":"Answer","text":"Yes, but only 2-5 highly relevant ones. Pinterest treats hashtags as a topic classifier, not a discovery tool like Instagram. Use specific board-relevant tags like #homedecor or #veganrecipes rather than broad ones like #love or #pinterest."}},{"@type":"Question","name":"Is this tool free?","acceptedAnswer":{"@type":"Answer","text":"Yes — 100% free with no signup, no watermark and no limit on how many descriptions you generate. Everything runs in your browser; nothing is sent to a server, so your draft ideas stay private."}}]}</script>

<body>
<div class="gz-container">
  <div class="gz-tool-header">
    <h1 id="title"></h1>
    <p class="desc" id="desc"></p>
  </div>
  <div class="gz-tool-area">
    <div class="pd-wrap">
      <div class="pd-card">
        <h3>📝 Pin Details</h3>
        <div class="pd-row"><label>Topic</label><input type="text" id="topic" placeholder="e.g. modern farmhouse kitchen" value="modern farmhouse kitchen"></div>
        <div class="pd-row"><label>Audience</label><input type="text" id="audience" placeholder="e.g. home decor lovers" value="home decor lovers"></div>
        <div class="pd-row"><label>Tone</label><select id="tone"><option value="helpful">Helpful</option><option value="inspirational">Inspirational</option><option value="promotional">Promotional</option><option value="educational">Educational</option><option value="friendly">Friendly</option></select></div>
        <div class="pd-row"><label>Hashtags</label><input type="text" id="hashtags" placeholder="#homedecor #kitchendesign" value="#homedecor #kitchendesign #farmhouse"></div>
        <div class="pd-row"><label>CTA</label><select id="cta"><option value="Save this pin for later!">Save this pin for later!</option><option value="Click through for the full tutorial.">Click through for the full tutorial.</option><option value="Visit the link in our profile for more.">Visit the link in our profile for more.</option><option value="Tap to shop the look.">Tap to shop the look.</option><option value="Pin this for your next project.">Pin this for your next project.</option><option value="">None</option></select></div>
        <div class="pd-row"><label>Hook</label><input type="text" id="hook" placeholder="e.g. 7 easy ways to refresh your kitchen" value="7 easy ways to refresh your kitchen"></div>
        <button class="gz-btn" id="genBtn" style="width:100%">✨ Generate Description</button>
        <div class="pd-tags" id="tagPresets"></div>
      </div>
      <div class="pd-card">
        <h3>📋 Description Preview</h3>
        <div class="pd-out empty" id="out">Click "Generate Description" to create your SEO pin description</div>
        <div class="pd-counter" id="counter">0 / 500</div>
        <div class="pd-stats">
          <div class="pd-stat"><span class="v" id="statWords">0</span>words</div>
          <div class="pd-stat"><span class="v" id="statPreview">0</span>preview chars</div>
          <div class="pd-stat"><span class="v" id="statTags">0</span>hashtags</div>
        </div>
        <div class="pd-tips" id="tips">
          <strong>Tip:</strong> Pinterest's algorithm weights the first 50-60 characters highest. Lead with your main keyword.
        </div>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
          <button class="gz-btn" id="copyBtn">📋 Copy</button>
          <button class="gz-btn gz-btn-secondary" id="regenBtn">🔄 Regenerate</button>
        </div>
      </div>
    </div>
  </div>
  <div class="gz-howto"><h2></h2><ol></ol></div>
  <div class="gz-related"><h2></h2><div class="gz-related-grid"></div></div>
</div>
<script>
GZI18n.register({
  en: {
    toolTitle: 'Pinterest Description Generator',
    toolDesc: 'Write SEO-optimized pin descriptions (up to 500 chars) with keywords, hashtags and calls-to-action. Live character counter and bulk save.',
    step1: 'Enter your pin topic, audience, tone and CTA preferences',
    step2: 'Click "Generate Description" to create an SEO-friendly draft',
    step3: 'Edit the preview, then click Copy to paste into Pinterest',
    step4: 'Watch the live counter — first 50-60 characters are most important',
  },
  zh: {
    toolTitle: 'Pinterest 描述生成器',
    toolDesc: '生成 SEO 优化的 Pin 描述（最多 500 字符），含关键词、话题标签和行动号召。实时字符计数和批量保存。',
    step1: '输入 Pin 主题、目标受众、语气和行动号召',
    step2: '点击「生成描述」创建 SEO 友好的草稿',
    step3: '编辑预览，然后点击复制粘贴到 Pinterest',
    step4: '关注实时计数器 — 前 50-60 字符最重要',
  }
});
const { $, copyText, t } = GZ;

const TIPS = [
  'Pinterest\'s algorithm weights the first 50-60 characters highest. Lead with your main keyword.',
  'Use 2-5 specific hashtags like #homedecor or #veganrecipes — broad tags like #love won\'t help.',
  'Pinterest is a visual search engine. Describe what\'s in the image, not just the topic.',
  'Add a soft call-to-action like "Save this pin" or "Click for the full tutorial" to boost engagement.',
  'Re-pin with new descriptions every 4-6 weeks to extend the pin\'s lifespan in the algorithm.',
  'Long-tail keywords (3+ words) drive 2x more saves than short keywords on Pinterest.',
];

const TAGSETS = {
  helpful: ['Tip: lead with the keyword in the first 50 chars.', 'Use sentence case for readability.', 'Add a numbered list (5 ways, 7 ideas).'],
  inspirational: ['Start with a powerful noun or adjective.', 'Use evocative verbs (transform, elevate, embrace).', 'Close with a feel-good call to action.'],
  promotional: ['Mention the product naturally in sentence 1.', 'Use 1 strong CTA at the end.', 'Avoid hard-sell words ("BUY NOW!").'],
  educational: ['Open with the answer or benefit.', 'Use numbers ("5 steps", "3 mistakes").', 'Reference a guide or tutorial at the end.'],
  friendly: ['Write like a friend giving advice.', 'Use first-person ("I love", "I made").', 'End with a question to spark saves.'],
};

const HOOKS = {
  helpful: (t,a) => `${a} — these ${t} tips will save you hours.`,
  inspirational: (t,a) => `Dreaming of ${t}? Here is your sign, ${a}.`,
  promotional: (t,a) => `The ${t} guide every ${a} needs in 2026.`,
  educational: (t,a) => `Everything ${a} should know about ${t}, in one pin.`,
  friendly: (t,a) => `Hey ${a}, I finally nailed ${t} and you can too!`,
};

function generate(){
  const topic = $('#topic').value.trim() || 'your topic';
  const audience = $('#audience').value.trim() || 'pinners';
  const tone = $('#tone').value;
  const hashtags = $('#hashtags').value.trim();
  const cta = $('#cta').value;
  const hookIn = $('#hook').value.trim();
  const hook = hookIn || HOOKS[tone](topic, audience);
  const tip = TAGSETS[tone][Math.floor(Math.random()*TAGSETS[tone].length)];

  const lines = [];
  lines.push(`✨ ${hook}`);
  lines.push('');
  lines.push(`Looking for ${topic} inspiration? This pin is packed with practical ideas that ${audience} love. Save it for later and share with a friend who could use a little ${topic} refresh.`);
  if (tone === 'educational') lines.push(`From beginner basics to pro tips — everything you need to know about ${topic} in one place.`);
  if (tone === 'promotional') lines.push(`Designed for ${audience} who want a fresh take on ${topic} without the overwhelm.`);
  if (hashtags) lines.push(hashtags);
  if (cta) lines.push(`👉 ${cta}`);

  return { text: lines.join('\n'), tip };
}

function updateStats(text){
  const len = [...text].length;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const tags = (text.match(/#[\w]+/g) || []).length;
  const previewLen = Math.min(len, 60);
  $('#statWords').textContent = words;
  $('#statPreview').textContent = previewLen;
  $('#statTags').textContent = tags;
  const counter = $('#counter');
  counter.textContent = `${len} / 500`;
  counter.className = 'pd-counter' + (len > 500 ? ' warn' : (len >= 50 ? ' good' : ''));
}

function render(){
  const { text, tip } = generate();
  const out = $('#out');
  if (!text) { out.textContent = 'Click "Generate Description" to create your SEO pin description'; out.className = 'pd-out empty'; }
  else { out.textContent = text; out.className = 'pd-out'; }
  $('#tips').innerHTML = '<strong>Tip:</strong> ' + tip;
  updateStats(text);
  return text;
}

function renderTagPresets(){
  const presets = {
    'Home': '#homedecor #interiordesign #homesweethome',
    'Food': '#foodie #recipes #homemade',
    'Fashion': '#fashion #style #ootd',
    'Wedding': '#weddinginspo #bride #weddingplanning',
    'DIY': '#diy #handmade #crafts',
    'Travel': '#travel #wanderlust #travelgram',
  };
  $('#tagPresets').innerHTML = Object.entries(presets).map(([k,v]) => `<span class="pd-tag" onclick="$('#hashtags').value='${v}';render()">${k}</span>`).join('');
}

$('#genBtn').onclick = render;
$('#regenBtn').onclick = render;
$('#copyBtn').onclick = () => { const t = $('#out').textContent; if (t) copyText(t); };
$('#tipBtn') && ($('#tipBtn').onclick = () => { const tips = TIPS; $('#tips').innerHTML = '<strong>Tip:</strong> ' + tips[Math.floor(Math.random()*tips.length)]; });

renderTagPresets();
render();

GZ.renderToolPage({
  category: 'social',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'📌', href:'/social/pinterest-pin.html', name:'Pinterest Pin Mockup'},
    {icon:'📸', href:'/social/instagram-bio.html', name:'Instagram Bio'},
    {icon:'🎬', href:'/social/youtube-description.html', name:'YouTube Description'},
    {icon:'🐦', href:'/text/twitter-thread-generator.html', name:'Twitter Thread'},
  ]
});
</script>
<script src="/tools-result-rec.js?v=R449-flat" defer></script>
</body>
