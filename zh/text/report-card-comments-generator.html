<script>
GZI18n.register({
  zh: {
    toolTitle: '学生评语生成器',
    toolDesc: '选择学科、表现等级和语气，一键生成 3 条可直接粘贴的专业期末评语（亮点 + 成长点 + 下一步）。全程浏览器本地运行，学生姓名不会上传。',
    lblName: '学生姓名（可选）',
    lblSubj: '学科',
    lblLevel: '表现等级',
    lblTone: '语气',
    generate: '生成评语',
    more: '换一批',
    copy: '复制',
    copyAll: '复制全部',
    subjects: {math:'数学',science:'科学',ela:'语文',history:'历史/社会',art:'美术',music:'音乐',pe:'体育',general:'综合/班主任'},
    levels: {excellent:'优秀',proficient:'良好',progressing:'进步中',support:'需要帮助'},
    tones: {formal:'正式',warm:'亲切',brief:'简洁'},
    step1: '选择学科和学生当前的表现等级',
    step2: '选择语气（正式、亲切或简洁）',
    step3: '点击生成——每次输出 3 条含亮点、成长点和下一步的评语',
    step4: '复制单条或全部到成绩系统，再补充一个个性化细节',
    faqNote: '生成评语是初稿：为每名学生补充一个具体事例，评语会更真实。'
  }
});

const { $, copyText, t } = GZ;
// {N}=姓名/该生 {X}=学科
const BANK = {
  excellent:[
    '{N}本学期在{X}方面表现突出：课堂专注、作业质量高，能主动挑战有难度的任务，并乐于帮助同学。建议下一步：尝试把方法迁移到更开放的综合题上，保持探究的热情。',
    '{N}的{X}学习扎实且有想法，常能给出多种解法并清楚说明理由，是同学们的榜样。建议下一步：参与学科竞赛或项目式学习，进一步拓展深度。',
    '{N}在{X}课堂上表现出很强的理解力和表达力，知识运用灵活，成绩稳定优秀。建议下一步：制定更高的自主学习目标，带动小组共同进步。'],
  proficient:[
    '{N}本学期在{X}方面稳步发展，能较好掌握课堂知识并完成各项任务，参与度良好。建议下一步：在易错点上做针对性整理，提高解题的严谨性。',
    '{N}的{X}基础较扎实，作业按时完成，愿意尝试有挑战的问题。建议下一步：养成检查与复盘习惯，把“会做”变成“做稳”。',
    '{N}在{X}学习中态度认真，能跟随节奏完成练习，与同伴合作良好。建议下一步：课堂上更主动发言，把想法说清楚，加深理解。'],
  progressing:[
    '{N}本学期在{X}方面取得可见的进步，作业完成度提高，但对部分基础概念仍需巩固。建议下一步：每天安排 15 分钟基础练习，及时订正错题。',
    '{N}对{X}学习的积极性在提升，课堂参与增多，但知识衔接还不够连贯。建议下一步：用错题本定期回顾，把薄弱点逐个击破。',
    '{N}正在逐步建立{X}学习的方法，能完成基本任务，稳定性有待提高。建议下一步：先抓基础题的正确率，再逐步提升难度。'],
  support:[
    '{N}在{X}学习上需要更多引导与练习，目前对基础概念的掌握不够牢固。建议下一步：家校配合，每天固定时间陪伴练习基础内容，多鼓励小进步。',
    '{N}在{X}课堂上注意力与参与度有待提高，作业完成需要提醒。建议下一步：把任务拆成小步骤，完成一步肯定一步，建立信心。',
    '{N}对{X}学习的兴趣正在培养中，基础薄弱导致信心不足。建议下一步：从最简单的成功体验开始，每周设定一个可达成的小目标。']
};
const WARM = ['老师看到了你的努力，继续加油！','你的点滴进步老师都记在心里。'];
function hash(s){ let h=0; for(const c of s){ h=(h*31+c.charCodeAt(0))>>>0; } return h; }
let rcN = 0;
function genComments(){
  const subj=$('#rcSubj').value, lvl=$('#rcLevel').value, tone=$('#rcTone').value;
  const name=$('#rcName').value.trim() || '该生';
  const seed = hash(subj+lvl+tone+name) + rcN*5;
  const pool = BANK[lvl];
  const out = [];
  for(let i=0;i<3;i++){
    let c = pool[(seed+i)%pool.length].replace(/\{N\}/g,name).replace(/\{X\}/g,t('subjects')[subj]);
    if(tone==='warm'){ c += WARM[(seed+i)%WARM.length]; }
    if(tone==='brief'){ c = c.split('。').slice(0,2).join('。')+'。'; }
    out.push(c);
  }
  const box=$('#rcOut');
  box.innerHTML = out.map((c,i)=>'<div class="rc-card"><p>'+c+'</p><div class="rc-actions"><button class="gz-btn gz-btn-secondary" data-c="'+i+'">'+t('copy')+'</button></div></div>').join('')
    +'<div class="rc-actions"><button class="gz-btn gz-btn-primary" id="rcCopyAll">'+t('copyAll')+'</button><button class="gz-btn gz-btn-secondary" id="rcMore">'+t('more')+'</button></div>';
  box.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>copyText(out[+b.dataset.c]));
  $('#rcCopyAll').onclick=()=>copyText(out.join('\n\n'));
  $('#rcMore').onclick=()=>{ rcN++; genComments(); };
}
function fillSelect(el,key,order){ el.innerHTML = order.map(k=>'<option value="'+k+'">'+t(key)[k]+'</option>').join(''); }
fillSelect($('#rcSubj'),'subjects',['math','science','ela','history','art','music','pe','general']);
fillSelect($('#rcLevel'),'levels',['excellent','proficient','progressing','support']);
fillSelect($('#rcTone'),'tones',['formal','warm','brief']);
$('#lbl-name').textContent=t('lblName'); $('#lbl-subj').textContent=t('lblSubj');
$('#lbl-level').textContent=t('lblLevel'); $('#lbl-tone').textContent=t('lblTone');
$('#toolbar').innerHTML='<button class="gz-btn gz-btn-primary" id="rcGen">'+t('generate')+'</button>';
$('#rcGen').onclick=()=>{ rcN=0; genComments(); };
['rcSubj','rcLevel','rcTone'].forEach(id=>$('#'+id).addEventListener('change',()=>{rcN=0;genComments();}));
$('#rcName').addEventListener('input',()=>{rcN=0;genComments();});

GZ.renderToolPage({
  category:'text',
  titleKey:'toolTitle',
  descKey:'toolDesc',
  howToSteps:['step1','step2','step3','step4'],
  related:[
    {icon:'🎓',href:'/zh/fun/flashcard-maker.html',name:'抽认卡制作工具'},
    {icon:'📝',href:'/zh/text/word-counter.html',name:'字数统计器'},
    {icon:'📅',href:'/zh/calc/date-calculator.html',name:'日期计算器'},
    {icon:'🔤',href:'/zh/text/case-converter.html',name:'大小写转换'},
  ]
});
genComments();
</script>
<script src="/tools-result-rec.js?v=R449-flat" defer></script>
</body>
