function applyPreset(key) {
  const p = PRESETS[key];
  if (!p) return;
  $('#site-name').value = p.siteName;
  $('#site-url').value = p.siteUrl;
  $('#summary').value = p.summary;
  state.siteName = p.siteName;
  state.siteUrl = p.siteUrl;
  state.summary = p.summary;
  state.author = state.author || '';
  state.sitemap = state.sitemap || '';
  state.sections = JSON.parse(JSON.stringify(p.sections));
  renderSections();
  render();
  document.querySelectorAll('.preset-bar button').forEach(b => b.classList.toggle('active', b.dataset.preset === key));
}

function renderPresets() {
  const bar = $('#presets');
  bar.innerHTML = '';
  ['blog', 'dev', 'docs', 'saas', 'ecom'].forEach(k => {
    const b = document.createElement('button');
    b.textContent = t('preset' + k.charAt(0).toUpperCase() + k.slice(1));
    b.dataset.preset = k;
    b.onclick = () => applyPreset(k);
    bar.appendChild(b);
  });
}

function addSection() {
  state.sections.push({ title: 'New Section', pages: [{ title: '', url: '', desc: '' }] });
  renderSections();
  render();
}

function removeSection(idx) {
  state.sections.splice(idx, 1);
  if (state.sections.length === 0) state.sections = [{ title: '', pages: [{ title: '', url: '', desc: '' }] }];
  renderSections();
  render();
}

function addPage(secIdx) {
  state.sections[secIdx].pages.push({ title: '', url: '', desc: '' });
  renderSections();
  render();
}

function removePage(secIdx, pgIdx) {
  state.sections[secIdx].pages.splice(pgIdx, 1);
  if (state.sections[secIdx].pages.length === 0) state.sections[secIdx].pages = [{ title: '', url: '', desc: '' }];
  renderSections();
  render();
}

function renderSections() {
  const root = $('#sections');
  root.innerHTML = '';
  state.sections.forEach((sec, sIdx) => {
    const block = document.createElement('div');
    block.className = 'section-block';
    const head = document.createElement('div');
    head.className = 'sec-head';
    head.innerHTML = `<input value="${escapeAttr(sec.title)}" oninput="state.sections[${sIdx}].title=this.value;render()" data-i18n-placeholder="page">
      <button onclick="removeSection(${sIdx})">✕</button>`;
    block.appendChild(head);
    sec.pages.forEach((pg, pIdx) => {
      const row = document.createElement('div');
      row.className = 'page-row';
      row.innerHTML = `<input value="${escapeAttr(pg.title)}" placeholder="${t('placeholder')}" oninput="state.sections[${sIdx}].pages[${pIdx}].title=this.value;render()">
        <input value="${escapeAttr(pg.url)}" placeholder="${t('placeholderUrl')}" oninput="state.sections[${sIdx}].pages[${pIdx}].url=this.value;render()">
        <button class="rm" onclick="removePage(${sIdx},${pIdx})" title="Remove page">✕</button>`;
      block.appendChild(row);
      const descRow = document.createElement('div');
      descRow.className = 'page-row';
      descRow.style.gridTemplateColumns = '1fr 24px';
      descRow.innerHTML = `<input value="${escapeAttr(pg.desc)}" placeholder="${t('placeholderDesc')}" oninput="state.sections[${sIdx}].pages[${pIdx}].desc=this.value;render()" style="grid-column:1/-1">
        <span></span>`;
      block.appendChild(descRow);
    });
    const addPg = document.createElement('button');
    addPg.className = 'add-page';
    addPg.textContent = '+ Page';
    addPg.onclick = () => addPage(sIdx);
    block.appendChild(addPg);
    root.appendChild(block);
  });
}

function escapeAttr(s) { return (s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

function build() {
  state.siteName = $('#site-name').value.trim();
  state.siteUrl = $('#site-url').value.trim();
  state.summary = $('#summary').value.trim();
  state.author = $('#author').value.trim();
  state.sitemap = $('#sitemap').value.trim();
  const lines = [];
  if (state.siteName) lines.push('# ' + state.siteName);
  else lines.push('# ');
  lines.push('');
  if (state.summary) lines.push('> ' + state.summary);
  else lines.push('> ');
  lines.push('');
  state.sections.forEach(sec => {
    const title = sec.title.trim() || 'Untitled Section';
    lines.push('## ' + title);
    lines.push('');
    sec.pages.forEach(pg => {
      const t = (pg.title || '').trim();
      const u = (pg.url || '').trim();
      if (!t && !u) return;
      const safeT = t || u;
      if (u) {
        const d = (pg.desc || '').trim();
        lines.push(d ? `- [${safeT}](${u}): ${d}` : `- [${safeT}](${u})`);
      } else {
        lines.push('- ' + safeT);
      }
    });
    lines.push('');
  });
  if (state.author) lines.push('Author: ' + state.author);
  if (state.sitemap) {
    lines.push('');
    lines.push('Sitemap: ' + state.sitemap);
  }
  return lines.join('\n').replace(/\n{3,}/g, '\n\n').trimEnd() + '\n';
}

function render() {
  const text = build();
  $('#output').textContent = text;
  $('#stat-bytes').textContent = new Blob([text]).size;
  $('#stat-sections').textContent = state.sections.filter(s => s.title.trim() || s.pages.some(p => p.title.trim() || p.url.trim())).length;
  $('#stat-pages').textContent = state.sections.reduce((n, s) => n + s.pages.filter(p => p.title.trim() || p.url.trim()).length, 0);
  $('#stat-words').textContent = text.split(/\s+/).filter(Boolean).length;
  renderChecks(text);
  renderPreview(text);
}

function renderChecks(text) {
  const checks = [];
  if (!state.siteName) checks.push('⚠ Missing site name (H1 line).');
  else checks.push('✓ Site name set.');
  if (!state.summary) checks.push('⚠ Missing summary (blockquote).');
  else if (state.summary.length > 200) checks.push('⚠ Summary exceeds 200 characters — will likely be truncated by AI engines.');
  else checks.push('✓ Summary set (' + state.summary.length + ' chars).');
  const pageCount = state.sections.reduce((n, s) => n + s.pages.filter(p => p.title.trim() && p.url.trim()).length, 0);
  if (pageCount < 3) checks.push('⚠ Only ' + pageCount + ' page(s) — llms.txt works best with 5+ canonical URLs.');
  else checks.push('✓ ' + pageCount + ' pages listed.');
  state.sections.forEach((s, i) => {
    s.pages.forEach((p, j) => {
      if ((p.url || '').trim() && !/^https?:\/\//i.test(p.url.trim())) checks.push('⚠ Section ' + (i+1) + ' page ' + (j+1) + ': URL must start with http(s)://');
      if (p.title.trim() && !p.url.trim()) checks.push('⚠ Section ' + (i+1) + ' page ' + (j+1) + ': title set without URL — link will be skipped.');
    });
  });
  if (text.length > 8192) checks.push('⚠ Output is ' + text.length + ' bytes — large llms.txt may be truncated by some fetchers. Consider moving long descriptions to llms-full.txt.');
  else if (text.length > 4096) checks.push('ℹ Output is ' + text.length + ' bytes — fine, but link to a /llms-full.txt for full-page Markdown if you have long descriptions.');
  else checks.push('✓ Output is ' + text.length + ' bytes — under common fetcher limits.');
  $('#checks').innerHTML = checks.map(c => '<div>' + c + '</div>').join('');
}

function renderPreview(text) {
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const html = text.split('\n').map(line => {
    if (/^# /.test(line)) return '<div style="font-size:1.3em;font-weight:700;margin:6px 0 4px">' + esc(line.slice(2)) + '</div>';
    if (/^## /.test(line)) return '<div style="font-size:1.05em;font-weight:600;margin:10px 0 4px;color:var(--accent)">' + esc(line.slice(3)) + '</div>';
    if (/^> /.test(line)) return '<div style="border-left:3px solid var(--accent);padding:4px 10px;color:var(--text2);margin:6px 0;font-style:italic">' + esc(line.slice(2)) + '</div>';
    if (/^Author: /.test(line)) return '<div style="color:var(--text2);font-size:.9em;margin-top:8px">' + esc(line) + '</div>';
    if (/^Sitemap: /.test(line)) return '<div style="color:var(--text2);font-size:.9em">' + esc(line) + '</div>';
    if (/^- \[/.test(line)) {
      const m = line.match(/^- \[([^\]]+)\]\(([^)]+)\)(?::\s*(.*))?$/);
      if (m) {
        const desc = m[3] ? ' <span style="color:var(--text2)">— ' + esc(m[3]) + '</span>' : '';
        return '<div style="margin:3px 0">• <a style="color:var(--accent);text-decoration:none" href="' + esc(m[2]) + '" target="_blank" rel="noopener">' + esc(m[1]) + '</a>' + desc + '</div>';
      }
    }
    if (line.trim() === '') return '<div style="height:6px"></div>';
    return '<div>' + esc(line) + '</div>';
  }).join('');
  $('#preview').innerHTML = html;
}

function copyOutput() {
  const text = build();
  copyText(text).then(ok => {
    const el = $('#copy-ok');
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 1500);
  });
}

function downloadOutput() {
  const text = build();
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'llms.txt';
  a.click();
  URL.revokeObjectURL(url);
}

function resetForm() {
  if (!confirm('Clear all fields?')) return;
  state = {
    siteName: '', siteUrl: '', summary: '', author: '', sitemap: '',
    sections: [{ title: '', pages: [{ title: '', url: '', desc: '' }] }]
  };
  $('#site-name').value = '';
  $('#site-url').value = '';
  $('#summary').value = '';
  $('#author').value = '';
  $('#sitemap').value = '';
  document.querySelectorAll('.preset-bar button').forEach(b => b.classList.remove('active'));
  renderSections();
  render();
}

// Bind inputs
['site-name','site-url','summary','author','sitemap'].forEach(id => {
  document.getElementById(id).addEventListener('input', render);
});

// Init
renderPresets();
renderSections();
applyPreset('dev');
</script>
</body>
</html>
