<script>
const SAMPLE = `# Database\nDATABASE_URL=postgres://user:pass@localhost:5432/mydb\nDB_POOL_SIZE=10\n\n# API Keys (mark these in your secret manager)\nSTRIPE_API_KEY=sk_live_REDACTED\nOPENAI_API_KEY=sk-abc123\nJWT_SECRET=super-secret-jwt-key-change-me\n\n# Feature flags\nFEATURE_NEW_DASHBOARD=true\nDEBUG_MODE=false\n\n# Server\nPORT=3000\nHOST=localhost\n\n# Bad examples — these will be flagged:\n1INVALID=oops\nDUPLICATE_KEY=first\nNODE_ENV=production\nFOO BAR=unquoted spaces\nEMPTY_VAR=\nUNCLOSED="missing end quote\nDUPLICATE_KEY=second\nPASSWORD=should-be-secret\n`;

function $(s){return document.querySelector(s)}

const SECRET_HINTS = /(api[_-]?key|secret|password|passwd|token|private[_-]?key|access[_-]?key|client[_-]?secret|jwt)/i;
const KEY_RE = /^[A-Za-z_][A-Za-z0-9_]*$/;

function parseEnv(text){
  const lines = text.split(/\r?\n/);
  const entries = [];
  const errors = [];
  const warnings = [];
  const seen = new Map();
  let currentComment = null;

  for(let i = 0; i < lines.length; i++){
    const raw = lines[i];
    const lineNo = i + 1;
    const trimmed = raw.trim();

    if(trimmed === ''){
      entries.push({type:'blank', lineNo, raw});
      continue;
    }
    if(trimmed.startsWith('#')){
      entries.push({type:'comment', lineNo, raw, text: trimmed.slice(1).trim()});
      currentComment = trimmed.slice(1).trim();
      continue;
    }

    // export prefix is optional
    let work = trimmed.replace(/^export\s+/, '');
    const eqIdx = work.indexOf('=');
    if(eqIdx === -1){
      errors.push({lineNo, raw, msg: 'Missing "=" — every variable must be KEY=value'});
      entries.push({type:'error', lineNo, raw});
      continue;
    }

    const rawKey = work.slice(0, eqIdx);
    const key = rawKey.trim();
    if(key === ''){
      errors.push({lineNo, raw, msg: 'Empty key name'});
      entries.push({type:'error', lineNo, raw});
      continue;
    }
    if(rawKey !== key){
      warnings.push({lineNo, raw, msg: `Key has leading/trailing whitespace: "${rawKey}"`});
    }
    if(!KEY_RE.test(key)){
      errors.push({lineNo, raw, msg: `Invalid identifier "${key}". Must match [A-Za-z_][A-Za-z0-9_]*`});
      entries.push({type:'error', lineNo, raw});
      continue;
    }

    let valuePart = work.slice(eqIdx + 1);
    let value = '';
    let quote = null;

    if(valuePart.startsWith('"') || valuePart.startsWith("'")){
      quote = valuePart[0];
      const closeIdx = valuePart.indexOf(quote, 1);
      if(closeIdx === -1){
        errors.push({lineNo, raw, msg: `Unterminated ${quote === '"' ? 'double' : 'single'} quote — value runs to end of line`});
        value = valuePart.slice(1);
      } else {
        value = valuePart.slice(1, closeIdx);
        const tail = valuePart.slice(closeIdx + 1).trim();
        if(tail && !tail.startsWith('#')){
          warnings.push({lineNo, raw, msg: `Trailing content after closing quote: "${tail}"`});
        }
      }
    } else {
      // Unquoted — take until first whitespace or #
      const m = valuePart.match(/^(\S*)/);
      value = m ? m[1] : '';
      const rest = valuePart.slice(value.length).trim();
      if(value.includes(' ') || rest.includes(' ')){
        warnings.push({lineNo, raw, msg: 'Unquoted value contains spaces — most parsers truncate at first whitespace. Wrap in quotes.'});
      }
    }

    if(value === ''){
      warnings.push({lineNo, raw, msg: 'Empty value — verify this is intentional'});
    }

    if(seen.has(key)){
      const firstLine = seen.get(key);
      errors.push({lineNo, raw, msg: `Duplicate key "${key}" (first defined on line ${firstLine})`});
      entries.push({type:'dup', lineNo, raw, key, value});
    } else {
      seen.set(key, lineNo);
      if(SECRET_HINTS.test(key)){
        warnings.push({lineNo, raw, msg: `"${key}" looks like a secret — make sure it's in your secret manager, not committed to git`});
      }
      entries.push({type:'var', lineNo, raw, key, value, comment: currentComment});
    }
  }

  return {entries, errors, warnings, keys: Array.from(seen.keys())};
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
}

function render(){
  const txt = $('#envInput').value;
  const {entries, errors, warnings, keys} = parseEnv(txt);

  const summary = $('#summary');
  const errCount = errors.length;
  const warnCount = warnings.length;
  const validCount = keys.length - errCount;

  summary.innerHTML =
    `<span class="ev-chip ev-chip-ok">✓ ${validCount} valid</span>` +
    (warnCount ? `<span class="ev-chip ev-chip-warn">⚠ ${warnCount} warnings</span>` : '') +
    (errCount ? `<span class="ev-chip ev-chip-err">✗ ${errCount} errors</span>` : '');

  const list = $('#resultList');
  if(entries.length === 0){
    list.innerHTML = '<div class="ev-empty">Paste a .env file to validate.</div>';
  } else {
    const lines = entries.map(e => {
      const err = errors.find(x => x.lineNo === e.lineNo);
      const warn = warnings.find(x => x.lineNo === e.lineNo);
      let cls = 'ev-line';
      if(err) cls = 'ev-err';
      else if(warn) cls = 'ev-warn';
      const note = err ? ` → ${err.msg}` : (warn ? ` → ${warn.msg}` : '');
      const txt = e.raw === '' ? '(blank)' : escapeHtml(e.raw);
      return `<div class="ev-row ${cls}"><span class="ev-lnum">L${e.lineNo}</span> ${txt}${escapeHtml(note)}</div>`;
    });
    list.innerHTML = lines.join('');
  }

  const kv = $('#kvList');
  if(keys.length === 0){
    kv.innerHTML = '<div class="ev-empty">No variables parsed yet.</div>';
  } else {
    const items = entries.filter(e => e.type === 'var' || e.type === 'dup');
    const seen = new Set();
    const html = [];
    items.forEach(e => {
      if(seen.has(e.key)) return; // collapse duplicates
      seen.add(e.key);
      const val = e.value.length > 80 ? e.value.slice(0, 77) + '...' : e.value;
      const valDisplay = SECRET_HINTS.test(e.key) ? '•••••••• (redacted)' : escapeHtml(val);
      html.push(`<div class="k">${escapeHtml(e.key)}</div><div class="v" title="${escapeHtml(e.value)}">${valDisplay}</div>`);
    });
    kv.innerHTML = html.join('');
  }
}

$('#btnSample').addEventListener('click', () => {
  $('#envInput').value = SAMPLE;
  render();
});
$('#btnClear').addEventListener('click', () => {
  $('#envInput').value = '';
  render();
});
$('#btnValidate').addEventListener('click', render);
$('#btnCopy').addEventListener('click', () => {
  const lines = parseEnv($('#envInput').value);
  const out = lines.entries.filter(e => e.type === 'var').map(e => `${e.key}=${e.value}`).join('\n');
  navigator.clipboard.writeText(out).then(() => {
    const b = $('#btnCopy'); const orig = b.textContent;
    b.textContent = '✓ Copied'; setTimeout(() => b.textContent = orig, 1200);
  });
});
$('#envInput').addEventListener('input', render);

});
</script>
