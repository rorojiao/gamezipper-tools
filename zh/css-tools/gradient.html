<div class="gz-container">
  <div class="gz-tool-header"><h1 id="title"></h1><p class="desc" id="desc"></p></div>
  <div class="gz-tool-area">
    <div class="gz-toolbar" id="toolbar"></div>
    <div class="controls" id="controls"></div>
    <div class="stops" id="stops"></div>
    <div class="preview-box" id="preview"></div>

<script>
GZI18n.register({
  en:{toolTitle:'CSS Gradient Generator',toolDesc:'Create beautiful CSS linear and radial gradients with live preview.',
    linear:'Linear',radial:'Radial',angle:'Angle',addStop:'+ Color',removeStop:'−',
    step1:'Choose gradient type (linear or radial)',step2:'Adjust angle and color stops',step3:'Copy the generated CSS code'},
  zh:{toolTitle:'CSS 渐变生成器',toolDesc:'实时预览创建 CSS 线性和径向渐变。',
    linear:'线性',radial:'径向',angle:'角度',addStop:'+ 颜色',removeStop:'−',
    step1:'选择渐变类型（线性或径向）',step2:'调整角度和颜色节点',step3:'复制生成的 CSS 代码'}
});
const {$,copyText,t}=GZ;
let type='linear',angle=135,stops=[{color:'#6c5ce7',pos:0},{color:'#a855f7',pos:100}];
function renderStops(){
  $('#stops').innerHTML=stops.map((s,i)=>`<div class="stop"><input type="color" value="${s.color}" onchange="stops[${i}].color=this.value;update()"><input type="range" min="0" max="100" value="${s.pos}" style="width:80px" onchange="stops[${i}].pos=+this.value;update()">${stops.length>2?`<button class="gz-btn gz-btn-secondary gz-btn-sm" onclick="stops.splice(${i},1);renderStops();update()">${t('removeStop')}</button>`:''}</div>`).join('');
}
function update(){
  const ss=stops.map(s=>`${s.color} ${s.pos}%`).join(', ');
  const css=type==='linear'?`linear-gradient(${angle}deg, ${ss})`:`radial-gradient(circle, ${ss})`;
  $('#preview').style.background=css;
  $('#code').textContent=`background: ${css};`;
}
function loadExample(){type='linear';angle=135;stops=[{color:'#667eea',pos:0},{color:'#764ba2',pos:100}];$('#type').value='linear';$('#angle').value=135;$('#angleVal').textContent='135°';renderStops();update();}
$('#controls').innerHTML=`<label>Type: <select id="type" onchange="type=this.value;update()"><option value="linear">${t('linear')}</option><option value="radial">${t('radial')}</option></select></label><label>${t('angle')}: <input type="range" id="angle" min="0" max="360" value="135" oninput="angle=+this.value;$('#angleVal').textContent=this.value+'°';update()"><span id="angleVal">135°</span></label><button class="gz-btn gz-btn-sm gz-btn-secondary" onclick="stops.push({color:'#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0'),pos:50});renderStops();update()">${t('addStop')}</button>`;
$('#toolbar').innerHTML=`<button class="gz-btn gz-btn-secondary" onclick="loadExample()">${t('example')}</button><button class="gz-btn" onclick="copyText($('#code').textContent)">${t('copy')}</button>`;
renderStops();update();
GZ.renderToolPage({category:'css',titleKey:'toolTitle',descKey:'toolDesc',howToSteps:['step1','step2','step3'],related:[
  {icon:'📦',href:'/css-tools/shadow.html',name:'Box Shadow'},
  {icon:'📐',href:'/css-tools/flexbox.html',name:'Flexbox'},
  {icon:'🎨',href:'/convert/color.html',name:'Color Converter'},
]});
</script>
