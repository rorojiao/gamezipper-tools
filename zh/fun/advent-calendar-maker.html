<script>

    step1: '输入标题并选择 24 或 25 扇门',
    step2: '点击「按主题填充创意」，或为每扇门写下自己的活动',
    step3: '打开预览测试每扇小门（点击开合）',
    step4: '点击打印，剪下编号小门并折叠成型',
  }
});

const { $ } = GZ;
const LS = 'gz-acm-v1';
const THEMES = {
  family: [['🎬','Movie night with popcorn'],['🍪','Bake gingerbread cookies'],['☕','Hot chocolate bar night'],['🎲','Family board game night'],['🎨','Decorate the tree together'],['📖','Christmas story read-aloud'],['🎵','Karaoke / carol night'],['🧦','Match the fuzzy socks game'],['🍕','Build-your-own pizza night'],['✉️','Write a letter to Santa'],['🎁','Wrap one gift together'],['🌟','Make a star ornament'],['🥾','Neighborhood light tour'],['🧩','1000-piece puzzle race'],['🍿','Christmas movie marathon'],['🎄','Cookie decorating party'],['📸','Family photo in silly hats'],['🕯','Candlelight dinner'],['🎶','Learn one Christmas song'],['🥞','Pancake breakfast for dinner'],['🧤','Knit/make a scarf for someone'],['🎳','Bowling or arcade night'],['🍫','Hot cocoa + marshmallows'],['🎆','Sparkler night (Dec 24)'],['🤍','Big hug day — no reason']],
  kids: [['🍭','Pick one candy from the jar'],['🧸','Stuffed animal tea party'],['🖍','Color a Christmas page'],['🎈','Balloon volleyball'],['🐧','Waddle like a penguin race'],['🍪','Decorate a sugar cookie'],['🎩','Wear a silly hat all day'],['🦌','Reindeer food: feed the birds'],['📚','New picture book night'],['🧦','Sock puppet show'],['🔔','Learn Jingle Bells on an instrument'],['🎨','Paint a snowman'],['🍫','Make a mini hot cocoa'],['🧊','Ice ornament freeze game'],['✂️','Cut paper snowflakes'],['🎭','Act out a nativity scene'],['🪀','Build a block gingerbread house'],['🎵','Freeze dance party'],['🌈','Rainbow snack plate'],['🛷','Sled or wagon hill day'],['🧸','Teddy bear hospital day'],['🎟','One extra bedtime story'],['🍿','Popcorn + cartoon hour'],['⭐','Make a wish on a star'],['🎁','Choose one small surprise']],
  couple: [['💌','Write each other a love note'],['🍷','Wine + cheese night in'],['💃','Slow dance in the kitchen'],['📼','Relive first-date movie night'],['🥐','Breakfast in bed'],['🌃','Sunset walk, no phones'],['🎁','Re-gift something thoughtful'],['🍣','Sushi-making night'],['🕯','Candlelit bath'],['📝','Bucket list for 2027'],['🎧','Make each other a playlist'],['🥾','Hike to a light display'],['🍰','Bake a two-person dessert'],['🎮','Co-op game tournament'],['☕','Café hopping morning'],['💍','Recreate your first date'],['🛋','Blanket fort + films'],['🌌','Stargazing with cocoa'],['📷','Recreate an old photo'],['🍝','Homemade pasta night'],['🎭','Open mic or trivia night'],['💆','Massage + tea hour'],['🗓','Plan a 2027 getaway'],['💋','Kiss under the mistletoe'],['🥂','Midnight toast for us']],
  kind: [['📞','Call a grandparent'],['💌','Send a snail-mail card'],['🥐','Pay for the person behind you'],['🧥','Donate a warm coat'],['🐶','Walk a neighbor’s dog'],['🌱','Water a public plant bed'],['☕','Buy a friend a coffee'],['🤝','Help a stranger carry bags'],['🍲','Cook for a busy friend'],['🎁','Gift-wrap for a shelter'],['📚','Donate a book'],['🧤','Leave gloves for someone cold'],['💬','Compliment 3 strangers'],['🕯','Check on an elderly neighbor'],['🍪','Deliver cookies to firefighters'],['✍️','Thank-you note to a teacher'],['🌟','Leave a positive review'],['🧹','Pick up litter on one street'],['🎟','Give a bus ride to someone'],['🫖','Host tea for a lonely person'],['📦','Pack a donation box'],['🌲','Share a tree ornament'],['🍫','Treat the mail carrier'],['🕊','Moment of silence for someone missed'],['🤍','Hug someone a little longer']]
};
let state = load();
function load(){ try{ const s=JSON.parse(localStorage.getItem(LS)); if(s&&Array.isArray(s.doors)) return s; }catch(e){} return {title:'',doors:24,items:Array.from({length:24},(_,i)=>['🎁',''])}; }
function save(){ try{ localStorage.setItem(LS,JSON.stringify(state)); }catch(e){} }
function setDoors(n){ while(state.items.length<n) state.items.push(['🎁','']); state.items.length=n; state.doors=n; }
function fillTheme(shuffle){
  const set = THEMES[$('#acm-theme').value]||THEMES.family;
  let pool = set.slice();
  if(shuffle) pool.sort(()=>Math.random()-.5);
  for(let i=0;i<state.items.length;i++){ const p=pool[i%pool.length]; state.items[i]=[p[0],p[1]]; }
  save(); renderEditor(); renderPreview();
}
function renderEditor(){
  const ed=$('#acm-editor'); ed.innerHTML='';
  state.items.forEach((it,i)=>{
    const row=document.createElement('div'); row.className='acm-row';
    row.innerHTML='<span class="n">'+(i+1)+'</span>';
    const e=document.createElement('input'); e.className='emo'; e.maxLength=4; e.value=it[0];
    e.oninput=()=>{state.items[i][0]=e.value;save();renderPreview();};
    const x=document.createElement('input'); x.className='txt'; x.maxLength=60; x.value=it[1];
    x.oninput=()=>{state.items[i][1]=x.value;save();renderPreview();};
    row.appendChild(e); row.appendChild(x); ed.appendChild(row);
  });
}
let previewOn=true;
function renderPreview(){
  const pv=$('#acm-preview'); pv.innerHTML='';
  state.items.forEach((it,i)=>{
    const d=document.createElement('div'); d.className='acm-door';
    d.innerHTML='<div class="dn">'+(i+1)+'</div><div class="de">'+(it[0]||'🎁')+'</div><div class="dt">'+esc(it[1])+'</div>';
    d.onclick=()=>d.classList.toggle('open');
    pv.appendChild(d);
  });
  pv.style.display=previewOn?'grid':'none';
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function countdown(){
  const now=new Date(); const y=now.getFullYear();
  let target=new Date(y,11,1); if(now>new Date(y,11,25)) target=new Date(y+1,11,1);
  const days=Math.ceil((target-now)/864e5);
  const el=$('#acm-countdown');
  if(now.getMonth()===11&&now.getDate()<=25) el.textContent=GZ.t('countdownLive');
  else el.textContent=GZ.t('countdownIn')+' '+days+' '+GZ.t('countdownTo');
}
function applyI18n(){
  $('#lbl-title').textContent=GZ.t('lblTitle');
  $('#lbl-doors').textContent=GZ.t('lblDoors');
  $('#lbl-theme').textContent=GZ.t('lblTheme');
  $('#btn-fill').textContent=GZ.t('btnFill');
  $('#btn-shuffle').textContent=GZ.t('btnShuffle');
  $('#btn-preview').textContent=GZ.t('btnPreview');
  $('#btn-print').textContent=GZ.t('btnPrint');
  $('#btn-reset').textContent=GZ.t('btnReset');
  $('#acm-printnote').textContent=GZ.t('printNote');
  countdown();
}
$('#acm-title').value=state.title;
$('#acm-title').oninput=()=>{state.title=$('#acm-title').value;save();};
$('#acm-doors').value=String(state.doors);
$('#acm-doors').onchange=()=>{setDoors(parseInt($('#acm-doors').value,10));save();renderEditor();renderPreview();};
$('#btn-fill').onclick=()=>fillTheme(false);
$('#btn-shuffle').onclick=()=>fillTheme(true);
$('#btn-preview').onclick=()=>{previewOn=!previewOn;renderPreview();};
$('#btn-print').onclick=()=>{ $('#acm-ptitle').textContent=(state.title||document.getElementById('title').textContent); window.print(); };
$('#btn-reset').onclick=()=>{ if(confirm('Reset all doors?')){ state.items=state.items.map(()=>['🎁','']); save(); renderEditor(); renderPreview(); } };
renderEditor(); renderPreview(); applyI18n();

GZ.renderToolPage({
  category: 'fun',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'🎄', href:'/fun/christmas-card-maker.html', name:'Christmas Card Maker'},
    {icon:'🎁', href:'/fun/gift-idea-generator.html', name:'Gift Idea Generator'},
    {icon:'🎅', href:'/calc/secret-santa.html', name:'Secret Santa Picker'},
    {icon:'📅', href:'/calc/holiday-countdown.html', name:'Holiday Countdown'},
  ]
});
</script>
