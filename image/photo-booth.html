<style>
.pb-stage{position:relative;background:#10141c;border-radius:12px;overflow:hidden;aspect-ratio:4/3;min-height:240px}
.pb-video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.pb-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#9aa4b2;gap:8px}
.pb-empty .ico{font-size:3rem}
.pb-count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:7rem;font-weight:800;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.6);pointer-events:none}
.pb-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .12s}
.pb-flash.on{opacity:.9}
.pb-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.pb-sel{padding:8px 10px;border-radius:8px;border:1px solid var(--border,#2a3446);background:var(--bg2,#161c26);color:var(--text,#e6ebf2);font-size:.9rem}
.pb-flt-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.pb-flt{padding:6px 12px;border-radius:20px;border:1px solid var(--border,#2a3446);background:var(--bg2,#161c26);color:var(--text2,#9aa4b2);font-size:.85rem;cursor:pointer;user-select:none}
.pb-flt.active{background:var(--accent,#e94560);border-color:var(--accent,#e94560);color:#fff}
.pb-shots{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.pb-shot{position:relative;width:140px}
.pb-shot img{width:100%;border-radius:8px;border:4px solid #fff;background:#fff;display:block}
.pb-shot .del{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:none;background:#e94560;color:#fff;cursor:pointer;font-size:.8rem;line-height:1}
.pb-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.pb-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#223047;color:#fff;padding:10px 18px;border-radius:8px;font-size:.9rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
.pb-toast.show{opacity:1}
</style>

<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "Is this photo booth free and private?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. The photo booth runs entirely in your browser. Your camera feed is never uploaded, recorded or stored on any server — photos are generated locally and downloaded straight to your device. No signup, no watermark, completely free."}}, {"@type": "Question", "name": "How does the countdown timer work?", "acceptedAnswer": {"@type": "Answer", "text": "Choose a delay of Off, 3 or 10 seconds before pressing the photo button. The booth shows a big on-screen countdown, then snaps automatically with a camera-flash effect — perfect for group shots and posing."}}, {"@type": "Question", "name": "What is the photo strip?", "acceptedAnswer": {"@type": "Answer", "text": "Take up to four photos and the booth arranges them into a classic vertical photo-strip image with a white border, just like a mall photo booth. Download it as a single PNG for parties, invitations and social media."}}, {"@type": "Question", "name": "Do I need to install anything?", "acceptedAnswer": {"@type": "Answer", "text": "No. Any modern browser (Chrome, Edge, Firefox, Safari) on desktop or mobile works. Just allow camera access when prompted. If your camera does not start, close other apps that use it, such as Zoom or Teams, and try again."}}]}</script>

<body>
<div class="gz-container">
  <div class="gz-tool-header">
    <h1 id="title"></h1>
    <p class="desc" id="desc"></p>
  </div>
  <div class="gz-tool-area">
    <div class="pb-stage" id="stage">
      <video id="video" class="pb-video" autoplay playsinline muted></video>
      <div class="pb-empty" id="empty"><div class="ico">📸</div><p id="emptyMsg"></p></div>
      <div class="pb-count" id="count" style="display:none"></div>
      <div class="pb-flash" id="flash"></div>
    </div>

    <div id="errorBox"></div>

    <div class="pb-controls">
      <button class="gz-btn" id="startBtn">▶</button>
      <button class="gz-btn gz-btn-secondary" id="stopBtn" disabled>⏹</button>
      <label id="timerLbl" style="font-size:.85rem;color:var(--text2,#9aa4b2)"></label>
      <select class="pb-sel" id="timer">
        <option value="0">Off</option>
        <option value="3" selected>3s</option>
        <option value="10">10s</option>
      </select>
      <button class="gz-btn" id="shotBtn" disabled>📷</button>
      <button class="gz-btn gz-btn-secondary" id="mirrorBtn">🔁</button>
    </div>

    <div class="pb-flt-row" id="filters">
      <div class="pb-flt active" data-f="none"></div>
      <div class="pb-flt" data-f="grayscale(1) contrast(1.1)"></div>
      <div class="pb-flt" data-f="sepia(.9) saturate(1.3)"></div>
      <div class="pb-flt" data-f="saturate(1.7) contrast(1.05)"></div>
      <div class="pb-flt" data-f="grayscale(1) contrast(1.5) brightness(1.1)"></div>
      <div class="pb-flt" data-f="hue-rotate(-15deg) saturate(1.4) brightness(1.05)"></div>
      <div class="pb-flt" data-f="hue-rotate(170deg) saturate(1.3)"></div>
      <div class="pb-flt" data-f="blur(1.5px) brightness(1.15) saturate(1.2)"></div>
    </div>

    <div class="pb-shots" id="shots"></div>

    <div class="pb-actions">
      <button class="gz-btn" id="stripBtn" disabled>⬇</button>
      <button class="gz-btn gz-btn-secondary" id="clearBtn" disabled>✕</button>
    </div>
  </div>
  <div class="gz-howto"><h2></h2><ol></ol></div>
  <div class="gz-related"><h2></h2><div class="gz-related-grid"></div></div>
</div>
<canvas id="canvas" style="display:none"></canvas>
<div class="pb-toast" id="toast"></div>
<script>
GZI18n.register({
  en: {
    toolTitle: 'Photo Booth Online',
    toolDesc: 'Take webcam photos with a countdown timer, fun filters and a classic 4-shot photo strip — 100% free and private, right in your browser.',
    emptyMsg: 'Click Start Camera to begin',
    start: '▶ Start Camera', stop: '⏹ Stop', shoot: '📷 Take Photo', mirror: '🔁 Mirror',
    timerLbl: 'Timer:', strip: '⬇ Download Photo Strip', clear: '✕ Clear All',
    fNone: 'Normal', fBw: 'B&W', fSepia: 'Sepia', fVivid: 'Vivid', fNoir: 'Noir', fWarm: 'Warm', fCool: 'Cool', fDream: 'Dream',
    step1: 'Click Start Camera and allow camera access in your browser',
    step2: 'Pick a filter and a countdown delay (3s or 10s)',
    step3: 'Click Take Photo — repeat up to 4 times to build a photo strip',
    step4: 'Download individual shots or the full photo strip as PNG',
    errNoCam: 'Camera not available. Your browser or device has no camera, or the page must be served over HTTPS.',
    errDenied: 'Camera access was denied. Click the camera icon in the address bar, allow access, then try again.',
    errBusy: 'Could not start the camera. Close other apps using it (Zoom, Teams, Discord) and try again.',
    toastSaved: 'Photo saved to your device',
    toastStrip: 'Photo strip downloaded',
    toastFull: 'Photo strip is full — delete a shot or clear all',
    howto: 'How to Use the Online Photo Booth', related: 'Related Tools'
  },
  zh: {
    toolTitle: '在线拍照亭 / 大头贴',
    toolDesc: '浏览器里的在线拍照亭：倒计时定时拍摄、趣味滤镜、经典四格大头贴一键下载 PNG。完全免费、照片不上传、私密安全。',
    emptyMsg: '点击「开启摄像头」开始',
    start: '▶ 开启摄像头', stop: '⏹ 关闭', shoot: '📷 拍照', mirror: '🔁 镜像',
    timerLbl: '定时：', strip: '⬇ 下载四格大头贴', clear: '✕ 清除全部',
    fNone: '原图', fBw: '黑白', fSepia: '复古棕', fVivid: '鲜艳', fNoir: '黑色电影', fWarm: '暖阳', fCool: '冷调', fDream: '梦幻',
    step1: '点击「开启摄像头」并在浏览器中允许访问摄像头',
    step2: '选择滤镜和倒计时（3 秒或 10 秒）',
    step3: '点击「拍照」——最多连拍 4 张组成四格大头贴',
    step4: '单独下载每张照片，或一键下载整张四格大头贴 PNG',
    errNoCam: '摄像头不可用：设备没有摄像头，或需要通过 HTTPS 访问本页。',
    errDenied: '摄像头权限被拒绝。点击地址栏的摄像头图标允许访问后重试。',
    errBusy: '无法启动摄像头。请关闭其他占用摄像头的应用（Zoom、Teams 等）后重试。',
    toastSaved: '照片已保存到本机',
    toastStrip: '四格大头贴已下载',
    toastFull: '四格已拍满——删除一张或清除全部',
    howto: '如何使用在线拍照亭', related: '相关工具'
  }
});
const t = GZI18n.t, $ = s => document.querySelector(s);
const video = $('#video'), canvas = $('#canvas'), shots = [];
let stream = null, currentFilter = 'none', mirrored = true;

function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2200); }
function showErr(m){ $('#errorBox').innerHTML = '<div class="gz-error" style="color:#e94560;margin:10px 0;font-size:.9rem">'+m+'</div>'; }

async function startCam(){
  showErr(''); 
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},audio:false});
  }catch(e){
    if(e && (e.name==='NotAllowedError'||e.name==='PermissionDeniedError')) showErr(t('errDenied'));
    else if(e && e.name==='NotFoundError') showErr(t('errNoCam'));
    else showErr(t('errBusy'));
    return;
  }
  video.srcObject = stream;
  $('#empty').style.display='none';
  $('#startBtn').disabled=true; $('#stopBtn').disabled=false; $('#shotBtn').disabled=false;
}
function stopCam(){
  if(stream){ stream.getTracks().forEach(tr=>tr.stop()); stream=null; }
  video.srcObject=null;
  $('#empty').style.display='flex';
  $('#startBtn').disabled=false; $('#stopBtn').disabled=true; $('#shotBtn').disabled=true;
}
function snapshot(){
  const w = video.videoWidth||1280, h = video.videoHeight||960;
  canvas.width=w; canvas.height=h;
  const ctx = canvas.getContext('2d');
  ctx.save();
  if(mirrored){ ctx.translate(w,0); ctx.scale(-1,1); }
  if(currentFilter!=='none'){ try{ ctx.filter=currentFilter; }catch(e){} }
  ctx.drawImage(video,0,0,w,h);
  ctx.restore();
  if(shots.length>=4){ toast(t('toastFull')); return; }
  const url = canvas.toDataURL('image/png');
  shots.push(url);
  renderShots();
  flash();
}
function flash(){ const f=$('#flash'); f.classList.add('on'); setTimeout(()=>f.classList.remove('on'),140); }
function renderShots(){
  const box=$('#shots'); box.innerHTML='';
  shots.forEach((u,i)=>{
    const d=document.createElement('div'); d.className='pb-shot';
    d.innerHTML='<img src="'+u+'" alt="Photo booth shot '+(i+1)+'"><button class="del" data-i="'+i+'">✕</button>';
    box.appendChild(d);
  });
  box.querySelectorAll('.del').forEach(b=>b.addEventListener('click',()=>{ shots.splice(+b.dataset.i,1); renderShots(); }));
  $('#stripBtn').disabled = shots.length===0;
  $('#clearBtn').disabled = shots.length===0;
}
function downloadStrip(){
  if(!shots.length) return;
  const pad=28, gap=16, cw=560, ch=Math.round(cw*3/4);
  const sc=document.createElement('canvas');
  sc.width=cw+pad*2; sc.height=pad*2+shots.length*ch+(shots.length-1)*gap;
  const ctx=sc.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,sc.width,sc.height);
  let n=0;
  const done=()=>{ if(++n===shots.length){
    sc.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='photo-booth-strip.png'; a.click(); toast(t('toastStrip')); });
  }};
  shots.forEach((u,i)=>{
    const img=new Image();
    img.onload=()=>{ ctx.drawImage(img,pad,pad+i*(ch+gap),cw,ch); done(); };
    img.onerror=done;
    img.src=u;
  });
}
$('#startBtn').addEventListener('click',startCam);
$('#stopBtn').addEventListener('click',stopCam);
$('#shotBtn').addEventListener('click',()=>{
  const sec=+$('#timer').value;
  if(!sec){ snapshot(); return; }
  const c=$('#count'); let left=sec; c.style.display='flex'; c.textContent=left;
  const iv=setInterval(()=>{
    left--; 
    if(left<=0){ clearInterval(iv); c.style.display='none'; snapshot(); }
    else c.textContent=left;
  },1000);
});
$('#mirrorBtn').addEventListener('click',()=>{ mirrored=!mirrored; video.style.transform=mirrored?'scaleX(-1)':'none'; });
$('#stripBtn').addEventListener('click',downloadStrip);
$('#clearBtn').addEventListener('click',()=>{ shots.length=0; renderShots(); });
document.querySelectorAll('.pb-flt').forEach(el=>el.addEventListener('click',()=>{
  document.querySelectorAll('.pb-flt').forEach(x=>x.classList.remove('active'));
  el.classList.add('active'); currentFilter=el.dataset.f;
  video.style.filter = currentFilter==='none'?'':currentFilter;
}));

$('#emptyMsg').textContent=t('emptyMsg');
$('#startBtn').textContent=t('start'); $('#stopBtn').textContent=t('stop');
$('#shotBtn').textContent=t('shoot'); $('#mirrorBtn').textContent=t('mirror');
$('#timerLbl').textContent=t('timerLbl'); $('#stripBtn').textContent=t('strip'); $('#clearBtn').textContent=t('clear');
const fKeys=['fNone','fBw','fSepia','fVivid','fNoir','fWarm','fCool','fDream'];
document.querySelectorAll('.pb-flt').forEach((el,i)=>el.textContent=t(fKeys[i]));

GZ.renderToolPage({
  category: 'image',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'📷', href:'/dev/webcam-test.html', name:'Webcam Test'},
    {icon:'🎨', href:'/image/photo-filter.html', name:'Photo Filter'},
    {icon:'🛂', href:'/image/passport-photo.html', name:'Passport Photo Maker'},
    {icon:'🖼️', href:'/image/photo-collage.html', name:'Photo Collage Maker'},
  ]
});
</script>
<script src="/tools-result-rec.js?v=R449-flat" defer></script>
</body>
