let currentTweets = [];
let numberingMode = 1;

function countChars(text) {
  let count = 0;
  const urlRegex = /https?:\/\/\S+/g;
  const urls = text.match(urlRegex) || [];
  let remaining = text;
  urls.forEach(url => {
    const idx = remaining.indexOf(url);
    if (idx >= 0) {
      const before = remaining.substring(0, idx);
      count += countStr(before);
      count += 23;
      remaining = remaining.substring(idx + url.length);
    }
  });
  count += countStr(remaining);
  return count;
}

function countStr(text) {
  let count = 0;
  for (const ch of text) {
    const code = ch.codePointAt(0);
    if (code > 0x2E80) {
      count += 2;
    } else {
      count += 1;
    }
  }
  return count;
}

function findLinkCount(text) {
  return (text.match(/https?:\/\/\S+/g) || []).length;
}

function splitText(text, limit) {
  text = text.trim().replace(/\r\n/g, '\n');
  if (!text) return [];
  const paragraphs = text.split(/\n{2,}/);
  const chunks = [];
  let buffer = '';

  function flush() {
    if (buffer.trim()) chunks.push(buffer.trim());
    buffer = '';
  }

  for (const para of paragraphs) {
    const trimmed = para.trim();
    if (!trimmed) continue;
    if (countChars(trimmed) <= limit) {
      const candidate = buffer ? buffer + '\n\n' + trimmed : trimmed;
      if (countChars(candidate) <= limit) {
        buffer = candidate;
      } else {
        flush();
        buffer = trimmed;
      }
      continue;
    }
    flush();
    const sentences = trimmed.split(/(?<=[.!?。！？])\s+/);
    let sentBuf = '';
    for (const sent of sentences) {
      if (countChars(sent) > limit) {
        if (sentBuf) { chunks.push(sentBuf.trim()); sentBuf = ''; }
        const words = sent.split(/\s+/);
        let wordBuf = '';
        for (const word of words) {
          const cand = wordBuf ? wordBuf + ' ' + word : word;
          if (countChars(cand) > limit) {
            if (wordBuf) chunks.push(wordBuf.trim());
            wordBuf = word;
          } else {
            wordBuf = cand;
          }
        }
        if (wordBuf) chunks.push(wordBuf.trim());
        continue;
      }
      const cand = sentBuf ? sentBuf + ' ' + sent : sent;
      if (countChars(cand) > limit) {
        if (sentBuf) chunks.push(sentBuf.trim());
        sentBuf = sent;
      } else {
        sentBuf = cand;
      }
    }
    if (sentBuf) {
      const cand2 = buffer ? buffer + '\n\n' + sentBuf : sentBuf;
      if (countChars(cand2) <= limit) {
        buffer = cand2;
      } else {
        flush();
        buffer = sentBuf;
      }
    }
  }
  flush();
  return chunks;
}

function addNumbering(tweets, mode) {
  const n = tweets.length;
  if (mode === 3) return tweets.map(t => ({ text: t, num: '' }));
  return tweets.map((t, i) => {
    if (mode === 1) return { text: t + '\n\n' + (i + 1) + '/' + n, num: (i + 1) + '/' + n };
    return { text: (i + 1) + '️⃣ ' + t, num: (i + 1) + '️⃣' };
  });
}

function renderTweets() {
  const list = document.getElementById('list');
  if (currentTweets.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:var(--text2);padding:24px;font-size:.9rem">' + GZI18n.t('empty') + '</div>';
    document.getElementById('bulkActions').style.display = 'none';
    return;
  }
  list.innerHTML = '';
  document.getElementById('bulkActions').style.display = 'flex';
  currentTweets.forEach((tw, i) => {
    const chars = countChars(tw.text);
    const limit = parseInt(document.getElementById('limit').value);
    const over = chars > limit;
    const div = document.createElement('div');
    div.className = 'xs-item';
    div.innerHTML = '<div class="xs-num">' + (i + 1) + '</div><div><div class="xs-body"></div><div class="xs-meta ' + (over ? 'warn' : '') + '">' + chars + '/' + limit + ' chars' + (over ? ' ⚠ over' : '') + '</div></div><button class="xs-copy">Copy</button>';
    div.querySelector('.xs-body').textContent = tw.text;
    div.querySelector('.xs-copy').onclick = () => copyText(tw.text, div.querySelector('.xs-copy'));
    list.appendChild(div);
  });
}

function updateStats(rawText) {
  const total = countChars(rawText);
  document.getElementById('sTotal').textContent = total.toLocaleString();
  document.getElementById('sCount').textContent = currentTweets.length;
  const avg = currentTweets.length ? Math.round(total / currentTweets.length) : 0;
  document.getElementById('sAvg').textContent = avg;
  document.getElementById('sLinks').textContent = findLinkCount(rawText);
}

function doSplit() {
  const raw = document.getElementById('input').value;
  const limit = parseInt(document.getElementById('limit').value);
  const chunks = splitText(raw, limit);
  currentTweets = addNumbering(chunks, numberingMode);
  renderTweets();
  updateStats(raw);
}

function copyText(text, btn) {
  const orig = btn.textContent;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = '✓ Copied';
      setTimeout(() => btn.textContent = orig, 1200);
    });
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '✓ Copied';
    setTimeout(() => btn.textContent = orig, 1200);
  }
}

document.querySelectorAll('.xs-chip').forEach(chip => {
  chip.onclick = () => {
    document.querySelectorAll('.xs-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    numberingMode = parseInt(chip.dataset.num);
    if (currentTweets.length) doSplit();
  };
});

document.getElementById('btnSplit').onclick = doSplit;
document.getElementById('input').addEventListener('input', () => {
  if (document.getElementById('input').value.trim()) doSplit();
  else { currentTweets = []; renderTweets(); updateStats(''); }
});
document.getElementById('limit').onchange = () => {
  if (document.getElementById('input').value.trim()) doSplit();
};

document.getElementById('btnSample').onclick = () => {
  document.getElementById('input').value = SAMPLE_TEXT;
  doSplit();
};

document.getElementById('btnClear').onclick = () => {
  document.getElementById('input').value = '';
  currentTweets = [];
  renderTweets();
  updateStats('');
};

document.getElementById('btnCopyAll').onclick = () => {
  const text = currentTweets.map(tw => tw.text).join('\n\n---\n\n');
  copyText(text, document.getElementById('btnCopyAll'));
};

document.getElementById('btnDownload').onclick = () => {
  const text = currentTweets.map(tw => tw.text).join('\n\n---\n\n');
  const blob = new Blob([text], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'x-thread-' + Date.now() + '.txt';
  a.click();
  URL.revokeObjectURL(url);
};

const SAMPLE_TEXT = `The best developers I know all share one habit that nobody talks about: they read error messages twice.\n\nThe first read is reactive — "what broke?" The second read is investigative — "what is the message actually telling me about my assumptions?"\n\nMost bugs don't come from missing knowledge. They come from the gap between what we assumed the code was doing and what it was actually doing. Error messages are usually the only signal we get about that gap.\n\nHere's a 5-step ritual I run every time I hit an unexpected error.\n\n1. Read the message, not the stack trace. The message is what the program THINKS went wrong. The stack is just where it noticed.\n\n2. Identify the noun. "Cannot read property 'foo' of undefined" — the noun is 'undefined'. Whatever you expected to be defined isn't. Find that variable.\n\n3. Reproduce in the smallest possible test. Comment out 80% of the surrounding code. If the bug vanishes, the bug is in what you commented out. If it stays, it's deeper than you think.\n\n4. Read the docs for the function that errored. Not Stack Overflow. Not ChatGPT. The actual docs. You'll often find a 2-sentence note that exactly matches your case.\n\n5. Write down what you learned. Future-you will hit this exact bug again in 18 months and thank past-you.\n\nThis ritual takes 2 extra minutes. It saves 2 hours of frustrated guessing on the second bug, and an exponential amount over a career.`;
