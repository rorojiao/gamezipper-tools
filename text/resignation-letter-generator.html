<script>
GZI18n.register({
  en: {
    toolTitle: 'Resignation Letter Generator',
    toolDesc: 'Fill five fields, pick a tone, and get a professional resignation or two weeks notice letter in seconds. Copy, download or print — free and private.',
    fName: 'Your name', fManager: 'Manager name', fTitle: 'Your job title', fCompany: 'Company', fNotice: 'Notice period (days)',
    toneFormal: 'Formal', toneFriendly: 'Friendly', toneShort: 'Short & simple', toneImmediate: 'Immediate',
    letterLabel: 'Your letter',
    note: 'Tip: talk to your manager first, then send this letter by email so HR has a dated record.',
    step1: 'Fill in your name, manager, job title and company',
    step2: 'Set the notice period in days (14 = standard two weeks)',
    step3: 'Pick a tone: formal, friendly, short, or immediate',
    step4: 'Copy the letter, download it as .txt, or print it',
  },
  zh: {
    toolTitle: '辞职信生成器',
    toolDesc: '填写 5 个字段，选择语气，几秒内生成专业的辞职信或两周通知信。复制、下载或打印 — 免费且私密。',
    fName: '你的姓名', fManager: '上级姓名', fTitle: '职位名称', fCompany: '公司名称', fNotice: '通知期（天）',
    toneFormal: '正式', toneFriendly: '友好', toneShort: '简短', toneImmediate: '立即离职',
    letterLabel: '你的辞职信',
    note: '提示：先与上级面谈，再发送邮件留存记录。',
    step1: '填写姓名、上级、职位和公司名称',
    step2: '设置通知期天数（14 = 标准两周）',
    step3: '选择语气：正式、友好、简短或立即离职',
    step4: '复制辞职信、下载 .txt 或打印',
  }
});

const { $, copyText, t } = GZ;
let tone = 'formal';

$('#form').innerHTML = [
  ['name','fName','Alex Chen'],['manager','fManager','Jordan Reyes'],
  ['title','fTitle','Product Designer'],['company','fCompany','Acme Inc.'],
].map(([id,k,ph]) => `<div><label for="f-${id}">${t(k)}</label><input id="f-${id}" placeholder="${ph}"></div>`).join('') +
`<div><label for="f-notice">${t('fNotice')}</label><input id="f-notice" type="number" min="0" max="365" value="14"></div>`;

$('#tones').innerHTML = ['formal','friendly','short','immediate'].map(m =>
  `<button class="rl-tone${m===tone?' on':''}" data-m="${m}" type="button">${t('tone'+m.charAt(0).toUpperCase()+m.slice(1))}</button>`).join('');
$('#tones').addEventListener('click', e => {
  const b = e.target.closest('.rl-tone'); if (!b) return;
  tone = b.dataset.m;
  document.querySelectorAll('.rl-tone').forEach(x => x.classList.toggle('on', x === b));
  render();
});

$('#toolbar').innerHTML = `<button class="gz-btn" onclick="copyText($('#letter').textContent)">${t('copy')}</button>
<button class="gz-btn gz-btn-secondary" id="btn-dl">${t('download')} .txt</button>
<button class="gz-btn gz-btn-secondary" onclick="window.print()">🖨️</button>`;
$('#lbl-letter').textContent = t('letterLabel');
$('#note').textContent = t('note');

function fmtDate(d) {
  return d.toLocaleDateString(GZI18n.getLang() === 'zh' ? 'zh-CN' : 'en-US', { year:'numeric', month:'long', day:'numeric' });
}

function render() {
  const name = $('#f-name').value.trim() || '[Your Name]';
  const mgr = $('#f-manager').value.trim() || '[Manager]';
  const title = $('#f-title').value.trim() || '[Your Position]';
  const company = $('#f-company').value.trim() || '[Company]';
  const days = Math.max(0, parseInt($('#f-notice').value) || 0);
  const today = new Date();
  const last = new Date(today.getTime() + days * 86400000);
  const todayS = fmtDate(today), lastS = fmtDate(last);
  let body;
  if (tone === 'immediate') {
    body = `Dear ${mgr},\n\nPlease accept this letter as formal notice that I am resigning from my position as ${title} at ${company}, effective immediately. My last day is ${todayS}.\n\nI appreciate the opportunities I have had here and I am sorry for the short notice. I will do what I can to make the transition as smooth as possible.\n\nSincerely,\n${name}`;
  } else if (tone === 'short') {
    body = `Dear ${mgr},\n\nI am writing to resign from my position as ${title} at ${company}. My last day will be ${lastS}.\n\nThank you for the opportunity. I am happy to help with the handover.\n\nSincerely,\n${name}`;
  } else if (tone === 'friendly') {
    body = `Hi ${mgr},\n\nI wanted to let you know that I am resigning from my role as ${title} at ${company}. My last day will be ${lastS}, giving us ${days} days to plan the handover.\n\nI have genuinely enjoyed my time on the team and I am grateful for everything I have learned. Over the next weeks I will wrap up my projects and document my work so the transition is easy.\n\nI hope we stay in touch,\n${name}`;
  } else {
    body = `Dear ${mgr},\n\nI am writing to formally notify you of my resignation from the position of ${title} at ${company}. In accordance with my notice period, my last day of employment will be ${lastS}.\n\nThank you for the professional opportunities and support during my time at ${company}. I remain committed to my duties through my final day and will assist in training my replacement and completing outstanding work wherever possible.\n\nI wish you and the company continued success.\n\nSincerely,\n${name}`;
  }
  $('#letter').textContent = `${todayS}\n\n${body}`;
}

['name','manager','title','company','notice'].forEach(id => $('#f-' + id).addEventListener('input', render));
$('#btn-dl').onclick = () => {
  const blob = new Blob([$('#letter').textContent], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'resignation-letter.txt';
  a.click();
  URL.revokeObjectURL(a.href);
};

render();
GZ.renderToolPage({
  category: 'text',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'💼', href:'/text/cover-letter-generator.html', name:'Cover Letter'},
    {icon:'📄', href:'/text/reference-letter-generator.html', name:'Reference Letter'},
    {icon:'✉️', href:'/text/out-of-office-generator.html', name:'Out of Office'},
    {icon:'📝', href:'/text/thank-you-letter.html', name:'Thank You Letter'},
  ]
});
</script>
