    tabBuild: '生成磁链',
    tabParse: '解析磁链',
    infoHash: 'Info Hash（40 位十六进制 / 32 位 Base32）',
    displayName: '显示名称（dn=）',
    trackers: 'Tracker 地址（tr=）— 每行一个',
    addTracker: '+ 添加 Tracker',
    webSeeds: 'Web Seed（ws=，可选）— 每行一个',
    exactSource: 'Exact Source（xs=，可选）',
    exactTopic: 'Exact Topic（xt.1=，可选）',
    resultLabel: '磁力 URI',
    pasteMagnet: '粘贴磁力链接',
    parsedLabel: '解析字段',
    trackersList: 'Tracker 地址',
    copy: '复制',
    copyAll: '全部复制',
    clear: '清空',
    step1: '选择「生成磁链」从哈希和 Tracker 创建磁力链接',
    step2: '选择「解析磁链」从现有磁力 URI 提取字段',
    step3: '复制结果或直接分享到任意 BitTorrent 客户端',

});

const { $, copyText, t } = GZ;

function addTracker(val){
  const wrap = document.createElement('div');
  wrap.className = 'tracker-row';
  const inp = document.createElement('input');
  inp.type = 'text'; inp.className = 'fld tracker-inp';
  inp.placeholder = 'udp://tracker.opentrackr.org:1337/announce';
  if (val) inp.value = val;
  inp.addEventListener('input', build);
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = '×';
  btn.title = 'Remove';
  btn.onclick = () => { wrap.remove(); build(); };
  wrap.appendChild(inp); wrap.appendChild(btn);
  $('#trackers').appendChild(wrap);
}

function trackersList(){
  return Array.from(document.querySelectorAll('.tracker-inp')).map(i => i.value.trim()).filter(Boolean);
}

function enc(s){ return encodeURIComponent(s).replace(/'/g, '%27'); }

function build(){
  const hashRaw = $('#hash').value.trim();
  const name = $('#name').value.trim();
  const trs = trackersList();
  const ws = $('#ws').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const xs = $('#xs').value.trim();
  const xt1 = $('#xt1').value.trim();
  let out = 'magnet:?';
  const params = [];
  if (hashRaw){
    if (/^[0-9a-fA-F]{40}$/.test(hashRaw)) params.push('xt=urn:btih:' + hashRaw.toLowerCase());
    else if (/^[A-Z2-7]{32}$/.test(hashRaw)) params.push('xt=urn:btih:' + hashRaw);
    else params.push('# invalid hash: must be 40 hex or 32 base32 chars');
  }
  if (name) params.push('dn=' + enc(name));
  trs.forEach(tr => params.push('tr=' + enc(tr)));
  ws.forEach(u => params.push('ws=' + enc(u)));
  if (xs) params.push('xs=' + enc(xs));
  if (xt1) params.push('xt.1=' + enc(xt1));
  out += params.join('&');
  $('#out-build').textContent = out;
}

function parse(){
  const raw = $('#magnet-in').value.trim();
  const st = $('#parse-status');
  const out = $('#out-parse');
  const trs = $('#out-parse-trackers');
  out.innerHTML = '';
  trs.textContent = '';
  st.className = 'status';
  st.textContent = '';
  if (!raw){
    st.textContent = 'Paste a magnet:?xt=... link above to parse.';
    return;
  }
  if (!/^magnet:\?/i.test(raw)){
    st.className = 'status err';
    st.textContent = 'Not a magnet link — must start with magnet:?';
    return;
  }
  const query = raw.slice(raw.indexOf('?') + 1);
  const params = new URLSearchParams(query);
  const fields = [];
  const trackers = [];
  params.forEach((v, k) => {
    if (k === 'tr') trackers.push(v);
    else if (k === 'ws') fields.push(['Web Seed', v]);
    else if (k === 'xs') fields.push(['Exact Source', v]);
    else if (k === 'as') fields.push(['Acceptable Source', v]);
    else if (k === 'dn') fields.push(['Display Name', v]);
    else if (k === 'kt') fields.push(['Keyword Topic', v]);
    else if (k.startsWith('xt')) fields.push([k.toUpperCase(), v]);
    else if (k.startsWith('x.')) fields.push([k, v]);
    else if (k === 'xl') fields.push(['Exact Length', v + ' bytes']);
    else fields.push([k, v]);
  });
  if (!fields.length && !trackers.length){
    st.className = 'status err';
    st.textContent = 'No recognizable params found.';
    return;
  }
  fields.forEach(([k, v]) => {
    const dk = document.createElement('div'); dk.className = 'k'; dk.textContent = k;
    const dv = document.createElement('div'); dv.textContent = v;
    out.appendChild(dk); out.appendChild(dv);
  });
  trackers.forEach(tr => {
    const a = document.createElement('a');
    a.href = tr; a.textContent = tr; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.style.display = 'block';
    a.style.wordBreak = 'break-all';
    a.style.color = 'var(--gz-accent)';
    trs.appendChild(a);
  });
  st.className = 'status ok';
  st.textContent = '✓ Parsed ' + (fields.length + trackers.length) + ' field' + ((fields.length+trackers.length)===1?'':'s');
}

window.switchTab = function(which){
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + which).classList.add('active');
  document.getElementById('pane-' + which).classList.add('active');
  if (which === 'build') build();
  else parse();
};

['hash','name','xs','xt1','ws'].forEach(id => $('#'+id).addEventListener('input', build));
$('#magnet-in').addEventListener('input', parse);

$('#toolbar').innerHTML = `
  <button class="gz-btn" onclick="build()">${t('tabBuild')}</button>
  <button class="gz-btn" onclick="parse()">${t('tabParse')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="copyText($('#out-build').textContent)">${t('copyAll')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="$('#hash').value='';$('#name').value='';$('#ws').value='';$('#xs').value='';$('#xt1').value='';document.querySelectorAll('.tracker-inp').forEach((i,idx)=>{if(idx>0){i.parentElement.remove();}else{i.value='';}});build();">${t('clear')}</button>`;

// seed with two default trackers
addTracker('udp://tracker.opentrackr.org:1337/announce');
addTracker('udp://tracker.openbittorrent.com:6969/announce');
build();

</script>
