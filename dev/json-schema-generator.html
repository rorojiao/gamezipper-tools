<script>
GZI18n.register({
  en:{
    toolTitle:'JSON Schema Generator',toolDesc:'Generate a draft-07 JSON Schema from any JSON. Infer nested objects, arrays, required properties and optional enum constraints locally in your browser.',
    inputLabel:'Paste JSON',outputLabel:'Generated draft-07 JSON Schema',schemaTitle:'Schema title',generate:'Generate schema',example:'Load example',copy:'Copy schema',clear:'Clear',
    required:'Require object properties',enums:'Infer enums from small primitive arrays',additional:'Disallow additional object properties',empty:'Paste JSON to generate a schema.',valid:'Schema generated.',invalid:'Invalid JSON:',copied:'Schema copied.',
    step1:'Paste a JSON object or array into the input editor.',step2:'Choose whether properties are required, arrays become enums, or extra object properties are forbidden.',step3:'Generate the draft-07 schema and review the inferred structure.',step4:'Copy the schema into your validator, API contract or code generator.'
  },
  zh:{
    toolTitle:'JSON Schema 生成器',toolDesc:'从任意 JSON 生成 draft-07 JSON Schema。在浏览器本地推断嵌套对象、数组、必填属性和可选 enum 约束。',
    inputLabel:'粘贴 JSON',outputLabel:'生成的 draft-07 JSON Schema',schemaTitle:'Schema 标题',generate:'生成 Schema',example:'载入示例',copy:'复制 Schema',clear:'清空',
    required:'要求对象属性必填',enums:'从小型基础类型数组推断 enum',additional:'禁止额外对象属性',empty:'粘贴 JSON 后即可生成 Schema。',valid:'Schema 已生成。',invalid:'JSON 无效：',copied:'Schema 已复制。',
    step1:'将 JSON 对象或数组粘贴到输入编辑器中。',step2:'选择属性是否必填、数组是否生成 enum，以及是否禁止额外对象属性。',step3:'生成 draft-07 Schema 并检查推断出的结构。',step4:'将 Schema 复制到验证器、API 契约或代码生成器中。'
  }
});
const { $, copyText, t } = GZ;
const options={required:true,enums:false,additional:false};
let generatedText='';
function kindOf(value){if(value===null)return'null';if(Array.isArray(value))return'array';if(typeof value==='number')return Number.isInteger(value)?'integer':'number';return typeof value;}
function stableUnique(values){const seen=new Set();return values.filter(value=>{const key=JSON.stringify(value);if(seen.has(key))return false;seen.add(key);return true;});}
function uniqueSchemas(schemas){const seen=new Set();return schemas.filter(schema=>{const key=JSON.stringify(schema);if(seen.has(key))return false;seen.add(key);return true;});}
function schemaForValues(values){
  const kinds=[...new Set(values.map(kindOf))];
  if(kinds.length===1){
    const kind=kinds[0];
    if(kind==='object')return objectSchema(values);
    if(kind==='array')return arraySchema(values);
    return {type:kind};
  }
  if(kinds.every(kind=>kind==='integer'||kind==='number'))return {type:'number'};
  return {anyOf:uniqueSchemas(values.map(schemaForValue))};
}
function schemaForValue(value){
  const kind=kindOf(value);
  if(kind==='object')return objectSchema([value]);
  if(kind==='array')return arraySchema([value]);
  return {type:kind};
}
function objectSchema(objects){
  const properties={}; const keys=[];
  objects.forEach(object=>Object.keys(object).forEach(key=>{if(!keys.includes(key))keys.push(key);}));
  keys.forEach(key=>{properties[key]=schemaForValues(objects.filter(object=>Object.prototype.hasOwnProperty.call(object,key)).map(object=>object[key]));});
  const schema={type:'object',properties};
  if(options.required){const required=keys.filter(key=>objects.every(object=>Object.prototype.hasOwnProperty.call(object,key)));if(required.length)schema.required=required;}
  if(options.additional)schema.additionalProperties=false;
  return schema;
}
function arraySchema(arrays){
  const items=arrays.flat(); const schema={type:'array'};
  if(!items.length){schema.items={};return schema;}
  schema.items=schemaForValues(items);
  const kinds=[...new Set(items.map(kindOf))];
  if(options.enums&&kinds.length===1&&['string','integer','number','boolean','null'].includes(kinds[0])){
    const values=stableUnique(items);if(values.length>1&&values.length<=20)schema.items.enum=values;
  }
  return schema;
}
function buildSchema(value){
  const root=schemaForValue(value); const schema={'$schema':'http://json-schema.org/draft-07/schema#'};
  const title=$('#schema-title').value.trim();if(title)schema.title=title;
  Object.assign(schema,root);return schema;
}
function renderSchema(){
  const raw=$('#json-input').value.trim();const status=$('#status');
  if(!raw){generatedText='';$('#schema-output').textContent='';status.textContent=t('empty');status.className='schema-status';return;}
  try{const parsed=JSON.parse(raw);generatedText=JSON.stringify(buildSchema(parsed),null,2);$('#schema-output').textContent=generatedText;status.textContent=t('valid');status.className='schema-status success';}
  catch(error){generatedText='';$('#schema-output').textContent='';status.textContent=t('invalid')+' '+error.message;status.className='schema-status error';}
}
function loadExample(){
  $('#schema-title').value='Storefront response';$('#json-input').value=JSON.stringify({id:42,name:'GameZipper',active:true,tags:['tools','free','online'],users:[{id:1,email:'owner@example.com',role:'admin'},{id:2,email:'reader@example.com'}],settings:{theme:'dark',retries:3},deletedAt:null},null,2);renderSchema();
}
function clearAll(){$('#json-input').value='';$('#schema-title').value='Generated Schema';renderSchema();}
function copySchema(){if(!generatedText)return;copyText(generatedText);$('#status').textContent=t('copied');$('#status').className='schema-status success';}
$('#options').innerHTML='<label><input id="opt-required" type="checkbox" checked> <span></span></label><label><input id="opt-enums" type="checkbox"> <span></span></label><label><input id="opt-additional" type="checkbox"> <span></span></label>';
const optionLabels=$('#options').querySelectorAll('span');optionLabels[0].textContent=t('required');optionLabels[1].textContent=t('enums');optionLabels[2].textContent=t('additional');
$('#toolbar').innerHTML='<button class="gz-btn" type="button" id="generate"></button><button class="gz-btn gz-btn-secondary" type="button" id="example"></button><button class="gz-btn" type="button" id="copy"></button><button class="gz-btn gz-btn-secondary" type="button" id="clear"></button>';
$('#generate').textContent=t('generate');$('#example').textContent=t('example');$('#copy').textContent=t('copy');$('#clear').textContent=t('clear');$('#schema-title-label').textContent=t('schemaTitle');$('#input-label').textContent=t('inputLabel');$('#output-label').textContent=t('outputLabel');
$('#generate').addEventListener('click',renderSchema);$('#example').addEventListener('click',loadExample);$('#copy').addEventListener('click',copySchema);$('#clear').addEventListener('click',clearAll);$('#json-input').addEventListener('input',renderSchema);$('#schema-title').addEventListener('input',renderSchema);
$('#opt-required').addEventListener('change',event=>{options.required=event.target.checked;renderSchema();});$('#opt-enums').addEventListener('change',event=>{options.enums=event.target.checked;renderSchema();});$('#opt-additional').addEventListener('change',event=>{options.additional=event.target.checked;renderSchema();});
renderSchema();
GZ.renderToolPage({category:'dev',titleKey:'toolTitle',descKey:'toolDesc',howToSteps:['step1','step2','step3','step4'],related:[{icon:'braces',href:'/dev/json.html',name:'JSON Formatter'},{icon:'check',href:'/dev/json-validator.html',name:'JSON Validator'},{icon:'file',href:'/dev/json-schema-validator.html',name:'JSON Schema Validator'},{icon:'code',href:'/dev/json-to-typescript.html',name:'JSON to TypeScript'}]});
</script>
