const { $, copyText, t } = GZ;

function normalizeTs(ts) {
  const segs = ts.split(/[:.,]/);
  let hh, mm, ss, ms;
  if (segs.length === 4) { hh = segs[0]; mm = segs[1]; ss = segs[2]; ms = segs[3]; }
  else { hh = '0'; mm = segs[0]; ss = segs[1]; ms = segs[2] || '000'; }
  hh = String(hh).padStart(2, '0');
  mm = String(mm).padStart(2, '0');
  ss = String(ss).padStart(2, '0');
  ms = String(ms).padEnd(3, '0').slice(0, 3);
  return `${hh}:${mm}:${ss},${ms}`;
}

function cleanPayload(line, stripTags) {
  // remove inline YouTube timestamps like <00:00:01.000><00:00:02.500>
  let s = line.replace(/<\d{1,2}:\d{2}:\d{2}\.\d{1,3}>/g, '');
  if (stripTags) {
    // strip <c.xxx>, <c>, </c>, <v Name>, </v>, <ruby>/<rt>/<rp>; keep <b> <i> <u>
    s = s.replace(/<\/?(?:c|v|ruby|rt|rp)(?:\s[^>]*)?>/g, '');
  }
  return s;
}

function vttToSrt(text, stripTags) {
  text = text.replace(/\r/g, '').replace(/^\uFEFF/, '');
  // Remove NOTE / STYLE / REGION blocks
  text = text.replace(/^NOTE\b[\s\S]*?\n\n/gim, '');
  text = text.replace(/^STYLE\b[\s\S]*?\n\n/gim, '');
  text = text.replace(/^REGION\b[\s\S]*?\n\n/gim, '');
  // Drop WEBVTT header line and its metadata (Kind:/Language: etc.)
  text = text.replace(/^WEBVTT[^\n]*\n(?:[A-Za-z][A-Za-z-]*:[^\n]*\n)*/i, '');
  const blocks = text.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  const out = [];
  let count = 0;
  const TS = '\\d{1,2}:\\d{2}:\\d{2}[.,]\\d{1,3}';
  const tsRe = new RegExp('(' + TS + ')\\s*-->\\s*(' + TS + ')(.*)');
  for (const block of blocks) {
    const lines = block.split('\n');
    let tsLineIdx = lines.findIndex(l => l.includes('-->'));
    if (tsLineIdx === -1) continue;
    const m = lines[tsLineIdx].match(tsRe);
    if (!m) continue;
    const payload = lines.slice(tsLineIdx + 1)
      .map(l => cleanPayload(l, stripTags).trim())
      .filter(Boolean).join('\n');
    if (!payload) continue;
    count++;
    out.push(String(count));
    out.push(`${normalizeTs(m[1])} --> ${normalizeTs(m[2])}`);
    out.push(payload);
    out.push('');
  }
  return { text: out.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n', count };
}

function doConvert() {
  const inp = $('#input').value;
  if (!inp.trim()) { $('#status').textContent = ''; $('#output').value = ''; return; }
  try {
    const res = vttToSrt(inp, $('#cleanTags').checked);
    $('#output').value = res.text;
    $('#status').innerHTML = `<span style="color:var(--gz-success)">✓ ${res.count} cue${res.count===1?'':'s'} converted</span>`;
  } catch (e) {
    $('#status').textContent = 'Error: ' + e.message;
  }
}

function doDownload() {
  const text = $('#output').value;
  if (!text.trim()) return;
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'subtitles.srt';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

function doClear() { $('#input').value = ''; $('#output').value = ''; $('#status').textContent = ''; }

$('#input').addEventListener('input', doConvert);
$('#cleanTags').addEventListener('change', doConvert);

$('#toolbar').innerHTML = `
  <button class="gz-btn" onclick="doConvert()">${t('convert')}</button>
  <button class="gz-btn" onclick="copyText($('#output').value)">${t('copy')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="doDownload()">${t('download')}</button>
