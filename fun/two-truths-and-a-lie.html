const BANK = [
 {cat:'work',s:['I once accidentally replied-all to the entire company with a pizza order.','I have never been late to work in ten years.','I got my first job by winning an office board game tournament.'],lie:1},
 {cat:'work',s:['My interview offer letter arrived in a pizza box.','I once fell asleep at my desk and woke up on the company livestream.','I have a filing cabinet full of business cards from people I never met.'],lie:2},
 {cat:'work',s:['I was once voted "most likely to accidentally delete the production database".','My keyboard has a sticky key I have blamed for 47 typos.','I closed my biggest deal while waiting at the airport gate.'],lie:0},
 {cat:'work',s:['I keep a rubber duck on my monitor and explain bugs to it.','I once presented to a client wearing two different shoes.','My printer has jammed more times than I have had performance reviews.'],lie:0},
 {cat:'party',s:['I once won a karaoke contest singing opera in the shower voice.','I can recite the entire alphabet backwards in under two seconds.','I once fell into a pool fully clothed while high-fiving someone.'],lie:1},
 {cat:'party',s:['I have a tattoo I got on a dare at midnight.','I once danced on a table and the table gave way.','I can wiggle both ears at the same time.'],lie:0},
 {cat:'party',s:['I once speed-dated a guy who was also speed-dating two other tables.','I won a pie-eating contest by hiding a second plate in my jacket.','I can sleep through a vacuum cleaner running right next to me.'],lie:1},
 {cat:'party',s:['I once mistook a celebrity at a party and asked for their autograph — they signed a napkin happily.','My party trick is identifying any soda brand blindfolded.','I once snuck into a wedding that was not mine and still got a favor bag.'],lie:0},
 {cat:'classroom',s:['I taught my goldfish to spin in a circle using a treat on a string.','I once raised my hand so many times my teacher made me stop.','I can name every president in order but not in reverse.'],lie:0},
 {cat:'classroom',s:['I failed a quiz because I studied for the wrong chapter and got 98 on it anyway.','I once brought a live chicken to show-and-tell.','My handwriting is so bad my own notes have footnotes.'],lie:0},
 {cat:'classroom',s:['I learned to read before I learned to tie my shoes.','I was disqualified from a spelling bee for spelling my own name wrong.','I still have a bookmark in a book I started in 2014.'],lie:1},
 {cat:'classroom',s:['I once got a standing ovation for a science fair project about mold.','My locker has survived three school-wide pranks without being opened.','I can solve a Rubik\u2019s cube with one hand — slowly.'],lie:1},
 {cat:'dating',s:['On our first date my date paid for dinner with Monopoly money from a hotel.','I once canceled a date because I was stuck rescuing a cat from a tree.','I write a grocery list for relationships like a project plan.'],lie:2},
 {cat:'dating',s:['I accidentally matched with my dentist on an app and said nothing for three dates.','I once planned a romantic picnic and it rained exactly on the blanket and nowhere else.','I keep a spreadsheet rating first dates out of ten.'],lie:0},
 {cat:'dating',s:['I proposed at an airport and missed the flight because everyone cried too hard.','I once went on a date with someone who was also on three other dates that night.','My first kiss was in a costume shop, mannequin included.'],lie:1},
 {cat:'dating',s:['I fell in love with someone over an argument about the best pizza topping.','I once sent a flirty text to my boss instead of my date.','My partner still tells the story of the time I waved back at someone waving at the person behind me.'],lie:1},
 {cat:'funny',s:['I once apologised to a coat rack thinking it was a person.','I can name every Ninja Turtle but forget my own PIN twice a week.','I once waved at a mannequin in a shop window and a security guard saw it.'],lie:1},
 {cat:'funny',s:['My GPS once directed me into a lake and I believed it.','I have laughed so hard milk came out of my nose.','I once pushed a pull door for two full minutes while someone watched.'],lie:2},
 {cat:'funny',s:['I sneezed so hard my sunglasses flew off at a wedding.','I once mistook my own reflection for another shopper and side-eyed myself.','I have been locked out of my own car with the keys in the ignition.'],lie:1},
 {cat:'funny',s:['I told a police officer "you too" after they said "have a nice day" and never recovered.','I can hear the difference between 3 different brands of bottled water — sometimes.','I once high-fived my boss and kept walking as if it were planned.'],lie:1},
 {cat:'travel',s:['I once accidentally joined a tour group in another country and enjoyed the whole bus ride.','My passport has a coffee stain shaped like a continent.','I got lost in Tokyo for six hours using only gestures and survived on ramen.'],lie:1},
 {cat:'travel',s:['I once boarded the wrong train and ended up in a wedding in another city.','I have a stamp collection from every country I have visited — three countries.','I once negotiated a boat ride with zero shared words between us.'],lie:0},
 {cat:'travel',s:['I slept through my exit and woke up three cities away.','My luggage once came back from a different trip, older than mine.','I hiked to a waterfall that turned out to be a sprinkler in fog.'],lie:2},
 {cat:'travel',s:['I once asked a local for directions and they walked me there for 40 minutes.','My carry-on once set off the alarm because of a jar of pickles.','I have been struck by airport automatic doors exactly twice.'],lie:2},
];
const PROMPTS = {
 work:['A job interview moment you still replay','The weirdest thing in your desk drawer','A coworker tradition you secretly started','Your most legendary office typo','A promotion, firing, or raise story','The strangest client request you survived'],
 party:['A talent you only show at parties','A dare you actually completed','A party story with property damage','A contest you won against all odds','A costume that went viral at work','A song that always gets you on the dance floor'],
 classroom:['A school project that went weirdly right','A teacher quote you still use','A talent you learned at a strange age','A test-day disaster','A club or team you joined on a whim','A childhood trophy nobody asks about'],
 dating:['A first-date disaster you now laugh about','A meet-cute that was mostly accident','A romantic gesture that over- or under-shot it','A text you sent to the wrong person','A small habit your partner still teases','An old photo you cannot explain'],
 funny:['An embarrassing public moment','A weirdly specific skill you have','A time you fooled yourself first','A misunderstanding with a stranger','A minor injury you refuse to explain','A pet that is smarter than you admit'],
 travel:['A wrong-turn story with a happy ending','A meal you still describe dramatically','A language fail that became a friendship','A lost item and its reunion','A sight everyone doubts you saw','A local who became a friend mid-trip'],
};
let mode = 'sets', tag = 'all', curSet = null, setOrder = null;
const $ = s => document.querySelector(s);
const t = k => GZI18n.t(k);
const pick = a => a[Math.floor(Math.random()*a.length)];

function filtered(){ return BANK.filter(b => tag==='all'||b.cat===tag); }

function renderModes(){
  $('#modes').innerHTML = `<button class="ttl-mode ${mode==='sets'?'active':''}" onclick="setMode('sets')">${t('modeSets')}</button><button class="ttl-mode ${mode==='prompts'?'active':''}" onclick="setMode('prompts')">${t('modePrompts')}</button>`;
}
function setMode(m){ mode=m; renderModes(); renderTags(); newSet(); }
function renderTags(){
  const keys=['all','work','party','classroom','dating','funny','travel'];
  $('#tags').innerHTML = keys.map(k=>`<span class="ttl-tag ${tag===k?'active':''}" onclick="setTag('${k}')">${t(k)}</span>`).join('');
}
function setTag(k){ tag=k; renderTags(); newSet(); }

function newSet(){
  document.querySelectorAll('.ttl-card').forEach(c=>{c.classList.remove('revealed','is-lie','is-true');c.querySelector('.ttl-card-badge').textContent='';});
  if(mode==='prompts'){
    $('#cards').style.display='none';
    const pool = tag==='all'?Object.values(PROMPTS).flat():PROMPTS[tag];
    const three=[]; while(three.length<3){const p=pick(pool); if(!three.includes(p))three.push(p);}
    $('#prompts').innerHTML = three.map((p,i)=>`<div class="ttl-prompt"><b>${t('promptFor')} ${i+1}:</b> ${p}</div>`).join('');
    $('#prompts').style.display='grid';
  } else {
    $('#prompts').style.display='none';
    curSet = pick(filtered());
    setOrder = [0,1,2].sort(()=>Math.random()-0.5);
    document.querySelectorAll('.ttl-card').forEach((c,j)=>{
      c.querySelector('.ttl-card-txt').textContent = curSet.s[setOrder[j]];
    });
    $('#cards').style.display='grid';
  }
  $('#hint').textContent = mode==='sets' ? t('guessTheLie') : t('hint');
  $('#toolbar').innerHTML = `<button class="gz-btn" onclick="newSet()">${t('nextBtn')}</button>` +
    (mode==='sets' ? `<button class="gz-btn gz-btn-secondary" onclick="shuffleReveal()">${t('shuffleBtn')}</button><button class="gz-btn gz-btn-secondary" onclick="copySet()">${t('copyBtn')}</button>` : '');
}
function reveal(origIdx){
  document.querySelectorAll('.ttl-card').forEach(c=>{
    c.classList.add('revealed');
    const oi = setOrder[+c.dataset.i];
    if(oi===curSet.lie){c.classList.add('is-lie');c.querySelector('.ttl-card-badge').textContent='❌ '+t('lieIs');}
    else{c.classList.add('is-true');c.querySelector('.ttl-card-badge').textContent='✅ '+t('trueIs');}
  });
}
function shuffleReveal(){
  const shuffled=[0,1,2].sort(()=>Math.random()-0.5);
  const texts=document.querySelectorAll('.ttl-card').map(c=>c.querySelector('.ttl-card-txt').textContent);
  const cards=document.querySelectorAll('.ttl-card');
  shuffled.forEach((src,j)=>cards[j].querySelector('.ttl-card-txt').textContent=texts[src]);
  setOrder=shuffled.map(s=>setOrder[s]);
  reveal();
}
document.querySelectorAll('.ttl-card').forEach(c=>c.addEventListener('click',()=>reveal()));
function copySet(){
  const lines=[...document.querySelectorAll('.ttl-card')].map(c=>c.querySelector('.ttl-card-txt').textContent);
  copyText('Two Truths and a Lie:\n1) '+lines[0]+'\n2) '+lines[1]+'\n3) '+lines[2]);
}
renderModes(); renderTags(); newSet();

GZ.renderToolPage({
  category: 'fun',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'🤔', href:'/fun/would-you-rather.html', name:'Would You Rather?'},

    {icon:'❓', href:'/text/random-question-generator.html', name:'Random Question Generator'},

});
</script>
