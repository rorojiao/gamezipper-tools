function renderCheat(filter) {
  const lang = (GZI18n.getLang && GZI18n.getLang()) || 'en';
  const f = (filter || '').toLowerCase().trim();
  let html = '';
  let total = 0;

  for (const sec of SECTIONS) {
    const title = lang === 'zh' ? sec.titleZh : sec.titleEn;
    const filtered = sec.rows.filter(r => {
      if (!f) return true;
      return r[0].toLowerCase().includes(f) || r[1].toLowerCase().includes(f) || r[2].includes(f);
    });
    if (filtered.length === 0) continue;
    total += filtered.length;

    html += `<div class="cheat-section"><h3>${sec.icon} ${title}</h3>`;
    html += `<table class="cheat-table"><thead><tr><th>${t('syntax')}</th><th>${t('description')}</th></tr></thead><tbody>`;
    for (const r of filtered) {
      const desc = lang === 'zh' ? r[2] : r[1];
      html += `<tr><td><code onclick="copyText(this.textContent)" style="cursor:pointer">${r[0]}</code></td><td class="desc">${desc}</td></tr>`;
    }
    html += `</tbody></table></div>`;
  }

  if (total === 0) {
    html = `<p style="text-align:center;color:var(--text2);padding:2rem">No results for "${filter}"</p>`;
  }

  $('#cheat-content').innerHTML = html;
}
