const { $, t, copyText }=GZ;
const EXAMPLE=JSON.stringify({title:'User',type:'object',properties:{id:{type:'integer'},name:{type:'string'},role:{enum:['admin','member']},tags:{type:'array',items:{type:'string'}},address:{$ref:'#/$defs/Address'}},required:['id','name'],$defs:{Address:{type:'object',properties:{city:{type:'string'},zip:{type:'string'}},required:['city']}}},null,2);
function typeName(name){const cleaned=String(name||'Root').replace(/[^A-Za-z0-9_$]+/g,' ').replace(/(?:^|\s)([a-zA-Z])/g,(_,c)=>c.toUpperCase()).replace(/\s/g,'');return /^[A-Za-z_$]/.test(cleaned)?cleaned:'Root';}
function propName(name){return /^[A-Za-z_$][\w$]*$/.test(name)?name:JSON.stringify(name);}
function literal(value){return JSON.stringify(value);}
function schemaToTypeScript(schema){const declarations=[];const seen=new Set();function refName(ref){return typeName(ref.split('/').pop().replace(/~1/g,'/').replace(/~0/g,'~'));}function typeOf(s,hint){if(!s||typeof s!=='object')return'unknown';if(s.$ref)return refName(s.$ref);if(Object.prototype.hasOwnProperty.call(s,'const'))return literal(s.const);if(Array.isArray(s.enum))return s.enum.map(literal).join(' | ')||'never';for(const key of ['oneOf','anyOf'])if(Array.isArray(s[key]))return s[key].map(x=>typeOf(x,hint)).join(' | ');if(Array.isArray(s.allOf))return s.allOf.map(x=>typeOf(x,hint)).join(' & ');const kind=Array.isArray(s.type)?s.type.map(x=>typeOf({...s,type:x},hint)).join(' | '):s.type;if(kind==='object'||s.properties||s.additionalProperties){const name=typeName(s.title||hint);if(hint&&!seen.has(name)){seen.add(name);const req=new Set(s.required||[]),lines=[];for(const [key,value] of Object.entries(s.properties||{}))lines.push('  '+propName(key)+(req.has(key)?'': '?')+': '+typeOf(value,typeName(key))+';');if(s.additionalProperties===true)lines.push('  [key: string]: unknown;');else if(s.additionalProperties&&typeof s.additionalProperties==='object')lines.push('  [key: string]: '+typeOf(s.additionalProperties,'Value')+';');declarations.push('export interface '+name+' {\n'+lines.join('\n')+'\n}');return name;}const fields=Object.entries(s.properties||{}).map(([key,value])=>propName(key)+(new Set(s.required||[]).has(key)?'': '?')+': '+typeOf(value,typeName(key))+';');return '{ '+fields.join(' ')+' }';}if(kind==='array'||s.items){const item=Array.isArray(s.items)?s.items.map(x=>typeOf(x,hint+'Item')).join(', '):typeOf(s.items||{},hint+'Item');return Array.isArray(s.items)?'['+item+']':'('+item+')[]';}return({string:'string',integer:'number',number:'number',boolean:'boolean',null:'null'}[kind]||'unknown');}const defs=schema.$defs||schema.definitions||{};for(const [name,value] of Object.entries(defs))typeOf(value,typeName(name));const root=typeOf(schema,typeName(schema.title||'Root'));if(!declarations.length||root!==typeName(schema.title||'Root'))declarations.unshift('export type '+typeName(schema.title||'Root')+' = '+root+';');return declarations.join('\n\n');}
window.convertJsonSchemaToTypeScript=schemaToTypeScript;
function convert(){const raw=$('#schema').value.trim();if(!raw){$('#status').textContent=t('empty');$('#status').className='jst-status error';return;}try{$('#output').value=schemaToTypeScript(JSON.parse(raw));$('#status').textContent='';$('#status').className='jst-status';}catch(error){$('#status').textContent=t('invalid')+error.message;$('#status').className='jst-status error';}}
