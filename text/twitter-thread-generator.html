const CTAS = [
  'If this was useful:\n\n• Repost the first tweet\n• Follow for more threads like this\n• Reply with your biggest takeaway',
  'Want more threads like this?\n\n🔁 Repost tweet 1\n👤 Follow for daily threads\n💬 Tell me your #1 takeaway below',
  'Found value? Here\'s how to support:\n\n1) Like the first tweet\n2) Repost if someone in your feed would benefit\n3) Follow @handle for more\n\nSee you in the next thread 🧵',
  'Save this thread for later.\n\nRepost if it hit home.\n\nFollow for weekly breakdowns.\n\n👋'
];

function pick(a){return a[Math.floor(Math.random()*a.length)];}
function pickN(arr,n){const c=[...arr];const out=[];while(out.length<n&&c.length){out.push(c.splice(Math.floor(Math.random()*c.length),1)[0]);}return out;}

function expandTopic(s){return s && s.trim() ? s.trim() : 'this journey';}

function buildTweet(idx, total, hook, audience, tone, topic){
  if (idx === 0) return pick(HOOKS[hook]).replace(/\[TOPIC\]/g, expandTopic(topic)).replace(/\[COMMON PRACTICE\]/g, 'checking metrics hourly');
  if (idx === total - 1) return pick(CTAS);
  const lines = BODY_LINES[hook] || BODY_LINES.story;
  const picked = pickN(lines, Math.min(4, lines.length));
  let body = '';
  if (tone === 'list' || hook === 'list') {
    body = `${idx + 1}/${total} ${picked[0]}\n\n${picked[1] ? '• ' + picked[1] + '\n' : ''}${picked[2] ? '• ' + picked[2] + '\n' : ''}${picked[3] ? '• ' + picked[3] : ''}`.trim();
  } else if (tone === 'hype') {
    body = `${picked[0]} 🔥\n\n${picked[1] || ''}\n\n${picked[2] || ''}`.trim();
  } else if (tone === 'dry') {
    body = `${picked[0]}\n\n(${picked[1] || 'Yeah.'})\n\n${picked[2] || ''}`.trim();
  } else {
    body = `${picked[0]}\n\n${picked[1] ? picked[1] + '\n\n' : ''}${picked[2] || ''}`.trim();
  }
  return body;
}

function generate(){
  const topic = $('#topic').value.trim();
  const audience = $('#audience').value;
  const tone = $('#tone').value;
  const total = parseInt($('#length').value);
  const results = $('#results');
  results.innerHTML = '';
  const tweets = [];
  for (let i = 0; i < total; i++){
    tweets.push(buildTweet(i, total, currentHook, audience, tone, topic));
  }
  tweets.forEach((tw, i) => {
    const card = document.createElement('div');
    card.className = 'tt-card' + (tw.length > 280 ? ' over' : '');
    const len = tw.length;
    card.innerHTML = `<div class="tt-head"><span class="tt-num">${i+1}/${total}</span><span class="tt-char ${len>280?'over':''}">${len} / 280</span></div><div class="tt-text"></div><div class="tt-actions"><button class="gz-btn gz-btn-secondary">📋 Copy tweet</button></div>`;
    card.querySelector('.tt-text').textContent = tw;
    card.querySelector('button').onclick = () => copyText(tw);
    results.appendChild(card);
  });
  $('#copyAllBtn').style.display = '';
  $('#copyAllBtn').onclick = () => copyText(tweets.map((t,i)=>`${i+1}/${tweets.length} ${t}`).join('\n\n---\n\n'));
}

$('#toolbar').innerHTML = `
  <button class="gz-btn" onclick="generate()">✨ ${t('generate')||'Generate thread'}</button>
  <button class="gz-btn gz-btn-secondary" onclick="generate()">🔄 Regenerate</button>
