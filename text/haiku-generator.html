function countSyllables(w){w=w.toLowerCase().replace(/[^a-z]/g,'');if(!w)return 0;if(w.length<=3)return 1;w=w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/,'').replace(/^y/,'');const m=w.match(/[aeiouy]{1,2}/g);return m?m.length:1;}
function lineSyl(line){const ws=line.trim().split(/\s+/).filter(Boolean);return ws.reduce((s,w)=>s+countSyllables(w),0);}

function pickBank(theme){const o=['nature','season','love','humor','work','city','ocean','animals'];const p=theme==='any'?o[Math.floor(Math.random()*o.length)]:theme;const b=banks[p];const moods=Object.keys(b).filter(k=>b[k].length);const m=moods[Math.floor(Math.random()*moods.length)];return {p,m,lines:b[m]};}
function pickPair(){return banksLines=>{const lines=banksLines;const a=lines[Math.floor(Math.random()*lines.length)];return a;};}
function join(arr){return Array.isArray(arr)?arr.join('\n'):arr;}
function buildLines(){const theme=$('#hk-theme').value;const mood=$('#hk-mood').value;const form=$('#hk-form').value;const count=+$('#hk-count').value;const title=$('#hk-topic').value.trim();
  let bankPool;if(theme==='any'){const o=['nature','season','love','humor','work','city','ocean','animals'];const p=o[Math.floor(Math.random()*o.length)];bankPool={p,banks:p};}
  else bankPool={p:theme,banks:theme};
  const effMood=banks[bankPool.banks][mood]?mood:'calm';
  let linesPool=banks[bankPool.banks][effMood].slice();if(!linesPool.length){linesPool=banks.nature[effMood].slice();}
  const poems=[];for(let i=0;i<count/3;i++){let pair;for(let attempt=0;attempt<20;attempt++){pair=linesPool[Math.floor(Math.random()*linesPool.length)];const lSyl=pair.map(lineSyl);if(form==='modern'||(lSyl[0]>=4&&lSyl[0]<=6&&lSyl[1]>=6&&lSyl[1]<=8))break;}
  poems.push(pair);}
  let out=poems.map(join).join('\n\n');
  if($('#hk-jp').value==='jp-title'&&title){const seasons={autumn:'秋 aki',spring:'春 haru',summer:'夏 natsu',rain:'雨 ame',snow:'雪 yuki',night:'夜 yoru',moon:'月 tsuki',flower:'花 hana',ocean:'海 umi',love:'恋 koi',sad:'悲 hi',wind:'風 kaze',star:'星 hoshi'};let jp='';for(const k in seasons){if(title.toLowerCase().includes(k)){jp=seasons[k];break;}}if(!jp&&title)jp='題 dai';if(jp)out=jp+'\n\n'+out;}
  return out;
}
function analyze(text){const lines=text.split('\n').filter(l=>l.trim());const syl=lines.map(lineSyl);const target=[5,7,5];const ok=syl.length===3&&target.every((t,i)=>Math.abs(syl[i]-t)<=1)&&$('#hk-form').value==='classic';return{syl,ok};}
function setMeta(text){const a=analyze(text);let h='<strong>Lines:</strong> '+a.syl.join(' / ')+' '+t('syllables');h+=a.ok?' <span class="ok">'+t('valid')+'</span>':' <span class="bad">'+t('invalid')+'</span>';$('#haiku-meta').innerHTML=h;}
function gen(){const text=buildLines();$('#haiku-text').textContent=text;setMeta(text);addToHistory(text);}
