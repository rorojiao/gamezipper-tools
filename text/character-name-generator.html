const GENRES = ['Fantasy', 'Sci-Fi', 'Modern', 'Historical', 'Villain', 'Anime', 'Noir', 'Mythic', 'Steampunk', 'Post-Apocalyptic'];
const GENDERS = ['Random', 'Female', 'Male', 'Non-binary'];
let favs = [];
try { favs = JSON.parse(localStorage.getItem('gz_cng_favs') || '[]'); } catch(e) { favs = []; }

const { $, copyText, t } = GZ;

function pick(arr, n) {
  const c = arr.slice();
  for (let i = c.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [c[i], c[j]] = [c[j], c[i]];
  }
  return c.slice(0, Math.min(n, c.length));
}

function makeName(genre, gender) {
  const firstPool = gender === 'Random'
    ? [...FIRST[genre].Female, ...FIRST[genre].Male, ...FIRST[genre].NB]
    : FIRST[genre][gender];
  const first = pick(firstPool, 1)[0];
  const last = Math.random() < 0.55 ? pick(LAST[genre], 1)[0] : '';
  return last ? `${first} ${last}` : first;
}

function detectGender(genre, name) {
  const first = name.split(' ')[0];
  if (FIRST[genre].Female.includes(first)) return 'Female';
  if (FIRST[genre].Male.includes(first)) return 'Male';
  if (FIRST[genre].NB.includes(first)) return 'Non-binary';
  return 'Random';
}

function generate() {
  const genre = $('#genreSel').value;
  const gender = $('#genderSel').value;
  const count = +$('#countSel').value;
  const out = [];
  const seen = new Set();
  let tries = 0;
  while (out.length < count && tries < count * 8) {
    tries++;
    const n = makeName(genre, gender);
    if (seen.has(n)) continue;
    seen.add(n);
    out.push({ name: n, gender: detectGender(genre, n), genre });
  }
  renderList(out);
  $('#cngSummary').innerHTML = t('summary', out.length, t('flavor')[genre] || genre);
}

function renderList(arr) {
  const wrap = $('#cngOutput');
  if (!arr.length) { wrap.innerHTML = `<p style="padding:14px;color:var(--text2)">${t('noNames')}</p>`; return; }
  wrap.innerHTML = arr.map((n, i) => `
    <div class="cng-row" data-i="${i}">
      <div style="flex:1">
        <div class="name">${escapeHtml(n.name)}</div>
        <div class="meta">${n.gender} · ${n.genre}</div>
      </div>
      <button data-action="copy" data-i="${i}" title="Copy">📋</button>
      <button data-action="fav" data-i="${i}" title="Save">${isFav(n.name) ? '★' : '☆'}</button>
    </div>
  `).join('');
  wrap.dataset.list = JSON.stringify(arr);
  wrap.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      const list = JSON.parse(wrap.dataset.list || '[]');
      const i = +b.dataset.i;
      const target = list[i];
      if (!target) return;
      if (b.dataset.action === 'copy') copyText(target.name);
      if (b.dataset.action === 'fav') {
        if (isFav(target.name)) favs = favs.filter(f => f.name !== target.name);
        else favs.unshift({ ...target, ts: Date.now() });
        try { localStorage.setItem('gz_cng_favs', JSON.stringify(favs.slice(0, 200))); } catch(e) {}
        renderList(list);
      }
    });
  });
}

function isFav(name) { return favs.some(f => f.name === name); }

function copyAll() {
  const list = JSON.parse($('#cngOutput').dataset.list || '[]');
  if (!list.length) return;
  copyText(list.map(n => n.name).join('\n'));
}

function exportList() {
  const list = JSON.parse($('#cngOutput').dataset.list || '[]');
  if (!list.length) return;
  const txt = `# Character Names — ${new Date().toLocaleDateString()}\n\n` + list.map(n => `${n.name}  (${n.genre}, ${n.gender})`).join('\n');
  const blob = new Blob([txt], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'character-names.txt';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function initSelects() {
  $('#genreSel').innerHTML = GENRES.map(g => `<option value="${g}">${g}</option>`).join('');
  $('#genderSel').innerHTML = GENDERS.map(g => `<option value="${g}">${g}</option>`).join('');
  $('#lblGenre').textContent = t('lblGenre');
  $('#lblGender').textContent = t('lblGender');
  $('#lblCount').textContent = t('lblCount');
  $('#generateBtn').textContent = t('generate');
  $('#copyAllBtn').textContent = t('copyAll');
  $('#exportBtn').textContent = t('export');
}

$('#generateBtn').addEventListener('click', generate);
$('#copyAllBtn').addEventListener('click', copyAll);
$('#exportBtn').addEventListener('click', exportList);

initSelects();
generate();
