<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "How does an online vocal remover work?", "acceptedAnswer": {"@type": "Answer", "text": "This tool uses stereo phase cancellation: most songs mix the lead vocal to the center, so the identical part of the left and right channels (the vocals) is subtracted when the two channels are differenced. The remaining instrumental becomes a karaoke track, computed entirely in your browser."}}, {"@type": "Question", "name": "Is it safe to process my music files online?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. Your audio never leaves your device — decoding, vocal removal and WAV encoding all happen locally in your browser via the Web Audio API. There is no upload, no server storage and no signup."}}, {"@type": "Question", "name": "Why can my song still sound a bit like the singer?", "acceptedAnswer": {"@type": "Answer", "text": "Phase cancellation removes sound that is identical and centered in both stereo channels. Backing vocals, reverb on the voice, or recordings mixed off-center (and mono files) survive cancellation. Best results come from stereo songs with a center-panned lead vocal."}}, {"@type": "Question", "name": "What audio formats can I use?", "acceptedAnswer": {"@type": "Answer", "text": "You can load any audio format your browser can decode — typically MP3, WAV, OGG and often M4A/AAC. The karaoke output is exported as uncompressed WAV, which you can play anywhere or trim with an audio editor."}}]}</script>

const { $, t } = GZ;
let srcBuf = null, outBlob = null;

function fmtDur(s){ const m=Math.floor(s/60), r=Math.round(s%60); return `${m}:${String(r).padStart(2,'0')}`; }
function setStatus(msg,color){ $('#status').innerHTML = `<span style="color:${color||'inherit'}">${msg}</span>`; }

function drawWave(canvas, data){
  const w = canvas.width = canvas.clientWidth * (window.devicePixelRatio||1);
  const h = canvas.height = 70 * (window.devicePixelRatio||1);
  const ctx = canvas.getContext('2d'); if(!ctx) return;
  ctx.clearRect(0,0,w,h); ctx.fillStyle = '#e94560';
  const step = Math.max(1, Math.floor(data.length / w));
  for(let x=0;x<w;x++){
    let peak=0; const off=x*step;
    for(let i=0;i<step;i++){ const v=Math.abs(data[off+i]||0); if(v>peak)peak=v; }
    const bar=Math.max(1, peak*h*0.9);
    ctx.fillRect(x, (h-bar)/2, 1, bar);
  }
}

function loadFile(f){
  if(!f) return;
  if(f.size > 40*1024*1024){ setStatus(t('errTooBig'),'var(--gz-accent)'); return; }
  $('#work').hidden = false;
  setStatus(t('statusDecoding'));
  srcBuf = null; outBlob = null; $('#btnDl').hidden = true; $('#player').src='';
  const fr = new FileReader();
  fr.onload = () => {
    const actx = new (window.AudioContext||window.webkitAudioContext)();
    actx.decodeAudioData(fr.result).then(buf => {
      srcBuf = buf;
      $('#srcInfo').textContent = `${t('srcInfo')}: ${f.name} · ${buf.numberOfChannels}ch · ${buf.sampleRate} Hz · ${fmtDur(buf.duration)}`;
      drawWave($('#waveIn'), buf.getChannelData(0));
      setStatus(t('statusReady'),'var(--gz-success)');
      actx.close();
    }).catch(() => { setStatus(t('errDecode'),'var(--gz-accent)'); actx.close(); });
  };
  fr.onerror = () => setStatus(t('errDecode'),'var(--gz-accent)');
  fr.readAsArrayBuffer(f);
}

function removeVocals(){
  if(!srcBuf) return;
  if(srcBuf.numberOfChannels < 2){ setStatus(t('errMono'),'var(--gz-accent)'); return; }
  setStatus(t('statusWorking'));
  setTimeout(() => {
    try {
      const L = srcBuf.getChannelData(0), R = srcBuf.getChannelData(1);
      const n = srcBuf.length;
      const out = srcBuf.getChannelData(0).slice();
      let peak = 0;
      for(let i=0;i<n;i++){ const v = L[i]-R[i]; out[i]=v; const a=v<0?-v:v; if(a>peak)peak=a; }
      const gain = peak > 1 ? 0.95/peak : (peak > 0 ? 1 : 0);
      if(gain !== 1) for(let i=0;i<n;i++) out[i] *= gain;
      drawWave($('#waveOut'), out);
      const wav = encodeWav(out, srcBuf.sampleRate);
      outBlob = new Blob([wav], {type:'audio/wav'});
      const url = URL.createObjectURL(outBlob);
      $('#player').src = url;
      $('#btnDl').href = url;
      $('#btnDl').download = 'karaoke-instrumental.wav';
      $('#btnDl').hidden = false;
      $('#outInfo').textContent = `${t('outInfo')}: WAV · ${(outBlob.size/1048576).toFixed(1)} MB`;
      setStatus(t('statusDone'),'var(--gz-success)');
    } catch(e) { setStatus(String(e && e.message || e),'var(--gz-accent)'); }
  }, 30);
}

function encodeWav(samples, sampleRate){
  const n = samples.length;
  const buf = new ArrayBuffer(44 + n*2);
  const dv = new DataView(buf);
  const ws = (o,s) => { for(let i=0;i<s.length;i++) dv.setUint8(o+i, s.charCodeAt(i)); };
  ws(0,'RIFF'); dv.setUint32(4, 36+n*2, true); ws(8,'WAVE'); ws(12,'fmt ');
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,sampleRate,true); dv.setUint32(28,sampleRate*2,true);
  dv.setUint16(32,2,true); dv.setUint16(34,16,true);
  ws(36,'data'); dv.setUint32(40,n*2,true);
  let o = 44;
  for(let i=0;i<n;i++){ let s=samples[i]; s = s<-1?-1:(s>1?1:s); dv.setInt16(o, s<0?s*0x8000:s*0x7FFF, true); o+=2; }
  return buf;
}

$('#drop').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', e => loadFile(e.target.files[0]));
$('#drop').addEventListener('dragover', e => { e.preventDefault(); $('#drop').classList.add('over'); });
$('#drop').addEventListener('dragleave', () => $('#drop').classList.remove('over'));
$('#drop').addEventListener('drop', e => { e.preventDefault(); $('#drop').classList.remove('over'); loadFile(e.dataTransfer.files[0]); });
$('#btnGo').addEventListener('click', removeVocals);
$('#btnAgain').addEventListener('click', () => $('#file').click());

});
