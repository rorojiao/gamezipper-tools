const $ = s => document.querySelector(s);
const t = k => GZI18n.t(k);
function buf2b64(buf){let s='';const b=new Uint8Array(buf);for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s)}

async function digest(algo, data){
  const buf = await crypto.subtle.digest(algo, data);
  return buf2b64(buf);
}

async function computeAll(data){
  const [s256, s384, s512] = await Promise.all([
    digest('SHA-256', data), digest('SHA-384', data), digest('SHA-512', data)
  ]);
  $('#h256').textContent = 'sha256-' + s256;
  $('#h384').textContent = 'sha384-' + s384;
  $('#h512').textContent = 'sha512-' + s512;
  return {s256, s384, s512};
}

function buildSnippet(h384, src){
  return '<' + 'script src="' + src + '" integrity="sha384-' + h384 + '" crossorigin="anonymous"><' + '/script>';
}

async function fromText(){
  const txt = $('#textInput').value;
  if(!txt){$('#h256').textContent=$('#h384').textContent=$('#h512').textContent='—';$('#snippet').style.display='none';return;}
  const enc = new TextEncoder().encode(txt);
  const r = await computeAll(enc);
  const sn = buildSnippet(r.s384, 'inline.js');
  $('#snippet').textContent = sn;
  $('#snippet').style.display = 'block';
  $('#info').style.display = 'block';
  $('#info').innerHTML = t('info');
}

async function fromFile(file){
  if(!file) return;
  const buf = await file.arrayBuffer();
  const r = await computeAll(buf);
  $('#fileMeta').style.display = 'block';
  $('#fileMeta').innerHTML = `${t('fileMeta')}<strong>${file.name}</strong> · ${t('size')}${file.size.toLocaleString()} bytes`;
  const sn = buildSnippet(r.s384, file.name);
  $('#snippet').textContent = sn;
  $('#snippet').style.display = 'block';
  $('#info').style.display = 'block';
  $('#info').innerHTML = t('info');
}

async function fromUrl(){
  const url = $('#urlInput').value.trim();
  if(!url){$('#h256').textContent=$('#h384').textContent=$('#h512').textContent='—';$('#snippet').style.display='none';$('#urlMeta').textContent='';return;}
  $('#urlMeta').textContent = '⏳ Fetching…';
  try {
    const r = await fetch(url);
    if(!r.ok) throw new Error(r.status);
    const buf = await r.arrayBuffer();
    const h = await computeAll(buf);
    $('#urlMeta').textContent = `${t('urlMeta')}${url} (${buf.byteLength.toLocaleString()} bytes)`;
    const sn = buildSnippet(h.s384, url);
    $('#snippet').textContent = sn;
    $('#snippet').style.display = 'block';
    $('#info').style.display = 'block';
    $('#info').innerHTML = t('info');
  } catch(e){
    $('#urlMeta').textContent = `❌ Fetch failed (${e.message}). CORS may block reading the response. Try uploading the file directly.`;
  }
}

function activateTab(name){
  document.querySelectorAll('.sri-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.sri-pane').forEach(p => p.classList.toggle('active', p.id === 'pane' + name[0].toUpperCase() + name.slice(1)));
  $('#h256').textContent = $('#h384').textContent = $('#h512').textContent = '—';
  $('#snippet').style.display = 'none';
  $('#info').style.display = 'none';
  $('#fileMeta').style.display = 'none';
  $('#urlMeta').textContent = '';
}

document.querySelectorAll('.sri-tab').forEach(b => b.addEventListener('click', () => activateTab(b.dataset.tab)));
$('#tabFile').textContent = t('tabFile');
$('#tabText').textContent = t('tabText');
$('#tabUrl').textContent = t('tabUrl');
$('#dropText').textContent = t('dropText');
$('#dropHint').textContent = t('dropHint');
$('#textInput').placeholder = t('phText');
$('#urlInput').placeholder = t('phUrl');
document.querySelectorAll('.sri-copy').forEach(b => {
  b.textContent = t('copy');
  b.addEventListener('click', () => {
    const v = $('#' + b.dataset.copy).textContent;
    navigator.clipboard.writeText(v).then(() => {
      b.textContent = t('copied');
      setTimeout(() => b.textContent = t('copy'), 1200);
    });
  });
});

const drop = $('#drop');
const fileInput = $('#file');
drop.addEventListener('click', () => fileInput.click());
['dragenter','dragover'].forEach(e => drop.addEventListener(e, ev => {ev.preventDefault();drop.classList.add('dragover');}));
['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => {ev.preventDefault();drop.classList.remove('dragover');}));
drop.addEventListener('drop', ev => {ev.preventDefault();fromFile(ev.dataTransfer.files[0]);});
fileInput.addEventListener('change', ev => fromFile(ev.target.files[0]));
$('#textInput').addEventListener('input', fromText);
$('#urlInput').addEventListener('change', fromUrl);
$('#urlInput').addEventListener('blur', fromUrl);
