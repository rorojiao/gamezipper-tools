GZI18n.register({
  en: {

  },
  zh: {

    toolDesc: '免费在线论文大纲生成器,支持议论文、对比分析、因果、叙事和分析型论文。选择类型,填写论点和要点,导出干净的 Markdown 大纲。',
    cat_argument: '⚔️ 议论文',
    cat_compare: '⚖️ 对比分析',
    cat_cause: '🔗 因果分析',
    cat_narrative: '📖 叙事',
    cat_analytical: '🔬 分析',
    lblTopic: '📌 论文主题',
    lblThesis: '💡 中心论点(可选)',
    lblBody: '📝 主要要点(每行一个,可选)',
    lblAudience: '👥 受众/水平(可选)',
    btnGenerate: '✨ 生成大纲',
    btnCopy: '📋 复制',
    btnDownload: '⬇️ 下载',
    btnClear: '🗑️ 清空',
    step1: '选择与目标匹配的论文类型',
    step2: '填写主题、论点和关键要点',
    step3: '点击生成大纲按钮生成结构化 Markdown 大纲',
    step4: '复制或下载结果用于写作',
  }
});

const { $, t, showToast } = GZ;

const TYPES = ['argument','compare','cause','narrative','analytical'];
let currentType = 'argument';

const TEMPLATES = {
  argument: {
    intro: [
      "**Hook:** Open with a striking fact, question or short anecdote related to {topic}.",
      "**Context:** Briefly explain why {topic} matters now and what debate surrounds it.",
      "**Thesis:** State your clear position — {thesis}",
    ],
    body: [
      "**Argument 1:** State your strongest reason supporting the thesis.",
      "  - Provide evidence (data, expert quote, real example).",
      "  - Acknowledge and refute the most common counter-argument.",
      "**Argument 2:** Present your second strongest point.",
      "  - Use a different kind of evidence (case study, statistic, comparison).",
      "  - Explain how this reason reinforces your thesis.",
      "**Argument 3 (optional):** Address a nuanced or lesser-known angle.",
      "  - Show depth and avoid simple repetition of points 1 and 2.",
    ],
    conclusion: [
      "**Restate thesis** in fresh language (do not copy-paste from intro).",
      "**Synthesize** how the three arguments together prove your point.",
      "**Call to action** or broader implication — what should readers think or do next?",
    ],
  },
  compare: {
    intro: [
      "**Hook:** A surprising similarity or difference between A and B related to {topic}.",
      "**Subjects:** Introduce the two (or more) things you are comparing.",
      "**Thesis:** State what you will compare and what conclusion you reach about {topic}.",
    ],
    body: [
      "**Point 1:** Compare A and B on the first dimension (e.g. structure, origin, effect).",
      "  - Detail A's position, then B's position, then the key difference or similarity.",
      "**Point 2:** Compare on a second dimension (e.g. audience, cost, long-term impact).",
      "  - Use parallel structure so the comparison is easy to follow.",
      "**Point 3:** Compare on a third dimension — choose the most revealing angle.",
      "  - Highlight which subject comes out ahead on this specific dimension.",
    ],
    conclusion: [
      "**Summarize** the most important similarities and differences.",
      "**State which subject is stronger overall** and why.",
      "**So what?** Explain the broader meaning for {topic}.",
    ],
  },
  cause: {
    intro: [
      "**Hook:** Open with the effect — the visible outcome of {topic}.",
      "**Background:** Give the reader enough context to understand the chain of events.",
      "**Thesis:** Identify the main cause(s) you will analyze or argue caused {topic}.",
    ],
    body: [
      "**Cause 1 (Primary):** Explain the most important cause in detail.",
      "  - Show the mechanism: how does this cause actually produce the effect?",
      "  - Use evidence (data, research, historical example).",
      "**Cause 2 (Contributing):** Explain a secondary cause that amplifies the effect.",
      "  - Show how Cause 1 and Cause 2 interact.",
      "**Cause 3 (Root):** If relevant, trace back to a deeper systemic or historical cause.",
      "  - Avoid simple blame — explain the system that produces the outcome.",
    ],
    conclusion: [
      "**Recap** the chain of causes you have traced.",
      "**Identify the leverage point** — which cause, if addressed, would change the outcome most?",
      "**Suggest a path forward** — policy, behavior change or further research.",
    ],
  },
  narrative: {
    intro: [
      "**Hook:** Start in the middle of the action — a vivid moment that captures {topic}.",
      "**Setting:** Establish time, place and the emotional tone.",
      "**Thesis (implicit or explicit):** State the insight or lesson your story will reveal.",
    ],
    body: [
      "**Rising Action:** Build tension by introducing a conflict, challenge or turning point.",
      "  - Use sensory details (sight, sound, smell) to bring the moment alive.",
      "  - Show internal thoughts alongside external events.",
      "**Climax:** Describe the peak moment — what changed?",
      "  - Slow down the pacing here for maximum impact.",
      "**Falling Action:** Show what happened immediately after the climax.",
      "  - Tie loose threads and reveal the immediate consequences.",
    ],
    conclusion: [
      "**Reflection:** Step back and explain what the experience taught you.",
      "**Connection:** Tie the personal story back to a broader truth about {topic}.",
      "**Closing image:** End with a vivid final line that echoes the opening hook.",
    ],
  },
  analytical: {
    intro: [
      "**Hook:** A surprising fact or observation about {topic}.",
      "**Context:** Introduce the work, idea or phenomenon you will analyze.",
      "**Thesis:** State your analytical claim — what is {topic} really about or doing?",
    ],
    body: [
      "**Section 1 — Element A:** Analyze the first key element or feature.",
      "  - Quote or paraphrase the source material.",
      "  - Explain how this element supports your thesis.",
      "**Section 2 — Element B:** Analyze the second element or feature.",
      "  - Show how Element A and Element B work together.",
      "**Section 3 — Element C (or pattern):** Analyze a third element or an emerging pattern.",
      "  - Connect the dots across all three elements.",
    ],
    conclusion: [
      "**Restate your thesis** in stronger, more precise language.",
      "**Synthesize** what the analysis reveals about {topic}.",
      "**Open question:** End with a thought-provoking question or implication.",
    ],
  },
};

function escapeMD(s) { return (s || '').replace(/[\\`*_{}\[\]()#+\-.!]/g, m => '\\' + m); }

function buildOutline() {
  const topic = ($('#topicInput').value || '').trim() || '[Your Topic]';
  const thesis = ($('#thesisInput').value || '').trim() || '[Your Thesis Statement]';
  const bodyRaw = ($('#bodyInput').value || '').trim();
  const audience = ($('#audienceInput').value || '').trim();
  const tpl = TEMPLATES[currentType];

  let md = `# Essay Outline: ${topic}\n\n`;
  if (audience) md += `> **Audience / Level:** ${audience}\n> **Essay Type:** ${currentType.charAt(0).toUpperCase() + currentType.slice(1)}\n\n`;
  else md += `> **Essay Type:** ${currentType.charAt(0).toUpperCase() + currentType.slice(1)}\n\n`;

  md += `## I. Introduction\n\n`;
  tpl.intro.forEach(line => md += `- ${line.replace(/{topic}/g, escapeMD(topic)).replace(/{thesis}/g, escapeMD(thesis))}\n`);
  md += `\n`;

  md += `## II. Body Paragraphs\n\n`;
  let bodyPoints = [];
  if (bodyRaw) {
    bodyPoints = bodyRaw.split('\n').map(s => s.trim()).filter(Boolean);
  }
  if (bodyPoints.length) {
    bodyPoints.forEach((bp, i) => {
      md += `### Point ${i + 1}: ${escapeMD(bp)}\n`;
      md += `- Claim: ${escapeMD(bp)}\n`;
      md += `- Evidence: [Statistic, quote, example or source — fill in]\n`;
      md += `- Analysis: Explain how this evidence supports the thesis.\n`;
      md += `- Transition to next point.\n\n`;
    });
  } else {
    tpl.body.forEach(line => md += `- ${line}\n`);
    md += `\n`;
  }

  md += `## III. Conclusion\n\n`;
  tpl.conclusion.forEach(line => md += `- ${line.replace(/{topic}/g, escapeMD(topic)).replace(/{thesis}/g, escapeMD(thesis))}\n`);
  md += `\n---\n*Generated by GameZipper Tools — customize every section before writing your draft.*\n`;

  return md;
}

function generateOutline() {
  const out = buildOutline();
  const box = $('#output');
  box.textContent = out;
  box.style.display = 'block';
  try { localStorage.setItem('gz_eo_last', JSON.stringify({ topic: $('#topicInput').value, thesis: $('#thesisInput').value, body: $('#bodyInput').value, audience: $('#audienceInput').value, type: currentType, ts: Date.now() })); } catch(e){}
}

function copyOutline() {
  if (!$('#output').textContent) { generateOutline(); }
  GZ.copyText($('#output').textContent);
  showToast(t('btnCopy') + ' ✓');
}

function downloadOutline() {
  if (!$('#output').textContent) { generateOutline(); }
  const blob = new Blob([$('#output').textContent], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const topic = ($('#topicInput').value || 'essay').replace(/[^a-z0-9]+/gi, '-').toLowerCase();
  a.download = `essay-outline-${topic}.md`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function clearAll() {
  if (!confirm('Clear all fields and the generated outline?')) return;
  $('#topicInput').value = '';
  $('#thesisInput').value = '';
  $('#bodyInput').value = '';
  $('#audienceInput').value = '';
  $('#output').style.display = 'none';
  $('#output').textContent = '';
}

const catBox = $('#catBtns');
TYPES.forEach(c => {
  const btn = document.createElement('button');
  btn.textContent = t('cat_' + c);
  if (c === currentType) btn.classList.add('active');
  btn.onclick = () => {
    currentType = c;
    catBox.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  };
  catBox.appendChild(btn);
});

$('#lblTopic').textContent = t('lblTopic');
$('#lblThesis').textContent = t('lblThesis');
$('#lblBody').textContent = t('lblBody');
$('#lblAudience').textContent = t('lblAudience');
$('#btnGenerate').textContent = t('btnGenerate');
$('#btnCopy').textContent = t('btnCopy');
$('#btnDownload').textContent = t('btnDownload');
$('#btnClear').textContent = t('btnClear');

// Restore last session
try {
  const last = JSON.parse(localStorage.getItem('gz_eo_last') || '{}');
  if (last.topic) $('#topicInput').value = last.topic;
  if (last.thesis) $('#thesisInput').value = last.thesis;
  if (last.body) $('#bodyInput').value = last.body;
  if (last.audience) $('#audienceInput').value = last.audience;
  if (last.type && TYPES.includes(last.type)) {
    currentType = last.type;
    catBox.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', b.textContent === t('cat_' + last.type));
    });
  }
} catch(e){}

GZ.renderToolPage({
  category: 'text',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'📝', href:'/text/essay-counter.html', name:'Essay Counter'},
    {icon:'📊', href:'/text/readability-grader.html', name:'Readability Grader'},
    {icon:'✍️', href:'/text/essay-outline-generator.html', name:'Essay Outline'},
    {icon:'📖', href:'/text/reading-speed-test.html', name:'Reading Speed Test'},
  ]
});
</script>
