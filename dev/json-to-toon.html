const { $, copyText, t } = GZ;

function escapeTOONString(s) {
  if (s === null || s === undefined) return 'null';
  if (typeof s === 'number') return Number.isFinite(s) ? String(s) : 'null';
  if (typeof s === 'boolean') return s ? 'true' : 'false';
  if (typeof s !== 'string') return String(s);
  // unquoted-safe: simple alnum/_/-/. only
  if (/^[A-Za-z0-9_\-\.]+$/.test(s) && !['true','false','null'].includes(s)) return s;
  // escape
  return '"' + s.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n').replace(/\r/g, '\\r').replace(/\t/g, '\\t') + '"';
}

function getKeys(arr) {
  const keySet = new Set();
  for (const item of arr) {
    if (item && typeof item === 'object' && !Array.isArray(item)) {
      Object.keys(item).forEach(k => keySet.add(k));
    }
  }
  return Array.from(keySet);
}

function isUniformObjects(arr) {
  if (arr.length === 0) return false;
  for (const item of arr) {
    if (!item || typeof item !== 'object' || Array.isArray(item)) return false;
  }
  return true;
}

function allPrimitivesOrNull(v) {
  if (v === null || v === undefined) return true;
  if (typeof v === 'string' || typeof v === 'number' || typeof v === 'boolean') return true;
  return false;
}

function jsonToTOON(value, indent, delim, useTabular, depth = 0, keyName = null) {
  const pad = ' '.repeat(indent * depth);
  const innerPad = ' '.repeat(indent * (depth + 1));

  if (value === null) return 'null';
  if (typeof value === 'boolean') return value ? 'true' : 'false';
  if (typeof value === 'number') return Number.isFinite(value) ? String(value) : 'null';
  if (typeof value === 'string') return escapeTOONString(value);

  if (Array.isArray(value)) {
    if (value.length === 0) return keyName ? '[0]:' : '[]';

    // Primitive array: inline
    if (value.every(allPrimitivesOrNull)) {
      const items = value.map(v => {
        if (v === null) return 'null';
        if (typeof v === 'string') return escapeTOONString(v);
        return String(v);
      });
      const header = keyName ? `[${value.length}${delim ? delim : ''}]: ` : '';
      return `${pad}${header}${items.join(delim + ' ')}`;
    }

    // Tabular: array of uniform objects with primitive values
    if (useTabular && isUniformObjects(value)) {
      const keys = getKeys(value);
      const allPrimitive = keys.every(k => value.every(it => allPrimitivesOrNull(it[k])));
      if (allPrimitive && keys.length > 0) {
        const header = keyName ? `${keyName}[${value.length}]{${keys.join(',')}}:\n` : `[${value.length}]{${keys.join(',')}}:\n`;
        const rows = value.map(item => {
          const cells = keys.map(k => {
            const v = item[k];
            if (v === null) return 'null';
            if (typeof v === 'string') return escapeTOONString(v);
            return String(v);
          });
          return `${innerPad}${cells.join(delim)}`;
        });
        return pad + header + rows.join('\n');
      }
    }

    // Generic array: list form
    const header = keyName ? `[${value.length}]:\n` : '' + (keyName ? '' : '');
    const items = value.map((item, i) => {
      if (typeof item !== 'object' || item === null) {
        return `${innerPad}- ${escapeTOONString(item)}`;
      }
      // nested object in array → use index as key for clarity
      return jsonToTOON(item, indent, delim, useTabular, depth + 1, null).split('\n').map((line, idx) => idx === 0 ? `${innerPad}- ${line}` : `${' '.repeat(indent * depth + 2)}${line}`).join('\n');
    });
    return pad + header + items.join('\n');
  }

  if (typeof value === 'object') {
    const keys = Object.keys(value);
    if (keys.length === 0) return '{}';

    const lines = [];
    for (const k of keys) {
      const v = value[k];
      if (v === null) {
        lines.push(`${innerPad}${k}: null`);
      } else if (typeof v === 'boolean' || typeof v === 'number') {
        lines.push(`${innerPad}${k}: ${v}`);
      } else if (typeof v === 'string') {
        lines.push(`${innerPad}${k}: ${escapeTOONString(v)}`);
      } else if (Array.isArray(v)) {
        if (v.length === 0) {
          lines.push(`${innerPad}${k}[0]:`);
        } else {
          const out = jsonToTOON(v, indent, delim, useTabular, depth + 1, k);
          lines.push(out);
        }
      } else if (typeof v === 'object') {
        const innerKeys = Object.keys(v);
        if (innerKeys.length === 0) {
          lines.push(`${innerPad}${k}: {}`);
        } else {
          lines.push(`${innerPad}${k}:`);
          lines.push(jsonToTOON(v, indent, delim, useTabular, depth + 1));
        }
      }
    }
    return pad + lines.join('\n');
  }

  return String(value);
}

function doFormat() {
  const raw = $('#input').value.trim();
  if (!raw) {
    $('#output').value = '';
    $('#status').className = 'jt-status';
    $('#status').textContent = '';
    updateStats('', '');
    return;
  }
  try {
    const obj = JSON.parse(raw);
    const indent = Math.max(1, Math.min(8, parseInt($('#indent').value) || 2));
    const delim = $('#delimiter').value;
    const useTabular = $('#useTabular').checked;
    const toon = jsonToTOON(obj, indent, delim, useTabular, 0).trim();
    $('#output').value = toon;
    $('#status').className = 'jt-status ok';
    $('#status').textContent = t('ok');
    updateStats(raw, toon);
  } catch (e) {
    $('#status').className = 'jt-status err';
    $('#status').textContent = t('err') + e.message;
    updateStats(raw, '');
  }
}

function updateStats(jsonStr, toonStr) {
  const jLen = jsonStr.length;
  const tLen = toonStr.length;
  $('#s-json').textContent = jLen.toLocaleString();
  $('#s-toon').textContent = tLen.toLocaleString();
  if (jLen > 0 && tLen > 0) {
    const pct = Math.round(((jLen - tLen) / jLen) * 100);
    $('#s-pct').textContent = (pct >= 0 ? '+' : '') + pct + '%';
    // Rough token estimate: ~4 chars per token for English-like text
    $('#s-tokens').textContent = '~' + Math.ceil(tLen / 4).toLocaleString();
  } else {
    $('#s-pct').textContent = '0%';
    $('#s-tokens').textContent = '0';
  }
}

function loadExample() {
  $('#input').value = JSON.stringify({

    "config": {"theme": "dark", "lang": "en"},
    "active": true

  doFormat();
}

function doClear() {
  $('#input').value = '';
  $('#output').value = '';
  $('#status').textContent = '';
  $('#status').className = 'jt-status';
  updateStats('', '');
}

$('#input').addEventListener('input', doFormat);

['useTabular', 'delimiter', 'indent'].forEach(id => {
