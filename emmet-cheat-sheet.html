let currentSection = 'all';
let searchQuery = '';

function renderTabs() {
  document.getElementById('tabs').innerHTML = SECTIONS.map(s =>
    `<button class="${s.id === currentSection ? 'active' : ''}" onclick="setSection('${s.id}')">${s.label}</button>`
  ).join('');
}

function setSection(id) {
  currentSection = id;
  renderTabs();
  renderCards();
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderCards() {
  const filtered = ABBR.filter(p => {
    const secOk = currentSection === 'all' || p.sec === currentSection;
    const q = searchQuery.toLowerCase();
    const qOk = !q || p.abbr.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q) || (p.alias && p.alias.toLowerCase().includes(q));
    return secOk && qOk;
  });
  if (filtered.length === 0) {
    document.getElementById('card-list').innerHTML = '<p style="text-align:center;color:var(--text2);padding:40px">No abbreviations found</p>';
    return;
  }
  document.getElementById('card-list').innerHTML = filtered.map((p, i) => {
    const escaped = escapeHtml(p.ex);
    return `<div class="prop-card">
      <div class="prop-name">${p.abbr}<span class="tag ${p.sec}">${p.sec}</span></div>
      <div class="prop-desc">${p.desc}</div>
      <div class="prop-example"><button class="copy-btn" onclick="copyExample(this, ${i})">Copy</button><code>${escaped}</code></div>
      ${p.alias ? `<span class="alias">alias: ${p.alias}</span>` : ''}
    </div>`;
  }).join('');
  window._abbrData = filtered;
}

function copyExample(btn, i) {
  const ex = window._abbrData[i].ex;
  navigator.clipboard.writeText(ex).then(() => {
    btn.textContent = '✓';
    setTimeout(() => btn.textContent = 'Copy', 1500);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = ex; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); btn.textContent = '✓'; setTimeout(() => btn.textContent = 'Copy', 1500); } catch(e) {}
    document.body.removeChild(ta);
  });
}

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderCards();
});
document.getElementById('search').placeholder = t('search');

renderTabs();

<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is Emmet?","acceptedAnswer":{"@type":"Answer","text":"Emmet is a set of abbreviations and shortcuts that expand into full HTML or CSS code. It's built into most modern code editors including VS Code, Sublime Text, WebStorm, Atom and many others. Type an abbreviation like ul>li*3 and press Tab to expand it into a complete unordered list with three list items."}},{"@type":"Question","name":"How do I enable Emmet in VS Code?","acceptedAnswer":{"@type":"Answer","text":"Emmet is built into VS Code by default. Just open any HTML or CSS file, type an abbreviation like ! or html:5 and press Tab or Tab+Enter to expand. You can customize Emmet settings in File > Preferences > Settings, then expand 'Emmet' to edit snippets and trigger keys."}},{"@type":"Question","name":"What is the difference between >, + and ^ in Emmet?","acceptedAnswer":{"@type":"Answer","text":"> is the child operator (descendant). + is the sibling operator (same nesting level). ^ is the climb-up operator that exits the current parent element by one level. For example, div>p+span produces div with p child and span sibling, while div>p^span produces div containing p with span as the div's sibling."}},{"@type":"Question","name":"Can Emmet generate lorem ipsum?","acceptedAnswer":{"@type":"Answer","text":"Yes! Type lorem in any editor with Emmet and press Tab to get a paragraph of placeholder text. Add a number to control word count: lorem5 for 5 words, lorem10 for 10 words, lorem20 for 20 words, and so on."}}]}</script>
