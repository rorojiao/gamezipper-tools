<body>
<div class="gz-container">
  <div class="gz-tool-header">
    <h1 id="title"></h1>
    <p class="desc" id="desc"></p>
  </div>
  <div class="gz-tool-area">
    <div class="kw-row">
      <input id="keyword" type="text" placeholder="">
      <select id="mood">
        <option value="all">全部心情</option>
        <option value="chill">慵懒</option>
        <option value="workout">燃脂</option>
        <option value="focus">专注</option>
        <option value="party">派对</option>
        <option value="sad">忧伤</option>
        <option value="study">学习</option>
        <option value="road">公路</option>
        <option value="romance">浪漫</option>
      </select>
      <button class="gz-btn" id="gen-btn"></button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="names" id="output"></div>
  </div>
  <div class="gz-howto"><h2></h2><ol></ol></div>
  <div class="gz-related"><h2></h2><div class="gz-related-grid"></div></div>
</div>
<script>
GZI18n.register({
  en: {
    toolTitle: 'Spotify Playlist Name Generator',
    toolDesc: 'Generate creative Spotify playlist names from any mood or keyword. 200+ templates across 8 moods — free, private, no signup.',
    ph: 'Optional keyword (e.g. rain, synth, 90s, summer)',
    generate: 'Generate Names',
    step1: 'Pick a mood or leave it on All Moods',
    step2: 'Optionally add a keyword like rain, synth, 90s',
    step3: 'Click Generate Names for 16 fresh playlist names',
    step4: 'Click any name to copy it to clipboard',
    enterKw: 'Pick a mood first.',
    mood: 'mood',
    copied: 'Copied!',
  },
  zh: {
    toolTitle: 'Spotify 歌单名称生成器',
    toolDesc: '从任意心情或关键词生成富有创意的 Spotify 歌单名称。8 种心情 × 200+ 模板 — 免费、私密、无需注册。',
    ph: '可选关键词（如雨夜、合成器、90 年代、夏天）',
    generate: '生成名称',
    step1: '选择心情或保持「全部心情」',
    step2: '可选输入关键词，如雨夜、合成器、90 年代',
    step3: '点击「生成名称」获取 16 个新鲜歌单名',
    step4: '点击任意名称即可复制',
    enterKw: '请先选择心情。',
    mood: '心情',
    copied: '已复制！',
  }
});

const { $, copyText, t, showToast } = GZ;

const MOODS = {
  chill: { en: 'chill', zh: '慵懒' },
  workout: { en: 'workout', zh: '燃脂' },
  focus: { en: 'focus', zh: '专注' },
  party: { en: 'party', zh: '派对' },
  sad: { en: 'sad', zh: '忧伤' },
  study: { en: 'study', zh: '学习' },
  road: { en: 'road trip', zh: '公路' },
  romance: { en: 'romance', zh: '浪漫' },
};

const T = {
  chill: ['{x} & chill', 'late night {x}', 'soft {x} hours', 'rainy {x}', 'lazy {x} sunday', 'low-key {x}', 'pillow talk {x}', 'easy like {x}', '{x} for quiet minds', 'after hours {x}', 'mellow {x}', 'velvet {x}', 'slow {x}', '{x} on repeat', 'cozy {x}', 'sunday morning {x}'],
  workout: ['{x} pump', 'beast mode {x}', '{x} beast', 'no excuses {x}', 'cardio {x}', 'lift & {x}', 'sweat {x}', 'iron {x}', 'push through {x}', '{x} grind', 'heart rate {x}', 'run faster {x}', 'beast {x}', '{x} mode: ON', 'pumped up {x}', 'no rest {x}'],
  focus: ['{x} flow', 'deep {x}', '{x} zone', 'concentrate {x}', 'head down {x}', 'brain on {x}', '{x} in progress', 'hush, {x}', 'tunnel vision {x}', '{x} state', 'one thing: {x}', 'undistracted {x}', '{x} only', 'no phones {x}', 'laser {x}', 'focus: {x}'],
  party: ['{x} after dark', 'turn up {x}', '{x} gone wild', 'fever {x}', 'last call {x}', '{x} heat', 'all night {x}', '{x} overload', 'hot {x}', 'midnight {x}', '{x} confetti', 'boots & {x}', 'shots & {x}', 'floor burn {x}', 'rave {x}', 'dance floor {x}'],
  sad: ['{x} rain', 'tears & {x}', 'lonely {x}', '{x} at 3am', 'broken {x}', 'echoes of {x}', '{x} melancholy', 'quiet {x}', 'still {x}', 'drowning in {x}', 'blue {x}', 'hollow {x}', 'aching {x}', 'midnight {x}', 'goodbye {x}', 'softly {x}'],
  study: ['{x} & textbooks', 'study {x}', 'exam week {x}', '{x} notes', 'library {x}', 'finals {x}', 'study hall {x}', '{x} brain', 'cramming {x}', 'pencils down {x}', '{x} focus', 'open book {x}', 'highlight reel {x}', '{x} & coffee', 'textbook {x}', 'studying to {x}'],
  road: ['{x} highway', 'windows down {x}', 'open road {x}', '{x} miles', 'route 66 {x}', '{x} coast to coast', 'long drive {x}', 'cruise {x}', 'tank full {x}', '{x} wander', 'wheels up {x}', 'horizon {x}', '{x} ride', 'no map {x}', 'freedom {x}', 'mile after {x}'],
  romance: ['{x} & roses', 'first kiss {x}', 'just us {x}', '{x} in paris', 'moonlight {x}', 'love song {x}', 'forever {x}', 'crush on {x}', '{x} together', 'falling for {x}', 'summer {x}', 'date night {x}', 'heartbeats {x}', '{x} for two', 'kiss me {x}', 'slow dance {x}'],
};

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

let currentMood = 'all';

function applyChip() {
  $$('.chip').forEach(c => c.classList.toggle('active', c.dataset.m === currentMood));
}

function setMood(m) {
  currentMood = m;
  $('#mood').value = m;
  applyChip();
}

function generate() {
  const raw = $('#keyword').value.trim().toLowerCase() || 'vibes';
  const x = raw.replace(/[^a-z0-9一-鿿]/gi, '').slice(0, 16) || 'vibes';
  let moods = currentMood === 'all' ? Object.keys(T) : [currentMood];
  const out = [];
  for (let i = 0; i < 16; i++) {
    const m = pick(moods);
    const tpl = pick(T[m]);
    const name = tpl.replace(/{x}/g, x).replace(/&/g, '&');
    out.push({ name, mood: m });
  }
  const lang = (GZ.getLang && GZ.getLang()) || 'en';
  $('#output').innerHTML = out.map((o, i) =>
    `<div class="name" data-name="${o.name.replace(/"/g,'"')}">
      <div><div class="txt">${o.name}</div><span class="mood">${t('mood')}: ${MOODS[o.mood][lang]}</span></div>
      <button class="gz-btn gz-btn-secondary" onclick="copyName(this)">${t('copy') || 'Copy'}</button>
    </div>`
  ).join('');
}

function copyName(btn) {
  const name = btn.closest('.name').dataset.name;
  copyText(name);
  showToast(t('copied'));
}

const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const chipEl = $('#chips');
chipEl.innerHTML = `<span class="chip ${currentMood==='all'?'active':''}" data-m="all">✨ 全部</span>` +
  Object.entries(MOODS).map(([k, v]) => `<span class="chip" data-m="${k}">${v.zh}</span>`).join('');
chipEl.addEventListener('click', e => { if (e.target.classList.contains('chip')) setMood(e.target.dataset.m); });

$('#mood').addEventListener('change', e => setMood(e.target.value));
$('#gen-btn').textContent = t('generate');
$('#gen-btn').onclick = generate;
$('#keyword').placeholder = t('ph');
$('#keyword').addEventListener('keydown', e => { if (e.key === 'Enter') generate(); });

GZ.renderToolPage({
  category: 'text',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'✨', href:'/zh/text/slogan-generator.html', name:'标语生成器'},
    {icon:'🎵', href:'/zh/social/instagram-bio.html', name:'Instagram 简介'},
    {icon:'📝', href:'/zh/text/business-name-generator.html', name:'公司名生成'},
    {icon:'🐦', href:'/zh/social/twitter-bio.html', name:'Twitter 简介'},
  ]
});
</script>
<script src="/tools-result-rec.js?v=R449-flat" defer></script>
</body>
