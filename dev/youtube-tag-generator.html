  zh: {

    toolDesc: '为 YouTube 视频和 Shorts 生成 SEO 优化标签和话题标签。提升发现度,免费、浏览器本地运行。',
    topicLbl: '视频主题',
    catLbl: '分类',
    typeLbl: '类型',
    generate: '⚡ 生成标签',
    addMore: '➕ 追加标签',
    copyAll: '📋 一行复制',
    copyComma: '📋 逗号复制',
    clearAll: '🗑️ 清空',
    counter: '<b></b> 个标签 · <b></b> 字符',
    empty: '点击「生成标签」开始',
    step1: '输入你的视频主题或关键词',
    step2: '选择分类和视频类型 (视频/Shorts/两者)',
    step3: '点击生成标签,获取 SEO 优化的标签列表',
    step4: '复制标签并粘贴到 YouTube Studio 视频元数据中',
  }
});

const { $, copyText, t } = GZ;

const CAT_TAGS = {
  general: ['tutorial', 'how to', 'guide', 'tips', '2026', 'best', 'top 10', 'review', 'explained', 'for beginners'],
  gaming: ['gaming', 'gameplay', 'walkthrough', 'playthrough', 'speedrun', 'live', 'ps5', 'xbox', 'pc gaming', 'esports', 'streamer', 'multiplayer', 'open world', 'rpg', 'fps', 'indie game'],
  tech: ['tech', 'technology', 'review', 'unboxing', 'gadgets', 'ai', 'laptop', 'smartphone', 'pc build', 'programming', 'coding', 'developer', 'software', 'cybersecurity', 'data science', 'machine learning'],
  education: ['education', 'study with me', 'lecture', 'explained', 'for students', 'university', 'college', 'high school', 'exam prep', 'lesson', 'tutorial', 'course', 'online class', 'history', 'science'],
  lifestyle: ['lifestyle', 'vlog', 'daily routine', 'morning routine', 'minimalism', 'productivity', 'self care', 'wellness', 'mindfulness', 'aesthetic', 'cozy'],
  fitness: ['workout', 'fitness', 'gym', 'exercise', 'home workout', 'beginner', 'muscle building', 'weight loss', 'yoga', 'hiit', 'cardio', 'stretching', 'mobility', 'nutrition', 'meal prep'],
  food: ['recipe', 'cooking', 'easy recipe', 'homemade', 'delicious', 'food', 'chef', 'kitchen', 'quick meal', 'healthy eating', 'vegan', 'dessert', 'baking', 'street food'],
  music: ['music', 'song', 'cover', 'remix', 'guitar', 'piano', 'producer', 'beat', 'lofi', 'hip hop', 'edm', 'jazz', 'classical', 'concert', 'live performance', 'music theory'],
  travel: ['travel', 'vlog', 'tour', 'guide', 'best places', 'backpacking', 'budget travel', 'luxury travel', 'solo travel', 'road trip', 'food tour', 'travel tips', 'wanderlust'],
  finance: ['finance', 'investing', 'money', 'stock market', 'crypto', 'personal finance', 'budgeting', 'passive income', 'real estate', 'trading', 'retirement', 'wealth', 'entrepreneur', 'business'],
  beauty: ['makeup', 'skincare', 'beauty', 'tutorial', 'routine', 'grwm', 'natural', 'product review', 'hairstyle', 'nail art', 'glow up', 'aesthetic'],
  diy: ['diy', 'craft', 'handmade', 'home decor', 'woodworking', 'sewing', 'upcycle', 'renovation', 'build', 'how to make', 'crafts for kids']
};

const TYPE_TAGS = {
  video: ['youtube', 'youtube video', 'youtube channel', 'subscribe', 'new video', 'watch this', 'must watch'],
  shorts: ['shorts', 'youtube shorts', 'short', 'short video', 'viral', 'fyp', 'trending', 'reels'],
  both: ['youtube', 'shorts', 'youtube shorts', 'subscribe', 'viral', 'trending', 'new video', 'fyp']
};

const COMMON_MODIFIERS = ['how to', 'tutorial', 'guide', 'for beginners', '2026', 'best', 'top', 'tips', 'ideas', 'review', 'explained', 'diy', 'easy', 'quick', 'simple'];

let currentTags = [];

function dedupe(arr) {
  const seen = new Set();
  const out = [];
  for (const s of arr) {
    const k = s.toLowerCase().trim();
    if (!k || seen.has(k)) continue;
    seen.add(k);
    out.push(s);
  }
  return out;
}

function generateTags() {
  const topic = $('#topic').value.trim();
  const cat = $('#category').value;
  const vtype = $('#vtype').value;
  if (!topic) {
    GZ.showToast('Please enter a topic first');
    return;
  }
  const words = topic.toLowerCase().split(/\s+/).filter(Boolean);
  const baseTopic = topic.toLowerCase();
  const topicSlug = words.join(' ');
  const tags = [];
  tags.push(topic);
  words.forEach(w => tags.push(w));
  tags.push(topicSlug);
  (CAT_TAGS[cat] || CAT_TAGS.general).slice(0, 8).forEach(t => tags.push(t + ' ' + topic));
  (CAT_TAGS[cat] || CAT_TAGS.general).slice(0, 6).forEach(t => tags.push(topic + ' ' + t));
  COMMON_MODIFIERS.slice(0, 8).forEach(m => tags.push(m + ' ' + topic));
  (TYPE_TAGS[vtype] || TYPE_TAGS.video).forEach(t => tags.push(t));
  tags.push(topic + ' 2026');
  tags.push('best ' + topic);
  tags.push(topic + ' tutorial');
  tags.push(topic + ' for beginners');
  tags.push('#' + words.join(''));
  tags.push('#' + words[0]);
  currentTags = dedupe(tags).slice(0, 30);
  renderTags();
}

function addMore() {
  const topic = $('#topic').value.trim();
  if (!topic || !currentTags.length) {
    generateTags();
    return;
  }
  const extras = [
    topic + ' ideas', topic + ' inspiration', topic + ' hacks',
    topic + ' mistakes', topic + ' step by step', topic + ' at home',
    topic + ' challenge', topic + ' reaction', topic + ' vs',
    'how to ' + topic, 'why ' + topic, 'what is ' + topic,
    topic + ' 2026 trends', topic + ' update', topic + ' secrets',
    topic + ' before and after', topic + ' comparison'
  ];
  currentTags = dedupe(currentTags.concat(extras)).slice(0, 40);
  renderTags();
}

function removeTag(idx) {
  currentTags.splice(idx, 1);
  renderTags();
}

function renderTags() {
  const grid = $('#tagGrid');
  if (!currentTags.length) {
    grid.innerHTML = `<div style="color:var(--gz-text-2);padding:1rem">${t('empty')}</div>`;
    $('#counter').innerHTML = '';
    return;
  }
  grid.innerHTML = currentTags.map((tag, i) => `<span class="tag-pill">${escapeHtml(tag)}<span class="x" onclick="removeTag(${i})">×</span></span>`).join('');
  const totalChars = currentTags.join(',').length;
  $('#counter').innerHTML = t('counter').replace('<b></b>', '<b>' + currentTags.length + '</b>').replace('<b></b>', '<b>' + totalChars + '</b>');
}

function escapeHtml(s) {
  return s.replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>').replace(/"/g, '"');
}

function copyAsLine() {
  if (!currentTags.length) { GZ.showToast('Generate tags first'); return; }
  copyText(currentTags.join(' '));
}
function copyAsCsv() {
  if (!currentTags.length) { GZ.showToast('Generate tags first'); return; }
  copyText(currentTags.join(', '));
}
function clearAllTags() {
  currentTags = [];
  renderTags();
}

$('#topic').addEventListener('keydown', e => { if (e.key === 'Enter') generateTags(); });

$('#toolbar').innerHTML = `<button class="gz-btn" onclick="generateTags()">${t('generate')}</button><button class="gz-btn gz-btn-secondary" onclick="addMore()">${t('addMore')}</button>`;
$('#copyAll').textContent = t('copyAll');
$('#copyComma').textContent = t('copyComma');
$('#clearAll').textContent = t('clearAll');
$('#topic').placeholder = 'e.g. cooking pasta, react tutorial, workout';
$('#copyAll').onclick = copyAsLine;
$('#copyComma').onclick = copyAsCsv;
$('#clearAll').onclick = clearAllTags;
$('#topicLbl').textContent = t('topicLbl');
$('#catLbl').textContent = t('catLbl');
$('#typeLbl').textContent = t('typeLbl');

GZ.renderToolPage({
  category: 'dev',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],

    {icon:'🖼️', href:'/dev/og-meta-generator.html', name:'OG Meta'},

    {icon:'#️⃣', href:'/dev/hashtag-generator.html', name:'Hashtag Generator'},
  ]
});
</script>
