function ident(name){const value=String(name||'Root').replace(/[^A-Za-z0-9_$]+/g,' ').replace(/(?:^|\s)([A-Za-z])/g,(_,c)=>c.toUpperCase()).replace(/\s/g,'');return/^[A-Za-z_$]/.test(value)?value:'Root';}function literal(value){return JSON.stringify(value);}function schemaToZod(schema){const defs=schema.$defs||schema.definitions||{},decl=[];function refName(ref){return ident(ref.split('/').pop().replace(/~1/g,'/').replace(/~0/g,'~'))+'Schema';}function withConstraints(s,base){if(s.minLength!==undefined)base+='.min('+s.minLength+')';if(s.maxLength!==undefined)base+='.max('+s.maxLength+')';if(s.pattern)base+='.regex(new RegExp('+literal(s.pattern)+'))';if(s.format==='email')base+='.email()';if(s.format==='uuid')base+='.uuid()';if(s.minimum!==undefined)base+='.min('+s.minimum+')';if(s.maximum!==undefined)base+='.max('+s.maximum+')';return base;}function zod(s,hint){if(!s||typeof s!=='object')return'z.unknown()';if(s.$ref)return refName(s.$ref);if(Object.prototype.hasOwnProperty.call(s,'const'))return'z.literal('+literal(s.const)+')';if(Array.isArray(s.enum)){if(s.enum.length&&s.enum.every(x=>typeof x==='string'))return'z.enum(['+s.enum.map(literal).join(', ')+'])';return'z.union(['+s.enum.map(x=>'z.literal('+literal(x)+')').join(', ')+'])';}for(const key of ['oneOf','anyOf'])if(Array.isArray(s[key]))return'z.union(['+s[key].map(x=>zod(x,hint)).join(', ')+'])';if(Array.isArray(s.allOf))return s.allOf.map(x=>zod(x,hint)).join('.and(')+')'.repeat(Math.max(0,s.allOf.length-1));const types=Array.isArray(s.type)?s.type:null;if(types){const nullable=types.includes('null'),actual=types.filter(x=>x!=='null');let value=actual.length===1?zod({...s,type:actual[0]},hint):'z.union(['+actual.map(x=>zod({...s,type:x},hint)).join(', ')+'])';return nullable?value+'.nullable()':value;}if(s.type==='object'||s.properties||s.additionalProperties){const props=Object.entries(s.properties||{}).map(([key,value])=>literal(key)+': '+zod(value,ident(key))+(new Set(s.required||[]).has(key)?'':'.opt
