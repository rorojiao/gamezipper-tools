<script>
GZI18n.register({
  en: {
    toolTitle: 'Testimonial Generator',
    toolDesc: 'Create realistic customer testimonials for your product. Pick a tone, industry, and star rating - get 5 unique quotes with names, avatars, and roles in seconds. Perfect for landing page mockups and design prototypes.',
    step1: 'Enter your product or service name and the main benefit customers love',
    step2: 'Pick an industry and the default tone you want the reviews to take',
    step3: 'Click Generate to create 5 testimonials with names, avatars and star ratings',
    step4: 'Hover any card and click Copy to grab that single quote with attribution',
    tipTitle: 'Tip:',
    tipBody: 'These are template-based placeholders for design mockups and prototypes. Never publish fabricated quotes as real reviews - that violates FTC guidelines and most ad-platform policies.',
    copy: 'Copy',
    copied: 'Copied to clipboard!'
  },
  zh: {
    toolTitle: '客户评价生成器',
    toolDesc: '为您的产品创建逼真的客户评价。选择语气、行业和星级评分 - 几秒内生成 5 条独特评价,带有姓名、头像和职位。非常适合落地页模型和设计原型。',
    step1: '输入您的产品或服务名称以及客户喜爱的核心卖点',
    step2: '选择行业和您希望评价采用的默认语气',
    step3: '点击「生成」创建 5 条带有姓名、头像和星级评分的评价',
    step4: '悬停任意卡片点击「复制」即可获取单条评价及署名',
    tipTitle: '提示:',
    tipBody: '这是基于模板的占位符,用于设计模型和原型。请勿将伪造的评价发布为真实评论 - 这违反 FTC 准则和大多数广告平台政策。',
    copy: '复制',
    copied: '已复制到剪贴板!'
  }
});

const { t, copyText } = GZ;

const FIRST = ['Sarah','Michael','Emily','David','Jessica','Chris','Amanda','James','Lauren','Daniel','Ashley','Ryan','Nicole','Kevin','Megan','Brandon','Rachel','Tyler','Hannah','Eric','Olivia','Jordan','Sophia','Andrew','Ava','Joshua','Isabella','Brian','Mia','Justin'];
const LAST = ['Johnson','Williams','Brown','Davis','Miller','Wilson','Moore','Taylor','Anderson','Thomas','Jackson','White','Harris','Martin','Thompson','Garcia','Martinez','Robinson','Clark','Rodriguez','Lewis','Lee','Walker','Hall','Allen','Young','King','Wright','Scott','Green'];
const COMPANIES = ['Acme Corp','Northwind Inc','Globex','Initech','Hooli','Pied Piper','Massive Dynamic','Wonka Industries','Stark Industries','Wayne Enterprises','Cyberdyne','Soylent','Vandelay','Sterling Cooper','Dunder Mifflin','Pinnacle Labs','Quantum Dynamics','Helios Co','Meridian Group','Lighthouse Studio'];
const ROLES = {
  saas: ['Software Engineer','Product Manager','CTO','DevOps Lead','Engineering Manager','Full-Stack Developer','Data Scientist','Engineering Director','Solutions Architect','QA Lead'],
  ecommerce: ['Store Owner','E-commerce Manager','Operations Director','Buyer','Supply Chain Lead','Customer Success Manager','Marketing Lead','DTC Founder','Brand Manager','Wholesale Coordinator'],
  agency: ['Creative Director','Account Manager','Strategy Lead','Agency Founder','Brand Strategist','Project Manager','Marketing Consultant','Client Partner','Studio Director','Communications Lead'],
  education: ['Course Creator','Online Educator','University Lecturer','Curriculum Designer','Bootcamp Instructor','Tutor','Training Manager','K-12 Teacher','Education Consultant','EdTech Founder'],
  finance: ['Financial Advisor','Wealth Manager','CFO','Tax Consultant','Portfolio Manager','Bookkeeper','Investor','FinTech PM','Compliance Officer','Fractional Controller'],
  health: ['Nutritionist','Personal Trainer','Wellness Coach','Therapist','Clinic Owner','Yoga Instructor','Health Coach','Dietitian','Holistic Practitioner','Fitness Studio Owner'],
  creative: ['Designer','Illustrator','Photographer','Creative Director','Art Director','Freelance Artist','Studio Owner','Animator','Brand Designer','Content Creator'],
  restaurant: ['Restaurant Owner','Head Chef','Hospitality Manager','Cafe Owner','Sommelier','F&B Director','Bar Manager','Catering Lead','Pastry Chef','Hospitality Consultant'],
  realestate: ['Realtor','Broker','Real Estate Investor','Property Manager','Listing Agent','Commercial Broker','Developer','Mortgage Advisor','Title Officer','Buyer Agent'],
  generic: ['Customer','Business Owner','Team Lead','Founder','Director','Manager','Specialist','Coordinator','Consultant','Analyst']
};

const TONES = {
  enthusiastic: {
    label: 'Enthusiastic',
    open: ['Absolutely love','So glad I found','Cannot recommend enough','Total game-changer','Honestly blown away'],
    mid: [' — the results were instant. ',' and it has become essential to my daily workflow. ',' — I wish I had started using it sooner. '],
    close: ['Could not be happier!','Highly recommended to anyone serious about quality.','Will be a customer for life.','10/10 would recommend to a friend.']
  },
  measured: {
    label: 'Measured',
    open: ['Solid tool overall','Does what it says','A reliable choice','A practical solution','A worthwhile investment'],
    mid: [' — the value is clear after a few weeks of use. ',' — particularly strong on the core workflow. ',' — minor learning curve, well worth it. '],
    close: ['Happy to recommend.','Plan to keep using it.','A reasonable pick for the price.','Satisfied with the results.']
  },
  formal: {
    label: 'Formal',
    open: ['We have integrated','Our team adopted','Our organization selected','We chose to standardize on','After evaluating several options, we implemented'],
    mid: [' across the department with positive measurable outcomes. ',' for its robust feature set and professional support. ',' — meeting the requirements we identified during the RFP process. '],
    close: ['Recommended for mid-size and enterprise teams.','Approved for ongoing use across our organization.','A reliable long-term partner for our operations.']
  },
  casual: {
    label: 'Casual',
    open: ['Honestly, this just works','Super easy to use','Pretty cool tool','Glad I gave it a try','OK this is genuinely handy'],
    mid: [' — took like two minutes to figure out and saved me hours. ',' and I keep finding new ways to use it. ',' — honestly, the kind of tool you forget you are paying for because it just runs. '],
    close: ['Worth checking out.','Solid 10/10 from me.','Already told my friends about it.','Yep, this one is a keeper.']
  },
  detailed: {
    label: 'Detailed',
    open: ['After 3 months of daily use','I tested 4 alternatives before settling on','Before adopting this my workflow took 6 hours per week; now it takes less than 1','I rolled this out to a team of 12 and the response has been overwhelmingly positive','My biggest pain point was'],
    mid: [' — and the difference has been measurable across retention, speed, and clarity. ','. Specifically, I have seen measurable improvements in turnaround time, accuracy, and the team has not raised a single support ticket in 8 weeks. ','. Compared to the previous solution, this is faster, more reliable, and noticeably cheaper when you factor in the time savings. '],
    close: ['Specific, honest, and worth every cent.','Will renew without hesitation.','Have already recommended to two peer teams.','Long-term customer here.']
  }
};

const COLORS = ['#e94560','#4ecdc4','#9b5de5','#ffb84d','#00d672','#5e7ce2','#ff6b9d','#48dbfb','#feca57','#1dd1a1'];

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function init2(s){ return s.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2); }

function templateText(tone, product, benefit, name){
  const T = TONES[tone];
  const o = pick(T.open);
  const m = pick(T.mid);
  const c = pick(T.close);
  const ref = (Math.random()<0.4) ? ` ${pick(['Honestly,','In particular,','For me,','In my experience,'])}` : '';
  return `${o} ${product}${m}${ref} it ${benefit}${c}`;
}

function generate(){
  const product = $('#product').value.trim() || 'this product';
  const benefit = $('#benefit').value.trim() || 'solved a real problem for me';
  const industry = $('#industry').value;
  const defaultTone = $('#tone').value;
  const starSetting = $('#stars').value;
  const tones = ['enthusiastic','measured','formal','casual','detailed'];
  const cards = $('#cards');
  cards.innerHTML = '';
  tones.forEach((tone, i) => {
    const finalTone = (i === 0) ? defaultTone : tones[(tones.indexOf(defaultTone)+i) % tones.length];
    const first = pick(FIRST), last = pick(LAST);
    const name = `${first} ${last}`;
    const role = pick(ROLES[industry]);
    const company = pick(COMPANIES);
    let stars;
    if (starSetting === '5') stars = 5;
    else if (starSetting === '4-5') stars = (Math.random()<0.6) ? 5 : 4;
    else stars = pick([3,4,5,4,5,5]);
    const text = templateText(finalTone, product, benefit, name);
    const color = COLORS[i % COLORS.length];
    const card = document.createElement('div');
    card.className = 'tg-card';
    card.innerHTML = `
      <button class="tg-copy-btn" data-text="${text.replace(/"/g,'&quot;')}\\n\\n— ${name}, ${role} at ${company} (${'★'.repeat(stars)}${'☆'.repeat(5-stars)})">${t('copy')}</button>
      <div class="tg-card-head">
        <div class="tg-avatar" style="background:${color}">${init2(name)}</div>
        <div><div class="tg-name">${name}</div><div class="tg-role">${role} at ${company}</div></div>
      </div>
      <div class="tg-stars">${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</div>
      <div class="tg-quote">${text}</div>
      <div class="tg-foot"><span class="tg-tone-label">${TONES[finalTone].label}</span>${stars>=5 ? '<span class="tg-rec-badge">Recommends</span>' : ''}</div>
    `;
    cards.appendChild(card);
  });
  cards.querySelectorAll('.tg-copy-btn').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      copyText(b.getAttribute('data-text'));
      showToast(t('copied'));
    });
  });
}

function showToast(msg){
  let toast = document.querySelector('.tg-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.className = 'tg-toast';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1600);
}

function $(s){ return document.querySelector(s); }

$('#tip').innerHTML = `<strong>${t('tipTitle')}</strong> ${t('tipBody')}`;

generate();

GZ.renderToolPage({
  category: 'text',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'⭐', href:'/text/review-generator.html', name:'Review Generator'},
    {icon:'📝', href:'/text/cover-letter-generator.html', name:'Cover Letter'},
    {icon:'💼', href:'/text/resume-builder.html', name:'Resume Builder'},
    {icon:'💬', href:'/text/cold-email-template-generator.html', name:'Cold Email'},
  ]
});
</script>
