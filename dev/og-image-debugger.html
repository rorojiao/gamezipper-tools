<script>
GZI18n.register({
  en: {
    toolTitle: 'OG Image Debugger',
    toolDesc: 'Fetch any page and preview its Open Graph (OG) and Twitter Card meta tags. Detect missing tags, wrong image size, and social SEO issues instantly.',

    pasteBtn: 'Parse Pasted HTML',
    placeholderUrl: 'https://example.com/your-page',

    tabPreview: 'Preview',

    lblPaste: 'Or paste raw HTML source below:',

    step1: 'Enter a public URL in the input field',

  },
  zh: {
    toolTitle: 'OG 图片调试器',
    toolDesc: '抓取任意页面并预览其 Open Graph (OG) 和 Twitter Card 元标签。立即发现缺失标签、图片尺寸错误和社交 SEO 问题。',
    fetchBtn: '抓取并调试',
    pasteBtn: '解析粘贴的 HTML',
    placeholderUrl: 'https://example.com/your-page',
    checking: '正在抓取 URL…',
    noTags: '未找到 OG/Twitter 元标签。',
    tabPreview: '预览',
    tabRaw: '原始标签',
    tabWarnings: '检查项',
    lblPaste: '或在下方粘贴原始 HTML 源代码:',
    btnParsePaste: '解析粘贴的 HTML',
    step1: '在输入框中输入一个公开 URL',
    step2: '点击「抓取并调试」,工具会通过公共 CORS 代理抓取页面',
    step3: '在「预览」标签页查看 Facebook / Twitter / Slack 预览效果',
    step4: '打开「检查项」标签页查看缺失或格式错误的标签',
  }
});

const { $, copyText, t } = GZ;
let lastMeta = {};

function $(id){ return document.getElementById(id); }

function switchTab(name){
  document.querySelectorAll('.dbg-tab').forEach(el => el.classList.toggle('active', el.dataset.tab === name));
  document.querySelectorAll('.dbg-pane').forEach(el => el.classList.toggle('active', el.id === 'pane-' + name));
}

document.querySelectorAll('.dbg-tab').forEach(el => el.addEventListener('click', () => switchTab(el.dataset.tab)));

function parseMetaFromHtml(html){
  const meta = {};
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  doc.querySelectorAll('meta').forEach(m => {
    const k = (m.getAttribute('property') || m.getAttribute('name') || '').toLowerCase();
    const v = m.getAttribute('content') || '';
    if (!k) return;
    meta[k] = v;
  });
  doc.querySelectorAll('title').forEach(t2 => { meta['title'] = t2.textContent.trim(); });
  // relative URL resolution
  const baseUrl = meta['og:url'] || '';
  ['og:image','og:image:url','og:image:secure_url','twitter:image','twitter:image:src'].forEach(k => {
    if (meta[k] && !/^https?:\/\//i.test(meta[k]) && baseUrl) {
      try { meta[k] = new URL(meta[k], baseUrl).href; } catch(e){}
    }
  });
  return meta;
}

function renderMeta(meta){
  lastMeta = meta;
  const title = meta['og:title'] || meta['twitter:title'] || meta['title'] || '(no title)';
  const desc = meta['og:description'] || meta['twitter:description'] || meta['description'] || '(no description)';
  const image = meta['og:image'] || meta['og:image:url'] || meta['twitter:image'] || meta['twitter:image:src'] || '';
  const url = meta['og:url'] || meta['twitter:url'] || '';
  let domain = '';
  try { domain = new URL(url || $('url-input').value).hostname.replace(/^www\./,''); } catch(e){ domain = ''; }
  $('og-title-pv').textContent = title;
  $('og-desc-pv').textContent = desc;
  $('og-domain').textContent = domain || 'example.com';
  const imgEl = $('og-image');
  if (image) { imgEl.src = image; imgEl.style.display='block'; }
  else { imgEl.src=''; imgEl.style.display='none'; }

  const fbOk = meta['og:title'] && meta['og:description'] && meta['og:image'];
  const twOk = meta['twitter:card'] && meta['twitter:title'] && meta['twitter:description'] && meta['twitter:image'];
  const slOk = meta['og:title'] && meta['og:description'];
  $('fb-summary').innerHTML = (fbOk ? '<span class="dbg-status dbg-ok">OK</span>' : '<span class="dbg-status dbg-warn">MISSING</span>') +
    `title:${meta['og:title']?'✓':'✗'} image:${meta['og:image']?'✓':'✗'} desc:${meta['og:description']?'✓':'✗'}`;
  $('tw-summary').innerHTML = (twOk ? '<span class="dbg-status dbg-ok">OK</span>' : '<span class="dbg-status dbg-warn">PARTIAL</span>') +
    `card:${meta['twitter:card']||'summary_large_image'} image:${meta['twitter:image']?'✓':'✗'}`;
  $('sl-summary').innerHTML = (slOk ? '<span class="dbg-status dbg-ok">OK</span>' : '<span class="dbg-status dbg-warn">PARTIAL</span>') +
    `Uses og:* tags (Slack/Discord fall back)`;

  // raw tab
  const lines = Object.keys(meta).sort().map(k => `${k}: ${meta[k]}`);
  $('raw-output').textContent = lines.length ? lines.join('\n') : t('noTags');

  // checks
  const checks = [];
  const require = (k, label) => checks.push({key:k, label, ok: !!meta[k]});
  require('og:title','og:title present');
  require('og:description','og:description present');
  require('og:image','og:image present');
  require('og:url','og:url present (canonical for crawlers)');
  require('og:type','og:type present');
  require('og:site_name','og:site_name present');
  require('twitter:card','twitter:card present');
  require('twitter:title','twitter:title present');
  require('twitter:description','twitter:description present');
  require('twitter:image','twitter:image present');
  const imgOk = !!image;
  const pass = checks.filter(c => c.ok).length;
  $('checks-summary').textContent = `${pass}/${checks.length} checks passed`;
  $('checks-list').innerHTML = checks.map(c =>
    `<li><span class="dbg-status ${c.ok?'dbg-ok':'dbg-miss'}">${c.ok?'PASS':'MISS'}</span>${c.label}</li>`
  ).join('') + (imgOk ? `<li><span class="dbg-status dbg-ok">IMG</span>Recommended size: 1200×630 (1.91:1). Tool does not download image to verify dimensions.</li>` : '');
}

async function fetchUrl(){
  const url = $('url-input').value.trim();
  if (!url) { $('status').innerHTML = '<span style="color:var(--gz-accent)">Please enter a URL.</span>'; return; }
  if (!/^https?:\/\//i.test(url)) { $('status').innerHTML = '<span style="color:var(--gz-accent)">URL must start with http:// or https://</span>'; return; }
  $('status').innerHTML = `<span style="color:var(--text2)">${t('checking')}</span>`;
  const proxy = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
  try {
    const r = await fetch(proxy, { method: 'GET' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const html = await r.text();
    const meta = parseMetaFromHtml(html);
    if (Object.keys(meta).length === 0) {
      $('status').innerHTML = '<span style="color:var(--gz-accent)">' + t('noTags') + '</span>';
    } else {
      renderMeta(meta);
      $('status').innerHTML = `<span style="color:var(--gz-success)">✓ Fetched ${url} — ${Object.keys(meta).length} meta tags parsed</span>`;
    }
  } catch(e) {
    $('status').innerHTML = `<span style="color:var(--gz-accent)">Fetch failed: ${e.message}. CORS proxy may be blocked — try the "Raw Tags" tab and paste HTML manually.</span>`;
  }
}

function parsePasted(){
  const html = $('paste-html').value.trim();
  if (!html) { $('status').innerHTML = '<span style="color:var(--gz-accent)">Paste some HTML first.</span>'; return; }
  const meta = parseMetaFromHtml(html);
  renderMeta(meta);
  switchTab('preview');
  $('status').innerHTML = `<span style="color:var(--gz-success)">✓ Parsed ${Object.keys(meta).length} meta tags from pasted HTML</span>`;
}

$('toolbar').innerHTML = `
  <button class="gz-btn" onclick="fetchUrl()">${t('fetchBtn')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="parsePasted()">${t('pasteBtn')}</button>`;
$('url-input').addEventListener('keydown', e => { if (e.key === 'Enter') fetchUrl(); });

GZ.renderToolPage({

    {icon:'🔍', href:'/seo/open-graph-preview.html', name:'SEO OG Preview'},
  ]
});
</script>
