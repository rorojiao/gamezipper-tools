const fmt = n => {
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(n);
  return sign + '$' + abs.toLocaleString('en-US', {maximumFractionDigits: 0});
};
const fmtCoin = (n, sym) => {
  return n.toLocaleString('en-US', {maximumFractionDigits: n < 1 ? 6 : 4}) + ' ' + sym;
};

const colorFor = () => PALETTE[(nextColor++) % PALETTE.length];

    <td><input type="text" class="r-coin" placeholder="BTC" value="${coin}" maxlength="10" style="text-transform:uppercase"></td>
    <td><input type="number" class="r-qty" min="0" step="any" value="${qty}"></td>
    <td><input type="number" class="r-cost" min="0" step="any" value="${cost}"></td>
    <td><input type="number" class="r-price" min="0" step="any" value="${price}"></td>
    <td class="r-value">$0</td>
    <td class="r-pnl">$0</td>
    <td><button class="cpl-del" title="Remove">✕</button></td>`;
  tr.querySelector('.cpl-del').onclick = () => { tr.remove(); if(!$('#rows').children.length) calc(); };
  $('#rows').appendChild(tr);
  return tr;
}

function addRow(){
  const tr = renderRow('', 0, 0, 0);
  tr.querySelector('.r-coin').focus();
}

function readRows(){
  const arr = [];
  $('#rows').querySelectorAll('tr').forEach(tr=>{
    const coin = tr.querySelector('.r-coin').value.trim().toUpperCase();
    const qty = parseFloat(tr.querySelector('.r-qty').value) || 0;
    const cost = parseFloat(tr.querySelector('.r-cost').value) || 0;
    const price = parseFloat(tr.querySelector('.r-price').value) || 0;
    const color = tr.dataset.color;
    if(coin && qty > 0){
      arr.push({coin, qty, cost, price, color});
    }
  });
  return arr;
}

function calc(){
  const rows = readRows();
  let totalValue = 0, totalCost = 0;
  rows.forEach(r => {
    const value = r.qty * r.price;
    const cost = r.qty * r.cost;
    const pnl = value - cost;
    r.value = value; r.cost = cost; r.pnl = pnl;
    r.roi = cost > 0 ? (pnl / cost) * 100 : 0;
    totalValue += value;
    totalCost += cost;
  });

  // Update row P&L cells
  $('#rows').querySelectorAll('tr').forEach(tr=>{
    const coin = tr.querySelector('.r-coin').value.trim().toUpperCase();
    const r = rows.find(x => x.coin === coin && Math.abs(parseFloat(tr.querySelector('.r-qty').value)||0 - x.qty) < 1e-12);
    if(r){
      const valCell = tr.querySelector('.r-value');
      const pnlCell = tr.querySelector('.r-pnl');
      valCell.textContent = fmt(r.value);
      pnlCell.textContent = (r.pnl >= 0 ? '+' : '') + fmt(r.pnl) + ' (' + (r.roi >= 0 ? '+' : '') + r.roi.toFixed(2) + '%)';
      tr.classList.remove('positive', 'negative');
      if(r.pnl > 0) tr.classList.add('positive');
      else if(r.pnl < 0) tr.classList.add('negative');
    }
  });

  if(rows.length === 0){
    $('#results').style.display = 'none';
    return;
  }

  const totalPnl = totalValue - totalCost;
  const totalRoi = totalCost > 0 ? (totalPnl / totalCost) * 100 : 0;

  $('#m-value').textContent = fmt(totalValue);
  $('#m-cost').textContent = fmt(totalCost);
  $('#m-pnl').textContent = (totalPnl >= 0 ? '+' : '') + fmt(totalPnl);
  $('#m-roi').textContent = (totalRoi >= 0 ? '+' : '') + totalRoi.toFixed(2) + '%';
  $('#m-count').textContent = rows.length;

  const pnlMetric = $('#m-pnl').parentElement;
  pnlMetric.classList.remove('profit', 'loss');
  pnlMetric.classList.add(totalPnl >= 0 ? 'profit' : 'loss');

  const roiMetric = $('#m-roi').parentElement;
  roiMetric.classList.remove('profit', 'loss');
  roiMetric.classList.add(totalRoi >= 0 ? 'profit' : 'loss');

  // Best/worst
  const sortedByRoi = [...rows].sort((a,b) => b.roi - a.roi);
  if(sortedByRoi[0]){
    $('#m-best').textContent = sortedByRoi[0].coin + ' (' + (sortedByRoi[0].roi >= 0 ? '+' : '') + sortedByRoi[0].roi.toFixed(1) + '%)';
  }
  if(sortedByRoi[sortedByRoi.length-1]){
    $('#m-worst').textContent = sortedByRoi[sortedByRoi.length-1].coin + ' (' + (sortedByRoi[sortedByRoi.length-1].roi >= 0 ? '+' : '') + sortedByRoi[sortedByRoi.length-1].roi.toFixed(1) + '%)';
  }

  // Allocation bar
  const bar = $('#bar'); bar.innerHTML = '';
  const leg = $('#legend'); leg.innerHTML = '';
  rows.forEach(r => {
    const pct = totalValue > 0 ? (r.value / totalValue) * 100 : 0;
    if(pct < 0.5) return;
    const seg = document.createElement('div');
    seg.className = 'cpl-bar-seg';
    seg.style.width = pct + '%';
    seg.style.background = r.color;
    seg.textContent = pct > 6 ? (r.coin + ' ' + pct.toFixed(0) + '%') : '';
    bar.appendChild(seg);
    leg.innerHTML += '<span><i style="background:' + r.color + '"></i>' + r.coin + ': ' + fmt(r.value) + ' (' + pct.toFixed(1) + '%)</span>';
  });

  // Per-coin perf cards
  const perfEl = $('#perf'); perfEl.innerHTML = '';
  rows.forEach(r => {
    const card = document.createElement('div');
    card.className = 'cpl-perf-card ' + (r.pnl >= 0 ? 'profit' : 'loss');
    card.innerHTML = '<strong>' + (r.pnl >= 0 ? '+' : '') + r.roi.toFixed(1) + '%</strong><span>' + r.coin + '</span>';
    perfEl.appendChild(card);
  });

  // Diversification advice
  const sortedByAlloc = [...rows].sort((a,b) => b.value - a.value);
  const topAlloc = sortedByAlloc[0] ? (sortedByAlloc[0].value / totalValue) * 100 : 0;
  let advice;
  if(topAlloc > 60) advice = t('adviceOver');
  else if(topAlloc < 40) advice = t('adviceGood');
  else advice = t('adviceUnder');
  $('#advice').textContent = advice;

  // Tip
  $('#tip').innerHTML = '<b>' + t('tipTitle') + '</b><br>' + t('tip1') + '<br>' + t('tip2') + '<br>' + t('tip3') + '<br>' + t('tip4');

  $('#results').style.display = 'block';
}

function loadPreset(which){
  $('#rows').innerHTML = '';
  nextColor = 0;
  if(which === 'btc'){
    renderRow('BTC', 0.5, 40000, 65000);
  } else if(which === 'eth'){
    renderRow('ETH', 5, 2200, 3500);
  } else if(which === 'sol'){
    renderRow('SOL', 50, 110, 175);
  } else { // mixed
    renderRow('BTC', 0.25, 45000, 65000);
    renderRow('ETH', 3, 2500, 3500);
    renderRow('SOL', 30, 130, 175);
    renderRow('LINK', 200, 18, 14);
    renderRow('ADA', 1500, 0.55, 0.42);
  }
  calc();
}

function showMsg(msg){
  const el = $('#loadingMsg');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(()=>{ el.style.display='none'; }, 2500);
}

function savePortfolio(){
  const data = readRows();
  try { localStorage.setItem('cpl_portfolio_v1', JSON.stringify(data)); showMsg(t('loadingSavedOk')); }
  catch(e){ console.warn('save failed', e); }
}

function loadPortfolio(){
  try {
    const raw = localStorage.getItem('cpl_portfolio_v1');
    if(!raw) return;
    const data = JSON.parse(raw);
    $('#rows').innerHTML = '';
    nextColor = 0;
    data.forEach(r => renderRow(r.coin, r.qty, r.cost, r.price, colorFor()));
    calc();
    showMsg(t('loadingSaved'));
  } catch(e){ console.warn('load failed', e); }
}

$('#btnAdd').addEventListener('click', addRow);
$('#btnCalc').addEventListener('click', calc);
$('#btnSave').addEventListener('click', savePortfolio);
$('#btnLoad').addEventListener('click', loadPortfolio);
$('#btnClearAll').addEventListener('click', ()=>{ $('#rows').innerHTML = ''; calc(); showMsg(t('loadingCleared')); });

// Live recalc when user edits any input
$('#rows').addEventListener('input', (e) => {
  if(e.target.matches('input')) calc();
});
