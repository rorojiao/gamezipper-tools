<script>
GZI18n.register({
  en:{
    toolTitle:'Content Security Policy Generator',toolDesc:'Build a Content Security Policy header in your browser. Start strict, tune each directive, then copy a ready-to-use HTTP header or HTML meta tag.',
    reportOnly:'Report-Only mode',strict:'Use strict starter',clear:'Clear policy',note:'Enable only the directives you need. Enter CSP source expressions separated by spaces, for example: \'self\' https://cdn.example.com data:.',
    outputLabel:'Generated policy',copyHeader:'Copy header',copyValue:'Copy value',copyMeta:'Copy meta tag',copiedHeader:'CSP header copied.',copiedValue:'CSP value copied.',copiedMeta:'CSP meta tag copied.',
    empty:'Enable a directive and add at least one source expression to generate a policy.',noneMix:"'none' must be the only source in a directive.",badSource:'Source expressions cannot contain semicolons or line breaks.',metaWarning:'Meta tags cannot use Report-Only mode and do not support frame-ancestors. Prefer the HTTP header.',
    dDefault:'Fallback for resource fetches',dScript:'JavaScript sources',dStyle:'Stylesheet sources',dImage:'Image sources',dFont:'Font sources',dConnect:'fetch, XHR and WebSocket sources',dMedia:'Audio and video sources',dFrame:'Embedded frame sources',dObject:'Plugin object sources',dWorker:'Worker sources',dManifest:'Web app manifest sources',dBase:'Base URL restriction',dForm:'Form submission targets',dAncestors:'Who may embed this page',
    step1:'Start with the strict policy, then enable only the directives your app needs.',step2:'Enter allowed source expressions for each enabled directive.',step3:'Use Report-Only mode to observe violations before enforcing a new policy.',step4:'Copy the HTTP header for your server, or copy a meta tag when headers are unavailable.'
  },
  zh:{
    toolTitle:'Content Security Policy (CSP) 生成器',toolDesc:'在浏览器中构建 Content Security Policy 响应头。使用严格起始策略，按指令调整后复制 HTTP 响应头或 HTML meta 标签。',
    reportOnly:'仅报告模式',strict:'使用严格起始策略',clear:'清空策略',note:'只启用应用实际需要的指令。使用空格分隔 CSP 来源表达式，例如：\'self\' https://cdn.example.com data:。',
    outputLabel:'生成的策略',copyHeader:'复制响应头',copyValue:'复制策略值',copyMeta:'复制 meta 标签',copiedHeader:'CSP 响应头已复制。',copiedValue:'CSP 策略值已复制。',copiedMeta:'CSP meta 标签已复制。',
    empty:'请启用至少一个指令并添加来源表达式。',noneMix:"'none' 必须是指令中唯一的来源。",badSource:'来源表达式不能包含分号或换行。',metaWarning:'meta 标签不能使用仅报告模式，也不支持 frame-ancestors。建议使用 HTTP 响应头。',
    dDefault:'资源请求的默认规则',dScript:'JavaScript 来源',dStyle:'样式表来源',dImage:'图片来源',dFont:'字体来源',dConnect:'fetch、XHR 和 WebSocket 来源',dMedia:'音频和视频来源',dFrame:'嵌入框架来源',dObject:'插件对象来源',dWorker:'Worker 来源',dManifest:'Web 应用清单来源',dBase:'基础 URL 限制',dForm:'表单提交目标',dAncestors:'允许嵌入此页面的来源',
    step1:'从严格策略开始，只启用应用需要的指令。',step2:'为每个启用的指令输入允许的来源表达式。',step3:'先使用仅报告模式观察违规，再强制执行新策略。',step4:'为服务器复制 HTTP 响应头；无法配置响应头时可复制 meta 标签。'
  }
});
const { $, copyText, t } = GZ;
const directives=[
  {key:'default-src',label:'default-src',desc:'dDefault'}, {key:'script-src',label:'script-src',desc:'dScript'}, {key:'style-src',label:'style-src',desc:'dStyle'}, {key:'img-src',label:'img-src',desc:'dImage'}, {key:'font-src',label:'font-src',desc:'dFont'}, {key:'connect-src',label:'connect-src',desc:'dConnect'}, {key:'media-src',label:'media-src',desc:'dMedia'}, {key:'frame-src',label:'frame-src',desc:'dFrame'}, {key:'object-src',label:'object-src',desc:'dObject'}, {key:'worker-src',label:'worker-src',desc:'dWorker'}, {key:'manifest-src',label:'manifest-src',desc:'dManifest'}, {key:'base-uri',label:'base-uri',desc:'dBase'}, {key:'form-action',label:'form-action',desc:'dForm'}, {key:'frame-ancestors',label:'frame-ancestors',desc:'dAncestors'}
];
const strictPolicy={
  'default-src':"'self'",'script-src':"'self'",'style-src':"'self'",'img-src':"'self' data: https:",'font-src':"'self' data: https:",'connect-src':"'self'",'object-src':"'none'",'base-uri':"'self'",'form-action':"'self'",'frame-ancestors':"'self'"
};
let currentPolicy={value:'',headerName:'Content-Security-Policy',errors:[]};
function buildRows(){
  const list=$('#directive-list');
  directives.forEach(d=>{
    const row=document.createElement('div'); row.className='csp-row';
    const name=document.createElement('label'); name.className='csp-name'; name.title=t(d.desc);
    const toggle=document.createElement('input'); toggle.type='checkbox'; toggle.dataset.directive=d.key; toggle.setAttribute('aria-label',d.label);
    const code=document.createElement('code'); code.textContent=d.label;
    name.append(toggle,code);
    const source=document.createElement('input'); source.className='csp-source'; source.type='text'; source.dataset.source=d.key; source.placeholder="'self' https://cdn.example.com"; source.disabled=true; source.setAttribute('aria-label',d.label+' sources');
    toggle.addEventListener('change',()=>{source.disabled=!toggle.checked;renderPolicy();}); source.addEventListener('input',renderPolicy);
    row.append(name,source); list.append(row);
  });
}
function getPolicy(){
  const parts=[],errors=[];
  directives.forEach(d=>{
    const enabled=document.querySelector(`[data-directive="${d.key}"]`).checked;
    if(!enabled) return;
    const raw=document.querySelector(`[data-source="${d.key}"]`).value.trim();
    const values=raw ? raw.split(/\s+/).filter(Boolean) : [];
    if(!values.length){errors.push(d.label+': '+t('empty'));return;}
    if(values.includes("'none'")&&values.length>1){errors.push(d.label+': '+t('noneMix'));return;}
    if(values.some(v=>/[;\r\n]/.test(v))){errors.push(d.label+': '+t('badSource'));return;}
    parts.push(d.key+' '+values.join(' '));
  });
  const headerName=$('#report-only').checked?'Content-Security-Policy-Report-Only':'Content-Security-Policy';
  if(!parts.length&&!errors.length) errors.push(t('empty'));
  return {value:parts.join('; '),headerName,errors};
}
function renderPolicy(){
  currentPolicy=getPolicy(); const out=$('#csp-output'),status=$('#status');
  if(currentPolicy.errors.length){out.textContent='';status.textContent=currentPolicy.errors.join(' ');status.className='csp-status error';return;}
  out.textContent=currentPolicy.headerName+':\n'+currentPolicy.value;
  const warnings=[];
  if($('#report-only').checked||currentPolicy.value.includes('frame-ancestors')) warnings.push(t('metaWarning'));
  status.textContent=warnings.join(' ');status.className='csp-status'+(warnings.length?' warn':'');
}
function applyStrict(){
  directives.forEach(d=>{const enabled=document.querySelector(`[data-directive="${d.key}"]`),source=document.querySelector(`[data-source="${d.key}"]`),value=strictPolicy[d.key]||'';enabled.checked=Boolean(value);source.disabled=!value;source.value=value;});
  $('#report-only').checked=false;renderPolicy();
}
function clearPolicy(){directives.forEach(d=>{const enabled=document.querySelector(`[data-directive="${d.key}"]`),source=document.querySelector(`[data-source="${d.key}"]`);enabled.checked=false;source.disabled=true;source.value='';});$('#report-only').checked=false;renderPolicy();}
function copyHeader(){if(currentPolicy.errors.length)return;copyText(currentPolicy.headerName+': '+currentPolicy.value);$('#status').textContent=t('copiedHeader');$('#status').className='csp-status';}
function copyValue(){if(currentPolicy.errors.length)return;copyText(currentPolicy.value);$('#status').textContent=t('copiedValue');$('#status').className='csp-status';}
function copyMeta(){if(currentPolicy.errors.length)return;copyText('<meta http-equiv="Content-Security-Policy" content="'+currentPolicy.value.replace(/"/g,'&quot;')+'">');$('#status').textContent=t('copiedMeta')+' '+t('metaWarning');$('#status').className='csp-status warn';}
buildRows();
$('#toolbar').innerHTML='<button class="gz-btn" type="button" id="copy-header"></button><button class="gz-btn gz-btn-secondary" type="button" id="copy-value"></button><button class="gz-btn gz-btn-secondary" type="button" id="copy-meta"></button>';
$('#copy-header').textContent=t('copyHeader');$('#copy-value').textContent=t('copyValue');$('#copy-meta').textContent=t('copyMeta');$('#report-only-label').textContent=t('reportOnly');$('#strict-preset').textContent=t('strict');$('#clear-policy').textContent=t('clear');$('#policy-note').textContent=t('note');$('#output-label').textContent=t('outputLabel');
$('#report-only').addEventListener('change',renderPolicy);$('#strict-preset').addEventListener('click',applyStrict);$('#clear-policy').addEventListener('click',clearPolicy);$('#copy-header').addEventListener('click',copyHeader);$('#copy-value').addEventListener('click',copyValue);$('#copy-meta').addEventListener('click',copyMeta);
applyStrict();
GZ.renderToolPage({category:'dev',titleKey:'toolTitle',descKey:'toolDesc',howToSteps:['step1','step2','step3','step4'],related:[{icon:'shield',href:'/dev/security-headers-generator.html',name:'Security Headers Generator'},{icon:'lock',href:'/dev/csp-evaluator.html',name:'CSP Evaluator'},{icon:'globe',href:'/dev/http-headers.html',name:'HTTP Headers'},{icon:'file',href:'/dev/nginx-config.html',name:'Nginx Config'}]});
</script>
