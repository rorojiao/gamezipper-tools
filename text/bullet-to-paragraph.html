    lblTone: '语气', lblLength: '长度',
    tones: ['正式', '随意', '学术', '营销'],
    convert: '📝 转换', example: '📋 示例', copy: '📋 复制', clear: '🗑 清空',
    placeholder: '• 第一个要点\n• 第二个要点\n• 第三个要点',
    empty: '点击「转换」查看段落。',
    copied: '已复制！',
    statBullets: '要点数', statSentences: '句子数', statWords: '字数', statAvgLen: '平均句长',
    step1: '将项目符号粘贴到输入框，每行一个', step2: '选择语气：正式、随意、学术或营销', step3: '选择长度：短（约1倍）、中（约1.5倍）或长（约2.5倍）', step4: '点击「转换」将列表转为段落', step5: '点击「复制」将段落复制到剪贴板',
  }
});

const OPENER_BY_TONE = {
  Formal: [
    'First and foremost,', 'To begin,', 'In essence,', 'Generally speaking,', 'It is important to note that',
  ],
  Casual: ['So,', 'The thing is,', 'Basically,', 'Look,', 'Honestly,'],
  Academic: ['Research indicates that', 'It has been observed that', 'According to the literature,', 'Studies show that'],
  Marketing: [
    'Looking to learn more?', 'Here is what makes the difference —', 'What sets this apart is that', 'In short,',
  ],
};

const CONNECTOR_BY_TONE = {
  Formal: ['Furthermore,', 'Moreover,', 'In addition,', 'Equally important,', 'Beyond this,'],
  Casual: ['Plus,', 'And then,', 'On top of that,', 'Also,', 'Not to mention,'],
  Academic: ['Furthermore,', 'Additionally,', 'Moreover,', 'Subsequently,', 'This is complemented by the fact that'],
  Marketing: ['Even better,', 'What is more,', 'On top of that,', 'And here is the kicker —', 'Better yet,'],
};

const TRANSITION_BY_TONE = {
  Formal: ['Additionally,', 'Similarly,', 'In the same vein,', 'It is also worth noting that'],
  Casual: ['And,', 'Also,', 'Then there is,', 'Plus,'],
  Academic: ['Furthermore,', 'Likewise,', 'This is paralleled by', 'In a similar manner,'],
  Marketing: ['Equally important,', 'And that is not all —', 'Here is something else to consider:', 'Beyond that,'],
};

const CLOSER_BY_TONE = {
  Formal: ['Taken together, these factors form a coherent picture.', 'In sum, this represents a meaningful consideration.', 'Ultimately, the evidence points to a clear conclusion.'],
  Casual: ['And that pretty much covers it.', 'So there you have it.', 'That is the gist of it.'],
  Academic: ['These findings collectively support the overall conclusion.', 'This synthesis provides important context.', 'The combined evidence thus offers a fuller understanding.'],
  Marketing: [
    'So why wait? Try it out and see the difference yourself.',
    'Ready to get started? The choice is yours.',
    'Take the next step and see what you have been missing.',
  ],
};

const LENGTH_BOOST = { short: 0, medium: 1, long: 2 };

function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function rand() { return Math.random(); }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function stripBullet(line) {
  return line.replace(/^\s*([-*•·–—►▪◦○●■□✓✔→★\*]|\d+[.)]|[\[(]\d+[\])]])\s*/, '').trim();
}

function parseBullets(text) {
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(stripBullet).filter(Boolean);
}

function expandBullet(bullet, tone) {
  let out = bullet.replace(/^(.+?)([.!?]?)$/, '$1').trim();
  if (!out) return '';
  out = cap(out); // Ensure first letter is capitalized
  if (!/[.!?]$/.test(out)) out += '.';
  // Insert a supporting phrase for long mode
  const detail = {
    Formal: ' This is a meaningful observation in its own right.',
    Casual: ' Which honestly makes a big difference.',
    Academic: ' This finding is consistent with related work in the area.',
    Marketing: ' And that is exactly why people keep coming back.',
  }[tone];
  return out;
}

function bulletsToParagraph(bullets, tone, length) {
  if (!bullets.length) return '';
  const expanded = bullets.map(b => expandBullet(b, tone));
  const opener = pick(OPENER_BY_TONE[tone]);
  const closer = pick(CLOSER_BY_TONE[tone]);
  const boost = LENGTH_BOOST[length] || 0;

  const parts = [];
  // First bullet, prefaced with opener (lowercase the first letter of the bullet for natural flow)
  parts.push(`${opener} ${expanded[0].charAt(0).toLowerCase() + expanded[0].slice(1)}`);
  // Middle bullets joined with connectors (rotate)
  for (let i = 1; i < expanded.length - 1; i++) {
    const conn = i % 2 === 0 ? pick(TRANSITION_BY_TONE[tone]) : pick(CONNECTOR_BY_TONE[tone]);
    // Capitalize the start of each connector sentence to look like a new sentence
    parts.push(`${conn} ${expanded[i]}`);
  }
  // Last bullet before closer
  if (expanded.length > 1) {
    const last = expanded[expanded.length - 1];
    parts.push(last);
  }
  // Optionally insert extra supporting sentences for medium / long
  if (boost >= 1 && expanded.length >= 2) {
    const extra1 = {
      Formal: 'Each of these points contributes to the broader argument in a distinct way.',
      Casual: 'Each one of these things actually matters when you stop and think about it.',
      Academic: 'These observations, taken together, form a coherent analytical framework.',
      Marketing: 'Every one of these features is designed to give you an edge.',
    }[tone];
    parts.push(extra1);
  }
  if (boost >= 2 && expanded.length >= 3) {
    const extra2 = {
      Formal: 'A careful examination of each element reveals additional depth and nuance.',
      Casual: 'Honestly, there is even more to it once you dig in.',
      Academic: 'Further investigation along these lines is likely to yield additional insight.',
      Marketing: 'Plus there is a whole lot more to discover once you get going.',
    }[tone];
    parts.push(extra2);
  }
  parts.push(closer);
  let para = parts.join(' ');
  // Cleanup: collapse double spaces, fix capitalization
  para = para.replace(/\s{2,}/g, ' ').replace(/([a-z])(\s+)([A-Z])/g, (m, a, sp, b) => a + '. ' + b);
  // Fix ", ,"
  para = para.replace(/,\s*,/g, ',').replace(/\s+([,.])/g, '$1');
  // Ensure first letter is capital
  para = cap(para.trim());
  // Ensure ends with punctuation
  if (!/[.!?]$/.test(para)) para += '.';
  return para;
}

const TONE_KEYS = ['Formal', 'Casual', 'Academic', 'Marketing'];

const { $, copyText, t } = GZ;

function updateStats(bulletCount, paragraph) {
  const words = paragraph.trim().split(/\s+/).filter(Boolean).length;
  const sents = (paragraph.match(/[.!?]+/g) || []).length || 1;
  const avgLen = (words / sents).toFixed(1);
  $('#bpStats').innerHTML = `
    <div class="bp-stat"><span>${t('statBullets')}</span><strong>${bulletCount}</strong></div>
    <div class="bp-stat"><span>${t('statSentences')}</span><strong>${sents}</strong></div>
    <div class="bp-stat"><span>${t('statWords')}</span><strong>${words}</strong></div>
    <div class="bp-stat"><span>${t('statAvgLen')}</span><strong>${avgLen}</strong></div>
  `;
}

function doConvert() {
  const raw = $('#input').value;
  const toneKey = $('#toneSel').value || TONE_KEYS[$('#toneSel').selectedIndex] || 'Formal';
  const length = $('#lengthSel').value;
  const bullets = parseBullets(raw);
  if (!bullets.length) {
    $('#bpOutput').textContent = '';
    $('#bpSummary').innerHTML = '';
    $('#bpStats').innerHTML = '';
    return;
  }
  const para = bulletsToParagraph(bullets, toneKey, length);
  $('#bpOutput').textContent = para;
  const lang = GZI18n.getLang();
  $('#bpSummary').innerHTML = lang === 'zh'
    ? `已将 <strong>${bullets.length}</strong> 个要点转为 <strong>${toneKey}</strong> 风格的段落。`
    : `Converted <strong>${bullets.length}</strong> bullets to a <strong>${toneKey}</strong> paragraph.`;
  updateStats(bullets.length, para);
}

function doCopy() {
  const text = $('#bpOutput').textContent;
  if (!text) return;
  copyText(text);
  $('#copyBtn').textContent = '✅ ' + t('copied');
  setTimeout(() => { $('#copyBtn').textContent = '📋 ' + (GZI18n.getLang() === 'zh' ? '复制' : 'Copy'); }, 1200);
}

function doClear() {
  $('#input').value = '';
  $('#bpOutput').textContent = '';
  $('#bpSummary').innerHTML = '';
  $('#bpStats').innerHTML = '';
}

function loadExample() {
  $('#input').value = '- Easy drag-and-drop interface\n- Real-time collaboration with team members\n- 100+ pre-built templates\n- Cloud sync across all devices\n- Free tier with no credit card required';
  doConvert();
}

// populate tone select
const toneSel = $('#toneSel');
['en', 'zh'].forEach(l => {
  const list = (GZI18n._data[l] || {}).tones;
  if (list && list.length) {
    toneSel.innerHTML = list.map((label, i) => {
      const key = l === 'zh' ? TONE_KEYS[i] : label;
      return `<option value="${key}">${label}</option>`;
    }).join('');
  }
});

$('#convertBtn').addEventListener('click', doConvert);
$('#copyBtn').addEventListener('click', doCopy);
$('#clearBtn').addEventListener('click', doClear);
$('#exampleBtn').addEventListener('click', loadExample);

    {icon: '🔁', href: '/text/text-paraphraser.html', name: 'Text Paraphraser'},
  ],
});
</script>
