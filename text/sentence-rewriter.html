    step1: '在输入框中输入或粘贴需要改写的句子', step2: '选择适合读者群体的语气（正式、随意、自信、友好、学术、说服）', step3: '选择 3、5 或 7 个改写数量，然后点击「改写」', step4: '点击改写旁边的复制图标即可复制到剪贴板', step5: '将改写粘贴到邮件、论文或求职信中，再根据需要微调',
  }
});

const OPENERS = {
  Formal: ['In essence,', 'It is worth noting that', 'Generally speaking,', 'One should consider that', 'It can be argued that', 'According to common practice,', 'As a matter of course,', 'In this context,'],
  Casual: ['Honestly,', 'You know,', 'Look,', 'Basically,', 'I mean,', 'The thing is,', 'Here\'s the deal —', 'To be real,'],
  Confident: ['Clearly,', 'Without a doubt,', 'It is certain that', 'The fact remains that', 'Make no mistake —', 'There is no question that', 'Undeniably,', 'It is obvious that'],
  Friendly: ['You know what,', 'Honestly,', 'I think', 'Here\'s something I noticed —', 'By the way,', 'Just so you know,', 'In my experience,', 'Hope this helps —'],
  Academic: ['Research suggests that', 'It has been observed that', 'According to the literature,', 'This implies that', 'The evidence indicates that', 'Studies have shown that', 'It is widely accepted that', 'In academic discourse,'],
  Persuasive: ['Consider this —', 'Imagine if', 'The truth is,', 'Think about it —', 'Here\'s why:', 'Picture this:', 'You deserve to know that', 'It\'s time to recognize that']
};

const CONNECTORS = {
  Formal: ['therefore', 'furthermore', 'consequently', 'in addition', 'moreover', 'as a result', 'subsequently'],
  Casual: ['so', 'but', 'and honestly', 'plus', 'still', 'either way', 'basically'],
  Confident: ['without question', 'period', 'and that\'s final', 'hands down', 'no doubt', 'for sure', 'plain and simple'],
  Friendly: ['by the way', 'also', 'and you know what', 'plus', 'and honestly', 'too', 'still'],
  Academic: ['thus', 'hence', 'thereby', 'accordingly', 'in this regard', 'subsequently', 'as a result'],
  Persuasive: ['because', 'since', 'after all', 'which means', 'and that\'s why', 'so', 'the result is']
};

const SYNONYMS = {
  // verb swaps
  'make': ['create', 'produce', 'build', 'develop'],
  'get': ['obtain', 'receive', 'acquire', 'gain'],
  'use': ['utilize', 'employ', 'apply', 'leverage'],
  'show': ['demonstrate', 'reveal', 'display', 'illustrate'],
  'think': ['believe', 'consider', 'feel', 'reckon'],
  'say': ['state', 'mention', 'declare', 'express'],
  'tell': ['inform', 'notify', 'advise', 'explain'],
  'help': ['assist', 'support', 'aid', 'facilitate'],
  'find': ['discover', 'locate', 'uncover', 'identify'],
  'give': ['provide', 'offer', 'supply', 'deliver'],
  'take': ['accept', 'receive', 'claim', 'gather'],
  'see': ['observe', 'notice', 'witness', 'spot'],
  'know': ['understand', 'recognize', 'realize', 'acknowledge'],
  'want': ['desire', 'wish', 'prefer', 'seek'],
  'need': ['require', 'demand', 'necessitate', 'call for'],
  'try': ['attempt', 'endeavor', 'strive', 'aim'],
  'start': ['begin', 'commence', 'initiate', 'kick off'],
  'end': ['finish', 'conclude', 'complete', 'wrap up'],
  'go': ['proceed', 'travel', 'head', 'advance'],
  // noun swaps
  'problem': ['issue', 'challenge', 'difficulty', 'concern'],
  'idea': ['concept', 'thought', 'notion', 'suggestion'],
  'thing': ['item', 'matter', 'object', 'element'],
  'way': ['method', 'approach', 'means', 'manner'],
  'people': ['individuals', 'persons', 'folks', 'everyone'],
  'work': ['labour', 'effort', 'task', 'project'],
  'job': ['position', 'role', 'occupation', 'employment'],
  'company': ['firm', 'business', 'organization', 'enterprise'],
  'team': ['group', 'crew', 'unit', 'squad'],
  'plan': ['strategy', 'scheme', 'blueprint', 'approach'],
  'reason': ['cause', 'factor', 'motive', 'grounds'],
  'result': ['outcome', 'consequence', 'effect', 'product'],
  'goal': ['objective', 'aim', 'target', 'purpose'],
  'message': ['note', 'communication', 'dispatch', 'memo'],
  // adjective swaps
  'good': ['excellent', 'great', 'fine', 'positive'],
  'bad': ['poor', 'subpar', 'negative', 'unfavorable'],
  'big': ['large', 'substantial', 'significant', 'major'],
  'small': ['minor', 'modest', 'compact', 'slight'],
  'important': ['crucial', 'vital', 'essential', 'significant'],
  'easy': ['simple', 'straightforward', 'effortless', 'smooth'],
  'hard': ['difficult', 'challenging', 'tough', 'demanding'],
  'fast': ['quick', 'rapid', 'swift', 'speedy'],
  'slow': ['gradual', 'unhurried', 'leisurely', 'sluggish']
};

const CONNECTOR_PHRASES = {
  Formal: [', therefore, ', ', furthermore, ', ', consequently, ', ', in addition, ', ', moreover, ', ', as a result, ', ', subsequently, '],
  Casual: [', so ', ', but ', ', and honestly ', ', plus ', ', still ', ', either way, ', ', basically, '],
  Confident: [' — without question — ', ', period. ', ', hands down. ', ', no doubt, ', ', for sure, ', ', plain and simple. ', ' — and that\'s final. '],
  Friendly: [', by the way, ', ', also, ', ', and you know what, ', ', plus ', ', and honestly, ', ', too, ', ', still, '],
  Academic: [', thus, ', ', hence, ', ', thereby, ', ', accordingly, ', ', in this regard, ', ', subsequently, ', ', as a result, '],
  Persuasive: [' — because ', ' — since ', ' — after all, ', ', which means ', ', and that\'s why ', ', so ', ', the result is ']
};

const { $, copyText, t } = GZ;

function tokenize(s) {
  return s.match(/\b[\w']+\b|[^\s\w]+|\s+/g) || [];
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function swapSynonyms(text) {
  // 30% chance per word to swap, skip very short tokens
  return text.split(/(\b\w+\b)/).map((chunk, i) => {
    if (i % 2 === 1) {
      const lower = chunk.toLowerCase();
      if (SYNONYMS[lower] && chunk.length >= 4) {
        // 30% chance
        if (Math.random() < 0.3) {
          const opts = SYNONYMS[lower];
          const swap = pick(opts);
          // preserve capitalization
          if (chunk[0] === chunk[0].toUpperCase()) {
            return swap.charAt(0).toUpperCase() + swap.slice(1);
          }
          return swap;
        }
      }
    }
    return chunk;
  }).join('');
}

function rewriteOnce(text, tone) {
  const trimmed = text.trim();
  if (!trimmed) return '';
  let out = trimmed;

  // 1) Synonym swap
  out = swapSynonyms(out);

  // 2) Add an opener (50% chance, only if sentence is reasonably long)
  if (out.length > 20 && Math.random() < 0.5) {
    const opener = pick(OPENERS[tone]);
    // Don't add opener if it already starts with one
    const startsWithOpener = OPENERS[tone].some(o => out.toLowerCase().startsWith(o.toLowerCase().slice(0, 6)));
    if (!startsWithOpener) {
      out = opener + ' ' + out.charAt(0).toLowerCase() + out.slice(1);
    }
  }

  // 3) Insert a connector phrase in the middle (40% chance)
  if (out.length > 30 && Math.random() < 0.4) {
    const tokens = out.split(/(\s+)/);
    if (tokens.length > 6) {
      const mid = Math.floor(tokens.length / 2);
      const conn = pick(CONNECTOR_PHRASES[tone]);
      tokens[mid] = conn + tokens[mid].trimStart();
      out = tokens.join('');
    }
  }

  // 4) Ensure it ends with punctuation
  if (!/[.!?]$/.test(out)) out += '.';

  return out;
}

function generateRewrites(sentence, count, tone) {
  const seen = new Set([sentence.trim().toLowerCase()]);
  const rewrites = [];
  let attempts = 0;
  while (rewrites.length < count && attempts < count * 6) {
    attempts++;
    const r = rewriteOnce(sentence, tone);
    const key = r.toLowerCase().replace(/[^a-z0-9]/g, '');
    if (r && !seen.has(key) && r.trim() !== sentence.trim()) {
      seen.add(key);
      rewrites.push(r);
    }
  }
  return rewrites;
}

function render(rewrites, tone) {
  const wrap = $('#srOutput');
  if (!rewrites.length) {
    wrap.innerHTML = `<div class="sr-empty">${t('empty')}</div>`;
    return;
  }
  wrap.innerHTML = rewrites.map((r, i) => `
    <div class="sr-card">
      <div class="text">${escapeHtml(r)}</div>
      <button class="copy" data-i="${i}" title="${t('copied')}">📋</button>
    </div>
  `).join('');
  wrap.querySelectorAll('.copy').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = +btn.dataset.i;
      copyText(rewrites[idx]);
      btn.textContent = '✅';
      setTimeout(() => { btn.textContent = '📋'; }, 1200);
    });
  });
  const summaryFn = t('summary');
  if (typeof summaryFn === 'function') {
    $('#srSummary').innerHTML = summaryFn(rewrites.length, tone);
  } else {
    $('#srSummary').innerHTML = `Generated <strong>${rewrites.length}</strong> rewrites in <strong>${tone}</strong> tone.`;
  }
}

function doRewrite() {
  const sentence = $('#input').value.trim();
  const tone = $('#toneSel').value;
  const count = parseInt($('#countSel').value, 10);
  if (!sentence) {
    $('#srOutput').innerHTML = `<div class="sr-empty">${t('empty')}</div>`;
    $('#srSummary').innerHTML = '';
    return;
  }
  const rewrites = generateRewrites(sentence, count, tone);
  render(rewrites, tone);
}

function loadExample() {
  $('#input').value = 'I wanted to tell you that the report we worked on last week has some important information that you should read.';
  doRewrite();
}

function doClear() {
  $('#input').value = '';
  $('#srOutput').innerHTML = '';
  $('#srSummary').innerHTML = '';
}

// populate tone select
const toneSel = $('#toneSel');
['en', 'zh'].forEach(l => {
  const tones = (GZI18n._data[l] || {}).tones || [];
  if (tones.length) {
    toneSel.innerHTML = tones.map((tone, i) => `<option value="${['Formal','Casual','Confident','Friendly','Academic','Persuasive'][i] || tone}">${tone}</option>`).join('');
  }
});

$('#rewriteBtn').addEventListener('click', doRewrite);
$('#exampleBtn').addEventListener('click', loadExample);
$('#clearBtn').addEventListener('click', doClear);
$('#input').addEventListener('input', () => { if (!$('#srOutput').firstChild) return; });

</script>
