/* ---- shared curl parser (mirrors curl-to-go) ---- */
function tokenizeCurl(input){
  const raw = input.replace(/^\s*curl\s+/i,'').replace(/\\\n/g,' ').replace(/\\\r\n/g,' ').trim();
  const tokens=[]; let cur=''; let q=null;
  for(let i=0;i<raw.length;i++){
    const c=raw[i];
    if(q){ if(c===q){q=null;continue;} cur+=c; }
    else if(c==='"'||c==="'"){q=c;}
    else if(c===' '||c==='\t'||c==='\n'||c==='\r'){ if(cur){tokens.push(cur);cur='';} }
    else {cur+=c;}
  }
  if(cur)tokens.push(cur);
  return tokens;
}
function parseCurl(input){
  const r={url:'',method:null,headers:{},data:null,cookies:null,user:null,insecure:false,location:false};
  const toks=tokenizeCurl(input);
  for(let i=0;i<toks.length;i++){
    const a=toks[i];
    const next=()=>toks[++i];
    if(a==='-X'||a==='--request'){r.method=next();continue;}
    if(a==='-H'||a==='--header'){const h=next();const idx=h.indexOf(':');if(idx>-1){r.headers[h.slice(0,idx).trim()]=h.slice(idx+1).trim();}continue;}
    if(a==='-d'||a==='--data'||a==='--data-raw'||a==='--data-binary'||a==='--data-ascii'){r.data=next();continue;}
    if(a==='--data-urlencode'){r.data=(r.data?r.data+'&':'')+next();continue;}
    if(a==='-b'||a==='--cookie'){r.cookies=next();continue;}
    if(a==='-u'||a==='--user'){r.user=next();continue;}
    if(a==='-A'||a==='--user-agent'){r.headers['User-Agent']=next();continue;}
    if(a==='-e'||a==='--referer'){r.headers['Referer']=next();continue;}
    if(a==='-L'||a==='--location'){r.location=true;continue;}
    if(a==='-k'||a==='--insecure'){r.insecure=true;continue;}
    if(a==='-I'||a==='--head'){r.method='HEAD';continue;}
    if(a==='--url'){r.url=next();continue;}
    if(a.startsWith('-')){ continue; }
    if(!r.url && (a.startsWith('http://')||a.startsWith('https://')||a.startsWith('www.')||a.startsWith('$'))){r.url=a.replace(/^\$/,'');continue;}
    if(!r.url && /^[a-z0-9.-]+\.[a-z]{2,}/i.test(a)){r.url='https://'+a;continue;}
    if(!r.url){r.url=a;}
  }
  return r;
}

/* ---- helpers ---- */
function rustStr(s){
  s = String(s);
  return '"' + s.replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\n/g,'\\n').replace(/\r/g,'\\r').replace(/\t/g,'\\t') + '"';
}
function indent(s, n){
  const pad = ' '.repeat(n);
  return s.split('\n').map(l => pad + l).join('\n');
}

/* Detect if the body is JSON (object/array); used to choose .json() vs .body() */
function detectJsonBody(data){
  if (data == null) return false;
  const s = data.trim();
  if (!s) return false;
  if ((s.startsWith('{') && s.endsWith('}')) || (s.startsWith('[') && s.endsWith(']'))) {
    try { JSON.parse(s); return true; } catch(e) { return false; }
  }
  return false;
}

/* Split URL into base + query params (returns {base, query:[[k,v]]}) */
function splitUrl(url){
  const qi = url.indexOf('?');
  if (qi < 0) return { base: url, query: [] };
  const base = url.slice(0, qi);
  const qs = url.slice(qi + 1);
  const out = [];
  qs.split('&').forEach(part => {
    if (!part) return;
    const eq = part.indexOf('=');
    if (eq < 0) out.push([decodeURIComponent(part), '']);
    else out.push([decodeURIComponent(part.slice(0, eq)), decodeURIComponent(part.slice(eq + 1))]);
  });
  return { base, query: out };
}

/* Rust code generator */
function genRust(c){
  const method = (c.method || (c.data !== null ? 'POST' : 'GET')).toUpperCase();
  const url = c.url || 'https://api.example.com/endpoint';
  const headers = {...c.headers};
  if (c.cookies && !headers['Cookie']) headers['Cookie'] = c.cookies;
  const { base, query } = splitUrl(url);

  /* First pass: collect derived metadata about the body so we can emit correct Rust. */
  let bodyKind = 'none';   // 'json' | 'jsonRaw' | 'file' | 'text' | 'none'
  let jsonKeys = [];
  let jsonParsed = null;
  if (c.data !== null) {
    if (detectJsonBody(c.data)) {
      try {
        const p = JSON.parse(c.data);
        if (p && typeof p === 'object' && !Array.isArray(p)) {
          jsonParsed = p;
          jsonKeys = Object.keys(p);
        }
      } catch(e) {}
      bodyKind = jsonKeys.length ? 'json' : 'jsonRaw';
    } else if (c.data.startsWith('@')) {
      bodyKind = 'file';
    } else {
      bodyKind = 'text';
    }
  }

  const L = [];
  /* Header */
  L.push('// Generated by GameZipper cURL → Rust converter');
  L.push('// Add to Cargo.toml:');
  L.push('//   reqwest   = { version = "0.12", features = ["json"] }');
  L.push('//   tokio     = { version = "1",     features = ["full"] }');
  L.push('//   serde     = { version = "1",     features = ["derive"] }');
  L.push('//   serde_json = "1"');
  L.push('');
  L.push('use reqwest::header::{HeaderMap, HeaderValue};');
  L.push('use serde::Serialize;');
  L.push('');

  /* Payload struct (only if we have a typed JSON object body) */
  if (bodyKind === 'json') {
    L.push('#[derive(Serialize)]');
    L.push('struct Payload {');
    L.push('    #[serde(skip_serializing_if = "Option::is_none")]');
    jsonKeys.forEach(k => {
      L.push('    ' + k + ': Option<serde_json::Value>,');
    });
    L.push('}');
    L.push('');
  }

  L.push('#[tokio::main]');
  L.push('async fn main() -> Result<(), Box<dyn std::error::Error>> {');
  L.push('    let url = ' + rustStr(base) + ';');

  /* query params */
  if (query.length) {
    L.push('    let mut query: Vec<(&str, &str)> = Vec::new();');
    query.forEach(([k, v]) => {
      L.push('    query.push((' + rustStr(k) + ', ' + rustStr(v) + '));');
    });
    L.push('');
  }

  /* headers map */
  if (Object.keys(headers).length) {
    L.push('    let mut headers = HeaderMap::new();');
    for (const k of Object.keys(headers)) {
      L.push('    headers.insert(' + rustStr(k) + ', HeaderValue::from_static(' + rustStr(headers[k]) + '));');
    }
    L.push('');
  }

  /* client builder */
  L.push('    let mut client_builder = reqwest::Client::builder()');
  L.push('        .user_agent("curl/8.0");');
  if (c.location) {
    L.push('    client_builder = client_builder.redirect(reqwest::redirect::Policy::limited(10));');
  }
  if (c.insecure) {
    L.push('    client_builder = client_builder.danger_accept_invalid_certs(true);');
  }
  L.push('    let client = client_builder.build()?;');
  L.push('');

  /* request builder — assemble a single fluent chain */
  const m = method.toLowerCase();
  const chain = ['    let mut req = client.' + m + '(url)'];
  if (query.length) chain.push('        .query(&query)');
  if (Object.keys(headers).length) chain.push('        .headers(headers)');

  if (bodyKind === 'json') {
    chain.push('        .json(&Payload {');
    jsonKeys.forEach(k => {
      const v = jsonParsed[k];
      if (typeof v === 'string') {
        chain.push('            ' + k + ': Some(serde_json::Value::String(' + rustStr(v) + ')),');
      } else if (typeof v === 'number') {
        chain.push('            ' + k + ': Some(serde_json::json!(' + v + ')),');
      } else if (typeof v === 'boolean') {
        chain.push('            ' + k + ': Some(serde_json::Value::Bool(' + (v ? 'true' : 'false') + ')),');
      } else {
        chain.push('            ' + k + ': Some(serde_json::json!(' + JSON.stringify(v) + ')),');
      }
    });
    chain.push('        })');
  } else if (bodyKind === 'jsonRaw') {
    chain.push('        .json(&serde_json::from_str::<serde_json::Value>(' + rustStr(c.data) + ')?)');
  } else if (bodyKind === 'file') {
    chain.push('        .body(std::fs::read(' + rustStr(c.data.slice(1)) + ')?)');
  } else if (bodyKind === 'text') {
    chain.push('        .body(String::from(' + rustStr(c.data) + '))');
  }

  if (c.user) {
    const parts = c.user.split(':');
    const u = parts[0] || '';
    const p = parts.slice(1).join(':') || '';
    chain.push('        .basic_auth(' + rustStr(u) + ', Some(' + rustStr(p) + '))');
  }

  chain.push('        .build()?;');
  chain.forEach(line => L.push(line));

  L.push('');
  L.push('    let resp = client.execute(req).await?;');
  L.push('    let status = resp.status();');
  L.push('    let body = resp.text().await?;');
  L.push('    println!("{}", status);');
  L.push('    println!("{}", body);');
  L.push('    Ok(())');
  L.push('}');
  return L.join('\n');
}

function convert(){
  const inp = $('#input').value.trim();
  if(!inp){$('#output').textContent='';$('#status').innerHTML='';return;}
  let c;
  try{ c = parseCurl(inp); }catch(e){ $('#output').textContent='';$('#status').innerHTML='<span style="color:var(--gz-accent)">⚠ '+e.message+'</span>'; return; }
  const code = genRust(c);
  $('#output').textContent = code;
  const parts=[];
  if(c.method)parts.push(c.method);
  if(c.user)parts.push('🔐 Basic Auth');
  if(c.data!==null)parts.push('📦 body');
  if(Object.keys(c.headers).length)parts.push(Object.keys(c.headers).length+' header(s)');
  const qcount = splitUrl(c.url||'').query.length;
  if(qcount)parts.push('🔗 '+qcount+' query param(s)');
  $('#status').innerHTML='<span style="color:var(--gz-success)">✓ '+t('lblOut')+(parts.length?' — '+parts.join(' · '):'')+'</span>';
}
window.convert=convert;

  -H 'Accept: application/json' \\
  -d '{"name":"Alice","email":"alice@example.com","role":"admin"}' \\
  -L \\
  --compressed`;
  convert();
}
function doClear(){ $('#input').value=''; convert(); }
window.doClear=doClear;

$('#lbl-in').textContent=t('lblIn');
