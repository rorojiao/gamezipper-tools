<script>
GZI18n.register({
  en: {
    toolTitle: 'Follow-Up Email Generator',
    toolDesc: 'Generate polite, professional follow-up emails in seconds. 8 scenarios, smart timing hints and tone control — no signup, runs in your browser.',
    scenarios: {noreply:'No Reply Nudge',aftermeeting:'After Meeting',postinterview:'Post-Interview',invoice:'Invoice Overdue',salescheckin:'Sales Check-in',proposal:'Proposal Bump',deadline:'Deadline Reminder',thanks:'Thank-You + Next Step'},
    dayLbl: 'Follow-up cadence:',
    days: {soft:'2-3 days',medium:'4-5 days',firm:'7-10 days',final:'14 days (final)'},
    tips: {

    step4: 'Click Generate, copy and personalize the opening line',
    fields: {

      sender: 'Your name',
      original: 'Original email subject or topic',
      context: 'What happened / what is needed',
      ask: 'Your specific ask (next step)',

      extra: 'Extra context (optional)'
    },
    ph: {

      original: 'e.g. Q3 partnership proposal',
      context: 'e.g. We spoke at the SaaS conference on Oct 12. You mentioned the budget cycle closes next month.',

      company: 'e.g. Acme Corp',

    }
  },
  zh: {
    toolTitle: '跟进邮件生成器',
    toolDesc: '秒级生成专业、得体的跟进邮件。8 大场景、智能节奏提示、语气可调 — 无需注册、浏览器本地运行。',
    scenarios: {noreply:'未回复提醒',aftermeeting:'会后跟进',postinterview:'面试后跟进',invoice:'逾期账单',salescheckin:'销售回访',proposal:'提案跟进',deadline:'截止日期提醒',thanks:'感谢+下一步'},
    dayLbl: '跟进节奏：',
    days: {soft:'2-3 天',medium:'4-5 天',firm:'7-10 天',final:'14 天（最终）'},
    tips: {
      noreply: '提示：每次都要补充新价值 — 一篇相关文章、一个新角度或更尖锐的问题。单纯"再问一下"会被归档。',
      aftermeeting: '提示：24 小时内发送，趁热打铁。引用对方提到的某个具体细节 — 表明你认真听了。',

      salescheckin: '提示：以洞察或价值开场，而不是"有进展吗？"。一个相关案例能重新锚定对话。',
      proposal: '提示：直击沉默异议 — 预算、时机或决策人。问一个直接问题逼出真答案，而非拖延。',
      deadline: '提示：表达协助（"需要解卡吗？"）而非施压。明确截止日和未完成的后果。',
      thanks: '提示：感谢信是回复率最高的邮件类型。会议后 4 小时内发送。提及一个具体成果并提出具体下一步。'
    },
    gen: '生成跟进邮件',
    copy: '复制',
    clear: '清空',
    step1: '选择匹配你情况的场景',
    step2: '选择跟进节奏（温和提醒 vs 强势提醒）',
    step3: '填写收件人、上下文和具体细节 — 谈了什么、欠什么、你想要的下一步',
    step4: '点击生成、复制、根据需要个性化调整',
    fields: {
      recipient: '收件人姓名',
      sender: '您的姓名',
      original: '原邮件主题或话题',
      context: '发生了什么 / 需要什么',
      ask: '你的具体要求（下一步）',
      company: '公司名（可选）',
      extra: '额外说明（可选）'
    },
    ph: {
      recipient: '如：王总',
      sender: '如：李经理',
      original: '如：Q3 合作提案',
      context: '如：我们在 10 月 12 日的 SaaS 大会上聊过，您提到预算周期下月关闭。',
      ask: '如：本周 15 分钟通话讨论试点范围',
      company: '如：Acme 公司',
      extra: '如：附上我们讨论的修订版方案'
    }
  }
});

const { $, copyText, t } = GZ;
const $$ = (sel) => Array.from(document.querySelectorAll(sel));

let scenario = 'noreply';
let cadence = 'soft';

const SCENARIOS = ['noreply','aftermeeting','postinterview','invoice','salescheckin','proposal','deadline','thanks'];
const CADENCES = ['soft','medium','firm','final'];

function renderScenarios(){
  const html = '<div class="scn-grid">' + SCENARIOS.map(s =>
    `<div class="scn-btn${s===scenario?' active':''}" data-s="${s}">${t('scenarios.'+s)}</div>`
  ).join('') + '</div>';
  $('#scn-area').innerHTML = html;
  $$('.scn-btn').forEach(b => b.onclick = () => { scenario = b.dataset.s; renderScenarios(); renderForm(); renderTip(); });
}

function renderCadence(){
  const html = `<div style="font-weight:600;margin-bottom:6px;font-size:.88em">${t('dayLbl')}</div>` +
    '<div class="days-row">' + CADENCES.map(c =>
    `<div class="day-chip${c===cadence?' active':''}" data-c="${c}">${t('days.'+c)}</div>`
  ).join('') + '</div>';
  $('#days-row').innerHTML = html;
  $$('.day-chip').forEach(b => b.onclick = () => { cadence = b.dataset.c; renderCadence(); });
}

function renderTip(){ $('#tipBox').textContent = t('tips.' + scenario); }

function renderForm(){
  const fields = ['recipient','sender','original','context','ask','company','extra'];
  $('#form-area').innerHTML = fields.map(f =>
    `<div class="form-group"><label>${t('fields.'+f)}</label><input id="f_${f}" placeholder="${t('ph.'+f)}"></div>`
  ).join('');
}

function openLine(cad){
  const openLines = {
    soft: {
      en: ["Hope you're well — wanted to circle back on", "Quick follow-up on", "Just floating this back to the top of your inbox"],
      zh: ["祝好 — 想回头跟进一下", "简单跟进一下", "把这封邮件再浮到您收件箱顶部"]
    },
    medium: {
      en: ["Following up on", "Checking back in on the", "Touching base again on"],
      zh: ["跟进一下", "回访一下", "再次联系一下"]
    },
    firm: {
      en: ["Following up for the third time on", "Wanting to make sure this didn't slip through —", "Need to lock this in:"],
      zh: ["第三次跟进确认", "确认下这件事没遗漏", "需要锁定一下："]
    },
    final: {
      en: ["Final follow-up before I close the loop on", "Last attempt to reach you on", "Closing the thread unless I hear back by EOD:"],
      zh: ["关闭前最后一次跟进", "最后一次联系", "今天下班前未回复将关闭此线索："]
    }
  };
  const arr = openLines[cad] ? openLines[cad][GZ.lang==='zh'?'zh':'en'] : openLines.soft.en;
  return arr[Math.floor(Math.random()*arr.length)];
}

function buildEmail(){
  const v = id => ($('#f_'+id).value || '').trim();
  const r = v('recipient'), s = v('sender'), o = v('original'), c = v('context'), a = v('ask'), co = v('company'), ex = v('extra');
  const isZh = GZ.lang === 'zh';
  const subj = isZh ? `跟进：${o||'(主题)'} — ${s||'(您的姓名)'}` : `Following up: ${o||'(subject)'} — ${s||'(your name)'}`;
  const greet = r ? (isZh ? `${r} 您好，` : `Hi ${r},`) : (isZh ? '您好，' : 'Hello,');
  const close = isZh ? '期待您的回复。\n此致\n' : 'Looking forward to hearing back.\nBest,\n';
  const sign = s ? s : (isZh ? '李经理' : '[Your name]');
  const org = co ? (isZh ? `（${co}）` : ` (${co})`) : '';
  const ask = a || (isZh ? '希望尽快确认下一步。' : 'Could we confirm next steps this week?');
  const ctx = c || (isZh ? '想确认一下进度。' : 'Wanted to check where things stand.');
  const ext = ex ? (isZh ? `\n\n补充：${ex}` : `\n\nP.S. ${ex}`) : '';

  let body = '';
  if (scenario === 'noreply') {
    body = isZh
      ? `${greet}\n\n${openLine(cadence)}「${o||'(原主题)'}」${org}。\n\n${ctx}\n\n${ask}\n\n${close}${sign}`
      : `${greet}\n\n${openLine(cadence)} "${o||'(original subject)'}"${org}.\n\n${ctx}\n\n${ask}\n\n${close}${sign}`;
  } else if (scenario === 'aftermeeting') {
    body = isZh
      ? `${greet}\n\n感谢今天/昨天的会面，特别聊到「${c||'我们讨论的话题'}」。\n\n整理一下行动项和您提到的「${ask||'下一步'}」，希望能尽快推进${ex?'（'+ex+'）':''}。\n\n${close}${sign}`
      : `${greet}\n\nThanks for the time today/yesterday — especially the discussion on ${c||'what we talked through'}.\n\nRecapping the action items plus your point on ${ask||'next steps'}, and keen to move this forward${ex?' ('+ex+')':''}.\n\n${close}${sign}`;
  } else if (scenario === 'postinterview') {
    body = isZh
      ? `${greet}\n\n非常感谢昨天的面试机会，进一步了解了贵团队的工作。\n\n我对「${o||'该岗位'}」依然非常感兴趣，特别想补充一点：${ask||'我在 X 项目中负责 Y，实现了 Z 成果'}。\n\n如有任何补充材料我可以提供，请随时告诉我。\n\n${close}${sign}`
      : `${greet}\n\nThank you again for the conversation yesterday — really enjoyed learning about the team's work.\n\nI'm still very interested in the ${o||'role'}, and wanted to add one detail I didn't get to share: ${ask||'I led X, delivered Y, measured Z'}.\n\nHappy to send references, writing samples or anything else that would help.\n\n${close}${sign}`;
  } else if (scenario === 'invoice') {
    const days = {soft:'',medium:'(7 天)',firm:'(14 天)',final:'(最终通知)'}[cadence];
    body = isZh
      ? `${greet}\n\n${openLine(cadence)}「${o||'账单号 #INV-XXXX'}」${days}。\n\n${c||'此账单已于约定日期到期，金额仍未到账。'}\n\n${ask||'请确认今日/明日是否已发起付款。'}\n\n如已付讫请忽略此邮件。${ext}\n\n${close}${sign}`
      : `${greet}\n\n${openLine(cadence)} invoice "${o||'#INV-XXXX'}"${days}.\n\n${c||'This invoice is past its due date and the payment has not been received yet.'}\n\n${ask||'Could you confirm whether payment was sent today/yesterday?'}\n\nIf already paid, please disregard.${ext}\n\n${close}${sign}`;
  } else if (scenario === 'salescheckin') {
    body = isZh
      ? `${greet}\n\n${openLine(cadence)}「${o||'我们上次聊的合作'}」。\n\n${c||'想看看目前进展，以及是否有新信息需要我配合。'}\n\n${ask||'本周/下周 15 分钟通话，方便吗？'}\n\n${close}${sign}`
      : `${greet}\n\n${openLine(cadence)} ${o||'our earlier conversation'}.\n\n${c||'Wanted to see where things stand and whether there is anything new I should know.'}\n\n${ask||'Would a 15-min call this week or next work?'}\n\n${close}${sign}`;
  } else if (scenario === 'proposal') {
    body = isZh
      ? `${greet}\n\n${openLine(cadence)}「${o||'我们提交的方案'}」。\n\n${c||'想问一个直接问题：是预算、时机还是内部审批在阻塞？'}\n\n${ask||'如果方便请直接告诉我哪一项，我可以针对性配合。'}\n\n${close}${sign}`
      : `${greet}\n\n${openLine(cadence)} ${o||'the proposal we sent'}.\n\n${c||'Want to ask one direct question: is it budget, timing or internal sign-off that is blocking this?'}\n\n${ask||'If you can tell me which one, I can adapt on my side accordingly.'}\n\n${close}${sign}`;
  } else if (scenario === 'deadline') {
    body = isZh
      ? `${greet}\n\n${openLine(cadence)}「${o||'(任务)'}」。\n\n截止日期是 ${ask||'(具体日期)'}，目前 ${c||'尚未收到您的交付物'}。\n\n如有任何阻碍，请今天告诉我 — 我可以协助或协调延期。\n\n${close}${sign}`
      : `${greet}\n\n${openLine(cadence)} ${o||'the task'}.\n\nThe deadline is ${ask||'(specific date)'}, and as of now ${c||'I have not received your deliverable'}.\n\nIf anything is blocking you, please let me know today — I can help unblock or coordinate an extension.\n\n${close}${sign}`;
  } else if (scenario === 'thanks') {
    body = isZh
      ? `${greet}\n\n感谢今早/昨晚的会面，特别是关于「${c||'我们讨论的项目'}」的共识。\n\n整理出的下一步：${ask||'(具体行动项)'}。${ex||''}\n\n我会在 ${ask||'(具体日期)'} 前完成我这一侧的工作并同步进展。\n\n${close}${sign}`
      : `${greet}\n\nThanks for the call this morning/evening — especially the alignment on ${c||'what we discussed'}.\n\nRecapping the next step: ${ask||'(specific action)'}. ${ex||''}\n\nI will have my side done before ${ask||'(date)'} and will share an update then.\n\n${close}${sign}`;
  }
  return { subj, body };
}

function showOutput(out){
  const isZh = GZ.lang === 'zh';
  const lblSubj = isZh ? '主题：' : 'Subject: ';
  $('#output').innerHTML = `<div style="font-weight:700;margin-bottom:10px;color:var(--gz-accent)">${lblSubj}${escapeHtml(out.subj)}</div><hr style="border:none;border-top:1px solid var(--border);margin:10px 0"><div style="white-space:pre-wrap">${escapeHtml(out.body)}</div><div style="margin-top:12px"><button class="primary" onclick="copyOut()">${t('copy')}</button> <button class="secondary" onclick="clearAll()">${t('clear')}</button></div>`;
}

function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

window.copyOut = function(){
  const txt = $('#output').innerText;
  copyText(txt);
};
window.clearAll = function(){
  ['recipient','sender','original','context','ask','company','extra'].forEach(f => { $('#f_'+f).value = ''; });
  $('#output').innerHTML = '';
};

function init(){
  renderScenarios();
  renderCadence();
  renderTip();
  renderForm();
  $('#btnGen').textContent = t('gen');
  $('#btnGen').className = 'primary';
  $('#btnGen').onclick = () => showOutput(buildEmail());

  // How-to + related
  const steps = ['step1','step2','step3','step4'].map(s => `<li>${t(s)}</li>`).join('');
  document.querySelector('.gz-howto ol').innerHTML = steps;

  if (GZ.renderRelated) {
    GZ.renderRelated({
      category: 'text',
      title: 'Related tools',
      excludeId: 'follow-up-email-generator',
      max: 12
    });
  }
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
</script>
