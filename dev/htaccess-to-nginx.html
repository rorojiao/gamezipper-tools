const { $, copyText, t } = GZ;

/* ---------------- Apache variable -> nginx variable ---------------- */
const VAR_MAP = [
  [/^%\{REQUEST_FILENAME\}$/i, '$request_filename'],
  [/^%\{REQUEST_URI\}$/i, '$request_uri'],
  [/^%\{REQUEST_METHOD\}$/i, '$request_method'],
  [/^%\{QUERY_STRING\}$/i, '$args'],
  [/^%\{HTTPS\}$/i, '$https'],
  [/^%\{HTTP_HOST\}$/i, '$http_host'],
  [/^%\{SERVER_NAME\}$/i, '$server_name'],
  [/^%\{SERVER_PORT\}$/i, '$server_port'],
  [/^%\{SERVER_ADDR\}$/i, '$server_addr'],
  [/^%\{REMOTE_ADDR\}$/i, '$remote_addr'],
  [/^%\{DOCUMENT_ROOT\}$/i, '$document_root'],
  [/^%\{HTTP_REFERER\}$/i, '$http_referer'],
  [/^%\{HTTP_USER_AGENT\}$/i, '$http_user_agent'],
  [/^%\{HTTP_COOKIE\}$/i, '$http_cookie'],
  [/^%\{HTTP:(.+)\}$/i, (m) => '$http_' + m[1].toLowerCase().replace(/-/g, '_')],
  [/^%\{ENV:(.+)\}$/i, (m) => '$' + m[1].toLowerCase()],
];

function mapVar(token) {
  for (const [re, to] of VAR_MAP) {
    const m = token.match(re);
    if (m) return typeof to === 'function' ? to(m) : to;
  }
  return null;
}

function mapVars(str) {
  return str.replace(/%\{[^}]+\}/g, (tok) => {
    const v = mapVar(tok);
    return v === null ? tok : v;
  });
}

/* ---------------- RewriteCond -> nginx condition expression ---------------- */
function mapCond(raw, conds) {
  let s = raw.trim();

  // Trailing Apache flag such as [NC] applies to this condition
  let nc = false;
  s = s.replace(/\[(.*?)\]\s*$/, function (_m, inner) {
    inner.split(',').forEach(function (tok) {
      if (tok.trim().toUpperCase() === 'NC') nc = true;
      else conds.push('RewriteCond flag [' + tok.trim() + '] has no nginx equivalent - review manually');
    });
    return '';
  }).trim();

  // Split "left op value" — left may itself be "-f" style test
  const sp = s.match(/^(\S+)\s+(\S+)(?:\s+(.*))?$/);
  if (!sp) { conds.push('Unsupported RewriteCond: ' + raw.trim()); return null; }

  let left = sp[1];
  let op = sp[2];
  let val = (sp[3] === undefined ? '' : sp[3]).trim().replace(/^["']|["']$/g, '');

  // Form A: operator is a file test (-f / -d / -e / -s / -l, optionally negated "!-f")
  const opFile = op.match(/^(!?)-([fdesl])$/);
  if (opFile) {
    const f = mapVar('%{REQUEST_FILENAME}') || '$request_filename';
    return (opFile[1] ? '!-' : '-') + opFile[2].toLowerCase() + ' ' + f;
  }

  // Form B: left side is a bare file test, e.g. "-f %{REQUEST_FILENAME}"
  const leftFile = left.match(/^(!?)-([fdesl])$/);
  if (leftFile) {
    const f = mapVar('%{REQUEST_FILENAME}') || '$request_filename';
    return (leftFile[1] ? '!-' : '-') + leftFile[2].toLowerCase() + ' ' + f;
  }

  // Form C: variable comparison
  const lhs = mapVar(left);
  if (lhs === null) { conds.push('Unknown server variable in RewriteCond: ' + raw.trim()); return null; }

  const OPERATORS = ['=', '==', '!=', '~', '~*', '!~', '!~*'];
  if (OPERATORS.indexOf(op) === -1) {
    // Bare-word form: "%{HTTPS} off" means the value equals "off"
    // Apache matches CondPattern as a regex, so a leading ^ means regex match.
    if (/^[\^!]/.test(op)) {
      // Apache CondPattern is a regex. "!" negates the whole test and must be preserved.
      const neg = op.charAt(0) === '!';
      const pat = mapVars(neg ? op.slice(1) : op);
      return `${lhs} ${neg ? (nc ? '!~*' : '!~') : (nc ? '~*' : '~')} "${pat}"`;
    }
    const v = mapVars(op);
    // Canonical nginx form for the very common "HTTPS is off" test
    if (lhs === '$https' && /^off$/i.test(v)) return '$https != "on"';
    if (nc && /^[A-Za-z][\w.-]*$/.test(v)) return `${lhs} ~* "^${v}$"`;
    return `${lhs} == "${v}"`;
  }

  const rhs = mapVars(val);

  if (op === '=' || op === '==') return `${lhs} == "${rhs}"`;
  if (op === '!=') return `${lhs} != "${rhs}"`;
  if (op === '~')  return `${lhs} ~ "${rhs}"`;
  if (op === '~*') return `${lhs} ~* "${rhs}"`;
  if (op === '!~') return `${lhs} !~ "${rhs}"`;
  if (op === '!~*') return `${lhs} !~* "${rhs}"`;

  conds.push('Unsupported RewriteCond operator: ' + raw.trim());
  return null;
}

/* ---------------- RewriteRule pattern / substitution ---------------- */
// Apache matches patterns relative to the directory (no leading slash).
// nginx regexes match the full normalised URI, so a leading / is required.
function toNginxPattern(pat) {
  let p = pat.trim();
  if (p === '.') return '^/.*';            // Apache catch-all -> nginx any-path
  if (p === '^(.*)$' || p === '^(.+)$') return '^/$1';
  if (p.startsWith('^')) p = p.slice(1);
  return '^/' + p;
}

function toNginxSubstitution(sub, flags, conds) {
  let s = sub.trim();
  if (s === '-') return null;           // no substitution

  // For redirects (R flag) an absolute URL is kept as-is — nginx "return" accepts it.
  if (s.startsWith('http') && !flags.R) {
    conds.push('Absolute-URL rewrite (' + s + ') - set this up as a separate server block with return 301');
    const m = s.match(/^https?:\/\/[^\/]+(\/.*)$/);
    s = m ? m[1] : '/';
  }
  s = mapVars(s);
  // Apache "&" separator and ?query handling
  if (flags.QSA && s.indexOf('?') === -1) s = s + '?$args';
  return s;
}

function parseFlags(flagStr, conds) {
  const f = { L:false, R:null, F:false, G:false, NC:false, QSA:false, P:false, E:null, T:null, S:null };
  if (!flagStr) return f;
  // Caller may pass either the raw "[L,R=301]" or the already-unwrapped "L,R=301"
  const body = /^\[/.test(flagStr.trim()) ? flagStr : '[' + flagStr + ']';
  body.replace(/\[([^\]]*)\]/g, function (_m, inner) {
    inner.split(',').forEach(function (raw) {
      const tok = raw.trim();
      if (!tok) return;
      const eq = tok.indexOf('=');
      const key = (eq === -1 ? tok : tok.slice(0, eq)).toUpperCase();
      const val = eq === -1 ? null : tok.slice(eq + 1);
      if (key === 'R') f.R = val || '302';
      else if (key === 'S') f.S = val;
      else if (key === 'E') f.E = val;
      else if (key === 'T') f.T = val;
      else if (key === 'L' || key === 'LAST') f.L = true;
      else if (key === 'NC') f.NC = true;
      else if (key === 'QSA') f.QSA = true;
      else if (key === 'P') f.P = true;
      else if (key === 'F' || key === 'FORBIDDEN') f.F = true;
      else if (key === 'G' || key === 'GONE') f.G = true;
      else conds.push('Unrecognised RewriteRule flag [' + tok + ']');
    });
    return '';
  });
  return f;
}

/* ---------------- main converter ---------------- */
function convert(src, serverName) {
  const notes = [];
  const lines = String(src || '').replace(/\r\n?/g, '\n').split('\n');

  const rules = [];        // {conds:[], body:[]}
  let curConds = [];
  let rewriteBase = '/';
  let ifModuleDepth = 0;

  const headers = [];
  const expires = [];
  const errorPages = [];
  const gzipTypes = [];
  const other = [];
  let indexFiles = null;
  let hasRewriteEngine = false;
  let ruleCount = 0, directiveCount = 0;

  function pushRule(condExprs, bodyLines) {
    rules.push({ conds: condExprs, body: bodyLines });
  }

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trim();
    if (!line) continue;
    if (line.charAt(0) === '#') continue;
    directiveCount++;

    // block tags
    const tag = line.match(/^<\/?([A-Za-z]+)([^>]*)>$/);
    if (tag) {
      const name = tag[1].toLowerCase();
      const closing = line.charAt(1) === '/';
      if (name === 'ifmodule') { ifModuleDepth += closing ? -1 : 1; }
      else if (name === 'files' || name === 'directory' || name === 'location' || name === 'virtualhost') {
        notes.push('<' + tag[1] + '> block skipped - nginx scopes directives differently, move them into a location block manually');
      }
      continue;
    }

    const m = line.match(/^(\S+)\s*(.*)$/);
    if (!m) continue;
    const dir = m[1].toLowerCase();
    const rest = m[2].trim();

    switch (dir) {
      case 'rewriteengine':
        hasRewriteEngine = true;
        break;

      case 'rewritebase':
        rewriteBase = rest.replace(/\/?$/, '/');
        break;

      case 'optionset':
      case 'options': {
        if (/(^|\s)-Indexes(\s|$)/i.test(rest)) { other.push({ k: 'autoindex', v: 'off' }); }
        else if (/(^|\s)Indexes(\s|$)/i.test(rest)) { other.push({ k: 'autoindex', v: 'on' }); }
        if (/FollowSymLinks/i.test(rest) && !/-FollowSymLinks/i.test(rest)) {
          other.push({ k: 'disable_symlinks', v: 'off' });
        }
        const rest2 = rest.replace(/(^|\s)(-\w+|MultiViews|FollowSymLinks|ExecCGI|Includes)(\s|$)/gi, ' ');
        if (rest2.trim()) notes.push('Options ' + rest2.trim() + ' has no nginx equivalent - review manually');
        break;
      }

      case 'directoryindex':
        indexFiles = rest.split(/\s+/).filter(Boolean).join(' ');
        break;

      case 'rewritecond': {
        if (ifModuleDepth > 0 && !hasRewriteEngine) break;
        const c = mapCond(rest, notes);
        if (c) curConds.push(c);
        break;
      }

      case 'rewriterule': {
        if (ifModuleDepth > 0 && !hasRewriteEngine) break;
        ruleCount++;
        const parts = rest.match(/^(\S+)\s+(\S+)(\s*\[(.*?)\])?$/);
        if (!parts) { notes.push('Could not parse RewriteRule: ' + rest); curConds = []; break; }
        const pat = parts[1], sub = parts[2];
        const flags = parseFlags(parts[4], notes);
        const rhs = toNginxSubstitution(sub, flags, notes);

        // SPA / front-controller pattern: !-f + !-d + catch-all rewrite
        const isFileNeg = curConds.some(c => c === '!-f $request_filename');
        const isDirNeg = curConds.some(c => c === '!-d $request_filename');
        const isCatchAll = pat === '.' || pat === '.*' || pat === '^(.*)$';

        if (isFileNeg && isDirNeg && isCatchAll && flags.L && !flags.R && !flags.F && !flags.G && rhs) {
          const target = rhs.replace(/\?.*$/, '');
          pushRule([], ['    try_files $uri $uri/ ' + target + '?$args;']);
          curConds = [];
          break;
        }

        if (flags.F) { pushRule(curConds, ['    return 403;']); curConds = []; break; }
        if (flags.G) { pushRule(curConds, ['    return 410;']); curConds = []; break; }
        if (flags.R) { pushRule(curConds, ['    return ' + flags.R + ' ' + rhs + ';']); curConds = []; break; }
        if (flags.P) { notes.push('RewriteRule with [P] proxy flag -> needs a proxy_pass block with upstream headers, set up manually'); curConds = []; break; }
        if (rhs === null) {
          // "- [L]" means "stop rewriting here", nginx equivalent is try_files / location
          notes.push('RewriteRule ' + pat + ' - [' + (parts[4] || 'L') + '] has no nginx rewrite equivalent - it means "serve this path directly", handled by try_files above or by a location block');
          curConds = [];
          break;
        }

        const ngxPat = toNginxPattern(pat);
        const action = flags.L ? 'last' : 'break';
        if (flags.T) other.push({ k: 'default_type', v: flags.T });
        if (flags.E) notes.push('RewriteRule env flag [E=' + flags.E + '] -> set the variable manually with: set $' + flags.E.split(':')[0] + ' (if you still need it)');
        pushRule(curConds, ['    rewrite "' + ngxPat + '" "' + rhs + '" ' + action + ';']);
        curConds = [];
        break;
      }

      case 'rewritecondlast':
      case 'endrewriterule':
        break;

      case 'redirect':
      case 'redirectmatch': {
        const parts = rest.match(/^(?:(\d{3}))?\s*(\S+)(?:\s+(\S+))?$/);
        if (parts) {
          const code = parts[1] || '302';
          const from = parts[2], to = parts[3];
          if (dir === 'redirectmatch' || /^[\^\!]/.test(from)) {
            notes.push(dir === 'RedirectMatch' ? 'Redirect ' + from + ' - add a location ~ regex block with a return ' + code + ' inside it' : 'Redirect ' + from + ' - handled');
          } else if (to) {
            if (parts[1]) {
              pushRule([], ['    location ' + from + ' {', '        return ' + code + ' ' + to + ';', '    }']);
            } else {
              pushRule([], ['    location ' + from + ' {', '        return ' + code + ' ' + to + ';', '    }']);
            }
            ruleCount++;
          } else {
            pushRule([], ['    location ' + from + ' {', '        return ' + code + ';', '    }']);
            ruleCount++;
          }
        }
        curConds = [];
        break;
      }

      case 'errordocument': {
        const p = rest.match(/^(\d{3})\s+(.+)$/);
        if (p) errorPages.push({ code: p[1], uri: p[2].trim() });
        else notes.push('ErrorDocument ' + rest + ' - unsupported form');
        break;
      }

      case 'header': {
        // Header always set X-Frame-Options "SAMEORIGIN"
        const p = rest.match(/^(always\s+)?(set|append|add|unset)\s+(.+)$/i);
        if (p) {
          const always = /always/i.test(p[1] || '');
          const action = p[2].toLowerCase();
          const restQ = p[3].match(/^("[^"]+"|\S+)\s+(.*)$/);
          if (restQ) {
            if (action === 'unset') notes.push('Header unset ' + restQ[1] + ' -> remove the matching add_header line manually');
            else headers.push({ name: restQ[1].replace(/"/g, ''), value: restQ[2].replace(/^"|"$/g, ''), always: always });
          }
        }
        break;
      }

      case 'expires':
        if (/^off$/i.test(rest)) other.push({ k: 'expires', v: 'off' });
        else other.push({ k: 'expires', v: 'max' });
        break;

      case 'expiresbytype': {
        const p = rest.match(/^(\S+)\s+(-?\d+)$/);
        if (p) expires.push({ type: p[1], sec: p[2] });
        break;
      }

      case 'addtype': {
        const p = rest.match(/^(\S+)\s+(.+)$/);
        if (p) other.push({ k: 'types-add', v: p[1] + ' ' + p[2].trim() });
        break;
      }

      case 'addtypecharset':
      case 'adddefaultcharset':
        notes.push(dir + ' ' + rest + ' -> set "charset" in the right-hand type or use add_header Content-Type');
        break;

      case 'addoutputfilterbytype':
      case 'addoutputfilter': {
        const p = rest.match(/^(\S+)\s+(.+)$/i);
        if (p && /^deflate$/i.test(p[1])) {
          const types = p[2].split(/\s+/).filter(Boolean);
          types.forEach(x => { if (gzipTypes.indexOf(x) === -1) gzipTypes.push(x); });
        } else {
          notes.push('AddOutputFilterByType ' + rest + ' -> nginx filters are byte-level, review manually');
        }
        break;
      }

      case 'mod_deflate':
      case 'deflatefilter':
        notes.push('mod_deflate section -> use gzip_types below with gzip on;');
        break;

      case 'mod_expires':
      case 'expire_module':
        break;

      case 'deny':
      case 'allow':
      case 'require': {
        if (/^all\s+denied$/i.test(rest) || (/^from\s+all$/i.test(rest) && dir === 'deny')) {
          pushRule([], ['    # ' + dir + ' ' + rest + ' -> "deny all;" inside a location block']);
        } else if (dir === 'allow' && /^from\s+all$/i.test(rest)) {
          other.push({ k: 'satisfy', v: 'any' });
        } else {
          notes.push(dir + ' ' + rest + ' -> use nginx auth_basic or allow/deny inside a location block');
        }
        break;
      }

      case 'authtype':
      case 'authname':
      case 'authuserfile':
      case 'require valid-user':
      case 'htpasswd':
        notes.push('Apache password protection (' + dir + ') -> nginx: auth_basic "' + (dir === 'authname' ? rest : 'Restricted"') + '; auth_basic_user_file /etc/nginx/.htpasswd;');
        break;

      case 'sslrequiressl':
        pushRule([], ['    # SSLRequireSSL -> return 301 https://$host$request_uri;']);
        notes.push('SSLRequireSSL -> add: return 301 https://$host$request_uri; (inside the port 80 server block)');
        break;

      case 'sslcertificate':
      case 'sslprotocols':
      case 'sslcertificatekey':
        notes.push(dir + ' -> configure TLS in the server block, not in a per-directory file');
        break;

      case 'setenv':
      case 'setenvif':
      case 'setenvifnocase':
        notes.push(dir + ' ' + rest + ' -> nginx: fastcgi_param ' + (rest.split(/\s+/)[0]) + ' ' + (rest.split(/\s+/)[1] || '""') + ';');
        break;

      case 'php_flag':
      case 'php_value':
        notes.push(dir + ' ' + rest + ' -> nginx: fastcgi_param.' + dir.replace(/^php_/, '') + ' "' + rest.split(/\s+/).slice(1).join(' ') + '";');
        break;

      case 'rewritemap':
        notes.push('RewriteMap has no nginx equivalent - use a map {} block in the http context');
        break;

      case 'useragent':
      case 'referer':
      case 'remotehost':
      case 'filesmatch':
      case 'addhandler':
      case 'servername':
      case 'servertokens':
      case 'defaulttype':
        if (dir === 'servername') notes.push('Apache ServerName ' + rest + ' -> nginx: server_name ' + rest + ';');
        else notes.push(dir + ' ' + rest + ' -> no per-directory nginx equivalent, move into a location block');
        break;

      case 'gzip':
      case 'deflate':
        other.push({ k: 'gzip', v: 'on' });
        break;

      default:
        notes.push('Unrecognised directive "' + dir + '" - review manually');
    }
  }

  if (curConds.length) notes.push('Trailing RewriteCond without a RewriteRule was ignored');

  /* ---- assemble ---- */
  const L = [];
  L.push('# Generated from .htaccess by tools.gamezipper.com');
  L.push('# Review every line before deploying, then run: nginx -t');
  L.push('');
  L.push('server {');
  L.push('    listen 80;');
  L.push('    listen [::]:80;');
  L.push('    server_name ' + serverName + ';');
  L.push('');

  const uniqHeaders = [];
  headers.forEach(h => {
    const key = h.name.toLowerCase();
    if (uniqHeaders.some(x => x.key === key)) return;
    uniqHeaders.push({ key: key, name: h.name, value: h.value, always: h.always });
  });

  if (uniqHeaders.length) {
    L.push('    # --- security / custom headers (from Apache Header set) ---');
    uniqHeaders.forEach(h => L.push('    add_header ' + h.name + ' "' + h.value + '"' + (h.always ? ' always' : '') + ';'));
    L.push('');
  }

  if (gzipTypes.length) {
    L.push('    # --- compression (from mod_deflate) ---');
    L.push('    gzip on;');
    L.push('    gzip_vary on;');
    L.push('    gzip_min_length 256;');
    L.push('    gzip_types ' + gzipTypes.join(' ') + ';');
    L.push('');
  }

  if (expires.length) {
    L.push('    # --- caching (from ExpiresByType) ---');
    L.push('    location ~* \\.(' + expires.map(e => e.type.replace(/^\./, '')).filter(Boolean).join('|') + ')$ {');
    L.push('        expires ' + (expires[0].sec === '0' ? 'off' : expires[0].sec) + ';');
    L.push('        add_header Cache-Control "' + (expires[0].sec === '0' ? 'no-store' : 'public') + '";');
    L.push('    }');
    L.push('');
  }

  const autoindex = other.filter(o => o.k === 'autoindex');
  if (autoindex.length) {
    L.push('    autoindex ' + autoindex[0].v + ';');
    L.push('');
  }

  const addTypes = other.filter(o => o.k === 'types-add');
  if (addTypes.length) {
    L.push('    # --- mime types (from AddType) ---');
    L.push('    types {');
    addTypes.forEach(o => {
      const seg = o.v.split(/\s+/);
      L.push('        ' + seg[0] + ' ' + seg.slice(1).join(' ') + ';');
    });
    L.push('    }');
    L.push('');
  }

  const defaultType = other.find(o => o.k === 'default_type');
  if (defaultType) L.push('    default_type ' + defaultType.v + ';');

  if (errorPages.length) {
    L.push('');
    L.push('    # --- error pages (from ErrorDocument) ---');
    errorPages.forEach(e => L.push('    error_page ' + e.code + ' ' + e.uri + ';'));
  }

  const locationRules = rules.filter(r => r.body.some(b => /^\s+location\s/.test(b)));
  const inLocation = rules.filter(r => !r.body.some(b => /^\s+location\s/.test(b)));

  L.push('');
  L.push('    root /var/www/html;');
  L.push('    index ' + (indexFiles || 'index.html index.php') + ';');
  L.push('');
  L.push('    location / {');

  if (inLocation.length) {
    inLocation.forEach(r => {
      if (r.conds.length) {
        L.push('        if (' + r.conds.join(' && ') + ') {');
        r.body.forEach(b => L.push('    ' + b));
        L.push('        }');
      } else {
        r.body.forEach(b => L.push(b));
      }
    });
  } else {
    L.push('        # paste converted rules here');
  }

  L.push('    }');
  L.push('');

  if (locationRules.length) {
    L.push('    # --- location blocks (from Redirect) ---');
    locationRules.forEach(r => r.body.forEach(b => L.push(b)));
    L.push('');
  }

  L.push('    # --- HTTPS (add after verifying with: nginx -t) ---');
  L.push('    # return 301 https://$host$request_uri;');
  L.push('}');

  return { config: L.join('\n'), notes: notes, rules: ruleCount, directives: directiveCount };
}

/* ---------------- wiring ---------------- */
let stats = { rules: 0, notes: 0 };

function render() {
  const src = $('#input').value;
  if (!src.trim()) {
    $('#output').value = '';
    $('#notes').innerHTML = '<div class="none">' + t('errEmpty') + '</div>';
    $('#stats').innerHTML = '';
    return;
  }
  const server = ($('#serverName').value || 'example.com').trim();
  const r = convert(src, server);
  $('#output').value = r.config;
  stats = { rules: r.rules, notes: r.notes.length };
  renderStats(r);
  renderNotes(r.notes);
}

function renderStats(r) {
  $('#stats').innerHTML =
    '<span><b>' + r.rules + '</b> ' + t('statRules') + '</span>' +
    '<span><b>' + r.directives + '</b> ' + t('statDirectives') + '</span>' +
    '<span><b>' + r.notes.length + '</b> ' + t('statNotes') + '</span>';
}

function renderNotes(notes) {
  if (!notes.length) {
    $('#notes').innerHTML = '<div class="none">' + t('notesNone') + '</div>';
    return;
  }
  $('#notes').innerHTML = '<ol>' + notes.map(n => '<li>' + escapeHtml(n) + '</li>').join('') + '</ol>';
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function initToolbar() {
  $('#toolbar').innerHTML =
    '<button class="gz-btn" type="button" id="copyOut"></button>' +
    '<button class="gz-btn gz-btn-secondary" type="button" id="copyNotes"></button>' +
    '<button class="gz-btn gz-btn-secondary" type="button" id="dlBtn"></button>' +
    '<button class="gz-btn gz-btn-secondary" type="button" id="clearBtn"></button>';

  $('#copyOut').textContent = t('copyOut');
  $('#copyOut').addEventListener('click', function () { copyText($('#output').value); });
  $('#copyNotes').textContent = t('copyNotes');
  $('#copyNotes').addEventListener('click', function () {
    const lis = $('#notes').querySelectorAll('li');
    if (!lis.length) return;
    copyText(Array.prototype.map.call(lis, function (li) { return '- ' + li.textContent; }).join('\n'));
  });
  $('#dlBtn').textContent = t('download');
  $('#dlBtn').addEventListener('click', function () {
    const blob = new Blob([$('#output').value], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'nginx.conf';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });
  $('#clearBtn').textContent = t('clearIn');
  $('#clearBtn').addEventListener('click', function () { $('#input').value = ''; render(); });

  $('#preset').addEventListener('change', function () {
    const v = $('#preset').value;
    if (v === 'empty') { $('#input').value = ''; }
    else { $('#input').value = PRESETS[v]; }
    render();
  });

  $('#hIn').textContent = t('hIn');
  $('#hOut').textContent = t('hOut');
  $('#hNotes').textContent = t('hNotes');
  $('#lblPreset').textContent = t('lblPreset');
  $('#lblServer').textContent = t('lblServer');

  let timer = null;
  $('#input').addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(render, 120);
  });
  $('#serverName').addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(render, 200);
  });
}

initToolbar();
$('#input').value = PRESETS.wordpress;
render();
