<script>
var { $, copyText, t } = GZ;

function fact(n){var r=1;for(var i=2;i<=n;i++)r*=i;return r;}
function pmf(lam,k){return Math.pow(lam,k)*Math.exp(-lam)/fact(k);}
function fmt(x){
  if(x>=0.001)return x.toFixed(6).replace(/0+$/,'').replace(/\.$/,'');
  return x.toExponential(4);
}

function run(){
  var o=$('#out');
  var ls=$('#lambda').value.trim(), k1s=$('#k1').value.trim(), k2s=$('#k2').value.trim();
  var kind=$('#kind').value;
  if(!ls||!k1s||(kind==='between'&&!k2s)){o.className='pd-out show';o.innerHTML='<div class="pd-err">'+t('errEmpty')+'</div>';return;}
  var lam=parseFloat(ls), k1=parseInt(k1s,10), k2=parseInt(k2s,10);
  if(!(lam>0)||!isFinite(lam)||isNaN(k1)||k1<0||String(k1)!==k1s.trim()||(kind==='between'&&(isNaN(k2)||k2<0))){
    o.className='pd-out show';o.innerHTML='<div class="pd-err">'+t('errNum')+'</div>';return;}
  if(kind==='between'&&k2<k1){o.className='pd-out show';o.innerHTML='<div class="pd-err">'+t('errRange')+'</div>';return;}
  var maxK=Math.max(k1,kind==='between'?k2:0,Math.ceil(lam)+5,10);
  if(maxK>170)maxK=170;
  var probs=[],cum=0;
  for(var i=0;i<=maxK;i++){var p=pmf(lam,i);probs.push(p);cum+=p;}
  var prob=0,label='';
  if(kind==='eq'){prob=probs[k1];label='P(X = '+k1+')';}
  else if(kind==='le'){var c=0;for(i=0;i<=Math.min(k1,maxK);i++)c+=probs[i];prob=c;label='P(X ≤ '+k1+')';}
  else if(kind==='ge'){var c2=0;for(i=0;i<Math.min(k1,maxK+1);i++)c2+=probs[i];prob=1-c2;label='P(X ≥ '+k1+')';}
  else{var c3=0;for(i=k1;i<=Math.min(k2,maxK);i++)c3+=probs[i];prob=c3;label='P('+k1+' ≤ X ≤ '+k2+')';}
  // step-by-step for the primary k
  var kk=(kind==='between')?k1:k1;
  var powV=Math.pow(lam,kk), expV=Math.exp(-lam), factV=fact(kk);
  var h='<div class="pd-big">'+label+' = <span class="pd-hl">'+fmt(prob)+'</span> <span style="font-size:.8rem;opacity:.7">('+(prob*100).toFixed(3)+'%)</span></div>';
  h+='<div class="pd-formula">'+t('fFormula')+'<br>'+t('fLambda')+' = '+lam+' &nbsp;·&nbsp; '+t('fPow')+' = '+fmt(powV)+' &nbsp;·&nbsp; '+t('fExp')+' = '+fmt(expV)+' &nbsp;·&nbsp; '+t('fFact')+' = '+(kk>170?'…':factV)+'<br>'+t('fDiv')+' = '+fmt(powV)+' × '+fmt(expV)+' ÷ '+(kk>170?'…':factV)+' = <b>'+fmt(pmf(lam,kk))+'</b></div>';
  h+='<div class="pd-stats"><span>'+t('sMean')+' <b>'+lam+'</b></span><span>'+t('sVar')+' <b>'+lam+'</b></span><span>'+t('sSd')+' <b>'+Math.sqrt(lam).toFixed(4)+'</b></span></div>';
  h+='<div style="margin-top:8px"><button class="gz-btn" id="pdCopy">'+t('copy')+'</button></div>';
  h+='<table class="pd-tbl"><thead><tr><th>'+t('tblK')+'</th><th>'+t('tblP')+'</th><th>'+t('tblCum')+'</th></tr></thead><tbody>';
  var run2=0;
  for(i=0;i<=maxK;i++){run2+=probs[i];
    var hl=(kind==='eq'&&i===k1)||(kind==='between'&&i>=k1&&i<=k2)?' class="hl"':'';
    h+='<tr'+hl+'><td>'+i+'</td><td>'+fmt(probs[i])+'</td><td>'+fmt(run2)+'</td></tr>';}
  h+='</tbody></table><div class="pd-note">'+t('noteTable')+'</div>';
  o.className='pd-out show';o.innerHTML=h;
  $('#pdCopy').onclick=function(){copyText(label+' = '+fmt(prob),this);};
}

$('#lblLambda').textContent=t('lblLambda');
$('#btnCalc').textContent=t('btnCalc');
$('#btnSample').textContent=t('sample');
$('#btnCalc').onclick=run;
$('#btnSample').onclick=function(){$('#lambda').value='4';$('#kind').value='eq';$('#k1').value='2';$('#k2').hidden=true;run();};
$('#kind').onchange=function(){$('#k2').hidden=(this.value!=='between');};
$('#lambda').addEventListener('keydown',function(e){if(e.key==='Enter')run();});
$('#k1').addEventListener('keydown',function(e){if(e.key==='Enter')run();});
$('#k2').addEventListener('keydown',function(e){if(e.key==='Enter')run();});

GZ.renderToolPage({

    { icon: '📈', href: '/calc/binomial-distribution-calculator.html', name: 'Binomial Distribution Calculator' }
  ]
});
</script>
