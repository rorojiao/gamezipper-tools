<script>

    convertAll: '全部转换',

const { $, $$, t } = GZ;

let pendingFiles = [];
let convertedFiles = []; // { name, blob, url, originalSize }

$('#quality').addEventListener('input', e => {
  $('#quality-val').textContent = Math.round(e.target.value * 100) + '%';
});

function addFiles(files) {
  for (const f of files) {
    if (/\.(heic|heif)$/i.test(f.name) || f.type === 'image/heic' || f.type === 'image/heif') {
      pendingFiles.push(f);
    }
  }
  renderPending();
}

function renderPending() {
  if (pendingFiles.length === 0 && convertedFiles.length === 0) {
    $('#results').innerHTML = '';
    return;
  }
  let html = '';
  convertedFiles.forEach((c, idx) => {
    const sizeKB = (c.blob.size / 1024).toFixed(1);
    const origKB = (c.originalSize / 1024).toFixed(1);
    html += `<div class="result-card">
      <img src="${c.preview}" alt="${escapeAttr(c.name)}">
      <div class="name">${escapeHtml(c.name)}</div>
      <div class="size">${origKB} KB → ${sizeKB} KB</div>
      <button class="gz-btn" style="font-size:.75em;padding:4px 10px" onclick="downloadOne(${idx})">${t('done')} ↓</button>
    </div>`;
  });
  pendingFiles.forEach((f, idx) => {
    html += `<div class="result-card">
      <div style="height:100px;display:flex;align-items:center;justify-content:center;font-size:2em">📄</div>
      <div class="name">${escapeHtml(f.name)}</div>
      <div class="size">${(f.size / 1024).toFixed(1)} KB — ${t('convert')}?</div>
      <button class="gz-btn gz-btn-secondary" style="font-size:.75em;padding:4px 10px" onclick="convertOne(${idx})">${t('convert')}</button>
    </div>`;
  });
  $('#results').innerHTML = html;
}

// Decode HEIC -> JPEG data URL, return {dataUrl, width, height}
async function decodeHeic(file, quality) {
  const jpeg = await heic2any({ blob: file, toType: 'image/jpeg', quality });
  const url = URL.createObjectURL(jpeg);
  try {
    const img = await new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = rej;
      im.src = url;
    });
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
    canvas.getContext('2d').drawImage(img, 0, 0);
    const dataUrl = canvas.toDataURL('image/jpeg', quality);
    URL.revokeObjectURL(url);
    return { dataUrl, width: img.naturalWidth, height: img.naturalHeight, preview: dataUrl };
  } catch (e) {
    URL.revokeObjectURL(url);
    throw e;
  }
}

function imageToPdfBlob(decoded, quality) {
  const { jsPDF } = window.jspdf;
  // Fit image to A4 (portrait), landscape if image is landscape
  const landscape = decoded.width > decoded.height;
  const pdf = new jsPDF({ unit: 'pt', format: 'a4', orientation: landscape ? 'landscape' : 'portrait' });
  const pw = pdf.internal.pageSize.getWidth();
  const ph = pdf.internal.pageSize.getHeight();
  const margin = 20;
  const scale = Math.min((pw - margin * 2) / decoded.width, (ph - margin * 2) / decoded.height);
  const w = decoded.width * scale, h = decoded.height * scale;
  pdf.addImage(decoded.dataUrl, 'JPEG', (pw - w) / 2, (ph - h) / 2, w, h, undefined, 'FAST');
  return pdf.output('blob');
}

async function convertOne(idx) {
  const file = pendingFiles[idx];
  const cards = $$('.result-card');
  const card = cards[cards.length - (pendingFiles.length - idx)];
  if (card) card.querySelector('button').textContent = t('converting') + '…';
  try {
    const quality = parseFloat($('#quality').value);
    const decoded = await decodeHeic(file, quality);
    const blob = imageToPdfBlob(decoded, quality);
    pendingFiles.splice(idx, 1);
    const url = URL.createObjectURL(blob);
    const newName = file.name.replace(/\.(heic|heif)$/i, '.pdf');
    convertedFiles.push({ name: newName, blob, url, preview: decoded.preview, originalSize: file.size });
    renderPending();
  } catch (e) {
    if (card) card.querySelector('button').textContent = t('error');
    console.error(e);
  }
}

async function convertAll() {
  while (pendingFiles.length > 0) {
    await convertOne(0);
  }
}

// Combine every pending+converted image into ONE multi-page PDF
async function combineAll() {
  const queue = pendingFiles.slice();
  const status = $('#status');
  status.textContent = t('converting') + '…';
  try {
    const quality = parseFloat($('#quality').value);
    const { jsPDF } = window.jspdf;
    let pdf = null;
    const previews = [];
    for (let i = 0; i < queue.length; i++) {
      const decoded = await decodeHeic(queue[i], quality);
      previews.push(decoded.preview);
      const landscape = decoded.width > decoded.height;
      if (!pdf) {
        pdf = new jsPDF({ unit: 'pt', format: 'a4', orientation: landscape ? 'landscape' : 'portrait' });
      } else {
        pdf.addPage('a4', landscape ? 'landscape' : 'portrait');
      }
      const pw = pdf.internal.pageSize.getWidth();
      const ph = pdf.internal.pageSize.getHeight();
      const margin = 20;
      const scale = Math.min((pw - margin * 2) / decoded.width, (ph - margin * 2) / decoded.height);
      const w = decoded.width * scale, h = decoded.height * scale;
      pdf.addImage(decoded.dataUrl, 'JPEG', (pw - w) / 2, (ph - h) / 2, w, h, undefined, 'FAST');
    }
    if (!pdf) { status.textContent = ''; return; }
    const blob = pdf.output('blob');
    pendingFiles = [];
    const url = URL.createObjectURL(blob);
    const total = queue.reduce((s, f) => s + f.size, 0);
    convertedFiles.push({ name: 'heic-combined.pdf', blob, url, preview: previews[0], originalSize: total });
    status.textContent = '';
    renderPending();
  } catch (e) {
    status.textContent = t('error');
    console.error(e);
  }
}

function downloadOne(idx) {
  const c = convertedFiles[idx];
  const a = document.createElement('a');
  a.href = c.url;
  a.download = c.name;
  a.click();
}

function clearAll() {
  convertedFiles.forEach(c => URL.revokeObjectURL(c.url));
  convertedFiles = [];
  pendingFiles = [];
  renderPending();
  $('#status').innerHTML = '';
}

function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s) { return escapeHtml(s).replace(/"/g,'&quot;'); }

// Drag & drop
const dz = $('#dropzone');
dz.addEventListener('click', () => $('#file-input').click());
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
dz.addEventListener('drop', e => {
  e.preventDefault();
  dz.classList.remove('dragover');
  addFiles(e.dataTransfer.files);
});
$('#file-input').addEventListener('change', e => {
  addFiles(e.target.files);
  e.target.value = '';
});

$('#dz-text').textContent = t('dropHere');
$('#lbl-quality').textContent = t('quality') + ':';

$('#toolbar').innerHTML = `
  <button class="gz-btn" onclick="convertAll()">${t('convertAll')}</button>
  <button class="gz-btn" onclick="combineAll()">${t('combine')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="clearAll()">${t('clearAll')}</button>`;

GZ.renderToolPage({
  category: 'convert',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'📱', href:'/convert/heic-to-png.html', name:'HEIC to PNG'},
    {icon:'📸', href:'/image/heic-to-jpg.html', name:'HEIC to JPG'},
    {icon:'🖼️', href:'/image/pdf-to-jpg.html', name:'PDF to JPG'},
    {icon:'🔄', href:'/convert/image-converter.html', name:'Image Converter'},
  ]
});
</script>
