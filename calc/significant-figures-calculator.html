<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"How do you count significant figures?","acceptedAnswer":{"@type":"Answer","text":"All non-zero digits are significant. Zeros between non-zero digits are always significant. Leading zeros (0.0045) are never significant — they only place the decimal. Trailing zeros are significant only if the number contains a decimal point, so 3.50 has 3 sig figs but 3500 has 2."}},{"@type":"Question","name":"Are trailing zeros significant?","acceptedAnswer":{"@type":"Answer","text":"It depends on the decimal point. In 4.00 the two trailing zeros are significant (3 sig figs) because a decimal point is present. In 400 with no decimal point the trailing zeros are placeholders and are not significant (1 sig fig). Writing 400. makes the zeros significant."}},{"@type":"Question","name":"How do I round a number to significant figures?","acceptedAnswer":{"@type":"Answer","text":"Count from the first non-zero digit, keep that many digits, and round the last kept digit by the usual rules (round up if the next digit is 5 or more). Rounding 0.002567 to 2 sig figs gives 0.0026, and 12,345 to 3 sig figs gives 12,300. This calculator does it instantly for 1-10 figures."}},{"@type":"Question","name":"Does this work with scientific notation?","acceptedAnswer":{"@type":"Answer","text":"Yes. In scientific notation every digit of the coefficient is significant. Enter values like 1.5e3 or 6.022e23 and the calculator counts the coefficient digits: 1.5e3 has 2 sig figs, 6.022e23 has 4."}}]}</script>

<script>

    step2: 'See the sig-fig count and a breakdown highlighting each significant digit',

    toolDesc: '统计任意数字的有效数字位数，高亮显示哪些数字有效，并可一键四舍六入到 1–10 位有效数字，支持科学计数法输入。',
    lblNum: '数字',
    lblRound: '保留几位有效数字？',
    countLabel: '有效数字位数',
    digitsLabel: '逐位分析',
    roundedLabel: '四舍五入到',
    sciLabel: '科学计数法',
    paddedLabel: '舍入结果（保留占位零）',
    copy: '复制',
    clear: '清空',
    invalid: '请输入有效数字，例如 0.00450、12300 或 6.022e23',
    noteLeading: '前导零永远不算有效数字；非零数字之间的零始终有效；末尾零只有在带小数点时才计入有效数字。',
    step1: '输入或粘贴一个数字（如 0.00450、12300、6.022e23）',
    step2: '查看有效数字位数，并高亮每一位有效数字',
    step3: '选择需要保留的有效位数（1–10 位）',
    step4: '复制普通或科学计数法形式的舍入结果',

});

const { $, copyText, t } = GZ;

function analyze(raw){
  raw = raw.trim();
  if(!/^[+-]?(\d+(\.\d*)?|\.\d+)([eE][+-]?\d+)?$/.test(raw)) return null;
  const neg = raw.startsWith('-');
  let s = raw.replace(/^[+-]/,'');
  const parts = s.split(/[eE]/);
  const mant = parts[0];
  const hasDot = mant.includes('.');
  const intPart = hasDot ? mant.split('.')[0] : mant;
  const fracPart = hasDot ? (mant.split('.')[1]||'') : '';
  const all = intPart + fracPart; // digit string in positional order
  let f = -1, l = -1;
  for(let i=0;i<all.length;i++){ if(all[i]!=='0'){ if(f<0) f=i; l=i; } }
  let count, endSig;
  if(f<0){ // value is zero
    count = hasDot ? all.length : 1;
    endSig = all.length-1; f = hasDot ? Math.max(all.length-count,0) : 0;
  } else {
    endSig = hasDot ? all.length-1 : l;
    count = endSig - f + 1;
  }
  const digitsHtml = intPart.split('').map((ch,i)=> ch==='0'&&i<f?'<span class="nsig">0</span>':(i>=f&&i<=endSig?'<span class="sig">'+ch+'</span>':'<span class="nsig">'+ch+'</span>')).join('')
    + (hasDot?'<span class="dot">.</span>':'')
    + fracPart.split('').map((ch,i)=>{const j=intPart.length+i; return (j>=f&&j<=endSig)?'<span class="sig">'+ch+'</span>':'<span class="nsig">'+ch+'</span>';}).join('')
    + (parts[1]!==undefined?'<span class="dot">e'+parts[1]+'</span>':'');
  return {neg, num: Number(s)*(neg?-1:1), count, digitsHtml};
}

function sup(n){ const m={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'}; return String(n).split('').map(c=>m[c]||c).join(''); }

function render(){
  const raw = $('#numInput').value;
  const el = $('#result');
  if(!raw.trim()){ el.innerHTML = '<span class="sf-note">'+t('noteLeading')+'</span>'; return; }
  const a = analyze(raw);
  if(!a){ el.innerHTML = '<span class="sf-err">'+t('invalid')+'</span>'; return; }
  const N = parseInt($('#roundN').value,10);
  const prec = a.num===0 ? '0' : a.num.toPrecision(Math.min(N,15));
  let sciStr = '0 × 10⁰';
  if(a.num!==0){
    const e = Math.floor(Math.log10(Math.abs(a.num)));
    const coef = a.num/Math.pow(10,e);
    sciStr = coef.toPrecision(Math.min(N,15)).replace(/\.?0+$/,'') + ' × 10' + sup(e);
  }
  el.innerHTML =
    '<div class="sf-line"><span class="lbl">'+t('countLabel')+'</span><span class="val hi">'+a.count+'</span></div>'+
    '<div class="sf-line"><span class="lbl">'+t('digitsLabel')+'</span><span class="val"><span class="sf-digits">'+a.digitsHtml+'</span></span></div>'+
    '<div class="sf-line"><span class="lbl">'+t('roundedLabel')+' '+N+'</span><span class="val">'+prec+'</span></div>'+
    '<div class="sf-line"><span class="lbl">'+t('sciLabel')+' ('+N+' sf)</span><span class="val">'+sciStr+'</span></div>'+
    '<button class="gz-btn gz-btn-secondary" style="margin-top:12px" onclick="copyText(\''+prec+'\')">'+t('copy')+' '+t('roundedLabel')+'</button>'+
    '<div class="sf-note">'+t('noteLeading')+'</div>';
}

$('#numInput').addEventListener('input',render);
$('#roundN').addEventListener('change',render);
$('#numInput').addEventListener('keydown',e=>{if(e.key==='Enter')render();});
$('#toolbar').innerHTML = `<button class="gz-btn gz-btn-secondary" onclick="$('#numInput').value='';render()">${t('clear')}</button>`;
$('#lbl-num').textContent = t('lblNum');
$('#lbl-round').textContent = t('lblRound');

    {icon:'√',href:'/calc/square-root-calculator.html',name:'Square Root Calculator'},
  ]
});
$('#numInput').value = '0.00450';
render();
</script>
