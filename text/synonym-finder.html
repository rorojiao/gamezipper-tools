const CATEGORIES = [
  {id:"perfect",label:"Perfect Synonyms",icon:"🎯"},
  {id:"near",label:"Near Synonyms",icon:"🔍"},
  {id:"antonyms",label:"Antonyms",icon:"↔️"},
  {id:"related",label:"Related Words",icon:"🧩"}
];
let currentWord = null;
let currentCat = "perfect";

const { $, t } = GZ;

function normalize(s){ return s.toLowerCase().trim().replace(/[^a-z0-9\s-]/g,'').trim(); }

function lookup(word){
  const norm = normalize(word);
  if (!norm) return null;
  if (THESAURUS[norm]) return {raw:norm,data:THESAURUS[norm]};
  // fallback fuzzy: find the first key containing the substring
  for (const k of Object.keys(THESAURUS)) if (k.includes(norm) || norm.includes(k)) return {raw:k,data:THESAURUS[k]};
  return null;
}

function showToast(msg){
  const tt = document.createElement('div');
  tt.className = 'copy-toast';
  tt.textContent = msg;
  document.body.appendChild(tt);
  setTimeout(()=>tt.remove(), 1200);
}

function renderTabs(){
  $('#cat-tabs').innerHTML = CATEGORIES.map(c =>
    `<button data-cat="${c.id}" class="${c.id===currentCat?'active':''}"><span>${c.icon}</span> ${c.label}</button>`
  ).join('');
  $('#cat-tabs').querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      currentCat = b.dataset.cat;
      $('#cat-tabs').querySelectorAll('button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      renderResults();
    });
  });
}

function renderResults(){
  const out = $('#results');
  out.innerHTML = '';
  if (!currentWord) {
    out.innerHTML = `<div class="empty-state"><div class="icon">📖</div><div>Type any word above to discover synonyms and antonyms.</div></div>`;
    return;
  }
  const d = currentWord.data;
  const section = document.createElement('div');
  section.className = 'tabs-section active';
  let words = [], title = '';
  if (currentCat === 'perfect') { words = d.perfect || []; title = 'Perfect Synonyms — exactly interchangeable'; }
  else if (currentCat === 'near') {
    // merge near (these are flat in our dictionary)
    words = d.near || [];
    title = 'Near Synonyms — slightly different nuance';
  }
  else if (currentCat === 'antonyms') { words = d.antonyms || []; title = 'Antonyms — opposites'; }
  else if (currentCat === 'related') { words = d.related || []; title = 'Related Words — compound & derived'; }

  let html = `<h3>${title} <span class="count">${words.length} word${words.length!==1?'s':''}</span></h3>`;
  if (words.length === 0) {
    html += `<div style="color:var(--text2);font-style:italic">No ${currentCat} found for "${currentWord.raw}".</div>`;
  } else {
    html += '<div class="chip-cloud">' + words.map(w =>
      `<span class="chip" data-word="${w}">${w.replace(/'/g,"\\'")}</span>`
    ).join('') + '</div>';
    html += `<div style="margin-top:18px;font-size:.85em;color:var(--text3)">Click any word to look it up, or copy with the ✓ button on hover.</div>`;
  }
  section.innerHTML = html;
  out.appendChild(section);
  // bind chip clicks
  section.querySelectorAll('.chip').forEach(c => {
    c.addEventListener('click', () => {
      const w = c.dataset.word;
      navigator.clipboard?.writeText(w);
      $('#word-input').value = w;
      search(w);
      showToast('✓ Copied: ' + w);
    });
  });
}

function search(rawWord){
  const res = lookup(rawWord);
  if (!res) { currentWord = null; renderResults(); $('#suggestions').classList.remove('show'); return; }
  currentWord = res;
  renderResults();
  $('#suggestions').classList.remove('show');
}

function showSuggestions(q){
  const norm = normalize(q);
  const sugBox = $('#suggestions');
  if (!norm || norm.length < 2) { sugBox.classList.remove('show'); return; }
  const matches = Object.keys(THESAURUS).filter(k => k.startsWith(norm)).slice(0, 8);
  if (!matches.length) { sugBox.classList.remove('show'); return; }
  sugBox.innerHTML = matches.map(m => `<div data-word="${m}">${m}</div>`).join('');
  sugBox.classList.add('show');
  sugBox.querySelectorAll('div').forEach(d => {
    d.addEventListener('click', () => {
      $('#word-input').value = d.dataset.word;
      search(d.dataset.word);
    });
  });
}

renderTabs();

const wi = $('#word-input');
wi.addEventListener('input', e => showSuggestions(e.target.value));
wi.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    search(wi.value);
  } else if (e.key === 'Escape') {
    $('#suggestions').classList.remove('show');
  }
});
document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) $('#suggestions').classList.remove('show');
});
$('#word-input').focus();
