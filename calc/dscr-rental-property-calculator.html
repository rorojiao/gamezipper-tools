const {$,t}=GZ;const ids=['incomeHeading','rentLabel','otherIncomeLabel','vacancyLabel','expensesLabel','priceLabel','loanHeading','loanLabel','rateLabel','termLabel','targetLabel','calculate','example','reset','resultsHeading','annualIncomeLabel','noiLabel','monthlyPaymentLabel','annualDebtLabel','dscrLabel','capRateLabel','maxLoanLabel','faqHeading','faq1q','faq1a','faq2q','faq2a','faq3q','faq3a','faq4q','faq4a'];

const number=id=>Number($('#'+id).value);const money=n=>'$'+(Number.isFinite(n)?n:0).toLocaleString('en-US',{maximumFractionDigits:0});const percent=n=>Number.isFinite(n)?n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+'%':'--';
function pmt(principal,monthlyRate,months){return monthlyRate===0?principal/months:principal*monthlyRate*Math.pow(1+monthlyRate,months)/(Math.pow(1+monthlyRate,months)-1)}
function principalForPayment(payment,monthlyRate,months){if(payment<=0)return 0;return monthlyRate===0?payment*months:payment*(Math.pow(1+monthlyRate,months)-1)/(monthlyRate*Math.pow(1+monthlyRate,months))}
function translate(){ids.forEach(id=>$('#'+id).textContent=t(id));}
function load(values){Object.keys(values).forEach(id=>$('#'+id).value=values[id]);calc();}
function calc(){const raw={rent:number('rent'),other:number('otherIncome'),vacancy:number('vacancy'),expenses:number('expenses'),price:number('price'),loan:number('loan'),rate:number('rate'),term:number('term'),target:number('target')};const invalid=Object.values(raw).some(v=>!Number.isFinite(v))||raw.rent<0||raw.other<0||raw.vacancy<0||raw.vacancy>100||raw.expenses<0||raw.price<0||raw.loan<0||raw.rate<0||raw.term<=0||raw.target<=0;$('#warning').textContent=invalid?t('warningInvalid'):'';if(invalid)return;const effectiveIncome=(raw.rent+raw.other)*12*(1-raw.vacancy/100),noi=effectiveIncome-raw.expenses*12,monthlyRate=raw.rate/1200,months=raw.term*12,monthlyPayment=raw.loan?pmt(raw.loan,monthlyRate,months):0,annualDebt=monthlyPayment*12,dscr=annualDebt>0?noi/annualDebt:NaN,capRate=raw.price>0?noi/raw.price*100:NaN,maxLoan=principalForPayment(Math.max(0,noi/raw.target/12),monthlyRate,months);$('#annualIncome').textContent=money(effectiveIncome);$('#noi').textContent=money(noi);$('#monthlyPayment').textContent=money(monthlyPayment);$('#annualDebt').textContent=money(annualDebt);$('#dscr').textContent=Number.isFinite(dscr)?dscr.toFixed(2):'--';$('#capRate').textContent=percent(capRate);$('#maxLoan').textContent=money(maxLoan);$('#formula').textContent=t('formulaPrefix')+(annualDebt>0?t('formulaResult').replace('{dscr}',dscr.toFixed(2)).replace('{coverage}',dscr.toFixed(2)):t('formulaNoDebt'));}
translate();$('#calculate').onclick=calc;$('#example').onclick=()=>load(defaults);$('#reset').onclick=()=>load({rent:0,otherIncome:0,vacancy:5,expenses:0,price:0,loan:0,rate:7,term:30,target:1.25});GZ.renderToolPage({category:'calc',titleKey:'toolTitle',descKey:'toolDesc',howToSteps:['step1','step2','step3','step4'],related:[{icon:'🏠',href:'/calc/mortgage-calculator/index.html',name:'Mortgage Calculator'},{icon:'🏢',href:'/calc/commercial-loan-calculator.html',name:'Commercial Loan Calculator'},{icon:'💳',href:'/calc/heloc-calculator.html',name:'HELOC Calculator'},{icon:'📈',href:'/calc/investment-calculator.html',name:'Investment Calculator'}]});calc();
