let lastReport='';
function format(key, values){let text=t(key);Object.entries(values||{}).forEach(([name,value])=>{text=text.replace('{'+name+'}',String(value));});return text;}

function yamlError(message,line){const error=new Error(message);error.line=line;throw error;}
function stripComment(line){let quote='';let depth=0;for(let i=0;i<line.length;i++){const char=line[i];if(quote){if(char===quote&&line[i-1]!=='\\')quote='';continue;}if(char==='"'||char==="'"){quote=char;continue;}if(char==='['||char==='{')depth++;else if(char===']'||char==='}')depth--;else if(char==='#'&&depth===0&&(i===0||/\s/.test(line[i-1])))return line.slice(0,i);}return line;}
function findColon(text){let quote='';let depth=0;for(let i=0;i<text.length;i++){const char=text[i];if(quote){if(char===quote&&text[i-1]!=='\\')quote='';continue;}if(char==='"'||char==="'"){quote=char;continue;}if(char==='['||char==='{')depth++;else if(char===']'||char==='}')depth--;else if(char===':'&&depth===0&&(i===text.length-1||/\s/.test(text[i+1])))return i;}return-1;}

function issue(items,level,message){items.push({level,message});}

  const allowedTop=new Set(['name','version','services','networks','volumes','configs','secrets','include']);Object.keys(document).forEach(key=>{if(!allowedTop.has(key)&&!key.startsWith('x-'))issue(items,'warning',format('unknownTop',{key}));});
  if(Object.prototype.hasOwnProperty.call(document,'version'))issue(items,'warning',t('deprecatedVersion'));
  ['networks','volumes','configs','secrets'].forEach(key=>{if(document[key]!==undefined&&!isMap(document[key]))issue(items,'error',format('badTop',{key}));});

    if(!service.image&&!service.build&&!service.extends)issue(items,'error',format('missingImage',{name}));
    if(service.image!==undefined&&typeof service.image!=='string')issue(items,'error',format('badImage',{name}));
    if(typeof service.image==='string'&&(/(^|:)latest$/.test(service.image)||!/[/:@]/.test(service.image)))issue(items,'warning',format('latestImage',{name}));
    if(service.build!==undefined&&typeof service.build!=='string'&&!isMap(service.build))issue(items,'error',format('badBuild',{name}));
    if(service.ports!==undefined){if(!Array.isArray(service.ports))issue(items,'error',format('badPorts',{name}));else service.ports.forEach(port=>validatePort(port,name,items));}
    if(service.environment!==undefined&&!Array.isArray(service.environment)&&!isMap(service.environment))issue(items,'error',format('badEnvironment',{name}));
    if(service.depends_on!==undefined){if(!Array.isArray(service.depends_on)&&!isMap(service.depends_on))issue(items,'error',format('badDepends',{name}));else Object.keys(Array.isArray(service.depends_on)?service.depends_on.reduce((out,target)=>{out[target]=true;return out;},{}):service.depends_on).forEach(target=>{if(!serviceNames.has(target))issue(items,'error',format('unknownDepends',{name,target}));});}

function renderResult(result){
  const errors=result.items.filter(item=>item.level==='error').length;const warnings=result.items.filter(item=>item.level==='warning').length;const summary=$('#summary');summary.textContent=errors?t('invalid'):t('valid');summary.className='compose-summary '+(errors?'invalid':'valid');
  const stats=[[t('services'),result.services],[t('networks'),result.networks],[t('volumes'),result.volumes],[t('errors'),errors],[t('warnings'),warnings]];$('#stats').innerHTML='';stats.forEach(([label,value])=>{const item=document.createElement('span');item.className='compose-stat';item.textContent=label+': '+value;$('#stats').append(item);});
  const list=$('#issues');list.innerHTML='';const visible=result.items.length?result.items:[{level:'info',message:t('parsed')}];visible.forEach(item=>{const row=document.createElement('li');row.className='compose-issue '+item.level;row.textContent=item.message;list.append(row);});lastReport=[summary.textContent,...stats.map(([label,value])=>label+': '+value),...visible.map(item=>item.level.toUpperCase()+': '+item.message)].join('\n');
}
function validate(){const raw=$('#compose-input').value;if(!raw.trim()){$('#summary').textContent=t('empty');$('#summary').className='compose-summary';$('#stats').innerHTML='';$('#issues').innerHTML='';lastReport='';return;}try{renderResult(validateCompose(parseYaml(raw)));}catch(error){renderResult({items:[{level:'error',message:(error.line?'Line '+error.line+': ':'')+error.message}],services:0,networks:0,volumes:0});}}

networks:
  app: {}
volumes:
