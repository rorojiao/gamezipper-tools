<script>
// ============ R445: Snow Day Calculator — closure probability model ============
const { $, t } = GZ;

// Regional base thresholds: "smallest snowfall that might trigger closure"
const REGIONS = {
  "snowbelt":       {factor: 1.00, label: "Snowbelt",       snowThreshold: 4.0, iceThreshold: 0.10, windThreshold: -15},
  "south":          {factor: 1.45, label: "South",          snowThreshold: 1.5, iceThreshold: 0.05, windThreshold:  10},
  "west":           {factor: 1.20, label: "West",           snowThreshold: 3.0, iceThreshold: 0.10, windThreshold:   0},
  "canada-maritime":{factor: 0.90, label: "Canada E.",      snowThreshold: 6.0, iceThreshold: 0.20, windThreshold: -25},
  "canada-prairie": {factor: 0.85, label: "Canada Prairies",snowThreshold: 5.0, iceThreshold: 0.20, windThreshold: -35},
  "uk":             {factor: 1.55, label: "UK / Ireland",   snowThreshold: 2.0, iceThreshold: 0.05, windThreshold:  15},
  "eu":             {factor: 1.30, label: "Continental EU", snowThreshold: 3.5, iceThreshold: 0.10, windThreshold:  -5}
};

const ROAD_FACTOR = {"salted":0.85, "partial":1.00, "none":1.15};
const AUDIENCE_FACTOR = {"k12":1.00, "private":0.92, "college":0.85, "office":0.70, "gov":0.65};
const DAY_FACTOR = {"mon":1.00,"tue":1.00,"wed":1.00,"thu":1.00,"fri":0.95,"sat":0.40,"sun":0.55};

// Sigmoid to map score [0..100] to probability with smooth tails
function sigmoid(x) { return 100 / (1 + Math.exp(-x)); }

// US ZIP region modifier (first digit only — geographer's shortcut)
function zipFactor(zip, regionProfile) {
  const z = (zip || '').trim();
  if (!/^\d{5}$/.test(z)) return 1.00; // non-US: rely on profile
  const d1 = parseInt(z[0]);
  // Northern tier: closer to Canada = lower threshold = closure more likely
  if (d1 === 0) return 0.85;  // NE (CT,MA,ME,NH,NJ,RI,VT)
  if (d1 === 1) return 0.90;  // DE,NY,PA
  if (d1 === 2) return 1.00;  // Mid-Atlantic / South central
  if (d1 === 3) return 1.15;  // SE
  if (d1 === 4) return 1.10;  // KY,TN,AL
  if (d1 === 5) return 1.20;  // IA,MN,MT,ND,SD,WI
  if (d1 === 6) return 1.05;  // IL,KS,MO,NE
  if (d1 === 7) return 1.25;  // AR,LA,OK,TX
  if (d1 === 8) return 1.10;  // AZ,CO,ID,NM,NV,UT,WY
  if (d1 === 9) return 0.95;  // AK,CA,HI,OR,WA
  return 1.00;
}

function calculate() {
  const zip = $('#zip').value;
  const regionKey = $('#region').value;
  const snow = +$('#snow').value || 0;
  const ice = +$('#ice').value || 0;
  const windchill = +$('#windchill').value || 0;
  const day = $('#day').value;
  const roads = $('#roads').value;
  const audience = $('#audience').value;
  const conditions = Array.from(document.querySelectorAll('#forecast-options input:checked')).map(c => c.value);

  const reg = REGIONS[regionKey];
  const zipMod = zipFactor(zip, regionKey);

  // --- Component scores ---
  // 1. Snow score (40%)
  const snowRatio = snow / Math.max(reg.snowThreshold, 0.5);
  const snowScore = Math.min(1.0, snowRatio) * 100;

  // 2. Ice score (30%) — dominant factor
  const iceRatio = ice / Math.max(reg.iceThreshold, 0.02);
  const iceScore = Math.min(1.0, iceRatio) * 100;

  // 3. Wind chill (15%)
  const wcDelta = reg.windThreshold - windchill; // positive when colder than threshold
  const windScore = Math.max(0, Math.min(1.0, wcDelta / 40)) * 100;

  // 4. Forecast conditions (10%)
  const condMap = {overnight:15,heavy:25,blowing:12,wind:15,thunder:30,blackice:30,visibility:18,coldsnap:15};
  let condScore = 0;
  for (const c of conditions) condScore += (condMap[c] || 0);
  condScore = Math.min(100, condScore);

  // 5. Combined modifier (5%)
  const modScore = ((zipMod + ROAD_FACTOR[roads]) / 2.0) * 50 + 25; // ~map to 25-75

  const baseScore = snowScore * 0.40 + iceScore * 0.30 + windScore * 0.15 + condScore * 0.10 + modScore * 0.05;
  const modifiers = (reg.factor || 1.0) * DAY_FACTOR[day] * AUDIENCE_FACTOR[audience] * ROAD_FACTOR[roads] * zipMod;
  const adjusted = baseScore * Math.sqrt(modifiers); // sqrt to dampen compounding
  const probability = Math.round(Math.max(0, Math.min(100, sigmoid(adjusted - 50))));

  // Status
  let statusText, statusClass, emoji, recommendation;
  if (probability >= 85) { statusText='Very Likely — Expect Closure'; statusClass='status-very-high'; emoji='🎉'; recommendation='Strong indicator of closure. Check your district / employer announcement the night before.'; }
  else if (probability >= 65) { statusText='Likely Closure'; statusClass='status-high'; emoji='❄️'; recommendation='High probability. Prepare for a snow day just in case.'; }
  else if (probability >= 45) { statusText='Possible Closure'; statusClass='status-medium'; emoji='🤔'; recommendation='Borderline call. 50/50 depending on final forecast updates at 9pm.'; }
  else if (probability >= 25) { statusText='Unlikely Closure'; statusClass='status-low'; emoji='📚'; recommendation='Plan to attend school/work. Monitor updates if forecast worsens.'; }
  else { statusText='Very Unlikely'; statusClass='status-very-low'; emoji='🏫'; recommendation='Storm not severe enough to trigger closures in your region.'; }

  const factorsHtml = `
    <div class="factors-list">
      <div class="factor ${snowScore >= 70 ? 'high' : snowScore >= 40 ? 'mid' : 'low'}">
        <span class="lab">❄️ Snowfall (40%)</span><span class="val">${snowScore.toFixed(0)} / 100 — ${snow}" snow</span>
      </div>
      <div class="factor ${iceScore >= 70 ? 'high' : iceScore >= 40 ? 'mid' : 'low'}">
        <span class="lab">🧊 Ice (30%)</span><span class="val">${iceScore.toFixed(0)} / 100 — ${ice}" ice</span>
      </div>
      <div class="factor ${windScore >= 70 ? 'high' : windScore >= 40 ? 'mid' : 'low'}">
        <span class="lab">🌬️ Wind chill (15%)</span><span class="val">${windScore.toFixed(0)} / 100 — ${windchill}°F</span>
      </div>
      <div class="factor ${condScore >= 70 ? 'high' : condScore >= 40 ? 'mid' : 'low'}">
        <span class="lab">🌨️ Forecast conditions (10%)</span><span class="val">${condScore.toFixed(0)} / 100 — ${conditions.length} selected</span>
      </div>
      <div class="factor ${modScore >= 70 ? 'high' : modScore >= 40 ? 'mid' : 'low'}">
        <span class="lab">📍 Region modifier (5%)</span><span class="val">${modScore.toFixed(0)} / 100 — ${reg.label} (ZIP ${zip || '—'})</span>
      </div>
    </div>`;

  document.getElementById('result').innerHTML = `
    <div class="kpi">
      <div class="num">${probability}%</div>
      <div class="lab">${emoji} ${probability >= 50 ? 'Snow Day Likely' : 'Standard Day Likely'}</div>
    </div>
    <div class="snow-day-status ${statusClass}">${statusText} — ${emoji}</div>
    <div class="gauge-row"><span>0%</span><div class="gauge"><div style="width:${probability}%"></div></div><span>100%</span></div>
    ${factorsHtml}
    <div class="tip"><strong>Recommendation:</strong> ${recommendation}</div>
  `;

  // Persist for share/copy
  window.__snowCalc = {
    zip, regionKey, snow, ice, windchill, day, roads, audience, conditions,
    probability, statusText, recommendation, factors: {snowScore, iceScore, windScore, condScore, modScore}
  };
}

function buildShareUrl() {
  const c = window.__snowCalc || {};
  const params = new URLSearchParams({
    zip: c.zip || '', region: c.regionKey, snow: c.snow, ice: c.ice,
    windchill: c.windchill, day: c.day, roads: c.roads, audience: c.audience,
    prob: c.probability || ''
  });
  return location.origin + location.pathname + '?' + params.toString();
}

function buildSummary() {
  const c = window.__snowCalc;
  if (!c) return '';
  return `❄️ Snow Day Forecast — ${c.probability}% chance of closure\n` +
    `📍 ZIP ${c.zip} (${c.regions || ''})\n` +
    `❄️ Forecast: ${c.snow}" snow, ${c.ice}" ice, ${c.windchill}°F wind chill\n` +
    `📅 ${c.day === 'sat' || c.day === 'sun' ? 'Weekend' : 'Weekday'} for ${c.audience}\n` +
    `📊 Top factors: snowfall ${c.factors.snowScore.toFixed(0)}/100, ice ${c.factors.iceScore.toFixed(0)}/100\n` +
    `\nGenerated by Snow Day Calculator (tools.gamezipper.com)`;
}

document.getElementById('btn-calculate').addEventListener('click', calculate);
document.getElementById('btn-share').addEventListener('click', () => {
  const url = buildShareUrl();
  navigator.clipboard?.writeText(url);
  const btn = document.getElementById('btn-share');
  const orig = btn.innerHTML;
  btn.innerHTML = '✓ Link Copied!';
  setTimeout(() => btn.innerHTML = orig, 1400);
});
document.getElementById('btn-copy').addEventListener('click', () => {
  const txt = buildSummary();
  navigator.clipboard?.writeText(txt);
  const btn = document.getElementById('btn-copy');
  const orig = btn.innerHTML;
  btn.innerHTML = '✓ Summary Copied!';
  setTimeout(() => btn.innerHTML = orig, 1400);
});

// Restore from URL
const params = new URLSearchParams(location.search);
if (params.get('zip')) {
  $('#zip').value = params.get('zip') || '02139';
  $('#region').value = params.get('region') || 'snowbelt';
  $('#snow').value = params.get('snow') || '6';
  $('#ice').value = params.get('ice') || '0';
  $('#windchill').value = params.get('windchill') || '-10';
  $('#day').value = params.get('day') || 'sun';
  $('#roads').value = params.get('roads') || 'partial';
  $('#audience').value = params.get('audience') || 'k12';
  const conds = (params.get('conditions') || '').split(',');
  document.querySelectorAll('#forecast-options input').forEach(cb => {
    if (conds.includes(cb.value)) cb.checked = true;
  });
  setTimeout(calculate, 100);
} else {
  calculate();
}

GZI18n.register({
  en: {
    toolTitle: 'Snow Day Calculator — Will School Be Closed Tomorrow?',
    toolDesc: 'Estimate the probability of a snow day or office closure for any ZIP code. Enter snowfall, ice, wind chill and forecast conditions to get an instant closure probability with the factors that drove it.',
    step1: 'Enter your ZIP / postal code and select a regional profile',
    step2: 'Set forecast snowfall, ice accumulation and wind chill',
    step3: 'Check all forecast conditions that apply (overnight storm, thundersnow, black ice…)',
    step4: 'Click Calculate for a probability score and recommendation'
  },
  zh: {
    toolTitle: '雪天停课计算器 — 学校明天会停课吗？',
    toolDesc: '估算任意邮政编码因大雪停课/停工的概率。输入降雪量、冰冻、风寒和预报条件，即时获得停课概率及驱动因素。',
