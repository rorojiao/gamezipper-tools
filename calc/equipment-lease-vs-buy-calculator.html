const { $,t }=GZ;const number=id=>Math.max(0,Number($(id).value)||0);const money=n=>'$'+Math.round(n).toLocaleString('en-US');
function payment(principal,rate,months){if(principal<=0)return 0;if(rate===0)return principal/months;return principal*rate*Math.pow(1+rate,months)/(Math.pow(1+rate,months)-1)}

function labels(){['hEquipment','hBuy','hLease','lPrice','lYears','lBuyMaintenance','lLeaseMaintenance','lDown','lTax','lApr','lTerm','lResale','lLeasePayment','lLeaseUpfront','lLeaseMonths','calculate','example','hResults','sLoanPayment','sBuyCost','sLeaseCost','sDifference','barBuy','barLease','note'].forEach(id=>$('#'+id).textContent=t(id))}labels();$('#calculate').onclick=calculate;$('#example').onclick=()=>{const values={price:75000,years:5,buyMaintenance:1800,leaseMaintenance:600,down:7500,tax:6.5,apr:8.5,term:5,resale:35,leasePayment:1425,leaseUpfront:2500,leaseMonths:60};Object.entries(values).forEach(([id,value])=>$('#'+id).value=value);calculate()};GZ.renderToolPage({category:'calc',titleKey:'toolTitle',descKey:'toolDesc',howToSteps:['step1','step2','step3','step4'],related:[{icon:'🏢',href:'/calc/business-loan-calculator.html',name:'Business Loan'},{icon:'🚗',href:'/calc/lease-vs-buy.html',name:'Car Lease vs Buy'},{icon:'📈',href:'/calc/break-even-calculator.html',name:'Break-Even'},{icon:'💼',href:'/calc/employee-cost-calculator.html',name:'Employee Cost'}]});calculate();
</script>
