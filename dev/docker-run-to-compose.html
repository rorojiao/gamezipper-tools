var { $, copyText, t } = GZ;

/* ── Tokenizer & shell handling ─────────────────────────────────── */
function logicalLines(text) {
  var out = [], cur = '';
  String(text).replace(/\r\n?/g, '\n').split('\n').forEach(function (raw) {
    var s = raw.trim();
    if (!s) { if (cur) { out.push(cur); cur = ''; } return; }
    if (/\\$/.test(s)) cur += s.slice(0, -1) + ' ';
    else { cur += s; out.push(cur); cur = ''; }
  });
  if (cur) out.push(cur);
  return out;
}
function splitChain(line) {
  var out = [], cur = '', inS = false, inD = false;
  for (var k = 0; k < line.length; k++) {
    var c = line[k];
    if (inS) { cur += c; if (c === "'" && line[k-1] !== '\\') inS = false; continue; }
    if (inD) { cur += c; if (c === '"' && line[k-1] !== '\\') inD = false; continue; }
    if (c === "'") { inS = true; cur += c; continue; }
    if (c === '"') { inD = true; cur += c; continue; }
    if (c === '&' && line[k+1] === '&') { out.push(cur); cur = ''; k++; continue; }
    cur += c;
  }
  out.push(cur);
  return out;
}
function tokenize(s) {
  var toks = [], cur = '', has = false, inS = false, inD = false;
  function push() { if (has) { toks.push(cur); cur = ''; has = false; } }
  for (var k = 0; k < s.length; k++) {
    var c = s[k];
    if (inS) { if (c === "'" ) { inS = false; } else { cur += c; has = true; } continue; }
    if (inD) {
      if (c === '"' && s[k-1] !== '\\') { inD = false; }
      else if (c === '\\' && (s[k+1] === '"' || s[k+1] === '\\')) { cur += s[k+1]; k++; }
      else { cur += c; has = true; }
      continue;
    }
    if (c === "'") { inS = true; has = true; continue; }
    if (c === '"') { inD = true; has = true; continue; }
    if (/\s/.test(c)) { push(); continue; }
    cur += c; has = true;
  }
  push();
  return toks;
}

/* ── Flag table: name -> arity (0 boolean, 1 takes value) ──────── */
var FLAGS = {
  '-d':0,'--detach':0,'--rm':0,'-i':0,'--interactive':0,'-t':0,'--tty':0,
  '--privileged':0,'--read-only':0,'--init':0,'--no-healthcheck':0,
  '-P':0,'--publish-all':0,
  '-p':1,'--publish':1,'-e':1,'--env':1,'--env-file':1,'-v':1,'--volume':1,'--mount':1,
  '--name':1,'--network':1,'--net':1,'--restart':1,'-w':1,'--workdir':1,'--entrypoint':1,
  '-u':1,'--user':1,'-m':1,'--memory':1,'--memory-reservation':1,'--cpus':1,
  '--label':1,'-l':1,'--add-host':1,'--hostname':1,'-h':1,'--expose':1,'--dns':1,
  '--shm-size':1,'--tmpfs':1,'--device':1,'--ulimit':1,'--sysctl':1,
  '--log-driver':1,'--log-opt':1,'--health-cmd':1,'--health-interval':1,'--health-timeout':1,
  '--health-retries':1,'--health-start-period':1,'--group-add':1,'--stop-timeout':1,
  '--platform':1,'--mac-address':1,'--ip':1,'--pid':1,'--uts':1,'--userns':1,
  '--security-opt':1,'--cidfile':1,'-a':1,'--attach':1,'--link':1,'--gpus':1,
  '--pull':1,'--sig-proxy':0,'--retries':1
};

var IGNORED = {'--rm':'info-rm','-d':'info-detach','--detach':'info-detach',
  '-P':'no','--publish-all':'no','--link':'no','--gpus':'no','--pid':'no','--uts':'no',
  '--userns':'no','--security-opt':'no','--cidfile':'no','-a':'no','--attach':'no',
  '--mac-address':'no','--ip':'no','--memory-reservation':'no'};

function newService() {
  return { ports:[], envs:[], envPlain:[], volumes:[], tmpfs:[], devices:[], networks:[],
    envFiles:[], labels:{}, extraHosts:[], dns:[], expose:[], ulimits:{}, sysctl:{},
    log:{driver:'',opts:[]}, health:{}, groupAdd:[], entrypoint:null, command:[] };
}

function parseMount(val) {
  var m = {};
  val.split(',').forEach(function (kv) {
    var eq = kv.indexOf('=');
    if (eq > 0) m[kv.slice(0, eq)] = kv.slice(eq + 1);
  });
  return m;
}

function parseRun(toks, svc, warns) {
  var image = null;
  for (var i = 0; i < toks.length; i++) {
    var tk = toks[i];
    if (tk === '--') { svc.command = svc.command.concat(toks.slice(i + 1)); break; }
    if (image) { svc.command.push(tk); continue; }
    if (tk.charAt(0) !== '-' || tk === '-') {
      if (!image) image = tk; else svc.command.push(tk);
      continue;
    }
    /* combined short boolean flags: -it, -ti, -dt ... */
    if (/^-[a-zA-Z]{2,}$/.test(tk) && !tk.slice(1).split('').some(function (c) { return 'itdP'.indexOf(c) < 0; })) {
      toks.splice.apply(toks, [i, 1].concat(tk.slice(1).split('').map(function (c) { return '-' + c; })));
      i--;
      continue;
    }
    var name = tk, val = null;
    var eq = tk.indexOf('=');
    if (eq > 0) { name = tk.slice(0, eq); val = tk.slice(eq + 1); }
    var arity = FLAGS[name];
    if (arity === undefined) { warns.push({kind:'warn', text: name}); continue; }
    if (arity === 1 && val === null) {
      val = toks[++i];
      if (val === undefined) { warns.push({kind:'warn', text: name}); continue; }
    }
    if (IGNORED[name] === 'info-rm') { warns.push({kind:'info', text:t('infoRm')}); continue; }
    if (IGNORED[name] === 'info-detach') { warns.push({kind:'info', text:t('infoDetach')}); continue; }
    if (IGNORED[name] === 'no') { warns.push({kind:'warn', text:t('warnIgnored') + ' ' + name}); continue; }
    switch (name) {
      case '-i': case '--interactive': svc.stdinOpen = true; break;
      case '-t': case '--tty': svc.tty = true; break;
      case '--privileged': svc.privileged = true; break;
      case '--read-only': svc.readOnly = true; break;
      case '--init': svc.init = true; break;
      case '--no-healthcheck': svc.noHealth = true; break;
      case '--sig-proxy': break;
      case '-p': case '--publish': svc.ports.push(val); break;
      case '-e': case '--env':
        var eqp = val.indexOf('=');
        if (eqp > 0) svc.envs.push([val.slice(0, eqp), val.slice(eqp + 1)]);
        else svc.envPlain.push(val);
        break;
      case '--env-file': svc.envFiles.push(val); break;
      case '-v': case '--volume': svc.volumes.push(val); break;
      case '--mount':
        var mm = parseMount(val);
        var mTgt = mm.target || mm.destination;
        if (mm.type === 'tmpfs' && mTgt) svc.tmpfs.push(mTgt);
        else if ((mm.type === 'volume' || mm.type === 'bind') && (mm.source || mm.source === '') && mTgt)
          svc.volumes.push((mm.source || mm.volume_name || mm.name) + ':' + mTgt + (mm.readonly === 'true' ? ':ro' : ''));
        else warns.push({kind:'warn', text:t('warnIgnored') + ' --mount ' + val});
        break;
      case '--network': case '--net':
        if (val === 'host' || val === 'none' || val === 'bridge') svc.networkMode = val;
        else svc.networks.push(val);
        break;
      case '--restart': svc.restart = val; break;
      case '--name': svc.containerName = val; break;
      case '-w': case '--workdir': svc.workdir = val; break;
      case '--entrypoint': svc.entrypoint = tokenize(val); break;
      case '-u': case '--user': svc.user = val; break;
      case '-m': case '--memory': svc.memLimit = val; break;
      case '--cpus': svc.cpus = val; break;
      case '--label': case '-l':
        var eql = val.indexOf('=');
        if (eql > 0) svc.labels[val.slice(0, eql)] = val.slice(eql + 1);
        else svc.labels[val] = '';
        break;
      case '--add-host': svc.extraHosts.push(val); break;
      case '--hostname': case '-h': svc.hostname = val; break;
      case '--expose': svc.expose.push(val); break;
      case '--dns': svc.dns.push(val); break;
      case '--shm-size': svc.shmSize = val; break;
      case '--tmpfs': svc.tmpfs.push(val); break;
      case '--device': svc.devices.push(val); break;
      case '--group-add': svc.groupAdd.push(val); break;
      case '--stop-timeout': svc.stopGrace = val + 's'; break;
      case '--platform': svc.platform = val; break;
      case '--pull': svc.pullPolicy = val; break;
      case '--ulimit':
        var p = val.split('=');
        if (p.length === 2) {
          var lim = p[1].split(':');
          svc.ulimits[p[0]] = { soft: parseInt(lim[0], 10) || 0, hard: lim[1] ? (parseInt(lim[1], 10) || 0) : (parseInt(lim[0], 10) || 0) };
        } else warns.push({kind:'warn', text:t('warnIgnored') + ' --ulimit ' + val});
        break;
      case '--sysctl':
        var eqs = val.indexOf('=');
        if (eqs > 0) svc.sysctl[val.slice(0, eqs)] = val.slice(eqs + 1);
        break;
      case '--log-driver': svc.log.driver = val; break;
      case '--log-opt': svc.log.opts.push(val); break;
      case '--health-cmd': svc.health.cmd = val; break;
      case '--health-interval': svc.health.interval = val; break;
      case '--health-timeout': svc.health.timeout = val; break;
      case '--health-retries': svc.health.retries = val; break;
      case '--health-start-period': svc.health.startPeriod = val; break;
    }
  }
  return image;
}

/* ── YAML emission ───────────────────────────────────────────────── */
var YAML_RES = /^(y|yes|n|no|true|false|on|off|null|~|\d+(\.\d+)?)$/i;
function yq(s) {
  s = String(s);
  if (s === '') return '""';
  if (!YAML_RES.test(s) && /^[A-Za-z0-9_][A-Za-z0-9_.\-\/:@+ ]*$/.test(s)) return s;
  return '"' + s.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
}
function serviceName(image, used) {
  var base = image.split('/').pop().split(':')[0].replace(/[^a-zA-Z0-9_-]/g, '-').toLowerCase();
  if (!base) base = 'app';
  var nm = base, n = 2;
  while (used[nm]) nm = base + '-' + (n++);
  used[nm] = true;
  return nm;
}
function emitYaml(services, opts) {
  var lines = [], namedVols = {}, extNets = {};
  if (opts.comments) {
    lines.push('# docker-compose.yml generated by tools.gamezipper.com/dev/docker-run-to-compose');
  }
  lines.push('services:');
  services.forEach(function (sv) {
    var s = sv.svc;
    if (opts.comments) { lines.push('  # from: ' + sv.orig.replace(/\n/g, ' ')); }
    lines.push('  ' + sv.name + ':');
    function p2(x) { lines.push('    ' + x); }
    function p4(x) { lines.push('      ' + x); }
    function p6(x) { lines.push('        ' + x); }
    p2('image: ' + yq(s.image));
    if (s.containerName) p2('container_name: ' + yq(s.containerName));
    if (s.hostname) p2('hostname: ' + yq(s.hostname));
    if (s.restart) p2('restart: ' + yq(s.restart));
    if (s.pullPolicy) p2('pull_policy: ' + yq(s.pullPolicy));
    if (s.platform) p2('platform: ' + yq(s.platform));
    if (s.ports.length) { p2('ports:'); s.ports.forEach(function (v) { p4('- "' + v + '"'); }); }
    if (s.expose.length) { p2('expose:'); s.expose.forEach(function (v) { p4('- "' + v + '"'); }); }
    if (s.envs.length || s.envPlain.length) {
      if (s.envPlain.length && !s.envs.length) { p2('environment:'); s.envPlain.forEach(function (v) { p4('- ' + yq(v)); }); }
      else { p2('environment:'); s.envs.forEach(function (kv) { p4(yq(kv[0]) + ': ' + yq(kv[1])); }); }
      if (s.envPlain.length && s.envs.length) {
        p4('# host passthrough (unresolved values): ' + s.envPlain.join(', '));
      }
    }
    if (s.envFiles.length) { p2('env_file:'); s.envFiles.forEach(function (v) { p4('- ' + yq(v)); }); }
    if (s.volumes.length) {
      p2('volumes:');
      s.volumes.forEach(function (v) {
        var src = v.split(':')[0];
        if (/^[a-z0-9][a-z0-9_.-]*$/i.test(src) && src.indexOf('/') < 0) namedVols[src] = true;
        p4('- ' + yq(v));
      });
    }
    if (s.tmpfs.length) { p2('tmpfs:'); s.tmpfs.forEach(function (v) { p4('- ' + yq(v)); }); }
    if (s.devices.length) { p2('devices:'); s.devices.forEach(function (v) { p4('- ' + yq(v)); }); }
    if (s.networks.length) {
      p2('networks:');
      s.networks.forEach(function (v) { extNets[v] = true; p4('- ' + yq(v)); });
    }
    if (s.networkMode) p2('network_mode: ' + yq(s.networkMode));
    if (s.workdir) p2('working_dir: ' + yq(s.workdir));
    if (s.entrypoint) p2('entrypoint: ' + JSON.stringify(s.entrypoint));
    if (s.command.length) p2('command: ' + JSON.stringify(s.command));
    if (s.user) p2('user: ' + yq(s.user));
    if (s.groupAdd.length) { p2('group_add:'); s.groupAdd.forEach(function (v) { p4('- ' + yq(v)); }); }
    if (Object.keys(s.labels).length) {
      p2('labels:');
      Object.keys(s.labels).forEach(function (k) { p4(yq(k) + ': ' + yq(s.labels[k])); });
    }
    if (s.extraHosts.length) { p2('extra_hosts:'); s.extraHosts.forEach(function (v) { p4('- "' + v + '"'); }); }
    if (s.dns.length) { p2('dns:'); s.dns.forEach(function (v) { p4('- ' + yq(v)); }); }
    if (s.shmSize) p2('shm_size: ' + yq(s.shmSize));
    if (s.memLimit) p2('mem_limit: ' + yq(s.memLimit));
    if (s.cpus) p2('cpus: ' + JSON.stringify(String(s.cpus)));
    if (s.privileged) p2('privileged: true');
    if (s.readOnly) p2('read_only: true');
    if (s.init) p2('init: true');
    if (s.stdinOpen) p2('stdin_open: true');
    if (s.tty) p2('tty: true');
    if (s.stopGrace) p2('stop_grace_period: ' + yq(s.stopGrace));
    if (Object.keys(s.ulimits).length) {
      p2('ulimits:');
      Object.keys(s.ulimits).forEach(function (k) {
        p4(k + ':');
        p6('soft: ' + s.ulimits[k].soft);
        p6('hard: ' + s.ulimits[k].hard);
      });
    }
    if (Object.keys(s.sysctl).length) {
      p2('sysctls:');
      Object.keys(s.sysctl).forEach(function (k) { p4(yq(k) + ': ' + yq(s.sysctl[k])); });
    }
    if (s.log.driver || s.log.opts.length) {
      p2('logging:');
      if (s.log.driver) p4('driver: ' + yq(s.log.driver));
      if (s.log.opts.length) {
        p4('opts:');
        s.log.opts.forEach(function (o) {
          var eqo = o.indexOf('=');
          if (eqo > 0) p6(yq(o.slice(0, eqo)) + ': ' + yq(o.slice(eqo + 1)));
        });
      }
    }
    if (s.noHealth) { p2('healthcheck:'); p4('disable: true'); }
    else if (s.health.cmd) {
      p2('healthcheck:');
      p4('test: ["CMD-SHELL", ' + JSON.stringify(s.health.cmd) + ']');
      if (s.health.interval) p4('interval: ' + yq(s.health.interval));
      if (s.health.timeout) p4('timeout: ' + yq(s.health.timeout));
      if (s.health.retries) p4('retries: ' + yq(s.health.retries));
      if (s.health.startPeriod) p4('start_period: ' + yq(s.health.startPeriod));
    }
  });
  if (Object.keys(extNets).length) {
    lines.push('networks:');
    Object.keys(extNets).forEach(function (k) {
      lines.push('  ' + k + ':');
      if (opts.comments) lines.push('    # already exists on this host');
      lines.push('    external: true');
    });
  }
  if (Object.keys(namedVols).length) {
    lines.push('volumes:');
    Object.keys(namedVols).forEach(function (k) {
      lines.push('  ' + k + ':');
      if (opts.comments) lines.push('    # already exists on this host');
      lines.push('    external: true');
    });
  }
  return lines.join('\n') + '\n';
}

/* ── UI ──────────────────────────────────────────────────────────── */
var lastYaml = '';
var EXAMPLE = 'docker run -d --name web -p 8080:80 -p 443:443/tcp -e NODE_ENV=production -e PORT \\\n  -v ./html:/usr/share/nginx/html:ro -v pgdata:/var/lib/postgresql/data \\\n  --network backend --restart unless-stopped -m 512m --cpus 1.5 \\\n  --health-cmd "curl -f http://localhost/ || exit 1" --health-interval 30s \\\n  nginx:alpine nginx -g "daemon off;"\n\ndocker run --rm --name oneoff -e DB_PASS=s3cret myapp:2.1 migrate --up';

function toolbar() {
  $('#toolbar').innerHTML =
    '<button class="gz-btn gz-btn-primary" id="go">' + t('convert') + '</button>' +
    '<button class="gz-btn" id="ex">' + t('example') + '</button>' +
    '<button class="gz-btn" id="cp" hidden>' + t('copy') + '</button>' +
    '<button class="gz-btn" id="dl" hidden>' + t('download') + '</button>' +
    '<button class="gz-btn" id="cl">' + t('clear') + '</button>';
  var savedC = '1';
  try { savedC = localStorage.getItem('gz_drc_comments') || '1'; } catch (e) {}
  $('#opts').innerHTML = '<label><input type="checkbox" id="optComments"' +
    (savedC === '1' ? ' checked' : '') + '>' + t('optComments') + '</label>';
}
function chip(label, val) {
  return '<div class="drc-chip"><b>' + val + '</b><span>' + label + '</span></div>';
}

function run() {
  var raw = $('#input').value;
  if (!raw.trim()) { GZ.showToast(t('errEmpty'), 'error'); return; }
  var warns = [], services = [], used = {};
  logicalLines(raw).forEach(function (line) {
    splitChain(line).forEach(function (part) {
      var toks = tokenize(part);
      if (!toks.length) return;
      while (toks.length && (toks[0] === 'sudo' || toks[0] === 'docker' || toks[0] === 'run')) toks.shift();
      if (!toks.length) return;
      var svc = newService();
      var image = parseRun(toks, svc, warns);
      if (!image) { warns.push({kind:'warn', text:t('errNoImage') + ' `' + part.slice(0, 60) + '`'}); return; }
      var nm = svc.containerName || serviceName(image, used);
      if (svc.containerName) { nm = serviceName(svc.containerName, used); }
      used[nm] = true;
      svc.image = image;
      services.push({ name: nm, svc: svc, orig: part.trim() });
    });
  });
  if (!services.length) { GZ.showToast(t('errEmpty'), 'error'); return; }

  var comments = $('#optComments').checked;
  lastYaml = emitYaml(services, { comments: comments });

  var nPorts = 0, nVols = 0, nEnv = 0;
  services.forEach(function (sv) {
    nPorts += sv.svc.ports.length; nVols += sv.svc.volumes.length;
    nEnv += sv.svc.envs.length + sv.svc.envPlain.length;
  });
  $('#report').hidden = false;
  $('#chips').innerHTML =
    chip(t('cServices'), services.length) + chip(t('cPorts'), nPorts) +
    chip(t('cVolumes'), nVols) + chip(t('cEnv'), nEnv) + chip(t('cWarn'), warns.length);
  $('#out').textContent = lastYaml;
  if (!warns.length) {
    $('#warns').innerHTML = '<li class="drc-ok">' + t('noIssues') + '</li>';
  } else {
    $('#warns').innerHTML = warns.map(function (w) {
      return '<li><span class="drc-badge ' + (w.kind === 'info' ? 'info' : 'warn') + '">' +
        (w.kind === 'info' ? 'info' : 'warn') + '</span><span>' +
        w.text.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</span></li>';
    }).join('');
  }
  $('#note').textContent = t('note');
  $('#cp').hidden = false; $('#dl').hidden = false;
  GZ.showToast(t('generated'), 'success');
}

toolbar();
$('#go').addEventListener('click', run);
$('#ex').addEventListener('click', function () { $('#input').value = EXAMPLE; run(); });
$('#cl').addEventListener('click', function () {
  $('#input').value = ''; $('#report').hidden = true;
  $('#cp').hidden = true; $('#dl').hidden = true;
});
$('#input').addEventListener('keydown', function (e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); }
});
$('#cp').addEventListener('click', function () {
  copyText(lastYaml).then(function () { GZ.showToast(t('copied'), 'success'); });
});
$('#dl').addEventListener('click', function () {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lastYaml], { type: 'text/yaml' }));
  a.download = 'compose.yml';
  a.click();
  URL.revokeObjectURL(a.href);
});
$('#optComments').addEventListener('change', function () {
  try { localStorage.setItem('gz_drc_comments', this.checked ? '1' : '0'); } catch (e) {}
  if (!$('#report').hidden) run();
});
$('#lblIn').textContent = t('lblIn');
$('#lblOut').textContent = t('lblOut');
$('#lblWarn').textContent = t('lblWarn');

});
