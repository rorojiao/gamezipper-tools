.layer-builder{display:grid;gap:14px}
.layer-row{border:1px solid var(--border);background:var(--glass);border-radius:10px;padding:12px}
.layer-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.layer-head input[type=text]{flex:1;min-width:140px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--input-bg);color:var(--text);font:600 .9rem ui-monospace,monospace}
.layer-head input[type=color]{width:38px;height:34px;border:1px solid var(--border);border-radius:6px;background:transparent;cursor:pointer;padding:2px}
.layer-rule{display:grid;grid-template-columns:minmax(120px,1fr) minmax(160px,1fr) auto;gap:8px;margin-top:6px;align-items:center}
.layer-rule input,.layer-rule select{padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--input-bg);color:var(--text);font:500 .85rem ui-monospace,monospace;min-width:0}
.layer-rule .rm{background:var(--gz-accent);color:#fff;border:none;border-radius:6px;padding:6px 10px;cursor:pointer;font-weight:600}
.layer-rule .rm:hover{filter:brightness(1.1)}
.layer-order{margin:6px 0 14px;padding:10px 12px;background:var(--glass2);border:1px solid var(--border);border-radius:8px;font:600 .82rem ui-monospace,monospace;color:var(--text2);word-break:break-all}
.layer-order b{color:var(--gz-accent)}
.layer-preview{margin-top:16px;border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--glass2)}
.layer-preview h3{margin:0 0 8px;font-size:.95rem}
.layer-preview .demo{background:var(--input-bg);border:1px dashed var(--border);border-radius:8px;padding:14px;color:var(--text)}
.winner-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;margin-bottom:6px;font:600 .85rem ui-monospace,monospace;border:1px solid var(--border);background:var(--input-bg)}
.winner-row .layer-tag{padding:3px 8px;border-radius:5px;font-size:.75rem;color:#fff;font-weight:700;white-space:nowrap}
.winner-row .rule-sel{color:var(--text2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.winner-row .rule-val{color:var(--gz-accent)}
.output-box{margin-top:14px;padding:12px;background:var(--glass);border:1px solid var(--border);border-radius:8px;font:500 .82rem/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word;color:var(--text);max-height:280px;overflow:auto}
.add-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.add-row .gz-btn{padding:6px 12px;font-size:.85rem}
@media(max-width:620px){.layer-rule{grid-template-columns:1fr 1fr auto}.layer-head input[type=text]{flex:1 1 100%}}
</style>

{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is CSS @layer?","acceptedAnswer":{"@type":"Answer","text":"The CSS @layer at-rule lets you group styles into named layers so the cascade can be controlled explicitly. Rules in later-declared layers always win over earlier layers regardless of selector specificity. This solves specificity wars in large stylesheets."}},{"@type":"Question","name":"When should I use cascade layers?","acceptedAnswer":{"@type":"Answer","text":"Use cascade layers to organize CSS for design systems, third-party libraries, utility classes, and component overrides. A typical order is reset, base, tokens, elements, components, utilities, overrides. Layers make overrides predictable without using !important."}},{"@type":"Question","name":"How does @layer order work?","acceptedAnswer":{"@type":"Answer","text":"In CSS, the last declared layer has the highest priority. With @layer a, b, c, rules in layer c win over a and b for the same selector. Unlayered styles always win over any layered style, so wrap your base CSS in @layer base to make overrides reliable."}},{"@type":"Question","name":"Are CSS cascade layers supported in all browsers?","acceptedAnswer":{"@type":"Answer","text":"Yes. CSS @layer is supported in Chrome 99+, Edge 99+, Firefox 97+, Safari 15.4+ and Opera 85+. It has over 96% global browser support and is safe to use in production today."}}]}

<script>
GZI18n.register({
  en:{
    toolTitle:'CSS @layer Generator',
    toolDesc:'Build CSS cascade layers visually. Define the layer order, add style rules per layer, and see which rule wins for the same selector — copy production-ready @layer CSS.',
    addLayer:'+ Add Layer',resetPreset:'Reset to preset',
    nameLabel:'Layer name',colorLabel:'Layer color',
    addRule:'+ Add rule',removeRule:'Remove',
    selector:'Selector (e.g. .btn)',prop:'Property',value:'Value',
    previewHeading:'Live preview (uses your layer CSS below)',
    demoBtn:'Sample button',demoLink:'Sample link',demoCard:'Card title',
    winnerHeading:'Cascade winners (last layer wins)',
    outputHeading:'Generated CSS',
    copyCss:'Copy CSS',copyAll:'Copy full stylesheet',
    emptyMsg:'Add a layer and at least one rule to see cascade output.',
    step1:'Name your layers in priority order (the LAST layer wins).',
    step2:'Add selectors, properties and values to each layer.',
    step3:'Watch the live preview and winner list update automatically.',
    step4:'Copy the generated @layer CSS straight into your stylesheet.'
  },
  zh:{
    toolTitle:'CSS @layer 层叠生成器',
    toolDesc:'可视化构建 CSS 级联层（cascade layers）。定义层的优先级顺序、为每层添加样式规则，并查看哪个规则胜出 — 复制可投入生产的 @layer CSS。',
    addLayer:'+ 添加层',resetPreset:'恢复预设',
    nameLabel:'层名',colorLabel:'层颜色',
    addRule:'+ 添加规则',removeRule:'删除',
    selector:'选择器（如 .btn）',prop:'属性',value:'值',
    previewHeading:'实时预览（使用下方生成的 @layer CSS）',
    demoBtn:'示例按钮',demoLink:'示例链接',demoCard:'卡片标题',
    winnerHeading:'级联胜出规则（最后一层胜出）',
    outputHeading:'生成的 CSS',
    copyCss:'复制 CSS',copyAll:'复制完整样式表',
    emptyMsg:'添加至少一个层和一条规则以查看级联输出。',
    step1:'按优先级顺序命名你的层（最后一个层胜出）。',
    step2:'为每个层添加选择器、属性和值。',
    step3:'实时预览和胜出列表会自动更新。',
    step4:'将生成的 @layer CSS 直接复制到样式表中。'
  }
});

const { $, copyText, t } = GZ;
const PROPS = ['color','background','background-color','border','border-color','border-radius','padding','margin','font-size','font-weight','box-shadow','text-align','opacity','transform'];
const COLORS = ['#e94560','#61afef','#98c379','#d19a66','#c678dd','#56b6c2','#ffb86c','#ff79c6'];

function uid(){ return Math.random().toString(36).slice(2,9); }

function defaultPreset(){
  return [
    { id: uid(), name:'reset', color:'#61afef', rules:[ { id: uid(), sel:'button', prop:'background', value:'#1f2937' } ] },
    { id: uid(), name:'components', color:'#98c379', rules:[ { id: uid(), sel:'.btn', prop:'background', value:'#10b981' } ] },
    { id: uid(), name:'utilities', color:'#d19a66', rules:[ { id: uid(), sel:'.btn-primary', prop:'background', value:'#3b82f6' } ] },
    { id: uid(), name:'overrides', color:'#e94560', rules:[ { id: uid(), sel:'button.btn-primary', prop:'background', value:'#ef4444' } ] }
  ];
}

let layers = defaultPreset();

function buildRows(){
  const root = $('#builder'); root.innerHTML='';
  layers.forEach((L, idx) => {
    const row = document.createElement('div'); row.className='layer-row';
    const head = document.createElement('div'); head.className='layer-head';
    const colorInp = document.createElement('input'); colorInp.type='color'; colorInp.value=L.color; colorInp.title=t('colorLabel'); colorInp.setAttribute('aria-label', t('colorLabel')); colorInp.addEventListener('input', e=>{ L.color=e.target.value; render(); });
    const nameInp = document.createElement('input'); nameInp.type='text'; nameInp.value=L.name; nameInp.placeholder=t('nameLabel'); nameInp.setAttribute('aria-label', t('nameLayer')); nameInp.addEventListener('input', e=>{ L.name=e.target.value.replace(/[^a-zA-Z0-9_-]/g,''); nameInp.value=L.name; render(); });
    const upBtn = document.createElement('button'); upBtn.className='gz-btn gz-btn-secondary'; upBtn.type='button'; upBtn.textContent='↑'; upBtn.style.padding='6px 10px'; upBtn.addEventListener('click', ()=>{ if(idx>0){ [layers[idx-1],layers[idx]]=[layers[idx],layers[idx-1]]; buildRows(); render(); } });
    const downBtn = document.createElement('button'); downBtn.className='gz-btn gz-btn-secondary'; downBtn.type='button'; downBtn.textContent='↓'; downBtn.style.padding='6px 10px'; downBtn.addEventListener('click', ()=>{ if(idx<layers.length-1){ [layers[idx+1],layers[idx]]=[layers[idx],layers[idx+1]]; buildRows(); render(); } });
    const delBtn = document.createElement('button'); delBtn.className='gz-btn gz-btn-secondary'; delBtn.type='button'; delBtn.textContent='✕'; delBtn.style.padding='6px 10px'; delBtn.addEventListener('click', ()=>{ layers.splice(idx,1); if(!layers.length) layers=defaultPreset(); buildRows(); render(); });
    head.append(colorInp, nameInp, upBtn, downBtn, delBtn); row.append(head);

    L.rules.forEach((R, ri) => {
      const r = document.createElement('div'); r.className='layer-rule';
      const sel = document.createElement('input'); sel.type='text'; sel.value=R.sel; sel.placeholder=t('selector'); sel.addEventListener('input', e=>{ R.sel=e.target.value; render(); });
      const propSel = document.createElement('select');
      PROPS.forEach(p=>{ const o=document.createElement('option'); o.value=p; o.textContent=p; if(p===R.prop) o.selected=true; propSel.append(o); });
      propSel.addEventListener('change', e=>{ R.prop=e.target.value; render(); });
      const valWrap = document.createElement('div'); valWrap.style.display='flex'; valWrap.style.gap='4px'; valWrap.style.alignItems='center';
      const valInp = document.createElement('input'); valInp.type='text'; valInp.value=R.value; valInp.placeholder=t('value'); valInp.addEventListener('input', e=>{ R.value=e.target.value; render(); });
      valWrap.append(valInp);
      const rm = document.createElement('button'); rm.className='rm'; rm.type='button'; rm.textContent=t('removeRule'); rm.addEventListener('click', ()=>{ L.rules.splice(ri,1); buildRows(); render(); });
      r.append(sel, propSel, rm); row.append(r);
    });

    const addR = document.createElement('button'); addR.className='gz-btn gz-btn-secondary'; addR.type='button'; addR.textContent=t('addRule'); addR.style.marginTop='8px';
    addR.addEventListener('click', ()=>{ L.rules.push({ id:uid(), sel:'.x', prop:'color', value:'#fff' }); buildRows(); render(); });
    row.append(addR);
    root.append(row);
  });
}

function cssEscape(s){ return s; }

function buildCSS(){
  if(!layers.length) return '/* ' + t('emptyMsg') + ' */';
  const order = layers.map(L=>L.name).filter(Boolean);
  let css = '@layer ' + order.join(', ') + ';\n\n';
  layers.forEach(L => {
    if(!L.name) return;
    css += '@layer ' + L.name + ' {\n';
    L.rules.forEach(R => {
      if(!R.sel || !R.prop) return;
      css += '  ' + R.sel + ' { ' + R.prop + ': ' + R.value + '; }\n';
    });
    css += '}\n\n';
  });
  return css.trim();
}

function buildPreviewCSS(){
  return buildCSS();
}

function buildWinnerList(){
  const map = new Map(); // selector+prop -> { layer, color, val }
  layers.forEach(L => {
    L.rules.forEach(R => {
      if(!R.sel || !R.prop) return;
      const key = R.sel + '|' + R.prop;
      map.set(key, { layer: L.name, color: L.color, val: R.value, sel: R.sel, prop: R.prop });
    });
  });
  const arr = [...map.values()];
  const list = $('#winnerList');
  if(!arr.length){ list.innerHTML='<p style="color:var(--text2);font-size:.85rem">'+t('emptyMsg')+'</p>'; return; }
  list.innerHTML = arr.map(w =>
    '<div class="winner-row"><span class="layer-tag" style="background:'+w.color+'">'+w.layer+'</span><span class="rule-sel">'+w.sel+'</span><span class="rule-val">'+w.prop+': '+w.val+'</span></div>'
  ).join('');
}

function buildDemo(){
  const demo = $('#demoBox');
  let demoCSS = buildPreviewCSS();
  demoCSS += '\n.demo button { padding: 10px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; color: #fff; margin-right: 8px; }';
  demoCSS += '\n.demo a { color: inherit; }';
  demoCSS += '\n.demo h4 { margin: 0 0 6px; font-size: 1rem; }';
  demoCSS += '\n.demo .card { padding: 12px 14px; border-radius: 8px; border: 1px solid #888; }';
  let style = document.getElementById('demo-style'); if(!style){ style=document.createElement('style'); style.id='demo-style'; document.head.appendChild(style); }
  style.textContent = demoCSS;
  demo.innerHTML = '<button>'+t('demoBtn')+'</button> <button class="btn">.btn</button> <button class="btn btn-primary">.btn-primary</button> <h4 class="card">'+t('demoCard')+'</h4>';
}

function render(){
  const order = layers.map(L=>L.name).filter(Boolean);
  $('#orderLine').innerHTML = '<b>@layer</b> ' + (order.length ? order.join(', ') + ' &nbsp;<span style="color:var(--text2);font-weight:400;font-size:.8em">(last wins)</span>' : '(add layers below)');
  buildDemo();
  buildWinnerList();
  $('#output').textContent = buildCSS();
}

function initToolbar(){
  $('#toolbar').innerHTML = `
    <button class="gz-btn" type="button" id="copyCssBtn"></button>
    <button class="gz-btn gz-btn-secondary" type="button" id="copyAllBtn"></button>
  `;
  $('#copyCssBtn').textContent = t('copyCss');
  $('#copyAllBtn').textContent = t('copyAll');
  $('#copyCssBtn').addEventListener('click', ()=>copyText(buildCSS()));
  $('#copyAllBtn').addEventListener('click', ()=>copyText(buildPreviewCSS() + '\n\n/* apply on page */\n<style>\n' + buildPreviewCSS() + '\n</style>'));
  $('#addLayer').textContent = t('addLayer');
  $('#addLayer').addEventListener('click', ()=>{
    const name = 'layer' + (layers.length + 1);
    layers.push({ id:uid(), name, color: COLORS[layers.length % COLORS.length], rules:[ { id:uid(), sel:'.x', prop:'color', value:'#fff' } ] });
    buildRows(); render();
  });
  $('#resetPreset').textContent = t('resetPreset');
  $('#resetPreset').addEventListener('click', ()=>{ layers=defaultPreset(); buildRows(); render(); });
  $('#previewHeading').textContent = t('previewHeading');
  $('#winnerHeading').textContent = t('winnerHeading');
  $('#outputHeading').textContent = t('outputHeading');
}

initToolbar();
buildRows();
render();

GZ.renderToolPage({
  category:'css',
  titleKey:'toolTitle',
  descKey:'toolDesc',
  howToSteps:['step1','step2','step3','step4'],
  related:[
    {icon:'🎯', href:'/css-tools/specificity.html', name:'CSS Specificity'},
    {icon:'📐', href:'/css-tools/clamp.html', name:'CSS Clamp()'},
    {icon:'📜', href:'/css-tools/scroll-snap.html', name:'CSS Scroll Snap'},
    {icon:'🎨', href:'/css-tools/gradient.html', name:'CSS Gradient'}
  ]
});
</script>
