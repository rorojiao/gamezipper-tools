let mode = 'sets', tag = 'all', curSet = null, setOrder = null;
const $ = s => document.querySelector(s);
const t = k => GZI18n.t(k);
const pick = a => a[Math.floor(Math.random()*a.length)];

function filtered(){ return BANK.filter(b => tag==='all'||b.cat===tag); }

function renderModes(){
  $('#modes').innerHTML = `<button class="ttl-mode ${mode==='sets'?'active':''}" onclick="setMode('sets')">${t('modeSets')}</button><button class="ttl-mode ${mode==='prompts'?'active':''}" onclick="setMode('prompts')">${t('modePrompts')}</button>`;
}
function setMode(m){ mode=m; renderModes(); renderTags(); newSet(); }
function renderTags(){
  const keys=['all','work','party','classroom','dating','funny','travel'];
  $('#tags').innerHTML = keys.map(k=>`<span class="ttl-tag ${tag===k?'active':''}" onclick="setTag('${k}')">${t(k)}</span>`).join('');
}
function setTag(k){ tag=k; renderTags(); newSet(); }

function newSet(){
  document.querySelectorAll('.ttl-card').forEach(c=>{c.classList.remove('revealed','is-lie','is-true');c.querySelector('.ttl-card-badge').textContent='';});
  if(mode==='prompts'){
    $('#cards').style.display='none';
    const pool = tag==='all'?Object.values(PROMPTS).flat():PROMPTS[tag];
    const three=[]; while(three.length<3){const p=pick(pool); if(!three.includes(p))three.push(p);}
    $('#prompts').innerHTML = three.map((p,i)=>`<div class="ttl-prompt"><b>${t('promptFor')} ${i+1}:</b> ${p}</div>`).join('');
    $('#prompts').style.display='grid';
  } else {
    $('#prompts').style.display='none';
    curSet = pick(filtered());
    setOrder = [0,1,2].sort(()=>Math.random()-0.5);
    document.querySelectorAll('.ttl-card').forEach((c,j)=>{
      c.querySelector('.ttl-card-txt').textContent = curSet.s[setOrder[j]];
    });
    $('#cards').style.display='grid';
  }
  $('#hint').textContent = mode==='sets' ? t('guessTheLie') : t('hint');
  $('#toolbar').innerHTML = `<button class="gz-btn" onclick="newSet()">${t('nextBtn')}</button>` +
    (mode==='sets' ? `<button class="gz-btn gz-btn-secondary" onclick="shuffleReveal()">${t('shuffleBtn')}</button><button class="gz-btn gz-btn-secondary" onclick="copySet()">${t('copyBtn')}</button>` : '');
}
function reveal(origIdx){
  document.querySelectorAll('.ttl-card').forEach(c=>{
    c.classList.add('revealed');
    const oi = setOrder[+c.dataset.i];
    if(oi===curSet.lie){c.classList.add('is-lie');c.querySelector('.ttl-card-badge').textContent='❌ '+t('lieIs');}
    else{c.classList.add('is-true');c.querySelector('.ttl-card-badge').textContent='✅ '+t('trueIs');}
  });
}
function shuffleReveal(){
  const shuffled=[0,1,2].sort(()=>Math.random()-0.5);
  const texts=document.querySelectorAll('.ttl-card').map(c=>c.querySelector('.ttl-card-txt').textContent);
  const cards=document.querySelectorAll('.ttl-card');
  shuffled.forEach((src,j)=>cards[j].querySelector('.ttl-card-txt').textContent=texts[src]);
  setOrder=shuffled.map(s=>setOrder[s]);
  reveal();
}
document.querySelectorAll('.ttl-card').forEach(c=>c.addEventListener('click',()=>reveal()));
function copySet(){
  const lines=[...document.querySelectorAll('.ttl-card')].map(c=>c.querySelector('.ttl-card-txt').textContent);
  copyText('Two Truths and a Lie:\n1) '+lines[0]+'\n2) '+lines[1]+'\n3) '+lines[2]);
}
renderModes(); renderTags(); newSet();
