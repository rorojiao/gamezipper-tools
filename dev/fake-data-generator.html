function makeRng(seed) {
  let a = seed >>> 0;
  return function() {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function getPool() {
  const locale = $('#locale').value;
  return POOLS[locale] || POOLS.en_US;
}

function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
function pickInt(rng, min, max) { return Math.floor(rng() * (max - min + 1)) + min; }

const GENERATORS = {
  name: (rng, p) => `${pick(p.firstNames, rng)} ${pick(p.lastNames, rng)}`,
  firstName: (rng, p) => pick(p.firstNames, rng),
  lastName: (rng, p) => pick(p.lastNames, rng),
  email: (rng, p) => `${pick(p.firstNames, rng).toLowerCase()}.${pick(p.lastNames, rng).toLowerCase()}@${pick(p.domains, rng)}`,
  phone: (rng) => `+1-${pickInt(rng,200,999)}-${pickInt(rng,100,999)}-${pickInt(rng,1000,9999)}`,
  username: (rng, p) => `${pick(p.firstNames, rng).toLowerCase()}${pickInt(rng, 1, 9999)}`,
  address: (rng, p) => `${pickInt(rng, 100, 9999)} ${pick(p.streets, rng)}`,
  city: (rng, p) => pick(p.cities, rng),
  country: (rng, p) => pick(p.countries, rng),
  zipcode: (rng) => String(pickInt(rng, 10000, 99999)),
  company: (rng, p) => pick(p.companies, rng),
  job: (rng, p) => pick(p.jobs, rng),
  url: (rng, p) => `https://${pick(p.domains, rng)}/${pick(['about','products','blog','docs','api'], rng)}`,
  ip: (rng) => `${pickInt(rng,1,255)}.${pickInt(rng,0,255)}.${pickInt(rng,0,255)}.${pickInt(rng,0,255)}`,
  uuid: (rng) => 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = rng()*16|0; return (c === 'x' ? r : (r&0x3|0x8)).toString(16); }),
  date: (rng) => { const d = new Date(Date.now() - pickInt(rng, 1, 365*3) * 86400000); return d.toISOString().split('T')[0]; },
  datetime: (rng) => { const d = new Date(Date.now() - pickInt(rng, 1, 365*3) * 86400000); return d.toISOString(); },
  age: (rng) => pickInt(rng, 1, 90),
  integer: (rng) => pickInt(rng, 0, 200),
  price: (rng) => (rng() * 1000).toFixed(2),
  boolean: (rng) => rng() > 0.5,
  lorem: (rng) => 'Lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua'.split(' ').sort(() => rng() - 0.5).slice(0, pickInt(rng, 8, 16)).join(' '),
};

function renderSchema() {
  const list = $('#schema-list');
  list.innerHTML = '';
  fields.forEach((f, i) => {
    const row = document.createElement('div');
    row.className = 'field-row';
    row.innerHTML = `
      <input class="gz-input field-name" value="${f.name}" data-idx="${i}" data-prop="name">
      <select class="gz-select field-type" data-idx="${i}" data-prop="type">
        ${FIELD_TYPES.map(([v, label]) => `<option value="${v}" ${v===f.type?'selected':''}>${label}</option>`).join('')}
      </select>
      <div class="field-actions">
        <button class="gz-btn gz-btn-secondary" data-idx="${i}" data-act="up" style="padding:4px 8px">↑</button>
        <button class="gz-btn gz-btn-secondary" data-idx="${i}" data-act="dn" style="padding:4px 8px">↓</button>
        <button class="gz-btn gz-btn-secondary" data-idx="${i}" data-act="rm" style="padding:4px 8px">✕</button>
      </div>
    `;
    list.appendChild(row);
  });

  list.querySelectorAll('input,select').forEach(el => {
    el.addEventListener('input', e => {
      const i = +e.target.dataset.idx;
      const prop = e.target.dataset.prop;
      fields[i][prop] = e.target.value;
    });
  });
  list.querySelectorAll('button[data-act]').forEach(b => {
    b.addEventListener('click', e => {
      const i = +e.target.dataset.idx;
      const act = e.target.dataset.act;
      if (act === 'rm') fields.splice(i, 1);
      else if (act === 'up' && i > 0) [fields[i-1], fields[i]] = [fields[i], fields[i-1]];
      else if (act === 'dn' && i < fields.length-1) [fields[i+1], fields[i]] = [fields[i], fields[i+1]];
      renderSchema();
    });
  });
}

function loadPreset(kind) {
  if (kind === 'user') fields = [{name:'id',type:'uuid'},{name:'name',type:'name'},{name:'email',type:'email'},{name:'phone',type:'phone'},{name:'city',type:'city'},{name:'country',type:'country'},{name:'age',type:'age'},{name:'job',type:'job'},{name:'company',type:'company'},{name:'createdAt',type:'datetime'}];
  else if (kind === 'product') fields = [{name:'sku',type:'uuid'},{name:'name',type:'lorem'},{name:'price',type:'price'},{name:'stock',type:'integer'},{name:'available',type:'boolean'},{name:'category',type:'job'}];
  else if (kind === 'order') fields = [{name:'orderId',type:'uuid'},{name:'customer',type:'name'},{name:'email',type:'email'},{name:'amount',type:'price'},{name:'paid',type:'boolean'},{name:'placedAt',type:'datetime'}];
  renderSchema();
}

function validateFields() {
  if (!fields.length) return t('noFields');
  const names = fields.map(f => f.name.trim());
  const empty = names.some(n => !n);
  if (empty) return t('selectFieldName');
  const uniq = new Set(names);
  if (uniq.size !== names.length) return t('selectFieldName');
  const bad = names.find(n => !/^[a-zA-Z_][a-zA-Z0-9_]*$/.test(n));
  if (bad) return t('invalidFieldName') + ` (bad: ${bad})`;
  return null;
}

function generateData() {
  const err = validateFields();
  if (err) { $('#status').innerHTML = `<span style="color:var(--accent)">${err}</span>`; return; }

  const rows = +$('#row-count').value || 10;
  const useSeed = $('#seed-check').checked;
  const seed = +$('#seed-val').value || 42;
  const rng = useSeed ? makeRng(seed) : Math.random;
  const pool = getPool();

  const t0 = performance.now();
  const out = [];
  for (let i = 0; i < rows; i++) {
    const row = {};
    for (const f of fields) {
      const gen = GENERATORS[f.type];
      row[f.name] = gen ? gen(rng, pool) : null;
    }
    out.push(row);
  }
  const ms = Math.round(performance.now() - t0);
  outputRows = out;
  renderOutput();
  $('#status').innerHTML = `<span class="stat-chip">📊 ${t('generated')(rows, ms)}</span><span class="stat-chip">📁 ${currentFormat.toUpperCase()}</span><span class="stat-chip">🌐 ${$('#locale').value}</span>`;
}

function renderOutput() {
  const data = formatOutput(outputRows, currentFormat);
  const text = currentFormat === 'json' ? JSON.stringify(JSON.parse(data), null, 2) : data;
  $('#output').textContent = text || '[]';
}

function formatOutput(rows, fmt) {
  if (!rows.length) return '';
  if (fmt === 'json') return JSON.stringify(rows, null, 2);
  if (fmt === 'csv') {
    const headers = fields.map(f => f.name);
    const escape = v => {
      if (v === null || v === undefined) return '';
      const s = String(v);
      return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const lines = [headers.join(',')];
    rows.forEach(r => lines.push(headers.map(h => escape(r[h])).join(',')));
    return lines.join('\n');
  }
  if (fmt === 'sql') {
    const table = 'mock_data';
    const cols = fields.map(f => `\`${f.name}\``).join(', ');
    const lines = [`-- Generated ${rows.length} rows`, `INSERT INTO \`${table}\` (${cols}) VALUES`];
    rows.forEach((r, i) => {
      const vals = fields.map(f => {
        const v = r[f.name];
        if (v === null) return 'NULL';
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        return `'${String(v).replace(/'/g, "''")}'`;
      }).join(', ');
      lines.push(`(${vals})${i < rows.length - 1 ? ',' : ';'}`);
    });
    return lines.join('\n');
  }
  return '';
}

document.addEventListener('DOMContentLoaded', () => {
  renderSchema();
  $('#toolbar').innerHTML = '';
  $('#add-field').onclick = () => { fields.push({ name: `field${fields.length+1}`, type: 'name' }); renderSchema(); };
  $('#preset-user').onclick = () => loadPreset('user');
  $('#preset-product').onclick = () => loadPreset('product');
  $('#preset-order').onclick = () => loadPreset('order');
  $('#generate').onclick = generateData;
  $('#seed-check').addEventListener('change', e => { $('#seed-val').disabled = !e.target.checked; });
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      tab.classList.add('active');
      currentFormat = tab.dataset.fmt;
      if (outputRows.length) renderOutput();
    });
  });
  $('#copy-btn').onclick = () => copyText($('#output').textContent);
  $('#download-btn').onclick = () => {
    const ext = { json: 'json', csv: 'csv', sql: 'sql' }[currentFormat];
    dl(`mock-data.${ext}`, $('#output').textContent, 'text/plain');
  };
});
