<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What are Cursor Rules?","acceptedAnswer":{"@type":"Answer","text":"Cursor Rules are project-level instruction files that tell Cursor IDE's AI assistant how to behave in your codebase — your coding style, preferred libraries, architecture conventions and what the AI should never do. They turn generic autocomplete into a pair programmer that already knows your team's conventions."}},{"@type":"Question","name":"What is the difference between .cursorrules and .cursor/rules/*.mdc?","acceptedAnswer":{"@type":"Answer","text":".cursorrules is the legacy single file in the project root. The newer format stores rules as .mdc files inside .cursor/rules/, each with frontmatter (description, globs, alwaysApply) so rules can be scoped to specific file patterns. Plain .md files in .cursor/rules are ignored; if you prefer plain markdown, use AGENTS.md instead."}},{"@type":"Question","name":"Does this generator upload my project data?","acceptedAnswer":{"@type":"Answer","text":"No. The generator runs entirely in your browser — your language, framework and preference selections never leave the page, and no account or API key is required."}},{"@type":"Question","name":"How do I install the generated rules file?","acceptedAnswer":{"@type":"Answer","text":"For the legacy format, save the output as .cursorrules in your project root. For the modern format, create a .cursor/rules/ folder in your project and save the output as a .mdc file such as project.mdc. Commit it to git so your whole team shares the same rules."}}]}</script>

<script>
GZI18n.register({
  en: {
    toolTitle: 'Cursor Rules Generator',
    toolDesc: 'Build a custom Cursor Rules file (.cursorrules or .cursor/rules/*.mdc) for your stack in seconds. Free, runs entirely in your browser.',
    lblLang: 'Primary language',
    lblFw: 'Framework',
    lblDetail: 'Rule detail',
    lblFmt: 'Output format',
    optConcise: 'Concise',
    optDetailed: 'Detailed',
    optFmtMdc: '.cursor/rules/*.mdc (modern)',
    optFmtLegacy: '.cursorrules (legacy)',
    optStrict: 'Strict typing',
    optTests: 'Test-first workflow',
    optFunc: 'Functional style',
    optComments: 'Minimal comments',
    optA11y: 'Accessibility',
    optPerf: 'Performance-aware',
    lblOut: 'Generated rules file',
    btnGen: 'Generate',
    btnCopy: 'Copy',
    btnDl: 'Download',
    generated: '✓ Rules generated — save it to your project root',
    step1: 'Pick your primary language and framework',
    step2: 'Tick the coding preferences that match your team',
    step3: 'Choose the output format: modern .mdc or legacy .cursorrules',
    step4: 'Click Generate, then Copy or Download into your project',
  },
  zh: {
    toolTitle: 'Cursor 规则生成器',
    toolDesc: '为你的技术栈一键生成 Cursor 规则文件（.cursorrules 或 .cursor/rules/*.mdc）。免费，完全在浏览器本地运行。',
    lblLang: '主要语言',
    lblFw: '框架',
    lblDetail: '规则详细程度',
    lblFmt: '输出格式',
    optConcise: '简洁',
    optDetailed: '详细',
    optFmtMdc: '.cursor/rules/*.mdc（新版）',
    optFmtLegacy: '.cursorrules（旧版）',
    optStrict: '严格类型',
    optTests: '测试先行',
    optFunc: '函数式风格',
    optComments: '精简注释',
    optA11y: '无障碍',
    optPerf: '性能优先',
    lblOut: '生成的规则文件',
    btnGen: '生成',
    btnCopy: '复制',
    btnDl: '下载',
    generated: '✓ 规则已生成 — 保存到项目根目录即可',
    step1: '选择主要语言和框架',
    step2: '勾选符合团队习惯的编码偏好',
    step3: '选择输出格式：新版 .mdc 或旧版 .cursorrules',
    step4: '点击「生成」，然后复制或下载到项目里',
  }
});

const { $, copyText, t } = GZ;

const OPTS = [['strict','optStrict'],['tests','optTests'],['func','optFunc'],['comments','optComments'],['a11y','optA11y'],['perf','optPerf']];
$('#opts').innerHTML = OPTS.map(([v,k]) => `<label><input type="checkbox" value="${v}" ${['strict','tests','a11y'].includes(v)?'checked':''}> ${t(k)}</label>`).join('');
$('#lbl-lang').textContent = t('lblLang'); $('#lbl-fw').textContent = t('lblFw');
$('#lbl-detail').textContent = t('lblDetail'); $('#lbl-fmt').textContent = t('lblFmt');
$('#opt-concise').textContent = t('optConcise'); $('#opt-detailed').textContent = t('optDetailed');
$('#opt-fmt-mdc').textContent = t('optFmtMdc'); $('#opt-fmt-legacy').textContent = t('optFmtLegacy');
$('#lbl-out').textContent = t('lblOut');

const LANG_RULES = {
  TypeScript: 'Use TypeScript everywhere with strict mode enabled. Prefer interfaces for public API shapes and type inference for locals. Never use `any` without a `// why` comment.',
  JavaScript: 'Use modern ES2022+ JavaScript (modules, optional chaining, async/await). Prefer `const` over `let`; never use `var`.',
  Python: 'Use Python 3.11+ with full type hints on every function signature. Prefer dataclasses and pathlib; use uv or poetry for dependency management.',
  Go: 'Write idiomatic Go: explicit error handling with wrapped errors (`fmt.Errorf("%w")`), small interfaces, context as first parameter.',
  Rust: 'Write idiomatic Rust: no `unwrap()`/`expect()` outside tests, prefer `thiserror`/`anyhow` patterns, borrow-checker-friendly APIs.',
  Java: 'Use Java 17+ features (records, sealed types, switch expressions). Prefer immutability and constructor injection.',
  'C#': 'Use modern C# (.NET 8+): nullable reference types enabled, records for DTOs, async/await with ConfigureAwait where appropriate.',
  PHP: 'Use PHP 8.3+ with strict_types=1, constructor property promotion, and enums instead of class constants.',
  Ruby: 'Keep Ruby methods short (max 10 lines), prefer keyword arguments, and use rubocop defaults.',
  'C++': 'Use C++20: RAII everywhere, smart pointers instead of raw new/delete, std::optional over sentinel values.'
};
const FW_RULES = {
  React: 'Components are function-only with hooks. Colocate component, hook, test and styles in one folder. State stays local unless genuinely shared.',
  'Next.js': 'Prefer Server Components and Server Actions; keep client components small and leaf-level. Use the App Router conventions and next/image for all images.',
  Vue: 'Use Vue 3 Composition API with <script setup>. Props are declared with defineProps and typed. Pinia is the only state library.',
  Svelte: 'Use Svelte 5 runes ($state/$derived/$effect). Keep logic in .svelte files, not stores, unless shared across routes.',
  Angular: 'Use standalone components, signals for state, and inject() instead of constructor injection. No NgModules in new code.',
  'Node.js / Express': 'Keep routes thin: validation at the edge (zod), business logic in services, data access in repositories. Never trust req.body directly.',
  Django: 'Business logic lives in services, not views. Querysets are filtered in one place; N+1 queries are prevented with select_related/prefetch_related.',
  FastAPI: 'Pydantic v2 models for every request/response. Dependency injection for DB sessions. No business logic inside route handlers.',
  Laravel: 'Use Eloquent carefully (eager-load relations), Form Requests for validation, Actions/Services for business logic, thin controllers.'
};
const OPT_RULES = {
  strict: ['Enforce strict typing: no implicit any, no unchecked casts. If a type is unknown, model it as a discriminated union instead of widening it.'],
  tests: ['Test-first workflow: every new behavior gets a failing test first. Run the test suite after every change and never delete a failing test to make the build pass.'],
  func: ['Prefer pure functions and immutable data. Mutations live at the edges. Avoid classes unless they model a clear lifecycle.'],
  comments: ['Write minimal comments: only explain WHY, never WHAT. Delete commented-out code instead of keeping it.'],
  a11y: ['All interactive UI is accessible: semantic HTML first, keyboard operability, visible focus states, and aria-labels only when semantics are not enough.'],
  perf: ['Performance-aware: avoid re-rendering whole lists, memoize only measured hot spots, lazy-load heavy routes, and never ship unbounded queries.']
};

function generate() {
  const lang = $('#lang').value, fw = $('#fw').value, detail = $('#detail').value, fmt = $('#fmt').value;
  const picked = [...document.querySelectorAll('#opts input:checked')].map(i => i.value);
  const D = detail === 'detailed';
  const sections = [];
  sections.push(['Core behavior', D
    ? 'You are a senior engineer on this codebase. Read surrounding files before writing code and match the existing conventions exactly. Prefer the smallest diff that fully solves the problem. Never invent APIs — check imports and package manifests first.'
    : 'Match existing codebase conventions. Prefer the smallest correct diff. Never invent APIs.']);
  sections.push(['Stack', [LANG_RULES[lang], fw !== 'None' ? FW_RULES[fw] : null].filter(Boolean).join('\n')]);
  const optLines = picked.flatMap(v => OPT_RULES[v]);
  if (optLines.length) sections.push(['Coding standards', optLines.join('\n')]);
  if (D) sections.push(['Never do', '- Do not add new dependencies without asking first.\n- Do not refactor unrelated code in the same change.\n- Do not leave TODOs in place of a real fix.\n- Do not silence errors with empty catch blocks or type-ignore comments.']);
  const body = sections.map(([h, txt]) => `## ${h}\n${txt}`).join('\n\n');
  let out;
  if (fmt === 'mdc') {
    out = `---\ndescription: Project-wide coding rules for ${lang}${fw !== 'None' ? ' + ' + fw : ''}\nglobs: ["**/*"]\nalwaysApply: true\n---\n\n${body}\n`;
  } else {
    out = `# Cursor Rules — ${lang}${fw !== 'None' ? ' / ' + fw : ''}\n\n${body}\n`;
  }
  $('#output').textContent = out;
  $('#status').innerHTML = `<span style="color:var(--gz-success)">${t('generated')}</span>`;
  return out;
}

$('#toolbar').innerHTML = `
  <button class="gz-btn" onclick="generate()">${t('btnGen')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="copyText($('#output').textContent)">${t('btnCopy')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="dl()">${t('btnDl')}</button>`;

function dl() {
  const out = generate();
  const name = $('#fmt').value === 'mdc' ? 'project.mdc' : '.cursorrules';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([out], {type:'text/plain'}));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}

['lang','fw','detail','fmt'].forEach(id => $('#'+id).addEventListener('change', generate));
document.querySelectorAll('#opts input').forEach(i => i.addEventListener('change', generate));
generate();

GZ.renderToolPage({
  category: 'dev',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'📝', href:'/dev/agents-md-generator.html', name:'AGENTS.md Generator'},
    {icon:'🔌', href:'/dev/mcp-config-generator.html', name:'MCP Config Generator'},
    {icon:'📚', href:'/dev/readme-generator.html', name:'README Generator'},
    {icon:'📋', href:'/dev/changelog-generator.html', name:'Changelog Generator'},
  ]
});
</script>
<script src="/tools-result-rec.js?v=R449-flat" defer></script>
</body>
