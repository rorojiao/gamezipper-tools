GZI18n.register({en:{toolTitle:'JSON Schema to Mock Data',toolDesc:'Generate realistic mock data from a JSON Schema locally in your browser. Respects types, enums, formats, lengths and numeric bounds.',note:'Paste a JSON Schema, choose a count, and click Generate to produce test data that matches the schema. Nothing leaves your browser.',schema:'JSON Schema',output:'Mock data',generate:'Generate mock data',count:'Count:',example:'Load example',copy:'Copy output',clear:'Clear',copied:'Mock data copied.',empty:'Paste a JSON Schema first.',invalid:'Invalid JSON: ',step1:'Paste a valid JSON Schema into the input.',step2:'Set the count (1 to 500) of mock objects to generate.',step3:'Click Generate and copy the resulting JSON array into your fixtures or seed scripts.'},zh:{toolTitle:'JSON Schema 转测试数据',toolDesc:'在浏览器本地从 JSON Schema 生成符合类型、枚举、格式、长度和数值范围的真实测试数据。',note:'粘贴 JSON Schema，设置数量后点击生成即可产出与 Schema 匹配的测试数据。数据不会离开浏览器。',schema:'JSON Schema',output:'测试数据',generate:'生成测试数据',count:'数量：',example:'载入示例',copy:'复制输出',clear:'清空',copied:'测试数据已复制。',empty:'请先粘贴 JSON Schema。',invalid:'JSON 无效：',step1:'将有效的 JSON Schema 粘贴到输入框中。',step2:'设置要生成的测试数据条数（1 到 500）。',step3:'点击生成，将输出的 JSON 数组复制到你的 fixture 或 seed 脚本中。'}});
const { $, t, copyText }=GZ;
const FIRST_NAMES=['Aria','Noah','Mia','Liam','Zoe','Ethan','Iris','Owen','Maya','Leo','Nora','Caleb','Sage','Jude','Luna','Finn','Esme','Theo','Ruby','Asher','Iris','Wyatt','Cora','Felix','Iris'];
const LAST_NAMES=['Carter','Hayes','Brooks','Quinn','Reed','Stone','Vega','Pace','Holt','Lane','Wells','Drew','Frost','Knox','West','Bauer','Cline','Hale','Rios','Vance'];
const CITIES=['Portland','Asheville','Salem','Marin','Boulder','Berkeley','Olympia','Eugene','Bozeman','Telluride','Tacoma','Tucson','Boise','Madison','Helena','Reno','Fresno','Juneau'];
const STREETS=['Maple','Cedar','Pine','Oak','Elm','Walnut','Ash','Birch','Willow','Cherry','Aspen','Spruce'];
const DOMAINS=['example.com','acme.io','contoso.dev','northwind.co','initech.org','globex.net','umbrella.app','stark.tech'];
const PRODUCTS=['Aurora Lamp','Nimbus Mug','Cinder Stool','Lyra Lamp','Mesa Planter','Echo Speaker','Halo Clock','Drift Chair','Onyx Pen','Cove Backpack'];
const EXAMPLE_SCHEMA=JSON.stringify({title:'User',type:'object',properties:{id:{type:'string',format:'uuid'},firstName:{type:'string',minLength:3,maxLength:18},lastName:{type:'string',minLength:2,maxLength:20},age:{type:'integer',minimum:18,maximum:72},email:{type:'string',format:'email'},role:{enum:['admin','member','guest']},active:{type:'boolean'},signupAt:{type:'string',format:'date-time'},address:{$ref:'#/$defs/Address'},tags:{type:'array',items:{type:'string'},minItems:1,maxItems:5}},required:['id','firstName','lastName','email','role'],$defs:{Address:{type:'object',properties:{city:{type:'string'},zip:{type:'string',pattern:'^[0-9]{5}$'}},required:['city','zip']}}},null,2);
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function randFloat(min,max){return Math.random()*(max-min)+min;}
function uuidv4(){return'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&0x3|0x8)).toString(16);});}
function pad(n,w){const s=String(n);return s.length>=w?s:'0'.repeat(w-s.length)+s;}
function isoDate(){const d=new Date(Date.now()-randInt(0,365*24*3600*1000));return d.toISOString();}
function fakeEmail(name){const d=pick(DOMAINS);return name.toLowerCase().replace(/[^a-z]/g,'')+'@'+d;}
function fakeString(constraints){const min=Math.max(1,constraints.minLength||3);const max=Math.max(min,constraints.maxLength||Math.max(8,min+8));const len=randInt(min,max);const chars='abcdefghijklmnopqrstuvwxyz';let out='';for(let i=0;i<len;i++)out+=chars[Math.floor(Math.random()*chars.length)];return out.charAt(0).toUpperCase()+out.slice(1);}
function fakeFirstName(){return pick(FIRST_NAMES);}
function fakeLastName(){return pick(LAST_NAMES);}
function fakeCity(){return pick(CITIES);}
function fakeStreet(){return randInt(100,9999)+' '+pick(STREETS)+' St';}
function patternMatch(p){try{const m=p.match(/^\^?(.+?)\$?$/);if(!m)return'abc123';const body=m[1];if(body==='[0-9]{5}')return String(randInt(10000,99999));if(body.startsWith('[0-9]{')&&body.endsWith('}')){const n=parseInt(body.slice(6,-1),10);let out='';for(let i=0;i<n;i++)out+=randInt(0,9);return out;}return body.replace(/\[0-9\]/g,()=>randInt(0,9)).replace(/\[a-z\]/g,()=>String.fromCharCode(97+randInt(0,25)));}catch(e){return'abc123';}}
function makeMock(schema,root,defs){const ctx=Object.assign({defs},defs||{});function resolveRef(ref){const parts=ref.replace(/^#\//,'').split('/').map(p=>p.replace(/~1/g,'/').replace(/~0/g,'~'));let node=schema;for(const p of parts)node=node&&node[p];return node;}function gen(s,propName){if(!s||typeof s!=='object')return null;if(s.$ref){const target=resolveRef(s.$ref);return target?gen(target,propName):null;}if(Object.prototype.hasOwnProperty.call(s,'const'))return s.const;if(Array.isArray(s.enum)&&s.enum.length)return pick(s.enum);for(const k of['oneOf','anyOf'])if(Array.isArray(s[k])&&s[k].length)return gen(pick(s[k]),propName);if(Array.isArray(s.allOf)){const merged={type:'object',properties:{},required:[]};for(const part of s.allOf){if(part.properties)Object.assign(merged.properties,part.properties);if(Array.isArray(part.required))merged.required=merged.required.concat(part.required);if(part.type)merged.type=part.type;}if(merged.properties&&Object.keys(merged.properties).length){return genObject(merged,propName);}return gen(s.allOf[0],propName);}if(s.type==='object'||s.properties||s.additionalProperties)return genObject(s,propName);if(s.type==='array'||s.items){const min=Math.max(0,s.minItems||1);const max=Math.max(min,s.maxItems||Math.max(min+1,3));const len=randInt(min,max);const arr=[];for(let i=0;i<len;i++)arr.push(gen(s.items||{},propName+'Item'));return arr;}if(Array.isArray(s.type)){const nonNull=s.type.filter(x=>x!=='null');return gen({...s,type:pick(nonNull)},propName);}if(s.type==='string'){const c=s;if(c.format==='email')return fakeEmail(fakeFirstName()+'.'+fakeLastName());if(c.format==='uuid')return uuidv4();if(c.format==='uri'||c.format==='url')return'https://'+pick(DOMAINS)+'/'+fakeString({minLength:4,maxLength:10});if(c.format==='date-time')return isoDate();if(c.format==='date')return isoDate().slice(0,10);if(c.format==='time')return pad(randInt(0,23),2)+':'+pad(randInt(0,59),2)+':'+pad(randInt(0,59),2);if(c.pattern)return patternMatch(c.pattern);if(propName){const lower=propName.toLowerCase();if(lower.includes('email'))return fakeEmail(fakeFirstName()+'.'+fakeLastName());if(lower.includes('uuid')||lower==='id')return uuidv4();if(lower==='firstname'||lower==='first_name'||lower==='givenname')return fakeFirstName();if(lower==='lastname'||lower==='last_name'||lower==='surname'||lower==='familyname')return fakeLastName();if(lower==='name'||lower==='fullname')return fakeFirstName()+' '+fakeLastName();if(lower==='city')return fakeCity();if(lower==='street')return fakeStreet();if(lower==='zip'||lower==='postalcode'||lower==='postal_code')return String(randInt(10000,99999));if(lower==='country')return'US';if(lower==='phone'||lower==='phonenumber')return'+1-'+pad(randInt(200,999),3)+'-'+pad(randInt(100,999),3)+'-'+pad(randInt(1000,9999),4);if(lower==='product'||lower==='title')return pick(PRODUCTS);}return fakeString(c);}if(s.type==='integer')return randInt(Math.floor(s.minimum||-1000),Math.floor(s.maximum||1000));if(s.type==='number')return parseFloat(randFloat(s.minimum||-1000,s.maximum||1000).toFixed(2));if(s.type==='boolean')return Math.random()<0.5;if(s.type==='null')return null;return null;}function genObject(s,propName){const obj={};const props=s.properties||{};const required=new Set(s.required||[]);for(const [key,sub]of Object.entries(props)){if(required.has(key)||Math.random()<0.55)obj[key]=gen(sub,key);}if(s.additionalProperties&&typeof s.additionalProperties==='object'&&Math.random()<0.4){for(let i=0;i<randInt(1,3);i++){const k='extra'+randInt(1,99);obj[k]=gen(s.additionalProperties,k);}}return obj;}return gen(schema,root||'Root');}
function generateMock(){const raw=$('#schema').value.trim();if(!raw){$('#status').textContent=t('empty');$('#status').className='jsm-status error';return;}let schema;try{schema=JSON.parse(raw);}catch(error){$('#status').textContent=t('invalid')+error.message;$('#status').className='jsm-status error';return;}const count=Math.max(1,Math.min(500,parseInt($('#count').value,10)||1));const records=[];for(let i=0;i<count;i++)records.push(makeMock(schema,schema.title||'Root'));const out=count===1?JSON.stringify(records[0],null,2):JSON.stringify(records,null,2);$('#output').value=out;$('#status').textContent='';$('#status').className='jsm-status';}
$('#schema-label').textContent=t('schema');$('#output-label').textContent=t('output');$('#note').textContent=t('note');$('#generate').textContent=t('generate');$('#count-label').textContent=t('count');$('#example').textContent=t('example');$('#copy').textContent=t('copy');$('#clear').textContent=t('clear');$('#schema').value=EXAMPLE_SCHEMA;generateMock();$('#generate').onclick=generateMock;$('#example').onclick=()=>{$('#schema').value=EXAMPLE_SCHEMA;generateMock();};$('#copy').onclick=()=>{if($('#output').value){copyText($('#output').value);$('#status').textContent=t('copied');$('#status').className='jsm-status';}};$('#clear').onclick=()=>{$('#schema').value='';$('#output').value='';$('#status').textContent='';};GZ.renderToolPage({category:'dev',titleKey:'toolTitle',descKey:'toolDesc',howToSteps:['step1','step2','step3'],related:[{icon:'wand',href:'/dev/mock-data-generator.html',name:'Mock Data Generator'},{icon:'braces',href:'/dev/json-schema-generator.html',name:'JSON Schema Generator'},{icon:'code',href:'/dev/json-schema-to-zod.html',name:'JSON Schema to Zod'},{icon:'file',href:'/dev/json-schema-to-typescript.html',name:'JSON Schema to TypeScript'}]});
</script><script src="/tools-result-rec.js?v=R449-flat" defer></script></body></html>
