<script>
GZI18n.register({
  en: {
    toolTitle: 'Simplified ⇄ Traditional Chinese Converter',
    toolDesc: 'Convert Chinese text between Simplified and Traditional characters instantly. Context-aware: resolves one-to-many characters like 发→發/髮 correctly. 100% offline and private.',
    toTrad: '简体 → 繁體 (S → T)',
    toSimp: '繁體 → 简体 (T → S)',
    copy: 'Copy result',
    clear: 'Clear',
    sample: 'Try sample text',
    stat: chars => chars + ' characters · ' + (chars ? 'converted' : 'waiting for input'),
    statChanged: (chars, ch) => chars + ' characters · ' + ch + ' characters changed',
    notePhrase: 'Conversion is phrase-aware: 头发→頭髮 (hair), 发工资→發工資 (pay salary), 皇后 stays 皇后 (empress). Only Chinese characters are touched — punctuation, numbers and English stay as they are.',
    step1: 'Paste or type your Chinese text into the input box',
    step2: 'Pick the direction: Simplified→Traditional or Traditional→Simplified',
    step3: 'The converted text appears instantly, including context fixes for ambiguous characters',
    step4: 'Click “Copy result” to paste it anywhere',
  },
  zh: {
    toolTitle: '简体中文繁体转换器',
    toolDesc: '一键在简体与繁体之间互转中文文本。上下文智能识别一字多繁（发→發/髮、后→後/皇后保留）。完全离线运行，文本不出本机。',
    toTrad: '简体 → 繁體',
    toSimp: '繁體 → 简体',
    copy: '复制结果',
    clear: '清空',
    sample: '试试示例',
    stat: chars => chars + ' 字',
    statChanged: (chars, ch) => chars + ' 字 · ' + ch + ' 字被转换',
    notePhrase: '转换基于词组上下文：头发→頭髮、发工资→發工資、皇后保持不变（与 OpenCC 同源词典）。标点、数字、英文原样保留。',
    step1: '在输入框粘贴或输入中文文本',
    step2: '选择方向：简转繁或繁转简',
    step3: '结果即时生成，歧义字按词组上下文自动消歧',
    step4: '点击「复制结果」即可粘贴到任意位置',
  }
});

const { $, copyText, t } = GZ;
let dir = 's2t';
const SAMPLE = {
  s2t: '你在里面把头发整理好，后面的干部说方便面已经凉了。皇后的复杂关系背后，是干净的台面。发展经济，发行报纸。',
  t2s: '他在這裡整理頭髮，發現後面的幹部說方便麵已經涼了。皇后的複雜關係背後，是乾淨的檯面。發展經濟，發行報紙。'
};

function render(){
  const src = $('#src').value;
  if(!window.GZOpenCC){ return; }
  const out = dir==='s2t' ? GZOpenCC.s2t(src) : GZOpenCC.t2s(src);
  $('#out').value = out;
  const a = Array.from(src), b = Array.from(out);
  let ch = 0;
  if(a.length===b.length){ for(let i=0;i<a.length;i++){ if(a[i]!==b[i]) ch++; } }
  $('#stat').textContent = ch ? t('statChanged')(a.length, ch) : t('stat')(a.length);
}

function setDir(d){
  dir = d;
  $('#mS2T').classList.toggle('on', d==='s2t');
  $('#mT2S').classList.toggle('on', d==='t2s');
  render();
}
$('#mS2T').addEventListener('click', ()=>setDir('s2t'));
$('#mT2S').addEventListener('click', ()=>setDir('t2s'));
$('#src').addEventListener('input', render);

$('#toolbar').innerHTML =
  `<button class="gz-btn" onclick="copyText($('#out').value)">${t('copy')}</button>`+
  `<button class="gz-btn gz-btn-secondary" onclick="$('#src').value='';render()">${t('clear')}</button>`+
  `<button class="gz-btn gz-btn-secondary" onclick="$('#src').value=SAMPLE[dir];render()">${t('sample')}</button>`;
$('#mS2T').textContent = t('toTrad');
$('#mT2S').textContent = t('toSimp');
$('#note').textContent = t('notePhrase');

GZ.renderToolPage({
  category:'convert',
  titleKey:'toolTitle',
  descKey:'toolDesc',
  howToSteps:['step1','step2','step3','step4'],
  related:[
    {icon:'🐉',href:'/fortune/chinese-zodiac.html',name:'Chinese Zodiac Calculator'},
    {icon:'🔊',href:'/text/text-to-speech.html',name:'Text to Speech'},
    {icon:'🔢',href:'/text/letter-counter.html',name:'Letter & Word Counter'},
    {icon:'📈',href:'/text/word-frequency.html',name:'Word Frequency Counter'},
  ]
});
$('#src').value = SAMPLE.s2t;
render();
</script>
