<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is the character limit on Bluesky?","acceptedAnswer":{"@type":"Answer","text":"Bluesky enforces a 300-grapheme limit per post through the AT Protocol. A grapheme is one user-perceived character — most Latin letters are one grapheme, but a single emoji or a CJK ideograph often counts as one grapheme too. The cap is 300 graphemes, not bytes."}},{"@type":"Question","name":"How does Bluesky count emoji?","acceptedAnswer":{"@type":"Answer","text":"Bluesky uses the Intl.Segmenter grapheme algorithm. A simple emoji like 🎉 counts as 1 grapheme. A compound emoji like 👨‍👩‍👧‍👦 (family of four joined by ZWJ) counts as 1 grapheme too, even though it is made of many code points. A flag emoji like 🇯🇵 is 1 grapheme. An emoji followed by VS16 (variation selector) is 1 grapheme."}},{"@type":"Question","name":"Does this tool count URLs differently?","acceptedAnswer":{"@type":"Answer","text":"No. Unlike X (Twitter) which shortens URLs to 23 characters, Bluesky counts every character of every URL toward your 300-grapheme cap. This tool mirrors that rule — paste a long link and the count reflects the true impact on your post length."}},{"@type":"Question","name":"Is my draft Bluesky post stored or sent anywhere?","acceptedAnswer":{"@type":"Answer","text":"No. All counting happens locally in your browser using Intl.Segmenter. Your text never leaves your device and no account or login is required."}}]}</script>

<script>
GZI18n.register({
  en: {

    toolDesc: 'Real-time Bluesky character counter with the 300-grapheme limit. Uses Intl.Segmenter grapheme counting that mirrors the AT Protocol — emoji, CJK and compound emoji (👨‍👩‍👧‍👦) all count correctly.',
    lblIn: 'Your Bluesky post text',

    lblGraphemes: 'Graphemes',

    platforms: 'Compare platforms',
  },
  zh: {
    toolTitle: 'Bluesky 字符计数器',
    toolDesc: '实时统计 Bluesky 字符数，遵守 300 字位（grapheme）限制。使用与 AT Protocol 一致的 Intl.Segmenter 字位计数 — Emoji、中日韩字符、复合 Emoji（👨‍👩‍👧‍👦）都能准确计数。',
    lblIn: 'Bluesky 帖子内容',
    placeholder: '在此输入或粘贴帖子…',
    lblGraphemes: '字位',
    lblCodePoints: '码位',
    lblWords: '词数',
    lblLines: '行数',
    lblEmoji: 'Emoji',
    lblUrls: '链接',
    ringLeft: '剩余',
    ringUsed: '已用',
    okMsg: '✅ 在 300 字位限制内，可以发布。',
    overMsg: '⚠️ 超出限制 — 需删除 {n} 个字位才能发布。',
    exactlyMsg: '🎯 正好达到 300 字位限制。',
    btnShare: '🦋 在 Bluesky 中打开',
    btnCopy: '📋 复制文本',
    btnClear: '🗑️ 清空',
    info: 'Bluesky 使用 AT Protocol，通过 Intl.Segmenter 进行严格字位计数。复合 Emoji（家庭、国旗）每个计为 1 字位。链接的每个字符都计入 300 字位上限 — 没有 t.co 式缩短。',

    step3: '点击平台标签切换限制对比',

    tipBluesky: '<b>提示：</b>Bluesky 使用字位簇 — 像 🇯🇵 或 👨‍👩‍👧‍👦 这样的 Emoji 每个计为 <b>1</b>。删除变体选择符和 ZWJ 连接可节省字数。',

    tipThreads: '<b>提示：</b>Threads 按原始 Unicode 码位计数 — Emoji 和中日韩字符通常每个计 1。链接不缩短。',
    tipMastodon: '<b>提示：</b>Mastodon 默认 500 字符（原始码位）。部分实例允许 1500+。链接不缩短。',
    tipLinkedIn: '<b>提示：</b>LinkedIn 按原始字符计数（非字位）。只有实际发布的 hashtag 才计入 3000 字符限制。',
    platforms: '对比平台',
  }

const { $, t } = GZ;

// Platform presets (limit, icon, name, share URL builder, tip key)
const PLATFORMS = [
  {id:'bluesky',  limit:300,  icon:'🦋', name:'Bluesky',  shareFn:txt=>'https://bsky.app/intent/compose?text='+encodeURIComponent(txt), tipKey:'tipBluesky'},
  {id:'threads',  limit:500,  icon:'🧵', name:'Threads',  shareFn:txt=>'https://www.threads.net/intent/post?text='+encodeURIComponent(txt), tipKey:'tipThreads'},
  {id:'x',        limit:280,  icon:'𝕏',  name:'X (Twitter)', shareFn:txt=>'https://x.com/intent/post?text='+encodeURIComponent(txt), tipKey:'tipX'},
  {id:'mastodon', limit:500,  icon:'🐘', name:'Mastodon', shareFn:txt=>'https://mastodon.social/share?text='+encodeURIComponent(txt), tipKey:'tipMastodon'},
  {id:'linkedin', limit:3000, icon:'💼', name:'LinkedIn', shareFn:txt=>'https://www.linkedin.com/sharing/share-offsite/?url='+encodeURIComponent(txt), tipKey:'tipLinkedIn'},
];
let currentPlatform = PLATFORMS[0];

const URL_RE = /(https?:\/\/[^\s<>"']+)/gi;
const EMOJI_RE = /\p{Extended_Pictographic}/u;
let _seg = null;
try { _seg = new Intl.Segmenter(undefined, {granularity:'grapheme'}); } catch(e) {}

// Count graphemes using Intl.Segmenter (matches AT Protocol behavior)
function countGraphemes(text) {
  if (_seg) {
    let n = 0;
    for (const _ of _seg.segment(text)) n++;
    return n;
  }
  // Fallback: Array.from (counts code points, not graphemes, but better than nothing)
  return Array.from(text).length;
}

function countStats(text) {
  let urlCount = 0, emoji = 0;
  const deurl = text.replace(URL_RE, m => { urlCount++; return '\u0000'; });
  for (const ch of deurl) {
    if (EMOJI_RE.test(ch)) emoji++;
  }
  const graphemes = countGraphemes(text);
  const codePoints = Array.from(text).length;
  const words = deurl.replace(/\u0000/g,' ').trim().split(/\s+/).filter(Boolean).length + urlCount;
  const lines = text === '' ? 1 : text.split(/\n/).length;
  return {graphemes, codePoints, emoji, urlCount, words, lines};
}

function update() {
  const text = $('#input').value;
  const r = countStats(text);
  const limit = currentPlatform.limit;
  const left = limit - r.graphemes;
  const over = left < 0;

  $('#statGraphemes').textContent = r.graphemes;
  $('#statCodePoints').textContent = r.codePoints;
  $('#statWords').textContent = r.words;
  $('#statLines').textContent = r.lines;
  $('#statEmoji').textContent = r.emoji;
  $('#statUrls').textContent = r.urlCount;

  const ring = $('#ringFill');
  const circ = 389.56;
  const pct = Math.min(r.graphemes / limit, 1);
  ring.style.strokeDashoffset = circ * (1 - pct);

  const big = $('#ringBig');
  const small = $('#ringSmall');
  big.classList.toggle('over-limit', over);
  if (over) {
    big.textContent = Math.abs(left);
    small.textContent = 'OVER';
    ring.style.stroke = 'var(--gz-danger,#e94560)';
    $('#verdict').innerHTML = t('overMsg').replace('{n}', '<b>' + Math.abs(left) + '</b>');
    $('#verdict').style.color = 'var(--gz-danger,#e94560)';
  } else {
    big.textContent = left;
    small.textContent = t('ringLeft');
    ring.style.stroke = left === 0 ? '#f5a623' : '#0085ff';
    if (left === 0) { $('#verdict').textContent = t('exactlyMsg'); $('#verdict').style.color = '#f5a623'; }
    else { $('#verdict').textContent = t('okMsg'); $('#verdict').style.color = 'var(--gz-success,#2ecc71)'; }
  }
  // update tip
  const tipKey = currentPlatform.tipKey;
  $('#tip').innerHTML = t(tipKey);
}

function switchPlatform(p) {
  currentPlatform = p;
  document.querySelectorAll('.bsky-platform').forEach(el => {
    el.classList.toggle('active', el.dataset.id === p.id);
  });
  update();
}

function renderPlatforms() {
  const wrap = $('#platforms');
  wrap.innerHTML = '';
  for (const p of PLATFORMS) {
    const div = document.createElement('div');
    div.className = 'bsky-platform' + (p.id === currentPlatform.id ? ' active' : '');
    div.dataset.id = p.id;
    div.innerHTML = `<span class="picon">${p.icon}</span><div class="pname">${p.name}</div><div class="plimit">${p.limit} chars</div>`;
    div.onclick = () => switchPlatform(p);
    wrap.appendChild(div);
  }
}

function shareBluesky() {
  const text = $('#input').value.trim();
  const url = currentPlatform.shareFn(text);
  window.open(url, '_blank', 'noopener');
}

function relabel() {
  $('#lbl-in').textContent = t('lblIn');
  $('#input').placeholder = t('placeholder');
  $('#lblGraphemes').textContent = t('lblGraphemes');
  $('#lblCodePoints').textContent = t('lblCodePoints');
  $('#lblWords').textContent = t('lblWords');
  $('#lblLines').textContent = t('lblLines');
  $('#lblEmoji').textContent = t('lblEmoji');
  $('#lblUrls').textContent = t('lblUrls');
  $('#btnShare').textContent = t('btnShare');
  $('#btnCopy').textContent = t('btnCopy');
  $('#btnClear').textContent = t('btnClear');
  $('#info').textContent = t('info');
}
renderPlatforms();
relabel();
update();

GZ.renderToolPage({
  category: 'social',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'𝕏', href:'/social/twitter-character-counter.html', name:'X Character Counter'},
    {icon:'📝', href:'/text/word-counter.html', name:'Word Counter'},
    {icon:'🔢', href:'/text/letter-counter.html', name:'Letter Counter'},
    {icon:'💬', href:'/social/discord-embed.html', name:'Discord Embed'},
  ]
});
</script>
