<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "What is a SKILL.md file?", "acceptedAnswer": {"@type": "Answer", "text": "SKILL.md is a plain-Markdown file with a small YAML frontmatter block (name and description) followed by instructions. It packages a reusable capability — procedures, conventions and examples — that AI coding agents such as Claude Code, Cursor, OpenAI Codex and Gemini CLI load automatically when a task matches the description. Skills are often described as installable know-how for agents, complementing AGENTS.md, which describes the repository instead of a task."}}, {"@type": "Question", "name": "Where do I put a SKILL.md file?", "acceptedAnswer": {"@type": "Answer", "text": "Each skill lives in its own folder containing SKILL.md. Personal skills go in ~/.claude/skills/<name>/SKILL.md for Claude Code, project skills in .claude/skills/<name>/ inside the repo. Cursor uses .agents/skills/<name>/SKILL.md, and other agents follow similar skills/ conventions. The generator shows the exact install path for the agent you pick."}}, {"@type": "Question", "name": "What are the rules for the name and description fields?", "acceptedAnswer": {"@type": "Answer", "text": "The name must be lowercase letters, digits and hyphens, up to 64 characters, and it must match the folder name. The description (up to 1024 characters) is the most important line: the agent reads only the frontmatter first and decides whether to load the skill, so the description must state both what the skill does and when to use it, ideally with trigger words users actually type."}}, {"@type": "Question", "name": "Are skills the same as MCP servers or slash commands?", "acceptedAnswer": {"@type": "Answer", "text": "No. MCP servers add external tools and data connections; skills add instructions and expertise using the agent's existing tools; slash commands are user-triggered shortcuts. A skill can restrict which tools it uses with the optional allowed-tools field. Many teams use all three: MCP for connections, AGENTS.md for repo rules, and SKILL.md files for repeatable task procedures."}}]}</script>

<body>
<div class="gz-container">
  <div class="gz-tool-header">

    <div class="ck-line"><input type="checkbox" id="f-meta" checked><label id="l-meta" for="f-meta"></label></div>
    <div class="gz-toolbar" id="tb"></div>
    <div id="install-hint"></div>
    <h3 id="lbl-out" style="margin:14px 0 4px"></h3>
    <pre id="out-area"></pre>
  </div>
  <div class="gz-howto"><h2></h2><ol></ol></div>

</div>
<script>
GZI18n.register({
  en: {
    toolTitle: 'SKILL.md Generator',
    toolDesc: 'Create a SKILL.md file for Claude Code, Cursor, OpenAI Codex or Gemini CLI agent skills. Pick a preset, fill the description, when-to-use and instructions, choose allowed tools, then copy or download. Install paths shown per agent — nothing is uploaded.',
    pBlank: 'Blank', pDocs: 'Docs Writer', pReview: 'Code Reviewer', pData: 'Data Analyst', pCommits: 'Changelog Writer',
    presets: 'Preset:',
    lTarget: 'Target agent', lName: 'Skill name (lowercase, hyphens)', lDesc: 'Description — what it does AND when to use it (this is what the agent matches on)',
    lWhen: 'When to use (one per line)', lSteps: 'Instructions / procedure (one step per line)', lAvoid: 'Cautions & what to avoid (one per line, optional)',
    lTools: 'Restrict tools (allowed-tools, optional):', lMeta: 'Add metadata block (version, license)',
    copy: 'Copy SKILL.md', dl: 'Download SKILL.md', clear: 'Reset',
    output: 'Preview — SKILL.md',
    nameOk: 'OK — use this as the folder name too.', nameBad: 'Use lowercase letters, digits and hyphens only (max 64).',
    descCount: 'description characters (max 1024)',
    install: 'Install: save as',
    step1: 'Pick the target agent (Claude Code, Cursor, Codex or Gemini CLI) — the exact install folder is shown under the toolbar.',
    step2: 'Write a description that states both what the skill does and when to use it: agents only read the frontmatter to decide whether to load the skill, so include trigger phrases users actually type.',
    step3: 'Fill when-to-use lines and step-by-step instructions — the agent follows these literally once the skill is triggered. Keep the body under ~500 lines.',
    step4: 'Copy or download SKILL.md into a folder named after your skill (e.g. .claude/skills/release-notes-writer/SKILL.md), then restart or reload your agent and test it on a matching task.',
  },
  zh: {
    toolTitle: 'SKILL.md 生成器',
    toolDesc: '为 Claude Code、Cursor、OpenAI Codex、Gemini CLI 的 Agent Skills 生成 SKILL.md 文件。选择预设、填写描述、触发场景与步骤说明、勾选工具限制，复制或下载。按代理显示安装路径 — 数据不上传。',
    pBlank: '空白', pDocs: '文档写手', pReview: '代码审查', pData: '数据分析师', pCommits: '更新日志写手',
    presets: '预设：',
    lTarget: '目标代理', lName: '技能名（小写字母、连字符）', lDesc: '描述 — 做什么＋何时使用（代理据此匹配加载）',
    lWhen: '何时使用（每行一条）', lSteps: '指令 / 操作流程（每行一步）', lAvoid: '注意事项与禁忌（每行一条，可选）',
    lTools: '限制工具（allowed-tools，可选）：', lMeta: '添加 metadata 块（版本、许可证）',
    copy: '复制 SKILL.md', dl: '下载 SKILL.md', clear: '重置',
    output: '预览 — SKILL.md',
    nameOk: '可用 — 文件夹名也请用它。', nameBad: '仅允许小写字母、数字和连字符（最多 64 字符）。',
    descCount: '描述字符数（最多 1024）',
    install: '安装位置：保存为',
    step1: '选择目标代理（Claude Code、Cursor、Codex 或 Gemini CLI），工具栏下方会显示对应的安装目录。',
    step2: '描述要同时写清「做什么」和「何时用」：代理只读 frontmatter 来决定是否加载技能，请包含用户真实会说的触发词。',
    step3: '填写触发场景和分步操作说明 — 技能被触发后代理会严格照做。正文建议控制在约 500 行以内。',
    step4: '复制或下载 SKILL.md 到与技能同名的文件夹（如 .claude/skills/release-notes-writer/SKILL.md），重启或重载代理后用匹配任务测试。',
  }
});

const { $, copyText, t } = GZ;

const TARGETS = {
  claude: {label:'Claude Code', path: n => `.claude/skills/${n}/SKILL.md`, global: '~/.claude/skills/'},
  cursor: {label:'Cursor', path: n => `.agents/skills/${n}/SKILL.md`, global: '~/.cursor/skills/'},
  codex:  {label:'OpenAI Codex', path: n => `.agents/skills/${n}/SKILL.md`, global: '~/.codex/skills/'},
  gemini: {label:'Gemini CLI', path: n => `.agents/skills/${n}/SKILL.md`, global: 'settings skills dir'},
};
const TOOLLIST = ['Read','Write','Edit','Bash','Grep','Glob','WebSearch','WebFetch'];
const PRESETS = {
  blank: {name:'', desc:'', when:'', steps:'', avoid:'', tools:[]},
  docs: {name:'docs-writer', desc:'Writes and edits product documentation (README, guides, API reference) in the project voice. Use when asked to document code, write a tutorial, or refresh stale docs.',
    when:'User asks to document a feature or API\nREADME or guide needs updating\nNew public endpoint has no docs',
    steps:'Read the target code first; document observed behavior, never guess.\nFollow the tone and heading style of the existing docs in docs/.\nEvery guide needs: intro, one runnable example, edge cases.\nUpdate docs/README.md index when adding a page.',
    avoid:'Do not document internal/private helpers.\nDo not invent flags or config keys — verify them in source first.', tools:['Read','Write','Grep','Glob']},
  review: {name:'code-reviewer', desc:'Reviews a diff or files for bugs, security issues and style violations with severity-tagged findings. Use when asked to review code or audit a change.',
    when:'User asks for a code review\nBefore merging a risky change\nAfter a security-relevant edit',
    steps:'Run the diff against the base branch and read every changed hunk with context.\nReport findings as: [CRITICAL|MAJOR|MINOR] file:line — issue — suggested fix.\nCheck: error handling, injection, secrets, races, missing tests, dead code.\nEnd with a one-line verdict: approve / request changes.',
    avoid:'Do not rewrite code, only propose fixes.\nDo not flag style that the linter already enforces.', tools:['Read','Bash','Grep','Glob']},
  data: {name:'data-analyst', desc:'Explores CSV/JSON datasets, computes aggregates and writes short analysis reports with the commands used. Use when a data file needs summarizing or a metric question must be answered.',
    when:'A CSV/JSON file needs a summary\nA metric or trend question is asked\nBefore modeling, inspect data quality',
    steps:'Inspect schema and row count first; report nulls and duplicates found.\nCompute aggregates with pandas or duckdb; keep the exact commands.\nState conclusions as numbers with their calculation, not adjectives.\nSave any derived dataset with a documented script, not by hand.',
    avoid:'Never overwrite the raw input file.\nNever silently drop rows — count and state exclusions.', tools:['Read','Write','Bash']},
  commits: {name:'changelog-writer', desc:'Drafts a release notes / changelog entry from git log between two refs, grouped by feat/fix/chore. Use when cutting a release or writing release notes.',
    when:'Cutting a release or tag\nUser asks for changelog or release notes\nSprint summary is due',
    steps:'List commits with: git log <from>..<to> --oneline --no-merges.\nGroup into Features / Fixes / Chores; drop pure-refactor noise.\nWrite user-facing phrasing, not commit-message jargon.\nFollow the existing CHANGELOG.md format exactly.',
    avoid:'Do not include commit hashes unless the file already does.\nDo not list internal-only refactors under Features.', tools:['Bash','Read','Write']},
};
let preset='docs', target='claude';
const F=['name','desc','when','steps','avoid'];

function renderPresets(){
  $('#presets').innerHTML = Object.keys(PRESETS).map(k =>
    `<button class="gz-btn${k===preset?'':' gz-btn-secondary off'}" onclick="setPreset('${k}')">${t('p'+k.charAt(0).toUpperCase()+k.slice(1))}</button>`).join('');
}
function setPreset(k){
  preset=k; const p=PRESETS[k];
  ['when','steps','avoid'].forEach(f => $('#f-'+f).value = p[f]);
  if (p.name) { $('#f-name').value = p.name; $('#f-desc').value = p.desc; }
  $('#tools').querySelectorAll('input').forEach(cb => cb.checked = p.tools.includes(cb.value));
  renderPresets(); gen();
}
function renderTargets(){
  $('#f-target').innerHTML = Object.keys(TARGETS).map(k => `<option value="${k}"${k===target?' selected':''}>${TARGETS[k].label}</option>`).join('');
}
function renderToolChips(){
  $('#tools').innerHTML = TOOLLIST.map(x =>
    `<label><input type="checkbox" value="${x}" onchange="gen()">${x}</label>`).join('');
}
function val(id){ return $('#f-'+id).value.trim(); }
function lines(s){ return s.split('\n').map(x=>x.trim()).filter(Boolean); }
function slug(){ const s = val('name').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,64) || 'my-skill'; return s; }
function chosenTools(){ return [...$('#tools').querySelectorAll('input:checked')].map(cb=>cb.value); }

function gen(){
  const name = slug();
  const ok = /^[a-z0-9]+(-[a-z0-9]+)*$/.test(name) && $('#f-name').value.trim().length <= 64;
  $('#name-hint').textContent = (ok ? t('nameOk') : t('nameBad'));
  $('#desc-hint').textContent = val('desc').length + ' ' + t('descCount') + (val('desc').length>1024 ? ' ⚠' : '');
  let md = '---\nname: ' + name + '\ndescription: ' + (val('desc') || 'What this skill does and when the agent should use it.') + '\n';
  const tools = chosenTools();
  if (tools.length) md += 'allowed-tools: ' + tools.join(' ') + '\n';
  if ($('#f-meta').checked) md += 'metadata:\n  version: "1.0"\n  license: MIT\n';
  md += '---\n\n# ' + name.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase()) + '\n\n';
  if (val('when')) md += '## When to Use\n' + lines(val('when')).map(l=>'- '+l).join('\n') + '\n\n';
  if (val('steps')) md += '## Instructions\n' + lines(val('steps')).map((l,i)=>(i+1)+'. '+l).join('\n') + '\n\n';
  if (val('avoid')) md += '## Cautions\n' + lines(val('avoid')).map(l=>'- '+l).join('\n') + '\n';
  $('#out-area').textContent = md;
  $('#install-hint').textContent = t('install') + '  ' + TARGETS[target].path(name) + '   (' + TARGETS[target].label + ')';
}
function mdText(){ return $('#out-area').textContent; }
function dl(text, fname){
  const blob = new Blob([text], {type:'text/markdown'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname; a.click();
}

F.forEach(f => { const el=$('#f-'+f); if(el) el.addEventListener('input', gen); });
$('#f-target').addEventListener('change', e => { target = e.target.value; gen(); });
$('#f-meta').addEventListener('change', gen);
$('#tb').innerHTML =
  `<button class="gz-btn" onclick="copyText(mdText())" id="b-copy"></button>` +
  `<button class="gz-btn gz-btn-secondary" onclick="dl(mdText(),'SKILL.md')" id="b-dl"></button>` +
  `<button class="gz-btn gz-btn-secondary" onclick="resetAll()" id="b-clear"></button>`;
function resetAll(){ $('#f-name').value=''; $('#f-desc').value=''; setPreset('docs'); }

['target','name','desc','when','steps','avoid','tools'].forEach(k => {
  const el = document.getElementById('l-'+k); if (el) el.textContent = t('l'+k.charAt(0).toUpperCase()+k.slice(1));
});
document.getElementById('b-copy').textContent = t('copy');
document.getElementById('b-dl').textContent = t('dl');
document.getElementById('b-clear').textContent = t('clear');
document.getElementById('l-meta').textContent = t('lMeta');
renderTargets(); renderToolChips(); renderPresets(); setPreset('docs');

GZ.renderToolPage({
  category: 'dev',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'🤖', href:'/dev/agents-md-generator.html', name:'AGENTS.md Generator'},
    {icon:'🔌', href:'/dev/mcp-config-generator.html', name:'MCP Config Generator'},
    {icon:'📝', href:'/text/markdown-editor.html', name:'Markdown Editor'},
    {icon:'🧾', href:'/text/llm-token-counter.html', name:'LLM Token Counter'},
  ]
});
</script>
<script src="/tools-result-rec.js?v=R449-flat" defer></script>
</body>
