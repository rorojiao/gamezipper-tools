<script>

  en: {

    setGoal: 'Set Goal',
    readability: 'Readability',
    flesch: 'Flesch Reading Ease',
    goalMsg: 'Set a target word count to track your essay progress.',
    typingMsg: 'Live typing',
    cps: 'chars/sec',
    step1: 'Paste or type your essay in the editor above',
    step2: 'Watch word, character, sentence and page counts update live',
    step3: 'Set a word goal to track how close you are to the limit',
    step4: 'Check the readability score to gauge audience difficulty',
  },
  zh: {
    toolTitle: '作文字数计数器',
    toolDesc: '即时统计作文的字数、字符数、句子数、段落数和页数。实时统计 + 自定义字数目标 + 可读性评分。',
    lblIn: '你的作文',
    paste: '粘贴',
    example: '载入示例作文',
    clear: '清空',
    copy: '复制统计',
    sWords: '字数', sChars: '字符数', sCharsNo: '字符（无空格）',
    sSent: '句子数', sPara: '段落数', sPages: '页数（约）',
    sRead: '阅读时间', sSpeak: '朗读时间',
    sAvgWord: '平均词长', sAvgSent: '平均句长',
    sLong: '最长词', sUnique: '不同词数',
    goalLbl: '字数目标',
    setGoal: '设置目标',
    readability: '可读性',
    flesch: 'Flesch 易读度',
    goalMsg: '设置目标字数，跟踪作文进度。',
    typingMsg: '实时打字速度',
    cps: '字符/秒',
    step1: '在编辑器中粘贴或输入作文',
    step2: '字数、字符、句子、页数实时更新',
    step3: '设置字数目标，跟踪距离限额的差距',
    step4: '查看可读性评分，评估读者难度',
  }
});

const { $, t } = GZ;

let goal = 500;
let lastChange = Date.now();
let lastLength = 0;
let cpsAvg = 0;

function count(text) {
  const trimmed = text;
  const words = trimmed.trim() ? trimmed.trim().match(/\S+/g) : [];
  const sentences = trimmed.trim() ? (trimmed.match(/[^.!?]+[.!?]+/g) || []).length : 0;
  const paragraphs = trimmed.trim() ? trimmed.split(/\n\s*\n/).filter(p => p.trim()).length : 0;
  const chars = trimmed.length;
  const charsNoSpace = trimmed.replace(/\s/g, '').length;
  const uniqueWords = words ? new Set(words.map(w => w.toLowerCase().replace(/[^a-z0-9'\u4e00-\u9fff-]/g, ''))).size : 0;
  let totalWordLen = 0, longest = '';
  if (words) {
    for (const w of words) {
      totalWordLen += w.length;
      if (w.length > longest.length) longest = w;
    }
  }
  const avgWord = words && words.length ? (totalWordLen / words.length).toFixed(1) : '0.0';
  const avgSent = sentences ? (words.length / sentences).toFixed(1) : '0.0';
  const pages = (words ? words.length : 0) / 250;
  // Flesch reading ease: 206.835 - 1.015*(words/sentences) - 84.6*(syllables/words)
  const syllables = words ? countSyllables(words.join(' ')) : 0;
  const flesch = words && sentences
    ? Math.max(0, Math.min(100, 206.835 - 1.015 * (words.length / sentences) - 84.6 * (syllables / words.length)))
    : 0;
  return { words: words ? words.length : 0, chars, charsNoSpace, sentences, paragraphs, pages, uniqueWords, avgWord, avgSent, longest, syllables, flesch };
}

function countSyllables(text) {
  text = text.toLowerCase().replace(/[^a-z\s]/g, '').trim();
  if (!text) return 0;
  const words = text.split(/\s+/);
  let total = 0;
  for (const w of words) {
    if (w.length <= 3) { total += 1; continue; }
    const cleaned = w.replace(/(?:[^laeiouy]|ed|[^laeiouy]e)$/, '').replace(/^y/, '');
    const matches = cleaned.match(/[aeiouy]{1,2}/g);
    total += matches ? matches.length : 1;
  }
  return total;
}

function fleschLabel(score) {
  if (score >= 90) return 'Very Easy (5th grade)';
  if (score >= 80) return 'Easy (6th grade)';
  if (score >= 70) return 'Fairly Easy (7th grade)';
  if (score >= 60) return 'Plain English (8-9th grade)';
  if (score >= 50) return 'Fairly Difficult (10-12th grade)';
  if (score >= 30) return 'Difficult (College)';
  return 'Very Difficult (College Graduate)';
}

function readingTime(words) {
  const sec = (words / 240) * 60;
  if (sec < 60) return Math.ceil(sec) + 's';
  const m = Math.floor(sec / 60), s = Math.round(sec - m * 60);
  return s ? `${m}m ${s}s` : `${m}m`;
}

function speakingTime(words) {
  const sec = (words / 130) * 60;
  if (sec < 60) return Math.ceil(sec) + 's';
  const m = Math.floor(sec / 60), s = Math.round(sec - m * 60);
  return s ? `${m}m ${s}s` : `${m}m`;
}

function render(text) {
  const c = count(text);
  const statsEl = $('#stats');
  statsEl.innerHTML = `
    <div class="stat"><span class="num">${c.words}</span><span class="lbl">${t('sWords')}</span></div>
    <div class="stat"><span class="num">${c.chars}</span><span class="lbl">${t('sChars')}</span></div>
    <div class="stat"><span class="num">${c.charsNoSpace}</span><span class="lbl">${t('sCharsNo')}</span></div>
    <div class="stat"><span class="num">${c.sentences}</span><span class="lbl">${t('sSent')}</span></div>
    <div class="stat"><span class="num">${c.paragraphs}</span><span class="lbl">${t('sPara')}</span></div>
    <div class="stat"><span class="num">${c.pages.toFixed(2)}</span><span class="lbl">${t('sPages')}</span></div>
    <div class="stat"><span class="num">${readingTime(c.words)}</span><span class="lbl">${t('sRead')}</span></div>
    <div class="stat"><span class="num">${speakingTime(c.words)}</span><span class="lbl">${t('sSpeak')}</span></div>
    <div class="stat"><span class="num">${c.avgWord}</span><span class="lbl">${t('sAvgWord')}</span></div>
    <div class="stat"><span class="num">${c.avgSent}</span><span class="lbl">${t('sAvgSent')}</span></div>
    <div class="stat"><span class="num">${c.uniqueWords}</span><span class="lbl">${t('sUnique')}</span></div>
  `;
  // Goal bar
  const pct = goal > 0 ? Math.min(100, (c.words / goal) * 100) : 0;
  $('#goal-fill').style.width = pct + '%';
  $('#goal-label').textContent = `${t('goalLbl')}: ${c.words} / ${goal}`;
  $('#goal-pct').textContent = Math.round(pct) + '%';
  $('#goal-pct').style.color = pct >= 100 ? 'var(--success)' : 'var(--accent)';
  $('#readability').innerHTML = c.words > 5
    ? `${t('readability')} — <strong>${c.flesch.toFixed(1)}</strong> / 100 &nbsp;·&nbsp; ${fleschLabel(c.flesch)}`
    : '';
  // Typing speed (rolling)
  const now = Date.now();
  if (now - lastChange > 800) {
    const dt = (now - lastChange) / 1000;
    const dl = text.length - lastLength;
    if (dt > 0 && dl > 0) {
      cpsAvg = cpsAvg * 0.7 + (dl / dt) * 0.3;
      $('#typing').textContent = `${t('typingMsg')}: ${cpsAvg.toFixed(1)} ${t('cps')}`;
    }
    lastLength = text.length;
    lastChange = now;
  }
}

$('#editor').addEventListener('input', e => render(e.target.value));
$('#editor').addEventListener('input', () => { lastChange = Date.now(); });

function loadExample() {
  $('#editor').value = `The Power of Habit

Understanding why we do what we do.

Habits shape our identity. Every action we take is either moving us toward the person we want to become or away from it. The small choices we make each day compound into remarkable results over time.

Consider the simple act of reading twenty pages a day. In one year, that is 7,300 pages — the equivalent of nearly twenty full-length novels. The same logic applies to exercise, meditation, and learning a new skill.

The key to building lasting habits is to start small. A new routine should be so easy that it would be embarrassing to fail. Once the behavior is consistent, you can gradually increase the difficulty. This approach, often called "atomic habits," leverages the momentum of small wins.

Identity is the North Star. Instead of focusing on outcomes, focus on becoming the type of person who can achieve those outcomes. A person who reads twenty pages a day is not trying to read twenty pages — they already are a reader.

Environment matters more than willpower. We rarely make deliberate decisions; instead, we act in whatever way our surroundings make easiest. Place a book on your pillow, leave your running shoes by the door, and remove junk food from your kitchen. Good intentions rarely win against bad design.

The first month is the hardest. After that, identity takes over. You are no longer someone trying to build a habit — you are simply someone who already does the thing.`;
  render($('#editor').value);
}

function doClear() {
  $('#editor').value = '';
  render('');
}

function doCopy() {
  const c = count($('#editor').value);
  const text = `Words: ${c.words}\nCharacters: ${c.chars}\nSentences: ${c.sentences}\nParagraphs: ${c.paragraphs}\nPages (approx): ${c.pages.toFixed(2)}\nReading time: ${readingTime(c.words)}\nReadability: ${c.flesch.toFixed(1)} / 100`;
  navigator.clipboard.writeText(text).then(() => {
    const btn = $('#copyBtn');
    const orig = btn.textContent;
    btn.textContent = t('copied') || '✓ Copied!';
    setTimeout(() => btn.textContent = orig, 1500);
  });
}

async function doPaste() {
  try {
    const text = await navigator.clipboard.readText();
    $('#editor').value = text;
    render(text);
  } catch (e) {
    $('#editor').focus();
  }
}

$('#goalBtn').addEventListener('click', () => {
  const v = parseInt($('#goalInput').value);
  if (v > 0) { goal = v; render($('#editor').value); }
});
$('#goalInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('#goalBtn').click();
});

$('#toolbar').innerHTML = `
  <button class="gz-btn" onclick="doPaste()">${t('paste')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="loadExample()">${t('example')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="doClear()">${t('clear')}</button>
  <button class="gz-btn" id="copyBtn" onclick="doCopy()">${t('copy')}</button>`;

GZ.renderToolPage({
  category: 'text',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'📝', href:'/text/word-counter.html', name:'Word Counter'},
    {icon:'🔤', href:'/text/letter-counter.html', name:'Letter Counter'},
    {icon:'📖', href:'/text/bionic.html', name:'Bionic Reading'},
    {icon:'📊', href:'/text/reading-speed-test.html', name:'Reading Speed Test'},
  ]
});

render('');
</script>
