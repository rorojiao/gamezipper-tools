// Yoda-style translator: Object-Subject-Verb rearrangement
// Strategy: split sentence into clauses by punctuation/commas, then for each clause
// detect a leading auxiliary/verb phrase and move it to the end.

const AUX = new Set(['is','are','was','were','am','be','been','being','do','does','did','have','has','had','will','would','shall','should','can','could','may','might','must','mustn\'t','don\'t','doesn\'t','didn\'t','won\'t','wouldn\'t','shouldn\'t','can\'t','couldn\'t']);

function yodaSentence(s) {
  s = s.trim();
  if (!s) return s;
  // Preserve trailing punctuation
  const m = s.match(/([.!?]+\"?|”)$/);
  const tail = m ? m[1] : '';
  let body = m ? s.slice(0, -tail.length) : s;

  // Split by comma into chunks
  const parts = body.split(/,\s*/).map(p => p.trim()).filter(Boolean);
  const reordered = parts.map(yodaClause);

  let out = reordered.join(', ');
  // Lowercase first letter of result if original started uppercase (Yoda style)
  if (/^[A-Z]/.test(out)) out = out.charAt(0).toLowerCase() + out.slice(1);
  return out + tail;
}

function yodaClause(clause) {
  const words = clause.split(/\s+/);
  if (words.length < 4) return clause; // Too short to rearrange meaningfully
  // Try to find a leading auxiliary/verb and move to end
  const first = words[0].toLowerCase().replace(/[^a-z\'\u2019]/g, '');
  if (AUX.has(first) || first === 'i\'m' || first === 'you\'re' || first === 'we\'re' || first === 'they\'re') {
    const verb = words.shift();
    return words.join(' ') + ' ' + verb.toLowerCase();
  }
  // No aux at start — try moving "very/really" + adjective to end
  // Or just flip the order of last two segments
  if (words.length >= 5) {
    const mid = Math.floor(words.length / 2);
    const firstHalf = words.slice(0, mid).join(' ');
    const secondHalf = words.slice(mid).join(' ');
    return secondHalf + ', ' + firstHalf;
  }
  return clause;
}

function translate() {
  const inp = $('#input').value.trim();
  if (!inp) { $('#output').value = ''; return; }
  const sentences = inp.split(/(?<=[.!?])\s+/);
  const out = sentences.map(yodaSentence).join(' ');
  $('#output').value = out;
}
