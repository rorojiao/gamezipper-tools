<style>
.playground{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}
@media(max-width:900px){.playground{grid-template-columns:1fr}}
.controls{background:var(--glass2,#1a1a2e);border:1px solid var(--border);border-radius:10px;padding:14px}
.controls h3{margin:0 0 8px;font-size:.95em}
.field{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.field label{font-size:.85em;min-width:120px;color:var(--text2)}
.field input,.field select{padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.9em;min-width:140px}
.bp-list{margin:8px 0}
.bp-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px}
.bp-card .head{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.bp-card .head label{font-size:.8em;color:var(--text2)}
.bp-card .head input{width:80px;padding:4px 8px;border-radius:4px;border:1px solid var(--border);background:var(--glass2);color:var(--text);font-size:.85em}
.bp-card textarea{width:100%;min-height:60px;padding:6px;border-radius:6px;border:1px solid var(--border);background:var(--glass2);color:var(--text);font-family:monospace;font-size:.85em;resize:vertical}
.preview-pane{background:var(--glass2);border:1px solid var(--border);border-radius:10px;padding:14px}
.preview-pane h3{margin:0 0 8px;font-size:.95em}
#containerBox{position:relative;background:repeating-linear-gradient(45deg,rgba(255,255,255,.04),rgba(255,255,255,.04) 8px,transparent 8px,transparent 16px);border:2px solid #4ecdc4;border-radius:10px;padding:8px;resize:horizontal;overflow:hidden;min-width:240px;width:100%;height:280px}
#containerBox .resize-hint{position:absolute;bottom:4px;right:8px;font-size:.7em;color:#4ecdc4;opacity:.7;pointer-events:none}
#componentEl{border:1px dashed rgba(255,255,255,.2);border-radius:8px;padding:14px;background:var(--bg);height:calc(100% - 16px);overflow:auto;transition:all .15s ease}
#componentEl.cqi-test{font-size:5cqi}
.size-tag{display:inline-block;padding:2px 8px;background:#4ecdc4;color:#0c1322;border-radius:6px;font-size:.75em;font-weight:700;margin-bottom:8px}
.output-pane{margin-top:12px}
.preset-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.preset-btn{padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.8em;cursor:pointer}
.preset-btn:hover{background:#4ecdc4;color:#0c1322;border-color:#4ecdc4}
.preset-btn.active{background:#4ecdc4;color:#0c1322;border-color:#4ecdc4;font-weight:700}
.unit-demo{font-size:5cqi;color:#4ecdc4;font-weight:700}
</style>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"CSS Container Query Playground","description":"Visually build CSS @container queries with a draggable resizable preview, cqi/cqw unit visualization and presets. Free, browser-only tool.","url":"https://tools.gamezipper.com/dev/css-container-query-playground.html","applicationCategory":"DeveloperApplication","operatingSystem":"Web Browser","offers":{"@type":"Offer","price":"0"}}</script>
<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "What is a CSS container query?", "acceptedAnswer": {"@type": "Answer", "text": "A CSS container query (@container) lets you style elements based on the size of their parent container rather than the viewport. This makes truly reusable components possible — the same card looks right in a sidebar, a hero, or a tight grid."}}, {"@type": "Question", "name": "How do I use the cqi and cqw units?", "acceptedAnswer": {"@type": "Answer", "text": "cqi = 1% of the container's inline size (usually width), cqw = 1% of width, cqh/cqb for height/block, cqmin/cqmax for the smaller/larger of the two. They scale your paddings, font sizes and gaps with the container so components stay readable at any size."}}, {"@type": "Question", "name": "How do I make a container for @container queries?", "acceptedAnswer": {"@type": "Answer", "text": "Set container-type: inline-size on the parent element to enable width queries, or container-type: size for both axes. Optionally add container-name: myname so multiple containers don't conflict. Then write @container myname (min-width: 400px) { ... } rules."}}, {"@type": "Question", "name": "Which browsers support container queries?", "acceptedAnswer": {"@type": "Answer", "text": "Container queries are Baseline-supported since 2023 — Chrome 105+, Edge 105+, Safari 16+, Firefox 110+. The cqi/cqw/cqh/cqb units shipped alongside and work in the same versions."}}]}</script>

<body>
<div class="gz-container">
  <div class="gz-tool-header">
    <h1 id="title"></h1>
    <p class="desc" id="desc"></p>
  </div>
  <div class="gz-tool-area">
    <div class="gz-toolbar" id="toolbar"></div>
    <div class="playground">
      <div class="controls">
        <h3>⚙️ Container Setup</h3>
        <div class="field">
          <label>Container name:</label>
          <input id="cName" value="card" />
        </div>
        <div class="field">
          <label>container-type:</label>
          <select id="cType">
            <option value="inline-size" selected>inline-size</option>
            <option value="size">size</option>
            <option value="normal">normal</option>
          </select>
        </div>
        <div class="field">
          <label>Initial width:</label>
          <input id="initW" type="number" value="500" min="200" max="1200" /> <span style="font-size:.85em">px</span>
        </div>
        <h3 style="margin-top:14px">🎯 Presets</h3>
        <div class="preset-row" id="presets">
          <button class="preset-btn" data-preset="product">🛍️ Product Card</button>
          <button class="preset-btn" data-preset="sidebar">📐 Sidebar Widget</button>
          <button class="preset-btn" data-preset="hero">🌅 Hero Card</button>
          <button class="preset-btn" data-preset="grid">▦ Article Grid</button>
        </div>
        <h3 style="margin-top:14px">📐 Breakpoints</h3>
        <div class="bp-list" id="bpList"></div>
        <button class="gz-btn gz-btn-secondary" id="addBp" style="margin-top:6px">+ Add Breakpoint</button>
      </div>
      <div class="preview-pane">
        <h3>👁️ Live Preview <span style="font-size:.7em;color:var(--text2);font-weight:400">(drag right edge ↔ to resize)</span></h3>
        <div id="containerBox">
          <div id="componentEl">
            <div id="sizeTag" class="size-tag">500px</div>
            <h4 style="margin:0 0 6px">📦 Container Query Demo</h4>
            <p style="margin:0;font-size:.95em;line-height:1.5">Drag the right edge of the parent box to resize. The child below uses <span class="unit-demo">cqi</span> units — see how it scales with the container?</p>
            <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
              <span style="padding:4px 10px;background:#ff6b6b;color:#fff;border-radius:6px;font-size:.85em">Tag A</span>
              <span style="padding:4px 10px;background:#ffd93d;color:#0c1322;border-radius:6px;font-size:.85em">Tag B</span>
              <span style="padding:4px 10px;background:#4ecdc4;color:#0c1322;border-radius:6px;font-size:.85em">Tag C</span>
            </div>
          </div>
          <div class="resize-hint">↔ drag me</div>
        </div>
        <div class="output-pane">
          <h3 style="margin:0 0 6px">📋 Generated CSS</h3>
          <pre id="output" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;font-family:monospace;font-size:.85em;white-space:pre-wrap;line-height:1.6;overflow-x:auto;max-height:300px"></pre>
        </div>
      </div>
    </div>
  </div>
  <div class="gz-howto"><h2></h2><ol></ol></div>
  <div class="gz-related"><h2></h2><div class="gz-related-grid"></div></div>
</div>
<script>
GZI18n.register({
  en: {
    toolTitle: 'CSS Container Query Playground',
    toolDesc: 'Build CSS @container rules with a draggable resizable preview. Adjust breakpoints, edit per-breakpoint styles, watch the component reflow live with cqi units.',
    step1: 'Pick a preset or write your own container name + breakpoints',
    step2: 'Edit the CSS that fires at each breakpoint',
    step3: 'Drag the right edge of the preview to resize the container',
    step4: 'Copy the generated CSS into your stylesheet',
    addBP: '+ Breakpoint',
  },
  zh: {
    toolTitle: 'CSS 容器查询 Playground',
    toolDesc: '使用可拖拽缩放的实时预览构建 CSS @container 规则。调整断点、编辑每个断点样式，使用 cqi 单位实时观察组件布局变化。',
    step1: '选择预设或自定义容器名称 + 断点',
    step2: '编辑每个断点触发的 CSS 样式',
    step3: '拖动预览框右边以改变容器大小',
    step4: '复制生成的 CSS 到你的样式表',
    addBP: '+ 断点',
  }
});

const { $, copyText, t } = GZ;
const PRESETS = {
  product: {
    name: 'card', type: 'inline-size',
    breakpoints: [
      { min: 0, max: 300, styles: 'flex-direction: column;\nfont-size: 12px;\npadding: 8px;' },
      { min: 301, max: 500, styles: 'flex-direction: row;\nfont-size: 14px;\npadding: 12px;' },
      { min: 501, max: 0, styles: 'flex-direction: row;\nfont-size: 16px;\npadding: 18px;' }
    ]
  },
  sidebar: {
    name: 'sidebar', type: 'inline-size',
    breakpoints: [
      { min: 0, max: 200, styles: 'display: none;' },
      { min: 201, max: 350, styles: 'flex-direction: column;\nfont-size: 13px;' },
      { min: 351, max: 0, styles: 'flex-direction: column;\nfont-size: 15px;' }
    ]
  },
  hero: {
    name: 'hero', type: 'inline-size',
    breakpoints: [
      { min: 0, max: 600, styles: 'text-align: center;\npadding: 16px;' },
      { min: 601, max: 0, styles: 'text-align: left;\npadding: 32px;' }
    ]
  },
  grid: {
    name: 'grid', type: 'inline-size',
    breakpoints: [
      { min: 0, max: 400, styles: 'grid-template-columns: 1fr;' },
      { min: 401, max: 700, styles: 'grid-template-columns: 1fr 1fr;' },
      { min: 701, max: 0, styles: 'grid-template-columns: 1fr 1fr 1fr;' }
    ]
  }
};

let bpCount = 0;

function addBreakpoint(minW=0, maxW=0, styles='') {
  bpCount++;
  const id = bpCount;
  const div = document.createElement('div');
  div.className = 'bp-card';
  div.id = 'bp-' + id;
  div.innerHTML = `
    <div class="head">
      <span style="font-size:.85em;color:var(--text2);min-width:20px">#${id}</span>
      <label>min:</label><input type="number" class="bp-min" value="${minW}" placeholder="px" />
      <label>max:</label><input type="number" class="bp-max" value="${maxW}" placeholder="px (0=∞)" />
      <button class="gz-btn gz-btn-secondary gz-btn-sm" onclick="document.getElementById('bp-${id}').remove();generate()" style="margin-left:auto">✕</button>
    </div>
    <textarea class="bp-styles" placeholder="display: flex;\nflex-direction: row;">${styles}</textarea>
  `;
  div.querySelectorAll('input,textarea').forEach(el => el.addEventListener('input', generate));
  $('#bpList').appendChild(div);
  generate();
}

function loadPreset(key) {
  const p = PRESETS[key];
  if (!p) return;
  $('#cName').value = p.name;
  $('#cType').value = p.type;
  $('#bpList').innerHTML = '';
  bpCount = 0;
  p.breakpoints.forEach(bp => addBreakpoint(bp.min, bp.max, bp.styles));
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.toggle('active', b.dataset.preset === key));
}

function generate() {
  const name = $('#cName').value.trim() || 'card';
  const cType = $('#cType').value;
  const bps = document.querySelectorAll('.bp-card');

  let css = `/* 1. Establish the containment context on the parent */\n.parent {\n  container-name: ${name};\n  container-type: ${cType};\n}\n\n/* 2. The child adapts to its PARENT's width, not the viewport */\n.child {\n  display: flex;\n  /* default styles when no breakpoint matches */\n}\n`;

  bps.forEach(row => {
    const min = parseInt(row.querySelector('.bp-min').value) || 0;
    const max = parseInt(row.querySelector('.bp-max').value) || 0;
    const styles = row.querySelector('.bp-styles').value.trim();
    if (!styles) return;

    let condition = '';
    if (min > 0 && max > 0) condition = `(min-width: ${min}px) and (max-width: ${max}px)`;
    else if (min > 0) condition = `(min-width: ${min}px)`;
    else if (max > 0) condition = `(max-width: ${max}px)`;
    else return;

    css += `\n@container ${name} ${condition} {\n  .child {\n    ${styles.split('\n').map(l => '    ' + l).join('\n')}\n  }\n}\n`;
  });

  $('#output').textContent = css;
  updatePreview();
}

function updatePreview() {
  const box = $('#containerBox');
  const w = box.offsetWidth;
  $('#sizeTag').textContent = w + 'px';

  const bps = document.querySelectorAll('.bp-card');
  let matchedStyle = '';
  bps.forEach(row => {
    const min = parseInt(row.querySelector('.bp-min').value) || 0;
    const max = parseInt(row.querySelector('.bp-max').value) || Infinity;
    const styles = row.querySelector('.bp-styles').value.trim();
    if (!styles) return;
    if (w >= min && w <= max) matchedStyle = styles;
  });

  const inner = $('#componentEl');
  if (matchedStyle) {
    try {
      inner.style.cssText = matchedStyle + ';';
      inner.style.fontSize = 'max(' + (w * 0.04).toFixed(1) + 'px, 5cqi)';
    } catch (e) { inner.style.cssText = matchedStyle; }
  } else {
    inner.style.cssText = '';
  }
}

function setInitialWidth() {
  const v = parseInt($('#initW').value) || 500;
  $('#containerBox').style.width = v + 'px';
  updatePreview();
}

$('#cName').addEventListener('input', generate);
$('#cType').addEventListener('change', generate);
$('#initW').addEventListener('input', setInitialWidth);
$('#addBp').addEventListener('click', () => addBreakpoint());
document.querySelectorAll('.preset-btn').forEach(b => b.addEventListener('click', () => loadPreset(b.dataset.preset)));

if (window.ResizeObserver) {
  new ResizeObserver(updatePreview).observe($('#containerBox'));
} else {
  setInterval(updatePreview, 200);
}

$('#toolbar').innerHTML = `
  <button class="gz-btn" onclick="copyText($('#output').textContent)">📋 Copy CSS</button>
  <button class="gz-btn gz-btn-secondary" onclick="location.reload()">↻ Reset</button>`;

// Initial: load product-card preset
loadPreset('product');

GZ.renderToolPage({
  related: [
    {icon:'🧩', href:'/dev/css-flexbox-playground.html', name:'CSS Flexbox Playground'},
    {icon:'▦', href:'/dev/css-grid-playground.html', name:'CSS Grid Playground'},
    {icon:'🧪', href:'/dev/css-houdini-property.html', name:'CSS Houdini @property'},
    {icon:'🗺️', href:'/dev/css-clip-path-generator.html', name:'CSS Clip Path'},
  ]
});
</script>
<script src="/tools-result-rec.js?v=R449-flat" defer></script>
</body>
</html>
