<style>
#preview{display:flex;background:var(--glass2);border:1px solid var(--border);border-radius:12px;padding:16px;min-height:240px;overflow:hidden;position:relative;margin-bottom:14px}
#preview .fx{padding:10px 14px;background:var(--accent);color:#000;border-radius:8px;font-weight:700;min-width:60px;text-align:center;cursor:grab;user-select:none;font-size:.85em}
#preview .fx:hover{filter:brightness(1.1)}
#preview .fx:nth-child(2n){background:var(--accent2);color:#fff}
#preview .fx:nth-child(3n){background:#4ecdc4;color:#000}
#preview .fx:nth-child(4n){background:#ffd93d;color:#000}
.control-row{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.control-row label{font-size:.85em;color:var(--text2);min-width:110px;font-weight:600}
.control-row select,.control-row input[type=number],.control-row input[type=text]{background:var(--glass2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:.85em;min-width:80px}
.control-row input[type=range]{flex:1;min-width:120px;max-width:280px}
.control-row .val{min-width:50px;text-align:right;color:var(--accent);font-family:monospace;font-size:.85em;font-weight:700}
#output{width:100%;min-height:140px;font-family:monospace;font-size:.82em;background:#0c1322;color:#e6f1ff;border:1px solid var(--border);border-radius:8px;padding:12px;resize:vertical;line-height:1.6}
.swatch-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.swatch{padding:4px 10px;border:1px solid var(--border);border-radius:14px;background:var(--glass2);color:var(--text2);font-size:.75em;cursor:pointer;transition:.2s}
.swatch.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700}
.swatch:hover{color:var(--text)}
</style>

<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is CSS Flexbox?","acceptedAnswer":{"@type":"Answer","text":"CSS Flexbox is a one-dimensional layout method for laying out items in rows or columns. Items flex to fill available space and shrink when there isn't enough. It excels at nav bars, card rows, centering and responsive component layouts."}},{"@type":"Question","name":"What is the difference between justify-content and align-items?","acceptedAnswer":{"@type":"Answer","text":"justify-content controls the main axis (horizontal for row, vertical for column). align-items controls the cross axis (perpendicular to main axis). Together they fully position items inside the flex container."}},{"@type":"Question","name":"How does flex-grow differ from flex-shrink?","acceptedAnswer":{"@type":"Answer","text":"flex-grow distributes extra free space proportionally to positive flex-grow values. flex-shrink distributes negative overflow proportionally. flex-basis sets the initial size before grow/shrink calculations."}},{"@type":"Question","name":"Does this Flexbox Playground send my CSS to a server?","acceptedAnswer":{"@type":"Answer","text":"No. Everything runs locally in your browser. Sliders, previews and CSS generation happen on your device — your layout stays private."}}]}</script>

<body>
<div class="gz-container">
  <div class="gz-tool-header">
    <h1 id="title"></h1>
    <p class="desc" id="desc"></p>
  </div>
  <div class="gz-tool-area">
    <div class="gz-toolbar" id="toolbar"></div>
    <div id="preview"></div>
    <div class="control-row">
      <label>flex-direction</label>
      <select id="dir"><option>row</option><option>row-reverse</option><option>column</option><option>column-reverse</option></select>
      <label>flex-wrap</label>
      <select id="wrap"><option>nowrap</option><option>wrap</option><option>wrap-reverse</option></select>
    </div>
    <div class="control-row">
      <label>justify-content</label>
      <select id="justify"><option>flex-start</option><option>flex-end</option><option>center</option><option>space-between</option><option>space-around</option><option>space-evenly</option></select>
    </div>
    <div class="control-row">
      <label>align-items</label>
      <select id="alignItems"><option>stretch</option><option>flex-start</option><option>flex-end</option><option>center</option><option>baseline</option></select>
    </div>
    <div class="control-row">
      <label>align-content</label>
      <select id="alignContent"><option>stretch</option><option>flex-start</option><option>flex-end</option><option>center</option><option>space-between</option><option>space-around</option></select>
    </div>
    <div class="control-row">
      <label>gap</label>
      <input type="range" id="gap" min="0" max="40" value="8">
      <span class="val" id="gapV">8px</span>
    </div>
    <div class="control-row">
      <label>items</label>
      <input type="number" id="count" min="1" max="12" value="5" style="max-width:80px">
    </div>
    <h3 style="margin:18px 0 8px;font-size:1em">Per-item controls</h3>
    <div id="itemControls"></div>
    <h3 style="margin:18px 0 8px;font-size:1em">Generated CSS</h3>
    <textarea id="output" spellcheck="false" readonly></textarea>
  </div>
  <div class="gz-howto"><h2></h2><ol></ol></div>
  <div class="gz-related"><h2></h2><div class="gz-related-grid"></div></div>
</div>
<script>
GZI18n.register({
  en: {
    toolTitle: 'CSS Flexbox Playground',
    toolDesc: 'Build flex layouts visually with live preview. Tune direction, wrap, justify, align, gap and per-item grow/shrink/basis — copy production-ready CSS in one click.',
    copy: 'Copy CSS', reset: 'Reset', addItem: '+ Add', removeItem: '− Remove',
    step1: 'Pick flex-direction, wrap, justify-content and align-items from the dropdowns',
    step2: 'Adjust the gap slider and item count to shape your layout',
    step3: 'Tune per-item flex-grow, flex-shrink, flex-basis and order',
    step4: 'Copy the generated CSS below into your stylesheet',
  },
  zh: {
    toolTitle: 'CSS Flexbox 可视化布局',
    toolDesc: '可视化构建 flex 布局，实时预览。调节方向、换行、主轴对齐、交叉轴对齐、间距以及每个项目的 grow/shrink/basis —— 一键复制生产可用的 CSS。',
    copy: '复制 CSS', reset: '重置', addItem: '+ 添加', removeItem: '− 移除',
    step1: '从下拉框选择 flex-direction、wrap、justify-content 和 align-items',
    step2: '拖动 gap 滑块并调整项目数量',
    step3: '为每个项目设置 flex-grow、flex-shrink、flex-basis 和 order',
    step4: '复制下方生成的 CSS 到你的样式表',
  }
});

const { $, copyText, t } = GZ;

const state = {
  dir: 'row', wrap: 'nowrap', justify: 'flex-start',
  alignItems: 'stretch', alignContent: 'stretch', gap: 8, count: 5,
  items: [
    {grow:0, shrink:1, basis:'auto', order:0},
    {grow:0, shrink:1, basis:'auto', order:0},
    {grow:0, shrink:1, basis:'auto', order:0},
    {grow:0, shrink:1, basis:'auto', order:0},
    {grow:0, shrink:1, basis:'auto', order:0}
  ]
};

function renderPreview(){
  const p = $('#preview');
  p.style.flexDirection = state.dir;
  p.style.flexWrap = state.wrap;
  p.style.justifyContent = state.justify;
  p.style.alignItems = state.alignItems;
  p.style.alignContent = state.alignContent;
  p.style.gap = state.gap + 'px';
  while(p.children.length < state.count){
    const d = document.createElement('div');
    d.className = 'fx';
    d.textContent = p.children.length + 1;
    p.appendChild(d);
  }
  while(p.children.length > state.count) p.removeChild(p.lastChild);
  Array.from(p.children).forEach((el, i) => {
    const it = state.items[i] || {grow:0, shrink:1, basis:'auto', order:0};
    el.style.flexGrow = it.grow;
    el.style.flexShrink = it.shrink;
    el.style.flexBasis = it.basis;
    el.style.order = it.order;
  });
  renderItemControls();
  renderCSS();
}

function renderItemControls(){
  const c = $('#itemControls');
  let html = '';
  for(let i=0; i<state.count; i++){
    const it = state.items[i] || {grow:0, shrink:1, basis:'auto', order:0};
    html += `<div style="background:var(--glass2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px">
      <div style="font-size:.8em;color:var(--accent);font-weight:700;margin-bottom:6px">Item ${i+1}</div>
      <div class="control-row" style="margin-bottom:6px">
        <label style="min-width:80px">grow</label>
        <input type="range" min="0" max="4" step="0.1" value="${it.grow}" data-i="${i}" data-k="grow">
        <span class="val">${it.grow}</span>
      </div>
      <div class="control-row" style="margin-bottom:6px">
        <label style="min-width:80px">shrink</label>
        <input type="range" min="0" max="4" step="0.1" value="${it.shrink}" data-i="${i}" data-k="shrink">
        <span class="val">${it.shrink}</span>
      </div>
      <div class="control-row" style="margin-bottom:6px">
        <label style="min-width:80px">basis</label>
        <input type="text" value="${it.basis}" data-i="${i}" data-k="basis" style="max-width:140px">
        <label style="min-width:60px">order</label>
        <input type="number" value="${it.order}" data-i="${i}" data-k="order" style="max-width:80px">
      </div>
    </div>`;
  }
  c.innerHTML = html;
  c.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', e => {
      const i = +e.target.dataset.i;
      const k = e.target.dataset.k;
      if(!state.items[i]) state.items[i] = {grow:0, shrink:1, basis:'auto', order:0};
      state.items[i][k] = (k === 'basis' || k === 'order') ? (k === 'order' ? +e.target.value : e.target.value) : +e.target.value;
      if(k !== 'basis' && k !== 'order'){
        const valSpan = e.target.nextElementSibling;
        if(valSpan && valSpan.classList.contains('val')) valSpan.textContent = state.items[i][k];
      }
      Array.from($('#preview').children).forEach((el, idx) => {
        const it = state.items[idx];
        el.style.flexGrow = it.grow; el.style.flexShrink = it.shrink;
        el.style.flexBasis = it.basis; el.style.order = it.order;
      });
      renderCSS();
    });
  });
}

function renderCSS(){
  const props = [];
  props.push(`  display: flex;`);
  if(state.dir !== 'row') props.push(`  flex-direction: ${state.dir};`);
  if(state.wrap !== 'nowrap') props.push(`  flex-wrap: ${state.wrap};`);
  if(state.justify !== 'flex-start') props.push(`  justify-content: ${state.justify};`);
  if(state.alignItems !== 'stretch') props.push(`  align-items: ${state.alignItems};`);
  if(state.alignContent !== 'stretch') props.push(`  align-content: ${state.alignContent};`);
  if(state.gap !== 0) props.push(`  gap: ${state.gap}px;`);
  let css = `.container {\n` + props.join('\n') + '\n}';
  const itemRules = [];
  state.items.forEach((it, i) => {
    const diffs = [];
    if(it.grow !== 0) diffs.push(`flex-grow: ${it.grow}`);
    if(it.shrink !== 1) diffs.push(`flex-shrink: ${it.shrink}`);
    if(it.basis !== 'auto') diffs.push(`flex-basis: ${it.basis}`);
    if(it.order !== 0) diffs.push(`order: ${it.order}`);
    if(diffs.length) itemRules.push(`.item-${i+1} {\n  ${diffs.join(';\n  ')};\n}`);
  });
  if(itemRules.length) css += '\n\n' + itemRules.join('\n\n');
  $('#output').value = css;
}

function reset(){
  state.dir = 'row'; state.wrap = 'nowrap'; state.justify = 'flex-start';
  state.alignItems = 'stretch'; state.alignContent = 'stretch';
  state.gap = 8; state.count = 5;
  state.items = state.items.map(() => ({grow:0, shrink:1, basis:'auto', order:0}));
  $('#dir').value = 'row'; $('#wrap').value = 'nowrap';
  $('#justify').value = 'flex-start'; $('#alignItems').value = 'stretch';
  $('#alignContent').value = 'stretch'; $('#gap').value = 8; $('#gapV').textContent = '8px';
  $('#count').value = 5;
  renderPreview();
}

$('#dir').addEventListener('change', e => { state.dir = e.target.value; renderPreview(); });
$('#wrap').addEventListener('change', e => { state.wrap = e.target.value; renderPreview(); });
$('#justify').addEventListener('change', e => { state.justify = e.target.value; renderPreview(); });
$('#alignItems').addEventListener('change', e => { state.alignItems = e.target.value; renderPreview(); });
$('#alignContent').addEventListener('change', e => { state.alignContent = e.target.value; renderPreview(); });
$('#gap').addEventListener('input', e => { state.gap = +e.target.value; $('#gapV').textContent = state.gap + 'px'; renderPreview(); });
$('#count').addEventListener('input', e => {
  const n = Math.max(1, Math.min(12, +e.target.value || 1));
  state.count = n;
  while(state.items.length < n) state.items.push({grow:0, shrink:1, basis:'auto', order:0});
  renderPreview();
});

$('#toolbar').innerHTML = `
  <button class="gz-btn" onclick="copyText($('#output').value)">📋 ${t('copy')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="reset()">↻ ${t('reset')}</button>`;

GZ.renderToolPage({
  category: 'dev',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'📦', href:'/css-tools/box-shadow.html', name:'CSS Box Shadow'},
    {icon:'🎨', href:'/css-tools/css-filter.html', name:'CSS Filter'},
    {icon:'▦', href:'/css-tools/css-grid-generator.html', name:'CSS Grid Generator'},
    {icon:'🌈', href:'/css-tools/gradient.html', name:'CSS Gradient'},
    {icon:'🔲', href:'/dev/css-text-shadow-generator.html', name:'CSS Text Shadow'},
  ]
});

renderPreview();
</script>
<script src="/tools-result-rec.js?v=R449-flat" defer></script>
</body>
