<script>
var { $, copyText, t } = GZ;

function run(){
  var o=$('#out');
  var raw=$('#input').value.trim();
  if(!raw){o.className='rc-out show';o.innerHTML='<div class="rc-err">'+t('errEmpty')+'</div>';return;}
  if(!/^-?\d*\.?\d*$/.test(raw)||raw==='-'||raw==='.'||raw==='-.'){o.className='rc-out show';o.innerHTML='<div class="rc-err">'+t('errNum')+'</div>';return;}
  var neg=raw[0]==='-';
  var s=raw.replace('-','');
  var dot=s.indexOf('.');
  var intP=dot<0?s:s.slice(0,dot);
  var fracP=dot<0?'':s.slice(dot+1);
  var place=+$('#place').value; // 0=ones, 1=tenths... -1=tens
  var mode=$('#mode').value;
  var all=intP+fracP;
  // index of place digit: intP.length-1+place ; index of deciding digit: that +1
  var pi=intP.length-1+place;
  var di=pi+1;
  var placeDigit=pi>=0?+all[pi]:0;
  var decideDigit=(di>=0&&di<all.length)?+all[di]:0;
  var hasDecide=di>=0&&di<all.length;
  // tail beyond deciding digit (to detect "5 followed by nonzero")
  var tailNonZero=false;
  for(var i=Math.max(di+1,0);i<all.length;i++){if(all[i]!=='0'){tailNonZero=true;break;}}
  var up;
  var ruleKey;
  if(!hasDecide){up=false;ruleKey='ruleDown';}
  else if(decideDigit>5){up=true;ruleKey='ruleUp';}
  else if(decideDigit<5){up=false;ruleKey='ruleDown';}
  else{ // exactly 5
    if(tailNonZero){up=true;ruleKey='ruleUp';}
    else if(mode==='half-up'){up=true;ruleKey='ruleTieUp';}
    else if(mode==='half-down'){up=false;ruleKey='ruleTieDown';}
    else{up=(placeDigit%2===1);ruleKey='ruleTieEven';}
  }
  // BigInt on all digits: floored = floor(all / 10^scale) where scale = digits from deciding digit onward
  var N=BigInt(all||'0');
  var scale=all.length-di;
  var pow=BigInt(10)**BigInt(scale);
  var floored=N/pow;
  var finalD=floored+(up?1n:0n);
  // value = finalD * 10^(-place): decimal point after fd.length-place digits (place>=0),
  // or append zeros when place<0
  var fd=finalD.toString();
  var resStr;
  if(place>=0){
    var pidx=fd.length-place;
    if(pidx>=fd.length)resStr=fd;
    else if(pidx>0)resStr=fd.slice(0,pidx)+'.'+fd.slice(pidx);
    else resStr='0.'+'0'.repeat(-pidx)+fd;
    resStr=resStr.replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,'');
  }else{
    resStr=(finalD===0n)?'0':fd+'0'.repeat(-place);
  }
  if(resStr==='')resStr='0';
  if(neg&&resStr!=='0')resStr='-'+resStr;
  // digit visualization
  var viz='';
  for(var j=0;j<all.length;j++){
    var ch=all[j];
    if(j===intP.length)viz+='<span class="rc-dot">.</span>';
    if(j===pi)viz+='<span class="rc-place">'+ch+'</span>';
    else if(j===di)viz+='<span class="rc-decide">'+ch+'</span>';
    else viz+=ch;
  }
  if(pi>=all.length)viz+='<span class="rc-place">0</span>';
  var h='<div class="rc-big">'+t('rResult')+': <span class="rc-hl">'+resStr+'</span></div>';
  h+='<div class="rc-digits" aria-hidden="true">'+viz+'</div>';
  h+='<div class="rc-rule">'+t(ruleKey)+'</div>';
  h+='<div style="margin-top:10px"><button class="gz-btn" id="rcCopy">'+t('copy')+'</button></div>';
  h+='<div class="rc-note">'+t('noteRule')+'</div>';
  o.className='rc-out show';o.innerHTML=h;
  $('#rcCopy').onclick=function(){copyText(resStr,this);};
}

$('#btnCalc').textContent=t('btnCalc');
$('#btnCalc').onclick=run;
$('#input').addEventListener('keydown',function(e){if(e.key==='Enter')run();});
$('#place').onchange=run;

</script>
