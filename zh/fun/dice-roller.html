<div class="gz-container">

<script>
GZI18n.register({
  en: {
    toolTitle: 'Online Dice Roller',
    toolDesc: 'Roll D4, D6, D8, D10, D12, D20 and D100 for tabletop RPGs and board games. Multiple dice, modifier, advantage/disadvantage and history.',
    pick: 'Pick a die:', qtyLbl: 'Quantity:', modLbl: 'Modifier:', modeLbl: 'Mode:',
    roll: '🎲 Roll', clear: 'Clear history', stats: 'Stats',
    empty: 'Pick a die and click Roll.',
    histLabel: 'History (last 50 rolls)',
    noHist: 'No rolls yet — try your luck!',
    total: 'Total', rolls: 'Rolls', avg: 'Avg', min: 'Min', max: 'Max',
    step1: 'Pick a die type (D4, D6, D8, D10, D12, D20 or D100)',
    step2: 'Choose quantity (1-20) and add an optional modifier bonus',
    step3: 'Optionally switch to Advantage or Disadvantage for D&D 5e',
    step4: 'Click Roll — see individual dice, formula breakdown and total',
    step5: 'Browse history and stats at the bottom of the page',
  },
  zh: {
    toolTitle: '在线骰子模拟器',
    toolDesc: '为桌面 RPG 和桌游摇 D4、D6、D8、D10、D12、D20 和 D100。支持多颗骰子、加成修正、D&D 优势/劣势和历史记录。',
    pick: '选择骰子：', qtyLbl: '数量：', modLbl: '修正：', modeLbl: '模式：',
    roll: '🎲 投掷', clear: '清空记录', stats: '统计',
    empty: '请选择一个骰子并点击投掷。',
    histLabel: '历史记录（最近 50 次投掷）',
    noHist: '还没有投掷记录 — 试试运气！',
    total: '合计', rolls: '次数', avg: '平均', min: '最小', max: '最大',
    step1: '选择骰子类型（D4、D6、D8、D10、D12、D20 或 D100）',
    step2: '选择数量（1-20）并可添加修正加成',
    step3: '可选切换为 D&D 5e 的优势或劣势模式',
    step4: '点击投掷 — 查看每颗骰子、公式分解和总和',
    step5: '在页面底部查看历史记录和统计数据',
  }
});

const { $, t } = GZ;
const HISTORY_KEY = 'gz-dice-history';
let selected = 20;
const DICE = [4,6,8,10,12,20,100];
let history = [];

function secureRandom(max) {
  if (window.crypto && crypto.getRandomValues) {
    const buf = new Uint32Array(1);
    crypto.getRandomValues(buf);
    return (buf[0] % max) + 1;
  }
  return Math.floor(Math.random() * max) + 1;
}

function renderGrid() {
  $('#diceGrid').innerHTML = DICE.map(d => `
    <div class="dice-card ${d===selected?'active':''}" data-d="${d}">
      <div class="face">d${d}</div>
      <div class="name">${d}-sided</div>
      <div class="rollcount" id="rc-${d}"></div>
    </div>`).join('');
}

function rollDice(d, qty, mod, mode) {
  const sets = [];
  for (let s = 0; s < (mode==='adv'||mode==='dis'?2:1); s++) {
    const vals = [];
    for (let i = 0; i < qty; i++) vals.push(secureRandom(d));
    sets.push(vals);
  }
  let keep, dropped;
  if (mode === 'adv' || mode === 'highest') {
    const totals = sets.map(s => s.reduce((a,b)=>a+b,0) + mod);
    const maxIdx = totals.indexOf(Math.max(...totals));
    keep = sets[maxIdx]; dropped = sets[1-maxIdx];
  } else if (mode === 'dis' || mode === 'lowest') {
    const totals = sets.map(s => s.reduce((a,b)=>a+b,0) + mod);
    const minIdx = totals.indexOf(Math.min(...totals));
    keep = sets[minIdx]; dropped = sets[1-minIdx];
  } else {
    keep = sets[0];
  }
  const total = keep.reduce((a,b)=>a+b,0) + mod;
  return { sets, keep, dropped, total, d, qty, mod, mode };
}

function fmtRoll(r) {
  const keptStr = r.keep.map(v => `<span class="die-result spin">${v}</span>`).join(' ');
  const dropStr = r.dropped ? ` <span style="opacity:.5">(dropped: ${r.dropped.join(',')})</span>` : '';
  const modStr = r.mod ? ` ${r.mod>=0?'+':''}${r.mod}` : '';
  return `<div style="font-family:monospace">
    <b>${r.qty}d${r.d}${modStr}</b>${r.mode!=='normal'?' ['+r.mode+']':''}
    <div>${keptStr}${dropStr}</div>
    <div style="margin-top:6px;font-size:1.4em">${t('total')}: <b style="color:var(--accent)">${r.total}</b></div>
  </div>`;
}

function pushHistory(r) {
  history.unshift(r);
  if (history.length > 50) history = history.slice(0, 50);
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch(e){}
  renderHistory();
  renderStats();
}

function renderHistory() {
  if (history.length === 0) { $('#history').innerHTML = `<p style="opacity:.6">${t('noHist')}</p>`; return; }
  $('#history').innerHTML = history.map((r, i) => {
    const dropStr = r.dropped ? ` <span style="opacity:.5">(drop ${r.dropped.join(',')})</span>` : '';
    const modStr = r.mod ? ` ${r.mod>=0?'+':''}${r.mod}` : '';
    return `<div class="entry">
      <span>${r.qty}d${r.d}${modStr}${dropStr}</span>
      <span>[${r.keep.join(', ')}]</span>
      <span class="sum">=${r.total}</span>
    </div>`;
  }).join('');
}

function renderStats() {
  if (history.length === 0) { $('#statsBox').innerHTML = ''; return; }
  const totals = history.map(r => r.total);
  const avg = (totals.reduce((a,b)=>a+b,0) / totals.length).toFixed(1);
  const min = Math.min(...totals);
  const max = Math.max(...totals);
  $('#statsBox').innerHTML = `
    <div><b>${history.length}</b><span style="opacity:.6;font-size:.8em">${t('rolls')}</span></div>
    <div><b>${avg}</b><span style="opacity:.6;font-size:.8em">${t('avg')}</span></div>
    <div><b>${min}</b><span style="opacity:.6;font-size:.8em">${t('min')}</span></div>
    <div><b>${max}</b><span style="opacity:.6;font-size:.8em">${t('max')}</span></div>`;
}

function doRoll() {
  const qty = Math.max(1, Math.min(20, +$('#qty').value || 1));
  const mod = +$('#mod').value || 0;
  const mode = $('#mode').value;
  const r = rollDice(selected, qty, mod, mode);
  $('#resultBox').innerHTML = fmtRoll(r);
  pushHistory(r);
}

function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    if (raw) history = JSON.parse(raw).slice(0, 50);
  } catch(e){}
}

function clearHist() {
  history = [];
  try { localStorage.removeItem(HISTORY_KEY); } catch(e){}
  renderHistory(); renderStats();
  $('#resultBox').innerHTML = '';
}

$('#diceGrid').addEventListener('click', e => {
  const card = e.target.closest('.dice-card');
  if (!card) return;
  selected = +card.dataset.d;
  renderGrid();
});

loadHistory();
renderGrid();
renderHistory();
renderStats();

$('#toolbar').innerHTML = `
  <button class="gz-btn gz-btn-secondary" onclick="clearHist()">${t('clear')}</button>`;

GZ.renderToolPage({
  category: 'fun',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4','step5'],
  related: [
    {icon:'🎲', href:'/fun/coin-flip.html', name:'Coin Flip'},
    {icon:'🃏', href:'/fun/magic-8-ball.html', name:'Magic 8-Ball'},
    {icon:'🎉', href:'/fun/truth-or-dare-generator.html', name:'Truth or Dare'},
    {icon:'🧠', href:'/fun/word-association.html', name:'Word Association'},
  ]
});
</script>
