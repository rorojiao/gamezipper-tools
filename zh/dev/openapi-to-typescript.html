/* ── UI ─────────────────────────────────────────────────────────────── */
var state = { types: '', paths: '', issues: [], stats: null, tab: 'types' };
var OPTS = { exportTypes: true, useInterface: true, jsdoc: true, includePaths: true, readonly: false, optionalAll: false };

function parseSpec(raw) {
  var txt = String(raw || '').trim();
  if (!txt) return { error: t('emptySpec') };
  var spec = null;
  if (txt.charAt(0) === '{' || txt.charAt(0) === '[') {
    try { spec = JSON.parse(txt); } catch (e) { spec = null; }
  }
  if (spec === null) {
    try { spec = parseYamlSafe(txt); } catch (e2) { return { error: t('parseFail') + ' (' + e2.message + ')' }; }
  }
  if (!isPlainObject(spec)) return { error: t('parseFail') };
  return { spec: spec };
}

function run() {
  var raw = $('#input').value;
  if (!raw.trim()) { GZ.showToast(t('emptySpec')); return; }
  var res = parseSpec(raw);
  if (res.error) { GZ.showToast(res.error); $('#report').hidden = true; return; }
  var gen = generateTypes(res.spec, OPTS);
  if (!gen.stats.schemas) {
    GZ.showToast(t('noSchemas'));
    $('#report').hidden = true;
    return;
  }
  state.types = gen.types;
  state.paths = gen.paths;
  state.issues = gen.issues;
  state.stats = gen.stats;
  $('#report').hidden = false;
  renderChips(gen.stats, gen.issues);
  renderIssues(gen.issues);
  setTab(state.tab);
}

function renderChips(st, issues) {
  $('#chips').innerHTML =
    '<div class="oa-chip"><b>' + st.version + '</b><span>' + t('cVersion') + '</span></div>' +
    '<div class="oa-chip"><b>' + st.schemas + '</b><span>' + t('cSchemas') + '</span></div>' +
    '<div class="oa-chip"><b>' + st.types + '</b><span>' + t('cTypes') + '</span></div>' +
    '<div class="oa-chip"><b>' + st.ops + '</b><span>' + t('cOps') + '</span></div>' +
    '<div class="oa-chip"><b>' + st.enums + '</b><span>' + t('cEnums') + '</span></div>' +
    '<div class="oa-chip"><b>' + (issues ? issues.length : 0) + '</b><span>' + t('cIssues') + '</span></div>';
}

function renderIssues(issues) {
  var ul = $('#warns');
  if (!issues.length) {
    ul.innerHTML = '<li><span class="oa-badge ok">OK</span><span>' + t('noIssues') + '</span></li>';
    return;
  }
  ul.innerHTML = issues.map(function (w) {
    var cls = w.level === 'error' ? 'err' : 'warn';
    var badge = w.level === 'error' ? t('errTitle') : t('warnTitle');
    return '<li><span class="oa-badge ' + cls + '">' + badge + '</span><span>' + esc(w.text) + '</span></li>';
  }).join('');
}
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function currentText() {
  if (state.tab === 'paths') return state.paths || '';
  return state.types || '';
}
function setTab(tab) {
  state.tab = tab;
  var tabs = $('#tabs').querySelectorAll('.oa-tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].className = 'oa-tab' + (tabs[i].getAttribute('data-tab') === tab ? ' on' : '');
  var txt = currentText();
  $('#outCode').textContent = txt || '// ' + (tab === 'paths' ? t('tabPaths') : t('tabTypes'));
}

function clearAll() {
  $('#input').value = '';
  $('#report').hidden = true;
  state.types = ''; state.paths = ''; state.issues = []; state.stats = null;
}

/* Options panel */
var OPT_DEFS = [
  { key: 'exportTypes', labelKey: 'optExport' },
  { key: 'useInterface', labelKey: 'optInterface' },
  { key: 'jsdoc', labelKey: 'optJsdoc' },
  { key: 'includePaths', labelKey: 'optPaths' },
  { key: 'readonly', labelKey: 'optReadonly' },
  { key: 'optionalAll', labelKey: 'optOptionalAll' }
];
function renderOpts() {
  $('#opts').innerHTML = OPT_DEFS.map(function (o) {
    return '<label><input type="checkbox" data-opt="' + o.key + '"' + (OPTS[o.key] ? ' checked' : '') + '> ' + t(o.labelKey) + '</label>';
  }).join('');
}
$('#opts').addEventListener('change', function (e) {
  var el = e.target;
  if (!el || !el.getAttribute) return;
  var k = el.getAttribute('data-opt');
  if (!k) return;
  OPTS[k] = el.checked;
  if (state.stats) run();
});

/* Toolbar */
$('#toolbar').innerHTML =
  '<button class="gz-btn" onclick="run()">' + t('generate') + '</button>' +
  '<button class="gz-btn gz-btn-secondary" onclick="loadExample(\'json\')">' + t('exampleJson') + '</button>' +
  '<button class="gz-btn gz-btn-secondary" onclick="loadExample(\'yaml\')">' + t('exampleYaml') + '</button>' +
  '<button class="gz-btn gz-btn-secondary" onclick="copyText(currentText())">' + t('copy') + '</button>' +
  '<button class="gz-btn gz-btn-secondary" id="dlBtn">' + t('download') + '</button>' +
  '<button class="gz-btn gz-btn-secondary" onclick="clearAll()">' + t('clear') + '</button>';

$('#dlBtn').addEventListener('click', function () {
  var txt = currentText();
  if (!txt) { GZ.showToast(t('emptySpec')); return; }
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' }));
  a.download = 'api-types.d.ts';
  a.click();
  URL.revokeObjectURL(a.href);
});

/* Tabs */
$('#tabs').innerHTML =
  '<button class="oa-tab on" data-tab="types">' + t('tabTypes') + '</button>' +
  '<button class="oa-tab" data-tab="paths">' + t('tabPaths') + '</button>';
$('#tabs').addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('.oa-tab') : null;
  if (!b) return;
  setTab(b.getAttribute('data-tab'));
});

/* File drop */
var drop = $('#drop'), fileInput = $('#file');
drop.addEventListener('click', function () { fileInput.click(); });
drop.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
function readFile(f) {
  var fr = new FileReader();
  fr.onload = function () { $('#input').value = fr.result; run(); };
  fr.readAsText(f);
}
fileInput.addEventListener('change', function () {
  var f = fileInput.files && fileInput.files[0];
  if (f) readFile(f);
});
['dragenter', 'dragover'].forEach(function (ev) {
  drop.addEventListener(ev, function (e) { e.preventDefault(); e.stopPropagation(); });
});
drop.addEventListener('drop', function (e) {
  e.preventDefault(); e.stopPropagation();
  var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) readFile(f);
});
