const { $, copyText, t } = GZ;

function pick(arr, n) {
  const c = arr.slice();
  for (let i = c.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [c[i], c[j]] = [c[j], c[i]];
  }
  return c.slice(0, Math.min(n, c.length));
}

function getPool(scene, tone) {
  const s = SCENES[scene];
  if (!s) return null;
  if (s[tone]) return s[tone];
  return s.default || s[TONE_LIST[0]];
}

function generate() {
  const a = ($('#charA').value || 'A').trim();
  const b = ($('#charB').value || 'B').trim();
  const scene = $('#sceneSel').value;
  const tone = $('#toneSel').value;
  const setting = ($('#setting').value || '').trim();
  const length = $('#lengthSel').value;
  const count = length.startsWith('Short') ? 8 : length.startsWith('Long') ? 16 : 12;
  const pool = getPool(scene, tone);
  if (!pool) return;

  const open = pick(pool.open, 1);
  const mid = pick(pool.mid, Math.max(2, count - 4));
  const close = pick(pool.close, 1);
  const stage = pool.stage ? pick(pool.stage, 1) : [];

  const lines = [];
  if (setting) lines.push(`[Scene: ${setting}]`);
  if (stage[0]) lines.push(`(${stage[0]})`);
  const speakerOrder = [a, b];
  let turn = 0;
  lines.push(`${speakerOrder[turn]}: ${open[0]}`);
  turn = 1 - turn;
  mid.forEach(line => {
    lines.push(`${speakerOrder[turn]}: ${line}`);
    turn = 1 - turn;
  });
  lines.push(`${speakerOrder[turn]}: ${close[0]}`);
  turn = 1 - turn;
  lines.push(`${speakerOrder[turn]}: ${(tone === 'Melancholic' || tone === 'Suspenseful') ? '...' : '(beat)'}`);

  const formatted = lines.map((l, i) => {
    if (l.startsWith('[') || l.startsWith('(')) return `<span class="direc">${escapeHtml(l)}</span>`;
    return `<span class="char">${escapeHtml(l)}</span>`;
  }).join('\n');
  $('#dgScript').innerHTML = formatted;
  $('#dgSummary').innerHTML = t('summary', a, b, `${scene} · ${tone}`);
  try { localStorage.setItem('gz_dg_lastA', a); } catch(e) {}
  try { localStorage.setItem('gz_dg_lastB', b); } catch(e) {}
}

function initSelects() {
  $('#sceneSel').innerHTML = SCENE_LIST.map(s => `<option>${s}</option>`).join('');
  $('#toneSel').innerHTML = TONE_LIST.map(tn => `<option>${tn}</option>`).join('');
  $('#sceneSel').value = 'Argument';
  $('#toneSel').value = 'Tense';
  $('#lblCharA').textContent = t('lblCharA');
  $('#lblCharB').textContent = t('lblCharB');
  $('#lblScene').textContent = t('lblScene');
  $('#lblTone').textContent = t('lblTone');
  $('#lblSetting').textContent = t('lblSetting');
  $('#lblLength').textContent = t('lblLength');
  $('#generateBtn').textContent = t('generate');
  $('#copyBtn').textContent = t('copy');
  $('#downloadBtn').textContent = t('download');
  $('#charA').value = lastA;
  $('#charB').value = lastB;
}

function copyScript() {
  const text = $('#dgScript').innerText;
  copyText(text);
}

function downloadScript() {
  const text = $('#dgScript').innerText;
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `dialogue-${(new Date()).toISOString().slice(0,10)}.txt`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

$('#generateBtn').addEventListener('click', generate);
$('#copyBtn').addEventListener('click', copyScript);
$('#downloadBtn').addEventListener('click', downloadScript);

initSelects();
