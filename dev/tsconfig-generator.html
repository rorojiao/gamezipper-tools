<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is a tsconfig.json file?","acceptedAnswer":{"@type":"Answer","text":"tsconfig.json is the TypeScript compiler configuration file. It tells tsc and your editor which files to compile, which language features to allow, how strict type checking should be, where to emit output and how to resolve module imports. Every TypeScript project has one at its root."}},{"@type":"Question","name":"Which tsconfig preset should I choose?","acceptedAnswer":{"@type":"Answer","text":"Choose Next.js for Next apps (jsx preserve, noEmit, bundler resolution), React for Vite or CRA style SPAs (react-jsx), Node.js for servers (nodenext module resolution), Library when you publish a package (declarations and source maps), or Base for a minimal modern setup. You can fine-tune every option afterwards."}},{"@type":"Question","name":"What does strict mode do in TypeScript?","acceptedAnswer":{"@type":"Answer","text":"strict enables all strict type-checking flags at once: strictNullChecks, noImplicitAny, strictFunctionTypes, strictBindCallApply, strictPropertyInitialization, noImplicitThis and alwaysStrict. It catches null dereferences and implicit any types early. New projects should keep it on; only disable it when migrating a large legacy codebase gradually."}},{"@type":"Question","name":"What are path aliases in tsconfig.json?","acceptedAnswer":{"@type":"Answer","text":"Path aliases map a short prefix such as @/ to a folder, so you can write import { api } from '@/lib/api' instead of ../../../lib/api. Set them under compilerOptions.paths with a matching baseUrl. Most bundlers (Vite, webpack, Next.js) understand the paths field directly."}},{"@type":"Question","name":"Is my configuration saved or uploaded anywhere?","acceptedAnswer":{"@type":"Answer","text":"No. The generator runs entirely in your browser and nothing you select leaves your machine. The output is plain text you can copy or download as tsconfig.json."}}]}</script>

<script>
GZI18n.register({
  en: {
    toolTitle: 'TSConfig Generator',
    toolDesc: 'Build a production-ready tsconfig.json in seconds — pick a preset, tune strict mode, target, module resolution and path aliases.',
    pBase: 'Base', pBaseS: 'minimal modern',
    pReact: 'React', pReactS: 'Vite / CRA',
    pNext: 'Next.js', pNextS: 'app router',
    pNode: 'Node.js', pNodeS: 'server / CLI',
    pLib: 'Library', pLibS: 'npm package',
    optStrict: 'Strict mode', optNoEmit: 'noEmit (type-check only)', optSourcemaps: 'Source maps', optAliases: 'Path alias prefix',
    optTarget: 'Target', optModule: 'Module',
    outLabel: 'tsconfig.json (with comments)',
    copy: 'Copy', download: 'Download tsconfig.json',
    note: 'Comments use JSONC — the format TypeScript itself accepts. If your tooling needs strict JSON, strip the // lines.',
    step1: 'Pick a preset that matches your project (Next.js, React, Node.js, library or base)',
    step2: 'Toggle strict mode, noEmit and source maps, choose the compiler target',
    step3: 'Add a path alias prefix like @ if you want short imports',
    step4: 'Copy the result or download it as tsconfig.json',
  },
  zh: {
    toolTitle: 'TSConfig 配置生成器',
    toolDesc: '几秒生成生产可用的 tsconfig.json — 选择预设，调整严格模式、编译目标、模块解析和路径别名。',
    pBase: '基础', pBaseS: '现代最小配置',
    pReact: 'React', pReactS: 'Vite / CRA',
    pNext: 'Next.js', pNextS: 'App Router',
    pNode: 'Node.js', pNodeS: '服务端 / CLI',
    pLib: '库', pLibS: 'npm 包',
    optStrict: '严格模式', optNoEmit: 'noEmit（仅类型检查）', optSourcemaps: 'Source Map', optAliases: '路径别名前缀',
    optTarget: '编译目标', optModule: '模块系统',
    outLabel: 'tsconfig.json（含注释）',
    copy: '复制', download: '下载 tsconfig.json',
    note: '输出使用 TypeScript 自身接受的 JSONC 格式（带 // 注释）。如工具要求严格 JSON，删除注释行即可。',
    step1: '选择与项目匹配的预设（Next.js、React、Node.js、库或基础）',
    step2: '开关严格模式、noEmit、Source Map，选择编译目标',
    step3: '如需短路径导入，添加 @ 之类的路径别名前缀',
    step4: '复制结果或下载为 tsconfig.json',
  }
});

const { $, copyText, t } = GZ;
let preset = 'base';
const state = { strict: true, noEmit: false, sourcemaps: false, alias: '', target: 'ES2022', module: 'ESNext' };

const PRESETS = {
  base:  { target: 'ES2022', module: 'ESNext', moduleResolution: 'bundler' },
  react: { target: 'ES2022', module: 'ESNext', moduleResolution: 'bundler', jsx: 'react-jsx', lib: ['DOM','DOM.Iterable','ES2022'] },
  next:  { target: 'ES2022', module: 'ESNext', moduleResolution: 'bundler', jsx: 'preserve', lib: ['DOM','DOM.Iterable','ES2022'], plugin: 'next', allowJs: true, noEmit: true },
  node:  { target: 'ES2022', module: 'NodeNext', moduleResolution: 'NodeNext', lib: ['ES2023'], types: ['node'], outDir: 'dist', rootDir: 'src' },
  lib:   { target: 'ES2022', module: 'ESNext', moduleResolution: 'bundler', declaration: true, declarationMap: true, outDir: 'dist', rootDir: 'src' }
};

function renderPresets() {
  $('#presets').innerHTML = ['base','react','next','node','lib'].map(p =>
    `<button class="tc-preset${preset===p?' on':''}" onclick="setPreset('${p}')">${t('p'+p[0].toUpperCase()+p.slice(1))}<small>${t('p'+p[0].toUpperCase()+p.slice(1)+'S')}</small></button>`).join('');
}
function renderOpts() {
  const targets = ['ES5','ES2018','ES2020','ES2022','ESNext'];
  const mods = ['ESNext','NodeNext','CommonJS','Preserve'];
  $('#opts').innerHTML = `
    <label><input type="checkbox" id="o-strict" ${state.strict?'checked':''} onchange="upd('strict',this.checked)">${t('optStrict')}</label>
    <label><input type="checkbox" id="o-noemit" ${state.noEmit?'checked':''} onchange="upd('noEmit',this.checked)">${t('optNoEmit')}</label>
    <label><input type="checkbox" id="o-sm" ${state.sourcemaps?'checked':''} onchange="upd('sourcemaps',this.checked)">${t('optSourcemaps')}</label>
    <label>${t('optTarget')} <select id="o-target" onchange="upd('target',this.value)">${targets.map(x=>`<option ${state.target===x?'selected':''}>${x}</option>`).join('')}</select></label>
    <label>${t('optModule')} <select id="o-module" onchange="upd('module',this.value)">${mods.map(x=>`<option ${state.module===x?'selected':''}>${x}</option>`).join('')}</select></label>
    <label>${t('optAliases')} <input type="text" id="o-alias" value="${state.alias}" placeholder="@/* -> src/*" oninput="upd('alias',this.value)" style="width:110px"></label>`;
}
function renderToolbar() {
  $('#toolbar').innerHTML = `<button class="gz-btn" onclick="copyText(rawOut())">${t('copy')}</button>
    <button class="gz-btn gz-btn-secondary" onclick="downloadOut()">${t('download')}</button>`;
}
let rawOutText = '';
function rawOut() { return rawOutText; }

function setPreset(p) {
  preset = p;
  const d = PRESETS[p];
  state.target = d.target; state.module = d.module;
  if (p === 'next') state.noEmit = true;
  if (p === 'lib') state.sourcemaps = true;
  renderPresets(); renderOpts(); generate();
}
function upd(k, v) { state[k] = (k === 'target' || k === 'module' || k === 'alias') ? v : v; if (k === 'alias') state.alias = v.trim(); generate(); }

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function generate() {
  const d = PRESETS[preset];
  const L = [];
  const c = s => `<span class="tc-cmt">// ${esc(s)}</span>`;
  L.push('{');
  L.push('  ' + c('Generated by GameZipper Tools — TSConfig Generator'));
  L.push('  "include": ["src"],' + (preset === 'next' ? ' // Next.js manages its own include' : ''));
  if (preset === 'next') L.push('  "include": ["next-env.d.ts", "**/*.ts", "**/*.tsx", ".next/types/**/*.ts"],');
  L.push('  "compilerOptions": {');
  L.push('    ' + c('Language output'));
  L.push(`    "target": "${state.target}",`);
  L.push(`    "module": "${state.module}",`);
  if (d.lib) L.push(`    "lib": ${JSON.stringify(d.lib)},`);
  if (d.jsx) L.push(`    "jsx": "${d.jsx}",`);
  L.push('    ' + c('Module resolution'));
  L.push(`    "moduleResolution": "${d.moduleResolution}",`);
  L.push('    "esModuleInterop": true,');
  L.push('    "resolveJsonModule": true,');
  L.push('    "isolatedModules": true,');
  L.push('    "forceConsistentCasingInFileNames": true,');
  L.push('    ' + c('Type checking'));
  L.push(`    "strict": ${state.strict},`);
  L.push('    "skipLibCheck": true,');
  if (state.noEmit) L.push('    "noEmit": true,');
  if (d.outDir) { L.push(`    "outDir": "${d.outDir}",`); L.push(`    "rootDir": "${d.rootDir}",`); }
  if (d.declaration) { L.push('    "declaration": true,'); L.push('    "declarationMap": true,'); }
  if (state.sourcemaps) L.push('    "sourceMap": true,');
  if (d.types) L.push(`    "types": ${JSON.stringify(d.types)},`);
  if (d.plugin) L.push(`    "plugins": [{ "name": "${d.plugin}" }],`);
  if (d.allowJs) L.push('    "allowJs": true,');
  if (state.alias) {
    const a = state.alias.replace(/\/\*$/, '');
    L.push('    ' + c('Path aliases: ' + a + '/* -> src/*'));
    L.push('    "baseUrl": ".",');
    L.push(`    "paths": { "${a}/*": ["src/*"] },`);
  }
  L.push('  }');
  L.push('}');
  const html = L.join('\n');
  rawOutText = L.map(l => l.replace(/<span class="tc-cmt">\/\/ (.*?)<\/span>/g, '$1')).join('\n').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
  $('#out').innerHTML = html;
}

function downloadOut() {
  const blob = new Blob([rawOutText], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tsconfig.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

renderPresets(); renderOpts(); renderToolbar(); generate();
$('#lbl-out').textContent = t('outLabel');
$('#note').textContent = t('note');

GZ.renderToolPage({
  category: 'dev',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'🧩', href:'/dev/jsonc-formatter.html', name:'JSONC Formatter'},
    {icon:'📦', href:'/dev/editorconfig-generator.html', name:'EditorConfig Generator'},
    {icon:'🎛️', href:'/dev/tailwind-config-generator.html', name:'Tailwind Config'},
    {icon:'🖥️', href:'/dev/openapi-to-typescript.html', name:'OpenAPI to TS'},
  ]
});
</script>

</body>
