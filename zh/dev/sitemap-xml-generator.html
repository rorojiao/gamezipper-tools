    count: 'URL 数',
    tooMany: 'URL 过多',
    step1: '粘贴 URL（每行一个） — 建议使用完整 https:// 地址',
    step2: '可选：设置默认 changefreq 和 priority',

});

const { $, t } = GZ;

function todayISO() { return new Date().toISOString().split('T')[0]; }

function escXml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;');
}

function buildSitemap(urls, opts) {
  const { useLastmod, useFreq, usePrio, defFreq, defPrio } = opts;
  const today = todayISO();
  let xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
  xml += '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n';
  for (const u of urls) {
    xml += '  <url>\n';
    xml += `    <loc>${escXml(u)}</loc>\n`;
    if (useLastmod) xml += `    <lastmod>${today}</lastmod>\n`;
    if (useFreq) xml += `    <changefreq>${escXml(defFreq)}</changefreq>\n`;
    if (usePrio) xml += `    <priority>${escXml(defPrio)}</priority>\n`;
    xml += '  </url>\n';
  }
  xml += '</urlset>\n';
  return xml;
}

function parseUrls(text) {
  return text.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
}

function validate(urls) {
  const errors = [];
  if (urls.length === 0) errors.push('No URLs provided');
  if (urls.length > 50000) errors.push('More than 50,000 URLs — split into multiple sitemaps');
  urls.forEach((u, i) => {
    try {
      const parsed = new URL(u);
      if (!['http:', 'https:'].includes(parsed.protocol)) errors.push(`Line ${i + 1}: unsupported protocol (${parsed.protocol})`);
    } catch (e) {
      errors.push(`Line ${i + 1}: invalid URL — ${u.substring(0, 60)}`);
    }
  });
  return errors;
}

function render() {
  const text = $('#urls').value;
  const urls = parseUrls(text);
  const opts = {
    useLastmod: $('#useLastmod').checked,
    useFreq: $('#useFreq').checked,
    usePrio: $('#usePrio').checked,
    defFreq: $('#defFreq').value,
    defPrio: $('#defPrio').value,
  };
  const xml = buildSitemap(urls, opts);
  $('#output').textContent = xml;
  const errors = validate(urls);
  const status = $('#status');
  if (urls.length === 0) { status.innerHTML = ''; return; }
  if (errors.length === 0) {
    status.innerHTML = `<span class="ok">${t('valid')}</span> · <strong>${urls.length}</strong> ${t('count')}`;
  } else {
    const shown = errors.slice(0, 5).join(' · ');
    const more = errors.length > 5 ? ` (and ${errors.length - 5} more)` : '';
    status.innerHTML = `<span class="err">${t('invalid')}</span> · ${shown}${more}`;
  }
}

function loadExample() {
  $('#urls').value = `# Sample sitemap for a tech blog
https://example.com/
https://example.com/about
https://example.com/blog/why-readability-matters
https://example.com/blog/flesch-kincaid-explained
https://example.com/blog/best-readability-tools-2026
https://example.com/tools/json-formatter
https://example.com/tools/base64
https://example.com/tools/word-counter`;
  render();
}

function doClear() { $('#urls').value = ''; render(); }

function doDownload() {
  const blob = new Blob([$('#output').textContent], { type: 'application/xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'sitemap.xml'; document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}

async function doCopy() {
  await navigator.clipboard.writeText($('#output').textContent);
  const btn = $('#copyBtn');
  const orig = btn.textContent;
  btn.textContent = '✓ Copied!';
  setTimeout(() => btn.textContent = orig, 1500);
}

$('#urls').addEventListener('input', render);
['useLastmod','useFreq','usePrio','defFreq','defPrio'].forEach(id => $('#' + id).addEventListener('change', render));

$('#toolbar').innerHTML = `
  <button class="gz-btn" onclick="loadExample()">${t('example')}</button>
  <button class="gz-btn" onclick="doCopy()" id="copyBtn">${t('copy')}</button>
  <button class="gz-btn" onclick="doDownload()">${t('download')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="doClear()">${t('clear')}</button>`;
