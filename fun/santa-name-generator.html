const { $, t } = GZ;
const SNOW=['❄️','⛄','🎄','✨','🔔'];
const stage=document.querySelector('.sn-stage');
for(let i=0;i<7;i++){const s=document.createElement('span');s.className='sn-snow';s.textContent=SNOW[i%SNOW.length];s.style.left=(6+i*13)+'%';s.style.animationDelay=(i*0.45)+'s';stage.appendChild(s);}

const PRE=['Jingle','Twinkle','Snowball','Peppermint','Gingerbread','Sprinkle','Holly','Ivy','Candycane','Frosty','Tinsel','Bells','Cinnamon','Nutmeg','Sugarplum','Snowflake','Pinecone','Velvet','Mistletoe','Wintersong','Hollycrest','Frostpuff','Cherrytop','Gingersnap','Snoozy'];
const SUF=['Brightbell','Sparklefrost','Jinglebottom','Frostwhistle','Snowbright','Tinkerton','Hollyhock','Candyshade','Winterbourne','Glimmerfrost','Pinewhistle','Sugarflash','Bellsprig','Flurrington','Cringlebury','Tinseltree','Snowcraft','Merrymaker','Wrapsworth','Toymaker'];
const TITLE=['Head of Toy Logistics','Chief Cookie Quality Officer','Lead Sleigh Mechanic','Director of Naughtiness Review','Senior Reindeer Whisperer','Head of Wrapping Paper Standards','Night Shift Bell Ringer','Keeper of the Nice List','Sleigh Navigation Officer','Ribbon & Bow Architect'];
const TEAM=['Gingerbread Division','Sled Engineering Corps','Wrapping Detail','Reindeer Stable Guard','Cookie & Cocoa Crew','Toy Design Studio','Aurora Watch','Nice List Auditing'];
const DEER=['Dasher','Dancer','Prancer','Vixen','Comet','Cupid','Donner','Blitzen','Rudolph','Olive'];
const TOYS=['Wooden Train Set','Hand-Carved Rocking Horse','Snow Globe Orchestra','Robot Reindeer','Plush Polar Bear','Tin Rocket Ship','Kaleidoscope Collection','Steam-Powered Music Box'];

function hash(s){let h=5381;for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0;}return h;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296;};}

function generate(name){
  const h=hash(name.trim().toLowerCase());
  const r=mulberry(h);
  const pre=PRE[Math.floor(r()*PRE.length)], suf=SUF[Math.floor(r()*SUF.length)];
  const meter=1+Math.floor(r()*100);
  $('#santaName').textContent=pre+' '+suf;
  $('#santaTitle').textContent='“'+TITLE[Math.floor(r()*TITLE.length)]+'”';
  $('#vTeam').textContent=TEAM[Math.floor(r()*TEAM.length)];
  $('#vReindeer').textContent=DEER[Math.floor(r()*DEER.length)];
  $('#vSpeed').textContent=(180+Math.floor(r()*640))+' mph';
  $('#vToy').textContent=TOYS[Math.floor(r()*TOYS.length)];
  const verdict=meter>=67?t('nice'):meter<=33?t('naughty'):t('neutral');
  $('#vMeter').textContent=meter+'/100 — '+verdict;
  requestAnimationFrame(()=>{ $('#meterPin').style.left=meter+'%'; });
  $('#card').classList.remove('sn-show');
  void $('#card').offsetWidth;
  $('#card').classList.add('sn-show');
  window._snLast=name.trim()+' → '+pre+' '+suf;
}

$('#nameInput').placeholder=t('ph');
$('#goBtn').textContent=t('go');
$('#kTeam').textContent=t('kTeam');$('#kReindeer').textContent=t('kReindeer');
$('#kSpeed').textContent=t('kSpeed');$('#kToy').textContent=t('kToy');$('#kMeter').textContent=t('kMeter');
$('#copyLabel').textContent=t('copyLabel');$('#randomLabel').textContent=t('randomLabel');

$('#goBtn').addEventListener('click', ()=>{
  const v=$('#nameInput').value.trim();
  if(!v){ $('#nameInput').placeholder=t('err'); $('#nameInput').focus(); return; }
  generate(v);
});
$('#nameInput').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#goBtn').click(); });
$('#randomBtn').addEventListener('click', ()=>{
  const pool=['Nick','Tina','Elf','Bob','Mia','Sam','Zoe','Max','Luna','Leo','Kai','Ana'];
  const n=pool[Math.floor(Math.random()*pool.length)]+Math.floor(Math.random()*900+100);
  $('#nameInput').value=n; generate(n);
});
$('#copyBtn').addEventListener('click', async ()=>{
  if(!window._snLast) return;
  try{ await navigator.clipboard.writeText(window._snLast+' — tools.gamezipper.com'); $('#copyLabel').textContent=t('copied'); setTimeout(()=>$('#copyLabel').textContent=t('copyLabel'),1500);}catch(e){}
});
