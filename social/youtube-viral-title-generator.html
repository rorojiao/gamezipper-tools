const { $, copyText, t } = GZ;

const SMALL = new Set(['a','an','the','and','but','or','for','nor','on','at','to','from','by','of','in','with','as','is','it']);

function titleCase(s) {
  return s.toLowerCase().split(/\s+/).map((w, i) => {
    if (i > 0 && SMALL.has(w)) return w;
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(' ');
}

function cap(s) {
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
}

function buildTitles(topic, keyword, style, power, num) {
  const t1 = titleCase(topic);
  const kw = (keyword || topic).trim();
  const K = titleCase(kw);
  const P = (power || '').trim();
  const pwr = P ? P + ' ' : '';
  const pwrLower = P ? P.toLowerCase() + ' ' : '';
  const n = Math.max(2, Math.min(99, parseInt(num) || 5));
  const out = [];

  switch (style) {
    case 'howto':
      out.push(`How to ${cap(topic)} (${P || 'Step-by-Step'} Guide)`);
      out.push(`${P || 'The'} Complete Guide to ${t1}`);
      out.push(`Learn ${topic} in ${n} Minutes`);
      out.push(`${cap(topic)} — ${P || 'Beginner'} to ${P || 'Pro'}`);
      out.push(`${cap(topic)} (${P || 'Easy'} Tutorial for Beginners)`);
      out.push(`${P || 'Master'} ${t1} Fast`);
      out.push(`How I Learned ${topic} in ${n} Days`);
      out.push(`${cap(topic)}: ${P || 'Everything'} You Need to Know`);
      out.push(`${n} ${cap(topic)} Tips That Actually Work`);
      break;
    case 'listicle':
      out.push(`${n} ${cap(topic)} Tips You Need to Know`);
      out.push(`Top ${n} ${titleCase(topic)} for ${P || 'Beginners'}`);
      out.push(`${n} ${cap(topic)} Hacks That Changed My Life`);
      out.push(`${n} ${titleCase(topic)} (${P || 'Number'} ${n} Will Surprise You)`);
      out.push(`${n} Best ${cap(topic)} for ${P || '2026'}`);
      out.push(`I Tried ${n} ${cap(topic)} — Here's the Best`);
      out.push(`${n} ${cap(topic)} Mistakes (Avoid #${n-1})`);
      out.push(`${n} ${cap(topic)} Tools That Save Me Hours`);
      out.push(`${n} Reasons to Start ${topic}`);
      break;
    case 'mistakes':
      out.push(`${n} ${cap(topic)} Mistakes Beginners Make`);
      out.push(`Stop ${topic} Wrong — ${P || 'Do'} This Instead`);
      out.push(`${n} ${cap(topic)} Mistakes That Cost Me Time`);
      out.push(`The ${cap(topic)} Mistake Everyone Makes`);
      out.push(`Why Your ${t1} Isn't Working (And How to Fix It)`);
      out.push(`${cap(topic)}: What I Wish I Knew Sooner`);
      out.push(`${P || 'Avoid'} These ${n} ${cap(topic)} Mistakes`);
      out.push(`${cap(topic)} — ${n} Things I Wish I Knew Earlier`);
      out.push(`Don't Start ${topic} Until You Watch This`);
      break;
    case 'review':
      out.push(`${P || 'Honest'} Review: Is ${cap(topic)} Worth It?`);
      out.push(`I Tested ${cap(topic)} for ${n} Days — ${P || 'Honest'} Review`);
      out.push(`${cap(topic)} Review: ${P || 'The Good, The Bad, The Truth'}`);
      out.push(`Is ${cap(topic)} ${P || 'Worth'} the Hype? (${P || 'Honest'} Take)`);
      out.push(`${cap(topic)} After ${n} Days — ${P || 'Final'} Verdict`);
      out.push(`Why I Stopped Using ${cap(topic)} (${P || 'Honest'} Review)`);
      out.push(`${cap(topic)} vs The Competition — Which Wins?`);
      out.push(`${n} Reasons to ${P || 'Buy'} (and ${n-1} Reasons to Skip) ${cap(topic)}`);
      out.push(`${cap(topic)} — ${P || 'Best'} Choice or Overhyped?`);
      break;
    case 'vs':
      out.push(`${K} vs ${cap(topic)}: Which Is ${P || 'Better'}?`);
      out.push(`${K} vs ${cap(topic)} — ${P || 'Honest'} Comparison`);
      out.push(`I Switched from ${K} to ${cap(topic)} — Was It Worth It?`);
      out.push(`${K} vs ${cap(topic)} (${P || 'The Winner'} Will Surprise You)`);
      out.push(`Why ${cap(topic)} Beats ${K} in ${n} Ways`);
      out.push(`${K} vs ${cap(topic)}: ${P || 'Ultimate'} Showdown`);
      out.push(`${cap(topic)} or ${K}? ${P || 'The'} Final Answer`);
      out.push(`Don't Choose ${K} Until You See This (vs ${cap(topic)})`);
      out.push(`${cap(topic)} vs ${K}: Real-World Test`);
      break;
    case 'curiosity':
      out.push(`The Truth About ${cap(topic)} Nobody Tells You`);
      out.push(`What They Don't Tell You About ${t1}`);
      out.push(`I Discovered Something About ${t1}...`);
      out.push(`Why ${cap(topic)} Changes Everything`);
      out.push(`The ${P || 'Hidden'} Secret to ${t1}`);
      out.push(`I Tried ${topic} for ${n} Days — Here's What Happened`);
      out.push(`Is ${cap(topic)} a Scam? (${P || 'Honest'} Investigation)`);
      out.push(`The Real Reason ${cap(topic)} Works`);
      out.push(`${cap(topic)}: What No One Tells Beginners`);
      break;
    case 'shorts':
      out.push(`Watch Me ${cap(topic)}`);
      out.push(`POV: You Try ${topic}`);
      out.push(`How I ${cap(topic)} in 60 Seconds`);
      out.push(`${cap(topic)} Hack You'll Wish You Knew`);
      out.push(`This ${cap(topic)} Trick Is Unreal`);
      out.push(`${n}-Second ${cap(topic)} Tutorial`);
      out.push(`Wait For It… (${cap(topic)})`);
      out.push(`${cap(topic)} But ${P || 'Actually'} Useful`);
      out.push(`Day ${n}: Trying to ${cap(topic)}`);
      break;
    case 'vlog':
      out.push(`A Day in My Life: ${cap(topic)}`);
      out.push(`Why I Started ${topic}`);
      out.push(`My Honest ${cap(topic)} Story`);
      out.push(`${cap(topic)} Changed Everything`);
      out.push(`How ${t1} Saved Me Hours`);
      out.push(`The Day I Finally Got ${t1}`);
      out.push(`I Tried ${topic} So You Don't Have To`);
      out.push(`${cap(topic)}: A Real Story`);
      out.push(`What ${n} Days of ${topic)} Taught Me`);
      break;
    case 'gaming':
      out.push(`${cap(topic)} But I Suck at It`);
      out.push(`Can I Beat ${cap(topic)} Without ${cap(topic)}?`);
      out.push(`${P || 'World Record'} ${cap(topic)} Speedrun`);
      out.push(`${cap(topic)} Highlights — Insane Plays`);
      out.push(`I Got ${cap(topic)} on My First Try`);
      out.push(`${cap(topic)} but It's ${P || 'Impossible'} Mode`);
      out.push(`Day ${n} of Trying to Master ${topic}`);
      out.push(`${cap(topic)} Reaction Compilation`);
      out.push(`The Best ${cap(topic)} Plays This Week`);
      break;
  }
  // Filter empty/dup + sanity trim
  return out.filter((s, i, a) => s && a.indexOf(s) === i);
}

function charClass(c) {
  if (c <= 40) return 'ttl-ok';
  if (c <= 70) return 'ttl-ok';
  if (c <= 100) return 'ttl-warn';
  return 'ttl-bad';
}

function charLabel(c, style) {
  if (style === 'shorts') return c <= 40 ? t('short') : (c > 100 ? t('over') : '');
  return c > 100 ? t('over') : t('good');
}

function gen() {
  const topic = ($('#f-topic').value || '').trim();
  const keyword = ($('#f-keyword').value || '').trim();
  const style = $('#f-style').value;
  const power = $('#f-power').value;
  const num = $('#f-num').value;

  const list = $('#output');
  list.innerHTML = '';
  if (!topic) { $('#stats').innerHTML = ''; return; }

  const titles = buildTitles(topic, keyword, style, power, num);
  titles.forEach(title => {
    const c = title.length;
    const div = document.createElement('div');
    div.className = 'ttl';
    div.innerHTML = `<span class="txt ${charClass(c)}">${title} <span style="color:var(--text2);font-size:.82em">(${c})</span></span><button class="cp">${t('copyOne')}</button>`;
    div.querySelector('.cp').addEventListener('click', () => copyText(title));
    list.appendChild(div);
  });

  const total = titles.join(' | ').length;
  const avg = Math.round(total / titles.length);
  $('#stats').innerHTML = `<span><b>${titles.length}</b> titles</span><span><b>${avg}</b> avg ${t('chars')}</span><span>${charLabel(avg, style)}</span>`;
}

['f-topic','f-keyword','f-style','f-power','f-num'].forEach(id => {
  $('#'+id).addEventListener('input', gen);
});

$('#f-topic').setAttribute('placeholder', t('phTopic'));
$('#f-keyword').setAttribute('placeholder', t('phKeyword'));

$('#toolbar').innerHTML = `
  <button class="gz-btn" onclick="copyText($('#output').innerText.replace(/\\s*\\(\\d+\\)/g,''))">${t('copy')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="['f-topic','f-keyword'].forEach(id=>document.getElementById(id).value='');gen()">${t('clear')}</button>`;

gen();

</script>
