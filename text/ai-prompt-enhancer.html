<script>
GZI18n.register({

    },

    },
    step1: 'Type your rough prompt or idea in the textarea — even one sentence works',
    step2: 'Pick an enhancement mode that matches your target AI (text, image, video)',
    step3: 'Click Enhance Prompt to get a richer, structured version with style cues and framing',
    step4: 'Copy the result and paste into ChatGPT, Midjourney, Sora or any AI tool',
    tipLabel: '💡 Why this works',
  },
  zh: {
    toolTitle: 'AI 提示词增强器',
    toolDesc: '把粗略想法转换为高质量、结构化的提示词，大幅提升 ChatGPT、Claude、Midjourney、Stable Diffusion、Sora 等 AI 的输出质量。选择模式、输入想法、一键增强。',
    lblInput: '你的原始提示词或想法：',
    placeholder: '例如：一只在太空漂浮的猫',
    enhance: '✨ 增强提示词',
    example: '加载示例',
    copy: '复制结果',
    copied: '✓ 已复制！',
    clear: '清空',
    statsEmpty: '在上方输入内容并点击「增强提示词」。',
    modes: {
      detail: '🔍 增加细节',
      role: '👤 专家角色',
      format: '📋 输出格式',
      image: '🖼️ 图像模型',
      video: '🎬 视频模型',
    },
    tones: {
      auto: '自动语气',
      professional: '专业',
      creative: '创意',
      concise: '简洁',
      technical: '技术',
    },
    step1: '在文本框输入你的粗略提示或想法——即使一句话也可以',
    step2: '选择与目标 AI 匹配的增强模式（文本、图像、视频）',
    step3: '点击「增强提示词」获得带有风格线索和框架的更丰富结构化版本',
    step4: '复制结果并粘贴到 ChatGPT、Midjourney、Sora 或任意 AI 工具',
    tipLabel: '💡 为什么有效',
  }
});

const { $, copyText, t } = GZ;

// Populate mode + tone dropdowns
const modeSel = $('#pe-mode');
Object.entries(t('modes')).forEach(([k, v]) => {
  const opt = document.createElement('option');
  opt.value = k; opt.textContent = v;
  modeSel.appendChild(opt);
});
const toneSel = $('#pe-tone');
Object.entries(t('tones')).forEach(([k, v]) => {
  const opt = document.createElement('option');
  opt.value = k; opt.textContent = v;
  toneSel.appendChild(opt);
});

// ── Enhancement engines (template-based, runs 100% in browser) ──
function enhanceDetail(prompt, tone) {
  const p = prompt.trim();
  const adjectives = {
    auto: ['highly detailed', 'vivid', 'cinematic', 'richly textured'],
    professional: ['precise', 'methodical', 'well-structured', 'analytical'],
    creative: ['whimsical', 'evocative', 'imaginative', 'lush'],
    concise: ['clean', 'focused', 'minimal', 'sharp'],
    technical: ['technically accurate', 'specification-grade', 'parameterized', 'engineered'],
  };
  const adjs = adjectives[tone] || adjectives.auto;
  const a1 = adjs[0], a2 = adjs[1], a3 = adjs[2];
  return `${a1.charAt(0).toUpperCase() + a1.slice(1)} description of: ${p}.\n\nKey elements to expand:\n- Primary subject: ${p}\n- Setting/environment: place it in a ${a2} context with depth and atmosphere\n- Mood and tone: ${a3} emotional resonance that engages the viewer\n- Composition: thoughtful framing with clear focal point\n- Specifics: include textures, colors, lighting, scale, and time of day if relevant\n\nMake every word earn its place. Avoid generic filler. Aim for sensory specificity.`;
}

function enhanceRole(prompt, tone) {
  const p = prompt.trim();
  const roleByTone = {
    auto: 'a seasoned expert with 15+ years of hands-on experience',
    professional: 'a senior consultant from a top-tier firm',
    creative: 'an award-winning creative director',
    concise: 'a focused specialist',
    technical: 'a principal engineer',
  };
  const role = roleByTone[tone] || roleByTone.auto;
  return `You are ${role}. Your task is to help me with the following:\n\n${p}\n\nGuidelines:\n- Draw on deep domain knowledge, not surface-level summaries\n- Cite specific frameworks, methods or case studies when relevant\n- Flag assumptions and trade-offs explicitly\n- Where useful, give 2-3 alternative approaches with pros/cons\n- End with one concrete next step I can take\n\nTone: thoughtful, direct, no fluff. Skip generic disclaimers.`;
}

function enhanceFormat(prompt, tone) {
  const p = prompt.trim();
  return `Task: ${p}\n\nReturn the output in this exact structure:\n\n# Summary\n[2-3 sentence executive summary]\n\n# Key Points\n- [Bullet 1 — concrete and actionable]\n- [Bullet 2]\n- [Bullet 3]\n- [Bullet 4]\n- [Bullet 5]\n\n# Detailed Breakdown\n[Expand each key point with sub-points, examples, and reasoning. Use short paragraphs.]\n\n# Recommendations\n1. [Action 1 with rationale]\n2. [Action 2 with rationale]\n3. [Action 3 with rationale]\n\n# Risks / Caveats\n- [List honest limitations or things to watch out for]\n\nConstraints:\n- Plain markdown only (no HTML)\n- Total length: ~400-600 words\n- Skip filler like "I hope this helps"\n- Be specific over generic`;
}

function enhanceImage(prompt, tone) {
  const p = prompt.trim();
  const style = {
    auto: 'photorealistic',
    professional: 'editorial photography',
    creative: 'concept art',
    concise: 'minimalist illustration',
    technical: 'architectural render',
  }[tone] || 'photorealistic';
  return `${p}, ${style}, shot on Sony A7IV with 85mm f/1.4 lens, shallow depth of field, golden hour lighting, volumetric atmosphere, ultra-detailed textures, 8K resolution, cinematic color grading, award-winning composition`;
}

function enhanceVideo(prompt, tone) {
  const p = prompt.trim();
  return `${p}, cinematic 24fps shot list:\n\n- 0-2s: Wide establishing shot, slow push-in\n- 2-4s: Medium shot, slight dolly right\n- 4-6s: Close-up, rack focus from foreground to subject\n- 6-8s: Over-the-shoulder reveal\n\nCamera: ARRI Alexa Mini, anamorphic lens flare, shallow DOF\nLighting: motivated key light, warm rim, cool fill\nColor: teal & orange grade, lifted blacks\nMotion: subtle parallax, slow shutter drag for movement\nAudio cues: ambient score swell synced to reveal moment\nMood: ${tone === 'creative' ? 'dreamlike and surreal' : tone === 'technical' ? 'precise and methodical' : 'immersive and emotional'}`;
}

const ENHANCERS = { detail: enhanceDetail, role: enhanceRole, format: enhanceFormat, image: enhanceImage, video: enhanceVideo };

const TIPS = {
  detail: 'Adding specific adjectives, sensory details and contextual framing guides the AI to a richer output than a one-line prompt. Models default to the most common interpretation — details push them off the centerline.',
  role: 'Assigning an expert role is a proven prompt-engineering pattern. It triggers the model to draw on a wider distribution of training examples than a generic "write me..." instruction.',
  format: 'Specifying output structure (headings, bullet counts, length) dramatically improves consistency and reduces the "wall of text" failure mode. Models perform best with explicit scaffolds.',
  image: 'Image models respond to camera + lens + lighting cues much more strongly than adjectives. Specifying a real camera body (Sony A7IV, Hasselblad X2D) and a focal length consistently outperforms "high quality, 4K" prompts.',
  video: 'Video models are trained on shot lists. Breaking the prompt into timed beats (0-2s, 2-4s) plus camera + lighting + motion gives far more coherent output than a single long description.',
};

const EXAMPLES = {
  detail: 'a futuristic city at sunset',
  role: 'how to negotiate a 20% raise',
  format: 'compare Notion vs Obsidian',
  image: 'a cozy coffee shop in tokyo',
  video: 'a surfer riding a massive wave',
};

function enhance() {
  const prompt = $('#pe-input').value.trim();
  if (!prompt) { $('#pe-stats').textContent = t('statsEmpty'); return; }
  const mode = modeSel.value;
  const tone = toneSel.value;
  const fn = ENHANCERS[mode] || ENHANCERS.detail;
  const out = fn(prompt, tone);
  $('#pe-output').textContent = out;
  const wordCount = out.split(/\s+/).length;
  $('#pe-stats').textContent = `${out.length} chars · ${wordCount} words · mode: ${t('modes.' + mode)}`;
  $('#pe-tips').innerHTML = `<div class="pe-card"><h4>${t('tipLabel')}</h4><p>${TIPS[mode] || ''}</p></div>`;
}

$('#pe-input').placeholder = t('placeholder');
$('#lbl-input').textContent = t('lblInput');
$('#pe-enhance').textContent = t('enhance');
$('#pe-example').textContent = t('example');
$('#pe-copy').textContent = t('copy');
$('#pe-clear').textContent = t('clear');
$('#pe-stats').textContent = t('statsEmpty');

$('#pe-enhance').addEventListener('click', enhance);
$('#pe-input').addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') enhance(); });
$('#pe-example').addEventListener('click', () => {
  const ex = EXAMPLES[modeSel.value] || EXAMPLES.detail;
  $('#pe-input').value = ex;
  enhance();
});
$('#pe-copy').addEventListener('click', () => {
  const text = $('#pe-output').textContent;
  if (!text) return;
  copyText(text);
  const orig = $('#pe-copy').textContent;
  $('#pe-copy').textContent = t('copied');
  setTimeout(() => { $('#pe-copy').textContent = orig; }, 1200);
});
$('#pe-clear').addEventListener('click', () => {
  $('#pe-input').value = '';
  $('#pe-output').textContent = '';
  $('#pe-tips').innerHTML = '';
  $('#pe-stats').textContent = t('statsEmpty');
});

  ]
});
</script>
