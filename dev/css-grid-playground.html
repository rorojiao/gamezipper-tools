<style>
#preview{display:grid;background:var(--glass2);border:1px solid var(--border);border-radius:12px;padding:16px;min-height:300px;overflow:hidden;position:relative;margin-bottom:14px}
#preview .gi{padding:14px 10px;background:var(--accent);color:#000;border-radius:8px;font-weight:700;text-align:center;cursor:grab;user-select:none;font-size:.85em;min-height:48px;display:flex;align-items:center;justify-content:center}
#preview .gi:hover{filter:brightness(1.1)}
#preview .gi:nth-child(2n){background:var(--accent2);color:#fff}
#preview .gi:nth-child(3n){background:#4ecdc4;color:#000}
#preview .gi:nth-child(4n){background:#ffd93d;color:#000}
#preview .gi:nth-child(5n){background:#c77dff;color:#000}
.control-row{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.control-row label{font-size:.85em;color:var(--text2);min-width:130px;font-weight:600}
.control-row select,.control-row input[type=number],.control-row input[type=text]{background:var(--glass2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:.85em;min-width:80px}
.control-row input[type=range]{flex:1;min-width:120px;max-width:280px}
.control-row .val{min-width:50px;text-align:right;color:var(--accent);font-family:monospace;font-size:.85em;font-weight:700}
#output{width:100%;min-height:160px;font-family:monospace;font-size:.82em;background:#0c1322;color:#e6f1ff;border:1px solid var(--border);border-radius:8px;padding:12px;resize:vertical;line-height:1.6}
.swatch-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.swatch{padding:4px 10px;border:1px solid var(--border);border-radius:14px;background:var(--glass2);color:var(--text2);font-size:.75em;cursor:pointer;transition:.2s}
.swatch.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700}
.swatch:hover{color:var(--text)}
.preset-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.preset{padding:5px 11px;border:1px solid var(--border);border-radius:14px;background:var(--glass2);color:var(--text2);font-size:.75em;cursor:pointer;font-family:monospace}
.preset:hover{background:var(--accent);color:#000;border-color:var(--accent)}
.item-box{background:var(--glass2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px}
.item-box .item-title{font-size:.8em;color:var(--accent);font-weight:700;margin-bottom:6px}
</style>

<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is CSS Grid?","acceptedAnswer":{"@type":"Answer","text":"CSS Grid is a two-dimensional layout system that arranges elements into rows AND columns simultaneously. Unlike Flexbox (one-dimensional), Grid excels at full-page scaffolding, dashboard layouts, image galleries and any layout where you need precise control over both axes at once."}},{"@type":"Question","name":"What is the difference between justify-items and justify-content?","acceptedAnswer":{"@type":"Answer","text":"justify-items aligns grid items inside their own cells along the inline (horizontal) axis — each item is positioned within its assigned area. justify-content aligns the entire grid track layout inside the container when the grid is smaller than the container (when tracks use fixed sizes that don't fill the whole space). Same logic applies to align-items vs align-content on the block (vertical) axis."}},{"@type":"Question","name":"What does grid-auto-flow do?","acceptedAnswer":{"@type":"Answer","text":"grid-auto-flow controls how the auto-placement algorithm fills empty cells. row (default) fills each row left-to-right before moving down. column fills top-to-bottom in each column before moving right. dense backfills holes left by larger items — useful for masonry-style layouts but can visually reorder items."}},{"@type":"Question","name":"Does this Grid Playground send my CSS to a server?","acceptedAnswer":{"@type":"Answer","text":"No. Everything runs locally in your browser. Sliders, previews and CSS generation happen on your device — your layout stays private."}}]}</script>

<body>
<div class="gz-container">
  <div class="gz-tool-header">
    <h1 id="title"></h1>
    <p class="desc" id="desc"></p>
  </div>
  <div class="gz-tool-area">
    <div class="gz-toolbar" id="toolbar"></div>
    <div id="preview"></div>
    <div class="preset-row" id="presets"></div>
    <h3 style="margin:18px 0 8px;font-size:1em">Container</h3>
    <div class="control-row">
      <label>grid-template-columns</label>
      <input type="text" id="cols" value="repeat(3, 1fr)" style="max-width:240px">
    </div>
    <div class="control-row">
      <label>grid-template-rows</label>
      <input type="text" id="rows" value="auto" style="max-width:240px">
    </div>
    <div class="control-row">
      <label>column-gap</label>
      <input type="range" id="colGap" min="0" max="40" value="10">
      <span class="val" id="colGapV">10px</span>
      <label style="min-width:80px">row-gap</label>
      <input type="range" id="rowGap" min="0" max="40" value="10">
      <span class="val" id="rowGapV">10px</span>
    </div>
    <div class="control-row">
      <label>justify-items</label>
      <select id="justifyItems"><option>stretch</option><option>start</option><option>center</option><option>end</option></select>
      <label style="min-width:120px">align-items</label>
      <select id="alignItems"><option>stretch</option><option>start</option><option>center</option><option>end</option></select>
    </div>
    <div class="control-row">
      <label>justify-content</label>
      <select id="justifyContent"><option>stretch</option><option>start</option><option>center</option><option>end</option><option>space-between</option><option>space-around</option><option>space-evenly</option></select>
      <label style="min-width:120px">align-content</label>
      <select id="alignContent"><option>stretch</option><option>start</option><option>center</option><option>end</option><option>space-between</option><option>space-around</option><option>space-evenly</option></select>
    </div>
    <div class="control-row">
      <label>grid-auto-flow</label>
      <select id="autoFlow"><option>row</option><option>column</option><option>row dense</option><option>column dense</option></select>
      <label style="min-width:80px">items</label>
      <input type="number" id="count" min="1" max="16" value="6" style="max-width:80px">
    </div>
    <h3 style="margin:18px 0 8px;font-size:1em">Per-item placement</h3>
    <div id="itemControls"></div>
    <h3 style="margin:18px 0 8px;font-size:1em">Generated CSS</h3>
    <textarea id="output" spellcheck="false" readonly></textarea>
  </div>
  <div class="gz-howto"><h2></h2><ol></ol></div>
  <div class="gz-related"><h2></h2><div class="gz-related-grid"></div></div>
</div>
<script>
GZI18n.register({
  en: {
    toolTitle: 'CSS Grid Playground',
    toolDesc: 'Build 2D grid layouts visually with live preview. Tune grid-template-columns/rows, gap, justify/align items and content, grid-auto-flow and per-item grid-column/grid-row — copy production-ready CSS in one click.',
    copy: 'Copy CSS', reset: 'Reset',
    step1: 'Pick a preset (3-column, sidebar, auto-fit cards) or edit grid-template-columns/rows directly',
    step2: 'Adjust column-gap, row-gap, justify-items, align-items and grid-auto-flow',
    step3: 'Set per-item grid-column (start/end) and grid-row (start/end) to span cells',
    step4: 'Copy the generated CSS below into your stylesheet',
  },
  zh: {
    toolTitle: 'CSS Grid 可视化布局',
    toolDesc: '可视化构建二维 grid 布局，实时预览。调节 grid-template-columns/rows、间距、justify/align items、justify/align content、grid-auto-flow 以及每个项目的 grid-column/grid-row —— 一键复制生产可用的 CSS。',
    copy: '复制 CSS', reset: '重置',
    step1: '从预设选择（三列、侧边栏、自适应卡片）或直接编辑 grid-template-columns/rows',
    step2: '调整 column-gap、row-gap、justify-items、align-items 和 grid-auto-flow',
    step3: '为每个项目设置 grid-column（起/止）和 grid-row（起/止）来跨格',
    step4: '复制下方生成的 CSS 到你的样式表',
  }
});

const { $, copyText, t } = GZ;

const PRESETS = [
  {label:'3-col equal', cols:'repeat(3, 1fr)', rows:'auto'},
  {label:'4-col auto-fit', cols:'repeat(auto-fit, minmax(120px, 1fr))', rows:'auto'},
  {label:'sidebar', cols:'200px 1fr', rows:'auto'},
  {label:'holy grail', cols:'200px 1fr 200px', rows:'auto 1fr auto'},
  {label:'12-col', cols:'repeat(12, 1fr)', rows:'auto'},
  {label:'clear', cols:'1fr', rows:'auto'},
];

const state = {
  cols: 'repeat(3, 1fr)', rows: 'auto',
  colGap: 10, rowGap: 10,
  justifyItems: 'stretch', alignItems: 'stretch',
  justifyContent: 'stretch', alignContent: 'stretch',
  autoFlow: 'row', count: 6,
  items: [
    {colStart:'', colEnd:'', rowStart:'', rowEnd:''},
    {colStart:'', colEnd:'', rowStart:'', rowEnd:''},
    {colStart:'', colEnd:'', rowStart:'', rowEnd:''},
    {colStart:'', colEnd:'', rowStart:'', rowEnd:''},
    {colStart:'', colEnd:'', rowStart:'', rowEnd:''},
    {colStart:'', colEnd:'', rowStart:'', rowEnd:''}
  ]
};

function renderPreview(){
  const p = $('#preview');
  p.style.gridTemplateColumns = state.cols;
  p.style.gridTemplateRows = state.rows;
  p.style.columnGap = state.colGap + 'px';
  p.style.rowGap = state.rowGap + 'px';
  p.style.justifyItems = state.justifyItems;
  p.style.alignItems = state.alignItems;
  p.style.justifyContent = state.justifyContent;
  p.style.alignContent = state.alignContent;
  p.style.gridAutoFlow = state.autoFlow;
  while(p.children.length < state.count){
    const d = document.createElement('div');
    d.className = 'gi';
    d.textContent = p.children.length + 1;
    p.appendChild(d);
  }
  while(p.children.length > state.count) p.removeChild(p.lastChild);
  Array.from(p.children).forEach((el, i) => {
    const it = state.items[i] || {colStart:'', colEnd:'', rowStart:'', rowEnd:''};
    el.style.gridColumnStart = it.colStart || '';
    el.style.gridColumnEnd = it.colEnd || '';
    el.style.gridRowStart = it.rowStart || '';
    el.style.gridRowEnd = it.rowEnd || '';
  });
  renderItemControls();
  renderCSS();
}

function renderItemControls(){
  const c = $('#itemControls');
  let html = '';
  for(let i=0; i<state.count; i++){
    const it = state.items[i] || {colStart:'', colEnd:'', rowStart:'', rowEnd:''};
    html += `<div class="item-box">
      <div class="item-title">Item ${i+1}</div>
      <div class="control-row" style="margin-bottom:6px">
        <label style="min-width:90px">grid-col start</label>
        <input type="text" value="${it.colStart}" data-i="${i}" data-k="colStart" style="max-width:90px" placeholder="auto">
        <label style="min-width:80px">end</label>
        <input type="text" value="${it.colEnd}" data-i="${i}" data-k="colEnd" style="max-width:90px" placeholder="auto">
      </div>
      <div class="control-row" style="margin-bottom:0">
        <label style="min-width:90px">grid-row start</label>
        <input type="text" value="${it.rowStart}" data-i="${i}" data-k="rowStart" style="max-width:90px" placeholder="auto">
        <label style="min-width:80px">end</label>
        <input type="text" value="${it.rowEnd}" data-i="${i}" data-k="rowEnd" style="max-width:90px" placeholder="auto">
      </div>
    </div>`;
  }
  c.innerHTML = html;
  c.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', e => {
      const i = +e.target.dataset.i;
      const k = e.target.dataset.k;
      if(!state.items[i]) state.items[i] = {colStart:'', colEnd:'', rowStart:'', rowEnd:''};
      state.items[i][k] = e.target.value;
      Array.from($('#preview').children).forEach((el, idx) => {
        const it = state.items[idx];
        el.style.gridColumnStart = it.colStart || '';
        el.style.gridColumnEnd = it.colEnd || '';
        el.style.gridRowStart = it.rowStart || '';
        el.style.gridRowEnd = it.rowEnd || '';
      });
      renderCSS();
    });
  });
}

function renderCSS(){
  const props = [];
  props.push(`  display: grid;`);
  props.push(`  grid-template-columns: ${state.cols};`);
  if(state.rows !== 'auto') props.push(`  grid-template-rows: ${state.rows};`);
  if(state.colGap !== 0) props.push(`  column-gap: ${state.colGap}px;`);
  if(state.rowGap !== 0) props.push(`  row-gap: ${state.rowGap}px;`);
  if(state.justifyItems !== 'stretch') props.push(`  justify-items: ${state.justifyItems};`);
  if(state.alignItems !== 'stretch') props.push(`  align-items: ${state.alignItems};`);
  if(state.justifyContent !== 'stretch') props.push(`  justify-content: ${state.justifyContent};`);
  if(state.alignContent !== 'stretch') props.push(`  align-content: ${state.alignContent};`);
  if(state.autoFlow !== 'row') props.push(`  grid-auto-flow: ${state.autoFlow};`);
  let css = `.container {\n` + props.join('\n') + '\n}';
  const itemRules = [];
  state.items.forEach((it, i) => {
    const diffs = [];
    if(it.colStart) diffs.push(`grid-column-start: ${it.colStart}`);
    if(it.colEnd) diffs.push(`grid-column-end: ${it.colEnd}`);
    if(it.rowStart) diffs.push(`grid-row-start: ${it.rowStart}`);
    if(it.rowEnd) diffs.push(`grid-row-end: ${it.rowEnd}`);
    if(diffs.length) itemRules.push(`.item-${i+1} {\n  ${diffs.join(';\n  ')};\n}`);
  });
  if(itemRules.length) css += '\n\n' + itemRules.join('\n\n');
  $('#output').value = css;
}

function renderPresets(){
  const c = $('#presets');
  c.innerHTML = PRESETS.map((p, i) => `<span class="preset" data-i="${i}">${p.label}</span>`).join('');
  c.querySelectorAll('.preset').forEach(el => {
    el.addEventListener('click', e => {
      const p = PRESETS[+e.target.dataset.i];
      state.cols = p.cols; state.rows = p.rows;
      $('#cols').value = p.cols; $('#rows').value = p.rows;
      renderPreview();
    });
  });
}

function reset(){
  state.cols = 'repeat(3, 1fr)'; state.rows = 'auto';
  state.colGap = 10; state.rowGap = 10;
  state.justifyItems = 'stretch'; state.alignItems = 'stretch';
  state.justifyContent = 'stretch'; state.alignContent = 'stretch';
  state.autoFlow = 'row'; state.count = 6;
  state.items = state.items.map(() => ({colStart:'', colEnd:'', rowStart:'', rowEnd:''}));
  $('#cols').value = state.cols; $('#rows').value = state.rows;
  $('#colGap').value = 10; $('#colGapV').textContent = '10px';
  $('#rowGap').value = 10; $('#rowGapV').textContent = '10px';
  $('#justifyItems').value = 'stretch'; $('#alignItems').value = 'stretch';
  $('#justifyContent').value = 'stretch'; $('#alignContent').value = 'stretch';
  $('#autoFlow').value = 'row'; $('#count').value = 6;
  renderPreview();
}

$('#cols').addEventListener('input', e => { state.cols = e.target.value; renderPreview(); });
$('#rows').addEventListener('input', e => { state.rows = e.target.value; renderPreview(); });
$('#colGap').addEventListener('input', e => { state.colGap = +e.target.value; $('#colGapV').textContent = state.colGap + 'px'; renderPreview(); });
$('#rowGap').addEventListener('input', e => { state.rowGap = +e.target.value; $('#rowGapV').textContent = state.rowGap + 'px'; renderPreview(); });
$('#justifyItems').addEventListener('change', e => { state.justifyItems = e.target.value; renderPreview(); });
$('#alignItems').addEventListener('change', e => { state.alignItems = e.target.value; renderPreview(); });
$('#justifyContent').addEventListener('change', e => { state.justifyContent = e.target.value; renderPreview(); });
$('#alignContent').addEventListener('change', e => { state.alignContent = e.target.value; renderPreview(); });
$('#autoFlow').addEventListener('change', e => { state.autoFlow = e.target.value; renderPreview(); });
$('#count').addEventListener('input', e => {
  const n = Math.max(1, Math.min(16, +e.target.value || 1));
  state.count = n;
  while(state.items.length < n) state.items.push({colStart:'', colEnd:'', rowStart:'', rowEnd:''});
  renderPreview();
});

$('#toolbar').innerHTML = `
  <button class="gz-btn" onclick="copyText($('#output').value)">📋 ${t('copy')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="reset()">↻ ${t('reset')}</button>`;

GZ.renderToolPage({
  category: 'dev',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'🧩', href:'/dev/css-flexbox-playground.html', name:'CSS Flexbox Playground'},
    {icon:'🍱', href:'/css-tools/bento-grid.html', name:'Bento Grid'},
    {icon:'▦', href:'/css-tools/css-grid-generator.html', name:'CSS Grid Generator'},
    {icon:'🔲', href:'/css-tools/grid-areas-generator.html', name:'Grid Template Areas'},
    {icon:'🌈', href:'/css-tools/gradient.html', name:'CSS Gradient'},
  ]
});

renderPresets();
renderPreview();
</script>
<script src="/tools-result-rec.js?v=R449-flat" defer></script>
