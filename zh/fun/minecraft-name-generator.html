<script>
GZI18n.register({
  en: {
    toolTitle: 'Minecraft Name Generator',
    toolDesc: 'Create a Minecraft gamertag — PvP pro, builder, cottage-core or funny mob style. Every name stays within the 16-character username limit so it is ready to use in Java or Bedrock. 20 unique names per click. Free, private, no signup.',
    sPvp: '⚔️ PvP Pro', sBuilder: '💎 Builder', sCottage: '🌱 Cottage-Core', sFunny: '🧟 Mobs & Funny', sRandom: '🎲 Random',

  },
  zh: {
    toolTitle: 'Minecraft 名字生成器',
    toolDesc: '生成我的世界游戏名 — PvP 高手、建筑师、田园风、搞笑生物等风格。所有名字均在 16 字符用户名限制内，基岩版/Java 版可直接使用。每次点击获得 20 个独特名字。免费、私密、无需注册。',
    sPvp: '⚔️ PvP 高手', sBuilder: '💎 建筑师', sCottage: '🌱 田园风', sFunny: '🧟 生物搞笑', sRandom: '🎲 随机',
    btnGen: '生成 20 个名字',
    btnCopy: '全部复制',
    copied: '已复制！',
    ok16: '≤16 字符 ✓',
    step1: '选择风格 — PvP 高手、建筑师、田园风、搞笑生物或随机',
    step2: '点击「生成」获得 20 个独特的我的世界游戏名',
    step3: '点击任意名字旁的复制按钮即可获取',
    step4: '到启动器里检查是否可用 — 所有名字 ≤16 字符，符合 Java 版规则',
  }
});

const { $, t, showToast } = GZ;
const pick = a => a[Math.floor(Math.random() * a.length)];

const MAT = ['Diamond','Emerald','Obsidian','Redstone','Ender','Nether','Iron','Gold','Lapis','Amethyst','Copper','Quartz','Prismarine','Elytra','Shulker','Warden','Allay','Axolotl','Blaze','Ghast','Phantom','Wither','Slime','Pixel','Block','Craft','Mine','Lava','Frost','Storm'];
const ROLE = ['Slayer','Hunter','Miner','Crafter','Builder','Walker','Runner','Master','Knight','Ranger','Monk','Mage','Smith','Farmer','Guardian','Warrior','Archer','Spirit','Lord','King'];
const COTT_A = ['Oak','Birch','Spruce','Moss','Fern','Clover','Honey','Berry','Pumpkin','Willow','Maple','Sunny','Misty','Dew','Petal','Blossom','Cocoa','Vanilla','Marsh','Meadow'];
const COTT_B = ['Farm','Cottage','Garden','Vale','Meadow','Glen','Hollow','Nook','Home','Retreat','Brook','Hill','Leaf','Bloom','Harvest','Loaf','Jam','Tea','Cat','Lantern'];
const FUN_A = ['Creeper','Lag','Dirt','Noob','Loot','Tree','Bed','Torche','Enderman','Piglin','Mooshroom','Llama','Villager','Wither','Skelly','Grave','Cobble','Sand','Iron','Suspicious'];
const FUN_B = ['Hugs','Spike','House','Puncher','Goblin','Runner','Explosion','Trade','Stare','Boom','Burp','Cart','TNT','Panic','Drop','Falls','Snore','Quest','Side','Face'];

function fit16(n) { return n.length <= 16 ? n : n.slice(0, 16).replace(/_+$/,''); }

function makeName(style) {
  const r = Math.random();
  let n;
  if (style === 'pvp' || (style === 'random' && r < 0.25)) {
    const base = pick(MAT) + pick(['Pro','TV','YT','X','God','Ace','One','Z','_','99']);
    const t2 = Math.random();
    n = t2 < 0.33 ? 'xX' + base + 'Xx' : t2 < 0.66 ? base + '_' + pick(['TTV','YT','HD','Ace']) : pick(['iAm','The','Its']) + base;
  } else if (style === 'builder' || (style === 'random' && r < 0.5)) {
    n = pick(MAT) + pick(ROLE);
  } else if (style === 'cottage' || (style === 'random' && r < 0.75)) {
    n = pick(COTT_A) + pick(COTT_B);
  } else {
    n = pick(FUN_A) + pick(FUN_B);
  }
  return fit16(n);
}

let style = 'pvp';
const STYLES = [
  {id:'pvp',key:'sPvp'},{id:'builder',key:'sBuilder'},{id:'cottage',key:'sCottage'},{id:'funny',key:'sFunny'},{id:'random',key:'sRandom'},
];
$('#style-tabs').innerHTML = STYLES.map(s => `<button data-id="${s.id}" class="${s.id===style?'active':''}">${t(s.key)}</button>`).join('');
document.querySelectorAll('#style-tabs button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#style-tabs button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    style = b.dataset.id;
    generate();
  });
});

function generate() {
  const seen = new Set();
  const names = [];
  let safety = 0;
  while (names.length < 20 && safety < 400) {
    const n = makeName(style);
    if (!seen.has(n)) { seen.add(n); names.push(n); }
    safety++;
  }
  $('#grid').innerHTML = names.map(n => `
    <div class="pn-card">
      <span class="name">${n.replace(/</g,'&lt;')}<span class="role">${n.length} ${t('ok16')}</span></span>
      <button data-name="${n}" title="copy">📋</button>
    </div>`).join('');
  document.querySelectorAll('#grid .pn-card button').forEach(b => {
    b.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(b.dataset.name); showToast(t('copied')); }
      catch (e) { showToast(t('copied')); }
    });
  });
}

function copyAll() {
  const names = [...document.querySelectorAll('#grid .pn-card .name')].map(e => e.firstChild.textContent.trim());
  if (!names.length) return;
  navigator.clipboard.writeText(names.join('\n')).then(() => showToast(t('copied'))).catch(() => showToast(t('copied')));
}

$('#toolbar').innerHTML = `
  <button class="gz-btn" onclick="generate()">⛏️ ${t('btnGen')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="copyAll()">📋 ${t('btnCopy')}</button>`;

generate();

  ]
});
</script>
