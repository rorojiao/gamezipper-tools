/* AI-typical words/phrases to flag and replace */
const AI_PHRASES = [

  [/\bAdditionally,?\b/gi, 'Also,'],

  [/\bNonetheless,?\b/gi, 'Even so,'],
  [/\bConsequently,?\b/gi, 'So'],

  [/\bIn today's (fast-paced|digital|modern|ever-evolving|rapidly changing) (world|landscape|era)\b/gi, 'These days'],
  [/\bplays a (crucial|pivotal|key|essential|vital) role\b/gi, 'matters a lot'],
  [/\ba wide range of\b/gi, 'lots of'],
  [/\bin the realm of\b/gi, 'in'],
  [/\bIt is (crucial|essential|vital|important|imperative) to\b/gi, 'You really need to'],
  [/\bWhether you are a\b/gi, "Whether you're a"],
  [/\bcannot be (overstated|denied|disputed)\b/gi, 'is huge'],
  [/\bHarness the power of\b/gi, 'Use'],
  [/\bUnleash the potential of\b/gi, 'Get the most out of'],
  [/\bcutting-edge\b/gi, 'modern'],
  [/\bstate-of-the-art\b/gi, 'top-notch'],
  [/\bgame-changer\b/gi, 'big deal'],
  [/\bgame-changing\b/gi, 'big'],
  [/\brevolutionize[s]?\b/gi, 'change[s]'],
  [/\bThe (digital age|modern era|rapid evolution|landscape)\b/gi, 'Things'],
  [/\bGone are the days when\b/gi, 'These days,'],
  [/\bIt (is|has become) increasingly (clear|apparent|evident) that\b/gi, "It's pretty clear that"],
  [/\bIn the (ever-evolving|rapidly changing|modern|digital) (world|landscape|era)\b/gi, 'Today'],
  [/\bthat being said,?\b/gi, 'But'],
  [/\bhaving said that,?\b/gi, 'Still,'],
  [/\butilize[s]?\b/gi, 'use'],
  [/\bdemonstrate[s]?\b/gi, 'show'],
  [/\bfacilitate[s]?\b/gi, 'help'],
  [/\bcommence[s]?\b/gi, 'start'],
  [/\bterminat(e|ing|es)\b/gi, 'end$1'], // 'terminate'→'end' via post-processor
  [/\bpurchase[s]?\b/gi, 'buy'],
  [/\bassist[s]?\b/gi, 'help'],
  [/\brequire[s]?\b/gi, 'need'],
  [/\bobtain[s]?\b/gi, 'get'],
  [/\bnumerous\b/gi, 'many'],
  [/\bcommencing\b/gi, 'starting'],
  [/\binitiate[s]?\b/gi, 'start'],
  [/\bendeavor[s]?\b/gi, 'try'],
  [/\bthe utilization of\b/gi, 'using'],
  [/\bin light of the fact that\b/gi, 'because'],
  [/\bIt is (widely|generally) (recognized|acknowledged|believed|accepted) that\b/gi, 'Most people know that'],
  [/\bThus,?\b/gi, 'So'],
  [/\bHence,?\b/gi, 'So'],
  [/\bTherefore,?\b/gi, 'So'],
  [/\bHenceforth,?\b/gi, 'From now on,'],
  [/\bAs a result,?\b/gi, 'So'],
  [/\bIt is (essential|important|imperative|crucial|vital) (that|to|for)\b/gi, ''],
  [/\bembark on a journey\b/gi, 'start'],
  [/\bjourney\b/gi, 'process'],
];

const CONTRACTION_PAIRS = [
  ['it is', "it's"], ['you are', "you're"], ['they are', "they're"], ['we are', "we're"],
  ['who is', "who's"], ['what is', "what's"], ['that is', "that's"], ['there is', "there's"],
  ['I am', "I'm"], ['do not', "don't"], ['does not', "doesn't"], ['did not', "didn't"],
  ['is not', "isn't"], ['are not', "aren't"], ['was not', "wasn't"], ['were not', "weren't"],
  ['will not', "won't"], ['would not', "wouldn't"], ['should not', "shouldn't"],
  ['cannot', "can't"], ['can not', "can't"], ['could not', "couldn't"],
  ['have not', "haven't"], ['has not', "hasn't"], ['had not', "hadn't"],
  ['I will', "I'll"], ['you will', "you'll"], ['we will', "we'll"], ['they will', "they'll"],
  ['I would', "I'd"], ['you would', "you'd"], ['we would', "we'd"], ['they would', "they'd"],
  ['let us', "let's"], ['who have', "who've"], ['should have', "should've"],
];

const IDIOM_BY_STYLE = {
  Casual: [
    'The thing is, ', 'Look, ', 'Honestly, ', "Here's the deal — ", 'I mean, ',
    'You know, ', 'At the end of the day, ', 'The way I see it, ', 'To be real, ',
    'Real talk — ', 'In a nutshell, ', 'Long story short — ', 'Here is the thing — ',
    'Plot twist — ', 'Spoiler alert — ', 'Bottom line — ',
  ],
  Friendly: [
    'You know what, ', 'Honestly, ', 'By the way, ', 'Just so you know — ', 'Fun fact — ',
    'On a positive note — ', 'The good news? ', 'To put it simply — ', 'In plain English — ',
    'Think of it this way — ', 'Here is something to consider — ', 'A quick heads-up — ',
  ],
  Confident: [
    'Make no mistake — ', 'Here is the bottom line: ', 'The truth is, ', 'Here is why: ',
    'Plain and simple — ', 'The fact remains: ', 'Undeniably, ', 'Without a doubt, ',
    'Count on this — ', 'Here is the deal: ', 'Without question, ',
  ],
  Polished: [
    'It is worth noting — ', 'On a related note — ', 'More to the point — ', 'More importantly, ',
    'What is more, ', 'To that end, ', 'In the same vein — ', 'By the same token — ',
  ],
};

const FILLER_REMOVALS = [
  [/\s+in order to\b/g, ' to'], [/\bvery (very )+/gi, 'very'],
  [/\babsolutely (essential|crucial|necessary|amazing|incredible|phenomenal)\b/gi, '$1'],
  [/\b(?:completely|totally|utterly) (revolutionized|transformed|unique|changed|reimagined)\b/gi, '$1'],
  [/\b(?:It is|It's) (?:important to note that|worth noting that|worth mentioning that|noteworthy that)\s+/gi, ''],
  [/\b(?:In this|Within this) (?:article|guide|post|piece|tutorial|context)\s*,?\s*/gi, ''],
];

const LEVEL_THRESHOLD = { 1: 0.35, 2: 0.65, 3: 0.95 };

const STYLE_KEYS_EN = ['Casual', 'Friendly', 'Confident', 'Polished'];

const { $, copyText, t } = GZ;

function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function rand() { return Math.random(); }

function applyPhraseReplacements(text) {
  let out = text;
  for (const [re, rep] of AI_PHRASES) {
    if (rand() < 0.85) out = out.replace(re, rep);
  }
  return out;
}

function applyContractions(text, strength) {
  let out = text;
  // Be conservative with "it is" -> "it's" since it can change meaning
  const safe = CONTRACTION_PAIRS.filter(p => !['it is', 'that is', 'there is'].includes(p[0]));
  const target = Math.floor(safe.length * strength * 0.7);
  const shuffled = [...safe].sort(() => rand() - 0.5).slice(0, target || 4);
  for (const [from, to] of shuffled) {
    const re = new RegExp('\\b' + from.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'gi');
    out = out.replace(re, to);
  }
  return out;
}

function applyFillerRemoval(text) {
  let out = text;
  for (const [re, rep] of FILLER_REMOVALS) out = out.replace(re, rep);
  return out;
}

function varySentences(text, strength, style) {
  // Split into sentences (simple)
  const sents = text.match(/[^.!?]+[.!?]+(?:\s|$)|[^.!?]+$/g) || [text];
  if (sents.length < 2) return text;
  const idioms = IDIOM_BY_STYLE[style] || IDIOM_BY_STYLE.Casual;
  const out = [];
  for (let i = 0; i < sents.length; i++) {
    let s = sents[i].trim();
    if (!s) continue;
    // Insert idiomatic opener occasionally, but only if the sentence doesn't already start with one
    const lowerS = s.toLowerCase();
    const startsWithExistingOpener = ['plus,', 'also,', 'furthermore,', 'moreover,', 'additionally,', 'note that', 'in conclusion', 'in summary', 'honestly,', 'basically,', 'clearly,', 'make no mistake', 'you know', 'the thing is'].some(op => lowerS.startsWith(op));
    if (i > 0 && rand() < strength * 0.3 && !startsWithExistingOpener) {
      const idiom = pick(idioms);
      const idiomStart = idiom.trim().toLowerCase().replace(/[,—-]/g, '').slice(0, 4);
      if (!s.toLowerCase().startsWith(idiomStart)) {
        s = idiom + s.charAt(0).toLowerCase() + s.slice(1);
      }
    }
    // Convert short sentences into rhetorical questions sometimes (light touch)
    if (strength >= 2 && i === Math.floor(sents.length / 2) && !s.includes('?') && rand() < 0.2 && s.split(/\s+/).length < 12) {
      s = s.replace(/[.!]+$/, '?');
    }
    // Drop trite conjunctions at start if not part of an opener
    if (rand() < strength * 0.25 && !startsWithExistingOpener) {
      s = s.replace(/^(And |But |So )/i, '');
    }
    out.push(s);
  }
  return out.join(' ');
}

function countContractions(text) {
  const re = /\b\w+'(?:s|t|re|ve|ll|d|m)\b/g;
  return (text.match(re) || []).length;
}

function humanize(text, level, style) {
  const strength = LEVEL_THRESHOLD[level] || 0.5;
  let out = text;
  out = applyPhraseReplacements(out);
  out = applyFillerRemoval(out);
  out = applyContractions(out, strength);
  out = varySentences(out, strength, style);
  // Final cleanup: collapse double spaces, fix double punctuation
  out = out.replace(/\s{2,}/g, ' ').replace(/\s+([,.!?;:])/g, '$1').replace(/([.!?])\1+/g, '$1').replace(/,\s*,/g, ',');
  // Re-capitalize sentence starts
  out = out.replace(/(^|[.!?]\s+)([a-z])/g, (m, p1, p2) => p1 + p2.toUpperCase());
  return out.trim();
}

function updateStats(orig, humanized) {
  const oWords = orig.trim().split(/\s+/).filter(Boolean).length;
  const hWords = humanized.trim().split(/\s+/).filter(Boolean).length;
  const oSents = (orig.match(/[.!?]+/g) || []).length || 1;
  const hSents = (humanized.match(/[.!?]+/g) || []).length || 1;
  const avgLen = (hWords / hSents).toFixed(1);
  const contractions = countContractions(humanized);
  $('#ahStats').innerHTML = `
    <div class="ah-stat"><span>${t('statWords')}</span><strong>${hWords}</strong></div>
    <div class="ah-stat"><span>${t('statSentences')}</span><strong>${hSents}</strong></div>
    <div class="ah-stat"><span>${t('statAvgLen')}</span><strong>${avgLen}</strong></div>
    <div class="ah-stat"><span>${t('statContractions')}</span><strong>${contractions}</strong></div>
  `;
}

function doHumanize() {
  const text = $('#input').value.trim();
  const level = parseInt($('#levelSel').value, 10);
  const styleKey = $('#styleSel').value || STYLE_KEYS_EN[$('#styleSel').selectedIndex] || 'Casual';
  if (!text) {
    $('#ahOutput').textContent = '';
    $('#ahSummary').innerHTML = '';
    $('#ahStats').innerHTML = '';
    return;
  }
  const result = humanize(text, level, styleKey);
  $('#ahOutput').textContent = result;
  const lang = GZI18n.getLang();
  $('#ahSummary').innerHTML = lang === 'zh'
    ? `已完成 <strong>${styleKey}</strong> 风格的人性化（强度 ${level}）。`
    : `Humanized in <strong>${styleKey}</strong> style at strength <strong>${level}</strong>.`;
  updateStats(text, result);
}

function doCopy() {
  const text = $('#ahOutput').textContent;
  if (!text) return;
  copyText(text);
  $('#copyBtn').textContent = '✅ ' + t('copied');
  setTimeout(() => { $('#copyBtn').textContent = '📋 ' + (GZI18n.getLang() === 'zh' ? '复制' : 'Copy'); }, 1200);
}

function doSwap() {
  const out = $('#ahOutput').textContent;
  if (!out) return;
  $('#input').value = out;
  $('#ahOutput').textContent = '';
  $('#ahSummary').innerHTML = '';
  $('#ahStats').innerHTML = '';
}

function doClear() {
  $('#input').value = '';
  $('#ahOutput').textContent = '';
  $('#ahSummary').innerHTML = '';
  $('#ahStats').innerHTML = '';
}

function loadExample() {
  $('#input').value = 'It is important to note that in today\'s rapidly evolving digital landscape, businesses must leverage cutting-edge technology to remain competitive. Furthermore, it should be noted that customers are increasingly demanding seamless experiences. In conclusion, organizations that utilize state-of-the-art solutions will undoubtedly thrive.';
  doHumanize();
}

// populate style select
const styleSel = $('#styleSel');
const styleData = (GZI18n._data[GZI18n.getLang()] || {}).styles || IDIOM_BY_STYLE.Casual.length === 0 ? STYLE_KEYS_EN.map((s, i) => STYLE_KEYS_EN[i]) : ['Casual', 'Friendly', 'Confident', 'Polished'];
const styleDataZh = ['随意', '友好', '自信', '优雅'];
['en', 'zh'].forEach(l => {
  const list = (GZI18n._data[l] || {}).styles;
  if (list && list.length) {
    styleSel.innerHTML = list.map((label, i) => {
      const key = l === 'zh' ? STYLE_KEYS_EN[i] : label;
      return `<option value="${key}">${label}</option>`;
    }).join('');
  }
});

$('#humanizeBtn').addEventListener('click', doHumanize);
$('#copyBtn').addEventListener('click', doCopy);
$('#swapBtn').addEventListener('click', doSwap);
$('#clearBtn').addEventListener('click', doClear);

// Pre-load example button next to actions
const exBtn = document.createElement('button');
exBtn.className = 'secondary';
exBtn.id = 'exampleBtn';
exBtn.textContent = GZI18n.getLang() === 'zh' ? '📋 示例' : '📋 Example';
exBtn.addEventListener('click', loadExample);
document.querySelector('.ah-actions').insertBefore(exBtn, $('#clearBtn'));

    {icon: '✍️', href: '/text/paragraph-rewriter.html', name: 'Paragraph Rewriter'},
    {icon: '📏', href: '/text/sentence-expander.html', name: 'Sentence Expander'},
  ],
});
