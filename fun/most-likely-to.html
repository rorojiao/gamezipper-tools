const TAGS = ['funny', 'savage', 'romantic', 'wholesome', 'work', 'family'];
let activeTag = 'funny';
let current = '';
let favs = [];
let spins = 0;
const STORAGE_FAVS = 'gz_mlt_favs';
const STORAGE_SPINS = 'gz_mlt_spins';

try { favs = JSON.parse(localStorage.getItem(STORAGE_FAVS) || '[]'); } catch(e) { favs = []; }
try { spins = parseInt(localStorage.getItem(STORAGE_SPINS) || '0', 10); } catch(e) { spins = 0; }

const { $, copyText, t } = GZ;

function renderTags() {
  const wrap = $('#tagBtns');
  wrap.innerHTML = TAGS.map(tag => `<button class="mlt-tag${tag === activeTag ? ' active' : ''}" data-tag="${tag}">${t('tag' + tag.charAt(0).toUpperCase() + tag.slice(1))}</button>`).join('');
  wrap.querySelectorAll('.mlt-tag').forEach(b => {
    b.addEventListener('click', () => {
      activeTag = b.dataset.tag;
      renderTags();
      updateStats();
    });
  });
}

function spin() {
  const pool = PROMPTS[activeTag];
  if (!pool || !pool.length) return;
  const choice = pool[Math.floor(Math.random() * pool.length)];
  current = choice;
  $('#mltText').textContent = choice;
  spins++;
  try { localStorage.setItem(STORAGE_SPINS, String(spins)); } catch(e) {}
  updateStats();
  updateFavBtn();
}

function updateStats() {
  const tagName = t('tag' + activeTag.charAt(0).toUpperCase() + activeTag.slice(1));
  $('#mltStats').innerHTML = t('stats', spins, tagName);
}

function isFav() { return favs.some(f => f.text === current); }

function toggleFav() {
  if (!current) return;
  if (isFav()) {
    favs = favs.filter(f => f.text !== current);
  } else {
    favs.unshift({ tag: activeTag, text: current, ts: Date.now() });
  }
  try { localStorage.setItem(STORAGE_FAVS, JSON.stringify(favs.slice(0, 50))); } catch(e) {}
  updateFavBtn();
  renderFavs();
}

function updateFavBtn() {
  $('#favBtn').textContent = isFav() ? t('saved') : t('save');
}

function renderFavs() {
  const wrap = $('#mltFavs');
  if (!favs.length) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = `
    <h2>${t('favsTitle')}</h2>
    <div class="mlt-fav-list">
      ${favs.map((f, i) => `
        <div class="mlt-fav-item">
          <span>${escapeHtml(f.text)}</span>
          <button data-i="${i}" title="${t('remove')}">${t('remove')}</button>
        </div>
      `).join('')}
    </div>
    <div style="text-align:center;margin-top:10px"><button class="mlt-tag" id="clearAllBtn">${t('removeAll')}</button></div>
  `;
  wrap.querySelectorAll('.mlt-fav-item button').forEach(b => {
    b.addEventListener('click', () => {
      favs.splice(+b.dataset.i, 1);
      try { localStorage.setItem(STORAGE_FAVS, JSON.stringify(favs)); } catch(e) {}
      renderFavs();
      updateFavBtn();
    });
  });
  const clearBtn = $('#clearAllBtn');
  if (clearBtn) clearBtn.addEventListener('click', () => {
    favs = [];
    try { localStorage.setItem(STORAGE_FAVS, '[]'); } catch(e) {}
    renderFavs();
    updateFavBtn();
  });
}

function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function copyCurrent() {
  if (!current) return;
  copyText(current);
}

$('#spinBtn').addEventListener('click', spin);
$('#copyBtn').addEventListener('click', copyCurrent);
$('#favBtn').addEventListener('click', toggleFav);
renderTags();
updateStats();
renderFavs();
