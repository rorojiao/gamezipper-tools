<script>
GZI18n.register({
  en: {
    toolTitle: 'Online Crosshair Generator',
    toolDesc: 'Design a custom crosshair — style, color, size, gap and center dot — preview it full-screen and download a transparent PNG for any game. Free, browser-only, no install.',
    lblStyle: 'Crosshair style', lblColor: 'Color', lblSize: 'Size', lblThick: 'Thickness', lblGap: 'Gap', lblDot: 'Center dot', lblOutline: 'Black outline',
    stCross: 'Cross', stDot: 'Dot', stCircle: 'Circle', stRing: 'Ring + cross', stX: 'X', stT: 'T-shape',
    download: '⬇ Download PNG', fullscreen: '⛶ Full-screen preview', fsHint: 'Click anywhere or press Esc to exit',
    step1: 'Pick a crosshair style (cross, dot, circle, ring, X or T)',
    step2: 'Tune color, size, thickness, gap, center dot and outline',
    step3: 'Use the full-screen preview to test it against solid backgrounds',
    step4: 'Download the transparent PNG and import it into your game or overlay app',
  },
  zh: {
    toolTitle: '在线准星生成器',
    toolDesc: '自定义准星样式、颜色、大小、间隙和中心点 — 全屏预览,一键下载透明 PNG,适配任何游戏。免费、纯浏览器、无需安装。',
    lblStyle: '准星样式', lblColor: '颜色', lblSize: '大小', lblThick: '粗细', lblGap: '间隙', lblDot: '中心点', lblOutline: '黑色描边',
    stCross: '十字', stDot: '圆点', stCircle: '圆形', stRing: '圆环+十字', stX: 'X 形', stT: 'T 形',
    download: '⬇ 下载 PNG', fullscreen: '⛶ 全屏预览', fsHint: '点击任意处或按 Esc 退出',
    step1: '选择准星样式（十字、圆点、圆形、圆环、X 或 T 形）',
    step2: '调整颜色、大小、粗细、间隙、中心点和描边',
    step3: '用全屏预览在各种纯色背景下测试效果',
    step4: '下载透明 PNG,导入游戏或叠加层软件',
  }
});

const { $, t } = GZ;
const STYLES = ['cross','dot','circle','ring','x','t'];
const COLORS = ['#00ff00','#00e5ff','#ff3b3b','#ffffff','#ffd400','#ff5ce1','#111111'];
let cfg = { style:'cross', color:'#00ff00', size:40, thick:2, gap:4, dot:true, outline:true };

function drawCrosshair(ctx, S, c) {
  const cx=S/2, cy=S/2, k=Math.min(S/320, 1.6);
  const size=c.size*k, thick=Math.max(1,c.thick*k), gap=c.gap*k;
  ctx.save();
  ctx.lineCap='butt';
  function strokeSeg(fn){
    ctx.lineWidth = thick + (c.outline? Math.max(2,thick*0.8):0);
    if(c.outline){ ctx.strokeStyle='rgba(0,0,0,.85)'; fn(true); }
    ctx.lineWidth = thick; ctx.strokeStyle=c.color; fn(false);
  }
  function line(x1,y1,x2,y2){ strokeSeg(()=>{ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }); }
  function circle(r,lw){ strokeSeg(isOut=>{ ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke(); }); }
  function dot(){ const r=Math.max(1.5,thick*1.2); ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); if(c.outline){ctx.fillStyle='rgba(0,0,0,.85)'; ctx.beginPath(); ctx.arc(cx,cy,r+1.2,0,Math.PI*2); ctx.fill();} ctx.fillStyle=c.color; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill(); }
  const s=c.style;
  if(s==='cross'){
    line(cx-gap-size,cy,cx-gap,cy); line(cx+gap,cy,cx+gap+size,cy);
    line(cx,cy-gap-size,cx,cy-gap); line(cx,cy+gap,cx,cy+gap+size);
  } else if(s==='x'){
    const d=size*0.707, g=gap*0.707;
    [[1,1],[1,-1],[-1,1],[-1,-1]].forEach(([sx,sy])=> line(cx+sx*g,cy+sy*g,cx+sx*(g+d),cy+sy*(g+d)));
  } else if(s==='t'){
    line(cx-gap-size,cy,cx+gap+size,cy);
    line(cx,cy+gap,cx,cy+gap+size);
  } else if(s==='circle'){
    circle(gap+size);
  } else if(s==='ring'){
    circle(gap+size);
    line(cx-gap-size,cy,cx-gap,cy); line(cx+gap,cy,cx+gap+size,cy);
    line(cx,cy-gap-size,cx,cy-gap); line(cx,cy+gap,cx,cy+gap+size);
  }
  if(c.dot || s==='dot') dot();
  ctx.restore();
}

function render() {
  const cv=$('#preview'); drawCrosshair(cv.getContext('2d'),320,cfg);
  $('#vSize').textContent=cfg.size; $('#vThick').textContent=cfg.thick; $('#vGap').textContent=cfg.gap;
  document.querySelectorAll('.ch-style').forEach(el=>el.classList.toggle('sel',el.dataset.s===cfg.style));
  document.querySelectorAll('.ch-swatch').forEach(el=>el.classList.toggle('sel',el.dataset.c===cfg.color));
}

// style mini-icons
$('#styles').innerHTML = STYLES.map(s=>`<div class="ch-style" data-s="${s}"><canvas width="44" height="44"></canvas><span data-i18n-st="${s}"></span></div>`).join('');
document.querySelectorAll('.ch-style').forEach(el=>{
  const mc=el.querySelector('canvas').getContext('2d');
  drawCrosshair(mc,44,{...cfg,style:el.dataset.s,size:12,thick:1.5,gap:2,color:'#cfd8e3',dot:el.dataset.s==='dot'});
  el.addEventListener('click',()=>{cfg.style=el.dataset.s;render();});
});
$('#colors').innerHTML = COLORS.map(c=>`<div class="ch-swatch" data-c="${c}" style="background:${c}"></div>`).join('')+`<input type="color" id="ccustom" value="#00ff00" title="custom">`;
document.querySelectorAll('.ch-swatch').forEach(el=>el.addEventListener('click',()=>{cfg.color=el.dataset.c;$('#ccustom').value=el.dataset.c;render();}));
$('#ccustom').addEventListener('input',e=>{cfg.color=e.target.value;render();});
['size','thick','gap'].forEach(id=>$('#'+id).addEventListener('input',e=>{cfg[id]=+e.target.value;render();}));
$('#dot').addEventListener('change',e=>{cfg.dot=e.target.checked;render();});
$('#outline').addEventListener('change',e=>{cfg.outline=e.target.checked;render();});

$('#dlBtn').addEventListener('click',()=>{
  const px=+$('#dlSize').value, cv=document.createElement('canvas');
  cv.width=cv.height=px; drawCrosshair(cv.getContext('2d'),px,cfg);
  const a=document.createElement('a'); a.href=cv.toDataURL('image/png');
  a.download='crosshair-'+cfg.style+'-'+px+'.png'; a.click();
});

function openFS(bg){
  const ov=$('#fsOverlay'); ov.classList.add('on');
  ov.style.background=bg;
  const cv=$('#fsCanvas'), px=Math.min(innerWidth,innerHeight)*0.35;
  cv.width=cv.height=px; drawCrosshair(cv.getContext('2d'),px,{...cfg,color:cfg.color});
  $('#fsHint').textContent=t('fsHint'); $('#fsHint').style.color=bg==='#ffffff'?'#333':'#eee';
}
$('#fsBtn').addEventListener('click',()=>{
  const bg=['#111417','#00ff00','#ffffff','#3d5c3a'][Math.floor(Math.random()*4)];
  openFS(bg);
});
$('#fsOverlay').addEventListener('click',()=>$('#fsOverlay').classList.remove('on'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#fsOverlay').classList.remove('on');});

['lblStyle','lblColor','lblSize','lblThick','lblGap','lblDot','lblOutline'].forEach(k=>$('#'+k).textContent=t(k));
document.querySelectorAll('.ch-style').forEach(el=>{const sp=el.querySelector('span'); sp.textContent = t('st'+el.dataset.s.charAt(0).toUpperCase()+el.dataset.s.slice(1));});
$('#dlBtn').textContent=t('download'); $('#fsBtn').textContent=t('fullscreen');
render();

GZ.renderToolPage({
  category: 'fun',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'🎯', href:'/fun/aim-trainer.html', name:'Aim Trainer'},
    {icon:'🖱️', href:'/fun/mouse-test.html', name:'Mouse Test'},
    {icon:'🖥️', href:'/dev/monitor-test.html', name:'Monitor Test'},
    {icon:'⚡', href:'/fun/reaction-time.html', name:'Reaction Time'},
  ]
});
</script>
