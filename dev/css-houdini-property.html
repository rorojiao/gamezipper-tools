<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "What is a typed CSS custom property?", "acceptedAnswer": {"@type": "Answer", "text": "A typed custom property is declared with the @property at-rule (or CSS.registerProperty in JS) and given an explicit syntax like <length>, <color>, <percentage> or <number>. Once typed, the browser can interpolate it smoothly between keyframes. Untyped custom properties (declared with plain --foo: 10px) are strings and only animate as discrete jumps."}}, {"@type": "Question", "name": "What is the @property at-rule?", "acceptedAnswer": {"@type": "Answer", "text": "@property --name { syntax: '<color>'; inherits: true; initial-value: red; } registers a custom property at parse time, with a known syntax and optional default. It's part of CSS Houdini and supported in Chrome 85+, Edge 85+, Safari 16.4+ and Firefox 128+."}}, {"@type": "Question", "name": "Why do typed properties animate smoothly but untyped properties jump?", "acceptedAnswer": {"@type": "Answer", "text": "Untyped --var is a string, so animations replace the whole value at 50% with no in-between frames. Typed --var has a known numeric/color syntax so the browser can compute intermediate frames and interpolate."}}, {"@type": "Question", "name": "Does the @property playground send my CSS to a server?", "acceptedAnswer": {"@type": "Answer", "text": "No. All parsing, animation and copy run entirely in your browser via CSS.registerProperty and the built-in typed-OM engine. No uploads, no tracking, no signup."}}]}</script>

<body>
<div class="gz-container">
  <div class="gz-tool-header">
    <h1 id="title"></h1>
    <p class="desc" id="desc"></p>
  </div>
  <div class="gz-tool-area">
    <div class="gz-toolbar" id="toolbar"></div>

    <div id="demoBox">@property</div>

    <div class="control-row">
      <label>Syntax type</label>
      <select id="syntax">
        <option value="<length>"><length> (px, em, rem, vh...)</option>
        <option value="<color>"><color> (named, hex, rgb, hsl)</option>
        <option value="<percentage>"><percentage></option>
        <option value="<number>"><number> (unitless)</option>
        <option value="<angle>"><angle> (deg, rad, turn)</option>
      </select>
      <label>Property name</label>
      <input type="text" id="propName" value="--brand-shift" style="max-width:200px">
    </div>

    <div class="control-row">
      <label>Start value</label>
      <input type="text" id="startVal" value="0px" style="max-width:160px">
      <label>End value</label>
      <input type="text" id="endVal" value="120px" style="max-width:160px">
    </div>

    <div class="control-row">
      <label>Inherits</label>
      <select id="inherits">
        <option value="true">true</option>
        <option value="false">false</option>
      </select>
      <label>Initial value</label>
      <input type="text" id="initVal" value="0px" style="max-width:160px">
    </div>

    <div class="control-row">
      <label>Animation speed</label>
      <input type="range" id="speed" min="0.5" max="3" step="0.1" value="1.4">
      <span class="val" id="speedV">1.4s</span>
    </div>

    <div class="swatches">
      <span class="swatch active" data-preset="length">Length shift</span>
      <span class="swatch" data-preset="color">Color shift</span>
      <span class="swatch" data-preset="rotate">Rotate box</span>
      <span class="swatch" data-preset="scale">Scale box</span>
      <span class="swatch" data-preset="opacity">Opacity</span>
    </div>

    <div style="margin-top:14px">
      <h3 style="font-size:1em;margin-bottom:8px">Generated CSS @property</h3>
      <div id="codeOut"></div>
    </div>
  </div>
  <div class="gz-howto"><h2></h2><ol></ol></div>
  <div class="gz-related"><h2></h2><div class="gz-related-grid"></div></div>
</div>
<script>
GZI18n.register({
  en: {
    toolTitle: 'CSS @property (Houdini) Playground',
    toolDesc: 'Register typed CSS custom properties with the @property at-rule. Compare smooth typed animation vs jumpy untyped animation in real time — copy production-ready CSS.',
    copy: 'Copy CSS', reset: 'Reset', play: '▶ Toggle animation',
    browserSupport: 'Browser support',
    step1: 'Pick a syntax type (<length>, <color>, <percentage>, <number>, <angle>) and a property name',
    step2: 'Set the start, end and initial values to match the syntax',
    step3: 'Watch the demo box animate — typed values glide smoothly, untyped jump',
    step4: 'Copy the generated @property at-rule into your stylesheet',
  },
  zh: {
    toolTitle: 'CSS @property (Houdini) 在线编辑器',
    toolDesc: '使用 @property at-rule 注册带类型的 CSS 自定义属性。实时对比有类型（平滑）和无类型（跳变）的动画效果 — 一键复制生产可用的 CSS。',
    copy: '复制 CSS', reset: '重置', play: '▶ 切换动画',
    browserSupport: '浏览器支持',
    step1: '选择语法类型（<length>、<color>、<percentage>、<number>、<angle>）并命名属性',
    step2: '设置起始值、结束值和默认值以匹配所选语法',
    step3: '观察示例方块的动画 —— 有类型值平滑过渡，无类型则跳变',
    step4: '复制下方生成的 @property 规则到你的样式表',
  }
});

const { $, copyText, t } = GZ;
const supportsProperty = typeof window.CSS !== 'undefined' && typeof window.CSS.registerProperty === 'function' && typeof window.CSS.supports === 'function';

const state = {
  prop: '--brand-shift',
  syntax: '<length>',
  start: '0px',
  end: '120px',
  inherits: true,
  initial: '0px',
  speed: 1.4,
  preset: 'length',
  animating: true
};

const presets = {
  length:  { syntax:'<length>', start:'0px', end:'120px', initial:'0px', inherits:true, css:`translateX(var(--brand-shift))` },
  color:   { syntax:'<color>', start:'#e94560', end:'#00d672', initial:'#e94560', inherits:false, css:`background:var(--brand-shift)` },
  rotate:  { syntax:'<angle>', start:'0deg', end:'360deg', initial:'0deg', inherits:false, css:`rotate:var(--brand-shift)` },
  scale:   { syntax:'<number>', start:'0.5', end:'1.4', initial:'1', inherits:true, css:`scale:var(--brand-shift)` },
  opacity: { syntax:'<percentage>', start:'20%', end:'100%', initial:'100%', inherits:false, css:`opacity:calc(var(--brand-shift) / 100)` }
};

function applyPreset(name){
  state.preset = name;
  const p = presets[name];
  state.syntax = p.syntax;
  state.start = p.start;
  state.end = p.end;
  state.initial = p.initial;
  state.inherits = p.inherits;
  $('#syntax').value = p.syntax;
  $('#startVal').value = p.start;
  $('#endVal').value = p.end;
  $('#initVal').value = p.initial;
  $('#inherits').value = String(p.inherits);
  document.querySelectorAll('.swatch').forEach(el => el.classList.toggle('active', el.dataset.preset === name));
  document.getElementById('demoBox').style.cssText = p.css;
  registerProp();
  startAnim();
}

function registerProp(){
  if(!supportsProperty){ renderCode(); return; }
  try {
    CSS.registerProperty({
      name: state.prop,
      syntax: state.syntax,
      inherits: state.inherits === true || state.inherits === 'true',
      initialValue: state.initial
    });
  } catch(e){}
  renderCode();
}

function renderCode(){
  const css = `@property ${state.prop} {
  syntax: "${state.syntax}";
  inherits: ${state.inherits};
  initial-value: ${state.initial};
}

:root {
  ${state.prop}: ${state.start};
}

@keyframes ${state.prop.slice(2)}-shift {
  from { ${state.prop}: ${state.start}; }
  to   { ${state.prop}: ${state.end}; }
}

#demo {
  animation: ${state.prop.slice(2)}-shift ${state.speed}s ease-in-out infinite alternate;
}`;
  $('#codeOut').textContent = css;
}

let animHandle = null;
function startAnim(){
  stopAnim();
  if(!state.animating) return;
  // Apply via @keyframes inline injection
  let sheet = document.getElementById('houdini-keyframes');
  if(!sheet){
    sheet = document.createElement('style');
    sheet.id = 'houdini-keyframes';
    document.head.appendChild(sheet);
  }
  const keyframeName = state.prop.replace('--','') + '-shift';
  sheet.textContent = `@keyframes ${keyframeName} {
    from { ${state.prop}: ${state.start}; }
    to   { ${state.prop}: ${state.end}; }
  }
  #demoBox {
    animation: ${keyframeName} ${state.speed}s ease-in-out infinite alternate;
  }`;
}

function stopAnim(){
  if(animHandle){ clearTimeout(animHandle); animHandle = null; }
}

function reset(){
  state.animating = true;
  applyPreset('length');
}

$('#syntax').addEventListener('change', e => { state.syntax = e.target.value; registerProp(); startAnim(); });
$('#propName').addEventListener('input', e => { state.prop = e.target.value.startsWith('--') ? e.target.value : '--' + e.target.value; registerProp(); startAnim(); });
$('#startVal').addEventListener('input', e => { state.start = e.target.value; registerProp(); startAnim(); });
$('#endVal').addEventListener('input', e => { state.end = e.target.value; registerProp(); startAnim(); });
$('#initVal').addEventListener('input', e => { state.initial = e.target.value; registerProp(); startAnim(); });
$('#inherits').addEventListener('change', e => { state.inherits = e.target.value; registerProp(); startAnim(); });
$('#speed').addEventListener('input', e => { state.speed = +e.target.value; $('#speedV').textContent = state.speed + 's'; registerProp(); startAnim(); });

document.querySelectorAll('.swatch').forEach(el => {
  el.addEventListener('click', () => applyPreset(el.dataset.preset));
});

$('#toolbar').innerHTML = `
  <button class="gz-btn" onclick="copyText(document.getElementById('codeOut').textContent)">📋 ${t('copy')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="window.__resetHoudini && window.__resetHoudini()">↻ ${t('reset')}</button>
  <span class="${supportsProperty ? 'badge ok' : 'badge warn'}">${t('browserSupport')}: ${supportsProperty ? 'CSS.registerProperty ✓' : 'unsupported'}</span>`;
window.__resetHoudini = reset;

GZ.renderToolPage({
  category: 'dev',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'🪆', href:'/dev/css-nesting-generator.html', name:'CSS Nesting Generator'},
    {icon:'▦', href:'/dev/css-grid-playground.html', name:'CSS Grid Playground'},
    {icon:'🧩', href:'/dev/css-flexbox-playground.html', name:'CSS Flexbox Playground'},
    {icon:'📐', href:'css-tools/clamp.html', name:'CSS clamp() Generator'},
    {icon:'🌈', href:'/css-tools/conic-gradient.html', name:'CSS Conic Gradient'},
  ]
});

applyPreset('length');
</script>
<script src="/tools-result-rec.js?v=R449-flat" defer></script>
</body>
