<script>
GZI18n.register({
  en: {
    toolTitle: 'Sentence Expander',
    toolDesc: 'Make any sentence longer and more detailed. Pick an expansion level and tone, get 1–5 elaborated versions in one click — no AI signup, runs in your browser.',

    tones: ['Formal', 'Casual', 'Academic', 'Persuasive'],
    expand: '✨ Expand', example: '📋 Example', clear: '🗑 Clear',
    summary: (n, t, lvl) => `Generated <strong>${n}</strong> expanded version${n>1?'s':''} in <strong>${t}</strong> tone (<strong>${lvl}</strong>).`,
    placeholder: 'Type or paste a short sentence you want to expand…',
    empty: 'Click Expand to see longer versions of your sentence.',

    step4: 'Select 1, 3 or 5 expansions, then click Expand',

  },
  zh: {
    toolTitle: '句子扩展工具',
    toolDesc: '将任意短句扩展得更长、更充实。选择扩展级别和语气，一键获得 1–5 个扩写版本 — 浏览器本地运行，无需 AI 注册。',
    lblLevel: '扩展级别', lblTone: '语气', lblCount: '数量',
    tones: ['正式', '随意', '学术', '说服'],
    expand: '✨ 扩展', example: '📋 示例', clear: '🗑 清空',
    summary: (n, t, lvl) => `已生成 <strong>${n}</strong> 个 <strong>${t}</strong> 风格的扩展版本（<strong>${lvl}</strong>）。`,
    placeholder: '输入或粘贴一个你想扩展的短句…',
    empty: '点击「扩展」查看句子的更长版本。',
    copied: '已复制！',
    step1: '在输入框中输入或粘贴一个短句',
    step2: '选择扩展级别：轻度（约1.5倍）、中度（约2倍）或大幅（约3倍）',
    step3: '选择语气：正式、随意、学术或说服',
    step4: '选择 1、3 或 5 个扩写数量，然后点击「扩展」',
    step5: '点击扩写旁边的复制图标即可复制到剪贴板',
  }
});

const PREFIX_BY_TONE = {
  Formal: ['It is important to note that', 'One should observe that', 'It can be argued that', 'Generally speaking,', 'In essence,'],
  Casual: ['Honestly,', 'You know,', 'The thing is,', 'Basically,', 'Here\'s the deal —'],
  Academic: ['Research suggests that', 'It has been observed that', 'According to the literature,', 'Studies indicate that', 'The evidence shows that'],
  Persuasive: ['Consider this —', 'Imagine if', 'The truth is,', 'Think about it —', 'Here\'s why:']
};

const SUFFIX_BY_TONE = {
  Formal: [', which serves to highlight its broader significance.', ', as has been demonstrated throughout the available evidence.', ', particularly when examined in a wider context.', ', and this remains a meaningful observation worth considering.', ', underscoring the value of careful analysis.'],
  Casual: [', and that\'s actually a pretty big deal.', ', honestly that makes a real difference in the long run.', ', if you think about it for a second.', ', which is kind of the whole point.', ', and most people would agree on that.'],
  Academic: [', as supported by multiple empirical studies in this area.', ', consistent with the framework established in prior literature.', ', suggesting an important avenue for further inquiry.', ', thereby reinforcing the relevance of this observation.', ', which merits additional consideration in subsequent research.'],
  Persuasive: [', and that\'s something worth paying attention to.', ', because it directly affects what you care about.', ', which is exactly why you should keep this in mind.', ', and once you see it, you can\'t unsee it.', ', so don\'t overlook this when you make your decision.']
};

const QUALIFIER_BY_TONE = {
  Formal: [' in particular', ' to a significant extent', ' in this regard', ' in the broader context', ' as one might expect'],
  Casual: [' for sure', ' honestly', ' in most cases', ' basically', ' in a lot of ways'],
  Academic: [' notably', ' substantially', ' to a measurable degree', ' consistently', ' in the available data'],
  Persuasive: [' undoubtedly', ' without question', ' hands down', ' for good reason', ' clearly']
};

const CONNECTOR_BY_TONE = {
  Formal: [', particularly because', ', especially since', ', given that', ', owing to the fact that', ', insofar as'],
  Casual: [', because', ', and', ', but also because', ', which honestly', ', since'],
  Academic: [', particularly when', ', especially as', ', given that', ', insofar as', ', insofar as one considers'],
  Persuasive: [', because', ', since', ', after all', ', which means', ', so that']
};

const DETAIL_BY_TONE = {
  Formal: [
    ' It is widely recognized that this holds true across a range of related scenarios.',
    ' A careful examination of the underlying factors reveals additional depth.',
    ' This perspective is consistent with established practice in the field.',
    ' Taken together, these elements point to a coherent and well-supported conclusion.',
    ' A measured review confirms the broader applicability of the underlying principle.'
  ],
  Casual: [
    ' I mean, just think about it for a second and it makes total sense.',
    ' Honestly, that\'s pretty much the whole story in a nutshell.',
    ' And yeah, that\'s something most of us have seen at some point.',
    ' The way I see it, this is basically how things usually go.',
    ' Plus there\'s a lot more to it once you start paying attention.'
  ],
  Academic: [
    ' Empirical research has consistently shown this pattern across comparable contexts.',
    ' A review of the relevant literature further reinforces this observation.',
    ' The methodological rigor of subsequent studies has lent additional support to this finding.',
    ' When considered within the broader analytical framework, the result is particularly meaningful.',
    ' These findings align with the theoretical expectations derived from prior scholarship.'
  ],
  Persuasive: [
    ' And that alone should change the way you think about this.',
    ' When you put it all together, the case becomes impossible to ignore.',
    ' That\'s exactly why smart people pay close attention to this kind of detail.',
    ' So if you care about getting this right, this matters more than you think.',
    ' The bottom line is that this gives you a real edge if you act on it.'
  ]
};

const LEVEL_LABEL = { 1: 'Slight', 2: 'Moderate', 3: 'Long' };
const LEVEL_ZH = { 1: '轻度', 2: '中度', 3: '大幅' };

const { $, copyText, t } = GZ;

function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function expandOnce(text, tone, level) {
  let out = text.trim();
  if (!out) return '';
  if (!/[.!?]$/.test(out)) out += '.';
  // Add prefix 40% (unless starts with similar)
  if (level >= 1 && Math.random() < 0.4) {
    const pre = pick(PREFIX_BY_TONE[tone]);
    const firstSix = out.toLowerCase().slice(0, 6);
    if (!PREFIX_BY_TONE[tone].some(p => p.toLowerCase().slice(0, 6) === firstSix)) {
      out = pre + ' ' + out.charAt(0).toLowerCase() + out.slice(1);
    }
  }
  // Inject qualifier (small bump)
  if (level >= 2 && out.length > 20) {
    const tokens = out.split(/(\s+)/);
    if (tokens.length > 4 && Math.random() < 0.5) {
      const idx = 2 + Math.floor(Math.random() * (tokens.length - 4));
      tokens[idx] = pick(QUALIFIER_BY_TONE[tone]) + tokens[idx];
      out = tokens.join('');
    }
  }
  // Insert a connector clause
  if (level >= 2 && out.length > 30) {
    const conn = pick(CONNECTOR_BY_TONE[tone]);
    const sub = pick(DETAIL_BY_TONE[tone]);
    // append at end (before final period)
    if (out.endsWith('.')) out = out.slice(0, -1) + conn + sub.slice(1);
    else out = out + conn + sub;
  } else if (level === 1 && Math.random() < 0.4) {
    out += pick(SUFFIX_BY_TONE[tone]);
  }
  // For Long level: add 2 detail sentences
  if (level >= 3) {
    const a = pick(DETAIL_BY_TONE[tone]);
    const b = pick(DETAIL_BY_TONE[tone]);
    out += a;
    if (Math.random() < 0.7) out += b;
  }
  return out;
}

function generateExpansions(sentence, count, tone, level) {
  const seen = new Set([sentence.trim().toLowerCase()]);
  const expansions = [];
  let attempts = 0;
  while (expansions.length < count && attempts < count * 8) {
    attempts++;
    const r = expandOnce(sentence, tone, level);
    const key = r.toLowerCase().replace(/[^a-z0-9]/g, '');
    if (r && !seen.has(key) && r.trim() !== sentence.trim()) {
      seen.add(key);
      expansions.push(r);
    }
  }
  return expansions;
}

function getLevelLabel(level) {
  const lang = GZI18n.getLang();
  return lang === 'zh' ? LEVEL_ZH[level] : LEVEL_LABEL[level];
}

function render(expansions, tone, level) {
  const wrap = $('#seOutput');
  if (!expansions.length) {
    wrap.innerHTML = `<div class="se-empty">${t('empty')}</div>`;
    return;
  }
  wrap.innerHTML = expansions.map((r, i) => `
    <div class="se-card">
      <div class="text">${escapeHtml(r)}</div>
      <button class="copy" data-i="${i}" title="${t('copied')}">📋</button>
    </div>
  `).join('');
  wrap.querySelectorAll('.copy').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = +btn.dataset.i;
      copyText(expansions[idx]);
      btn.textContent = '✅';
      setTimeout(() => { btn.textContent = '📋'; }, 1200);
    });
  });
  const summaryFn = t('summary');
  const lvl = getLevelLabel(level);
  if (typeof summaryFn === 'function') {
    $('#seSummary').innerHTML = summaryFn(expansions.length, tone, lvl);
  } else {
    $('#seSummary').innerHTML = `Generated <strong>${expansions.length}</strong> expansions in <strong>${tone}</strong> tone (<strong>${lvl}</strong>).`;
  }
}

function doExpand() {
  const sentence = $('#input').value.trim();
  const tone = $('#toneSel').value;
  const count = parseInt($('#countSel').value, 10);
  const level = parseInt($('#levelSel').value, 10);
  if (!sentence) {
    $('#seOutput').innerHTML = `<div class="se-empty">${t('empty')}</div>`;
    $('#seSummary').innerHTML = '';
    return;
  }
  const expansions = generateExpansions(sentence, count, tone, level);
  render(expansions, tone, level);
}

function loadExample() {
  $('#input').value = 'The team finished the project on time.';
  doExpand();
}

function doClear() {
  $('#input').value = '';
  $('#seOutput').innerHTML = '';
  $('#seSummary').innerHTML = '';
}

// populate tone select
const toneSel = $('#toneSel');
['en', 'zh'].forEach(l => {
  const tones = (GZI18n._data[l] || {}).tones || [];
  if (tones.length) {
    toneSel.innerHTML = tones.map((tone, i) => `<option value="${['Formal','Casual','Academic','Persuasive'][i] || tone}">${tone}</option>`).join('');
  }
});

$('#expandBtn').addEventListener('click', doExpand);
$('#exampleBtn').addEventListener('click', loadExample);
$('#clearBtn').addEventListener('click', doClear);

GZ.renderToolPage({
  category: 'text',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1', 'step2', 'step3', 'step4', 'step5'],
  related: [
    {icon: '✍️', href: '/text/paragraph-rewriter.html', name: 'Paragraph Rewriter'},
    {icon: '🔁', href: '/text/text-paraphraser.html', name: 'Text Paraphraser'},
    {icon: '✂️', href: '/text/sentence-shortener.html', name: 'Sentence Shortener'},
    {icon: '🔁', href: '/text/sentence-rewriter.html', name: 'Sentence Rewriter'},
  ],
});
</script>
