<script>
GZI18n.register({
  en: {
    toolTitle: 'Google Trends URL Builder',
    toolDesc: 'Build a Google Trends comparison URL for up to 5 keywords. Pick date range, country, category and search type — opens trends.google.com with all settings pre-applied.',
    lblKeywords: '🔍 Keywords (1–5)',
    lblAdd: 'Add keyword',
    lblOptions: '⚙️ Options',
    lblDate: 'Date range',
    lblGeo: 'Region',
    lblCat: 'Category',
    lblType: 'Search type',
    lblOpen: 'Open in Google Trends',
    lblCopy: 'Copy URL',
    lblReset: 'Reset',
    kwPlaceholder: 'e.g. chatgpt, claude, gemini',
    btnAdd: '+ Add keyword',
    btnRemove: '✕',
    step1: 'Type up to 5 keywords you want to compare on Google Trends',
    step2: 'Pick date range, country, category and search type',
    step3: 'Copy the URL or click "Open in Google Trends"',
    step4: 'Trends loads instantly with the chart and related queries pre-filled',
    statusReady: 'URL is ready — click "Open in Google Trends" or copy the link',
    statusEmpty: 'Enter at least one keyword to build a URL',
    statusMax: 'Maximum 5 keywords (Google Trends limit)',
    presetTech: 'AI chat: chatgpt vs claude vs gemini',
    presetPw: 'Password managers: 1password vs bitwarden vs lastpass',
    presetSsr: 'JS frameworks: react vs vue vs svelte',
    presetDiet: 'Diet: keto vs paleo vs vegan',
    presetStream: 'Streaming: netflix vs disney+ vs hulu',
    errInvalid: 'Keywords must contain only letters, numbers and spaces',
  },
  zh: {
    toolTitle: 'Google Trends 网址生成器',
    toolDesc: '一键生成 Google Trends 对比 URL，最多 5 个关键词。可选日期范围、国家、类别和搜索类型 — 直接打开 trends.google.com，所有设置已预填。',
    lblKeywords: '🔍 关键词（1–5）',
    lblAdd: '添加关键词',
    lblOptions: '⚙️ 选项',
    lblDate: '日期范围',
    lblGeo: '地区',
    lblCat: '类别',
    lblType: '搜索类型',
    lblOpen: '在 Google Trends 中打开',
    lblCopy: '复制链接',
    lblReset: '重置',
    kwPlaceholder: '例如：chatgpt, claude, gemini',
    btnAdd: '+ 添加关键词',
    btnRemove: '✕',
    step1: '输入最多 5 个要在 Google Trends 上对比的关键词',
    step2: '选择日期范围、国家、类别和搜索类型',
    step3: '复制链接或点击「在 Google Trends 中打开」',
    step4: 'Trends 直接加载图表和相关查询，所有选项已预填',
    statusReady: 'URL 已就绪 — 点击「在 Google Trends 中打开」或复制链接',
    statusEmpty: '请输入至少一个关键词以生成 URL',
    statusMax: '最多 5 个关键词（Google Trends 限制）',
    presetTech: 'AI 聊天：chatgpt vs claude vs gemini',
    presetPw: '密码管理器：1password vs bitwarden vs lastpass',
    presetSsr: 'JS 框架：react vs vue vs svelte',
    presetDiet: '饮食：生酮 vs 旧石器 vs 素食',
    presetStream: '流媒体：netflix vs disney+ vs hulu',
    errInvalid: '关键词只能包含字母、数字和空格',
  }
});

const { $, copyText, t } = GZ;
const PRESETS = [
  ['presetTech',     ['chatgpt', 'claude', 'gemini']],
  ['presetPw',       ['1password', 'bitwarden', 'lastpass']],
  ['presetSsr',      ['react', 'vue', 'svelte']],
  ['presetDiet',     ['keto', 'paleo', 'vegan']],
  ['presetStream',   ['netflix', 'disney+', 'hulu']],
];
const COUNTRIES = ['US','GB','CA','AU','DE','FR','JP','CN','IN','BR','MX','ES','IT','NL','SG','HK','TW','KR','RU'];
let keywords = ['chatgpt', 'claude', 'gemini'];

function renderKwRows() {
  const html = keywords.map((kw, i) =>
    `<div class="gt-kw-row">
       <span class="gt-num">${i+1}</span>
       <input type="text" data-i="${i}" value="${escapeAttr(kw)}" placeholder="${escapeAttr(t('kwPlaceholder'))}" maxlength="80">
       ${i > 0 ? `<button class="gt-x" data-rm="${i}" title="${escapeAttr(t('btnRemove'))}">✕</button>` : ''}
     </div>`
  ).join('');
  $('#kw-rows').innerHTML = html;
  $('#btn-add').disabled = keywords.length >= 5;
  $('#btn-add').style.opacity = keywords.length >= 5 ? '0.4' : '1';
  $('#btn-add').style.cursor = keywords.length >= 5 ? 'not-allowed' : 'pointer';
}

function escapeAttr(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function renderPresets() {
  $('#presets').innerHTML = PRESETS.map(([k, kws]) =>
    `<button class="gt-preset" data-preset="${k}">${escapeAttr(t(k))}</button>`
  ).join('');
}

function buildUrl() {
  const kws = keywords.map(k => k.trim()).filter(Boolean);
  if (!kws.length) return { url: '', empty: true };
  // Validate
  const bad = kws.find(k => !/^[\p{L}\p{N}\s\-+&.'"]+$/u.test(k));
  if (bad) return { url: '', invalid: bad };
  const params = new URLSearchParams();
  kws.forEach(k => params.append('q', k));
  params.set('date', $('#date').value);
  if ($('#geo').value) params.set('geo', $('#geo').value);
  const cat = $('#cat').value;
  if (cat && cat !== '0') params.set('cat', cat);
  const gprop = $('#gprop').value;
  if (gprop) params.set('gprop', gprop);
  return { url: 'https://trends.google.com/trends/explore?' + params.toString(), count: kws.length };
}

function update() {
  const out = buildUrl();
  const $o = $('#output');
  const $s = $('#status');
  if (out.empty) {
    $o.textContent = '';
    $s.textContent = t('statusEmpty');
    $s.style.color = 'var(--text2)';
  } else if (out.invalid) {
    $o.textContent = '';
    $s.textContent = t('errInvalid') + ': ' + out.invalid;
    $s.style.color = 'var(--gz-accent)';
  } else {
    $o.textContent = out.url;
    $s.textContent = (keywords.length >= 5 ? '⚠️ ' + t('statusMax') + ' · ' : '') + t('statusReady') + ' (' + out.count + ')';
    $s.style.color = 'var(--text2)';
  }
}

// Wire presets
$('#presets').addEventListener('click', e => {
  const k = e.target.dataset.preset;
  if (!k) return;
  const preset = PRESETS.find(p => p[0] === k);
  if (preset) { keywords = [...preset[1]]; renderKwRows(); update(); }
});

// Wire keyword rows
$('#kw-rows').addEventListener('input', e => {
  const i = +e.target.dataset.i;
  if (Number.isFinite(i)) { keywords[i] = e.target.value; update(); }
});
$('#kw-rows').addEventListener('click', e => {
  const rm = e.target.dataset.rm;
  if (rm != null) {
    const i = +rm;
    if (i > 0 && i < keywords.length) { keywords.splice(i, 1); renderKwRows(); update(); }
  }
});

// Wire add button
$('#btn-add').addEventListener('click', () => {
  if (keywords.length >= 5) return;
  keywords.push('');
  renderKwRows();
  // focus the new input
  const inputs = document.querySelectorAll('#kw-rows input');
  inputs[inputs.length - 1].focus();
  update();
});

// Wire options
['date','geo','cat','gprop'].forEach(id => $('#' + id).addEventListener('change', update));

// Wire actions
$('#btn-open').addEventListener('click', () => {
  const out = buildUrl();
  if (out.url) window.open(out.url, '_blank', 'noopener');
});
$('#btn-copy').addEventListener('click', () => {
  const url = $('#output').textContent;
  if (url) copyText(url);
});
$('#btn-reset').addEventListener('click', () => {
  keywords = ['', '', ''];
  $('#date').value = 'today 12-m';
  $('#geo').value = '';
  $('#cat').value = '0';
  $('#gprop').value = '';
  renderKwRows();
  update();
});

renderPresets();
renderKwRows();
update();

GZ.renderToolPage({
  category: 'seo',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'📊', href:'/seo/keyword-density.html', name:'Keyword Density'},
    {icon:'🔍', href:'/seo/google-serp-preview.html', name:'Google SERP Preview'},
    {icon:'📋', href:'/seo/meta-tag-generator.html', name:'Meta Tag Generator'},
    {icon:'🤖', href:'/seo/robots-txt-generator.html', name:'Robots.txt Generator'},
  ]
});
</script>
