<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "How do I convert DMS to decimal degrees?", "acceptedAnswer": {"@type": "Answer", "text": "Use the formula: decimal = degrees + minutes/60 + seconds/3600. South latitudes and west longitudes are negative. For example, 40° 26' 46.3\" N becomes 40 + 26/60 + 46.3/3600 = 40.446194."}}, {"@type": "Question", "name": "What is the difference between DMS and decimal degrees?", "acceptedAnswer": {"@type": "Answer", "text": "DMS (degrees, minutes, seconds) splits one degree into 60 minutes and each minute into 60 seconds, like a clock. Decimal degrees express the same angle as a single number with decimals. Maps and GPS devices use decimal degrees; printed charts and older gazetteers often use DMS."}}, {"@type": "Question", "name": "How many decimals do I need for accuracy?", "acceptedAnswer": {"@type": "Answer", "text": "At the equator, 1 decimal place is about 11 km, 4 decimals is about 11 m, and 6 decimals is about 0.11 m — enough for navigation and mapping. 7 decimals gives roughly centimetre precision, which exceeds consumer GPS accuracy."}}, {"@type": "Question", "name": "Does this tool use the WGS84 datum?", "acceptedAnswer": {"@type": "Answer", "text": "The converter changes only the coordinate format, not the datum. Coordinates from GPS, Google Maps, and most web services use WGS84, so converted values stay compatible. No conversion happens in your browser that could alter the datum, and nothing is uploaded to a server."}}]}</script>

<script>
GZI18n.register({
  en: {
    toolTitle: 'Lat Long Converter',
    toolDesc: 'Convert GPS coordinates between DMS (degrees minutes seconds) and decimal degrees — both directions, instantly.',
    modeD2D: 'DMS → Decimal',
    modeDec2D: 'Decimal → DMS',
    lat: 'Latitude', lon: 'Longitude',
    decOut: 'Decimal degrees result', dmsOut: 'DMS result',
    convert: 'Convert', example: 'Example', clear: 'Clear', copy: 'Copy',
    step1: 'Choose the direction: DMS to decimal, or decimal to DMS',
    step2: 'Paste the latitude and longitude values (any common format works: 40°26\'46.3"N, 40 26 46.3 N, or 40.446194)',
    step3: 'Click Convert — invalid input shows a clear error message',
    step4: 'Click Copy to copy the converted coordinates',
    errLat: 'Latitude must be between -90 and 90',
    errLon: 'Longitude must be between -180 and 180',
    errParse: 'Could not parse — use e.g. 40° 26\' 46.3" N or 40 26 46.3 S or -79.982222',
  },
  zh: {
    toolTitle: '经纬度转换工具',
    toolDesc: '在度分秒（DMS）与十进制度之间互转 GPS 坐标，双向转换，即时完成。',
    modeD2D: '度分秒 → 十进制',
    modeDec2D: '十进制 → 度分秒',
    lat: '纬度', lon: '经度',
    decOut: '十进制度结果', dmsOut: '度分秒结果',
    convert: '转换', example: '示例', clear: '清空', copy: '复制',
    step1: '选择方向：度分秒转十进制，或十进制转度分秒',
    step2: '粘贴纬度和经度（支持常见格式：40°26\'46.3"N、40 26 46.3 N 或 40.446194）',
    step3: '点击「转换」，无效输入会显示错误提示',
    step4: '点击「复制」将结果复制到剪贴板',
    errLat: '纬度必须在 -90 到 90 之间',
    errLon: '经度必须在 -180 到 180 之间',
    errParse: '无法解析 — 请使用例如 40° 26\' 46.3" N、40 26 46.3 S 或 -79.982222',
  }
});

const { $, copyText, t } = GZ;
let mode = 'd2d';

function parseAny(s) {
  s = s.trim().replace(/[‘’′`´]/g,"'").replace(/[“”″]/g,'"').replace(/[°º]/g,'°');
  if (!s) return null;
  // hemisphere letters
  let hem = (s.match(/[NSEWnsew]/g) || []).pop();
  let neg = /[SWsw]/.test(hem || '');
  s = s.replace(/[NSEWnsew]/g, ' ');
  const nums = s.match(/-?\d+(\.\d+)?/g);
  if (!nums || nums.length === 0) return null;
  if (nums.length === 1) return parseFloat(nums[0]);
  if (nums.length > 3) return null;
  let v = Math.abs(parseFloat(nums[0]));
  for (let i = 1; i < nums.length; i++) v += parseFloat(nums[i]) / Math.pow(60, i);
  if (parseFloat(nums[0]) < 0) v = -v;
  else if (neg) v = -v;
  return v;
}

function toDms(v, isLat) {
  const hem = isLat ? (v >= 0 ? 'N' : 'S') : (v >= 0 ? 'E' : 'W');
  v = Math.abs(v);
  let d = Math.floor(v), m = Math.floor((v - d) * 60);
  let sec = (v - d - m / 60) * 3600;
  if (sec >= 60) { sec -= 60; m++; } if (m >= 60) { m -= 60; d++; }
  const secStr = sec.toFixed(3).replace(/\.?0+$/, '') || '0';
  return `${d}° ${String(m).padStart(2, '0')}' ${secStr}" ${hem}`;
}

function fmtDec(v) { return (Math.round(v * 1e7) / 1e7).toString(); }

function doConvert() {
  const st = $('#status'); st.textContent = '';
  if (mode === 'd2d') {
    const la = parseAny($('#lat-in').value), lo = parseAny($('#lon-in').value);
    if (la === null || lo === null) { st.innerHTML = `<span style="color:var(--gz-accent)">${t('errParse')}</span>`; return; }
    if (Math.abs(la) > 90) { st.innerHTML = `<span style="color:var(--gz-accent)">${t('errLat')}</span>`; return; }
    if (Math.abs(lo) > 180) { st.innerHTML = `<span style="color:var(--gz-accent)">${t('errLon')}</span>`; return; }
    $('#out-dec').textContent = `${fmtDec(la)}, ${fmtDec(lo)}`;
  } else {
    const la = parseFloat($('#lat-dec').value), lo = parseFloat($('#lon-dec').value);
    if (isNaN(la) || isNaN(lo)) { st.innerHTML = `<span style="color:var(--gz-accent)">${t('errParse')}</span>`; return; }
    if (Math.abs(la) > 90) { st.innerHTML = `<span style="color:var(--gz-accent)">${t('errLat')}</span>`; return; }
    if (Math.abs(lo) > 180) { st.innerHTML = `<span style="color:var(--gz-accent)">${t('errLon')}</span>`; return; }
    $('#out-dms').textContent = `${toDms(la, true)}\n${toDms(lo, false)}`;
  }
}

function setMode(m) {
  mode = m;
  $('#panel-dms2dec').style.display = m === 'd2d' ? '' : 'none';
  $('#panel-dec2dms').style.display = m === 'dec2d' ? '' : 'none';
  $('#btn-d2d').classList.toggle('off', m !== 'd2d');
  $('#btn-dec2d').classList.toggle('off', m !== 'dec2d');
  $('#status').textContent = '';
}

function loadExample() {
  if (mode === 'd2d') { $('#lat-in').value = '40° 26\' 46.3" N'; $('#lon-in').value = '79° 58\' 56" W'; }
  else { $('#lat-dec').value = '48.858370'; $('#lon-dec').value = '2.294481'; }
  doConvert();
}

function doClear() { ['#lat-in','#lon-in','#lat-dec','#lon-dec','#out-dec','#out-dms','#status'].forEach(s => $(s).value ? $(s).value = '' : $(s).textContent = ''); }

$('#mode').innerHTML = `
  <button class="gz-btn" id="btn-d2d" onclick="setMode('d2d')">${t('modeD2D')}</button>
  <button class="gz-btn gz-btn-secondary off" id="btn-dec2d" onclick="setMode('dec2d')">${t('modeDec2D')}</button>`;
$('#lbl-lat').textContent = t('lat'); $('#lbl-lon').textContent = t('lon');
$('#lbl-lat2').textContent = t('lat'); $('#lbl-lon2').textContent = t('lon');
$('#lbl-dec-out').textContent = t('decOut'); $('#lbl-dms-out').textContent = t('dmsOut');
$('#tb1').innerHTML = `<button class="gz-btn" onclick="doConvert()">${t('convert')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="loadExample()">${t('example')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="copyText($('#out-dec').textContent)">${t('copy')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="doClear()">${t('clear')}</button>`;
$('#tb2').innerHTML = `
  <button class="gz-btn" onclick="doConvert()">${t('convert')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="loadExample()">${t('example')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="copyText($('#out-dms').textContent)">${t('copy')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="doClear()">${t('clear')}</button>`;
['#lat-in','#lon-in','#lat-dec','#lon-dec'].forEach(s => $(s).addEventListener('input', doConvert));

GZ.renderToolPage({
  category: 'convert',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'🌐', href:'/dev/coordinates-finder.html', name:'GPS Finder'},
    {icon:'🗺️', href:'/convert/data-storage-converter.html', name:'Unit Converter'},
    {icon:'🧭', href:'/dev/online-compass.html', name:'Compass'},
    {icon:'📍', href:'/dev/ip-geolocation.html', name:'IP Geolocation'},
  ]
});
</script>
