<script>

  zh: {

    toolDesc: '完整希腊字母表：24个大写与小写希腊字母，附名称、发音和常见用途。点击任意字母即可一键复制到剪贴板。',

    gCopied: '已复制',
    gNoRes: '没有匹配的字母',
    step1: '浏览24个希腊字母，或按名称搜索',
    step2: '点击字母卡片复制其符号',
    step3: '用快捷按钮复制整行或常用希腊符号',
    step4: '粘贴到文档、代码、数学作业或社交媒体',
  }
});
const { $, copyText, t } = GZ;
// [lower, upper, name, pron, use-en]
const L = [
['α','Α','alpha','AL-fuh','angle, unit vector'],
['β','Β','beta','BAY-tuh','velocity, coefficient'],
['γ','Γ','gamma','GAM-uh','gamma rays, adiabatic index'],
['δ','Δ','delta','DEL-tuh','change, discriminant'],
['ε','Ε','epsilon','EP-sih-lon','small quantity, permittivity'],
['ζ','Ζ','zeta','ZAY-tuh','Riemann zeta function'],
['η','Η','eta','AY-tuh','efficiency, viscosity'],
['θ','Θ','theta','TAY-tuh','angle, temperature'],
['ι','Ι','iota','eye-OH-tuh','tiny amount'],
['κ','Κ','kappa','KAP-uh','curvature, spring constant'],
['λ','Λ','lambda','LAM-duh','wavelength, eigenvalue'],
['μ','Μ','mu','MOO','micro- prefix, friction, muon'],
['ν','Ν','nu','NOO','frequency, neutrino'],
['ξ','Ξ','xi','KSE (zee)','random variable'],
['ο','Ο','omicron','OM-ih-kron','order of magnitude'],
['π','Π','pi','PIE','3.14159…, product Π'],
['ρ','Ρ','rho','ROH','density, resistivity'],
['σ ς','Σ','sigma','SIG-muh','std. deviation, surface'],
['τ','Τ','tau','TOW','torque, time constant'],
['υ','Υ','upsilon','OO-PSIH-lon','u quark, hypercharge'],
['φ','Φ','phi','FEE (FY)','golden ratio, flux, phase'],
['χ','Χ','chi','KHAI','chi-squared, susceptibility'],
['ψ','Ψ','psi','PSI (SIGH)','wavefunction'],
['ω','Ω','omega','oh-MAY-guh','ohm, angular velocity'],
];
function renderGrid(q) {
  q = (q||'').trim().toLowerCase();
  const rows = L.filter(r => !q || r[2].includes(q) || r[0].includes(q) || r[1].includes(q));
  if (!rows.length) { $('#ggrid').innerHTML = `<div style="opacity:.7">${t('gNoRes')}</div>`; return; }
  $('#ggrid').innerHTML = rows.map(r => {
    const use = GZ.lang === 'zh' ? '' : `<div class="guse">${r[4]}</div>`;
    return `<div class="gcard" onclick="copyLetter('${r[0]} ${r[1]}')"><div class="gsym"><b>${r[0]}</b> &nbsp;${r[1]}</div><div class="gname">${r[2]}</div><div class="gpron">${r[3]}</div>${use}</div>`;
  }).join('');
}
function copyLetter(s) { copyText(s.trim()); $('#gstatus').textContent = `${t('gCopied')}: ${s.trim()}`; }
function copyAll(kind) {
  const s = kind==='lower' ? L.map(r=>r[0].split(' ')[0]).join(' ')
          : kind==='upper' ? L.map(r=>r[1]).join(' ')
          : L.map(r=>r[2]).join(', ');
  copyText(s); $('#gstatus').textContent = `${t('gCopied')}: ${s.length} chars`;
}
$('#gquick').innerHTML = `
  <button class="gz-btn" onclick="copyAll('lower')">${t('gLowerRow')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="copyAll('upper')">${t('gUpperRow')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="copyAll('names')">${t('gNamesRow')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="copyLetter('π Σ Ω Δ θ λ μ φ')">π Σ Ω Δ θ λ μ φ</button>`;
$('#gsearch').placeholder = t('gSearchPh');
$('#gsearch').addEventListener('input', e => renderGrid(e.target.value));
renderGrid('');
