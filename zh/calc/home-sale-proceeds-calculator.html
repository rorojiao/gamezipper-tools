  $('#lbl-afterTax').textContent=t('lblAfterTax');
  $('#bar-title').textContent=t('barTitle');
  $('#h-breakdown').textContent=t('hBreakdown');
  $('#th-item').textContent=t('thItem');
  $('#th-amt').textContent=t('thAmt');
  $('#th-pct').textContent=t('thPct');
}
syncLabels();

const fmt = n => '$' + n.toLocaleString('en-US',{maximumFractionDigits:0});
const fmt2 = n => '$' + n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

function calc(){
  const sale = +$('#salePrice').value || 0;
  const orig = +$('#originalCost').value || 0;
  const impr = +$('#improvements').value || 0;
  const years = +$('#yearsOwned').value || 0;
  const loan1 = +$('#loanBalance').value || 0;
  const loan2 = +$('#secondLoan').value || 0;
  const liens = +$('#otherLiens').value || 0;
  const listPct = +$('#listingPct').value || 0;
  const buyerPct = +$('#buyerPct').value || 0;
  const closePct = +$('#closingPct').value || 0;
  const conc = +$('#concessions').value || 0;
  const rep = +$('#repairs').value || 0;
  const stage = +$('#staging').value || 0;
  const filing = $('#filingStatus').value;
  const taxRate = +$('#income').value;

  const listFee = sale * (listPct/100);
  const buyerFee = sale * (buyerPct/100);
  const closeFee = sale * (closePct/100);
  const mortgage = loan1 + loan2 + liens;
  const extras = rep + stage;
  const totalCosts = mortgage + listFee + buyerFee + closeFee + conc + extras;

  // Cost basis
  const basis = orig + impr;
  const gain = Math.max(0, sale - basis);
  // Section 121 exclusion (2 of 5 years rule, simplified)
  const qualifies = years >= 2;
  const exclusion = qualifies ? (filing === 'married' ? 500000 : 250000) : 0;
  const taxableGain = Math.max(0, gain - exclusion);
  const fedTax = taxableGain * taxRate;

  const netBeforeTax = sale - totalCosts;
  const netAfterTax = netBeforeTax - fedTax;

  $('#m-net').textContent = fmt(netBeforeTax);
  $('#m-gross').textContent = fmt(sale);
  $('#m-costs').textContent = fmt(totalCosts);
  $('#m-capgain').textContent = fmt(taxableGain);
  $('#m-tax').textContent = fmt(fedTax);
  $('#m-afterTax').textContent = fmt(netAfterTax);

  // Bar
  const segs = [
    {name:t('segNet'), val:Math.max(netBeforeTax,0), color:'#10b981', hide:netBeforeTax<=0},
    {name:t('segLoan'), val:mortgage, color:'#ef4444'},
    {name:t('segList'), val:listFee, color:'#f59e0b'},
    {name:t('segBuyer'), val:buyerFee, color:'#f97316'},
    {name:t('segClose'), val:closeFee, color:'#3b82f6'},
    {name:t('segConc'), val:conc, color:'#8b5cf6', hide:conc<10},
    {name:t('segRep'), val:extras, color:'#ec4899', hide:extras<10},
  ];
  const sumSeg = sale || 1;
  const bar = $('#bar'); bar.innerHTML = '';
  const leg = $('#legend'); leg.innerHTML = '';
  segs.forEach(s=>{
    if(s.hide) return;
    const pct = (s.val/sumSeg)*100;
    if(pct<0.5) return;
    const seg = document.createElement('div');
    seg.className='hsp-bar-seg';
    seg.style.width = pct+'%';
    seg.style.background = s.color;
    seg.textContent = pct>6 ? (pct.toFixed(0)+'%') : '';
    bar.appendChild(seg);
    leg.innerHTML += '<span><i style="background:'+s.color+'"></i>'+s.name+': '+fmt(s.val)+'</span>';
  });

  // Table
  const tbody = $('#tbody'); tbody.innerHTML = '';
  const rows = [
    {name:t('segNet'), val:netBeforeTax, pct:(netBeforeTax/sale)*100, pos:netBeforeTax>=0, final:false},
    {name:t('segLoan'), val:mortgage, pct:(mortgage/sale)*100},
    {name:t('segList'), val:listFee, pct:(listFee/sale)*100},
    {name:t('segBuyer'), val:buyerFee, pct:(buyerFee/sale)*100},
    {name:t('segClose'), val:closeFee, pct:(closeFee/sale)*100},
    {name:t('segConc'), val:conc, pct:(conc/sale)*100},
    {name:t('segRep'), val:extras, pct:(extras/sale)*100},
  ];
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    if(r.pos) tr.classList.add('positive');
    tr.innerHTML = '<td>'+r.name+'</td><td>'+fmt(r.val)+'</td><td>'+r.pct.toFixed(1)+'%</td>';
    tbody.appendChild(tr);
  });
  const trTotal = document.createElement('tr');
  trTotal.className = 'net';
  trTotal.innerHTML = '<td>Total sale price</td><td>'+fmt(sale)+'</td><td>100.0%</td>';
  tbody.appendChild(trTotal);

  // Tip
  $('#tip').innerHTML = '<b>'+t('tipTitle')+'</b><br>'+t('tip1')+'<br>'+t('tip2')+'<br>'+t('tip3');

  $('#results').style.display = 'block';
}

$('#btnCalc').addEventListener('click', calc);
$('#btnReset').addEventListener('click', ()=>{
  $('#salePrice').value=525000; $('#originalCost').value=350000; $('#improvements').value=28000; $('#yearsOwned').value=8;
  $('#loanBalance').value=285000; $('#secondLoan').value=0; $('#otherLiens').value=0;
  $('#listingPct').value=2.5; $('#buyerPct').value=2.5; $('#closingPct').value=1.5; $('#concessions').value=3000;
  $('#repairs').value=4500; $('#staging').value=1500;
  $('#filingStatus').value='single'; $('#income').value=0.15;
  $('#results').style.display='none';
});
$('#btnFill').addEventListener('click', ()=>{
  $('#salePrice').value=485000; $('#originalCost').value=325000; $('#improvements').value=32000; $('#yearsOwned').value=10;
  $('#loanBalance').value=240000; $('#listingPct').value=2.5; $('#buyerPct').value=2.5; $('#closingPct').value=1.5;
  $('#filingStatus').value='married'; calc();
});

});
</script>
