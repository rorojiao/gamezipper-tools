const themes = ['cat','dog','programmer','food','work','love','coffee','tech','sports'];
let currentTheme = 'random';
let lastIdx = -1;

function pick(arr, prevIdx) {
  let i;
  let tries = 0;
  do { i = Math.floor(Math.random() * arr.length); tries++; } while (i === prevIdx && arr.length > 1 && tries < 6);
  return i;
}

function buildLimerick(themeKey) {
  const pool = themeKey === 'random' ? POOLS[themes[Math.floor(Math.random() * themes.length)]] : POOLS[themeKey];
  if (!pool) return null;
  const ai = pick(pool.a, lastIdx); lastIdx = ai;
  const bi = pick(pool.b, -1);
  const ci = pick(pool.b, bi);
  const closeI = pick(pool.close, -1);
  return {
    lines: [
      { cls: 'A', text: pool.a[ai] },
      { cls: 'A', text: pool.b[bi] },
      { cls: 'B', text: pool.b[ci] },
      { cls: 'B', text: pool.b[Math.random() < 0.5 ? bi : ci] },
      { cls: 'A', text: pool.close[closeI] },
    ],
    pool
  };
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render(lim) {
  const html = lim.lines.map(l => `<span class="lim-line ${l.cls}">${escapeHtml(l.text)}</span>`).join('');
  $('#stage').innerHTML = html;
  $('#scheme').textContent = `${t('schemeLabel')} • ${lim.pool.icon} ${lim.pool.en}`;
  const cnt = parseInt(localStorage.getItem('gz_limerick_count') || '0', 10) + 1;
  localStorage.setItem('gz_limerick_count', cnt);
  $('#count').textContent = `Generated: ${cnt}`;
  lastLim = lim;
}

let lastLim = null;

function generate() {
  const lim = buildLimerick(currentTheme);
  if (!lim) { $('#stage').innerHTML = '<span style="opacity:.6">No themes available.</span>'; return; }
  render(lim);
  $('#status').innerHTML = '';
}

function setTheme(k) {
  currentTheme = k;
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.k === k));
  generate();
}

function buildThemes() {
  const all = [{ k: 'random', ic: '🎲', en: 'Random', zh: '随机' }, ...themes.map(k => ({ k, ic: POOLS[k].icon, en: POOLS[k].en, zh: POOLS[k].zh }))];
  const lang = (document.documentElement.lang === 'zh' || (navigator.language || '').startsWith('zh')) ? 'zh' : 'en';
  const html = all.map(t => `<button class="theme-btn" data-k="${t.k}"><span class="ic">${t.ic}</span><span>${escapeHtml(t[lang])}</span></button>`).join('');
  $('#themes').innerHTML = html;
  document.querySelectorAll('.theme-btn').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.k)));
  document.querySelector('.theme-btn[data-k="random"]').classList.add('active');
}

$('#actions').innerHTML = `
  <button class="gz-btn" onclick="generate()">${t('generate')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="copyText(lastLim ? lastLim.lines.map(l=>l.text).join('\\n') : ''); document.getElementById('status').innerHTML='<span style=color:var(--gz-success,#00d672)>'+t('copied')+'</span>';">${t('copy')}</button>`;

buildThemes();
