<script>
var { $, copyText, t } = GZ;

function parseDec(s){
  if(!/^\d*\.?\d*$/.test(s) || s==='' || s==='.') return null;
  var dot=s.indexOf('.');
  var frac = dot<0 ? 0 : s.length-dot-1;
  var digits=(dot<0?s:s.replace('.','')).replace(/^0+(?=\d)/,'');
  return {digits:digits, frac:frac, val:parseFloat(s)};
}

// classic long division on integer strings; one quotient digit per brought-down digit
// returns rows, quotient digit array ('int' slots then 'dec' slots), integer remainder, decimal remainder
function longDiv(divDigits, divNum, maxExtra){
  var rows=[], cur=0n, q=[], brought=0, step=0, extra=0, remInt=0n, done=false;
  while(!done){
    var bring;
    if(brought<divDigits.length){ bring=BigInt(+divDigits[brought]); q.push('int'); }
    else if(extra<maxExtra){ bring=0n; extra++; q.push('dec'); }
    else { done=true; break; }
    var curBefore=cur*10n+bring;
    var qd=curBefore/divNum;
    var prod=qd*divNum;
    var rem=curBefore-prod;
    step++;
    rows.push({step:step,bring:brought<divDigits.length?divDigits[brought]:'0',cur:curBefore.toString(),qd:qd.toString(),prod:prod.toString(),rem:rem.toString()});
    q[q.length-1]=qd.toString();
    if(brought===divDigits.length-1)remInt=rem;
    cur=rem; brought++;
    if(rem===0n&&brought>=divDigits.length)done=true;
  }
  return {rows:rows,q:q,remInt:remInt,remEnd:cur};
}

function run(){
  var o=$('#out');
  var ds=$('#dividend').value.trim(), vs=$('#divisor').value.trim();
  if(!ds||!vs){o.className='ld-out show';o.innerHTML='<div class="ld-err">'+t('errEmpty')+'</div>';return;}
  var D=parseDec(ds), V=parseDec(vs);
  if(!D||!V){o.className='ld-out show';o.innerHTML='<div class="ld-err">'+t('errNum')+'</div>';return;}
  if(V.val===0){o.className='ld-out show';o.innerHTML='<div class="ld-err">'+t('errZero')+'</div>';return;}
  // scale both by 10^k so both become integers
  var k=Math.max(D.frac,V.frac);
  var dStr=D.digits+'0'.repeat(k-D.frac);
  var vStr=V.digits+'0'.repeat(k-V.frac);
  var divNum=BigInt(vStr);
  var intLen=dStr.length;
  var res=longDiv(dStr,divNum,10);
  // both operands scaled by the SAME 10^k, so the quotient is unchanged:
  // integer slots = one per dividend digit, then decimal slots
  var intPart='',decPart='';
  for(var i=0;i<res.q.length;i++){
    if(i<intLen)intPart+=res.q[i];else decPart+=res.q[i];
  }
  intPart=intPart.replace(/^0+(?=\d)/,'');
  if(intPart==='')intPart='0';
  var qStr=intPart+(decPart?'.'+decPart:'');
  qStr=qStr.replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,'');
  if(qStr==='')qStr='0';
  // exact when the decimal expansion terminates (remEnd==0)
  var exact=(res.remEnd===0n);
  var remDisp=fmtScaled(res.remInt.toString(),k);
  // verify identity (integer quotient): intQ x divisor + remainder = dividend
  var verify=BigInt(intPart||'0')*divNum+res.remInt;
  var vDisp=fmtScaled(verify.toString(),k);
  var h='<div class="ld-big">'+ds+' ÷ '+vs+' = <span class="ld-hl">'+qStr+'</span>'+(exact?' <span style="font-size:.85rem;opacity:.75">('+t('rExact')+')</span>':'')+'</div>';
  if(!exact)h+='<div class="ld-big" style="font-size:1.05rem">'+t('rRem')+': <span class="ld-hl">'+remDisp+'</span> &nbsp;·&nbsp; '+t('rDec')+': '+qStr+'</div>';
  h+='<div style="margin-top:8px"><button class="gz-btn" id="ldCopy">'+t('copy')+'</button></div>';
  h+='<table class="ld-tbl"><thead><tr><th>'+t('tblStep')+'</th><th>'+t('tblBring')+'</th><th>'+t('tblCur')+'</th><th>'+t('tblQ')+'</th><th>'+t('tblProd')+'</th><th>'+t('tblSub')+'</th><th>'+t('tblNew')+'</th></tr></thead><tbody>';
  res.rows.forEach(function(r){h+='<tr><td>'+r.step+'</td><td>'+r.bring+'</td><td>'+r.cur+'</td><td>'+r.qd+'</td><td>'+r.prod+'</td><td>−</td><td>'+r.rem+'</td></tr>';});
  h+='<tr class="fin"><td colspan="6">'+t('rVerify')+'</td><td>'+vDisp+'</td></tr>';
  h+='</tbody></table><div class="ld-note">'+t('noteSteps')+'</div>';
  o.className='ld-out show';o.innerHTML=h;
  $('#ldCopy').onclick=function(){copyText(ds+' ÷ '+vs+' = '+qStr+(exact?'':', '+t('rRem')+' '+remDisp),this);};
}

function fmtScaled(s,k){
  if(k===0)return s;
  while(s.length<=k)s='0'+s;
  s=s.slice(0,s.length-k)+'.'+s.slice(s.length-k);
  return s.replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,'');
}

$('#btnCalc').textContent=t('btnCalc');
$('#btnSample').textContent=t('sample');
$('#btnCalc').onclick=run;
$('#btnSample').onclick=function(){$('#dividend').value='5678';$('#divisor').value='123';run();};
$('#dividend').addEventListener('keydown',function(e){if(e.key==='Enter')run();});
$('#divisor').addEventListener('keydown',function(e){if(e.key==='Enter')run();});

});
</script>
