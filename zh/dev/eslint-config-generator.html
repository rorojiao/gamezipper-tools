<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is ESLint flat config?","acceptedAnswer":{"@type":"Answer","text":"Flat config (eslint.config.js) is the modern ESLint configuration format introduced in v8.23 and made the default in ESLint v9. Instead of layered .eslintrc files with extends and env, you export an array of config objects that each declare files, plugins, languageOptions and rules. The generator produces this format by default and can also emit the legacy .eslintrc.json."}},{"@type":"Question","name":"Should I use flat config or .eslintrc.json?","acceptedAnswer":{"@type":"Answer","text":"Use flat config if you run ESLint 9 or newer — new projects should not adopt the legacy format. Use .eslintrc.json only when your project is pinned to ESLint 8 or an older toolchain that cannot read eslint.config.js yet."}},{"@type":"Question","name":"How do I combine ESLint with Prettier?","acceptedAnswer":{"@type":"Answer","text":"Enable the Prettier option in the generator. It adds eslint-config-prettier so formatting rules stop fighting Prettier, and eslint-plugin-prettier so Prettier violations surface as ESLint errors. In flat config this is a single prettier config object at the end of the array."}},{"@type":"Question","name":"What is type-aware linting in typescript-eslint?","acceptedAnswer":{"@type":"Answer","text":"Type-aware rules read your tsconfig.json so ESLint can use the TypeScript compiler for checks like strict-boolean-expressions or no-unsafe-assignment. They are more powerful but slower. Enable the type-aware option and the generator wires projectService to your tsconfig."}},{"@type":"Question","name":"Is my project configuration uploaded anywhere?","acceptedAnswer":{"@type":"Answer","text":"No. The generator runs entirely in your browser. Your stack choices never leave your machine and the output is plain text you can copy or download."}}]}</script>

<script>
GZI18n.register({
  en: {
    toolTitle: 'ESLint Config Generator',
    toolDesc: 'Build an eslint.config.js (flat config) or legacy .eslintrc.json for your stack — pick frameworks, Prettier and TypeScript options, copy or download.',
    fmtFlat: 'Flat config (ESLint 9)', fmtLegacy: 'Legacy .eslintrc.json',
    sVanilla: 'Vanilla JS', sReact: 'React', sNext: 'Next.js', sVue: 'Vue', sSvelte: 'Svelte', sNode: 'Node.js',
    optTs: 'TypeScript', optPrettier: 'Prettier', optTypeAware: 'Type-aware rules', optA11y: 'jsx-a11y (React)',
    outLabel: 'Generated config',
    copy: 'Copy', download: 'Download config',
    note: 'Install the packages listed in the config header, then save the file as eslint.config.js (or .eslintrc.json for legacy mode) at your project root.',
    step1: 'Choose flat config (ESLint 9) or the legacy .eslintrc.json format',
    step2: 'Pick your stack: Vanilla, React, Next.js, Vue, Svelte or Node.js',
    step3: 'Toggle TypeScript, Prettier, type-aware rules and accessibility linting',
    step4: 'Copy the config or download it, then install the listed packages',
  },
  zh: {
    toolTitle: 'ESLint 配置生成器',
    toolDesc: '为你的技术栈生成 eslint.config.js（扁平配置）或旧版 .eslintrc.json — 选择框架、Prettier 与 TypeScript 选项，一键复制或下载。',
    fmtFlat: '扁平配置（ESLint 9）', fmtLegacy: '旧版 .eslintrc.json',
    sVanilla: '原生 JS', sReact: 'React', sNext: 'Next.js', sVue: 'Vue', sSvelte: 'Svelte', sNode: 'Node.js',
    optTs: 'TypeScript', optPrettier: 'Prettier', optTypeAware: '类型感知规则', optA11y: 'jsx-a11y（React）',
    outLabel: '生成的配置',
    copy: '复制', download: '下载配置',
    note: '按配置头部注释安装依赖，然后把文件保存为项目根目录下的 eslint.config.js（旧版模式为 .eslintrc.json）。',
    step1: '选择扁平配置（ESLint 9）或旧版 .eslintrc.json 格式',
    step2: '选择技术栈：原生、React、Next.js、Vue、Svelte 或 Node.js',
    step3: '开关 TypeScript、Prettier、类型感知规则与可访问性检查',
    step4: '复制或下载配置，并安装列出的依赖包',
  }
});

const { $, copyText, t } = GZ;
let fmt = 'flat';
const stack = { vanilla: true, react: false, next: false, vue: false, svelte: false, node: false };
const opt = { ts: false, prettier: false, typeAware: false, a11y: false };
let rawText = '';

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
const c = s => `<span class="es-cmt">// ${esc(s)}</span>`;

function renderFmt() {
  $('#fmt').innerHTML = `<button class="es-tab${fmt==='flat'?' on':''}" onclick="setFmt('flat')">${t('fmtFlat')}</button>
    <button class="es-tab${fmt==='legacy'?' on':''}" onclick="setFmt('legacy')">${t('fmtLegacy')}</button>`;
}
function renderStacks() {
  $('#stacks').innerHTML = Object.keys(stack).map(k =>
    `<button class="es-chip${stack[k]?' on':''}" onclick="toggleStack('${k}')">${t('s'+k[0].toUpperCase()+k.slice(1))}</button>`).join('');
}
function renderOpts() {
  $('#opts').innerHTML = `
    <label><input type="checkbox" ${opt.ts?'checked':''} onchange="opt.ts=this.checked;gen()">${t('optTs')}</label>
    <label><input type="checkbox" ${opt.prettier?'checked':''} onchange="opt.prettier=this.checked;gen()">${t('optPrettier')}</label>
    <label><input type="checkbox" ${opt.typeAware?'checked':''} onchange="opt.typeAware=this.checked;gen()">${t('optTypeAware')}</label>
    <label><input type="checkbox" ${opt.a11y?'checked':''} onchange="opt.a11y=this.checked;gen()">${t('optA11y')}</label>`;
}
function renderToolbar() {
  $('#toolbar').innerHTML = `<button class="gz-btn" onclick="copyText(rawText)">${t('copy')}</button>
    <button class="gz-btn gz-btn-secondary" onclick="dl()">${t('download')}</button>`;
}
function setFmt(f) { fmt = f; renderFmt(); gen(); }
function toggleStack(k) {
  stack[k] = !stack[k];
  if (k === 'react' && stack[k]) stack.vanilla = false;
  if (k === 'next' && stack[k]) { stack.vanilla = false; stack.react = true; }
  if (!stack.vanilla && !stack.react && !stack.next && !stack.vue && !stack.svelte && !stack.node) stack.vanilla = true;
  renderStacks(); gen();
}

function gen() {
  const L = [];
  const pkgs = [];
  if (opt.ts) pkgs.push('typescript', '@eslint/js');
  else pkgs.push('@eslint/js');
  if (stack.react || stack.next) pkgs.push('eslint-plugin-react', 'eslint-plugin-react-hooks');
  if (stack.next) pkgs.push('@next/eslint-plugin-next');
  if (stack.vue) pkgs.push('eslint-plugin-vue');
  if (stack.svelte) pkgs.push('eslint-plugin-svelte');
  if (opt.ts) pkgs.push('typescript-eslint');
  if (opt.prettier) pkgs.push('eslint-config-prettier', 'eslint-plugin-prettier');
  if (opt.a11y) pkgs.push('eslint-plugin-jsx-a11y');

  if (fmt === 'flat') {
    L.push(c(`npm i -D ${pkgs.join(' ')}`));
    L.push(c('eslint.config.js — ESLint 9 flat config'));
    L.push("import js from '@eslint/js';");
    if (opt.ts) L.push("import tseslint from 'typescript-eslint';");
    if (stack.react || stack.next) { L.push("import react from 'eslint-plugin-react';"); L.push("import reactHooks from 'eslint-plugin-react-hooks';"); }
    if (stack.next) L.push("import nextPlugin from '@next/eslint-plugin-next';");
    if (stack.vue) L.push("import pluginVue from 'eslint-plugin-vue';");
    if (stack.svelte) { L.push("import svelte from 'eslint-plugin-svelte';"); }
    if (opt.prettier) { L.push("import prettier from 'eslint-plugin-prettier/recommended';"); }
    L.push('');
    L.push(opt.ts ? 'export default tseslint.config(' : 'export default [');
    L.push('  { ignores: ["dist/**", "node_modules/**", "coverage/**"] },');
    L.push('  js.configs.recommended,');
    if (opt.ts) L.push(opt.typeAware ? "  ...tseslint.configs.recommendedTypeChecked," : "  ...tseslint.configs.recommended,");
    if (stack.vue) L.push('  ...pluginVue.configs["flat/recommended"],');
    if (stack.svelte) L.push('  ...svelte.configs["flat/recommended"],');
    if (stack.react || stack.next) {
      L.push('  {');
      L.push("    files: ['**/*.{js,jsx,ts,tsx}'],");
      L.push("    plugins: { react, 'react-hooks': reactHooks" + (stack.next ? ", '@next/next': nextPlugin" : '') + ' },');
      L.push("    languageOptions: { parserOptions: { ecmaFeatures: { jsx: true } } },");
      L.push("    settings: { react: { version: 'detect' } },");
      L.push("    rules: { ...react.configs.recommended.rules, ...react.configs['jsx-runtime'].rules, ...reactHooks.configs.recommended.rules" + (stack.next ? ", ...nextPlugin.configs.recommended.rules" : '') + ' },');
      L.push('  },');
    }
    if (opt.a11y) L.push("  // add: import jsxA11y from 'eslint-plugin-jsx-a11y'; then jsxA11y.flatConfigs.recommended");
    if (opt.ts && opt.typeAware) {
      L.push('  {');
      L.push("    files: ['**/*.{ts,tsx}'],");
      L.push("    languageOptions: { parserOptions: { projectService: true, tsconfigRootDir: import.meta.dirname } },");
      L.push('  },');
    }
    if (stack.node) {
      L.push('  {');
      L.push("    files: ['**/*.js', 'scripts/**'],");
      L.push("    languageOptions: { sourceType: 'commonjs', globals: { require: 'readonly', module: 'writable', process: 'readonly', __dirname: 'readonly', console: 'readonly' } },");
      L.push('  },');
    }
    L.push('  {');
    L.push('    rules: {');
    L.push("      'no-console': 'warn',");
    L.push("      '@typescript-eslint/no-unused-vars': ['error', { argsIgnorePattern: '^_' }],");
    L.push('    },');
    L.push('  },');
    if (opt.prettier) L.push('  prettier,');
    L.push(opt.ts ? ');' : '];');
  } else {
    L.push(c(`npm i -D ${pkgs.join(' ')}`));
    L.push(c('.eslintrc.json — legacy format (ESLint 8 and older)'));
    L.push('{');
    L.push('  "root": true,');
    L.push('  "env": { "browser": true, "es2022": true' + (stack.node ? ', "node": true' : '') + ' },');
    L.push('  "parserOptions": { "ecmaVersion": "latest", "sourceType": "module"' + (stack.react || stack.next ? ', "ecmaFeatures": { "jsx": true }' : '') + ' },');
    const exts = ['eslint:recommended'];
    if (opt.ts) exts.push('plugin:@typescript-eslint/recommended');
    if (opt.ts && opt.typeAware) exts.push('plugin:@typescript-eslint/recommended-type-checked');
    if (stack.react) exts.push('plugin:react/recommended', 'plugin:react/jsx-runtime', 'plugin:react-hooks/recommended');
    if (stack.next) exts.push('plugin:@next/next/recommended');
    if (stack.vue) exts.push('plugin:vue/vue3-recommended');
    if (stack.svelte) exts.push('plugin:svelte/recommended');
    if (opt.a11y) exts.push('plugin:jsx-a11y/recommended');
    if (opt.prettier) exts.push('prettier');
    L.push('  "extends": ' + JSON.stringify(exts, null, 2).replace(/\n/g, '\n  ').replace(/\n\s+$/, '') + ',');
    L.push('  "plugins": ' + JSON.stringify(((stack.react || stack.next) ? ['react', 'react-hooks'] : []).concat(opt.prettier ? ['prettier'] : [])) + ',');
    L.push('  "settings": { "react": { "version": "detect" } },');
    L.push('  "rules": { "no-console": "warn"' + (opt.prettier ? ', "prettier/prettier": "error"' : '') + ' }');
    L.push('}');
  }
  rawText = L.map(l => l.replace(/<span class="es-cmt">\/\/ (.*?)<\/span>/g, '$1')).join('\n').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
  $('#out').innerHTML = L.join('\n');
}

function dl() {
  const name = fmt === 'flat' ? 'eslint.config.js' : '.eslintrc.json';
  const blob = new Blob([rawText], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

renderFmt(); renderStacks(); renderOpts(); renderToolbar(); gen();
$('#lbl-out').textContent = t('outLabel');
$('#note').textContent = t('note');

GZ.renderToolPage({
  category: 'dev',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],
  related: [
    {icon:'⚙️', href:'/dev/tsconfig-generator.html', name:'TSConfig Generator'},
    {icon:'🧹', href:'/dev/js-formatter.html', name:'JS Formatter'},
    {icon:'📝', href:'/dev/editorconfig-generator.html', name:'EditorConfig Generator'},
    {icon:'🔍', href:'/dev/javascript-validator.html', name:'JS Validator'},
  ]
});
</script>
