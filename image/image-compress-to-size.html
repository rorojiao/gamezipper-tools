<script>
GZI18n.register({
  en: {
    toolTitle: 'Compress Image to Specific Size',
    toolDesc: 'Compress any JPG, PNG or WebP to an exact KB target — 20KB, 50KB, 100KB, 200KB or custom. Auto-tunes quality and resize to hit your target. 100% browser, no upload.',
    lblTarget: 'Target size (KB)', lblMaxWidth: 'Max width (px)',
    dropText: 'Drop an image or click to upload',
    compress: '🎯 Compress to target', reset: '🔄 Reset',
    lblOrig: 'Original', lblCompressed: 'Compressed', lblSaved: 'Saved', lblQuality: 'Quality used',
    noImage: 'Please drop or upload an image first.',
    noTarget: 'Pick a target size first.',
    overTarget: 'Cannot hit target — image is too small or simple. Returning best result.',
    origMeta: (w, h, sz) => `${w}×${h} · ${sz}`,
    step1: 'Drop or upload your JPG, PNG or WebP image', step2: 'Pick a preset size (20KB, 50KB, 100KB, 200KB, 500KB or 1MB) or enter a custom KB value', step3: 'Click "Compress to target" — the tool will auto-tune quality and dimensions', step4: 'Compare the original and compressed previews, then click Download',
    download: '⬇️ Download',
  },
  zh: {
    toolTitle: '图片压缩到指定大小',
    toolDesc: '将任意 JPG、PNG 或 WebP 图片压缩到指定 KB 大小 — 20KB、50KB、100KB、200KB 或自定义。自动调整质量和尺寸，100% 浏览器本地运行，不上传。',
    lblTarget: '目标大小（KB）', lblMaxWidth: '最大宽度（像素）',
    dropText: '拖放图片到此处或点击上传',
    compress: '🎯 压缩到目标', reset: '🔄 重置',
    lblOrig: '原始', lblCompressed: '压缩后', lblSaved: '节省', lblQuality: '使用质量',
    noImage: '请先上传或拖放一张图片。',
    noTarget: '请先选择目标大小。',
    overTarget: '无法达到目标 — 图片太小或太简单，已返回最佳结果。',
    origMeta: (w, h, sz) => `${w}×${h} · ${sz}`,
    step1: '拖放或上传 JPG、PNG、WebP 图片', step2: '选择预设大小（20KB、50KB、100KB、200KB、500KB、1MB）或输入自定义 KB 值', step3: '点击「压缩到目标」— 工具会自动调整质量和尺寸', step4: '对比原始和压缩预览，然后点击下载',
    download: '�️ 下载',
  }
});

const { $, t } = GZ;

let origFile = null;
let origImageData = null;
let outputBlob = null;
let outputName = '';

function fmtBytes(b) {
  if (b > 1048576) return (b / 1048576).toFixed(2) + ' MB';
  if (b > 1024) return (b / 1024).toFixed(1) + ' KB';
  return b + ' B';
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => resolve({ dataUrl: e.target.result, img, width: img.width, height: img.height, size: file.size });
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function canvasToBlob(canvas, quality) {
  return new Promise(resolve => {
    canvas.toBlob(blob => resolve(blob), 'image/jpeg', quality);
  });
}

async function compressToTarget(srcImg, targetBytes, maxWidth) {
  let w = srcImg.width;
  let h = srcImg.height;

  // Apply maxWidth ceiling
  if (maxWidth > 0 && w > maxWidth) {
    const scale = maxWidth / w;
    w = maxWidth;
    h = Math.round(h * scale);
  }

  let q = 0.92;
  let blob = null;
  let iterations = 0;
  let bestBlob = null;
  let bestDiff = Infinity;

  while (iterations < 12) {
    iterations++;
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(srcImg, 0, 0, w, h);
    blob = await canvasToBlob(c, q);

    if (!blob) break;
    const diff = Math.abs(blob.size - targetBytes);
    if (diff < bestDiff) {
      bestDiff = diff;
      bestBlob = blob;
      bestBlob._q = q;
      bestBlob._w = w;
      bestBlob._h = h;
    }

    if (blob.size <= targetBytes) {
      return { blob, quality: q, width: w, height: h, hit: true, iterations };
    }
    // Reduce quality
    q -= 0.08;
    if (q < 0.2) {
      // Drop dimensions instead
      q = 0.85;
      w = Math.round(w * 0.85);
      h = Math.round(h * 0.85);
      if (w < 50 || h < 50) break;
    }
  }
  return { blob: bestBlob, quality: bestBlob._q, width: bestBlob._w, height: bestBlob._h, hit: false, iterations };
}

function loadFile(file) {
  if (!file) return;
  if (!file.type.match(/image\/(jpeg|png|webp)/)) return;
  origFile = file;
  outputBlob = null;
  $('#dlBtn').style.display = 'none';
  $('#stats').style.display = 'none';
  $('#preview').style.display = 'none';

  loadImage(file).then(data => {
    origImageData = data;
    const url = URL.createObjectURL(file);
    $('#imgOrig').src = url;
    const metaFn = t('origMeta');
    if (typeof metaFn === 'function') {
      $('#origMeta').textContent = metaFn(data.width, data.height, fmtBytes(data.size));
    } else {
      $('#origMeta').textContent = `${data.width}×${data.height} · ${fmtBytes(data.size)}`;
    }
    $('#preview').style.display = 'grid';
    $('#stats').style.display = 'grid';
    $('#statOrig').textContent = fmtBytes(data.size);
    $('#statOut').textContent = '—';
    $('#statSaved').textContent = '—';
    $('#statQ').textContent = '—';
  });
}

async function doCompress() {
  if (!origImageData) { alert(t('noImage')); return; }
  const targetKB = parseInt($('#targetKB').value, 10);
  if (!targetKB || targetKB < 5) { alert(t('noTarget')); return; }
  const maxWidth = parseInt($('#maxWidth').value, 10);
  const targetBytes = targetKB * 1024;

  $('#compressBtn').disabled = true;
  $('#compressBtn').textContent = '⏳ Working…';

  try {
    const res = await compressToTarget(origImageData.img, targetBytes, maxWidth);
    if (!res.blob) {
      alert(t('noTarget'));
      return;
    }
    outputBlob = res.blob;
    outputName = origFile.name.replace(/\.[^.]+$/, '') + '_' + targetKB + 'kb.jpg';
    const url = URL.createObjectURL(res.blob);
    $('#imgOut').src = url;
    const metaFn = t('origMeta');
    if (typeof metaFn === 'function') {
      $('#outMeta').textContent = metaFn(res.width, res.height, fmtBytes(res.blob.size));
    } else {
      $('#outMeta').textContent = `${res.width}×${res.height} · ${fmtBytes(res.blob.size)}`;
    }

    const saved = origFile.size - res.blob.size;
    const pct = origFile.size > 0 ? ((saved / origFile.size) * 100).toFixed(1) : '0';
    $('#statOut').textContent = fmtBytes(res.blob.size);
    $('#statSaved').textContent = (saved > 0 ? '+' : '') + pct + '%';
    $('#statSaved').style.color = saved > 0 ? 'var(--success, #00d672)' : '#e94560';
    $('#statQ').textContent = Math.round(res.quality * 100) + '%';
    if (!res.hit) {
      $('#statOut').style.color = '#e94560';
    } else {
      $('#statOut').style.color = 'var(--success, #00d672)';
    }
    $('#dlBtn').style.display = 'inline-block';
  } finally {
    $('#compressBtn').disabled = false;
    $('#compressBtn').textContent = t('compress');
  }
}

function download() {
  if (!outputBlob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(outputBlob);
  a.download = outputName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function reset() {
  origFile = null;
  origImageData = null;
  outputBlob = null;
  $('#fileIn').value = '';
  $('#preview').style.display = 'none';
  $('#stats').style.display = 'none';
  $('#dlBtn').style.display = 'none';
}

// Wire up
const dz = $('#dropzone');
const fi = $('#fileIn');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => {
  e.preventDefault();
  dz.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
fi.addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });

// preset clicks
document.querySelectorAll('.ics-preset').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.ics-preset').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    $('#targetKB').value = b.dataset.kb;
  });
});

$('#targetKB').addEventListener('change', () => {
  document.querySelectorAll('.ics-preset').forEach(x => x.classList.remove('active'));
});

$('#compressBtn').addEventListener('click', doCompress);
$('#resetBtn').addEventListener('click', reset);
$('#dlBtn').addEventListener('click', download);

GZ.renderToolPage({
  category: 'image',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1', 'step2', 'step3', 'step4'],
  related: [
    {icon: '🗜️', href: '/image/compressor.html', name: 'Image Compressor'},
    {icon: '📐', href: '/image/resizer.html', name: 'Image Resizer'},
    {icon: '🔄', href: '/image/converter.html', name: 'Format Converter'},
    {icon: '💧', href: '/image/watermark.html', name: 'Watermark Tool'},
  ],
});
</script>
