<script>
GZI18n.register({
  en: {

    hint: '支持 JPG、PNG、WEBP、GIF · 最大约 20MB',
    colors: '颜色数',
    quality: '精度',
    skipWhite: '跳过接近白色',
    skipBlack: '跳过接近黑色',
    redo: '重新提取',
    copy: '复制',
    copyAll: '全部复制',
    export: '导出',
    exportJson: 'JSON',
    exportCss: 'CSS',
    exportScss: 'SCSS',
    exportTailwind: 'Tailwind',
    exportPng: 'PNG 色板',
    exported: '已导出 ✓',
    noImage: '请先上传一张图片。',
    extractDone: '已从 {w}×{h} 图片提取 {n} 种颜色（耗时 {ms} 毫秒）',
    extractFail: '读取图片失败，请尝试其他文件。',
    step1: '拖拽或上传图片（JPG/PNG/WEBP/GIF）',
    step2: '选择要提取的颜色数（3–12），可勾选跳过白色或黑色',
    step3: '点击任意色板复制其 HEX 码',
    step4: '用导出按钮下载 JSON / CSS / SCSS / Tailwind / PNG',
  }

const { $, copyText, t } = GZ;
let currentPalette = [];
let currentImage = null;

const dz = $('#dropzone');
const fi = $('#fileInput');
const preview = $('#preview');
const cv = $('#canvas');
const ctx = cv.getContext('2d', { willReadFrequently: true });

dz.addEventListener('click', () => fi.click());
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('dragover');
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) loadFile(f);
});
fi.addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (f) loadFile(f);
});

function loadFile(file) {
  if (!file.type.startsWith('image/')) { $('#status').innerHTML = `<span style="color:var(--gz-accent)">${t('extractFail')}</span>`; return; }
  if (file.size > 25 * 1024 * 1024) { $('#status').innerHTML = `<span style="color:var(--gz-accent)">File too large (max 25MB)</span>`; return; }
  const reader = new FileReader();
  reader.onload = ev => {
    currentImage = ev.target.result;
    preview.src = currentImage;
    preview.style.display = 'block';
    preview.onload = () => extract();
  };
  reader.onerror = () => { $('#status').innerHTML = `<span style="color:var(--gz-accent)">${t('extractFail')}</span>`; };
  reader.readAsDataURL(file);
}

function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('')}
function rgbToHsl(r,g,b){
  r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
  let h,s,l=(mx+mn)/2;
  if(mx===mn){h=s=0;}else{const d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);
    switch(mx){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break}
    h/=6;
  }
  return [Math.round(h*360), Math.round(s*100), Math.round(l*100)];
}

// Median-cut color quantization
class Box {
  constructor(pixels){ this.pixels = pixels; this.r0=255;this.g0=255;this.b0=255;this.r1=0;this.g1=0;this.b1=0;this.calc(); }
  calc(){ for(const p of this.pixels){ if(p[0]<this.r0)this.r0=p[0];if(p[0]>this.r1)this.r1=p[0];if(p[1]<this.g0)this.g0=p[1];if(p[1]>this.g1)this.g1=p[1];if(p[2]<this.b0)this.b0=p[2];if(p[2]>this.b1)this.b1=p[2]; } }
  vol(){ return (this.r1-this.r0)+(this.g1-this.g0)+(this.b1-this.b0); }
  split(){
    const dr=this.r1-this.r0,dg=this.g1-this.g0,db=this.b1-this.b0;
    let axis=0; if(dg>=dr&&dg>=db)axis=1; if(db>=dr&&db>=dg)axis=2;
    this.pixels.sort((a,b)=>a[axis]-b[axis]);
    const mid=this.pixels.length>>1;
    return [new Box(this.pixels.slice(0,mid)), new Box(this.pixels.slice(mid))];
  }
  avg(){ let r=0,g=0,b=0;const n=this.pixels.length;if(!n)return [0,0,0];for(const p of this.pixels){r+=p[0];g+=p[1];b+=p[2];}return [Math.round(r/n),Math.round(g/n),Math.round(b/n)]; }
}

function extract() {
  if (!preview.complete || !preview.naturalWidth) return;
  const targetMax = 200;
  const scale = Math.min(1, targetMax / Math.max(preview.naturalWidth, preview.naturalHeight));
  const w = Math.max(1, Math.round(preview.naturalWidth * scale));
  const h = Math.max(1, Math.round(preview.naturalHeight * scale));
  cv.width = w; cv.height = h;
  ctx.drawImage(preview, 0, 0, w, h);
  const q = +$('#quality').value;
  const data = ctx.getImageData(0, 0, w, h).data;

  const pixels = [];
  const skipWhite = $('#excludeWhite').checked;
  const skipBlack = $('#excludeBlack').checked;
  for (let i = 0; i < data.length; i += 4 * q) {
    const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
    if (a < 125) continue;
    if (skipWhite && r > 245 && g > 245 && b > 245) continue;
    if (skipBlack && r < 12 && g < 12 && b < 12) continue;
    pixels.push([r,g,b]);
  }

  if (pixels.length === 0) {
    $('#status').innerHTML = `<span style="color:var(--gz-accent)">No colors found (try disabling skip-white/black)</span>`;
    return;
  }

  const t0 = performance.now();
  let boxes = [new Box(pixels)];
  const target = Math.max(3, Math.min(12, +$('#colorCount').value));
  while (boxes.length < target) {
    boxes.sort((a,b)=>b.vol()-a.vol());
    const biggest = boxes.shift();
    if (biggest.pixels.length < 2) { boxes.unshift(biggest); break; }
    const [a,b] = biggest.split();
    boxes.push(a); boxes.push(b);
  }
  const ms = Math.round(performance.now() - t0);
  currentPalette = boxes.map(b => {
    const [r,g,b2] = b.avg();
    const [h,s,l] = rgbToHsl(r,g,b2);
    return { hex: rgbToHex(r,g,b2), rgb:[r,g,b2], hsl:[h,s,l] };
  });
  render();
  $('#status').innerHTML = `<span style="color:var(--gz-success)">${t('extractDone').replace('{n}', currentPalette.length).replace('{w}', preview.naturalWidth).replace('{h}', preview.naturalHeight).replace('{ms}', ms)}</span>`;
}

function render() {
  const root = $('#swatches'); root.innerHTML = '';
  currentPalette.forEach(c => {
    const div = document.createElement('div');
    div.className = 'swatch';
    div.onclick = () => copyText(c.hex).then(() => { $('#status').innerHTML = `<span style="color:var(--gz-success)">${c.hex} ✓</span>`; });
    div.innerHTML = `<div class="swatch-color" style="background:${c.hex}"></div>
      <div class="swatch-meta"><b>${c.hex.toUpperCase()}</b><br>rgb(${c.rgb.join(', ')})<br>hsl(${c.hsl[0]}, ${c.hsl[1]}%, ${c.hsl[2]}%)</div>`;
    root.appendChild(div);
  });
  renderExport('css');
}

function renderExport(fmt) {
  let out = '';
  if (fmt === 'json') {
    out = JSON.stringify(currentPalette.map(c=>({hex:c.hex,rgb:c.rgb,hsl:c.hsl})), null, 2);
  } else if (fmt === 'css') {
    out = ':root {\n' + currentPalette.map((c,i)=>`  --color-${i+1}: ${c.hex};`).join('\n') + '\n}';
  } else if (fmt === 'scss') {
    out = currentPalette.map((c,i)=>`$color-${i+1}: ${c.hex};`).join('\n');
  } else if (fmt === 'tailwind') {
    out = 'module.exports = {\n  theme: { extend: { colors: {\n' + currentPalette.map((c,i)=>`    'brand${i+1}': '${c.hex}',`).join('\n') + '\n  } } }\n};';
  }
  $('#exportOut').value = out;
}

function exportPng() {
  if (!currentPalette.length) { $('#status').innerHTML = `<span style="color:var(--gz-accent)">${t('noImage')}</span>`; return; }
  const w = 600, h = 120, sw = w / currentPalette.length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const cx = c.getContext('2d');
  currentPalette.forEach((col, i) => { cx.fillStyle = col.hex; cx.fillRect(i*sw, 0, sw, h); });
  cx.fillStyle = 'rgba(255,255,255,.85)'; cx.font = 'bold 12px monospace';
  currentPalette.forEach((col, i) => { const txt = col.hex.toUpperCase(); cx.fillText(txt, i*sw + 8, h-12); });
  c.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'palette.png';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    $('#status').innerHTML = `<span style="color:var(--gz-success)">${t('exported')}</span>`;
  }, 'image/png');
}

$('#toolbar').innerHTML = `
  <button class="gz-btn gz-btn-secondary" onclick="$('#fileInput').click()">${'📁 ' + t('redo')}</button>`;
$('#toolbarExport').innerHTML = `
  <button class="gz-btn" onclick="renderExport('json')">${t('exportJson')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="renderExport('css')">${t('exportCss')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="renderExport('scss')">${t('exportScss')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="renderExport('tailwind')">${t('exportTailwind')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="exportPng()">${t('exportPng')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="copyText($('#exportOut').value)">${t('copyAll')}</button>`;

$('#colorCount').addEventListener('change', () => currentImage && extract());
$('#quality').addEventListener('change', () => currentImage && extract());
$('#excludeWhite').addEventListener('change', () => currentImage && extract());
$('#excludeBlack').addEventListener('change', () => currentImage && extract());
$('#redoBtn').addEventListener('click', () => currentImage && extract());

$('#dropText').textContent = t('dropText');
$('#hint').textContent = t('hint');
$('#lblColors').textContent = t('colors');
$('#lblQuality').textContent = t('quality');
$('#lblSkipWhite').textContent = t('skipWhite');
$('#lblSkipBlack').textContent = t('skipBlack');
$('#redoBtn').textContent = '🔄 ' + t('redo');

GZ.renderToolPage({

  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],

    {icon:'🔍', href:'/color/eyedropper-color-picker.html', name:'Eyedropper'},
  ]
});
</script>
