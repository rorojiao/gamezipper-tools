<script>
GZI18n.register({

    phTo: '亲爱的家人', phFrom: '爱你的小明', phMsg: '愿这个冬天有温暖、喜悦和闪烁的星光…',
    tn0: '圣诞树', tn1: '雪人', tn2: '冬夜', tn3: '糖果', tn4: '金雅',

    msgs: [

    step1: '从五个模板中选择其一：圣诞树、雪人、冬夜、糖果、金雅',
    step2: '填写收件人、署名和祝福语（或点「随机祝福」）',
    step3: '预览区实时重绘贺卡效果',

const { $, t } = GZ;
const cv = $('#cardCanvas'), ctx = cv.getContext('2d');
const W = 1200, H = 800;
let curTemp = 'tree';
const LANG = (document.documentElement.lang === 'zh') ? 'zh' : 'en';

function rr(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function wrap(txt, maxW, size, font){
  ctx.font = font.replace('SIZE', size);
  const words = txt.split(/\s+/); const lines = []; let line = '';
  for (const w0 of words){ const tst = line ? line+' '+w0 : w0;
    if (ctx.measureText(tst).width > maxW && line){ lines.push(line); line = w0; } else line = tst; }
  if (line) lines.push(line); return lines;
}
function drawTextBlock(txt, maxW, size, color, font, cx, y0, lh){
  const lines = wrap(txt, maxW, size, font); let y = y0;
  ctx.fillStyle = color; ctx.textAlign = 'center';
  for (const l of lines){ ctx.fillText(l, cx, y); y += lh; }
  return y;
}
function snowDots(n, seed){
  let s = seed; const rnd = () => (s = (s*1664525+1013904223)>>>0, s/4294967296);
  for (let i=0;i<n;i++){ const x=rnd()*W, y=rnd()*H, r=1+rnd()*3.4;
    ctx.globalAlpha=.35+rnd()*.5; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }
  ctx.globalAlpha=1;
}
function stars(n, seed){
  let s=seed; const rnd=()=> (s=(s*1664525+1013904223)>>>0, s/4294967296);
  for(let i=0;i<n;i++){ const x=rnd()*W, y=rnd()*H*.55, r=.6+rnd()*1.8;
    ctx.globalAlpha=.4+rnd()*.6; ctx.fillStyle='#ffe9b0';
    ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }
  ctx.globalAlpha=1;
}
function treeAt(x, base, sc, c){
  ctx.fillStyle=c;
  for(let k=0;k<3;k++){ const ty=base-k*70*sc, w=(150-k*38)*sc;
    ctx.beginPath(); ctx.moveTo(x,ty-110*sc); ctx.lineTo(x-w/2,ty); ctx.lineTo(x+w/2,ty); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle='#6b4a2f'; ctx.fillRect(x-9*sc, base, 18*sc, 26*sc);
  ctx.fillStyle='#ffd75e'; ctx.beginPath(); ctx.arc(x, base-288*sc, 12*sc, 0, 7); ctx.fill();
}
function draw(){
  const to = $('#toName').value.trim(), from = $('#fromName').value.trim(), msg = $('#msg').value.trim();
  ctx.clearRect(0,0,W,H);
  if (curTemp==='tree'){
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#123524'); g.addColorStop(1,'#1d5233'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    snowDots(90,7); ctx.fillStyle='#eef6ff'; ctx.beginPath(); ctx.ellipse(W/2,H+130,W*.75,270,0,0,7); ctx.fill();
    treeAt(W/2,640,1.5,'#0f3d21'); treeAt(190,700,.8,'#14471f'); treeAt(1020,690,.9,'#14471f');
    ctx.fillStyle='#ffd75e'; for(let i=0;i<9;i++){ ctx.beginPath(); ctx.arc(W/2+Math.sin(i*1.9)*90, 420+i*22, 5,0,7); ctx.fill(); }
  } else if (curTemp==='snowman'){
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#bcd9ee'); g.addColorStop(1,'#e9f4fb'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    snowDots(70,11); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(W/2,H+90,W*.7,210,0,0,7); ctx.fill();
    const cx=250, by=620;
    ctx.fillStyle='#fdfdfd'; ctx.beginPath(); ctx.arc(cx,by,95,0,7); ctx.arc(cx,by-125,68,0,7); ctx.arc(cx,by-222,46,0,7); ctx.fill();
    ctx.strokeStyle='#3a3a3a'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(cx-62,by-140); ctx.lineTo(cx-150,by-210); ctx.moveTo(cx+62,by-140); ctx.lineTo(cx+150,by-195); ctx.stroke();
    ctx.fillStyle='#2b2b2b'; ctx.beginPath(); ctx.arc(cx-16,by-232,5,0,7); ctx.arc(cx+14,by-232,5,0,7); ctx.fill();
    ctx.fillStyle='#e07b39'; ctx.beginPath(); ctx.moveTo(cx,by-225); ctx.lineTo(cx+34,by-218); ctx.lineTo(cx,by-212); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#c0392b'; ctx.lineWidth=10; ctx.beginPath(); ctx.arc(cx,by-170,34,0,Math.PI); ctx.stroke();
  } else if (curTemp==='night'){
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0b1030'); g.addColorStop(1,'#243a6b'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    stars(110,5); ctx.fillStyle='#fdf3c8'; ctx.beginPath(); ctx.arc(975,140,58,0,7); ctx.fillStyle='#0b1030'; ctx.beginPath(); ctx.arc(1000,122,52,0,7); ctx.fill();
    ctx.fillStyle='#fdf3c8'; ctx.beginPath(); ctx.arc(975,140,58,0,7); ctx.fill();
    ctx.fillStyle='#101a3d'; ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(0,600); ctx.quadraticCurveTo(300,520,620,610); ctx.quadraticCurveTo(950,700,W,585); ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
    snowDots(60,3);
  } else if (curTemp==='candy'){
    ctx.fillStyle='#f7f3ec'; ctx.fillRect(0,0,W,H);
    ctx.save(); ctx.translate(W/2,H/2); ctx.rotate(-Math.PI/4); ctx.strokeStyle='#d6454c'; ctx.lineWidth=26;
    for(let i=-W;i<W;i+=110){ ctx.beginPath(); ctx.moveTo(-W,i); ctx.lineTo(W,i); ctx.stroke(); }
    ctx.restore();
    ctx.fillStyle='#f7f3ec'; rr(46,46,W-92,H-92,40); ctx.fill();
    ctx.strokeStyle='#2e7d5a'; ctx.lineWidth=8; rr(46,46,W-92,H-92,40); ctx.stroke();
    ctx.fillStyle='#d6454c'; for(let i=0;i<14;i++){ ctx.beginPath(); ctx.arc(80+i*80, 96, 7,0,7); ctx.arc(80+i*80, H-96, 7,0,7); ctx.fill(); }
  } else {
    ctx.fillStyle='#fbf6ea'; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#b8912f'; ctx.lineWidth=3; rr(50,50,W-100,H-100,8); ctx.stroke();
    ctx.lineWidth=1; rr(62,62,W-124,H-124,6); ctx.stroke();
    ctx.fillStyle='#b8912f'; ctx.beginPath(); ctx.arc(W/2,132,6,0,7); ctx.fill();
    ctx.font='40px serif'; ctx.textAlign='center'; ctx.fillStyle='#8a6b1f'; ctx.fillText('❦', W/2, 150);
  }
  // text zone
  const serif = LANG==='zh' ? '"Noto Sans SC", sans-serif' : 'Georgia, "Times New Roman", serif';
  ctx.textAlign='center';
  const gy = curTemp==='candy' ? 240 : curTemp==='gold' ? 250 : 300;
  ctx.font = '900 '+(LANG==='zh'?110:96)+'px '+serif;
  ctx.fillStyle = (curTemp==='night'||curTemp==='tree') ? '#ffd75e' : (curTemp==='gold'?'#8a6b1f':(curTemp==='candy'?'#c0392b':'#2e7d5a'));
  ctx.fillText(t('greet'), W/2, gy);
  ctx.font='italic 34px '+serif;
  ctx.fillStyle=(curTemp==='night'||curTemp==='tree')?'#cfd8e6':'#5c6b7a';
  ctx.fillText(t('greetSub'), W/2, gy+52);
  let y = gy+130;
  if (msg){ y = drawTextBlock(msg, W-460, 36, (curTemp==='night'||curTemp==='tree')?'#eef2f8':'#333d47', '36px '+serif, W/2, y, 52); y+=8; }
  if (to){ ctx.font='700 44px '+serif; ctx.fillStyle=(curTemp==='night'||curTemp==='tree')?'#fff':'#1c2733';
    ctx.fillText((LANG==='zh'?'亲爱的 ':'')+to+(LANG==='zh'?'：':'!'), W/2, y); y+=58; }
  if (from){ ctx.font='italic 36px '+serif; ctx.fillStyle=(curTemp==='night'||curTemp==='tree')?'#ffd75e':'#b8912f';
    ctx.fillText((LANG==='zh'?'—— ':'— ')+from, W/2, y); }
}
['toName','fromName','msg'].forEach(id => { $('#'+id).addEventListener('input', draw); });
$('#temps').addEventListener('click', e => {
  const b = e.target.closest('.cc-temp'); if(!b) return;
  document.querySelectorAll('.cc-temp').forEach(x=>x.classList.remove('cc-tempOn'));
  b.classList.add('cc-tempOn'); curTemp = b.dataset.t; draw();
});
$('#dlBtn').addEventListener('click', () => {
  cv.toBlob(bl => { const a=document.createElement('a'); a.href=URL.createObjectURL(bl);
    a.download='christmas-card.png'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),3000); }, 'image/png');
});
$('#randBtn').addEventListener('click', () => { const m=t('msgs'); $('#msg').value=m[Math.floor(Math.random()*m.length)]; draw(); });
$('#copyBtn').addEventListener('click', async () => {
  const txt = t('greet')+' — '+($('#toName').value.trim()||'you')+'\n'+($('#msg').value.trim()||'')+'\n— '+($('#fromName').value.trim()||'');
  try{ await navigator.clipboard.writeText(txt); $('#copyLabel').textContent=t('copied'); setTimeout(()=>$('#copyLabel').textContent=t('copyLabel'),1500);}catch(e){}
});
$('#toName').placeholder=t('phTo'); $('#fromName').placeholder=t('phFrom'); $('#msg').placeholder=t('phMsg');
$('#kTo').textContent=t('kTo'); $('#kFrom').textContent=t('kFrom'); $('#kMsg').textContent=t('kMsg'); $('#kTemp').textContent=t('kTemp');
for(let i=0;i<5;i++) $('#tn'+i).textContent=t('tn'+i);
$('#dlLabel').textContent=t('dlLabel'); $('#copyLabel').textContent=t('copyLabel'); $('#randLabel').textContent=t('randLabel');
$('#note').textContent=t('noteText');
$('#msg').value=t('msgs')[0];
draw();
