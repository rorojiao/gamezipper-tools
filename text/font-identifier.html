function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function rand() { return Math.random(); }

function scoreFont(font, family, weight, style, feature) {
  let score = 100;
  // Family match — primary signal
  if (font.family === family) score += 30;
  else score -= 50;
  // Weight match
  if (font.weight === weight) score += 25;
  else score -= 10;
  // Style match (italic vs upright) — adjust heuristic since italic is mostly derived
  if (style === 'italic' && font.family === 'script') score += 10;
  // Feature match
  if (feature !== 'none') {
    if (font.feature === feature) score += 20;
    else if (font.feature !== 'none') score -= 15;
  }
  // Slight randomization for variety
  score += (rand() - 0.5) * 8;
  return Math.max(0, Math.round(score));
}

function loadFontForPreview(familyName) {
  // Lazy-load Google Font for preview rendering
  const id = 'gfont-' + familyName.replace(/\s+/g, '-').toLowerCase();
  if (document.getElementById(id)) return;
  const link = document.createElement('link');
  link.id = id;
  link.rel = 'stylesheet';
  link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(familyName).replace(/%20/g, '+')}:wght@400;700&display=swap`;
  document.head.appendChild(link);
}

function identifyFonts(family, weight, style, feature) {
  return FONTS
    .filter(f => f.family === family)
    .map(f => ({ ...f, score: scoreFont(f, family, weight, style, feature) }))
    .sort((a, b) => b.score - a.score)
    .slice(0, 8);
}

const { $, copyText, t } = GZ;
let currentImageUrl = null;

function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  if (currentImageUrl) URL.revokeObjectURL(currentImageUrl);
  currentImageUrl = URL.createObjectURL(file);
  $('#previewImg').src = currentImageUrl;
  $('#previewWrap').style.display = 'block';
  $('#uploadText').innerHTML = `✓ <strong>${escapeHtml(file.name)}</strong> loaded locally. Pick the closest match for each question, then click Identify.`;
}

function doIdentify() {
  const family = $('#familySel').value;
  const weight = $('#weightSel').value;
  const style = $('#styleSel').value;
  const feature = $('#featureSel').value;
  const matches = identifyFonts(family, weight, style, feature);
  matches.forEach(m => loadFontForPreview(m.name));
  const wrap = $('#fiOutput');
  if (!matches.length) {
    wrap.innerHTML = `<div class="fi-empty">${t('empty')}</div>`;
    $('#fiSummary').innerHTML = '';
    return;
  }
  wrap.innerHTML = matches.map((m, i) => {
    const ffStack = `'${m.name}', ${m.family === 'serif' ? 'serif' : m.family === 'mono' ? 'monospace' : m.family === 'script' ? 'cursive' : 'sans-serif'}`;
    return `
      <div class="fi-font-card">
        <div class="name">
          <h3><a href="${m.google ? 'https://fonts.google.com/specimen/' + m.name.replace(/\s+/g, '+') : '#'}" target="_blank" rel="noopener">${m.name}</a> <span class="fi-score">${m.score}%</span></h3>
          <div class="meta">${escapeHtml(m.desc)}</div>
          ${m.google ? `<div style="margin-top:6px;font-size:.78em"><a href="https://fonts.google.com/specimen/${m.name.replace(/\s+/g, '+')}" target="_blank" rel="noopener" style="color:var(--accent)">View on Google Fonts →</a></div>` : ''}
        </div>
        <div class="sample" style="font-family:${ffStack};font-weight:${m.weight === 'black' ? '900' : m.weight === 'bold' ? '700' : m.weight === 'light' ? '300' : '400'};font-style:${style === 'italic' ? 'italic' : 'normal'}">${SAMPLE_TEXT}</div>
      </div>
    `;
  }).join('');
  const famLabel = ((GZI18n._data[GZI18n.getLang()] || {}).families || {})[family] || family;
  const wtLabel = ((GZI18n._data[GZI18n.getLang()] || {}).weights || {})[weight] || weight;
  const summaryFn = t('summary');
  if (typeof summaryFn === 'function') {
    $('#fiSummary').innerHTML = summaryFn(matches.length, famLabel, wtLabel);
  } else {
    $('#fiSummary').innerHTML = `Top <strong>${matches.length}</strong> matches for <strong>${famLabel}</strong> (<strong>${wtLabel}</strong>).`;
  }
}

function doReset() {
  if (currentImageUrl) { URL.revokeObjectURL(currentImageUrl); currentImageUrl = null; }
  $('#fileInput').value = '';
  $('#previewWrap').style.display = 'none';
  $('#previewImg').src = '';
  $('#uploadText').innerHTML = `📷 <strong>Click to upload</strong> an image of the text (PNG, JPG, WebP)<br><span style="color:var(--text2);font-size:.85em">— or drag and drop —</span>`;
  $('#fiOutput').innerHTML = '';
  $('#fiSummary').innerHTML = '';
}

$('#identifyBtn').addEventListener('click', doIdentify);
$('#resetBtn').addEventListener('click', doReset);

$('#fileInput').addEventListener('change', e => handleFile(e.target.files[0]));

// Drag-and-drop
const ub = $('#uploadBox');
ub.addEventListener('dragover', e => { e.preventDefault(); ub.style.borderColor = 'var(--accent)'; });
ub.addEventListener('dragleave', e => { e.preventDefault(); ub.style.borderColor = ''; });
ub.addEventListener('drop', e => {
  e.preventDefault();
  ub.style.borderColor = '';
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) handleFile(f);
});
