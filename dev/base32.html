<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is Base32 used for?","acceptedAnswer":{"@type":"Answer","text":"Base32 encodes binary data into a 32-character alphabet (commonly A–Z plus 2–7). It is used in TOTP / Google Authenticator secret keys, AWS access key IDs, Keri, IPFS CIDs and any system that needs case-insensitive, human-transcribable encoding without symbols."}},{"@type":"Question","name":"What is Crockford Base32?","acceptedAnswer":{"@type":"Answer","text":"Crockford Base32 omits the letters I, L, O and U so it cannot be confused with the digits 1 or 0. It is widely used wherever humans transcribe codes by hand — for example backups, key fingerprints and short identifiers — because mistakes are easy to spot."}},{"@type":"Question","name":"Is my input sent to a server?","acceptedAnswer":{"@type":"Answer","text":"No. All encoding and decoding happens locally in your browser using JavaScript. Nothing is uploaded or stored."}},{"@type":"Question","name":"Why is the output sometimes padded with equals signs?","acceptedAnswer":{"@type":"Answer","text":"RFC 4648 Base32 pads the output with the '=' character so the encoded length is always a multiple of 8. Crockford and z-base-32 do not use padding. You can strip '=' when interoperating with systems that omit it."}},{"@type":"Question","name":"Can I decode Base32 hex keys?","acceptedAnswer":{"@type":"Answer","text":"Yes. Switch input mode to Hex and the tool will treat your text as a hexadecimal byte sequence before Base32-encoding it. Switching to Decode mode works the same way in reverse."}}]}</script>

<script>
GZI18n.register({en:{toolTitle:'Base32 Encoder / Decoder',toolDesc:'Encode text or hex to Base32 and decode it back. Supports RFC 4648, Crockford and z-base-32 alphabets — used by TOTP secrets, AWS access key IDs, IPFS CIDs, Keri and human-readable backup codes. 100% local, no upload.',alphabet:'Alphabet',mode:'Mode',inputmode:'Input format',input:'Input',output:'Output',run:'Run',swap:'Swap',copy:'Copy output',clear:'Clear',copied:'Copied output to the clipboard.',cleared:'Cleared inputs.',invalidHex:'Invalid hex input — only 0-9, a-f, A-F and even length allowed.',invalidBase32:'Invalid Base32 input — characters not allowed by the chosen alphabet.',emptyInput:'Nothing to encode or decode yet.',alphabetHeading:'Base32 alphabets supported',metaInput:'Input',metaOutput:'Output',metaTime:'Time',step1:'Pick an alphabet (RFC 4648, Crockford or z-base-32) and choose Encode or Decode.',step2:'Type or paste your input — text or raw bytes — and pick the corresponding Input mode.',step3:'Click Run, then Copy the result, or Swap to feed it back into the decoder.'},zh:{toolTitle:'Base32 编码 / 解码器',toolDesc:'将文本或十六进制编码为 Base32 并解码回来。支持 RFC 4648、Crockford 和 z-base-32 字母表 — 适用于 TOTP 密钥、AWS 访问密钥、IPFS CID、Keri 和人类可读备份码。100% 本地运行,不上传。',alphabet:'字母表',mode:'模式',inputmode:'输入格式',input:'输入',output:'输出',run:'运行',swap:'交换',copy:'复制输出',clear:'清空',copied:'已复制输出到剪贴板。',cleared:'已清空输入。',invalidHex:'十六进制输入无效 — 仅允许 0-9、a-f、A-F 且长度必须为偶数。',invalidBase32:'Base32 输入无效 — 字符不在所选字母表中。',emptyInput:'还没有需要编码或解码的内容。',alphabetHeading:'支持的 Base32 字母表',metaInput:'输入',metaOutput:'输出',metaTime:'耗时',step1:'选择字母表（RFC 4648、Crockford 或 z-base-32）和「编码」或「解码」模式。',step2:'在输入框中键入或粘贴内容,并选择「文本」或「十六进制」输入模式。',step3:'点击「运行」,然后「复制」结果,或用「交换」快速测试编解码闭环。'}});
const {$,t,copyText}=GZ;

const ALPHABETS = {
  rfc4648:    {enc:'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567', pad:'=', decMap:null},
  rfc4648hex: {enc:'0123456789ABCDEFGHIJKLMNOPQRSTUV', pad:'=', decMap:null},
  crockford:  {enc:'0123456789ABCDEFGHJKMNPQRSTVWXYZ', pad:'',  decMap:null, normalizeDecode:crockfordNormalize},
  zbase32:    {enc:'ybndrfg8ejkmcpqxot1uwisza345h769', pad:'',  decMap:null},
};

function crockfordNormalize(s){
  // Lowercase, replace I/L→1, O→0 (Crockford decoding forgiveness per spec)
  return s.toUpperCase().replace(/L/g,'1').replace(/I/g,'1').replace(/O/g,'0');
}

function buildDecMap(alpha){
  const m = {};
  const s = alpha.enc.toUpperCase();
  for(let i=0;i<s.length;i++) m[s[i]] = i;
  return m;
}

function getAlpha(){
  const key = $('#alphabet').value;
  const a = ALPHABETS[key];
  if(!a.decMap) a.decMap = buildDecMap(a);
  return { key, ...a };
}

function textToBytes(str){
  return Array.from(new TextEncoder().encode(str));
}

function hexToBytes(hex){
  const clean = hex.replace(/\s+/g,'').replace(/^0x/i,'');
  if(!/^[0-9a-fA-F]*$/.test(clean) || clean.length % 2) return null;
  const out = new Uint8Array(clean.length/2);
  for(let i=0;i<out.length;i++) out[i] = parseInt(clean.substr(i*2,2),16);
  return Array.from(out);
}

function bytesToHex(bytes){
  return bytes.map(b=>b.toString(16).padStart(2,'0')).join('');
}

function encodeBase32(bytes, alpha){
  // Pack actual bytes into a bit string.
  let bits = '';
  for(const b of bytes) bits += b.toString(2).padStart(8,'0');
  // Total base32 chars = ceil(bits/5). Trailing partial chunk is zero-padded on the right.
  const totalData = bits.length === 0 ? 0 : Math.ceil(bits.length / 5);
  let out = '';
  for(let i=0;i<totalData;i++){
    const chunk = (bits.substr(i*5,5) + '00000').substr(0,5);
    out += alpha.enc[parseInt(chunk,2)];
  }
  // RFC 4648: pad with '=' so total length is a multiple of 8.
  if(alpha.pad){
    const padCount = (8 - (totalData % 8)) % 8;
    out += alpha.pad.repeat(padCount);
  }
  return out;
}

function decodeBase32(str, alpha){
  const norm = alpha.normalizeDecode ? alpha.normalizeDecode(str) : str.toUpperCase();
  const clean = norm.replace(new RegExp('\\'+alpha.pad,'g'),'').replace(/\s+/g,'');
  const decMap = alpha.decMap;
  let bits = '';
  for(const ch of clean){
    const v = decMap[ch];
    if(v === undefined) return null;
    bits += v.toString(2).padStart(5,'0');
  }
  const bytes = [];
  for(let i=0;i+8<=bits.length;i+=8){
    bytes.push(parseInt(bits.substr(i,8),2));
  }
  // Trim trailing zero bytes caused by Base32 padding (only safe when input had '=')
  if(alpha.pad){
    const padCount = (str.match(new RegExp('\\'+alpha.pad,'g'))||[]).length;
    while(bytes.length && padCount > 0 && bytes[bytes.length-1] === 0) bytes.pop();
  }
  return bytes;
}

function run(){
  const mode = $('#mode').value;
  const alpha = getAlpha();
  const raw = $('#input').value;
  const inputMode = $('#input-mode').value;
  const status = (msg, ok)=>{ const s=$('#status'); s.textContent = msg; s.style.color = ok?'var(--text2)':'#e94560'; };
  if(!raw.trim()){ status(t('emptyInput'), false); $('#output').value=''; return; }
  const t0 = performance.now();
  try{
    if(mode === 'encode'){
      const bytes = inputMode === 'text' ? textToBytes(raw) : hexToBytes(raw);
      if(!bytes){ status(t('invalidHex'), false); $('#output').value=''; return; }
      const out = encodeBase32(bytes, alpha);
      $('#output').value = out;
      const ms = (performance.now()-t0).toFixed(1);
      $('#meta-input').textContent = `${t('metaInput')}: ${bytes.length} B`;
      $('#meta-output').textContent = `${t('metaOutput')}: ${out.length} ch`;
      $('#meta-time').textContent = `${t('metaTime')}: ${ms} ms`;
      status('✓ ' + (inputMode==='text' ? 'text':'hex') + ' → ' + alpha.key + ' : ' + out.length + ' chars', true);
    } else {
      const bytes = decodeBase32(raw, alpha);
      if(bytes === null){ status(t('invalidBase32'), false); $('#output').value=''; return; }
      const out = inputMode === 'text' ? new TextDecoder('utf-8',{fatal:false}).decode(Uint8Array.from(bytes)) : bytesToHex(bytes);
      $('#output').value = out;
      const ms = (performance.now()-t0).toFixed(1);
      $('#meta-input').textContent = `${t('metaInput')}: ${raw.replace(/\s+/g,'').length} ch`;
      $('#meta-output').textContent = `${t('metaOutput')}: ${bytes.length} B`;
      $('#meta-time').textContent = `${t('metaTime')}: ${ms} ms`;
      status('✓ ' + alpha.key + ' → ' + (inputMode==='text' ? 'text':'hex') + ' : ' + bytes.length + ' bytes', true);
    }
  } catch(e){
    status('Error: ' + e.message, false);
  }
}

function swap(){
  const old = $('#input').value;
  $('#input').value = $('#output').value;
  $('#output').value = old;
  $('#mode').value = $('#mode').value === 'encode' ? 'decode' : 'encode';
  run();
}

$('#alphabet-label').textContent = t('alphabet');
$('#mode-label').textContent = t('mode');
$('#inputmode-label').textContent = t('inputmode');
$('#input-label').textContent = t('input');
$('#output-label').textContent = t('output');
$('#run').textContent = t('run');
$('#swap').textContent = t('swap');
$('#copy').textContent = t('copy');
$('#clear').textContent = t('clear');
$('#alphabet-heading').textContent = t('alphabetHeading');
$('#run').onclick = run;
$('#copy').onclick = ()=>{ copyText($('#output').value); $('#status').textContent = t('copied'); };
$('#swap').onclick = swap;
$('#clear').onclick = ()=>{ $('#input').value=''; $('#output').value=''; $('#status').textContent=t('cleared'); };
$('#input').addEventListener('input', ()=>{ /* live */ });
['alphabet','mode','input-mode'].forEach(id=>$('#'+id).addEventListener('change', run));
$('#input').addEventListener('keydown', e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='Enter') run(); });
// Pre-warm decoder maps
['rfc4648','rfc4648hex','crockford','zbase32'].forEach(k=>buildDecMap(ALPHABETS[k]));
run();
GZ.renderToolPage({category:'dev',titleKey:'toolTitle',descKey:'toolDesc',howToSteps:['step1','step2','step3'],related:[{icon:'key',href:'/dev/base64.html',name:'Base64'},{icon:'key',href:'/dev/base58.html',name:'Base58'},{icon:'key',href:'/dev/totp-generator.html',name:'TOTP Generator'}]});
</script><script src="/tools-result-rec.js?v=R449-flat" defer></script></body></html>
