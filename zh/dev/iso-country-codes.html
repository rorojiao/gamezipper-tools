const { $, copyText, t, showToast } = GZ;
let region = 'all';

function flag(a2){ return a2.replace(/./g, c => String.fromCodePoint(127397 + c.charCodeAt(0))); }
function zhMode(){ return GZI18n.getLang() === 'zh'; }

function render(){
  const q = $('#search').value.trim().toLowerCase();
  const zh = zhMode();
  const list = ISO.filter(r => {
    if (region !== 'all' && r[5] !== region) return false;
    if (!q) return true;
    return (r[0]+' '+r[1]+' '+r[2]+' '+r[3]+' '+r[4]).toLowerCase().includes(q);
  });
  $('#rows').innerHTML = list.map(r =>
    `<tr onclick="isoCopy('${r[2]}')"><td class="flag">${flag(r[2])}</td><td>${zh ? r[1] : r[0]}</td><td class="code">${r[2]}</td><td class="code">${r[3]}</td><td class="code">${r[4]}</td></tr>`
  ).join('');
  $('#iso-count').textContent = `${t('showing')} ${list.length} ${t('ofEntries')} 249 ${t('entriesWord')}`;
}
function isoCopy(a2){
  const r = ISO.find(x => x[2] === a2);
  copyText(`${zhMode() ? r[1] : r[0]} (${r[2]} / ${r[3]} / ${r[4]})`);
  showToast(t('copied'));
}
window.isoCopy = isoCopy;

$('#chips').innerHTML = [['all','rAll'],['Africa','rAfrica'],['Americas','rAmericas'],['Asia','rAsia'],['Europe','rEurope'],['Oceania','rOceania']]
  .map(([v,k]) => `<div class="iso-chip${v==='all'?' active':''}" data-r="${v}" onclick="isoRegion('${v}')">${t(k)}</div>`).join('');
function isoRegion(r){ region = r; document.querySelectorAll('.iso-chip').forEach(b => b.classList.toggle('active', b.dataset.r === r)); render(); }
window.isoRegion = isoRegion;
$('#search').addEventListener('input', render);
render();
