<script>
GZI18n.register({
  en: {
    toolTitle: 'Commit Message Generator',
    toolDesc: 'Generate clean Conventional Commits messages from your git diff or change description. Auto-detect type, scope and emoji.',

  },
  zh: {

    toolDesc: '根据你的 git diff 或改动描述生成符合 Conventional Commits 规范的提交信息。自动识别类型、scope 和 emoji。',
    lblDiff: '粘贴 git diff 或描述你的改动：',
    lblType: '提交类型（自动识别，点击可覆盖）：',
    scopeLbl: 'Scope（可选）：',
    emojiLbl: '使用 gitmoji 风格 emoji 前缀',
    lblPreview: '预览（点击下方按钮复制）：',
    previewLabel: '提交信息：',
    copy: '复制', clear: '清空', example: '示例', suggest: '识别类型',
    empty: '请粘贴 diff 或描述你做的改动。',
    scopeAuto: '（自动识别）',
    step1: '粘贴你的 git diff 或简要描述你的改动',
    step2: '工具自动识别提交类型（feat、fix、docs 等）',
    step3: '可选填写 scope（如 auth、ui、api），留空则自动识别',
    step4: '如果想要 gitmoji 风格 emoji 前缀，勾选 emoji 开关',
    step5: '点击「复制」将信息复制到剪贴板，再用 git 提交',
  }
});

const { $, copyText, t } = GZ;

const TYPES = [
  { id: 'feat',     emoji: '✨', desc: 'A new feature' },
  { id: 'fix',      emoji: '🐛', desc: 'A bug fix' },
  { id: 'docs',     emoji: '📝', desc: 'Documentation only' },
  { id: 'style',    emoji: '💄', desc: 'Formatting, no code change' },
  { id: 'refactor', emoji: '♻️', desc: 'Refactor without feature/fix' },
  { id: 'perf',     emoji: '⚡', desc: 'Performance improvement' },
  { id: 'test',     emoji: '✅', desc: 'Add or fix tests' },
  { id: 'build',    emoji: '📦', desc: 'Build system or deps' },
  { id: 'ci',       emoji: '👷', desc: 'CI configuration' },
  { id: 'chore',    emoji: '🔧', desc: 'Other / tooling' },
  { id: 'revert',   emoji: '⏪', desc: 'Revert a previous commit' },
];

let selectedType = 'feat';

const TYPE_KEYWORDS = {
  fix:  ['bug', 'fix', 'crash', 'leak', 'error', 'exception', 'broken', 'wrong', 'incorrect', 'regression', 'fail'],
  docs: ['readme', 'docs', 'documentation', 'comment', 'typo', 'javadoc', 'docstring', '.md'],
  style:['whitespace', 'format', 'indent', 'prettier', 'eslint', 'lint', 'semicolon', 'tabs', 'spacing'],
  refactor:['refactor', 'rename', 'restructure', 'reorganize', 'cleanup', 'simplify', 'extract', 'inline'],
  perf:['optimize', 'perf', 'performance', 'cache', 'faster', 'speed', 'memory', 'benchmark'],
  test:['test', 'spec', 'jest', 'mocha', 'pytest', 'coverage', 'mock', 'assert'],
  build:['package', 'lock', 'cargo', 'go.mod', 'requirements.txt', 'pyproject', 'pubspec', 'pom.xml', 'webpack'],
  ci:   ['.github', 'travis', 'circleci', 'jenkins', 'gitlab-ci', 'workflow', 'pipeline'],
  revert:['revert', 'rollback'],
  feat: ['add', 'new', 'introduce', 'implement', 'support', 'enable'],
};

const SCOPE_REGEX = /(?:^|\/)([a-z0-9_-]+)\/|(?:in\s+)([a-z0-9_-]+)|(?:^|\b)(api|ui|cli|core|auth|db|docs|test|tests|config|util|utils|server|client|frontend|backend|app|lib|src|models|views|controllers|routes|middleware|components|pages)\b/i;

function detectType(text) {
  const lower = text.toLowerCase();
  if (/^\s*diff\s+--git/m.test(text) || /^\+\+\+|^---/m.test(text)) {
    let best = 'chore', bestCount = 0;
    for (const [type, kws] of Object.entries(TYPE_KEYWORDS)) {
      let c = 0;
      for (const kw of kws) if (lower.includes(kw)) c++;
      if (c > bestCount) { bestCount = c; best = type; }
    }
    return best;
  }
  for (const [type, kws] of Object.entries(TYPE_KEYWORDS)) {
    for (const kw of kws) {
      if (lower.includes(kw)) return type;
    }
  }
  return 'feat';
}

function detectScope(text) {
  const lines = text.split('\n');
  const candidates = [];
  for (const l of lines.slice(0, 50)) {
    let m;
    if ((m = l.match(/\+\+\+\s+b\/(.+)/)) || (m = l.match(/---\s+a\/(.+)/))) {
      const path = m[1].replace(/^b\//, '').replace(/^a\//, '');
      const top = path.split('/')[0];
      if (top && !['src','lib','app','test','tests','__tests__'].includes(top)) {
        candidates.push(top.toLowerCase());
      }
      const fn = path.split('/').slice(0, 2).join('/');
      candidates.push(fn.toLowerCase());
    }
  }
  if (candidates.length === 0) {
    const m = text.match(SCOPE_REGEX);
    if (m) return (m[1] || m[2] || '').toLowerCase();
    return '';
  }
  const counts = {};
  for (const c of candidates) counts[c] = (counts[c] || 0) + 1;
  return Object.entries(counts).sort((a,b) => b[1]-a[1])[0][0];
}

function extractSubject(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  if (lines.length === 0) return 'your change';
  // Prefer non-diff summary first
  for (const l of lines) {
    if (!l.startsWith('+') && !l.startsWith('-') && !l.startsWith('@@') && !l.startsWith('diff ') && !l.startsWith('index ') && !l.startsWith('---') && !l.startsWith('+++')) {
      if (l.length > 5 && l.length < 80) return l;
    }
  }
  // Fallback: pick first + line, strip prefix
  for (const l of lines) {
    if (l.startsWith('+') && !l.startsWith('+++')) {
      const content = l.slice(1).trim();
      if (content && content.length < 80) return content;
    }
  }
  return lines[0].slice(0, 80);
}

function buildMessage() {
  const text = $('#diff').value.trim();
  const type = selectedType;
  const scope = $('#scope').value.trim() || detectScope(text);
  const emoji = $('#emoji').checked;
  const subject = extractSubject(text);

  const tObj = TYPES.find(x => x.id === type);
  const prefix = emoji ? `${tObj.emoji} ` : '';
  const scopeStr = scope ? `(${scope})` : '';
  return `${prefix}${type}${scopeStr}: ${subject}`;
}

function update() {
  const msg = buildMessage();
  const html = msg.replace(/^([^:]+):/, '<span class="type">$1</span>:');
  $('#preview').textContent = msg;
  $('#preview').innerHTML = html;
}

function renderTypeGrid() {
  $('#typeGrid').innerHTML = TYPES.map(ty =>
    `<div class="type-chip ${ty.id===selectedType?'active':''}" data-t="${ty.id}">
       <div style="font-size:1.2em">${ty.emoji}</div>
       <div><b>${ty.id}</b></div>
       <div style="opacity:.6;font-size:.7em">${ty.desc}</div>
     </div>`).join('');
}

function autoDetect() {
  const text = $('#diff').value.trim();
  if (!text) return;
  selectedType = detectType(text);
  $('#scope').value = detectScope(text);
  renderTypeGrid(); update();
}

function copy() { copyText($('#preview').textContent); }

function loadExample() {
  $('#diff').value = `diff --git a/src/auth/login.js b/src/auth/login.js
@@ -12,7 +12,7 @@ function login(user) {
   if (!user.email) {
-    throw new Error("Missing email");
+    throw new ValidationError("Please enter your email address");
   }
-  return db.users.findOne({ email: user.email });
+  return db.users.findOne({ email: user.email.toLowerCase() });
 }`;
  $('#scope').value = '';
  autoDetect();
  $('#emoji').checked = true;
  update();
}

function clearAll() {
  $('#diff').value = '';
  $('#scope').value = '';
  $('#preview').innerHTML = '';
}

$('#typeGrid').addEventListener('click', e => {
  const chip = e.target.closest('.type-chip');
  if (!chip) return;
  selectedType = chip.dataset.t;
  renderTypeGrid(); update();
});
['#diff','#scope','#emoji'].forEach(s => $(s).addEventListener('input', update));
$('#emoji').addEventListener('change', update);

renderTypeGrid();

$('#toolbar').innerHTML = `
  <button class="gz-btn" onclick="copy()">${t('copy')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="autoDetect()">${t('suggest')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="loadExample()">${t('example')}</button>
  <button class="gz-btn gz-btn-secondary" onclick="clearAll()">${t('clear')}</button>`;

GZ.renderToolPage({

  titleKey: 'toolTitle',
  descKey: 'toolDesc',

    {icon:'⚙️', href:'/dev/github-actions-generator.html', name:'GitHub Actions'},
    {icon:'📊', href:'/dev/git-diff-changelog.html', name:'Diff Changelog'},
    {icon:'📜', href:'/dev/git-commands.html', name:'Git Commands'},
  ]
});
</script>
