<script>
GZI18n.register({
  en: {

    lblStyle: '选择风格',
    lblName: '你的账号名 / 品牌',
    stylePOV: '🫶 POV',
    styleSoft: '🌸 温柔',
    styleBrat: '💋 拽姐',
    styleAcademia: '📚 学院风',
    styleFunny: '😂 搞笑',
    styleAesthetic: '✨ 唯美',
    styleMinimal: '🤍 极简',
    lblIn: '你的简介（可编辑）',
    lblOut: '预览',
    step1: '从上方选择一个 TikTok 简介风格',
    step2: '输入你的账号名或品牌名以个性化',
    step3: '编辑简介文本 — 添加 Emoji、话题标签或链接',
    step4: '复制简介并粘贴到你的 TikTok 个人资料',
    copied: '已复制到剪贴板',
  }
});

const { $, copyText, showToast, t } = GZ;

const templates = {
  pov: [
    '🫶 POV: you found me\n🪩 {name}\n💫 main character energy',
    '💌 POV: it\'s your sign\n✨ {name}\n🫀 soft launch era',
    '🤍 POV: we\'re the same person\n🌙 {name}\n☁️ lowkey obsessed',
  ],
  soft: [
    '🌸 soft girl era\n☁️ {name}\n🌷 healing journey\n🤍 peace & quiet',
    '🫧 bubble tea & journaling\n🌿 {name}\n🦋 in my soft life\n🌙 slow mornings',
    '🍃 cozy soul\n☕ {name}\n📖 books, candles, rain\n🤍 take care of yourself',
  ],
  brat: [
    '💋 brat mode: ON\n😈 {name}\n💅 don\'t talk to me\n🖤 expensive taste',
    '🪩 mean girl aesthetic\n💋 {name}\n🚫 not for everyone\n💎 boss behavior',
    '🔥 unapologetically me\n💅 {name}\n🖤 kiss me or lose me\n💋 unavailable',
  ],
  academia: [
    '📚 dark academia\n🕯️ {name}\n☕ libraries & lattes\n🖋️ poetry hoarder',
    '🕯️ romanticize your life\n📖 {name}\n🖋️ candles & classics\n🤎 slow living',
    '🪶 overthinking & literature\n🤎 {name}\n☕ rainy day scholar\n📜 soft & studious',
  ],
  funny: [
    '🧠 brain: empty\n🎵 {name}\n🍕 powered by snacks\n🐸 send help',
    '📱 1% battery 100% vibes\n🤡 {name}\n🍟 will dance for food\n💀 professionally unserious',
    '🛏️ chronic napper\n🤪 {name}\n🍕 vibes > grades\n🪩 main character (only on weekends)',
  ],
  aesthetic: [
    '🌙 chasing golden hours\n✨ {name}\n🪩 soft launch\n💫 living in poetry',
    '🌸 fairycore but make it real\n🦋 {name}\n🕯️ candles & daydreams\n✨ just a vibe',
    '🌿 healing out loud\n🌷 {name}\n🫶 soft era\n🤍 keep it cute',
  ],
  minimal: [
    '{name}\n🪩\n🤍',
    '{name} | 📍\n\n─ ─ ─',
    '{name}\n.\n.',
  ],
};

const styles = [
  {key:'pov', icon:'stylePOV'},
  {key:'soft', icon:'styleSoft'},
  {key:'brat', icon:'styleBrat'},
  {key:'academia', icon:'styleAcademia'},
  {key:'funny', icon:'styleFunny'},
  {key:'aesthetic', icon:'styleAesthetic'},
  {key:'minimal', icon:'styleMinimal'},
];

let currentStyle = 'pov';
let lastTpl = '';

function buildTemplates() {
  const container = $('#templates');
  container.innerHTML = '';
  styles.forEach(s => {
    const btn = document.createElement('div');
    btn.className = 'bio-tpl' + (s.key === currentStyle ? ' active' : '');
    btn.textContent = t(s.icon);
    btn.onclick = () => { currentStyle = s.key; loadTemplate(); buildTemplates(); };
    container.appendChild(btn);
  });
}

function loadTemplate() {
  const list = templates[currentStyle] || templates.pov;
  let tpl = list[Math.floor(Math.random() * list.length)];
  // Avoid showing same template twice in a row
  let tries = 0;
  while (tpl === lastTpl && tries < 4 && list.length > 1) {
    tpl = list[Math.floor(Math.random() * list.length)];
    tries++;
  }
  lastTpl = tpl;
  const name = $('#nameInput').value || '{name}';
  $('#input').value = tpl.replace(/\{name\}/g, name);
  updatePreview();
}

function updatePreview() {
  const text = $('#input').value;
  $('#preview').textContent = text || '—';
  // char counter — TikTok limit is 80
  const len = text.length;
  const cc = $('#charCount');
  cc.textContent = len + ' / 80';
  cc.classList.toggle('over', len > 80);
}

$('#input').addEventListener('input', updatePreview);
$('#nameInput').addEventListener('input', () => {
  const name = $('#nameInput').value || '{name}';
  const list = templates[currentStyle] || templates.pov;
  const tpl = list[Math.floor(Math.random() * list.length)];
  $('#input').value = tpl.replace(/\{name\}/g, name);
  updatePreview();
});

buildTemplates();
loadTemplate();

$('#toolbar').innerHTML = `
  <button class="gz-btn" onclick="loadTemplate()">🔄 Generate New</button>
  <button class="gz-btn" onclick="copyText($('#input').value)">📋 Copy Bio</button>
  <button class="gz-btn gz-btn-secondary" onclick="$('#input').value='';updatePreview()">${t('clear')||'Clear'}</button>`;

GZ.renderToolPage({
  category: 'social',
  titleKey: 'toolTitle',
  descKey: 'toolDesc',
  howToSteps: ['step1','step2','step3','step4'],

    {icon:'🐦', href:'/social/twitter-bio.html', name:'Twitter / X Bio Generator'},

    {icon:'🏷️', href:'/text/hashtag-generator.html', name:'Hashtag Generator'},
  ]
});
</script>
